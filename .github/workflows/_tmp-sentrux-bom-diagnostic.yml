name: Temporary BOM Sentrux diagnostic
on:
  push:
    branches: ['agent/alumdoor-bom-template-resolver']
    paths:
      - '.github/workflows/_tmp-sentrux-bom-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Sentrux
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
      - name: Compare branch and main under identical Sentrux
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/forge-main origin/main
          : > /tmp/compare.txt
          for spec in "PR:$GITHUB_WORKSPACE" "MAIN:/tmp/forge-main"; do
            label=${spec%%:*}
            dir=${spec#*:}
            set +e
            (cd "$dir" && sentrux check .) > "/tmp/${label}-check.log" 2>&1
            check_status=$?
            (cd "$dir" && sentrux gate --save .) > "/tmp/${label}-gate.log" 2>&1
            gate_status=$?
            set -e
            quality=$(grep -E 'Quality:' "/tmp/${label}-gate.log" | tail -1 || true)
            violation=$(grep -E 'min_quality|violation|boundary|cycle|circular' "/tmp/${label}-check.log" | tail -8 || true)
            {
              echo "[$label] check_exit=$check_status gate_exit=$gate_status $quality"
              echo "$violation"
            } >> /tmp/compare.txt
          done
          clean=$(cat /tmp/compare.txt)
          safe=${clean//'%'/'%25'}
          safe=${safe//$'\r'/'%0D'}
          safe=${safe//$'\n'/'%0A'}
          echo "::notice title=Sentrux PR vs main::$safe"
