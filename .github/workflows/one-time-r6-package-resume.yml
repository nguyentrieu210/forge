name: One-time R6 Package Resume
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-r6-package-resume.yml"]
permissions:
  contents: write
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      TARGET_SHA: cda08faf3b2d0af5e5582f8f3b8e737cc44d92b2
      TENANT: alu
      ORIGIN: https://alu.kairo.vn
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TARGET_SHA }}", persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: HRM provision and install
        id: hrm
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          admin="${FORGE_ADMIN_USER:-Administrator}"
          node server/scripts/forge-app.mjs server/apps-src/hrm --origin "$ORIGIN" --admin "$admin" --provision-standard 2>&1 | tee "$RUNNER_TEMP/hrm.log"
      - name: VN Accounting install
        id: accounting
        if: steps.hrm.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          admin="${FORGE_ADMIN_USER:-Administrator}"
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting --origin "$ORIGIN" --admin "$admin" 2>&1 | tee "$RUNNER_TEMP/accounting.log"
      - name: Alumdoor install
        id: alumdoor
        if: steps.hrm.outcome == 'success' && steps.accounting.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          admin="${FORGE_ADMIN_USER:-Administrator}"
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --origin "$ORIGIN" --admin "$admin" 2>&1 | tee "$RUNNER_TEMP/alumdoor.log"
      - name: Record package resume outcome and sanitized diagnostics
        if: always()
        uses: actions/github-script@v7
        env:
          O_HRM: ${{ steps.hrm.outcome }}
          O_ACCOUNTING: ${{ steps.accounting.outcome }}
          O_ALUMDOOR: ${{ steps.alumdoor.outcome }}
        with:
          script: |
            const fs=require('fs'),path=require('path');
            const clean=(name)=>{
              const file=path.join(process.env.RUNNER_TEMP,`${name}.log`); if(!fs.existsSync(file)) return [];
              let text=fs.readFileSync(file,'utf8');
              for(const secret of [process.env.FORGE_ADMIN_PASSWORD,process.env.CLOUDFLARE_API_TOKEN]) if(secret) text=text.split(secret).join('[REDACTED]');
              text=text.replace(/(authorization|cookie|set-cookie|x-frappe-csrf-token)\s*[:=]\s*[^\s]+/ig,'$1=[REDACTED]');
              const lines=text.split(/\r?\n/).filter(Boolean);
              const relevant=lines.filter(line=>/(error|failed|http\s*\d{3}|417|422|409|403|401|missing|required|dependency|doctype|external|fiscal year|salary component|expense claim|bank account|validation|package|provision|install)/i.test(line));
              return (relevant.length?relevant:lines).slice(-60).map(line=>line.slice(0,800));
            };
            const outcomes={hrm:process.env.O_HRM||'not-run',accounting:process.env.O_ACCOUNTING||'not-run',alumdoor:process.env.O_ALUMDOOR||'not-run'};
            const payload={format:'forge-r6-package-resume/v2',candidate_sha:process.env.TARGET_SHA,observed_at:new Date().toISOString(),outcomes,diagnostics:{hrm:clean('hrm'),accounting:clean('accounting'),alumdoor:clean('alumdoor')},status:Object.values(outcomes).every(x=>x==='success')?'PASS':'BLOCKED'};
            const p=`deploy-evidence/r6-package-resume-${process.env.TARGET_SHA.slice(0,12)}.json`; let sha;
            try{const r=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:'main'});sha=r.data.sha}catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:p,message:`ops(r6): record package resume ${payload.status}`,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),branch:'main',...(sha?{sha}:{})});
      - name: Enforce package convergence
        if: always()
        run: |
          test '${{ steps.hrm.outcome }}' = success
          test '${{ steps.accounting.outcome }}' = success
          test '${{ steps.alumdoor.outcome }}' = success
