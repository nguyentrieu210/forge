name: TMP R6 Alumdoor 2.2.4 Package Relock

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-r6-alumdoor-package-relock.yml"

permissions:
  contents: read

concurrency:
  group: r6-alumdoor-package-relock
  cancel-in-progress: false

jobs:
  relock:
    if: github.head_ref == 'ops/r6-alumdoor-2.2.4-package-relock-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SOURCE_SHA: 1f7ca95760998c4ab30bdf6c9870647f5ee2938f
      EXPECTED_RELEASE_SHA: 3999c2929053f11d4f1c5b59ccc2f0934446b750
      EXPECTED_BUNDLE_HASH: 05c918e048271583
      TENANT: alu
      ORIGIN: https://alu.kairo.vn
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVIDENCE_DIR: /tmp/r6-alumdoor-package-relock

    steps:
      - name: Checkout relock trigger branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove source and deployed release ancestry; reject package-authority drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git fetch --no-tags origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git cat-file -e "$EXPECTED_RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          drift="$(git diff --name-only "$SOURCE_SHA"..origin/main -- \
            'server/briefs/alumdoor-v2.json' \
            'server/briefs/alumdoor-v2.*.json' \
            'server/scripts/lib/compile-brief-app-factory.mjs' \
            'server/scripts/lib/read-brief-source.mjs' \
            'server/packages/app-registry/src/installer.ts' \
            'server/scripts/r6-convergence-identity-readonly.mjs')"
          test -z "$drift" || { echo "Package/relock authority moved after SOURCE_SHA:"; echo "$drift"; exit 1; }
          printf 'source_sha=%s\ndeployed_release_sha=%s\nexpected_bundle_hash=%s\ncurrent_main=%s\nauthority_drift=none\n' \
            "$SOURCE_SHA" "$EXPECTED_RELEASE_SHA" "$EXPECTED_BUNDLE_HASH" "$(git rev-parse origin/main)" > "$EVIDENCE_DIR/state.txt"

      - name: Checkout exact merged relock source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git clean -fdx

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build CloudForge for canonical package hashing
        run: pnpm --filter cloudforge run build

      - name: Compile, validate and hash exact Alumdoor package
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run | tee "$EVIDENCE_DIR/package-dry-run.log"
          node --input-type=module <<'NODE' > "$EVIDENCE_DIR/source-package.json"
          import { readBriefSource } from './server/scripts/lib/read-brief-source.mjs';
          import { compileBrief } from './server/scripts/lib/compile-brief-app-factory.mjs';
          import { sha256Hex } from './server/dist/packages/core/src/index.js';
          const brief = await readBriefSource('./server/briefs/alumdoor-v2.json');
          const pkg = compileBrief(brief);
          const content_hash = await sha256Hex(pkg);
          process.stdout.write(JSON.stringify({ app_id: pkg.id, version: pkg.version, content_hash, doctypes: pkg.doctypes.length, nav: pkg.nav.length }, null, 2));
          NODE
          source_version="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.version)" "$EVIDENCE_DIR/source-package.json")"
          source_hash="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.content_hash)" "$EVIDENCE_DIR/source-package.json")"
          test "$source_version" = "2.2.4"
          grep -Fq "app=alumdoor@${source_version}" "$EVIDENCE_DIR/package-dry-run.log"
          grep -Fq 'DRY_RUN_PASS alumdoor' "$EVIDENCE_DIR/package-dry-run.log"
          printf 'SOURCE_PACKAGE_VERSION=%s\nSOURCE_PACKAGE_HASH=%s\n' "$source_version" "$source_hash" >> "$GITHUB_ENV"
          printf 'source_package_version=%s\nsource_package_hash=%s\n' "$source_version" "$source_hash" >> "$EVIDENCE_DIR/state.txt"

      - name: Assert current live release marker remains the deployed UI/Worker identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$EVIDENCE_DIR/release-marker.json"
          const response = await fetch(`${process.env.ORIGIN}/release.json`, { redirect: 'error' });
          if (response.status !== 200) throw new Error(`release marker HTTP ${response.status}`);
          const body = await response.json();
          const release_sha = String(body.releaseSha ?? body.deployedSha ?? '');
          const bundle_hash = String(body.bundleHash ?? '');
          if (release_sha !== process.env.EXPECTED_RELEASE_SHA) throw new Error(`release SHA drift: ${release_sha}`);
          if (bundle_hash !== process.env.EXPECTED_BUNDLE_HASH) throw new Error(`bundle hash drift: ${bundle_hash}`);
          process.stdout.write(JSON.stringify({ release_sha, bundle_hash, http_status: response.status }, null, 2));
          NODE
          printf 'release_marker=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Run E18 against actual deployed release and expected package version
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/r6-convergence-identity-readonly.mjs \
            --tenant "$TENANT" \
            --origin "$ORIGIN" \
            --expected-release-sha "$EXPECTED_RELEASE_SHA" \
            --expected-alumdoor-version "$SOURCE_PACKAGE_VERSION" \
            --output "$EVIDENCE_DIR/e18.json" | tee "$EVIDENCE_DIR/e18.log"

      - name: Assert package hash, capability profile and release identity converge
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$EVIDENCE_DIR/relock-result.json"
          import { readFileSync } from 'node:fs';
          const e18 = JSON.parse(readFileSync(`${process.env.EVIDENCE_DIR}/e18.json`, 'utf8'));
          const alumdoor = e18.packages.find(x => x.app_id === 'alumdoor');
          if (e18.status !== 'PASS' || e18.blockers.length) throw new Error(`E18 not PASS: ${e18.blockers.join(',')}`);
          if (!alumdoor) throw new Error('Alumdoor package missing');
          if (alumdoor.version !== process.env.SOURCE_PACKAGE_VERSION) throw new Error('package version mismatch');
          if (alumdoor.content_hash !== process.env.SOURCE_PACKAGE_HASH) throw new Error(`package hash mismatch live=${alumdoor.content_hash} source=${process.env.SOURCE_PACKAGE_HASH}`);
          if (e18.release.release_sha !== process.env.EXPECTED_RELEASE_SHA) throw new Error('release SHA mismatch');
          if (e18.release.bundle_hash !== process.env.EXPECTED_BUNDLE_HASH) throw new Error('bundle hash mismatch');
          if (!e18.capability_profile || e18.capability_profile.profile_id !== 'alumdoor-pilot' || e18.capability_profile.valid === false || e18.capability_profile.blocked_capabilities.length) throw new Error('capability profile invalid');
          process.stdout.write(JSON.stringify({
            schema: 'forge-r6-alumdoor-package-relock/v1',
            observed_at: e18.observed_at,
            source_sha: process.env.SOURCE_SHA,
            deployed_release_sha: e18.release.release_sha,
            bundle_hash: e18.release.bundle_hash,
            alumdoor: { version: alumdoor.version, content_hash: alumdoor.content_hash },
            capability_profile: e18.capability_profile,
            status: 'PASS',
            mutation: 'NONE'
          }, null, 2));
          NODE
          printf 'e18=pass\npackage_hash=pass\ncapability_profile=pass\nrelock=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Upload relock evidence
        uses: actions/upload-artifact@v4
        with:
          name: r6-alumdoor-package-relock-${{ github.run_id }}
          path: /tmp/r6-alumdoor-package-relock/
          if-no-files-found: error
          retention-days: 30
