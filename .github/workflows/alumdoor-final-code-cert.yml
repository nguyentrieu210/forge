name: Alumdoor final code certification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Server build and canonical metadata
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run brief:check

      - name: Audit canonical aluminium stock navigation
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const brief = JSON.parse(readFileSync("briefs/alumdoor-v2.json", "utf8"));
          const rx = /(tồn.*nhôm|nhôm.*tồn|aluminium\s+lot|stock.*length|length.*stock)/iu;
          const nav = brief.navigation?.items ?? [];
          const navMatches = nav.filter((entry) => rx.test(typeof entry === "string" ? entry : JSON.stringify(entry)));
          const links = (brief.links ?? []).filter((entry) => rx.test(JSON.stringify(entry)));
          const reports = (brief.reports ?? []).filter((entry) => rx.test(JSON.stringify(entry)));
          console.log(`ALUMINIUM_STOCK_NAV=${JSON.stringify(navMatches)}`);
          console.log(`ALUMINIUM_STOCK_LINKS=${JSON.stringify(links)}`);
          console.log(`ALUMINIUM_STOCK_REPORTS=${JSON.stringify(reports)}`);
          if (navMatches.length !== 1 || navMatches[0] !== "report:Tồn nhôm theo khổ") throw new Error("Aluminium stock navigation is not canonical");
          if (links.length !== 1 || links[0]?.report !== "Tồn nhôm theo khổ") throw new Error("Aluminium stock link is not canonical");
          const generator = readFileSync("scripts/build-alumdoor-v2-brief.mjs", "utf8");
          if (!generator.includes('Báo cáo "Tồn nhôm theo khổ" đọc Batch + sổ kho')) throw new Error("Canonical Stock Ledger/Batch ownership note missing");
          if (!generator.includes("XOÁ doctype: Aluminium Lot, Aluminium Cut")) throw new Error("Legacy aluminium lot doctypes are not explicitly retired");
          console.log("ALUMINIUM_STOCK_CANONICAL_SOURCE_PASS");
          NODE

      - name: Focused manufacturing closure
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.test.mjs' | grep -Ei '(manufactur|production|work-order|cut-order|bom|job-card)' | sort)
          echo "MANUFACTURING_TEST_FILES=${#tests[@]}"
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
          echo MANUFACTURING_CLOSURE_SLICE_PASS

      - name: Focused print contract
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.test.mjs' | grep -Ei '(print|pdf|a4)' | sort)
          echo "PRINT_TEST_FILES=${#tests[@]}"
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
          echo PRINT_CONTRACT_SLICE_PASS

      - name: Focused accounting and transaction closure
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.test.mjs' | grep -Ei '(transaction.*closure|reconcil|receivable|payable|payment|general-ledger|accounting|stock-ledger)' | sort)
          echo "ACCOUNTING_CLOSURE_TEST_FILES=${#tests[@]}"
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
          echo ACCOUNTING_TRANSACTION_CLOSURE_SLICE_PASS

      - name: Build client dependency closure for server regression
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          pnpm --filter @metaforge/views... run build

      - name: Full server regression
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          pnpm test:unit
          echo FULL_SERVER_REGRESSION_PASS

      - name: Diagnose app install contract before lint
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          find . -type f -name 'useAppInstall.ts' -print
          while IFS= read -r f; do
            echo "=== $f 160-205 ==="
            nl -ba "$f" | sed -n '160,205p'
          done < <(find . -type f -name 'useAppInstall.ts')
          grep -RniE 'method: string; args: Record<string, unknown>|install_app|uninstall_app' packages apps | head -160 || true

      - name: Client build lint and selfchecks
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          pnpm --filter @metaforge/views... run build
          pnpm run lint
          pnpm run test
          pnpm run product:check
          node --test packages/views/tests/form-view-metadata-purity.test.mjs packages/views/tests/metadata-child-grid-runtime.test.mjs packages/views/tests/child-grid-presentation.test.mjs
          echo CLIENT_RUNTIME_CONTRACT_PASS

      - name: Browser UX and responsive visual smoke
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          pnpm --filter @metaforge/demo exec playwright install --with-deps chromium
          pnpm --filter @metaforge/demo run e2e
          echo PLAYWRIGHT_RESPONSIVE_UX_PASS

      - name: Report bundle footprint
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          pnpm --filter @metaforge/demo run build
          largest=$(find apps/demo/dist -type f -name '*.js' -printf '%s\n' | sort -nr | head -1)
          test -n "$largest"
          echo "LARGEST_DEMO_JS_BYTES=$largest"
          test "$largest" -le 2097152
          echo CLIENT_BUNDLE_BUDGET_PASS
