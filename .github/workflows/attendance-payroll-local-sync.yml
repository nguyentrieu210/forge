name: Attendance payroll local dev 5173

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/attendance-payroll-local-sync.yml"]

jobs:
  launch:
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - name: Launch verified attendance payroll runtime on 5173
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-LastExit([string]$label) { if ($LASTEXITCODE -ne 0) { throw "$label failed with exit code $LASTEXITCODE" } }
          $repo = 'C:\alumdoor'
          $worktree = 'C:\forge-attendance-payroll'
          $target = 'feature/attendance-payroll'
          $port = 5173
          $devDir = 'C:\forge-attendance-payroll-dev'
          $stdout = Join-Path $devDir '5173.out.log'
          $stderr = Join-Path $devDir '5173.err.log'
          if (-not (Test-Path $worktree)) { throw 'attendance payroll worktree missing' }
          $branch = (git -C $worktree branch --show-current).Trim()
          if ($branch -ne $target) { throw "attendance worktree is on $branch instead of $target" }
          git -C $repo fetch origin $target --prune
          Assert-LastExit 'fetch attendance payroll feature'
          $dirty = git -C $worktree status --porcelain --untracked-files=all
          if ($dirty) { throw "attendance payroll worktree must be clean before local dev launch:`n$dirty" }
          git -C $worktree merge --ff-only "origin/$target"
          Assert-LastExit 'fast-forward attendance payroll worktree'
          $existing = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($existing) {
            $proc = Get-CimInstance Win32_Process -Filter "ProcessId=$($existing.OwningProcess)" -ErrorAction SilentlyContinue
            $cmdline = if ($proc) { [string]$proc.CommandLine } else { '' }
            Write-Host "PORT_5173_ALREADY_LISTENING_PID=$($existing.OwningProcess)"
            Write-Host "PORT_5173_COMMAND=$cmdline"
            if ($cmdline -match 'forge-attendance-payroll' -and $cmdline -match 'vite') {
              $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5173/' -TimeoutSec 10
              if ($response.StatusCode -ne 200) { throw "existing dev server returned HTTP $($response.StatusCode)" }
              Write-Host 'ATTENDANCE_PAYROLL_5173_READY'
              exit 0
            }
            throw "Port 5173 is already occupied by an unrelated process (PID $($existing.OwningProcess)); refusing to kill it"
          }
          $clientNodeModules = Join-Path $worktree 'client\node_modules'
          $cachedClientNodeModules = Join-Path $repo 'client\node_modules'
          if (-not (Test-Path (Join-Path $clientNodeModules '.bin\vite.cmd'))) {
            if (-not (Test-Path (Join-Path $cachedClientNodeModules '.bin\vite.cmd'))) { throw 'client dependency cache is missing' }
            if (Test-Path $clientNodeModules) { Remove-Item $clientNodeModules -Force -Recurse }
            cmd /c "mklink /J `"$clientNodeModules`" `"$cachedClientNodeModules`""
            Assert-LastExit 'client node_modules junction'
          }
          New-Item -ItemType Directory -Force -Path $devDir | Out-Null
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          [Environment]::SetEnvironmentVariable('RUNNER_TRACKING_ID', '', 'Process')
          $args = '/d /s /c "cd /d C:\forge-attendance-payroll && pnpm --dir client --filter runtime dev -- --host 0.0.0.0 --port 5173 --strictPort"'
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList $args -WorkingDirectory $worktree -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden -PassThru
          Write-Host "DEV_LAUNCHER_PID=$($process.Id)"
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5173/' -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { if ($process.HasExited) { break } }
          }
          if (-not $ready) {
            if (Test-Path $stdout) { Get-Content $stdout -Tail 120 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 120 }
            throw 'attendance payroll Vite server did not become ready on 5173'
          }
          $listener = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction Stop | Select-Object -First 1
          Write-Host "ATTENDANCE_BRANCH=$branch"
          Write-Host "ATTENDANCE_HEAD=$((git -C $worktree rev-parse HEAD).Trim())"
          Write-Host "PORT_5173_PID=$($listener.OwningProcess)"
          Write-Host 'LOCAL_URL=http://127.0.0.1:5173/'
          Write-Host 'ATTENDANCE_PAYROLL_5173_READY'
