name: Sentrux post-collapse health

on:
  push:
    branches:
      - agent/sentrux-convergence-20260816

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
          sentrux --version
      - name: Gate snapshot
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/gate.txt
      - name: MCP scan and health snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, select, subprocess, time
          p = subprocess.Popen(["sentrux", "--mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)
          def send(x):
              p.stdin.write(json.dumps(x, separators=(",", ":")) + "\n"); p.stdin.flush()
          def recv(i, timeout=45):
              deadline=time.time()+timeout
              while time.time()<deadline:
                  ready,_,_=select.select([p.stdout],[],[],max(0,deadline-time.time()))
                  if not ready: break
                  line=p.stdout.readline()
                  if not line: break
                  try: m=json.loads(line)
                  except Exception: continue
                  if m.get("id")==i: return m
              raise RuntimeError(f"timeout waiting for {i}")
          def args_for(tool):
              schema=tool.get("inputSchema",{})
              props=schema.get("properties",{})
              required=schema.get("required",[])
              args={}
              for k in ("path","root","project_path","directory"):
                  if k in props: args[k]="."; break
              for k in required:
                  if k in args: continue
                  typ=props.get(k,{}).get("type")
                  args[k] = "." if typ=="string" else False if typ=="boolean" else [] if typ=="array" else {}
              return args
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"forge-post-collapse","version":"1"}}})
          recv(1)
          send({"jsonrpc":"2.0","method":"notifications/initialized","params":{}})
          send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}})
          tools=recv(2).get("result",{}).get("tools",[])
          by_name={t.get("name"):t for t in tools}
          scan=by_name.get("scan")
          health=by_name.get("health")
          if not scan or not health: raise RuntimeError("scan/health tool missing")
          send({"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"scan","arguments":args_for(scan)}})
          print("MCP_SCAN", json.dumps(recv(3), separators=(",", ":")))
          send({"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"health","arguments":args_for(health)}})
          print("MCP_HEALTH", json.dumps(recv(4), separators=(",", ":")))
          p.kill()
          PY
