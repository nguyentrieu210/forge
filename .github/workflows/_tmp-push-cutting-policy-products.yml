name: Temporary Push Cutting Policy Products
on:
  push:
    branches: ['fix/alumdoor-cutting-policy-geometry-rules']
    paths: ['.github/workflows/_tmp-push-cutting-policy-products.yml']
permissions:
  contents: write
jobs:
  push-products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Materialize and verify
        run: |
          set -euo pipefail
          node server/scripts/_tmp-materialize-cutting-policy-geometry.mjs
          cd server
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          node --test tests/alumdoor-cutting-policy-geometry.test.mjs
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
      - name: Commit only product files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/scripts/lib/alumdoor-cutting-policy-catalog.mjs server/apps-src/alumdoor-worker/src/geometry-policy.ts server/tests/alumdoor-cutting-policy-geometry.test.mjs server/scripts/build-alumdoor-v2-brief.mjs server/briefs/alumdoor-v2.json
          git commit -m 'feat(alumdoor): lock geometry-driven Cutting Policy'
          git push origin HEAD:fix/alumdoor-cutting-policy-geometry-rules
