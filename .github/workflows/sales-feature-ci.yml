name: Sales Feature CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'server/apps-src/alumdoor-worker/src/sales-*'
      - 'server/apps-src/alumdoor-worker/src/door-formulas.ts'
      - 'server/apps-src/alumdoor-worker/src/index.ts'
      - 'server/packages/clouderp-pricing/**'
      - 'server/briefs/alumdoor*.json'
      - 'server/tests/sales-*'
      - 'server/tests/door-formulas*'
      - 'client/packages/views/src/form/ChildGrid.tsx'
      - 'client/e2e-forge/**/sales*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-feature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-gates:
    name: Sales feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter cloudforge run build

      - name: Run focused Sales regressions
        run: |
          node --test \
            server/tests/door-formulas.test.mjs \
            server/tests/sales-production-flow.test.mjs \
            server/tests/sales-price-unicode-normalization.test.mjs

      - name: Validate Alumdoor briefs
        run: |
          pnpm --dir server exec node scripts/forge-app.mjs briefs/alumdoor.json --dry-run
          pnpm --dir server exec node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
