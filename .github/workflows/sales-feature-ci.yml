name: Sales Feature CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-gates:
    name: Sales feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter cloudforge run build

      - name: Run focused Sales regressions
        run: |
          node --test \
            server/tests/door-formulas.test.mjs \
            server/tests/sales-production-flow.test.mjs \
            server/tests/sales-price-unicode-normalization.test.mjs

      - name: Validate Alumdoor briefs
        run: |
          pnpm --dir server exec node scripts/forge-app.mjs briefs/alumdoor.json --dry-run
          pnpm --dir server exec node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
