name: Sales Feature CI

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sales-feature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect sales scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Classify changed files
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const shared = [
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'server/package.json',
              '.github/workflows/sales-feature-ci.yml',
            ];
            const salesPatterns = [
              /sales/i,
              /quotation/i,
              /customer/i,
              /item-price/i,
              /price-list/i,
              /^server\/apps-src\/alumdoor-worker\//,
              /^client\/packages\/views\//,
            ];
            const run = files.some(({ filename }) =>
              shared.includes(filename) || salesPatterns.some((pattern) => pattern.test(filename))
            );
            core.info(`Sales scope: ${run}; files: ${files.map((file) => file.filename).join(', ')}`);
            core.setOutput('run', String(run));

  focused-gates:
    name: Sales feature gates
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server unit tests
        shell: bash
        run: |
          set +e
          pnpm --dir server run test:unit > /tmp/server-unit.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- failing test context ---'
            grep -n -B 12 -A 36 -E 'not ok|AssertionError|ERR_ASSERTION|testCodeFailure' /tmp/server-unit.log || true
            echo '--- end failing test context ---'
          fi
          tail -n 240 /tmp/server-unit.log
          exit $status

      - name: Upload unit-test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sales-server-unit-log-${{ github.run_id }}
          path: /tmp/server-unit.log
          if-no-files-found: error
          retention-days: 7

      - name: Server SQL tests
        shell: bash
        run: |
          set +e
          pnpm --dir server run test:sql > /tmp/server-sql.log 2>&1
          status=$?
          tail -n 240 /tmp/server-sql.log
          exit $status

      - name: Alumdoor brief check
        shell: bash
        run: |
          set +e
          pnpm --dir server exec node scripts/forge-app.mjs briefs/alumdoor.json --dry-run > /tmp/alumdoor-brief.log 2>&1
          status=$?
          tail -n 240 /tmp/alumdoor-brief.log
          exit $status

      - name: Client tests
        shell: bash
        run: |
          set +e
          pnpm run client:test > /tmp/client-test.log 2>&1
          status=$?
          tail -n 240 /tmp/client-test.log
          exit $status

      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/typecheck.log 2>&1
          status=$?
          tail -n 240 /tmp/typecheck.log
          exit $status

      - name: Build
        shell: bash
        run: |
          set +e
          pnpm build > /tmp/build.log 2>&1
          status=$?
          tail -n 240 /tmp/build.log
          exit $status
