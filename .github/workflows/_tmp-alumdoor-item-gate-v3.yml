name: Temporary Alumdoor Item Gate V3

on:
  push:
    branches: ['agent/alumdoor-bom-realdata-continuation']
    paths: ['.github/workflows/_tmp-alumdoor-item-gate-v3.yml']

permissions:
  contents: read

jobs:
  item-gate:
    runs-on: [self-hosted]
    timeout-minutes: 45
    steps:
      - name: Prepare isolated feature worktree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='C:\alumdoor'
          $feature="C:\alumdoor-worktrees\bom-item-gate-$env:GITHUB_RUN_ID"
          if ((git -C $target rev-parse --abbrev-ref HEAD).Trim() -ne 'main') { throw 'Local runtime checkout must remain on main.' }
          $dirty=@(git -C $target status --porcelain=v1 --untracked-files=all | Where-Object { $_ -notmatch '^\?\? local-imports/' })
          if ($dirty.Count -gt 0) { $dirty | ForEach-Object { Write-Host "DIRTY $_" }; throw 'Unexpected local source changes.' }
          git -C $target fetch origin main 'agent/alumdoor-bom-realdata-continuation' --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          git -C $target merge --ff-only origin/main
          if ($LASTEXITCODE -ne 0) { throw 'local main fast-forward failed' }
          if ((git -C $target rev-parse HEAD).Trim() -ne (git -C $target rev-parse origin/main).Trim()) { throw 'local main != origin/main' }
          if (Test-Path $feature) { throw "Unexpected temp worktree $feature" }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $feature) | Out-Null
          git -C $target worktree add --detach $feature $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'feature worktree add failed' }
          Write-Host "LOCAL_MAIN=$((git -C $target rev-parse HEAD).Trim())"
          Write-Host "FEATURE_SHA=$env:GITHUB_SHA"

      - name: Prove guarded classification and UOM gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='C:\alumdoor'
          $feature="C:\alumdoor-worktrees\bom-item-gate-$env:GITHUB_RUN_ID"
          $payload=Join-Path $target 'local-imports\alumdoor-item-master-payload.json'
          if (-not (Test-Path $payload)) { throw 'Canonical Item payload missing; rebuild workflow must run first.' }
          Set-Location (Join-Path $feature 'server')
          & node scripts\test-alumdoor-item-stock-uom-reconcile.mjs
          if ($LASTEXITCODE -ne 0) { throw 'reconcile test failed' }
          $p=Get-Content -Raw $payload | ConvertFrom-Json
          Write-Host "ITEM_PAYLOAD_COUNT=$($p.item_count)"
          if ([int]$p.item_count -ne 587) { throw "Unexpected canonical payload count $($p.item_count)" }
          $env:FORGE_ORIGIN='http://127.0.0.1:8799';$env:FORGE_ADMIN_USER='dev@example.com';$env:FORGE_ADMIN_PASSWORD='local-dev-password-1'
          try {
            Set-Location (Join-Path $target 'server')
            $uom=Join-Path $target "local-backups\item-master-imports\uom-v3-$env:GITHUB_RUN_ID.json"
            & node scripts\backup-alumdoor-uom-local.mjs $uom
            if ($LASTEXITCODE -ne 0) { throw 'UOM backup failed' }
            $r=Get-Content -Raw $uom | ConvertFrom-Json
            Write-Host "UOM_CANONICAL=$($r.canonical_count) UOM_EXISTING=$($r.existing_count)"
            if ([int]$r.canonical_count -ne 19 -or [int]$r.existing_count -ne 19) { throw '19-UOM gate failed' }
          } finally { Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue }

      - name: Dry-run then reconcile exact legacy finished-door UOMs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='C:\alumdoor';$feature="C:\alumdoor-worktrees\bom-item-gate-$env:GITHUB_RUN_ID"
          $payload=Join-Path $target 'local-imports\alumdoor-item-master-payload.json'
          $runDir=Join-Path $target "local-backups\item-master-imports\reconcile-v3-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          $env:FORGE_ORIGIN='http://127.0.0.1:8799';$env:FORGE_ADMIN_USER='dev@example.com';$env:FORGE_ADMIN_PASSWORD='local-dev-password-1'
          try {
            Set-Location (Join-Path $feature 'server')
            & node scripts\reconcile-alumdoor-item-stock-uom-local.mjs $payload --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'reconcile dry-run failed' }
            & node scripts\reconcile-alumdoor-item-stock-uom-local.mjs $payload (Join-Path $runDir 'preimage.json')
            if ($LASTEXITCODE -ne 0) { throw 'reconcile apply failed' }
          } finally { Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue }
          Write-Host "RECONCILE_RUN_DIR=$runDir"

      - name: Import canonical Items twice
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='C:\alumdoor';$payload=Join-Path $target 'local-imports\alumdoor-item-master-payload.json'
          $runDir=Join-Path $target "local-backups\item-master-imports\item-v3-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          $env:FORGE_ORIGIN='http://127.0.0.1:8799';$env:FORGE_ADMIN_USER='dev@example.com';$env:FORGE_ADMIN_PASSWORD='local-dev-password-1'
          try {
            Set-Location (Join-Path $target 'server')
            & node scripts\import-alumdoor-item-master-local.mjs $payload --validate-only
            if ($LASTEXITCODE -ne 0) { throw 'Item validate-only failed' }
            & node scripts\import-alumdoor-item-master-local.mjs $payload (Join-Path $runDir 'first-preimage.json')
            if ($LASTEXITCODE -ne 0) { throw 'Item first import failed' }
            & node scripts\import-alumdoor-item-master-local.mjs $payload (Join-Path $runDir 'rerun-preimage.json')
            if ($LASTEXITCODE -ne 0) { throw 'Item rerun failed' }
          } finally { Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue }
          Write-Host "ITEM_RUN_DIR=$runDir"

      - name: Cap-safe readback and BOM contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='C:\alumdoor';$payload=Join-Path $target 'local-imports\alumdoor-item-master-payload.json';$brief=Join-Path $target 'server\briefs\alumdoor-v2.json';$tmp=Join-Path $target 'server\.tmp-item-gate-v3.mjs'
          $env:FORGE_ORIGIN='http://127.0.0.1:8799';$env:FORGE_ADMIN_USER='dev@example.com';$env:FORGE_ADMIN_PASSWORD='local-dev-password-1'
          @'
          import{readFileSync}from'node:fs';const[p,b]=process.argv.slice(2),origin=process.env.FORGE_ORIGIN,expected=JSON.parse(readFileSync(p,'utf8')).items,brief=JSON.parse(readFileSync(b,'utf8'));const cookies=new Map();let csrf='';function remember(r){const s=r.headers.get('set-cookie');if(!s)return;for(const a of s.split(/,(?=[^;,]+=)/)){const x=a.split(';',1)[0],i=x.indexOf('=');if(i>0)cookies.set(x.slice(0,i).trim(),x.slice(i+1).trim())}}async function req(path,opt={}){const h=new Headers(opt.headers||{});if(cookies.size)h.set('cookie',[...cookies].map(([k,v])=>`${k}=${v}`).join('; '));if(csrf&&opt.method&&opt.method!=='GET')h.set('x-frappe-csrf-token',csrf);if(opt.body!==undefined)h.set('content-type','application/json');const r=await fetch(origin+path,{...opt,headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)});remember(r);csrf=r.headers.get('x-frappe-csrf-token')||csrf;const t=await r.text();let j;try{j=t?JSON.parse(t):null}catch{j=t}return{r,j,t}}async function ok(path,opt={}){const x=await req(path,opt);if(!x.r.ok)throw Error(`${path} ${x.r.status}: ${x.t.slice(0,400)}`);return x.j}await ok('/api/method/login',{method:'POST',body:{usr:process.env.FORGE_ADMIN_USER,pwd:process.env.FORGE_ADMIN_PASSWORD}});const boot=await ok('/api/method/metaforge.api.get_boot');csrf=(boot?.message??boot)?.csrf_token||csrf;async function all(dt,fields){let start=0;const out=[];for(let n=0;n<5000;n++){const q=new URLSearchParams({fields:JSON.stringify(fields),limit_start:String(start),limit_page_length:'100',order_by:'name asc'}),x=await req(`/api/resource/${encodeURIComponent(dt)}?${q}`);if(!x.r.ok){console.log(`DOCTYPE_ERROR ${dt} status=${x.r.status} ${String(x.t).slice(0,250)}`);return null}const rows=Array.isArray(x.j?.data)?x.j.data:[];console.log(`PAGE ${dt} start=${start} rows=${rows.length}`);if(!rows.length)break;out.push(...rows);start+=rows.length}return out}const items=await all('Item',['name','item_code']);if(!items)throw Error('Item list unavailable');const actual=new Set(items.map(r=>String(r.item_code||r.name||'').trim()).filter(Boolean)),canonical=new Set(expected.map(r=>String(r.item_code||'').trim()).filter(Boolean)),missing=[...canonical].filter(x=>!actual.has(x)),extra=[...actual].filter(x=>!canonical.has(x));console.log(`ITEM_CANONICAL=${canonical.size}`);console.log(`ITEM_PERSISTED_TOTAL=${actual.size}`);console.log(`ITEM_CANONICAL_PRESENT=${canonical.size-missing.length}`);console.log(`ITEM_CANONICAL_MISSING=${missing.length}`);console.log(`ITEM_EXTRA_PERSISTED=${extra.length}`);const boms=await all('Bill of Materials',['name','item','docstatus']);if(boms)console.log(`PERSISTED_BILL_OF_MATERIALS=${boms.length}`);const lots=await all('Aluminium Lot',['name','item_code','status']);if(lots)console.log(`PERSISTED_ALUMINIUM_LOT=${lots.length}`);for(const name of['Bill of Materials','BOM Item','BOM Actual Component','BOM Template']){const d=(brief.doctypes||[]).find(x=>x?.name===name);console.log(`DOCTYPE_CONTRACT ${name}=${d?JSON.stringify(d):'MISSING'}`)}if(missing.length)throw Error(`missing canonical Items=${missing.length}`);
          '@ | Set-Content -LiteralPath $tmp -Encoding utf8
          try { Set-Location (Join-Path $target 'server'); & node $tmp $payload $brief; if ($LASTEXITCODE -ne 0) { throw 'readback failed' } } finally { Remove-Item $tmp -ErrorAction SilentlyContinue; Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue }
          Write-Host 'ALUMDOOR_ITEM_GATE_PASS'

      - name: Cleanup temp worktree
        if: always()
        shell: powershell
        run: |
          $target='C:\alumdoor';$feature="C:\alumdoor-worktrees\bom-item-gate-$env:GITHUB_RUN_ID";if(Test-Path $feature){git -C $target worktree remove --force $feature;git -C $target worktree prune}
