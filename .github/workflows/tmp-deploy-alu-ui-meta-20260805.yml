name: TMP Deploy Alumdoor UI + Metadata Production 2026-08-05

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-deploy-alu-ui-meta-20260805.yml"
      - "ops/releases/alu-ui-meta-20260805-authorization.txt"

permissions:
  contents: read

concurrency:
  group: release-alu-tenant-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Backup, restore drill, install metadata, deploy UI, verify exact release
    if: github.head_ref == 'release/alu-ui-meta-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      TENANT: alu
      APP_ID: alumdoor
      AUTH_FILE: ops/releases/alu-ui-meta-20260805-authorization.txt
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}
      FORGE_ORIGIN: https://alu.kairo.vn
      BACKUP_DIR: /tmp/alu-ui-meta-backup
      EVIDENCE_DIR: /tmp/alu-ui-meta-evidence

    steps:
      - name: Checkout release authorization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify explicit production authorization and immutable main target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR" "$EVIDENCE_DIR"
          test "$TENANT" = "alu"
          test "$APP_ID" = "alumdoor"
          test -f "$AUTH_FILE"
          grep -Fxq 'ACTION=DEPLOY_UI_AND_INSTALL_METADATA_PRODUCTION' "$AUTH_FILE"
          grep -Fxq 'TENANT=alu' "$AUTH_FILE"
          grep -Fxq 'APP=alumdoor' "$AUTH_FILE"
          grep -Fxq 'APPROVAL=EXPLICIT_USER_APPROVAL_2026-08-05' "$AUTH_FILE"
          target_sha="$(sed -n 's/^TARGET_SHA=//p' "$AUTH_FILE")"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(grep -c '^TARGET_SHA=' "$AUTH_FILE")" -eq 1
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$target_sha" = "$current_main" || {
            echo "Refusing production deploy: authorized target $target_sha is not current main $current_main."
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${FORGE_ADMIN_USER:-}"
          test -n "${FORGE_ADMIN_PASSWORD:-}"
          printf 'TARGET_SHA=%s\n' "$target_sha" >> "$GITHUB_ENV"
          printf 'run_id=%s\ntarget_sha=%s\ntenant=%s\napp=%s\nstarted_at=%s\nwrite_scope=metadata_plus_gateway_assets\n' \
            "$GITHUB_RUN_ID" "$target_sha" "$TENANT" "$APP_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$EVIDENCE_DIR/state.txt"

      - name: Checkout exact authorized merged source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA"
          git checkout --force --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git clean -fdx

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter cloudforge run build
          pnpm --filter metaforge run build
          pnpm --filter metaforge run typecheck
          node --test \
            server/tests/app-installer-standard-metadata-adoption.test.mjs \
            server/tests/alumdoor-procurement-navigation-contract.test.mjs \
            2>&1 | tee "$EVIDENCE_DIR/targeted-tests.log"
          node server/scripts/verify-alumdoor-meta-completeness.mjs \
            2>&1 | tee "$EVIDENCE_DIR/meta-completeness.log"
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run \
            2>&1 | tee "$EVIDENCE_DIR/package-dry-run.log"
          grep -q 'DRY_RUN_PASS alumdoor' "$EVIDENCE_DIR/package-dry-run.log"
          package_identity="$(grep -Eo 'app=alumdoor@[0-9A-Za-z._+-]+' "$EVIDENCE_DIR/package-dry-run.log" | tail -1 || true)"
          test -n "$package_identity"
          printf 'package_identity=%s\nsource_validation=pass\nclient_build=pass\ntypecheck=pass\n' "$package_identity" >> "$EVIDENCE_DIR/state.txt"

      - name: Create fresh production backup
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/backup-dry.log"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$BACKUP_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/backup-live.log"
          mapfile -t backups < <(find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.sql' -print | sort)
          test "${#backups[@]}" -eq 1
          backup_sql="${backups[0]}"
          test -f "$backup_sql.json"
          backup_sha="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.sha256||'')" "$backup_sql.json")"
          test -n "$backup_sha"
          printf 'BACKUP_SQL=%s\nBACKUP_SHA=%s\n' "$backup_sql" "$backup_sha" >> "$GITHUB_ENV"
          printf 'backup=pass\nbackup_sha256=%s\nexternal_backup=github_actions_artifact\n' "$backup_sha" >> "$EVIDENCE_DIR/state.txt"

      - name: Copy backup to protected artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: alu-ui-meta-pre-deploy-backup-${{ github.run_id }}
          path: /tmp/alu-ui-meta-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Create two isolated restore-drill databases
        shell: bash
        run: |
          set -euo pipefail
          drill_a="cloudforge-drill-alu-ui-${GITHUB_RUN_ID}-a"
          drill_b="cloudforge-drill-alu-ui-${GITHUB_RUN_ID}-b"
          printf 'DRILL_A=%s\nDRILL_B=%s\n' "$drill_a" "$drill_b" >> "$GITHUB_ENV"
          pnpm --dir server exec wrangler d1 create "$drill_a" --location apac \
            2>&1 | tee "$EVIDENCE_DIR/drill-a-create.log"
          touch /tmp/alu-ui-drill-a-created
          pnpm --dir server exec wrangler d1 create "$drill_b" --location apac \
            2>&1 | tee "$EVIDENCE_DIR/drill-b-create.log"
          touch /tmp/alu-ui-drill-b-created

      - name: Restore and verify the same backup twice
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_A" --file "$BACKUP_SQL" \
            2>&1 | tee "$EVIDENCE_DIR/drill-a-dry.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_A" --file "$BACKUP_SQL" \
            --execute --confirm "$DRILL_A" 2>&1 | tee "$EVIDENCE_DIR/drill-a-live.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_B" --file "$BACKUP_SQL" \
            2>&1 | tee "$EVIDENCE_DIR/drill-b-dry.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_B" --file "$BACKUP_SQL" \
            --execute --confirm "$DRILL_B" 2>&1 | tee "$EVIDENCE_DIR/drill-b-live.log"
          node - "$BACKUP_SQL.$DRILL_A.restore.json" "$BACKUP_SQL.$DRILL_B.restore.json" "$BACKUP_SHA" <<'NODE'
          const fs = require("fs");
          const [aPath, bPath, expected] = process.argv.slice(2);
          const a = JSON.parse(fs.readFileSync(aPath, "utf8"));
          const b = JSON.parse(fs.readFileSync(bPath, "utf8"));
          if (a.source_sha256 !== expected || b.source_sha256 !== expected) throw new Error("restore drill checksum mismatch");
          if (a.target_database_id === b.target_database_id) throw new Error("restore drills reused one database");
          if (a.routes_changed !== false || b.routes_changed !== false) throw new Error("restore drill changed routes");
          const ok = (row) => JSON.stringify(row.integrity).toLowerCase().includes("ok");
          if (!ok(a) || !ok(b)) throw new Error("restore drill quick_check failed");
          if (a.table_count !== b.table_count || a.table_count < 1) throw new Error("restore drill table count mismatch");
          process.stdout.write(`restore_drill_tables=${a.table_count}\n`);
          NODE
          printf 'restore_drill_a=pass\nrestore_drill_b=pass\nrestore_drill_sha256=%s\n' "$BACKUP_SHA" >> "$EVIDENCE_DIR/state.txt"

      - name: Install exact Alumdoor metadata through canonical browser credential path
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/forge-app.mjs briefs/alumdoor-v2.json \
            --origin "$FORGE_ORIGIN" \
            --admin "$FORGE_ADMIN_USER" \
            2>&1 | tee "$EVIDENCE_DIR/install-and-smoke.log"
          grep -q 'installed form/link/chart contract' "$EVIDENCE_DIR/install-and-smoke.log"
          grep -q '^LIVE  https://alu.kairo.vn' "$EVIDENCE_DIR/install-and-smoke.log"
          installed_identity="$(grep -Eo 'app=alumdoor@[0-9A-Za-z._+-]+' "$EVIDENCE_DIR/install-and-smoke.log" | tail -1 || true)"
          test -n "$installed_identity"
          printf 'metadata_install=pass\ninstalled_identity=%s\nconformance_smoke=pass\n' "$installed_identity" >> "$EVIDENCE_DIR/state.txt"

      - name: Stage exact runtime bundle and release marker
        shell: bash
        run: |
          set -euo pipefail
          VITE_FORGE_RELEASE_SHA="$TARGET_SHA" node server/scripts/stage-client-bundle.mjs \
            2>&1 | tee "$EVIDENCE_DIR/stage-client.log"
          grep -q "release=$TARGET_SHA" "$EVIDENCE_DIR/stage-client.log"
          node server/scripts/stage-client-bundle.mjs --check \
            2>&1 | tee "$EVIDENCE_DIR/stage-check.log"
          printf 'client_stage=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy gateway assets to production
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc \
            2>&1 | tee "$EVIDENCE_DIR/gateway-deploy.log"
          printf 'gateway_deploy=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify exact production UI identity and public boundaries
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/sre-health-snapshot.mjs \
            --base "$FORGE_ORIGIN" \
            --expected-release-sha "$TARGET_SHA" \
            --allow-remote \
            --confirm-host alu.kairo.vn \
            --attempts 15 \
            --delay-ms 2000 \
            --output "$EVIDENCE_DIR/release-observation.json" \
            2>&1 | tee "$EVIDENCE_DIR/release-observation.log"
          printf 'release_observation=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify production procurement declaration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$EVIDENCE_DIR/production-nav.json"
          const origin = process.env.FORGE_ORIGIN.replace(/\/$/, "");
          const user = process.env.FORGE_ADMIN_USER;
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map();
          let csrf = "";
          function store(response) {
            for (const value of response.headers.getSetCookie?.() ?? []) {
              const pair = value.split(";")[0];
              const i = pair.indexOf("=");
              if (i > 0) jar.set(pair.slice(0, i).trim(), pair.slice(i + 1).trim());
            }
          }
          async function call(method, body = {}) {
            const response = await fetch(`${origin}/api/method/${method}`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                ...(jar.size ? { cookie: [...jar].map(([k,v]) => `${k}=${v}`).join("; ") } : {}),
                ...(csrf ? { "x-frappe-csrf-token": csrf } : {}),
              },
              body: JSON.stringify(body),
            });
            store(response);
            csrf = response.headers.get("x-frappe-csrf-token") ?? csrf;
            const text = await response.text();
            const parsed = JSON.parse(text);
            if (!response.ok) throw new Error(`${method} HTTP ${response.status}: ${parsed.message ?? text.slice(0, 200)}`);
            return parsed.message ?? parsed;
          }
          await call("login", { usr: user, pwd: password });
          const manifest = await call("metaforge.api.get_app_manifest", { app: "alumdoor" });
          const nav = manifest.nav ?? [];
          const byKey = new Map(nav.map((entry) => [entry.key, entry]));
          for (const key of ["Purchase Order", "Purchase Receipt", "action:nhap-nhom-hang-loat"]) {
            if (!byKey.has(key)) throw new Error(`procurement nav missing: ${key}`);
          }
          const receipt = byKey.get("action:nhap-nhom-hang-loat");
          if (receipt.label !== "Nhập hàng") throw new Error(`unexpected receipt label: ${receipt.label}`);
          process.stdout.write(JSON.stringify({
            app: "alumdoor",
            nav_count: nav.length,
            receipt_action: receipt.key,
            receipt_label: receipt.label,
            declaration_driven: true
          }, null, 2));
          NODE
          printf 'procurement_navigation=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Remove temporary restore-drill databases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cleanup() {
            local name="$1" marker="$2" expected="$3"
            if [ ! -f "$marker" ]; then return 0; fi
            test "$name" = "$expected"
            case "$name" in
              cloudforge-drill-alu-ui-${GITHUB_RUN_ID}-a|cloudforge-drill-alu-ui-${GITHUB_RUN_ID}-b) ;;
              *) echo "Refusing unexpected D1 cleanup target: $name" >&2; exit 1 ;;
            esac
            pnpm --dir server exec wrangler d1 delete "$name" --skip-confirmation
          }
          cleanup "${DRILL_A:-}" /tmp/alu-ui-drill-a-created "cloudforge-drill-alu-ui-${GITHUB_RUN_ID}-a"
          cleanup "${DRILL_B:-}" /tmp/alu-ui-drill-b-created "cloudforge-drill-alu-ui-${GITHUB_RUN_ID}-b"
          printf 'drill_cleanup=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Alumdoor production UI + metadata release'
            echo
            echo '```text'
            cat "$EVIDENCE_DIR/state.txt" 2>/dev/null || echo 'state.txt missing'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-ui-meta-production-release-${{ github.run_id }}
          path: /tmp/alu-ui-meta-evidence/
          if-no-files-found: warn
          retention-days: 30
