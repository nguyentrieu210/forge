name: TMP Alumdoor Meta Completeness Sidecar Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/scripts/verify-alumdoor-meta-completeness.mjs"
      - ".github/workflows/tmp-alumdoor-meta-completeness-sidecar-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/alumdoor-meta-completeness-sidecar-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact fix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify procurement navigation contract
        run: node --test server/tests/alumdoor-procurement-navigation-contract.test.mjs

      - name: Verify Alumdoor metadata completeness through App Factory source authority
        run: node server/scripts/verify-alumdoor-meta-completeness.mjs

      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
