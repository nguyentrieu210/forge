name: One-time R6 Demo Certification Phase 3

on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-r6-demo-certification-phase3.yml"]

permissions:
  contents: write

concurrency:
  group: one-time-r6-demo-production-certification-phase3
  cancel-in-progress: false

jobs:
  certify:
    name: Provision packages release and final evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      TARGET_SHA: fedb2dd7c9abab71fedc4b747ef1d41b6db44ed5
      TENANT: alu
      ORIGIN: https://alu.kairo.vn
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD }}
      VITE_FORGE_RELEASE_SHA: fedb2dd7c9abab71fedc4b747ef1d41b6db44ed5
    steps:
      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact candidate preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$FORGE_ADMIN_PASSWORD"
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Install locked dependencies and server build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter cloudforge run build
          node server/scripts/verify-cloudflare-governance.mjs --json > "$RUNNER_TEMP/r6-phase3-e01.json"
          (cd server && npm run verify:release-safety && npm run verify:observability && npm run verify:queue-safety)
      - name: Provision canonical standard catalogue into ALU
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs'; import path from 'node:path';
          import {d1Query,wrangler} from './server/scripts/wrangler-cli.mjs';
          import {findTenantDatabaseId,removeTenantConfig,writeTenantConfig} from './server/scripts/tenant-wrangler.mjs';
          const tenant=process.env.TENANT,id=findTenantDatabaseId(tenant,wrangler);if(!id)throw new Error('missing cloudforge-alu');const cfg=writeTenantConfig({tenant,databaseId:id,publicOrigin:process.env.ORIGIN});const db={name:`cloudforge-${tenant}`,id,configArg:cfg.relativeConfig};
          const required=['Salary Component','Expense Claim','Bank Account','Fiscal Year'];
          const q=s=>d1Query(db,s);
          try{
            const list=(scope)=>q(`SELECT doctype FROM doctype_definitions WHERE tenant_id='${scope}' AND doctype IN (${required.map(x=>`'${x}'`).join(',')}) ORDER BY doctype`).map(x=>String(x.doctype));
            const standard=list('__standard__'),before=list(tenant),missingStandard=required.filter(x=>!standard.includes(x));
            if(missingStandard.length)throw new Error(`canonical __standard__ catalogue missing external DocTypes: ${missingStandard.join(', ')}`);
            const now=new Date().toISOString().replaceAll("'","''");
            q(`INSERT OR IGNORE INTO doctype_definitions(tenant_id,doctype,module,is_custom,is_submittable,is_child,revision,metadata_json,disabled,modified_by,modified_at) SELECT '${tenant}',doctype,module,is_custom,is_submittable,is_child,revision,metadata_json,disabled,'R6-CERT','${now}' FROM doctype_definitions WHERE tenant_id='__standard__'`);
            q(`INSERT OR IGNORE INTO print_formats(tenant_id,name,doc_type,is_default,disabled,revision,format_json,modified_by,modified_at) SELECT '${tenant}',name,doc_type,is_default,disabled,revision,format_json,'R6-CERT','${now}' FROM print_formats WHERE tenant_id='__standard__'`);
            q(`INSERT OR IGNORE INTO roles(tenant_id,role,desk_access,is_standard,modified_at) SELECT '${tenant}',role,1,1,'${now}' FROM (SELECT DISTINCT trim(json_extract(p.value,'$.role')) role FROM doctype_definitions d, json_each(d.metadata_json,'$.permissions') p WHERE d.tenant_id='${tenant}' AND trim(COALESCE(json_extract(p.value,'$.role'),''))<>'')`);
            const after=list(tenant),missingAfter=required.filter(x=>!after.includes(x));
            const ev={format:'forge-r6-standard-catalog-provision/v1',candidate_sha:process.env.TARGET_SHA,observed_at:new Date().toISOString(),tenant,required,standard,before,after,missing_standard:missingStandard,missing_after:missingAfter,mutation:'AUTHORIZED_IDEMPOTENT_STANDARD_CATALOG_PROVISION',status:missingAfter.length===0?'PASS':'BLOCKED'};
            writeFileSync(path.join(process.env.RUNNER_TEMP,'r6-phase3-standard-catalog.json'),JSON.stringify(ev,null,2)+'\n');if(ev.status!=='PASS')throw new Error(`provisioning incomplete: ${missingAfter.join(', ')}`);
          }finally{removeTenantConfig(cfg.configPath)}
          NODE
      - name: Install or upgrade canonical pilot packages
        id: package_install
        shell: bash
        run: |
          set -euo pipefail
          admin="${FORGE_ADMIN_USER:-Administrator}"
          node server/scripts/forge-app.mjs server/apps-src/hrm --origin "$ORIGIN" --admin "$admin"
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting --origin "$ORIGIN" --admin "$admin"
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --origin "$ORIGIN" --admin "$admin"
      - name: Apply Alumdoor pilot capability profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';import path from 'node:path';
          const origin=process.env.ORIGIN.replace(/\/$/,''),user=process.env.FORGE_ADMIN_USER||'Administrator',pwd=process.env.FORGE_ADMIN_PASSWORD;const jar=new Map();let csrf='';const cookies=()=>[...jar].map(([k,v])=>`${k}=${v}`).join('; ');function store(r){for(const v of r.headers.getSetCookie?.()??[]){const p=v.split(';')[0],i=p.indexOf('=');if(i>0)jar.set(p.slice(0,i).trim(),p.slice(i+1).trim())}}
          async function call(p,{method='GET',body}={}){const r=await fetch(origin+p,{method,headers:{...(body?{'content-type':'application/json'}:{}),...(jar.size?{cookie:cookies()}:{}),...(csrf&&method!=='GET'?{'x-frappe-csrf-token':csrf}:{})},...(body?{body:JSON.stringify(body)}:{})});store(r);csrf=r.headers.get('x-frappe-csrf-token')||csrf;const text=await r.text();let d;try{d=JSON.parse(text)}catch{d=text}if(!r.ok)throw new Error(`${p} HTTP ${r.status}: ${d?.message??String(text).slice(0,300)}`);return d?.message??d}
          await call('/api/method/login',{method:'POST',body:{usr:user,pwd}});const before=await call('/api/method/metaforge.api.get_capability_profile');const expected=Number(before?.version??0);const result=await call('/api/method/metaforge.api.apply_capability_profile',{method:'POST',body:{profile_id:'alumdoor-pilot',expected_version:expected,selections:[]}});const after=await call('/api/method/metaforge.api.get_capability_profile');const ev={format:'forge-r6-profile-apply/v1',evidence_id:'R6-E18',candidate_sha:process.env.TARGET_SHA,observed_at:new Date().toISOString(),before_version:expected,result,active:after,status:after?.profile_id==='alumdoor-pilot'&&Number(after?.version??0)>expected&&after?.resolution?.valid!==false?'PASS':'BLOCKED'};writeFileSync(path.join(process.env.RUNNER_TEMP,'r6-phase3-e18-profile.json'),JSON.stringify(ev,null,2)+'\n');if(ev.status!=='PASS')throw new Error('capability profile did not converge');
          NODE
      - name: Build and stage exact Gateway UI
        id: client_build
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter metaforge run build
          node server/scripts/stage-client-bundle.mjs
      - name: Deploy exact Gateway release marker
        id: gateway_deploy
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc
      - name: Bounded live pilot pressure
        id: pressure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import{writeFileSync}from'node:fs';import path from'node:path';const url=process.env.ORIGIN.replace(/\/$/,'')+'/health',total=50,c=5,lat=[];let n=0,errors=0;const start=performance.now();async function w(){for(;;){const i=n++;if(i>=total)return;const t=performance.now();try{const r=await fetch(url);await r.arrayBuffer();if(r.status!==200)errors++}catch{errors++}lat.push(performance.now()-t)}}await Promise.all(Array.from({length:c},w));lat.sort((a,b)=>a-b);const p=q=>Number(lat[Math.min(lat.length-1,Math.max(0,Math.ceil(lat.length*q)-1))]?.toFixed(2)??0),ms=performance.now()-start,ev={format:'forge-r6-pilot-pressure/v1',evidence_id:'R6-E17',candidate_sha:process.env.TARGET_SHA,observed_at:new Date().toISOString(),requests:total,concurrency:c,errors,error_rate:errors/total,rps:Number((total/(ms/1000)).toFixed(2)),latency_ms:{p50:p(.5),p95:p(.95),p99:p(.99)},status:errors===0?'PASS':'BLOCKED'};writeFileSync(path.join(process.env.RUNNER_TEMP,'r6-phase3-e17.json'),JSON.stringify(ev,null,2)+'\n');if(errors)throw new Error(`${errors} pressure errors`);
          NODE
      - name: Verify exact release and auth boundary
        id: health
        run: node server/scripts/sre-health-snapshot.mjs --base "$ORIGIN" --expected-release-sha "$TARGET_SHA" --allow-remote --confirm-host alu.kairo.vn --attempts 10 --delay-ms 2000 --output "$RUNNER_TEMP/r6-phase3-e03-e04.json"
      - name: Verify provider convergence
        id: provider
        run: node server/scripts/r6-provider-readonly.mjs --source-sha "$TARGET_SHA" --output "$RUNNER_TEMP/r6-phase3-e02-e05.json"
      - name: Verify exact package profile identity
        id: identity
        run: node server/scripts/r6-convergence-identity-readonly.mjs --tenant "$TENANT" --origin "$ORIGIN" --expected-release-sha "$TARGET_SHA" --output "$RUNNER_TEMP/r6-phase3-e18-identity.json"
      - name: Capture fresh PITR decision evidence
        id: pitr
        shell: bash
        run: |
          ts="$(date -u -d '5 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          node server/scripts/d1-pitr.mjs --tenant "$TENANT" --timestamp "$ts" --output "$RUNNER_TEMP/r6-phase3-e10.json"
      - name: Upload Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-demo-cert-phase3-${{ github.run_id }}
          path: ${{ runner.temp }}/r6-phase3-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record Phase 3 verdict
        if: always()
        uses: actions/github-script@v7
        env:
          O_PREFLIGHT: ${{ steps.preflight.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_PROVISION: ${{ steps.provision.outcome }}
          O_PACKAGE_INSTALL: ${{ steps.package_install.outcome }}
          O_PROFILE: ${{ steps.profile.outcome }}
          O_CLIENT_BUILD: ${{ steps.client_build.outcome }}
          O_GATEWAY_DEPLOY: ${{ steps.gateway_deploy.outcome }}
          O_PRESSURE: ${{ steps.pressure.outcome }}
          O_HEALTH: ${{ steps.health.outcome }}
          O_PROVIDER: ${{ steps.provider.outcome }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          O_PITR: ${{ steps.pitr.outcome }}
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path');const keys=['PREFLIGHT','BUILD','PROVISION','PACKAGE_INSTALL','PROFILE','CLIENT_BUILD','GATEWAY_DEPLOY','PRESSURE','HEALTH','PROVIDER','IDENTITY','PITR'];const outcomes=Object.fromEntries(keys.map(k=>[k.toLowerCase(),process.env[`O_${k}`]||'not-run'])),status=keys.every(k=>outcomes[k.toLowerCase()]==='success')?'PASS':'BLOCKED';const read=n=>{try{return JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,n),'utf8'))}catch{return null}};const payload={format:'forge-r6-demo-production-certification-phase3/v1',status,candidate_sha:process.env.TARGET_SHA,tenant:process.env.TENANT,mutation:'AUTHORIZED_PRODUCTION_DEMO',completed_at:new Date().toISOString(),workflow_run_id:String(context.runId),outcomes,evidence:{standard_catalog:read('r6-phase3-standard-catalog.json'),e10:read('r6-phase3-e10.json'),e17:read('r6-phase3-e17.json'),e18_profile:read('r6-phase3-e18-profile.json'),e03_e04:read('r6-phase3-e03-e04.json'),e02_e05:read('r6-phase3-e02-e05.json'),e18_identity:read('r6-phase3-e18-identity.json')}};const p=`deploy-evidence/r6-demo-production-certification-phase3-${process.env.TARGET_SHA.slice(0,12)}.json`;let sha;try{const r=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:'main'});if(!Array.isArray(r.data))sha=r.data.sha}catch(e){if(e.status!==404)throw e}await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:p,message:`ops(r6): record phase3 ${status} ${process.env.TARGET_SHA.slice(0,12)}`,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),branch:'main',...(sha?{sha}:{})});
      - name: Enforce Phase 3 PASS
        if: always()
        shell: bash
        run: |
          required=( '${{ steps.preflight.outcome }}' '${{ steps.build.outcome }}' '${{ steps.provision.outcome }}' '${{ steps.package_install.outcome }}' '${{ steps.profile.outcome }}' '${{ steps.client_build.outcome }}' '${{ steps.gateway_deploy.outcome }}' '${{ steps.pressure.outcome }}' '${{ steps.health.outcome }}' '${{ steps.provider.outcome }}' '${{ steps.identity.outcome }}' '${{ steps.pitr.outcome }}' )
          for o in "${required[@]}"; do test "$o" = success; done
          echo "R6_PHASE3_PASS candidate=$TARGET_SHA"
