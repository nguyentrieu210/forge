name: Execute Alumdoor Runtime Start Once

on:
  workflow_run:
    workflows:
      - Bootstrap Alumdoor Local C Drive
    types: [completed]

permissions:
  contents: read

concurrency:
  group: alumdoor-runtime-start-once
  cancel-in-progress: false

jobs:
  start-runtime:
    if: >-
      contains(github.event.workflow_run.head_commit.message, 'start Alumdoor backend and Desk once')
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: Release maintenance and ensure backend plus Desk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\alumdoor'
          $maintenance = Join-Path $root 'server\scripts\alumdoor-runtime-maintenance.mjs'
          if (-not (Test-Path $maintenance)) { throw "Missing runtime maintenance script: $maintenance" }

          & node $maintenance off all
          if ($LASTEXITCODE -ne 0) { throw 'Failed to release Alumdoor runtime maintenance.' }
          & node $maintenance status

          function Test-Backend {
            & node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit([200,401,403].includes(r.status)?0:1)).catch(()=>process.exit(1))"
            return $LASTEXITCODE -eq 0
          }
          function Test-Desk {
            & node -e "fetch('http://127.0.0.1:5173',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            return $LASTEXITCODE -eq 0
          }
          function Has-Listener([int]$Port) {
            return $null -ne (Get-NetTCPConnection -State Listen -LocalPort $Port -ErrorAction SilentlyContinue | Select-Object -First 1)
          }

          # Give the installed Windows service hosts time to observe maintenance=off
          # and spawn their children. This path needs no Service Control Manager rights.
          $serviceDeadline = (Get-Date).AddSeconds(15)
          do {
            $backendOk = Test-Backend
            $deskOk = Test-Desk
            if ($backendOk -and $deskOk) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $serviceDeadline)

          # Fallback only when no listener exists. Clear the runner tracking marker so
          # GitHub Actions cleanup does not kill the intentionally persistent local dev process.
          if (-not (Test-Backend) -and -not (Has-Listener 8799)) {
            Write-Host 'Backend service host did not spawn a listener; starting local backend fallback.'
            $env:RUNNER_TRACKING_ID = ''
            Start-Process -FilePath 'C:\Windows\System32\cmd.exe' -ArgumentList '/d','/c','cd /d C:\alumdoor\server && pnpm.cmd run dev:alumdoor-local' -WorkingDirectory 'C:\alumdoor\server' -WindowStyle Hidden
          }
          if (-not (Test-Desk) -and -not (Has-Listener 5173)) {
            Write-Host 'Desk service host did not spawn a listener; starting local Desk fallback.'
            $env:RUNNER_TRACKING_ID = ''
            $env:VITE_FORGE_BACKEND = 'http://127.0.0.1:8799'
            Start-Process -FilePath 'C:\Windows\System32\cmd.exe' -ArgumentList '/d','/c','cd /d C:\alumdoor\client\apps\runtime && pnpm.cmd run dev' -WorkingDirectory 'C:\alumdoor\client\apps\runtime' -WindowStyle Hidden
          }

          $deadline = (Get-Date).AddSeconds(120)
          do {
            $backendOk = Test-Backend
            $deskOk = Test-Desk
            if ($backendOk -and $deskOk) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)

          if (-not $backendOk) { throw 'Backend 8799 did not become healthy.' }
          if (-not $deskOk) { throw 'Desk 5173 did not become healthy.' }

          $listeners = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in @(8799, 5173) } |
            Sort-Object LocalPort
          $listeners | ForEach-Object { Write-Host "LISTENING port=$($_.LocalPort) pid=$($_.OwningProcess)" }
          Write-Host 'ALUMDOOR_RUNTIME_READY backend=http://localhost:8799 desk=http://localhost:5173'
