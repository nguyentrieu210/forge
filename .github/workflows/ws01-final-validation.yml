name: WS01 final exact-head validation

on:
  push:
    branches:
      - agent/ent-01-finance-vn
    paths:
      - .github/workflows/ws01-final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ent-01-finance-vn
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Normalize WS01 source wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Budget exactOptionalPropertyTypes compile normalization.
          budget_path = Path('server/packages/clouderp-erpnext/src/finance-budget.ts')
          budget_text = budget_path.read_text()
          old = 'currency: budget.data.currency,'
          new = 'currency: requiredText(budget.data.currency, "Finance Budget currency"),'
          count = budget_text.count(old)
          if count not in (0, 2):
              raise SystemExit(f'unexpected budget currency assignment count: {count}')
          if count:
              budget_path.write_text(budget_text.replace(old, new))

          # VAT mapping metadata is source-controlled for fresh installs/upgrades.
          tax_path = Path('server/apps-src/vn-accounting/doctypes/vn-tax-ruleset.json')
          tax = json.loads(tax_path.read_text())
          if not any(f.get('fieldname') == 'tax_accounts_json' for f in tax['fields']):
              idx = next((i for i, f in enumerate(tax['fields']) if f.get('fieldname') == 'workflow_state'), len(tax['fields']))
              tax['fields'].insert(idx, {
                  'fieldname': 'tax_accounts_json',
                  'label': 'VAT Account Mapping',
                  'fieldtype': 'Code',
                  'description': 'For VAT rulesets: {"input_vat":["..."],"output_vat":["..."]}',
                  'default': '{}',
              })
          tax['revision'] = max(int(tax.get('revision', 0)), 4)
          tax_path.write_text(json.dumps(tax, ensure_ascii=False, indent=2) + '\n')

          # App manifest wiring. Company comes from approved rulesets, never user re-entry.
          app_path = Path('server/apps-src/vn-accounting/app.json')
          app = json.loads(app_path.read_text())
          app['version'] = '1.6.0'
          app['worker'] = 'cloudforge-app-vn-accounting'
          actions = app.setdefault('actions', [])
          tax_action = next((a for a in actions if a.get('name') == 'tax-evaluate'), None)
          if tax_action:
              tax_action['fields'] = [field for field in tax_action.get('fields', []) if field.get('fieldname') != 'company']
              tax_action['description'] = 'Chạy ruleset đã duyệt bằng fixed-point minor units. Công ty được lấy từ ruleset, không nhập lại. Không ghi sổ hay nộp tờ khai.'
          if not any(a.get('name') == 'vat-dataset' for a in actions):
              actions.append({
                  'name': 'vat-dataset',
                  'label': 'Dữ liệu VAT',
                  'icon': 'table-properties',
                  'group': 'Thuế & tuân thủ',
                  'description': 'Đối chiếu VAT đầu vào/đầu ra từ hóa đơn đã ghi nhận. Chỉ đọc; không tạo sổ thuế hay nộp tờ khai.',
                  'fields': [
                      {'fieldname': 'ruleset', 'label': 'Ruleset VAT', 'fieldtype': 'Link', 'options': 'VN Tax Ruleset', 'required': True},
                      {'fieldname': 'from_date', 'label': 'Từ ngày', 'fieldtype': 'Date', 'required': True},
                      {'fieldname': 'to_date', 'label': 'Đến ngày', 'fieldtype': 'Date', 'required': True},
                      {'fieldname': 'limit_per_type', 'label': 'Giới hạn mỗi loại hóa đơn', 'fieldtype': 'Int', 'default': 100},
                  ],
                  'commit': {'method': 'vn-accounting.vat.dataset', 'label': 'Lập dữ liệu'},
                  'permission_doctype': 'VN Tax Ruleset',
                  'permission_action': 'read',
              })
          nav = app.setdefault('nav', [])
          if not any(item.get('key') == 'vat-dataset' for item in nav):
              entry = {
                  'key': 'vat-dataset', 'label': 'Dữ liệu VAT', 'kind': 'route', 'route': '/x/action:vat-dataset',
                  'icon': 'table-properties', 'group': 'Thuế & tuân thủ',
                  'required_roles': ['Tax Specialist', 'Chief Accountant', 'Accounts Manager', 'Internal Auditor', 'System Manager'],
              }
              idx = next((i + 1 for i, item in enumerate(nav) if item.get('key') == 'tax-evaluate'), len(nav))
              nav.insert(idx, entry)
          app_path.write_text(json.dumps(app, ensure_ascii=False, indent=2) + '\n')

          # VAT method dispatch remains in the app worker, preserving signed caller identity.
          index_path = Path('server/apps-src/vn-accounting-worker/src/index.ts')
          text = index_path.read_text()
          import_anchor = '} from "./bank-match.js";'
          import_line = 'import { handleVatMethod } from "./vat-service.js";'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('bank-match import anchor missing')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)
          route_anchor = 'if (method === "vn-accounting.bank.match_candidates") return bankMatchMethod(request, env, body.args ?? {});'
          vat_route = 'const vatResponse = await handleVatMethod(method, request, env, body.args ?? {});\n      if (vatResponse) return vatResponse;'
          if vat_route not in text:
              if route_anchor not in text:
                  raise SystemExit('bank-match route anchor missing')
              text = text.replace(route_anchor, route_anchor + '\n      ' + vat_route, 1)
          index_path.write_text(text)

          # Keep metadata regression aligned with canonical app version.
          pack_test = Path('server/tests/vn-accounting-statutory-pack.test.mjs')
          pack_text = pack_test.read_text().replace('assert.equal(parsed.version, "1.5.0");', 'assert.equal(parsed.version, "1.6.0");')
          pack_test.write_text(pack_text)

          # Wire all new SQL regressions into the standard gate, once each.
          package_path = Path('server/package.json')
          package = json.loads(package_path.read_text())
          sql = package['scripts']['test:sql']
          additions = [
              'python3 scripts/test-vn-vat-dataset-migration.py',
              'python3 scripts/test-vn-accounting-policy-integrity.py',
          ]
          anchor = 'python3 scripts/test-vn-accounting-statutory-registry.py'
          if anchor not in sql:
              raise SystemExit('statutory registry SQL anchor missing')
          for command in additions:
              if command not in sql:
                  sql = sql.replace(anchor, anchor + ' && ' + command, 1)
                  anchor = command
          package['scripts']['test:sql'] = sql
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY
      - name: Run exact-head gates and write evidence
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/ws01-logs docs/agents/workstreams
          run_gate() {
            name="$1"; shift
            "$@" >"/tmp/ws01-logs/${name}.log" 2>&1
            code=$?
            echo "$code" >"/tmp/ws01-logs/${name}.code"
            return 0
          }
          run_gate install pnpm install --frozen-lockfile --prefer-offline
          if [ "$(cat /tmp/ws01-logs/install.code)" = "0" ]; then
            run_gate build pnpm --filter cloudforge run build
            run_gate unit pnpm --filter cloudforge run test:unit
            run_gate sql pnpm --filter cloudforge run test:sql
            run_gate app_check pnpm --filter cloudforge run app:check
            run_gate worker_typecheck pnpm --filter cloudforge run typecheck:workers
          else
            for name in build unit sql app_check worker_typecheck; do
              echo 125 >"/tmp/ws01-logs/${name}.code"
              echo "SKIPPED: install failed" >"/tmp/ws01-logs/${name}.log"
            done
          fi
          validated_head="$(git rev-parse HEAD)"
          failed=0
          {
            echo "# WS01 exact-head validation evidence"
            echo
            echo "Generated by temporary GitHub Actions validation on branch \`agent/ent-01-finance-vn\`."
            echo
            echo "- Source head before validation/finalizer commit: \`${validated_head}\`"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Production mutation/deploy: none"
            echo
            echo "| Gate | Exit | Status |"
            echo "| --- | ---: | --- |"
            for name in install build unit sql app_check worker_typecheck; do
              code="$(cat /tmp/ws01-logs/${name}.code)"
              if [ "$code" = "0" ]; then status=PASS; else status=FAIL; failed=1; fi
              echo "| ${name} | ${code} | ${status} |"
            done
            echo
            for name in install build unit sql app_check worker_typecheck; do
              code="$(cat /tmp/ws01-logs/${name}.code)"
              if [ "$code" != "0" ]; then
                echo "## ${name} failure tail"
                echo '```text'
                tail -n 140 "/tmp/ws01-logs/${name}.log"
                echo '```'
                echo
              fi
            done
            echo "VALIDATION_FAILED=${failed}"
          } > docs/agents/workstreams/WS01_VALIDATION_EVIDENCE.md
          echo "$failed" >/tmp/ws01-validation-failed
      - name: Commit normalized source, evidence, and remove temporary CI
        if: always()
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/validate-ws01-finance.yml \
            .github/workflows/ws01-one-shot-finance-budget-compile-fix.yml \
            .github/workflows/ws01-one-shot-validation-evidence.yml \
            .github/workflows/ws01-one-shot-validation-evidence-v2.yml \
            .github/workflows/ws01-one-shot-vat-wiring.yml \
            .github/workflows/ws01-final-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            server/packages/clouderp-erpnext/src/finance-budget.ts \
            server/apps-src/vn-accounting/app.json \
            server/apps-src/vn-accounting/doctypes/vn-tax-ruleset.json \
            server/apps-src/vn-accounting-worker/src/index.ts \
            server/tests/vn-accounting-statutory-pack.test.mjs \
            server/package.json \
            docs/agents/workstreams/WS01_VALIDATION_EVIDENCE.md
          if ! git diff --cached --quiet; then
            git commit -m "test(ws01): finalize source wiring and validation evidence"
            git pull --rebase origin agent/ent-01-finance-vn
            git push origin HEAD:agent/ent-01-finance-vn
          fi
      - name: Fail run when a gate failed
        if: always()
        run: |
          test "$(cat /tmp/ws01-validation-failed 2>/dev/null || echo 1)" = "0"
