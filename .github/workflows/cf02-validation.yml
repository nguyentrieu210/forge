name: CF02 Workflows Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/apps/workflow-worker/**"
      - "server/tests/cfmax-workflow-orchestration.test.mjs"
      - "docs/agents/cloudflare-cfmax/02-WORKFLOWS-R2-HANDOFF.md"
      - ".github/workflows/cf02-validation.yml"

permissions:
  contents: read

concurrency:
  group: cf02-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cf02:
    if: startsWith(github.head_ref, 'cloudflare/cfmax-02-workflows-r2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused CF02 TypeScript check
        working-directory: server
        run: |
          cat > tsconfig.cf02.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": true,
              "declaration": false
            },
            "include": [
              "apps/workflow-worker/src/**/*.ts",
              "packages/core/src/**/*.ts",
              "types/**/*.d.ts"
            ],
            "exclude": ["dist", "node_modules"]
          }
          JSON
          pnpm exec tsc -p tsconfig.cf02.json

      - name: Focused CF02 build
        working-directory: server
        run: |
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('tsconfig.cf02.json','utf8')); p.compilerOptions.noEmit=false; p.compilerOptions.declaration=false; p.compilerOptions.sourceMap=false; p.compilerOptions.outDir='dist'; fs.writeFileSync('tsconfig.cf02-build.json', JSON.stringify(p));"
          pnpm exec tsc -p tsconfig.cf02-build.json
          test -f dist/apps/workflow-worker/src/contracts.js
          test -f dist/apps/workflow-worker/src/index.js

      - name: Workflow contract regressions
        working-directory: server
        run: node --test tests/cfmax-workflow-orchestration.test.mjs

      - name: Wrangler workflow config dry-run
        working-directory: server
        run: pnpm exec wrangler deploy --dry-run --config apps/workflow-worker/wrangler.jsonc
