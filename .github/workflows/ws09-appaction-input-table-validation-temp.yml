name: WS09 AppAction Input Table Validation

on:
  pull_request:
    branches:
      - "tmp/ws09-appaction-input-table-validation-base-20260804"

permissions:
  contents: read

concurrency:
  group: ws09-appaction-input-table-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR merge result
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Locked dependency install
        run: pnpm install --frozen-lockfile

      - name: Core typecheck
        run: pnpm --filter @metaforge/core run typecheck

      - name: Views input-table regression
        run: pnpm --filter @metaforge/views run test:action-input-table

      - name: Runtime production build
        env:
          VITE_FORGE_RELEASE_SHA: ${{ github.sha }}
        run: pnpm --filter runtime run build
