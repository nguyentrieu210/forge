name: Patch system external DocType install guard

on:
  push:
    branches:
      - fix/system-external-doctype-install-20260803
    paths:
      - .github/workflows/patch-system-external-doctype.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-external-doctype-install-20260803
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply narrow installer fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/packages/app-registry/src/installer.ts')
          s = p.read_text()
          old = '''      // User is stored in the credential-safe auth directory, not in `documents`, so
                // it intentionally has no ordinary DocType metadata row. It still has a typed
                // Link provider in the Frappe API and is therefore a valid system dependency.
                if (external.kind === "system" && external.name === "User") continue;'''
          new = '''      // System DocTypes are runtime providers, not ordinary tenant metadata rows.
                // User lives in the auth directory; Role/DocType/File are platform services.
                // Requiring any of them in doctype_definitions makes a valid system Link
                // impossible to install on a correctly provisioned tenant.
                if (external.kind === "system") continue;'''
          if old not in s:
              raise SystemExit('expected installer guard not found')
          p.write_text(s.replace(old, new, 1))
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter cloudforge run build
      - run: node server/scripts/forge-app.mjs server/apps-src/vn-accounting --dry-run
      - name: Verify exact guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'if (external.kind === "system") continue;' server/packages/app-registry/src/installer.ts
          ! grep -q 'external.kind === "system" && external.name === "User"' server/packages/app-registry/src/installer.ts
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/packages/app-registry/src/installer.ts
          git commit -m 'fix(app-registry): accept system external doctypes'
          git push origin HEAD:fix/system-external-doctype-install-20260803
