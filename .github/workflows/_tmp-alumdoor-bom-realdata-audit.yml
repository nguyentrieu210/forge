name: Temporary Alumdoor BOM Realdata Audit

on:
  push:
    branches:
      - agent/alumdoor-bom-realdata-continuation
    paths:
      - .github/workflows/_tmp-alumdoor-bom-realdata-audit.yml

permissions:
  contents: read

concurrency:
  group: alumdoor-bom-realdata-audit
  cancel-in-progress: false

jobs:
  audit-item-and-bom-state:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - name: Reconcile clean local main by fast-forward only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $branch = (git -C $target rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'main') { throw "Local checkout is on '$branch', expected main." }
          $dirty = @(git -C $target status --porcelain=v1)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host "DIRTY $_" }
            throw 'Local checkout is dirty; refusing reconciliation.'
          }
          git -C $target fetch origin main --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch origin main failed' }
          $before = (git -C $target rev-parse HEAD).Trim()
          $remote = (git -C $target rev-parse origin/main).Trim()
          git -C $target merge --ff-only origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Local main cannot fast-forward to origin/main.' }
          $after = (git -C $target rev-parse HEAD).Trim()
          Write-Host "LOCAL_MAIN_BEFORE=$before"
          Write-Host "ORIGIN_MAIN=$remote"
          Write-Host "LOCAL_MAIN_AFTER=$after"
          if ($after -ne $remote) { throw 'Local main does not match origin/main after fast-forward.' }

      - name: Rebuild canonical real-source records and Item payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $server = Join-Path $target 'server'
          $imports = Join-Path $target 'local-imports'
          New-Item -ItemType Directory -Force -Path $imports | Out-Null
          $source = Join-Path $imports 'alumdoor-item-source-records.json'
          $sourceReport = "$source.report.json"
          $payload = Join-Path $imports 'alumdoor-item-master-payload.json'
          $audit = Join-Path $imports 'alumdoor-item-master-payload.audit.json'
          Set-Location $server
          & node scripts\extract-alumdoor-real-source-records.mjs $source $sourceReport
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source extraction failed.' }
          & node scripts\build-alumdoor-item-master-payload.mjs $source $payload $audit
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Item payload build failed.' }
          $sr = Get-Content -Raw -LiteralPath $sourceReport | ConvertFrom-Json
          $ar = Get-Content -Raw -LiteralPath $audit | ConvertFrom-Json
          Write-Host "SOURCE_RECORDS=$($sr.source_record_count)"
          Write-Host "SOURCE_SELLABLE=$($sr.sellable_count)"
          Write-Host "SOURCE_STOCK=$($sr.stock_count)"
          Write-Host "SOURCE_BOM_REFS=$($sr.bom_reference_count)"
          Write-Host "SOURCE_UNRESOLVED_GROUPS=$($sr.unresolved_group_count)"
          Write-Host "ITEM_PAYLOAD_COUNT=$($ar.item_payload_count)"
          Write-Host "ITEM_MASTER_BLOCKERS=$($ar.item_master_blocker_count)"
          Write-Host "ITEM_PAYLOAD_BLOCKERS=$($ar.item_payload_blocker_count)"
          Write-Host "OTHER_BLOCKERS=$($ar.other_blocker_count)"
          Write-Host "BOM_BLOCKERS_RETAINED=$($ar.bom_blocker_count)"
          if ([int]$ar.item_master_blocker_count -ne 0 -or [int]$ar.item_payload_blocker_count -ne 0 -or [int]$ar.other_blocker_count -ne 0) {
            throw 'Canonical Item payload is not zero-blocker.'
          }

      - name: Verify canonical UOM and import Item master twice
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $server = Join-Path $target 'server'
          $imports = Join-Path $target 'local-imports'
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $runDir = Join-Path $target "local-backups\item-master-imports\bom-continuation-$stamp"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          $payload = Join-Path $imports 'alumdoor-item-master-payload.json'
          $uomPreimage = Join-Path $runDir 'uom-preimage.json'
          $preimage1 = Join-Path $runDir 'item-preimage-first.json'
          $preimage2 = Join-Path $runDir 'item-preimage-rerun.json'
          Set-Location $server
          $env:FORGE_ORIGIN = 'http://127.0.0.1:8799'
          $env:FORGE_ADMIN_USER = 'dev@example.com'
          $env:FORGE_ADMIN_PASSWORD = 'local-dev-password-1'
          try {
            & node scripts\backup-alumdoor-uom-local.mjs $uomPreimage
            if ($LASTEXITCODE -ne 0) { throw 'Authenticated UOM pre-image failed.' }
            $uom = Get-Content -Raw -LiteralPath $uomPreimage | ConvertFrom-Json
            Write-Host "UOM_CANONICAL=$($uom.canonical_count)"
            Write-Host "UOM_EXISTING=$($uom.existing_count)"
            if ([int]$uom.canonical_count -ne 19 -or [int]$uom.existing_count -ne 19) {
              throw "Canonical UOM set incomplete: existing=$($uom.existing_count) canonical=$($uom.canonical_count)"
            }
            & node scripts\import-alumdoor-item-master-local.mjs $payload --validate-only
            if ($LASTEXITCODE -ne 0) { throw 'Item importer validate-only failed.' }
            Write-Host '=== ITEM IMPORT FIRST ==='
            & node scripts\import-alumdoor-item-master-local.mjs $payload $preimage1
            if ($LASTEXITCODE -ne 0) { throw 'Canonical Item first import failed.' }
            Write-Host '=== ITEM IMPORT RERUN ==='
            & node scripts\import-alumdoor-item-master-local.mjs $payload $preimage2
            if ($LASTEXITCODE -ne 0) { throw 'Canonical Item rerun failed.' }
          }
          finally {
            Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          }
          Write-Host "ITEM_IMPORT_RUN_DIR=$runDir"

      - name: Read back all Item, Bill of Materials and Aluminium Lot with cap-safe pagination
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $server = Join-Path $target 'server'
          $payload = Join-Path $target 'local-imports\alumdoor-item-master-payload.json'
          Set-Location $server
          $env:FORGE_ORIGIN = 'http://127.0.0.1:8799'
          $env:FORGE_ADMIN_USER = 'dev@example.com'
          $env:FORGE_ADMIN_PASSWORD = 'local-dev-password-1'
          @'
          import { readFileSync } from 'node:fs';
          const origin = process.env.FORGE_ORIGIN;
          const payloadPath = process.argv[2];
          const expected = JSON.parse(readFileSync(payloadPath, 'utf8')).items;
          const cookies = new Map(); let csrf = '';
          function remember(r){ const s=r.headers.get('set-cookie'); if(!s)return; for(const part of s.split(/,(?=[^;,]+=)/)){const p=part.split(';',1)[0];const i=p.indexOf('=');if(i>0)cookies.set(p.slice(0,i).trim(),p.slice(i+1).trim());}}
          async function req(path,opt={}){const h=new Headers(opt.headers||{});if(cookies.size)h.set('cookie',[...cookies].map(([k,v])=>`${k}=${v}`).join('; '));if(csrf&&opt.method&&opt.method!=='GET')h.set('x-frappe-csrf-token',csrf);if(opt.body!==undefined)h.set('content-type','application/json');const r=await fetch(origin+path,{...opt,headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)});remember(r);csrf=r.headers.get('x-frappe-csrf-token')||csrf;const t=await r.text();let b;try{b=t?JSON.parse(t):null}catch{b=t}return{r,b,t};}
          async function ok(path,opt={}){const x=await req(path,opt);if(!x.r.ok)throw new Error(`${opt.method||'GET'} ${path} ${x.r.status}: ${x.t.slice(0,800)}`);return x.b;}
          await ok('/api/method/login',{method:'POST',body:{usr:process.env.FORGE_ADMIN_USER,pwd:process.env.FORGE_ADMIN_PASSWORD}});
          const boot=await ok('/api/method/metaforge.api.get_boot');const msg=boot?.message??boot;csrf=msg?.csrf_token||csrf;
          async function readAll(dt, fields){let start=0;const out=[];for(let pageNo=0;pageNo<2000;pageNo++){const q=new URLSearchParams({fields:JSON.stringify(fields),limit_start:String(start),limit_page_length:'100',order_by:'name asc'});const x=await req(`/api/resource/${encodeURIComponent(dt)}?${q}`);if(!x.r.ok){console.log(`DOCTYPE_ERROR ${dt} status=${x.r.status} body=${String(x.t).slice(0,500)}`);return null;}const rows=Array.isArray(x.b?.data)?x.b.data:[];console.log(`PAGE ${dt} start=${start} rows=${rows.length}`);if(rows.length===0)break;out.push(...rows);start+=rows.length;}return out;}
          const items=await readAll('Item',['name','item_code']);
          if(!items)throw new Error('Cannot read Item list.');
          const actualCodes=new Set(items.map(r=>String(r.item_code||r.name||'').trim()).filter(Boolean));
          const canonicalCodes=new Set(expected.map(r=>String(r.item_code||'').trim()).filter(Boolean));
          const missing=[...canonicalCodes].filter(c=>!actualCodes.has(c));
          const extra=[...actualCodes].filter(c=>!canonicalCodes.has(c));
          console.log(`ITEM_CANONICAL=${canonicalCodes.size}`);
          console.log(`ITEM_PERSISTED_TOTAL=${actualCodes.size}`);
          console.log(`ITEM_CANONICAL_PRESENT=${canonicalCodes.size-missing.length}`);
          console.log(`ITEM_CANONICAL_MISSING=${missing.length}`);
          console.log(`ITEM_EXTRA_PERSISTED=${extra.length}`);
          if(missing.length)console.log(`ITEM_MISSING_SAMPLE=${JSON.stringify(missing.slice(0,30))}`);
          const boms=await readAll('Bill of Materials',['name','item','docstatus']);
          if(boms)console.log(`PERSISTED_BILL_OF_MATERIALS=${boms.length}`);
          const lots=await readAll('Aluminium Lot',['name','item_code','status']);
          if(lots)console.log(`PERSISTED_ALUMINIUM_LOT=${lots.length}`);
          if(missing.length)throw new Error(`Canonical Item persistence incomplete: missing=${missing.length}`);
          '@ | Set-Content -LiteralPath '.tmp-alumdoor-cap-safe-audit.mjs' -Encoding utf8
          try {
            & node '.tmp-alumdoor-cap-safe-audit.mjs' $payload
            if ($LASTEXITCODE -ne 0) { throw 'Cap-safe persistence audit failed.' }
          }
          finally {
            Remove-Item '.tmp-alumdoor-cap-safe-audit.mjs' -ErrorAction SilentlyContinue
            Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Audit current Bill of Materials contract from repo metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $brief = Join-Path $target 'server\briefs\alumdoor-v2.json'
          @'
          import { readFileSync } from 'node:fs';
          const brief=JSON.parse(readFileSync(process.argv[2],'utf8'));
          for(const name of ['Bill of Materials','BOM Item','BOM Actual Component','BOM Template']){
            const row=(brief.doctypes||[]).find(x=>x?.name===name);
            console.log(`DOCTYPE_CONTRACT ${name}=${row?JSON.stringify(row):'MISSING'}`);
          }
          '@ | Set-Content -LiteralPath (Join-Path $target 'server\.tmp-bom-contract-audit.mjs') -Encoding utf8
          Set-Location (Join-Path $target 'server')
          try {
            & node '.tmp-bom-contract-audit.mjs' $brief
            if ($LASTEXITCODE -ne 0) { throw 'BOM metadata contract audit failed.' }
          }
          finally { Remove-Item '.tmp-bom-contract-audit.mjs' -ErrorAction SilentlyContinue }
          Write-Host 'ALUMDOOR_ITEM_GATE_AND_BOM_STATE_AUDIT_PASS'
