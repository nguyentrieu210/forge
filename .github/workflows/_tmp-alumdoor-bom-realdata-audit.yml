name: Temporary Alumdoor BOM Realdata Audit

on:
  push:
    branches:
      - agent/alumdoor-bom-realdata-continuation
    paths:
      - .github/workflows/_tmp-alumdoor-bom-realdata-audit.yml

permissions:
  contents: read

concurrency:
  group: alumdoor-bom-realdata-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - name: Audit local git, pipeline files, artifacts and persisted API counts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          Write-Host '=== GIT ==='
          $branch = (git -C $target rev-parse --abbrev-ref HEAD).Trim()
          $head = (git -C $target rev-parse HEAD).Trim()
          git -C $target fetch origin main --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch origin main failed' }
          $remote = (git -C $target rev-parse origin/main).Trim()
          Write-Host "LOCAL_BRANCH=$branch"
          Write-Host "LOCAL_HEAD=$head"
          Write-Host "ORIGIN_MAIN=$remote"
          $dirty = @(git -C $target status --porcelain=v1)
          Write-Host "DIRTY_COUNT=$($dirty.Count)"
          $dirty | Select-Object -First 50 | ForEach-Object { Write-Host "DIRTY $_" }

          Write-Host '=== BACKEND ==='
          & node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(5000)}).then(async r=>{console.log('BACKEND_STATUS='+r.status); process.exit([200,401,403].includes(r.status)?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
          if ($LASTEXITCODE -ne 0) { throw 'Local backend 8799 is not healthy.' }

          Write-Host '=== PIPELINE FILES ==='
          $roots = @(
            (Join-Path $target 'server\scripts'),
            (Join-Path $target 'server\apps-src\alumdoor-worker\src'),
            (Join-Path $target 'apps\alumdoor')
          )
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '(?i)(alumdoor|bom|item|lot|import)' } |
                Sort-Object FullName |
                Select-Object -First 500 |
                ForEach-Object { Write-Host ("FILE=" + $_.FullName.Replace($target + '\\','')) }
            }
          }

          Write-Host '=== LOCAL IMPORTS/BACKUPS ==='
          foreach ($p in @((Join-Path $target 'local-imports'), (Join-Path $target 'local-backups'))) {
            Write-Host "PATH=$p EXISTS=$(Test-Path -LiteralPath $p)"
            if (Test-Path -LiteralPath $p) {
              Get-ChildItem -LiteralPath $p -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '(?i)(item|bom|lot|alum|payload|audit|preimage|source)' } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 300 |
                ForEach-Object { Write-Host ("ARTIFACT=" + $_.FullName + "|bytes=" + $_.Length + "|mtime=" + $_.LastWriteTime.ToString('o')) }
            }
          }

          Write-Host '=== API COUNTS ==='
          Set-Location (Join-Path $target 'server')
          $env:FORGE_ORIGIN = 'http://127.0.0.1:8799'
          $env:FORGE_ADMIN_USER = 'dev@example.com'
          $env:FORGE_ADMIN_PASSWORD = 'local-dev-password-1'
          @'
          const origin = process.env.FORGE_ORIGIN;
          const cookies = new Map(); let csrf='';
          function remember(r){ const s=r.headers.get('set-cookie'); if(!s)return; for(const part of s.split(/,(?=[^;,]+=)/)){const p=part.split(';',1)[0];const i=p.indexOf('=');if(i>0)cookies.set(p.slice(0,i).trim(),p.slice(i+1).trim());}}
          async function req(path, opt={}){const h=new Headers(opt.headers||{}); if(cookies.size)h.set('cookie',[...cookies].map(([k,v])=>`${k}=${v}`).join('; ')); if(csrf&&opt.method&&opt.method!=='GET')h.set('x-frappe-csrf-token',csrf); if(opt.body!==undefined)h.set('content-type','application/json'); const r=await fetch(origin+path,{...opt,headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)}); remember(r); csrf=r.headers.get('x-frappe-csrf-token')||csrf; const t=await r.text(); let b; try{b=t?JSON.parse(t):null}catch{b=t}; return {r,b,t};}
          async function ok(path,opt={}){const x=await req(path,opt); if(!x.r.ok)throw new Error(`${opt.method||'GET'} ${path} ${x.r.status}: ${x.t.slice(0,500)}`); return x.b;}
          await ok('/api/method/login',{method:'POST',body:{usr:process.env.FORGE_ADMIN_USER,pwd:process.env.FORGE_ADMIN_PASSWORD}});
          const boot=await ok('/api/method/metaforge.api.get_boot'); const msg=boot?.message??boot; csrf=msg?.csrf_token||csrf;
          async function count(dt){let start=0,total=0; const page=500; while(true){const q=new URLSearchParams({fields:'["name"]',limit_start:String(start),limit_page_length:String(page),order_by:'name asc'}); const x=await req(`/api/resource/${encodeURIComponent(dt)}?${q}`); if(x.r.status===404){console.log(`DOCTYPE_MISSING ${dt}`);return null;} if(!x.r.ok){console.log(`DOCTYPE_ERROR ${dt} status=${x.r.status} body=${String(x.t).slice(0,300)}`);return null;} const rows=x.b?.data??[]; total+=rows.length; if(rows.length<page)break; start+=rows.length; if(start>100000)throw new Error(`pagination runaway ${dt}`);} console.log(`PERSISTED_COUNT ${dt}=${total}`); return total;}
          for (const dt of ['Item','BOM','BOM Item','Aluminium Lot']) await count(dt);
          '@ | Set-Content -LiteralPath '.tmp-alumdoor-bom-audit.mjs' -Encoding utf8
          & node '.tmp-alumdoor-bom-audit.mjs'
          $exit = $LASTEXITCODE
          Remove-Item '.tmp-alumdoor-bom-audit.mjs' -ErrorAction SilentlyContinue
          Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          if ($exit -ne 0) { throw 'API persistence audit failed.' }

          Write-Host 'ALUMDOOR_BOM_REALDATA_AUDIT_PASS'
