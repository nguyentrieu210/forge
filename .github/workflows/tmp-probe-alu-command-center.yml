name: Temp Probe ALU Command Center

on:
  push:
    branches:
      - ops/probe-alu-command-center-20260803
    paths:
      - ".github/workflows/tmp-probe-alu-command-center.yml"

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe exact production release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 8ceb94241ff82b1433370b43b0eff832ade4fdf9
        run: |
          set -euo pipefail
          state=failure
          description="ALU production does not serve expected Command Center SHA"
          for i in $(seq 1 12); do
            body=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://alu.kairo.vn/release.json?probe=${GITHUB_RUN_ID}-${i}" || true)
            if printf '%s' "$body" | grep -Fq "$EXPECTED_SHA"; then
              state=success
              description="ALU production serves expected Command Center SHA"
              break
            fi
            sleep 10
          done
          payload=$(jq -nc --arg state "$state" --arg context "alu-command-center-production" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" -d "$payload" >/dev/null
          [ "$state" = success ]
