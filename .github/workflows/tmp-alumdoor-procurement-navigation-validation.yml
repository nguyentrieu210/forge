name: TMP Alumdoor Procurement Navigation Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/scripts/lib/read-brief-source.mjs"
      - "server/scripts/lib/compile-brief-app-factory.mjs"
      - "server/briefs/alumdoor-v2.navigation.json"
      - "server/tests/alumdoor-procurement-navigation-contract.test.mjs"
      - ".github/workflows/tmp-alumdoor-procurement-navigation-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'feat/alumdoor-procurement-primary-nav-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Procurement navigation regression
        working-directory: server
        run: node --test tests/alumdoor-procurement-navigation-contract.test.mjs

      - name: Compile exact Alumdoor package candidate
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run | tee /tmp/alumdoor-2.2.4.log
          grep -q 'app=alumdoor@2.2.4' /tmp/alumdoor-2.2.4.log
          grep -q 'DRY_RUN_PASS alumdoor' /tmp/alumdoor-2.2.4.log
