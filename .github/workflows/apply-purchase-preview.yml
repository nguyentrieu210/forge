name: Apply reviewed purchase preview patch

on:
  pull_request:
    branches:
      - feat/purchase-receipt-complete-20260731
    paths:
      - .github/one-shot/*.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purchase-preview-one-shot
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/purchase-receipt-complete-20260731
          fetch-depth: 0

      - name: Verify one-shot boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/purchase-receipt-complete-20260731"
          git merge-base --is-ancestor 798d60c7edf476c26b90c51cbe0f5c0346789594 HEAD
          unexpected="$(git diff --name-only 798d60c7edf476c26b90c51cbe0f5c0346789594..HEAD | grep -Ev '^(\.github/workflows/apply-purchase-preview\.yml|\.github/one-shot/[^/]+\.patch)$' || true)"
          test -z "$unexpected"
          compgen -G '.github/one-shot/*.patch' >/dev/null

      - name: Apply reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in .github/one-shot/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm -rf .github/one-shot
          rm .github/workflows/apply-purchase-preview.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(purchase): add server-authoritative submit preview'
          git push origin HEAD:feat/purchase-receipt-complete-20260731
