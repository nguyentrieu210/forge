name: R6 Pass Convergence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r6-pass-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Full release build and source safety
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CloudForge exactly as full production release
        run: pnpm --filter cloudforge run build
      - name: Verify converged Alumdoor sales and procurement contracts
        working-directory: server
        run: >-
          node --test
          tests/alumdoor-purchase-direct-receipt.test.mjs
          tests/purchase-receipt-optional-order.test.mjs
          tests/alumdoor-procurement-navigation-contract.test.mjs
          tests/purchase-supplier-dashboard-company-scope.test.mjs
          tests/tien-dat-purchase-bulk-fifo.test.mjs
          tests/alumdoor-sales-navigation-contract.test.mjs
          tests/delivery-batch-company-scope.test.mjs
          tests/sales-wizard-context.test.mjs
          tests/metaform-autofill-contract.test.mjs
      - name: Verify app report canonical aggregate fields
        working-directory: server
        run: node --test tests/query.test.mjs
      - name: Build MetaForge exactly as full production release
        run: pnpm --filter metaforge run build
      - name: Verify MetaForm autofill and spreadsheet contracts
        working-directory: client
        run: >-
          pnpm --filter @metaforge/demo exec tsx
          ../../packages/core/src/meta/fetch-from-selfcheck.ts
          && pnpm --filter @metaforge/demo exec tsx
          ../../packages/views/src/form/spreadsheet-selfcheck.ts
          && pnpm --filter @metaforge/demo exec tsx
          ../../packages/builder/src/doctype/autofill-selfcheck.ts
      - name: Verify migration, restore import and PITR safety
        working-directory: server
        run: node --test tests/d1-migrate-remote-safety.test.mjs tests/d1-backup-import.test.mjs tests/sre-destructive-guards.test.mjs
      - name: Workerd evidence — ERP lifecycle
        id: health
        working-directory: server
        run: pnpm exec vitest run apps/tenant-worker/test/health.integration.test.mts --config apps/tenant-worker/vitest.config.mts --reporter=verbose
      - name: Workerd evidence — auth/CSRF/tenant isolation only
        id: auth
        working-directory: server
        run: >-
          pnpm exec vitest run apps/tenant-worker/test/frappe-facade.integration.test.mts
          --config apps/tenant-worker/vitest.config.mts
          -t "logs in with a real password hash|rejects a write without the CSRF header|refuses a request routed for a different tenant"
          --reporter=verbose
      - name: Workerd evidence — tenant provisioning
        id: provisioning
        working-directory: server
        run: pnpm exec vitest run apps/tenant-worker/test/tenant-provisioning.integration.test.mts --config apps/tenant-worker/vitest.config.mts --reporter=verbose
      - name: Workerd evidence — R6 Golden Flow
        id: golden
        continue-on-error: true
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run apps/tenant-worker/test/r6-golden-flow.integration.test.mts \
            --config apps/tenant-worker/vitest.config.mts \
            --reporter=verbose 2>&1 | tee /tmp/r6-golden-flow.log
      - name: Upload Golden Flow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-golden-flow-${{ github.run_id }}
          path: /tmp/r6-golden-flow.log
          if-no-files-found: warn
          retention-days: 14
      - name: Assert Golden Flow
        if: always()
        shell: bash
        run: test "${{ steps.golden.outcome }}" = success
      - name: Verify release safety authority
        working-directory: server
        run: npm run verify:release-safety
      - name: Verify observability source contract
        working-directory: server
        run: npm run verify:observability
      - name: Verify queue safety
        working-directory: server
        run: npm run verify:queue-safety
      - name: Verify Alumdoor package composition
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node --input-type=module -e "import { readBriefSource } from './scripts/lib/read-brief-source.mjs'; const brief = await readBriefSource('briefs/alumdoor-v2.json'); if (brief.id !== 'alumdoor' || typeof brief.version !== 'string' || !brief.version) process.exit(2); process.stdout.write(brief.version);")"
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run | tee /tmp/r6-alumdoor-package.log
          grep -Fq "app=alumdoor@${expected_version}" /tmp/r6-alumdoor-package.log
          grep -Fq 'DRY_RUN_PASS alumdoor' /tmp/r6-alumdoor-package.log
      - name: Verify R6 E18 package version authority
        working-directory: server
        run: node --test tests/r6-e18-package-version-authority.test.mjs
      - name: Diff hygiene
        run: git diff --check
  observe-pilot:
    name: Read-only pilot provider and package/profile evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Resolve source-authoritative Alumdoor package version
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node --input-type=module -e "import { readBriefSource } from './scripts/lib/read-brief-source.mjs'; const brief = await readBriefSource('briefs/alumdoor-v2.json'); if (brief.id !== 'alumdoor' || typeof brief.version !== 'string' || !brief.version) process.exit(2); process.stdout.write(brief.version);")"
          echo "EXPECTED_ALUMDOOR_VERSION=$expected_version" >> "$GITHUB_ENV"
      - name: Observe E02 and E05 without mutation
        continue-on-error: true
        working-directory: server
        run: node scripts/r6-provider-readonly.mjs --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" --output "$RUNNER_TEMP/r6-e02-e05.json"
      - name: Observe E18 without mutation
        continue-on-error: true
        working-directory: server
        run: node scripts/r6-convergence-identity-readonly.mjs --tenant alu --origin https://alu.kairo.vn --expected-release-sha "${{ github.event.pull_request.head.sha || github.sha }}" --expected-alumdoor-version "$EXPECTED_ALUMDOOR_VERSION" --output "$RUNNER_TEMP/r6-e18.json"
      - name: Publish read-only pilot observation
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP/r6-e02-e05.json" "$RUNNER_TEMP/r6-e18.json"; do
            if [ -f "$file" ]; then echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$file" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload pilot observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-pilot-observed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r6-e02-e05.json
            ${{ runner.temp }}/r6-e18.json
          if-no-files-found: warn
          retention-days: 30
