name: R6 Pass Convergence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r6-pass-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Full release build and source safety
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply canonical report wire-alias patch locally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest = Path('server/packages/app-registry/src/manifest.ts')
          text = manifest.read_text()
          old = '''  if (report.group_by !== dimensions[0]) throw errors.validation(`charts[${index}] dimension must match report group_by (${report.group_by ?? "none"})`);
  const columns = new Map(report.columns.map((column) => [column.field, column]));
  if (!columns.has(dimensions[0]!)) throw errors.validation(`charts[${index}] dimension is not a report column: ${dimensions[0]}`);
  for (const measure of measures) {
    const column = columns.get(measure);
    if (!column?.aggregate) throw errors.validation(`charts[${index}] measure must be an aggregated report column: ${measure}`);
  }
'''
          new = '''  // Query reports expose aggregate columns under their wire aliases, not source
  // fieldnames: sum(grand_total) -> sum_grand_total, count(name) -> count_name.
  // Charts are persisted/rendered against that response shape, so validate exactly the
  // names the report endpoint returns.
  const wireField = (column: AppReportColumn): string => column.aggregate
    ? `${column.aggregate}_${column.field}`
    : column.field;
  const wireColumns = report.columns.map((column) => [wireField(column), column] as const);
  assertUnique(wireColumns.map(([field]) => field), `reports[${index}] wire column`);
  const columns = new Map(wireColumns);
  const groupByColumn = report.columns.find((column) => !column.aggregate && column.field === report.group_by);
  const groupByWireField = groupByColumn ? wireField(groupByColumn) : report.group_by;
  if (groupByWireField !== dimensions[0]) throw errors.validation(`charts[${index}] dimension must match report group_by (${groupByWireField ?? "none"})`);
  if (!columns.has(dimensions[0]!)) throw errors.validation(`charts[${index}] dimension is not a report column: ${dimensions[0]}`);
  for (const measure of measures) {
    const column = columns.get(measure);
    if (!column?.aggregate) throw errors.validation(`charts[${index}] measure must be an aggregated report column: ${measure}`);
  }
'''
          if old in text:
              manifest.write_text(text.replace(old, new, 1))
          elif 'const wireColumns = report.columns.map' not in text:
              raise SystemExit('parseChart target not found')

          verifier = Path('server/scripts/lib/verify-installed-app.mjs')
          text = verifier.read_text()
          old = '''      const reportColumns = new Set(report.columns.map((column) => column.field));
      for (const field of [...chart.dimensions, ...chart.measures]) {
        if (!reportColumns.has(field)) throw new Error(`chart report ${chart.source} is missing column ${field}`);
      }
'''
          new = '''      const reportColumns = new Set(report.columns.map((column) => column.aggregate ? `${column.aggregate}_${column.field}` : column.field));
      for (const field of [...chart.dimensions, ...chart.measures]) {
        if (!reportColumns.has(field)) throw new Error(`chart report ${chart.source} is missing wire column ${field}`);
      }
'''
          if old in text:
              verifier.write_text(text.replace(old, new, 1))
          elif 'missing wire column' not in text:
              raise SystemExit('installed-app verifier target not found')

          tests = Path('server/tests/app-registry.test.mjs')
          text = tests.read_text()
          old = '''  const chart = {
    name: "Stock chart",
    source: report.name,
    type: "Bar",
    dimensions: ["warehouse"],
    measures: ["amount"],
    roles: ["Kho User"],
    drilldown: { route: "/report/Stock%20by%20warehouse" },
    emptyFallback: "table",
  };
  assert.doesNotThrow(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [chart] }));
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, source: "Ghost" }] }), /declared report/);
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["name"] }] }), /aggregated report column/);
'''
          new = '''  const chart = {
    name: "Stock chart",
    source: report.name,
    type: "Bar",
    dimensions: ["warehouse"],
    measures: ["sum_amount"],
    roles: ["Kho User"],
    drilldown: { route: "/report/Stock%20by%20warehouse" },
    emptyFallback: "table",
  };
  assert.doesNotThrow(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [chart] }));
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, source: "Ghost" }] }), /declared report/);
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["amount"] }] }), /aggregated report column/);
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["name"] }] }), /aggregated report column/);
'''
          if old in text:
              tests.write_text(text.replace(old, new, 1))
          elif 'measures: ["sum_amount"]' not in text:
              raise SystemExit('app-registry test target not found')
          PY
          git diff --check
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CloudForge exactly as full production release
        run: pnpm --filter cloudforge run build
      - name: Build MetaForge exactly as full production release
        run: pnpm --filter metaforge run build
      - name: Verify migration, restore import and PITR safety
        working-directory: server
        run: node --test tests/d1-migrate-remote-safety.test.mjs tests/d1-backup-import.test.mjs tests/sre-destructive-guards.test.mjs
      - name: Verify App Factory and app-registry report/chart wire aliases
        working-directory: server
        run: node --test tests/app-registry.test.mjs tests/app-factory-report-chart-alias.test.mjs
      - name: Workerd evidence — ERP lifecycle
        id: health
        working-directory: server
        run: pnpm exec vitest run apps/tenant-worker/test/health.integration.test.mts --config apps/tenant-worker/vitest.config.mts --reporter=verbose
      - name: Workerd evidence — auth/CSRF/tenant isolation only
        id: auth
        working-directory: server
        run: >-
          pnpm exec vitest run apps/tenant-worker/test/frappe-facade.integration.test.mts
          --config apps/tenant-worker/vitest.config.mts
          -t "logs in with a real password hash|rejects a write without the CSRF header|refuses a request routed for a different tenant"
          --reporter=verbose
      - name: Workerd evidence — tenant provisioning
        id: provisioning
        working-directory: server
        run: pnpm exec vitest run apps/tenant-worker/test/tenant-provisioning.integration.test.mts --config apps/tenant-worker/vitest.config.mts --reporter=verbose
      - name: Workerd evidence — R6 Golden Flow
        id: golden
        continue-on-error: true
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run apps/tenant-worker/test/r6-golden-flow.integration.test.mts \
            --config apps/tenant-worker/vitest.config.mts \
            --reporter=verbose 2>&1 | tee /tmp/r6-golden-flow.log
      - name: Upload Golden Flow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-golden-flow-${{ github.run_id }}
          path: /tmp/r6-golden-flow.log
          if-no-files-found: warn
          retention-days: 14
      - name: Assert Golden Flow
        if: always()
        shell: bash
        run: test "${{ steps.golden.outcome }}" = success
      - name: Verify release safety authority
        working-directory: server
        run: npm run verify:release-safety
      - name: Verify observability source contract
        working-directory: server
        run: npm run verify:observability
      - name: Verify queue safety
        working-directory: server
        run: npm run verify:queue-safety
      - name: Verify Alumdoor package composition
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run | tee /tmp/r6-alumdoor-package.log
          grep -q 'app=alumdoor@2.2.3' /tmp/r6-alumdoor-package.log
          grep -q 'DRY_RUN_PASS alumdoor' /tmp/r6-alumdoor-package.log
      - name: Diff hygiene
        run: git diff --check
      - name: Persist canonical wire-alias source patch to PR branch
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        with:
          script: |
            const fs=require('node:fs');
            const owner=context.repo.owner,repo=context.repo.repo,branch=process.env.HEAD_BRANCH;
            for(const path of ['server/packages/app-registry/src/manifest.ts','server/scripts/lib/verify-installed-app.mjs','server/tests/app-registry.test.mjs']){
              const remote=await github.rest.repos.getContent({owner,repo,path,ref:branch});
              const content=fs.readFileSync(path,'utf8');
              const current=Buffer.from(remote.data.content,'base64').toString('utf8');
              if(current===content) continue;
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,sha:remote.data.sha,message:`fix(r6): persist ${path.split('/').pop()} wire alias contract`,content:Buffer.from(content).toString('base64')});
            }
  observe-pilot:
    name: Read-only pilot provider and package/profile evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Observe E02 and E05 without mutation
        continue-on-error: true
        working-directory: server
        run: node scripts/r6-provider-readonly.mjs --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" --output "$RUNNER_TEMP/r6-e02-e05.json"
      - name: Observe E18 without mutation
        continue-on-error: true
        working-directory: server
        run: node scripts/r6-convergence-identity-readonly.mjs --tenant alu --origin https://alu.kairo.vn --expected-release-sha "${{ github.event.pull_request.head.sha || github.sha }}" --output "$RUNNER_TEMP/r6-e18.json"
      - name: Publish read-only pilot observation
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP/r6-e02-e05.json" "$RUNNER_TEMP/r6-e18.json"; do
            if [ -f "$file" ]; then echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$file" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload pilot observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-pilot-observed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r6-e02-e05.json
            ${{ runner.temp }}/r6-e18.json
          if-no-files-found: warn
          retention-days: 30
