name: One-time R6 App Registry Wire Alias Patch
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-r6-app-registry-wire-alias-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: program/r6-report-alias-relock-20260804
          fetch-depth: 0
      - name: Patch canonical app-registry chart validator and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest = Path('server/packages/app-registry/src/manifest.ts')
          text = manifest.read_text()
          old = '''  if (report.group_by !== dimensions[0]) throw errors.validation(`charts[${index}] dimension must match report group_by (${report.group_by ?? "none"})`);
  const columns = new Map(report.columns.map((column) => [column.field, column]));
  if (!columns.has(dimensions[0]!)) throw errors.validation(`charts[${index}] dimension is not a report column: ${dimensions[0]}`);
  for (const measure of measures) {
    const column = columns.get(measure);
    if (!column?.aggregate) throw errors.validation(`charts[${index}] measure must be an aggregated report column: ${measure}`);
  }
'''
          new = '''  // Query reports expose aggregate columns under their wire aliases, not the source
  // fieldnames: sum(grand_total) -> sum_grand_total, count(name) -> count_name.
  // Charts are persisted and rendered against that response shape, so validate the same
  // names the report endpoint actually returns instead of accepting a source field that
  // will never appear in a report row.
  const wireField = (column: AppReportColumn): string => column.aggregate
    ? `${column.aggregate}_${column.field}`
    : column.field;
  const wireColumns = report.columns.map((column) => [wireField(column), column] as const);
  assertUnique(wireColumns.map(([field]) => field), `reports[${index}] wire column`);
  const columns = new Map(wireColumns);
  const groupByColumn = report.columns.find((column) => !column.aggregate && column.field === report.group_by);
  const groupByWireField = groupByColumn ? wireField(groupByColumn) : report.group_by;
  if (groupByWireField !== dimensions[0]) throw errors.validation(`charts[${index}] dimension must match report group_by (${groupByWireField ?? "none"})`);
  if (!columns.has(dimensions[0]!)) throw errors.validation(`charts[${index}] dimension is not a report column: ${dimensions[0]}`);
  for (const measure of measures) {
    const column = columns.get(measure);
    if (!column?.aggregate) throw errors.validation(`charts[${index}] measure must be an aggregated report column: ${measure}`);
  }
'''
          if old not in text:
              raise SystemExit('manifest parseChart target not found exactly')
          manifest.write_text(text.replace(old, new, 1))

          test = Path('server/tests/app-registry.test.mjs')
          text = test.read_text()
          old = '''  const chart = {
    name: "Stock chart",
    source: report.name,
    type: "Bar",
    dimensions: ["warehouse"],
    measures: ["amount"],
    roles: ["Kho User"],
    drilldown: { route: "/report/Stock%20by%20warehouse" },
    emptyFallback: "table",
  };
  assert.doesNotThrow(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [chart] }));
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, source: "Ghost" }] }), /declared report/);
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["name"] }] }), /aggregated report column/);
'''
          new = '''  const chart = {
    name: "Stock chart",
    source: report.name,
    type: "Bar",
    dimensions: ["warehouse"],
    measures: ["sum_amount"],
    roles: ["Kho User"],
    drilldown: { route: "/report/Stock%20by%20warehouse" },
    emptyFallback: "table",
  };
  assert.doesNotThrow(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [chart] }));
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, source: "Ghost" }] }), /declared report/);
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["amount"] }] }), /aggregated report column/);
  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["name"] }] }), /aggregated report column/);
'''
          if old not in text:
              raise SystemExit('app-registry chart test target not found exactly')
          test.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/r6-pass-convergence.yml')
          text = workflow.read_text()
          old = '''      - name: Verify App Factory report/chart wire aliases
        working-directory: server
        run: node --test tests/app-factory-report-chart-alias.test.mjs
'''
          new = '''      - name: Verify App Factory and app-registry report/chart wire aliases
        working-directory: server
        run: node --test tests/app-registry.test.mjs tests/app-factory-report-chart-alias.test.mjs
'''
          if old not in text:
              raise SystemExit('R6 alias gate target not found exactly')
          workflow.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- server/packages/app-registry/src/manifest.ts server/tests/app-registry.test.mjs .github/workflows/r6-pass-convergence.yml
      - name: Commit patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/packages/app-registry/src/manifest.ts server/tests/app-registry.test.mjs .github/workflows/r6-pass-convergence.yml
          git commit -m "fix(r6): validate charts against report wire aliases"
          git push origin HEAD:program/r6-report-alias-relock-20260804
