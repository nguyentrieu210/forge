          path = 'server/packages/clouderp-selling/src/types.ts'
          t = read(path)
          t = replace_once(t, '  account: string;\n  rate: DecimalInput;', '  account?: string;\n  rate: DecimalInput;', 'TaxRow optional account')
          write(path, t)

          path = 'server/packages/clouderp-selling/src/totals.ts'
          t = read(path)
          t = replace_once(t, '    if (!tax.account) throw errors.validation(`Tax account is required at row ${index + 1}`);\n', '', 'totals commercial tax account')
          write(path, t)

          path = 'server/packages/clouderp-selling/src/controllers.ts'
          c = read(path)
          c = replace_once(c,
          '''        ...totals.taxes.map((tax): [string, string] => ["Account", tax.account]),''',
          '''        ...totals.taxes.filter((tax) => Boolean(tax.account)).map((tax): [string, string] => ["Account", tax.account!]),''',
          'Sales Order optional tax account')
          c = replace_once(c,
          '''      const accountRecords: Array<[string, string]> = [\n        ["Account", input.debit_to], ["Account", input.default_income_account],\n        ...totals.taxes.map((tax): [string, string] => ["Account", tax.account]),\n      ];''',
          '''      const taxAccountRecords = totals.taxes.map((tax, index): [string, string] => {\n        if (!tax.account) throw errors.validation(`Tax account is required at row ${index + 1}`);\n        return ["Account", tax.account];\n      });\n      const accountRecords: Array<[string, string]> = [\n        ["Account", input.debit_to], ["Account", input.default_income_account],\n        ...taxAccountRecords,\n      ];''',
          'Sales Invoice tax account gate')
          c = replace_once(c,
          '''      const baseTax = convertMinor(Math.abs(transactionTax), transactionScale, rateMicros, companyScale, `taxes[${index}].base_tax`);\n      componentCredits += transactionTax > 0 ? baseTax : -baseTax;''',
          '''      const baseTax = convertMinor(Math.abs(transactionTax), transactionScale, rateMicros, companyScale, `taxes[${index}].base_tax`);\n      if (!tax.account) throw errors.validation(`Tax account is required at row ${index + 1}`);\n      componentCredits += transactionTax > 0 ? baseTax : -baseTax;''',
          'invoice ledger tax account defense')
          write(path, c)

          # --- Worker: expose both PB widths + derived height snapshot ----------------------
          path = 'server/apps-src/alumdoor-worker/src/sales-wizard-context.ts'
          w = read(path)
          w = replace_once(w,
          '''function measurementHeightBasis(customerGroup: CustomerGroup, policy: RawPolicy): "Cao lọt lòng" | "Cao phủ bì" {\n  const hasCoverOffset = policy.height_pb_offset_m != null && policy.height_pb_offset_m !== "";\n  return customerGroup === "Lẻ" && hasCoverOffset ? "Cao lọt lòng" : "Cao phủ bì";\n}\n''',
          '''function measurementHeightBasis(customerGroup: CustomerGroup, policy: RawPolicy): "Cao lọt lòng" | "Cao phủ bì" {\n  const hasCoverOffset = policy.height_pb_offset_m != null && policy.height_pb_offset_m !== "";\n  return customerGroup === "Lẻ" && hasCoverOffset ? "Cao lọt lòng" : "Cao phủ bì";\n}\n\nfunction derivedCoverWidths(policy: ReturnType<typeof parseDoorPolicy>, cutWidth: number): { cover_ray_width_m: number | null; cover_plastic_width_m: number | null } {\n  const candidates = new Map<string, number[]>();\n  const add = (basis: string, deduction: number) => {\n    const values = candidates.get(basis) ?? [];\n    values.push(round(cutWidth + deduction));\n    candidates.set(basis, values);\n  };\n  add(policy.dealer_width_basis, policy.dealer_cut_deduction_m);\n  add(policy.retail_width_basis, policy.retail_cut_deduction_m);\n  const unique = (basis: string) => {\n    const values = candidates.get(basis) ?? [];\n    if (!values.length) return null;\n    const first = values[0]!;\n    return values.every((value) => Math.abs(value - first) < 0.000001) ? first : null;\n  };\n  return { cover_ray_width_m: unique("Phủ bì ray"), cover_plastic_width_m: unique("Phủ bì nhựa") };\n}\n''',
          'worker derived width helper')
          w = replace_once(w,
          '''    const formula = calculateDoorFormula(pair.parsed, {''',
          '''    const formula = calculateDoorFormula(pair.parsed, {''',
          'worker formula anchor')
          w = replace_once(w,
          '''    let leaf = null;\n    let leafError: string | null = null;''',
          '''    const derivedWidths = derivedCoverWidths(pair.parsed, Number(formula.cut_width_m));\n    const heightOffset = pair.raw.height_pb_offset_m == null || pair.raw.height_pb_offset_m === "" ? null : Number(pair.raw.height_pb_offset_m);\n    const clearHeight = heightOffset != null && Number.isFinite(heightOffset) && coverHeight > heightOffset ? round(coverHeight - heightOffset) : null;\n\n    let leaf = null;\n    let leafError: string | null = null;''',
          'worker derived snapshots')
          w = replace_once(w,
          '''      input_width_m: round(inputWidth),\n      cover_width_m: round(measuredWidth),\n      input_height_basis: heightInputBasis,''',
          '''      input_width_m: round(inputWidth),\n      cover_width_m: round(measuredWidth),\n      clear_width_m: widthInputBasis === "Rộng lọt lòng" ? round(inputWidth) : null,\n      ...derivedWidths,\n      input_height_basis: heightInputBasis,''',
          'worker width outputs')
          w = replace_once(w,
          '''      input_height_m: round(inputHeight),\n      cover_height_m: round(coverHeight),''',
          '''      input_height_m: round(inputHeight),\n      clear_height_m: clearHeight,\n      cover_height_m: round(coverHeight),\n      mesh_height_m: args.mesh_height_m == null || args.mesh_height_m === "" ? null : round(Number(args.mesh_height_m)),''',
          'worker height outputs')
          write(path, w)

          # --- Tests -----------------------------------------------------------------------
          path = 'server/tests/alumdoor-sales-vat-surcharge.test.mjs'
          v = '''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst sheet = fs.readFileSync("client/apps/runtime/src/experiences/AlumdoorSalesSheetV2.tsx", "utf8");\n\ntest("VAT is commercial input in the totals block, without accounting fields", () => {\n  assert.match(sheet, /VAT \\(%\\)/);\n  assert.match(sheet, /Tiền VAT/);\n  assert.match(sheet, /TỔNG THANH TOÁN/);\n  assert.match(sheet, /value=\\{vatPct\\}/);\n  assert.doesNotMatch(sheet, /Tài khoản VAT/);\n  assert.doesNotMatch(sheet, /Tài khoản phụ thu/);\n  assert.doesNotMatch(sheet, /Phụ thu/);\n});\n\ntest("VAT changes the live commercial payable total", () => {\n  assert.match(sheet, /const taxableTotal = Math\\.max\\(0, grossTotal - totalDiscount\\)/);\n  assert.match(sheet, /const totalVat = Number\\.isFinite\\(vatRate\\) && vatRate > 0 \\? taxableTotal \\* vatRate \\/ 100 : 0/);\n  assert.match(sheet, /const total = taxableTotal \\+ totalVat/);\n});\n\ntest("Sales Order VAT row persists without a ledger account", () => {\n  assert.match(sheet, /charge_type: "On Net Total"[\\s\\S]*description: `VAT/);\n  assert.match(sheet, /taxes: buildTaxes\\(\\)/);\n  assert.doesNotMatch(sheet, /account_head:/);\n});\n'''
          write(path, v)

          path = 'server/tests/alumdoor-sales-sheet-autofill.test.mjs'
          a = read(path)
          a = a.replace('preferred -> customer-group list -> standard -> sole list', 'preferred when applicable -> customer-group list')
          a = a.replace('assert.match(sheet, /label: "CAO"[\\s\\S]*unit: "m"/);\n  assert.match(sheet, /label: "RỘNG"[\\s\\S]*unit: "m"/);', 'assert.match(sheet, /label: "CAO LỌT LÒNG"[\\s\\S]*unit: "m"/);\n  assert.match(sheet, /label: "CAO PB"[\\s\\S]*unit: "m"/);\n  assert.match(sheet, /label: "RỘNG PB RAY"[\\s\\S]*unit: "m"/);\n  assert.match(sheet, /label: "RỘNG PB NHỰA"[\\s\\S]*unit: "m"/);\n  assert.match(sheet, /label: "RỘNG CẮT LÁ"[\\s\\S]*unit: "m"/);')
          a = a.replace('assert.match(sheet, /<option value="Lẻ">Khách lẻ<\\/option>/);\n  assert.match(sheet, /<option value="Đại lý">Đại lý<\\/option>/);', 'assert.match(sheet, /<option value="Bán lẻ">Bán lẻ<\\/option>/);\n  assert.match(sheet, /<option value="Đại lý">Đại lý<\\/option>/);\n  assert.match(sheet, /<option value="Nhà thầu">Nhà thầu<\\/option>/);')
          a = a.replace('  assert.match(sheet, /Tổng cộng/);\n  assert.match(sheet, /Tổng chiết khấu/);\n  assert.match(sheet, /Tổng VAT/);\n  assert.match(sheet, /Tổng phụ thu/);\n  assert.match(sheet, /THÀNH TIỀN/);', '  assert.match(sheet, /Tạm tính/);\n  assert.match(sheet, /Chiết khấu/);\n  assert.match(sheet, /Sau chiết khấu/);\n  assert.match(sheet, /VAT \\(%\\)/);\n  assert.match(sheet, /Tiền VAT/);\n  assert.match(sheet, /TỔNG THANH TOÁN/);\n  assert.doesNotMatch(sheet, /Phụ thu/);')
          a += '''\n\ntest("operator sheet projects explicit semantic columns only when applicable", () => {\n  assert.match(sheet, /function columnApplies/);\n  assert.match(sheet, /CORE_COLUMNS/);\n  assert.match(sheet, /LOẠI RAY/);\n  assert.match(sheet, /CAO LỌT LÒNG/);\n  assert.match(sheet, /CAO PB/);\n  assert.match(sheet, /CAO LƯỚI/);\n  assert.match(sheet, /RỘNG LỌT LÒNG/);\n  assert.match(sheet, /RỘNG PB RAY/);\n  assert.match(sheet, /RỘNG PB NHỰA/);\n  assert.match(sheet, /RỘNG CẮT LÁ/);\n  assert.match(sheet, /SỐ LÁ/);\n});\n\ntest("price list is resolved strictly by Đại lý, Bán lẻ or Nhà thầu", () => {\n  assert.match(sheet, /priceListMatchesGroup/);\n  assert.match(sheet, /"Đại lý", "Bán lẻ", "Nhà thầu"/);\n  assert.match(sheet, /Chưa cấu hình Bảng giá/);\n  assert.doesNotMatch(sheet, /STANDARD_PRICE_LIST/);\n  assert.doesNotMatch(sheet, /Giá niêm yết/);\n  assert.match(bridge, /"Nhà thầu"/);\n  assert.doesNotMatch(bridge, /standard -> sole list/);\n});\n'''
          write(path, a)

          path = 'server/tests/alumdoor-sales-item-dimension-mode.test.mjs'
          d = read(path)
          d = d.replace('  assert.match(source, /return "QUANTITY";/);', '  assert.match(source, /inventory === "hàng thường"[\\s\\S]*return "QUANTITY"/);\n  assert.match(source, /return "QUANTITY";/);')
          d = sub_once(d,
          r'test\("item detail only renders measurement controls that apply to the selected item", \(\) => \{.*?\n\}\);',
          '''test("item detail and grid only render measurement controls that apply to the selected item", () => {\n  assert.match(sheet, /line\\.requireColor \\? <div className="grid gap-1\\.5"><Label>Màu sắc \\*<\\/Label>/);\n  assert.match(sheet, /line\\.mode === "HEIGHT" \\|\\| line\\.mode === "AREA"/);\n  assert.match(sheet, /line\\.mode === "WIDTH" \\|\\| line\\.mode === "AREA"/);\n  assert.match(sheet, /function columnApplies/);\n  assert.match(sheet, /key === "heightClear"/);\n  assert.match(sheet, /key === "widthRay"/);\n  assert.match(sheet, /key === "widthPlastic"/);\n  assert.match(sheet, /key === "widthCut"/);\n});''',
          'dimension detail test')
          d = sub_once(d,
          r'test\("export suppresses stale dimensions while canonical print reads the persisted Sales Order", \(\) => \{.*?\n\}\);',
          '''test("export follows currently applicable semantic columns while canonical print reads the persisted Sales Order", () => {\n  assert.match(sheet, /visibleColumns\\.map\\(\\(column\\) => exportCellValue/);\n  assert.match(sheet, /const printRoute = \\(name: unknown\\) => `\\/print\\/\\$\\{encodeURIComponent\\("Sales Order"\\)\\}/);\n  assert.doesNotMatch(sheet, /const printHeight =/);\n  assert.doesNotMatch(sheet, /const printWidth =/);\n});''',
          'dimension export test')
          write(path, d)

          # New runtime contract for optional Sales Order tax account / strict invoice posting.
          write('server/tests/sales-commercial-vat-optional-account.test.mjs', '''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\nimport { calculateSalesTotals } from "../dist/packages/clouderp-selling/src/totals.js";\n\ntest("commercial totals calculate VAT without a ledger account", () => {\n  const totals = calculateSalesTotals(\n    [{ row_id: "ITEM-1", item_code: "CUA-DUC", uom: "Bộ", qty: 1, rate: 100000 }],\n    [{ row_id: "VAT", charge_type: "On Net Total", rate: 10 }],\n    2,\n  );\n  assert.equal(totals.net_total, "100000.00");\n  assert.equal(totals.total_taxes_and_charges, "10000.00");\n  assert.equal(totals.grand_total, "110000.00");\n});\n\ntest("Sales Order accepts account-less commercial tax but Sales Invoice keeps the posting gate", () => {\n  const types = fs.readFileSync("server/packages/clouderp-selling/src/types.ts", "utf8");\n  const totals = fs.readFileSync("server/packages/clouderp-selling/src/totals.ts", "utf8");\n  const controllers = fs.readFileSync("server/packages/clouderp-selling/src/controllers.ts", "utf8");\n  assert.match(types, /account\\?: string/);\n  assert.doesNotMatch(totals, /if \\(!tax\\.account\\) throw errors\\.validation\\(`Tax account is required at row/);\n  assert.match(controllers, /totals\\.taxes\\.filter\\(\\(tax\\) => Boolean\\(tax\\.account\\)\\)/);\n  assert.match(controllers, /taxAccountRecords[\\s\\S]*Tax account is required at row/);\n});\n''')

          # Extend existing worker test with the derived snapshot used by the explicit columns.
          path = 'server/tests/sales-wizard-context.test.mjs'
          sw = read(path)
          sw = replace_once(sw,
          '''  assert.equal(result.cover_width_m, 4.08);\n  assert.equal(result.cut_width_m, 4);\n  assert.equal(result.cover_height_m, 2.8);''',
          '''  assert.equal(result.cover_width_m, 4.08);\n  assert.equal(result.cover_ray_width_m, 4.08);\n  assert.equal(result.cover_plastic_width_m, 4.02);\n  assert.equal(result.clear_width_m, 4);\n  assert.equal(result.cut_width_m, 4);\n  assert.equal(result.clear_height_m, 2.3);\n  assert.equal(result.cover_height_m, 2.8);''',
          'worker explicit dimension assertions')
          write(path, sw)

          print('Alumdoor sales operator patch applied')
          PY
      - name: Source-contract tests
        run: |
          node --test \
            server/tests/alumdoor-sales-vat-surcharge.test.mjs \
            server/tests/alumdoor-sales-sheet-autofill.test.mjs \
            server/tests/alumdoor-sales-item-dimension-mode.test.mjs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "forge-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp_alumdoor_sales_operator_patch.yml
          git add client/apps/runtime/src/experiences/AlumdoorSalesSheetV2.tsx \
                  client/apps/runtime/src/experiences/AlumdoorSalesAutofillBridge.ts \
                  server/apps-src/alumdoor-worker/src/sales-wizard-context.ts \
                  server/packages/clouderp-selling/src/types.ts \
                  server/packages/clouderp-selling/src/totals.ts \
                  server/packages/clouderp-selling/src/controllers.ts \
                  server/tests/alumdoor-sales-vat-surcharge.test.mjs \
                  server/tests/alumdoor-sales-sheet-autofill.test.mjs \
                  server/tests/alumdoor-sales-item-dimension-mode.test.mjs \
                  server/tests/sales-wizard-context.test.mjs \
                  server/tests/sales-commercial-vat-optional-account.test.mjs
          git commit -m "fix(alumdoor): simplify operator sales sheet [sales-operator-applied]"
          git push origin HEAD:fix/alumdoor-sales-operator-sheet-20260807
