name: Temporary Alumdoor sales operator patch

on:
  push:
    branches:
      - fix/alumdoor-sales-operator-sheet-20260807

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sales-operator-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alumdoor-sales-operator-sheet-20260807
          fetch-depth: 0
      - name: Apply reviewed operator-sheet changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one exact match, found {text.count(old)}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label, flags=re.S):
              new, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, found {count}')
              return new

          # --- Sales Sheet V2 -------------------------------------------------
          path = 'client/apps/runtime/src/experiences/AlumdoorSalesSheetV2.tsx'
          s = read(path)

          s = replace_once(s,
          '''  default_discount_pct?: number;\n  area_per_set_sqm?: number;''',
          '''  default_discount_pct?: number;\n  ray_type?: string | null;\n  ray_options?: string[];\n  clear_width_m?: number | null;\n  cover_ray_width_m?: number | null;\n  cover_plastic_width_m?: number | null;\n  clear_height_m?: number | null;\n  cover_height_m?: number | null;\n  mesh_height_m?: number | null;\n  area_per_set_sqm?: number;''',
          'FormulaResult dimensions')

          s = replace_once(s,
          '''  mode: CalculationMode;\n  color: string;''',
          '''  mode: CalculationMode;\n  rayType: string;\n  rayOptions: string[];\n  color: string;''',
          'SaleLine ray fields')

          s = sub_once(s,
          r'type ColumnKey = .*?\n\];\n\nconst STANDARD_PRICE_LIST = "Giá niêm yết";',
          '''type ColumnKey =\n  | "itemCode" | "color" | "rayType" | "thickness"\n  | "height" | "heightClear" | "heightCover" | "heightMesh"\n  | "width" | "widthClear" | "widthRay" | "widthPlastic" | "widthCut"\n  | "area" | "leafCount" | "qty" | "rate" | "discount" | "uom" | "amount";\ntype ColumnDef = { key: ColumnKey; label: string; width: number; numeric?: boolean; unit?: string };\n\nconst COLUMNS: ColumnDef[] = [\n  { key: "itemCode", label: "SẢN PHẨM", width: 13 },\n  { key: "color", label: "MÀU", width: 6.5 },\n  { key: "rayType", label: "LOẠI RAY", width: 6 },\n  { key: "thickness", label: "DÀY", width: 5, unit: "mm" },\n  { key: "height", label: "DÀI RAY", width: 6.5, numeric: true, unit: "m" },\n  { key: "heightClear", label: "CAO LỌT LÒNG", width: 8, numeric: true, unit: "m" },\n  { key: "heightCover", label: "CAO PB", width: 6.5, numeric: true, unit: "m" },\n  { key: "heightMesh", label: "CAO LƯỚI", width: 7, numeric: true, unit: "m" },\n  { key: "width", label: "DÀI TRỤC", width: 6.5, numeric: true, unit: "m" },\n  { key: "widthClear", label: "RỘNG LỌT LÒNG", width: 8.5, numeric: true, unit: "m" },\n  { key: "widthRay", label: "RỘNG PB RAY", width: 8, numeric: true, unit: "m" },\n  { key: "widthPlastic", label: "RỘNG PB NHỰA", width: 8.5, numeric: true, unit: "m" },\n  { key: "widthCut", label: "RỘNG CẮT LÁ", width: 8, numeric: true, unit: "m" },\n  { key: "area", label: "DT", width: 5, numeric: true, unit: "m²" },\n  { key: "leafCount", label: "SỐ LÁ", width: 5.5, numeric: true },\n  { key: "qty", label: "SL", width: 3.8, numeric: true },\n  { key: "rate", label: "Đ.GIÁ", width: 6.5, numeric: true },\n  { key: "discount", label: "CK %", width: 4.5, numeric: true },\n  { key: "uom", label: "ĐVT", width: 4.5 },\n  { key: "amount", label: "TT", width: 7.5, numeric: true },\n];\n\nconst CORE_COLUMNS = new Set<ColumnKey>(["itemCode", "qty", "rate", "discount", "uom", "amount"]);''',
          'Column model')

          s = sub_once(s,
          r'function canonicalCustomerGroup\(value: unknown\): string \{.*?\n\}',
          '''function canonicalCustomerGroup(value: unknown): string {\n  const raw = String(value ?? "").trim();\n  const normalized = normalize(raw);\n  if (!normalized) return "";\n  if (normalized.includes("đại lý") || normalized.includes("dai ly") || normalized.includes("dealer")) return "Đại lý";\n  if (normalized.includes("nhà thầu") || normalized.includes("nha thau") || normalized.includes("contractor") || normalized.includes("công trình") || normalized.includes("cong trinh")) return "Nhà thầu";\n  if (normalized === "lẻ" || normalized.includes("khách lẻ") || normalized.includes("khach le") || normalized.includes("bán lẻ") || normalized.includes("ban le") || normalized.includes("retail")) return "Bán lẻ";\n  return raw;\n}\n\nfunction formulaCustomerGroup(value: unknown): "Đại lý" | "Lẻ" | "" {\n  const group = canonicalCustomerGroup(value);\n  if (group === "Đại lý") return "Đại lý";\n  if (group === "Bán lẻ" || group === "Nhà thầu") return "Lẻ";\n  return "";\n}\n\nfunction priceListMatchesGroup(value: unknown, group: string): boolean {\n  const name = normalize(value);\n  if (group === "Đại lý") return name.includes("đại lý") || name.includes("dai ly") || name.includes("dealer");\n  if (group === "Bán lẻ") return name.includes("bán lẻ") || name.includes("ban le") || name.includes("khách lẻ") || name.includes("khach le") || name.includes("retail");\n  if (group === "Nhà thầu") return name.includes("nhà thầu") || name.includes("nha thau") || name.includes("contractor") || name.includes("công trình") || name.includes("cong trinh");\n  return false;\n}''',
          'customer group semantics')

          s = replace_once(s,
          '''function heightBasisTitle(value: unknown): string {\n  const basis = String(value ?? "").trim();\n  const normalized = normalize(basis);\n  if (normalized === "cao lọt lòng") return "CAO LỌT LÒNG";\n  if (normalized === "cao phủ bì") return "CAO PB";\n  if (normalized === "cao lưới") return "CAO LƯỚI";\n  return basis ? basis.toLocaleUpperCase("vi") : "CAO";\n}\n''',
          '''function heightBasisTitle(value: unknown): string {\n  const basis = String(value ?? "").trim();\n  const normalized = normalize(basis);\n  if (normalized === "cao lọt lòng") return "CAO LỌT LÒNG";\n  if (normalized === "cao phủ bì") return "CAO PB";\n  if (normalized === "cao lưới") return "CAO LƯỚI";\n  return basis ? basis.toLocaleUpperCase("vi") : "CAO";\n}\n\nfunction sameBasis(value: unknown, expected: string): boolean { return normalize(value) === normalize(expected); }\nfunction formulaNumber(value: unknown): number | null {\n  const parsed = Number(value);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : null;\n}\nfunction semanticHeightValue(line: SaleLine, basis: string): number | null {\n  if (sameBasis(line.heightBasis, basis) && positive(line.height)) return decimal(line.height);\n  if (basis === "Cao lọt lòng") return formulaNumber(line.formula?.clear_height_m);\n  if (basis === "Cao phủ bì") return formulaNumber(line.formula?.cover_height_m);\n  if (basis === "Cao lưới") return formulaNumber(line.formula?.mesh_height_m);\n  return null;\n}\nfunction semanticWidthValue(line: SaleLine, basis: string): number | null {\n  if (sameBasis(line.widthBasis, basis) && positive(line.width)) return decimal(line.width);\n  if (basis === "Rộng lọt lòng") return formulaNumber(line.formula?.clear_width_m);\n  if (basis === "Phủ bì ray") return formulaNumber(line.formula?.cover_ray_width_m);\n  if (basis === "Phủ bì nhựa") return formulaNumber(line.formula?.cover_plastic_width_m);\n  if (basis === "Rộng cắt lá") return formulaNumber(line.formula?.cut_width_m);\n  return null;\n}\nfunction columnApplies(line: SaleLine, key: ColumnKey): boolean {\n  if (!line.itemCode) return false;\n  if (key === "color") return line.requireColor;\n  if (key === "rayType") return line.mode === "AREA" && Boolean(line.rayType || line.rayOptions.length);\n  if (key === "thickness") return line.mode === "WIDTH";\n  if (key === "height") return line.mode === "HEIGHT";\n  if (key === "width") return line.mode === "WIDTH";\n  if (key === "heightClear") return line.mode === "AREA" && sameBasis(line.heightBasis, "Cao lọt lòng");\n  if (key === "heightCover") return line.mode === "AREA";\n  if (key === "heightMesh") return line.mode === "AREA" && (sameBasis(line.heightBasis, "Cao lưới") || formulaNumber(line.formula?.mesh_height_m) != null);\n  if (key === "widthClear") return line.mode === "AREA" && sameBasis(line.widthBasis, "Rộng lọt lòng");\n  if (key === "widthRay") return line.mode === "AREA" && sameBasis(line.widthBasis, "Phủ bì ray");\n  if (key === "widthPlastic") return line.mode === "AREA" && sameBasis(line.widthBasis, "Phủ bì nhựa");\n  if (key === "widthCut" || key === "area" || key === "leafCount") return line.mode === "AREA";\n  return false;\n}\nfunction exportCellValue(line: SaleLine, key: ColumnKey): string {\n  if (key === "itemCode") return line.itemName || line.itemCode;\n  if (key === "color") return line.color;\n  if (key === "rayType") return line.rayType;\n  if (key === "thickness") return line.thickness;\n  if (key === "height") return line.mode === "HEIGHT" ? line.height : "";\n  if (key === "width") return line.mode === "WIDTH" ? line.width : "";\n  const semantic = key === "heightClear" ? semanticHeightValue(line, "Cao lọt lòng")\n    : key === "heightCover" ? semanticHeightValue(line, "Cao phủ bì")\n    : key === "heightMesh" ? semanticHeightValue(line, "Cao lưới")\n    : key === "widthClear" ? semanticWidthValue(line, "Rộng lọt lòng")\n    : key === "widthRay" ? semanticWidthValue(line, "Phủ bì ray")\n    : key === "widthPlastic" ? semanticWidthValue(line, "Phủ bì nhựa")\n    : key === "widthCut" ? semanticWidthValue(line, "Rộng cắt lá")\n    : null;\n  if (semantic != null) return String(semantic);\n  if (key === "area") return areaPerSet(line) == null ? "" : String(areaPerSet(line));\n  if (key === "leafCount") return formulaNumber(line.formula?.total_leaf_count) == null ? "" : String(line.formula?.total_leaf_count);\n  if (key === "qty") return line.qty;\n  if (key === "rate") return line.rate == null ? "" : String(line.rate);\n  if (key === "discount") return line.discountPct;\n  if (key === "uom") return line.uom;\n  if (key === "amount") return line.rate == null ? "" : String(previewNetAmount(line));\n  return "";\n}\n''',
          'semantic dimension helpers')

          s = replace_once(s,
          '''    mode: "QUANTITY",\n    color: "",''',
          '''    mode: "QUANTITY",\n    rayType: "",\n    rayOptions: [],\n    color: "",''',
          'newLine ray defaults')

          s = replace_once(s,
          '''  const salesUom = normalize(item.default_sales_uom ?? item.stock_uom).replaceAll(" ", "");\n\n  if (code.startsWith("RAY-")''',
          '''  const salesUom = normalize(item.default_sales_uom ?? item.stock_uom).replaceAll(" ", "");\n\n  if (inventory === "hàng thường") return "QUANTITY";\n  if (code.startsWith("RAY-")''',
          'quantity inventory precedence')

          s = replace_once(s,
          '''  const [vatPct, setVatPct] = useState("");\n  const [vatAccount, setVatAccount] = useState("");\n  const [surcharge, setSurcharge] = useState("");\n  const [surchargeAccount, setSurchargeAccount] = useState("");''',
          '''  const [vatPct, setVatPct] = useState("");''',
          'remove accounting/surcharge state')

          s = sub_once(s,
          r'  const orderedColumns = useMemo\(.*?\n  const columnWidth = \(column: ColumnDef\) => columnWidths\[column.key\] \?\? column.width;',
          '''  const orderedColumns = useMemo(() => columnOrder.map((key) => COLUMNS.find((column) => column.key === key)).filter((column): column is ColumnDef => Boolean(column)), [columnOrder]);\n  const canonicalGroup = canonicalCustomerGroup(customer.group);\n  const formulaGroup = formulaCustomerGroup(canonicalGroup);\n  const visibleColumns = useMemo(() => orderedColumns.filter((column) => !hiddenColumns.includes(column.key) && (CORE_COLUMNS.has(column.key) || lines.some((line) => columnApplies(line, column.key)))), [hiddenColumns, lines, orderedColumns]);\n  const columnLabel = (column: ColumnDef) => column.label;\n  const columnWidth = (column: ColumnDef) => columnWidths[column.key] ?? column.width;''',
          'auto column visibility')

          s = sub_once(s,
          r'  useEffect\(\(\) => \{\n    const name = customer\.name\.trim\(\);.*?\n  \}, \[adapter, customer\.name\]\);\n\n  const patchLine',
          '''  useEffect(() => {\n    const name = customer.name.trim();\n    if (!name) {\n      setCustomer({ name: "", group: "", phone: "", address: "" });\n      setPriceList("");\n      setPriceListError("");\n      return;\n    }\n    let active = true;\n    void adapter.getDoc("Customer", name).then(({ doc }) => {\n      if (!active) return;\n      setCustomer((current) => ({\n        ...current,\n        group: canonicalCustomerGroup(doc.price_group ?? doc.customer_group ?? ""),\n        phone: String(doc.phone ?? doc.mobile_no ?? "").trim(),\n        address: String(doc.install_address ?? doc.address ?? "").trim(),\n      }));\n    }).catch((error) => { if (active) setGlobalError(adapter.mapError(error).message); });\n    return () => { active = false; };\n  }, [adapter, customer.name]);\n\n  useEffect(() => {\n    if (!customer.name || !["Đại lý", "Bán lẻ", "Nhà thầu"].includes(canonicalGroup)) {\n      setPriceList("");\n      setPriceListError(canonicalGroup ? `Chưa hỗ trợ Bảng giá ${canonicalGroup}.` : "");\n      return;\n    }\n    let active = true;\n    void (async () => {\n      const rows = await adapter.getList("Price List", {\n        fields: ["name", "price_list_name", "disabled"], filters: [["disabled", "=", 0]], orderBy: "name asc", pageLength: 200,\n      }).catch(() => [] as Doc[]);\n      const names = rows.map((row) => String(row.name ?? row.price_list_name ?? "").trim()).filter(Boolean);\n      const matching = names.filter((name) => priceListMatchesGroup(name, canonicalGroup));\n      let preferred = "";\n      try {\n        const { doc } = await adapter.getDoc("Customer", customer.name);\n        preferred = String(doc.default_price_list ?? doc.selling_price_list ?? doc.price_list ?? "").trim();\n      } catch { /* customer hydration already reports its own error */ }\n      const resolved = preferred && priceListMatchesGroup(preferred, canonicalGroup) && names.includes(preferred) ? preferred : matching[0] ?? "";\n      if (!active) return;\n      setPriceList(resolved);\n      setPriceListError(resolved ? "" : `Chưa cấu hình Bảng giá ${canonicalGroup}.`);\n    })();\n    return () => { active = false; };\n  }, [adapter, canonicalGroup, customer.name]);\n\n  const patchLine''',
          'customer and price list resolution')

          s = replace_once(s,
          '''  const refreshMeasurementBasis = async (index: number, itemCode: string) => {\n    if (!itemCode || !["Đại lý", "Lẻ"].includes(canonicalGroup)) return;''',
          '''  const refreshMeasurementBasis = async (index: number, itemCode: string, requestedRay = "") => {\n    if (!itemCode || !formulaGroup) return;''',
          'measurement function signature')
          s = replace_once(s, 'customer_group: canonicalGroup,\n        sales_mode: "Trọn bộ",', 'customer_group: formulaGroup,\n        sales_mode: "Trọn bộ",\n        ...(requestedRay ? { ray_type: requestedRay } : {}),', 'measurement formula group')
          s = replace_once(s,
          '''      const rawDefaultDiscount = Number(context.default_discount_pct ?? 0);\n      const defaultDiscount = Number.isFinite(rawDefaultDiscount) && rawDefaultDiscount > 0 ? String(rawDefaultDiscount) : "";\n      if (!nextWidthBasis || !nextHeightBasis) return;''',
          '''      const rawDefaultDiscount = Number(context.default_discount_pct ?? 0);\n      const defaultDiscount = Number.isFinite(rawDefaultDiscount) && rawDefaultDiscount > 0 ? String(rawDefaultDiscount) : "";\n      const rayOptions = [...new Set((context.ray_options ?? []).map((value) => String(value ?? "").trim()).filter(Boolean))];\n      const resolvedRay = requestedRay || String(context.ray_type ?? "").trim() || (rayOptions.length === 1 ? rayOptions[0]! : "");\n      if (!nextWidthBasis || !nextHeightBasis) return;''',
          'measurement ray context')
          s = replace_once(s,
          '''          widthBasis: nextWidthBasis,\n          heightBasis: nextHeightBasis,''',
          '''          widthBasis: nextWidthBasis,\n          heightBasis: nextHeightBasis,\n          rayType: resolvedRay,\n          rayOptions,''',
          'measurement ray patch')

          s = replace_once(s,
          '''  const refreshContext = async (index: number, itemCode: string, requestedUom = "") => {\n    if (!itemCode) return;\n    try {''',
          '''  const refreshContext = async (index: number, itemCode: string, requestedUom = "") => {\n    if (!itemCode) return;\n    if (!priceList) {\n      patchLine(index, { rate: null, error: canonicalGroup ? `Chưa cấu hình Bảng giá ${canonicalGroup}.` : "Cần chọn Loại khách để xác định bảng giá." });\n      return;\n    }\n    try {''',
          'fail closed price context')
          s = replace_once(s,
          '''        ...(priceList ? { price_list: priceList } : {}),''',
          '''        price_list: priceList,''',
          'explicit price list')
          s = replace_once(s,
          '''        error: context.price_missing || context.rate == null ? String(context.price_error ?? "Chưa có đơn giá bán theo ĐVT đã chọn.") : String(context.stock_read_error ?? ""),''',
          '''        error: context.price_missing || context.rate == null ? `Chưa có giá ${canonicalGroup || priceList} cho mặt hàng ${itemCode}.` : String(context.stock_read_error ?? ""),''',
          'clear missing price error')

          s = replace_once(s,
          '''      itemCode, itemName: "", itemGroup: "", doorType: "", mode: "QUANTITY",\n      color: "", requireColor: false,''',
          '''      itemCode, itemName: "", itemGroup: "", doorType: "", mode: "QUANTITY",\n      rayType: "", rayOptions: [], color: "", requireColor: false,''',
          'item reset ray')
          s = replace_once(s, 'requireColor = checked(profile.require_color);', 'requireColor = mode !== "QUANTITY" && checked(profile.require_color);', 'quantity color fail-safe')
          s = replace_once(s,
          '''        mode,\n        requireColor,''',
          '''        mode,\n        rayType: "",\n        rayOptions: [],\n        requireColor,''',
          'item patch ray')

          s = replace_once(s,
          '''  const changeUom = async (index: number, uom: string) => {\n    const line = lines[index];\n    if (!line?.itemCode) return;\n    patchLine(index, { uom, rate: null, stockQty: null, error: "" });\n    await refreshContext(index, line.itemCode, uom);\n  };''',
          '''  const changeUom = async (index: number, uom: string) => {\n    const line = lines[index];\n    if (!line?.itemCode) return;\n    patchLine(index, { uom, rate: null, stockQty: null, error: "" });\n    await refreshContext(index, line.itemCode, uom);\n  };\n\n  const changeRay = async (index: number, rayType: string) => {\n    const line = lines[index];\n    if (!line?.itemCode) return;\n    patchLine(index, { rayType, formula: null, stockShort: null, stockMessage: "", error: "" });\n    await refreshMeasurementBasis(index, line.itemCode, rayType);\n  };''',
          'ray change handler')

          s = replace_once(s,
          '''  useEffect(() => {\n    if (!["Đại lý", "Lẻ"].includes(canonicalGroup)) return;\n    lines.forEach((line, index) => { if (line.itemCode && line.mode === "AREA") void refreshMeasurementBasis(index, line.itemCode); });\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [canonicalGroup]);''',
          '''  useEffect(() => {\n    if (!formulaGroup) return;\n    lines.forEach((line, index) => { if (line.itemCode && line.mode === "AREA") void refreshMeasurementBasis(index, line.itemCode, line.rayType); });\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [formulaGroup]);''',
          'group measurement refresh')
          s = replace_once(s,
          '''    customerGroup: canonicalGroup,\n    deliveryDate,\n    lines: lines.map((line) => ({ itemCode: line.itemCode, mode: line.mode, color: line.color, height: line.height, heightBasis: line.heightBasis, width: line.width, widthBasis: line.widthBasis, qty: line.qty, warehouse: line.warehouse })),\n  }), [canonicalGroup, deliveryDate, lines]);''',
          '''    customerGroup: formulaGroup,\n    deliveryDate,\n    lines: lines.map((line) => ({ itemCode: line.itemCode, mode: line.mode, rayType: line.rayType, color: line.color, height: line.height, heightBasis: line.heightBasis, width: line.width, widthBasis: line.widthBasis, qty: line.qty, warehouse: line.warehouse })),\n  }), [deliveryDate, formulaGroup, lines]);''',
          'calculation fingerprint')
          s = replace_once(s,
          '''        if (line.mode !== "AREA" || !line.itemCode || !positive(line.height) || !positive(line.width) || !integerPositive(line.qty) || !["Đại lý", "Lẻ"].includes(canonicalGroup)) {''',
          '''        if (line.mode !== "AREA" || !line.itemCode || !positive(line.height) || !positive(line.width) || !integerPositive(line.qty) || !formulaGroup) {''',
          'formula guard')
          # Replace only the full-calculation occurrence left after the basis-only replacement.
          s = replace_once(s,
          '''            customer_group: canonicalGroup,\n            sales_mode: "Trọn bộ",\n            ...(line.widthBasis ? { width_input_basis: line.widthBasis } : {}),''',
          '''            customer_group: formulaGroup,\n            sales_mode: "Trọn bộ",\n            ...(line.rayType ? { ray_type: line.rayType } : {}),\n            ...(line.widthBasis ? { width_input_basis: line.widthBasis } : {}),''',
          'full formula group/ray')

          s = sub_once(s,
          r'  const taxableTotal = Math\.max\(0, grossTotal - totalDiscount\);\n  const vatRate = .*?\n  const total = taxableTotal \+ totalVat \+ totalSurcharge;',
          '''  const taxableTotal = Math.max(0, grossTotal - totalDiscount);\n  const vatRate = vatPct.trim() ? decimal(vatPct) : 0;\n  const totalVat = Number.isFinite(vatRate) && vatRate > 0 ? taxableTotal * vatRate / 100 : 0;\n  const total = taxableTotal + totalVat;''',
          'commercial totals')

          s = replace_once(s,
          '''    if (!["Đại lý", "Lẻ"].includes(canonicalGroup)) out.push("Cần chọn Loại khách Đại lý/Khách lẻ.");\n    if (!currency) out.push("Chưa xác định tiền tệ bán.");''',
          '''    if (!["Đại lý", "Bán lẻ", "Nhà thầu"].includes(canonicalGroup)) out.push("Cần chọn Loại khách Đại lý/Bán lẻ/Nhà thầu.");\n    if (!currency) out.push("Chưa xác định tiền tệ bán.");\n    if (customer.name && canonicalGroup && !priceList) out.push(priceListError || `Chưa cấu hình Bảng giá ${canonicalGroup}.`);''',
          'customer/price blockers')
          s = sub_once(s,
          r'    if \(vatPct\.trim\(\).*?\n    if \(Number\.isFinite\(surchargeValue\).*?\n',
          '''    if (vatPct.trim() && (!Number.isFinite(vatRate) || vatRate < 0 || vatRate > 100)) out.push("VAT phải từ 0 đến 100%.");\n''',
          'remove financial account/surcharge blockers')
          s = sub_once(s,
          r'  \}, \[canonicalGroup, company, currency, customer\.name, deliveryDate, lines, surcharge, surchargeAccount, surchargeValue, transactionDate, vatAccount, vatPct, vatRate\]\);',
          '''  }, [canonicalGroup, company, currency, customer.name, deliveryDate, lines, priceList, priceListError, transactionDate, vatPct, vatRate]);''',
          'blocker dependencies')

          s = sub_once(s,
          r'  const buildTaxes = \(\): Record<string, unknown>\[\] => \{.*?\n  \};',
