ion value={line.thickness}>{line.thickness} mm</option> : null}{thicknessOptions.map((value) => <option key={value} value={value}>{value} mm</option>)}</select></div> : null}\n    {line.mode === "HEIGHT" || line.mode === "AREA" ? <div className="grid gap-1.5"><Label>{line.mode === "AREA" ? heightBasisTitle(line.heightBasis) : "Dài ray"} (m)</Label><Input value={line.height} disabled={submitted} onChange={(event) => patchLine(index, { height: event.target.value, formula: null })} /></div> : null}\n    {line.mode === "WIDTH" || line.mode === "AREA" ? <div className="grid gap-1.5"><Label>{line.mode === "AREA" ? widthBasisTitle(line.widthBasis) : "Dài trục"} (m)</Label><Input value={line.width} disabled={submitted} onChange={(event) => patchLine(index, { width: event.target.value, formula: null })} /></div> : null}\n    {line.mode === "AREA" && formulaNumber(line.formula?.cover_height_m) != null && !sameBasis(line.heightBasis, "Cao phủ bì") ? <div className="grid gap-1.5"><Label>Cao PB (m)</Label><Input value={number(line.formula?.cover_height_m, 3)} readOnly /></div> : null}\n    {line.mode === "AREA" && formulaNumber(line.formula?.cut_width_m) != null ? <div className="grid gap-1.5"><Label>Rộng cắt lá (m)</Label><Input value={number(line.formula?.cut_width_m, 3)} readOnly /></div> : null}\n    {line.mode === "AREA" ? <div className="grid gap-1.5"><Label>DT (m²)</Label><Input value={areaPerSet(line) == null ? "" : number(areaPerSet(line), 3)} readOnly /></div> : null}\n    {line.mode === "AREA" && formulaNumber(line.formula?.total_leaf_count) != null ? <div className="grid gap-1.5"><Label>Số lá</Label><Input value={number(line.formula?.total_leaf_count, 2)} readOnly /></div> : null}\n    <div className="grid gap-1.5"><Label>SL *</Label><Input value={line.qty} disabled={submitted} onChange={(event) => patchLine(index, { qty: event.target.value, formula: null })} /></div>\n    <div className="grid gap-1.5"><Label>Đơn giá</Label><Input value={line.rate == null ? "" : mone