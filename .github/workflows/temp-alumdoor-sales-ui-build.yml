name: TEMP AlumDoor Sales UI Build
on:
  push:
    branches: [ui/alumdoor-sales-header-compact]
    paths: [.github/workflows/temp-alumdoor-sales-ui-build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/alumdoor-sales-header-compact
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build MetaForge
        run: pnpm --filter metaforge run build
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD -- client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
