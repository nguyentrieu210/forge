name: Sentrux native screen fold apply

on:
  push:
    branches:
      - agent/sentrux-convergence-20260816

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip sentrux-native-screen]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
          sentrux --version

      - name: Capture baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-before.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-before.txt | tail -1 | grep -Eo '[0-9]+')
          test -n "$QUALITY"
          echo "quality=$QUALITY" >> "$GITHUB_OUTPUT"

      - name: Fold public ScreenView boundary
        run: node scripts/sentrux-fold-native-screen-boundary.mjs

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate views input-table contract
        run: pnpm --filter @metaforge/views run test:action-input-table

      - name: Build runtime production bundle
        run: pnpm --filter runtime run build

      - name: Sentrux regression gate
        run: sentrux gate .

      - name: Require architecture improvement
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-after.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-after.txt | tail -1 | grep -Eo '[0-9]+')
          test -n "$QUALITY"
          BEFORE='${{ steps.before.outputs.quality }}'
          if [ "$QUALITY" -le "$BEFORE" ]; then
            echo "Sentrux score did not increase: $BEFORE -> $QUALITY"
            exit 1
          fi
          echo "Sentrux score increased: $BEFORE -> $QUALITY"

      - name: Commit validated fold
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sentrux
          git rm scripts/sentrux-fold-native-screen-boundary.mjs
          git rm .github/workflows/sentrux-native-screen-fold-apply.yml
          git config user.name "sentrux-refactor-bot"
          git config user.email "sentrux-refactor-bot@users.noreply.github.com"
          git add -A client/packages/views client/apps/runtime/vite.config.ts
          git commit -m "refactor(views): fold native screen boundary [skip sentrux-native-screen]"
          git push origin HEAD:agent/sentrux-convergence-20260816
