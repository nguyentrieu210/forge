name: GRID-03 AlumDoor Metadata Materialize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: grid-03-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'agent/grid-03-alumdoor-meta-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact GRID-03 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply GRID-03 source patch
        working-directory: server
        run: node scripts/apply-grid-03-alumdoor-meta.mjs

      - name: Regenerate AlumDoor V2 brief
        working-directory: server
        run: node scripts/build-alumdoor-v2-brief.mjs

      - name: Verify child-grid metadata contract
        working-directory: server
        run: node --test tests/alumdoor-child-presentation.test.mjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit generated source and brief when changed
        shell: bash
        run: |
          git add server/scripts/build-alumdoor-v2-brief.mjs server/briefs/alumdoor-v2.json
          if git diff --cached --quiet; then
            echo "GRID-03 source and generated brief already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(grid-03): materialize AlumDoor child-grid metadata [grid03-materialized]"
          git push origin HEAD:${{ github.head_ref }}
