name: Sentrux 10k convergence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-10k-20260815

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
          sentrux --version

      - name: Capture baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-before.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-before.txt | tail -1 | grep -Eo '[0-9]+')
          test -n "$QUALITY"
          echo "quality=$QUALITY" >> "$GITHUB_OUTPUT"

      - name: Move reproducible upstream snapshots out of first-party source graph
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --cached --ignore-unmatch upstream
          if ! grep -qxF '/upstream/' .gitignore; then
            printf '\n# Reproducible source-exact checkouts; fetch with server source:fetch when needed\n/upstream/\n' >> .gitignore
          fi
          # Simulate a clean checkout: production/typecheck must work with no upstream snapshot present.
          rm -rf upstream

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck first-party server
        run: pnpm run server:typecheck

      - name: Verify source-exact parser without cached upstream checkout
        run: pnpm --dir server run source:test

      - name: Sentrux regression gate
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate . | tee /tmp/sentrux-gate.txt

      - name: Diagnose remaining first-party cycles and god files
        shell: bash
        run: |
          set -u
          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          max_cc = 25
          EOF
          sentrux check . 2>&1 | tee /tmp/sentrux-diagnostics.txt || true
          rm -f .sentrux/rules.toml

      - name: Require material score increase
        id: after
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-after.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-after.txt | tail -1 | grep -Eo '[0-9]+')
          test -n "$QUALITY"
          BEFORE='${{ steps.before.outputs.quality }}'
          DELTA=$((QUALITY - BEFORE))
          echo "quality=$QUALITY" >> "$GITHUB_OUTPUT"
          echo "delta=$DELTA" >> "$GITHUB_OUTPUT"
          if [ "$QUALITY" -le "$BEFORE" ]; then
            echo "Sentrux score did not increase: $BEFORE -> $QUALITY"
            exit 1
          fi
          if [ "$DELTA" -lt 250 ]; then
            echo "Increase is too small for a repository-scope change: $BEFORE -> $QUALITY (+$DELTA)"
            exit 1
          fi
          echo "Sentrux score materially increased: $BEFORE -> $QUALITY (+$DELTA)"

      - name: Commit validated source-scope cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sentrux
          rm -f .github/workflows/sentrux-10k.yml
          git config user.name "sentrux-refactor-bot"
          git config user.email "sentrux-refactor-bot@users.noreply.github.com"
          git add -A
          git commit -m "refactor(repo): keep reproducible upstream sources out of first-party graph [skip sentrux-10k]"
          git push origin HEAD:agent/sentrux-10k-20260815
