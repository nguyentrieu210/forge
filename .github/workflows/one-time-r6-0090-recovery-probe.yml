name: One-time R6 0090 Recovery Probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-r6-0090-recovery-probe.yml"]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_SHA: fedb2dd7c9abab71fedc4b747ef1d41b6db44ed5
      TENANT: alu
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify exact 0090 postcondition and repair bookkeeping only if complete
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { d1Query, wrangler } from './server/scripts/wrangler-cli.mjs';
          import { findTenantDatabaseId, removeTenantConfig, writeTenantConfig } from './server/scripts/tenant-wrangler.mjs';
          const tenant=process.env.TENANT, id=findTenantDatabaseId(tenant,wrangler);
          if(!id) throw new Error('missing cloudforge-alu');
          const cfg=writeTenantConfig({tenant,databaseId:id});
          const db={name:`cloudforge-${tenant}`,id,configArg:cfg.relativeConfig};
          const expected=[
            'tt99_registry_insert_guard','tt99_registry_update_guard','tt99_registry_immutable_update_guard','tt99_registry_immutable_delete_guard',
            'vn_tax_ruleset_insert_guard','vn_tax_ruleset_update_guard','vn_tax_ruleset_immutable_update_guard','vn_tax_ruleset_immutable_delete_guard'
          ];
          try {
            const rows=d1Query(db,`SELECT name FROM sqlite_schema WHERE type='trigger' AND name IN (${expected.map(x=>`'${x}'`).join(',')}) ORDER BY name`);
            const names=rows.map(x=>String(x.name));
            const before=d1Query(db,"SELECT COUNT(*) total FROM d1_migrations WHERE name='0090_vn_accounting_statutory_registry_integrity.sql'")[0]?.total??0;
            const complete=expected.every(x=>names.includes(x))&&names.length===expected.length;
            if(!complete) throw new Error(`0090 postcondition incomplete triggers=${names.length}/8; refusing bookkeeping repair`);
            let mutation='NONE';
            if(Number(before)===0){
              d1Query(db,"INSERT INTO d1_migrations (name) VALUES ('0090_vn_accounting_statutory_registry_integrity.sql')");
              mutation='BOOKKEEPING_RECOVERY_ONLY';
            }
            const after=Number(d1Query(db,"SELECT COUNT(*) total FROM d1_migrations WHERE name='0090_vn_accounting_statutory_registry_integrity.sql'")[0]?.total??0);
            const evidence={format:'forge-r6-migration-0090-recovery/v1',candidate_sha:process.env.TARGET_SHA,observed_at:new Date().toISOString(),tenant,expected_triggers:expected,observed_triggers:names,bookkeeping_before:Number(before),bookkeeping_after:after,mutation,status:complete&&after===1?'PASS':'BLOCKED'};
            writeFileSync(path.join(process.env.RUNNER_TEMP,'r6-0090-recovery.json'),JSON.stringify(evidence,null,2)+'\n');
            if(evidence.status!=='PASS') throw new Error('0090 recovery did not converge');
          } finally { removeTenantConfig(cfg.configPath); }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r6-0090-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/r6-0090-recovery.json
          if-no-files-found: warn
      - name: Record evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path');let data=null;try{data=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'r6-0090-recovery.json'),'utf8'))}catch{};const payload={status:'${{ steps.recover.outcome }}'==='success'?'PASS':'BLOCKED',candidate_sha:process.env.TARGET_SHA,workflow_run_id:String(context.runId),evidence:data};const p='deploy-evidence/r6-0090-recovery-fedb2dd7c9ab.json';let sha;try{const r=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:'main'});if(!Array.isArray(r.data))sha=r.data.sha}catch(e){if(e.status!==404)throw e}await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:p,message:`ops(r6): record 0090 recovery ${payload.status}`,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),branch:'main',...(sha?{sha}:{})});
      - name: Enforce recovery PASS
        if: always()
        run: test '${{ steps.recover.outcome }}' = success
