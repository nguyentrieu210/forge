name: Observe alu FIFO release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: observe-production-alu
  cancel-in-progress: true

jobs:
  observe:
    if: ${{ github.head_ref == 'release/alu-fifo-core-20260731' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      RELEASE_NOT_BEFORE: '2026-07-30T18:40:00Z'
      EVIDENCE_DIR: ${{ runner.temp }}/alu-release-observation

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for production release evidence
        run: node .github/scripts/observe-alu-release.mjs

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-release-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-release-observation/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment release result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = process.env.EVIDENCE_DIR + '/summary.md';
            const summary = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '# alu FIFO core release\n\nRelease observation failed before evidence converged.';
            const marker = '<!-- alu-fifo-core-release -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${summary}\n[Workflow evidence](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
