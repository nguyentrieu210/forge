name: Observe alu FIFO release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: observe-production-alu
  cancel-in-progress: true

jobs:
  observe:
    if: github.event.pull_request.head.ref == 'release/alu-fifo-core-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      SCRIPT_NAME: cloudforge-tenant-alu
      RELEASE_NOT_BEFORE: 2026-07-30T18:40:00Z
      EVIDENCE_DIR: ${{ runner.temp }}/alu-release-observation

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for production release evidence
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          mkdir -p "$EVIDENCE_DIR"

          passed=false
          for attempt in $(seq 1 45); do
            echo "Observation attempt $attempt/45"

            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/deployments" \
              --output "$EVIDENCE_DIR/deployments.json" || true

            (
              cd server
              pnpm exec wrangler d1 execute cloudforge-alu \
                --remote --json \
                --command "SELECT name FROM d1_migrations WHERE name IN ('0027_purchase_receipt_allocation.sql','0028_purchase_allocation_cancel_guard.sql','0029_purchase_allocation_rollout.sql') ORDER BY name;" \
                > "$EVIDENCE_DIR/migrations.json"
              pnpm exec wrangler d1 execute cloudforge-alu \
                --remote --json \
                --command "SELECT enabled, unresolved_count FROM purchase_allocation_rollout_state;" \
                > "$EVIDENCE_DIR/rollout.json"
            ) || true

            HEALTH_STATUS="$(curl --silent --show-error --output "$EVIDENCE_DIR/health.json" --write-out '%{http_code}' https://alu.kairo.vn/health || true)"
            BOOT_STATUS="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' https://alu.kairo.vn/api/method/metaforge.api.get_boot || true)"

            if HEALTH_STATUS="$HEALTH_STATUS" BOOT_STATUS="$BOOT_STATUS" node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const dir = process.env.EVIDENCE_DIR;
            const parseWrangler = (name) => {
              const text = fs.existsSync(`${dir}/${name}`) ? fs.readFileSync(`${dir}/${name}`, 'utf8') : '';
              const start = text.indexOf('[');
              return start >= 0 ? JSON.parse(text.slice(start)) : [];
            };
            const deploymentsRaw = fs.existsSync(`${dir}/deployments.json`)
              ? JSON.parse(fs.readFileSync(`${dir}/deployments.json`, 'utf8'))
              : {};
            const result = deploymentsRaw.result;
            const deployments = Array.isArray(result) ? result : (result?.deployments ?? []);
            const latest = deployments[0];
            const deploymentFresh = Boolean(latest?.created_on)
              && new Date(latest.created_on).getTime() >= new Date(process.env.RELEASE_NOT_BEFORE).getTime();

            const migrationPayload = parseWrangler('migrations.json');
            const migrationRows = migrationPayload[0]?.results ?? [];
            const names = new Set(migrationRows.map((row) => row.name));
            const migrationsOk = [
              '0027_purchase_receipt_allocation.sql',
              '0028_purchase_allocation_cancel_guard.sql',
              '0029_purchase_allocation_rollout.sql',
            ].every((name) => names.has(name));

            const rolloutPayload = parseWrangler('rollout.json');
            const rolloutRows = rolloutPayload[0]?.results ?? [];
            const rolloutDisabled = rolloutRows.length === 0
              || rolloutRows.every((row) => Number(row.enabled) !== 1);

            const healthOk = process.env.HEALTH_STATUS === '200';
            const bootOk = process.env.BOOT_STATUS === '403';
            const summary = {
              deployment_id: latest?.id ?? null,
              deployment_created_on: latest?.created_on ?? null,
              deployment_fresh: deploymentFresh,
              migrations_ok: migrationsOk,
              rollout_disabled: rolloutDisabled,
              health_status: process.env.HEALTH_STATUS,
              guest_boot_status: process.env.BOOT_STATUS,
              passed: deploymentFresh && migrationsOk && rolloutDisabled && healthOk && bootOk,
            };
            fs.writeFileSync(`${dir}/summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
            console.log(summary);
            process.exit(summary.passed ? 0 : 1);
            NODE
            then
              passed=true
              break
            fi

            sleep 20
          done

          if [ "$passed" != true ]; then
            echo "Production release evidence did not converge in time." >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/summary.json`, 'utf8'));
          const lines = [
            '# alu FIFO core release',
            '',
            `- Deployment ID: \`${s.deployment_id}\``,
            `- Deployment time: \`${s.deployment_created_on}\``,
            `- Migrations 0027–0029: ${s.migrations_ok ? 'PASS' : 'FAIL'}`,
            `- FIFO rollout disabled: ${s.rollout_disabled ? 'PASS' : 'FAIL'}`,
            `- Health: ${s.health_status}`,
            `- Guest boot: ${s.guest_boot_status}`,
            '',
            `**Overall: ${s.passed ? 'PASS' : 'FAIL'}**`,
          ];
          fs.writeFileSync(`${process.env.EVIDENCE_DIR}/summary.md`, `${lines.join('\n')}\n`);
          NODE
          cat "$EVIDENCE_DIR/summary.md"

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-release-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-release-observation/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment release result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = process.env.EVIDENCE_DIR + '/summary.md';
            const summary = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '# alu FIFO core release\n\nRelease observation failed before evidence converged.';
            const marker = '<!-- alu-fifo-core-release -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${summary}\n[Workflow evidence](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
