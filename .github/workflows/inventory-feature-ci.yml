name: Inventory and Manufacturing CI

on:
  push:
    branches:
      - feat/inventory-manufacturing-item-catalog-20260731
  pull_request:
    paths:
      - "server/**"
      - "client/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "CURRENT_STATUS.md"
      - "NEXT_TASKS.md"
      - ".github/workflows/inventory-feature-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit, test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused Alumdoor catalog tests
        run: |
          pnpm --dir server run build
          node --test server/tests/alumdoor-catalog-audit.test.mjs server/tests/alumdoor-item-validator.test.mjs

      - name: Run server SQL tests
        run: pnpm --dir server run test:sql

      - name: Validate authoritative briefs
        run: pnpm --dir server run brief:check

      - name: Run frontend lint
        run: pnpm --filter metaforge run lint

      - name: Run repository tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build repository
        run: pnpm build
