name: Inventory and Manufacturing CI

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit, test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Inventory and Manufacturing scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          inventory=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
            if ! grep -Eiq '^(server/briefs/alumdoor[^/]*\.json$|server/(apps-src|packages|tests|scripts|migrations)/.*(inventory|manufactur|warehouse|stock|batch|bom|work-order|catalog|item-model|item-validator)|client/.*(inventory|manufactur|warehouse|stock|batch|bom|work-order)|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/inventory-feature-ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
              inventory=false
            fi
          fi
          cat "$RUNNER_TEMP/changed-files.txt" 2>/dev/null || true
          echo "inventory=$inventory" >> "$GITHUB_OUTPUT"

      - name: Unrelated fast path
        if: steps.scope.outputs.inventory != 'true'
        run: echo "No Inventory or Manufacturing files changed."

      - name: Install pnpm
        if: steps.scope.outputs.inventory == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        if: steps.scope.outputs.inventory == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.inventory == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build server
        if: steps.scope.outputs.inventory == 'true'
        run: pnpm --filter cloudforge run build

      - name: Run focused Inventory and Manufacturing regressions
        if: steps.scope.outputs.inventory == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find server/tests -maxdepth 1 -type f \( \
            -name 'alumdoor-catalog-*.test.mjs' -o \
            -name 'alumdoor-item-*.test.mjs' -o \
            -name '*inventory*.test.mjs' -o \
            -name '*manufactur*.test.mjs' -o \
            -name '*warehouse*.test.mjs' -o \
            -name '*stock*.test.mjs' -o \
            -name '*batch*.test.mjs' -o \
            -name '*bom*.test.mjs' -o \
            -name '*work-order*.test.mjs' \
          \) -print | sort -u)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

      - name: Validate authoritative briefs
        if: steps.scope.outputs.inventory == 'true'
        run: pnpm --dir server run brief:check

      - name: Generate redacted authoritative catalog audit
        if: steps.scope.outputs.inventory == 'true'
        shell: bash
        run: |
          set +e
          node server/scripts/audit-alumdoor-catalog.mjs \
            --brief server/briefs/alumdoor-v2.json \
            --redacted \
            --output "$RUNNER_TEMP/alumdoor-v2-catalog-audit.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          printf 'catalog_audit_exit=%s\n' "$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted catalog audit
        if: steps.scope.outputs.inventory == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: alumdoor-v2-catalog-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/alumdoor-v2-catalog-audit.json
          if-no-files-found: warn
          retention-days: 14
