name: Inventory and Manufacturing CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Inventory and Manufacturing gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter cloudforge run build

      - name: Run focused Inventory and Manufacturing regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find server/tests -maxdepth 1 -type f \( \
            -name 'alumdoor-catalog-*.test.mjs' -o \
            -name 'alumdoor-item-*.test.mjs' -o \
            -name '*inventory*.test.mjs' -o \
            -name '*manufactur*.test.mjs' -o \
            -name '*warehouse*.test.mjs' -o \
            -name '*stock*.test.mjs' -o \
            -name '*batch*.test.mjs' -o \
            -name '*bom*.test.mjs' -o \
            -name '*work-order*.test.mjs' \
          \) -print | sort -u)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

      - name: Validate authoritative briefs
        run: pnpm --dir server run brief:check
