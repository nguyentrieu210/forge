name: Inventory and Manufacturing CI

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: inventory-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect inventory scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Classify changed files
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const shared = [
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'server/package.json',
              '.github/workflows/inventory-feature-ci.yml',
            ];
            const inventoryPatterns = [
              /inventory/i,
              /manufactur/i,
              /warehouse/i,
              /stock-entry/i,
              /stock-ledger/i,
              /work-order/i,
              /bom/i,
              /alumdoor-catalog/i,
              /item-catalog/i,
              /^server\/apps-src\/alumdoor-worker\//,
              /^client\/packages\/views\//,
            ];
            const run = files.some(({ filename }) =>
              shared.includes(filename) || inventoryPatterns.some((pattern) => pattern.test(filename))
            );
            core.info(`Inventory scope: ${run}; files: ${files.map((file) => file.filename).join(', ')}`);
            core.setOutput('run', String(run));

  validate:
    name: Audit, test, typecheck and build
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused Alumdoor catalog tests
        run: |
          pnpm --dir server run build
          node --test server/tests/alumdoor-catalog-audit.test.mjs server/tests/alumdoor-catalog-warehouse-role.test.mjs server/tests/alumdoor-item-validator.test.mjs

      - name: Generate redacted authoritative catalog audit
        shell: bash
        run: |
          set +e
          node server/scripts/audit-alumdoor-catalog.mjs \
            --brief server/briefs/alumdoor-v2.json \
            --redacted \
            --output "$RUNNER_TEMP/alumdoor-v2-catalog-audit.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          printf 'catalog_audit_exit=%s\n' "$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted catalog audit
        uses: actions/upload-artifact@v4
        with:
          name: alumdoor-v2-catalog-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/alumdoor-v2-catalog-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Run server SQL tests
        run: pnpm --dir server run test:sql

      - name: Validate authoritative briefs
        run: pnpm --dir server run brief:check

      - name: Run frontend lint
        run: pnpm --filter metaforge run lint

      - name: Run repository tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build repository
        run: pnpm build
