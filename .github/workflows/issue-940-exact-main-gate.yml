name: Issue 940 Exact Main Gate

on:
  push:
    branches:
      - agent/alumdoor-sales-order-v2-complete

permissions:
  contents: write

jobs:
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[sales-v2-exact-main]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose exact-latest-main review stack locally
        run: |
          ORIGINAL=$(git rev-parse HEAD)
          echo "ORIGINAL=$ORIGINAL" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/alumdoor-v2-reproducible agent/alumdoor-tam-lien-ray-geometry
          echo "EXACT_MAIN=$(git rev-parse origin/main)"
          echo "REPRO=$(git rev-parse origin/agent/alumdoor-v2-reproducible)"
          echo "RAY=$(git rev-parse origin/agent/alumdoor-tam-lien-ray-geometry)"
          git merge --no-edit origin/main
          git merge --no-edit origin/agent/alumdoor-tam-lien-ray-geometry
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Focused Sales V2 regression
        run: node --test client/packages/views/tests/alumdoor-sales-order-v2-complete.test.mjs
      - name: Official generator two-pass zero diff
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cp server/briefs/alumdoor-v2.json /tmp/v2-first.json
          node server/scripts/build-alumdoor-v2-brief.mjs
          cmp -s /tmp/v2-first.json server/briefs/alumdoor-v2.json
          git diff --exit-code -- server/briefs/alumdoor-v2.json
      - name: Server build
        run: pnpm run server:build
      - name: Production ray regression
        run: node --test server/tests/sales-production-flow.test.mjs
      - name: Brief check
        run: pnpm --dir server run brief:check
      - name: Client typecheck
        run: pnpm --dir client run typecheck
      - name: Client production build
        run: pnpm --dir client run build
      - name: Diff hygiene
        run: git diff --check
      - name: Restore branch and remove temporary gate
        run: |
          git reset --hard "$ORIGINAL"
          rm .github/workflows/issue-940-exact-main-gate.yml
          git add .github/workflows/issue-940-exact-main-gate.yml
          git commit -m "ci(alumdoor): remove exact-main Sales V2 gate [sales-v2-exact-main]"
          git push origin HEAD:agent/alumdoor-sales-order-v2-complete
