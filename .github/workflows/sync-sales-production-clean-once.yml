name: Sync Sales Production Clean Once

on:
  push:
    branches:
      - feat/sales-order-production-flow-clean-20260801

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-order-production-flow-clean-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Cherry-pick verified feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git cherry-pick 08a7688ee3c1a330ecd2f332e505eda37089b205

      - name: Restore canonical brief formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('server/briefs/alumdoor.json'), Path('server/briefs/alumdoor-v2.json')]:
              parsed = json.loads(path.read_text())
              path.write_text(json.dumps(parsed, ensure_ascii=False, indent=1) + '\n')
          PY

      - name: Verify clean feature
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter cloudforge run build
          node --test \
            server/tests/door-formulas.test.mjs \
            server/tests/sales-production-flow.test.mjs \
            server/tests/sales-price-unicode-normalization.test.mjs
          pnpm --filter metaforge run typecheck

      - name: Commit clean tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-sales-production-clean-once.yml
          rm -f server/scripts/.sync-sales-production-trigger
          git add -A
          git diff --cached --check
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:feat/sales-order-production-flow-clean-20260801
