name: ALU Reason Master Production Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alu-reason-master-production-import.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ALU_REASON_MASTER_IMPORT to re-run the production import
        required: true
        type: string
      target_sha:
        description: Exact merged main SHA to import; defaults to selected ref SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-alu-reason-master-import
  cancel-in-progress: false

jobs:
  import:
    name: Import and verify canonical reason masters on ALU
    if: github.event_name == 'push' || inputs.confirm == 'ALU_REASON_MASTER_IMPORT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha || github.sha }}
      FORGE_ORIGIN: https://alu.kairo.vn
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}

    steps:
      - name: Checkout exact merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require target to be merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Refusing reason-master import: $TARGET_SHA is not merged into main."
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Require production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FORGE_ADMIN_USER" || { echo "Missing FORGE_ADMIN_USER/ALU_META_ADMIN_USER"; exit 1; }
          test -n "$FORGE_ADMIN_PASSWORD" || { echo "Missing FORGE_ADMIN_PASSWORD/ALU_META_ADMIN_PASSWORD"; exit 1; }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build installer runtime
        run: pnpm --filter cloudforge run build

      - name: Preflight canonical Alumdoor package
        working-directory: server
        run: node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run

      - name: Import canonical reason masters to production
        working-directory: server
        run: node scripts/forge-app.mjs briefs/alumdoor-v2.json --origin "$FORGE_ORIGIN" --admin "$FORGE_ADMIN_USER"

      - name: Verify exact live reason fixtures
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin = process.env.FORGE_ORIGIN.replace(/\/$/, '');
          const user = process.env.FORGE_ADMIN_USER;
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map();
          function store(response) {
            for (const value of response.headers.getSetCookie?.() ?? []) {
              const [pair] = value.split(';');
              const i = pair.indexOf('=');
              if (i > 0) jar.set(pair.slice(0, i).trim(), pair.slice(i + 1).trim());
            }
          }
          const cookie = () => [...jar].map(([k,v]) => `${k}=${v}`).join('; ');
          async function post(method, body) {
            const r = await fetch(`${origin}/api/method/${method}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', ...(jar.size ? { cookie: cookie() } : {}) },
              body: JSON.stringify(body ?? {}),
            });
            store(r);
            const text = await r.text();
            if (!r.ok) throw new Error(`${method} HTTP ${r.status}: ${text.slice(0, 300)}`);
            return text ? JSON.parse(text) : {};
          }
          async function list(doctype) {
            const fields = encodeURIComponent(JSON.stringify(['reason_code','reason_name','disabled']));
            const url = `${origin}/api/resource/${encodeURIComponent(doctype)}?fields=${fields}&limit_page_length=1000`;
            const r = await fetch(url, { headers: { cookie: cookie(), 'cache-control': 'no-cache' } });
            const text = await r.text();
            if (!r.ok) throw new Error(`${doctype} HTTP ${r.status}: ${text.slice(0, 300)}`);
            const parsed = JSON.parse(text);
            return parsed.data ?? parsed.message ?? [];
          }
          await post('login', { usr: user, pwd: password });
          const expectedCancel = ['GHI_NHAM_CHUNG_TU','LAP_LAI_CHUNG_TU','THAY_DOI_KE_HOACH','CAT_NHAM','KIEM_KE_SAI','KHAC'];
          const expectedVariance = ['SAI_SO_DEM','THO_CAT_SAI_KHONG_BAO','HAO_HUT','HU_HONG','LECH_CAN','SAI_NHAP_LIEU','KHAC'];
          const cancel = await list('Lý do huỷ');
          const variance = await list('Nguyên nhân chênh lệch');
          function assertExpected(label, rows, expected) {
            const active = new Map(rows.filter(r => Number(r.disabled ?? 0) === 0).map(r => [String(r.reason_code), r]));
            const missing = expected.filter(code => !active.has(code));
            if (missing.length) throw new Error(`${label} missing active codes: ${missing.join(', ')}`);
            console.log(`${label}_LIVE_PASS expected=${expected.length} total_rows=${rows.length}`);
          }
          assertExpected('CANCELLATION_REASON', cancel, expectedCancel);
          assertExpected('VARIANCE_REASON', variance, expectedVariance);
          NODE

      - name: Re-run installer to prove idempotence
        working-directory: server
        run: node scripts/forge-app.mjs briefs/alumdoor-v2.json --origin "$FORGE_ORIGIN" --admin "$FORGE_ADMIN_USER"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$FORGE_ORIGIN/health" >/dev/null
          echo "ALU_REASON_MASTER_IMPORT_PASS sha=$TARGET_SHA"
