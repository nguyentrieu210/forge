name: Purchase Final Apply

on:
  pull_request:
    types: [synchronize, reopened, edited]
    branches:
      - hotfix/alumdoor-print-list-delete

permissions:
  contents: write

concurrency:
  group: purchase-final-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-gate:
    if: github.head_ref == 'feat/purchase-receipt-complete-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout purchase branch
        uses: actions/checkout@v4
        with:
          ref: feat/purchase-receipt-complete-20260731
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/purchase-final-patch.00 .github/purchase-final-patch.01 > /tmp/purchase-final.patch.gz.b64
          base64 --decode /tmp/purchase-final.patch.gz.b64 | gzip --decompress > /tmp/purchase-final.patch
          echo 'ca710ba412485ad67031e206c463a6a26e0ebc61ab4b52e8408047dc0a54351e  /tmp/purchase-final.patch' | sha256sum --check
          git apply --check /tmp/purchase-final.patch
          git apply /tmp/purchase-final.patch

      - name: Remove temporary apply payload
        shell: bash
        run: |
          rm -f .github/purchase-final-patch.00
          rm -f .github/purchase-final-patch.01
          rm -f .github/workflows/purchase-final-apply.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Native UI and hook lint
        run: pnpm --filter metaforge run lint

      - name: Server unit tests
        run: pnpm --dir server run test:unit

      - name: Server SQL tests
        run: pnpm --dir server run test:sql

      - name: Client tests
        run: pnpm run client:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter e2e-forge exec playwright install --with-deps chromium

      - name: Purchase browser QA
        run: pnpm --filter e2e-forge exec playwright test --config playwright.purchase.config.ts

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(purchase): finish concurrency cancel and browser gates'
          git push origin HEAD:feat/purchase-receipt-complete-20260731
