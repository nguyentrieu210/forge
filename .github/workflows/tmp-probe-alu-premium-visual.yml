name: Temp Probe ALU Premium Visual

on:
  push:
    branches:
      - ops/probe-alu-premium-visual-20260803
    paths:
      - ".github/workflows/tmp-probe-alu-premium-visual.yml"

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: e18ffb1eb1d9a2d6146252a54094a87e6bf92e8b
    steps:
      - name: Probe exact production UI release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="ALU production has not converged to premium visual SHA"
          for i in $(seq 1 18); do
            body=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://alu.kairo.vn/release.json?probe=${GITHUB_RUN_ID}-${i}" || true)
            if printf '%s' "$body" | grep -Fq "$EXPECTED_SHA"; then
              state=success
              description="ALU production serves exact premium visual SHA"
              break
            fi
            sleep 10
          done
          payload=$(jq -nc --arg state "$state" --arg context "alu-premium-visual-production" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" -d "$payload" >/dev/null
          [ "$state" = success ]
