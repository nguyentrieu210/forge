name: Import Alumdoor Reason Masters Local

on:
  workflow_run:
    workflows:
      - Bootstrap Alumdoor Local C Drive
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  import-local-reasons:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]
    timeout-minutes: 20
    env:
      FORGE_LOCAL_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Run canonical Reason Master local import contract
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts\local-runner\run-local-import.mjs reason-master
          if ($LASTEXITCODE -ne 0) { throw "Reason Master execution contract failed with exit code $LASTEXITCODE" }
