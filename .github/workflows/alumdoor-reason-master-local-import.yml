name: Import Alumdoor Reason Masters Local

on:
  push:
    branches: [main]
    paths:
      - 'scripts/local-runner/**'
      - 'server/scripts/import-alumdoor-reason-master-local.mjs'
      - 'server/briefs/alumdoor-v2.fixtures.json'
      - '.github/workflows/alumdoor-reason-master-local-import.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  import-local-reasons:
    runs-on: [self-hosted]
    timeout-minutes: 20
    env:
      FORGE_LOCAL_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Run canonical Reason Master local import contract
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts\local-runner\run-local-import.mjs reason-master
          if ($LASTEXITCODE -ne 0) { throw "Reason Master execution contract failed with exit code $LASTEXITCODE" }
