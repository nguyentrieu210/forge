name: Cloudflare Preview QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-qa
  cancel-in-progress: false

jobs:
  preview-qa:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install Forge dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Forge with the repository's proven command
        run: pnpm build

      - name: Stage runtime assets for gateway
        run: node server/scripts/stage-client-bundle.mjs

      - name: Verify Cloudflare Actions credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub Actions has no Cloudflare API token secret."
            exit 1
          fi

      - name: Resolve Workers subdomain
        id: workers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            --output /tmp/workers-subdomain.json

          WORKERS_SUBDOMAIN="$(node -e '
            const response = require("/tmp/workers-subdomain.json");
            if (!response.success || !response.result?.subdomain) {
              console.error(JSON.stringify(response));
              process.exit(1);
            }
            process.stdout.write(response.result.subdomain);
          ')"

          echo "subdomain=$WORKERS_SUBDOMAIN" >> "$GITHUB_OUTPUT"
          echo "Workers subdomain resolved."

      - name: Enable gateway preview URLs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cloudforge-gateway/subdomain" \
            --output /tmp/gateway-subdomain.json

          node -e '
            const response = require("/tmp/gateway-subdomain.json");
            if (!response.success || !response.result?.previews_enabled) {
              console.error(JSON.stringify(response));
              process.exit(1);
            }
          '

      - name: Upload gateway preview version
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number || github.run_number }}"
          PREVIEW_ALIAS="pr-${PR_NUMBER}"
          PREVIEW_URL="https://${PREVIEW_ALIAS}-cloudforge-gateway.${{ steps.workers.outputs.subdomain }}.workers.dev"

          pnpm --dir server exec wrangler versions upload \
            --config apps/gateway-worker/wrangler.jsonc \
            --preview-alias "$PREVIEW_ALIAS" \
            --keep-vars 2>&1 | tee /tmp/gateway-preview.log

          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "alias=$PREVIEW_ALIAS" >> "$GITHUB_OUTPUT"
          echo "Preview: $PREVIEW_URL"

      - name: Wait for gateway preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "${{ steps.preview.outputs.url }}/health" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Gateway preview did not become healthy." >&2
          exit 1

      - name: Install Browser QA worker dependencies
        run: npm install --prefix qa/browser-worker --no-audit --no-fund

      - name: Deploy Browser QA worker
        id: qa_worker
        shell: bash
        run: |
          set -euo pipefail
          (
            cd qa/browser-worker
            npx wrangler deploy
          )

          QA_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$QA_TOKEN"
          printf '%s' "$QA_TOKEN" | (
            cd qa/browser-worker
            npx wrangler secret put QA_TOKEN
          )

          QA_URL="https://cloudforge-preview-qa.${{ steps.workers.outputs.subdomain }}.workers.dev"
          echo "url=$QA_URL" >> "$GITHUB_OUTPUT"
          echo "token=$QA_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Wait for QA worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "${{ steps.qa_worker.outputs.url }}/health" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "QA Worker did not become healthy." >&2
          exit 1

      - name: Run Cloudflare browser checks
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results/screenshots

          node -e 'const fs=require("node:fs"); fs.writeFileSync("/tmp/qa-request.json", JSON.stringify({url: process.argv[1], paths: ["/health"]}))' \
            "${{ steps.preview.outputs.url }}"

          curl --fail --silent --show-error \
            --retry 6 --retry-delay 3 --retry-all-errors \
            -H "Authorization: Bearer ${{ steps.qa_worker.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/qa-request.json \
            "${{ steps.qa_worker.outputs.url }}/run" \
            --output qa-results/raw.json

          STATUS="$(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const data = JSON.parse(fs.readFileSync('qa-results/raw.json', 'utf8'));
          const lines = [
            '# Cloudflare Preview QA',
            '',
            `Preview: ${data.previewUrl}`,
            '',
            '| Check | HTTP | Console | Page | Requests | Result |',
            '|---|---:|---:|---:|---:|---|',
          ];

          for (const result of data.results ?? []) {
            if (result.screenshotBase64) {
              const output = path.join('qa-results', 'screenshots', `${result.name}.png`);
              fs.writeFileSync(output, Buffer.from(result.screenshotBase64, 'base64'));
            }
            delete result.screenshotBase64;
            lines.push(`| ${result.name} | ${result.httpStatus} | ${(result.consoleErrors ?? []).length} | ${(result.pageErrors ?? []).length} | ${(result.requestFailures ?? []).length} | ${result.passed ? 'PASS' : 'FAIL'} |`);
          }

          lines.push('', data.passed ? '**Overall: PASS**' : '**Overall: FAIL**');
          fs.writeFileSync('qa-results/report.json', JSON.stringify(data, null, 2));
          fs.writeFileSync('qa-results/summary.md', `${lines.join('\n')}\n`);
          process.stdout.write(data.passed ? 'passed' : 'failed');
          NODE
          )"

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          cat qa-results/summary.md

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-qa-${{ github.event.pull_request.number || github.run_number }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment QA report on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const summary = fs.existsSync('qa-results/summary.md')
              ? fs.readFileSync('qa-results/summary.md', 'utf8')
              : '# Cloudflare Preview QA\n\nThe pipeline failed before a browser report was produced.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- cloudforge-preview-qa -->';
            const body = `${marker}\n${summary}\n[Workflow run and downloadable screenshots](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce browser QA result
        if: always() && steps.qa.outputs.status != 'passed'
        run: |
          echo "Cloudflare browser QA did not pass." >&2
          exit 1
