name: Inventory Remote Catalog Audit

on:
  push:
    branches:
      - feat/inventory-manufacturing-item-catalog-20260731
    paths:
      - ".github/workflows/inventory-remote-audit.yml"
  pull_request:
    paths:
      - ".github/workflows/inventory-remote-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-remote-catalog-audit-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  audit-alu:
    name: Read-only redacted alu catalog audit
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/inventory-manufacturing-item-catalog-20260731' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      REPORT_PATH: ${{ runner.temp }}/alu-catalog-redacted.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify read-only audit credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Audit tenant alu without mutation
        id: audit
        shell: bash
        run: |
          set +e
          node server/scripts/audit-alumdoor-catalog.mjs \
            --tenant alu \
            --redacted \
            --output "$REPORT_PATH"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          echo "audit_exit=$status" >> "$GITHUB_OUTPUT"

      - name: Summarize redacted findings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const summary = {
            checksum: report.checksum,
            records: report.counts?.records ?? 0,
            active_items: report.counts?.active_items ?? 0,
            disabled_items: report.counts?.disabled_items ?? 0,
            active_boms: report.counts?.active_boms ?? 0,
            critical: report.counts?.critical ?? 0,
            high: report.counts?.high ?? 0,
            medium: report.counts?.medium ?? 0,
            low: report.counts?.low ?? 0,
            finding_codes: [...new Set((report.findings ?? []).map((row) => row.code))].sort(),
          };
          const lines = [
            '# alu catalog audit',
            '',
            '- Mode: read-only, redacted',
            `- Checksum: \`${summary.checksum}\``,
            `- Records: ${summary.records}`,
            `- Active Items: ${summary.active_items}`,
            `- Disabled Items: ${summary.disabled_items}`,
            `- Active BOM/Production Standard: ${summary.active_boms}`,
            `- Findings: Critical ${summary.critical}, High ${summary.high}, Medium ${summary.medium}, Low ${summary.low}`,
            `- Finding codes: ${summary.finding_codes.length ? summary.finding_codes.map((code) => `\`${code}\``).join(', ') : 'none'}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload redacted audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: alu-catalog-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-catalog-redacted.json
          if-no-files-found: error
          retention-days: 14
