name: Sentrux post-kit max-depth trace

on:
  push:
    branches: [agent/sentrux-convergence-20260816]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libvulkan-dev

      - name: Build instrumented Sentrux
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/sentrux/sentrux.git /tmp/sentrux-src
          cd /tmp/sentrux-src
          git checkout --quiet 6f8ff3c14b0423e4b58f42d1813d4d5f7fdc1d11
          python3 <<'PY'
          from pathlib import Path
          p = Path('sentrux-core/src/metrics/mod.rs')
          s = p.read_text()
          start = s.index('fn compute_max_depth(edges: &[ImportEdge], entry_points: &[EntryPoint]) -> u32 {')
          end = s.index('\n// ── Pro metrics extension point', start)
          code = '''fn compute_max_depth(edges: &[ImportEdge], entry_points: &[EntryPoint]) -> u32 {
    if edges.is_empty() { return 0; }
    let (seeds, adj, all_nodes) = find_depth_seeds(edges, entry_points);
    let memo = longest_path_dfs(&seeds, &adj, all_nodes.len());
    let max_depth = seeds.iter().filter_map(|s| memo.get(s).copied()).max().unwrap_or(0);
    eprintln!("SENTRUX_DEPTH_MAX={}", max_depth);
    for seed in seeds.iter().filter(|s| memo.get(*s).copied() == Some(max_depth)) {
        eprintln!("SENTRUX_DEPTH_MAX_SEED {}", seed);
    }
    let mut rows: Vec<(&str,&str,u32)> = Vec::new();
    for (from,nexts) in &adj {
        let Some(&d)=memo.get(from) else { continue; };
        if d == 0 { continue; }
        for to in nexts {
            if memo.get(to).copied().map(|nd| nd.saturating_add(1)==d).unwrap_or(false) {
                rows.push((*from,*to,d));
            }
        }
    }
    rows.sort_by(|a,b| b.2.cmp(&a.2).then_with(|| a.0.cmp(b.0)).then_with(|| a.1.cmp(b.1)));
    for (from,to,d) in rows {
        if d >= 8 {
            eprintln!("SENTRUX_DEPTH_DAG remaining={} {} -> {}", d, from, to);
        }
    }
    max_depth
}'''
          p.write_text(s[:start] + code + s[end:])
          PY
          cargo build --quiet --release -p sentrux --bin sentrux
          cp target/release/sentrux /tmp/sentrux-trace

      - name: Trace stable branch head
        shell: bash
        run: |
          set -euo pipefail
          /tmp/sentrux-trace gate --save "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/trace.txt
          echo '=== POST-KIT MAX DEPTH DAG ==='
          grep 'SENTRUX_DEPTH_' /tmp/trace.txt
          grep -E '^Quality:' /tmp/trace.txt || true
