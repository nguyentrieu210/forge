name: Sentrux demo views boundary apply

on:
  push:
    branches: [agent/sentrux-convergence-20260816]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Detect completed migration
        id: state
        shell: bash
        run: |
          if [[ -f client/packages/views/src/list-runtime.ts ]]; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
            echo 'demo views boundary already applied; no-op'
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Sentrux
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Capture baseline
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt
          BEFORE=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          echo "BEFORE=$BEFORE" >> "$GITHUB_ENV"
          echo "Baseline Quality=$BEFORE"

      - name: Apply demo boundary candidate
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          runtime = Path('client/packages/views/src/list-runtime.ts')
          runtime.write_text(
              '/** Narrow list surface for app-level consumers. */\n'
              'export { ListView, type ListViewProps } from "./list/ListView.js";\n'
              'export { applyClientQuery } from "./list/filters.js";\n'
              'export { useListUrlState, type UrlStateBridge } from "./list/useListState.js";\n',
              encoding='utf-8',
          )
          pkg_path = Path('client/packages/views/package.json')
          pkg = pkg_path.read_text(encoding='utf-8')
          anchor = '    "./url-state": {\n      "types": "./dist/list/useListState.d.ts",\n      "import": "./dist/list/useListState.js"\n    },\n'
          replacement = anchor + '    "./list-runtime": {\n      "types": "./dist/list-runtime.d.ts",\n      "import": "./dist/list-runtime.js"\n    },\n'
          if anchor not in pkg:
              raise SystemExit('views url-state export anchor missing')
          pkg_path.write_text(pkg.replace(anchor, replacement, 1), encoding='utf-8')
          replacements = {
              Path('client/apps/demo/src/list-glue.tsx'): (b'from "@metaforge/views";', b'from "@metaforge/views/list-runtime";'),
              Path('client/apps/demo/src/experiences/ReceiveExperience.tsx'): (b'from "@metaforge/views";', b'from "@metaforge/views/provider";'),
              Path('client/apps/demo/src/system/PermissionManager.tsx'): (b'from "@metaforge/views";', b'from "@metaforge/views/permissions";'),
              Path('client/apps/demo/src/system/Settings.tsx'): (b'from "@metaforge/views";', b'from "@metaforge/views/provider";'),
          }
          for path, (old, new) in replacements.items():
              raw = path.read_bytes()
              if old not in raw:
                  raise SystemExit(f'expected root views import missing in {path}')
              path.write_bytes(raw.replace(old, new, 1))
              print('migrate', path)
          PY
          git add client/packages/views/src/list-runtime.ts
          git diff --stat

      - name: Install isolated demo workspace
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd client
          printf 'packages:\n  - "packages/*"\n  - "apps/demo"\n' > pnpm-workspace.yaml
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --no-frozen-lockfile

      - name: Build views and demo
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd client
          pnpm --filter @metaforge/views build
          pnpm --filter @metaforge/demo build

      - name: Restore validation-only workspace files
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- client/pnpm-workspace.yaml client/pnpm-lock.yaml

      - name: Sentrux regression, quality and depth gate
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate . | tee /tmp/after.txt
          AFTER=$(sed -nE 's/^Quality:[[:space:]]*[0-9]+[[:space:]]*->[[:space:]]*([0-9]+).*/\1/p' /tmp/after.txt | tail -1)
          if [[ -z "$AFTER" ]]; then
            echo 'Unable to parse candidate quality' >&2
            exit 1
          fi
          echo "Candidate Quality=$AFTER (baseline=$BEFORE)"
          if (( AFTER <= BEFORE )); then
            echo "Expected strict quality improvement: $BEFORE -> $AFTER" >&2
            exit 1
          fi
          python3 <<'PY'
          import json, select, subprocess, time
          p=subprocess.Popen(["sentrux","--mcp"],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
          def send(x): p.stdin.write(json.dumps(x,separators=(",",":"))+"\n"); p.stdin.flush()
          def recv(i,timeout=45):
              end=time.time()+timeout
              while time.time()<end:
                  r,_,_=select.select([p.stdout],[],[],max(0,end-time.time()))
                  if not r: break
                  line=p.stdout.readline()
                  if not line: break
                  try: m=json.loads(line)
                  except Exception: continue
                  if m.get("id")==i: return m
              raise RuntimeError(i)
          def args(t):
              pr=t.get("inputSchema",{}).get("properties",{}); rq=t.get("inputSchema",{}).get("required",[]); a={}
              for k in ("path","root","project_path","directory"):
                  if k in pr: a[k]="."; break
              for k in rq:
                  if k not in a:
                      typ=pr.get(k,{}).get("type")
                      a[k]="." if typ=="string" else False if typ=="boolean" else [] if typ=="array" else {}
              return a
          def text(m): return json.loads(next(x["text"] for x in m["result"]["content"] if x.get("type")=="text"))
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"demo-boundary-apply","version":"1"}}}); recv(1)
          send({"jsonrpc":"2.0","method":"notifications/initialized","params":{}})
          send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}); by={t["name"]:t for t in recv(2)["result"]["tools"]}
          send({"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"scan","arguments":args(by["scan"])}}); recv(3)
          send({"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"health","arguments":args(by["health"])}}); h=text(recv(4))
          depth=h['root_causes']['depth']['raw']
          print('Validated depth=',depth,'cross=',h.get('cross_module_edges'))
          if depth >= 17:
              raise SystemExit(f'Expected depth < 17, got {depth}')
          p.kill()
          PY

      - name: Commit validated source
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentrux-agent'
          git config user.email 'sentrux-agent@users.noreply.github.com'
          git add \
            client/packages/views/src/list-runtime.ts \
            client/packages/views/package.json \
            client/apps/demo/src/list-glue.tsx \
            client/apps/demo/src/experiences/ReceiveExperience.tsx \
            client/apps/demo/src/system/PermissionManager.tsx \
            client/apps/demo/src/system/Settings.tsx
          git diff --cached --stat
          git commit -m 'refactor(demo): isolate views runtime dependencies'
          git push origin HEAD:agent/sentrux-convergence-20260816
