name: Sentrux critical views barrel map

on:
  push:
    branches: [agent/sentrux-convergence-20260816]

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Map exact root views imports on depth-16 surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          roots = [
              Path('client/apps/demo/src'),
              Path('client/apps/hrm/src'),
              Path('client/apps/kho-vn/src'),
              Path('client/apps/runtime/src'),
          ]
          pattern = re.compile(r'import\s+(.*?)\s+from\s+["\']@metaforge/views["\'];', re.S)
          rows = []
          symbols = set()
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for match in pattern.finditer(text):
                      clause = ' '.join(match.group(1).split())
                      rows.append((str(path), clause))
                      body = match.group(1).replace('type ', '')
                      if '{' in body and '}' in body:
                          for raw in body[body.index('{')+1:body.rindex('}')].split(','):
                              name = raw.strip().split(' as ')[0].strip()
                              if name:
                                  symbols.add(name)
          print('=== EXACT ROOT @metaforge/views IMPORTS ===')
          for path, clause in rows:
              print(f'{path}: {clause}')
          print(f'ROOT_IMPORT_FILE_COUNT={len({p for p, _ in rows})}')
          print('=== SYMBOL -> ROOT INDEX EXPORT LINE ===')
          index_lines = Path('client/packages/views/src/index.ts').read_text(encoding='utf-8').splitlines()
          for symbol in sorted(symbols):
              hits = [f'{i+1}:{line.strip()}' for i, line in enumerate(index_lines) if re.search(rf'\b{re.escape(symbol)}\b', line)]
              print(symbol + ' => ' + (' | '.join(hits) if hits else 'NO_ROOT_EXPORT_LINE'))
          print('=== CURRENT PACKAGE SUBPATH EXPORTS ===')
          pkg = Path('client/packages/views/package.json').read_text(encoding='utf-8')
          for line in pkg.splitlines():
              if re.match(r'\s+"\./[^\"]+":', line):
                  print(line.strip())
          PY
