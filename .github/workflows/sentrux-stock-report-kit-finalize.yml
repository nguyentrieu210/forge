name: Sentrux direct meta-context imports apply

on:
  push:
    branches: [agent/sentrux-convergence-20260816]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip sentrux]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Install Sentrux
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt
          Q=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          echo "quality=$Q" >> "$GITHUB_OUTPUT"
          echo "BASELINE_QUALITY=$Q"

      - name: Bypass provider for context-only internal imports
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path('client/packages/views/src')
          safe = {'useMetaForge', 'useMetaForgeOptional', 'useLocaleFormat', 'MetaForgeContextValue'}
          pattern = re.compile(
              r'import\s+(?P<whole_type>type\s+)?\{(?P<body>[^}]*)\}\s+from\s+(?P<quote>["\'])(?P<spec>\.{1,2}/(?:[^"\']*/)*provider\.js)(?P=quote);'
          )
          changed_files = []
          changed_imports = 0
          skipped_mixed = []

          for path in sorted(list(root.rglob('*.ts')) + list(root.rglob('*.tsx'))):
              raw = path.read_bytes()
              text = raw.decode('utf-8')

              def replace(match: re.Match[str]) -> str:
                  nonlocal_state['seen'] += 1
                  tokens = [token.strip() for token in match.group('body').split(',') if token.strip()]
                  symbols = set()
                  for token in tokens:
                      token = token[5:].strip() if token.startswith('type ') else token
                      symbols.add(token.split(' as ', 1)[0].strip())
                  if not symbols or not symbols.issubset(safe):
                      skipped_mixed.append((str(path), sorted(symbols)))
                      return match.group(0)
                  nonlocal_state['changed'] += 1
                  spec = match.group('spec')
                  replacement_spec = spec[:-len('provider.js')] + 'meta-context.js'
                  return match.group(0).replace(spec, replacement_spec)

              nonlocal_state = {'seen': 0, 'changed': 0}
              updated = pattern.sub(replace, text)
              if updated != text:
                  path.write_bytes(updated.encode('utf-8'))
                  changed_files.append(str(path))
                  changed_imports += nonlocal_state['changed']

          print(f'CONTEXT_IMPORT_FILES={len(changed_files)}')
          print(f'CONTEXT_IMPORT_EDGES={changed_imports}')
          for path in changed_files:
              print(f'  changed {path}')
          for path, symbols in skipped_mixed:
              print(f'  kept provider import {path}: {symbols}')
          if changed_imports < 5:
              raise SystemExit(f'expected at least 5 context-only provider imports, found {changed_imports}')
          PY
          git add -- client/packages/views/src
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git diff --cached --stat

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --no-frozen-lockfile
          git restore --worktree -- pnpm-lock.yaml client/pnpm-lock.yaml 2>/dev/null || true

      - name: Build views dependencies and typecheck views
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter "@metaforge/views^..." run build
          pnpm --filter @metaforge/views run typecheck

      - name: Typecheck four max-depth apps
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter "@metaforge/demo^..." run build
          pnpm --filter "hrm^..." run build
          pnpm --filter "kho-vn^..." run build
          pnpm --filter "runtime^..." run build
          pnpm --filter @metaforge/demo run typecheck
          pnpm --filter hrm run typecheck
          pnpm --filter kho-vn run typecheck
          pnpm --filter runtime run typecheck

      - name: Strict Sentrux improvement gate
        env:
          BEFORE: ${{ steps.before.outputs.quality }}
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after.txt
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          echo "DIRECT_META_CONTEXT_SCORE $BEFORE -> $AFTER delta=$((AFTER-BEFORE))"
          test "$AFTER" -gt "$BEFORE"

          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          EOF
          sentrux check . | tee /tmp/structure.txt
          rm -rf .sentrux

      - name: Commit validated internal decoupling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentrux-refactor-bot'
          git config user.email 'sentrux-refactor-bot@users.noreply.github.com'
          git diff --cached --check
          git commit --no-verify -m 'refactor(views): import context hooks directly [skip sentrux]'
          git push origin HEAD:agent/sentrux-convergence-20260816
