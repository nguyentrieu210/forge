name: Sentrux prune unused NewFormContainer export

on:
  push:
    branches: [agent/sentrux-convergence-20260816]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip sentrux]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Install Sentrux
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt
          Q=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          echo "quality=$Q" >> "$GITHUB_OUTPUT"
          echo "BASELINE_QUALITY=$Q"

      - name: Prove root export unused and prune it
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path('client')
          external = []
          pattern = re.compile(r'import\s+(?:type\s+)?\{(?P<body>[^}]*)\}\s+from\s+["\']@metaforge/views["\']')
          for path in sorted(list(root.rglob('*.ts')) + list(root.rglob('*.tsx'))):
              text = path.read_bytes().decode('utf-8')
              for match in pattern.finditer(text):
                  tokens = [t.strip() for t in match.group('body').split(',') if t.strip()]
                  symbols = {(t[5:].strip() if t.startswith('type ') else t).split(' as ', 1)[0].strip() for t in tokens}
                  if 'NewFormContainer' in symbols:
                      external.append(str(path))
          if external:
              raise SystemExit('NewFormContainer still imported from root package: ' + ', '.join(external))

          index = Path('client/packages/views/src/index.ts')
          raw = index.read_bytes()
          text = raw.decode('utf-8')
          line = 'export { NewFormContainer, type NewFormContainerProps } from "./container/NewFormContainer.js";'
          if text.count(line) != 1:
              raise SystemExit(f'expected exactly one NewFormContainer root export, found {text.count(line)}')
          newline = '\r\n' if '\r\n' in text else '\n'
          text = text.replace(line + newline, '', 1)
          if line in text:
              raise SystemExit('NewFormContainer root export remains')
          index.write_bytes(text.encode('utf-8'))
          print('PRUNED_ROOT_EXPORT=NewFormContainer')
          PY
          git add -- client/packages/views/src/index.ts
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git diff --cached --stat
          git diff --cached

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --no-frozen-lockfile
          git restore --worktree -- pnpm-lock.yaml client/pnpm-lock.yaml 2>/dev/null || true

      - name: Build views deps and typecheck views
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter "@metaforge/views^..." run build
          pnpm --filter @metaforge/views run typecheck

      - name: Strict Sentrux improvement gate
        env:
          BEFORE: ${{ steps.before.outputs.quality }}
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after.txt
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          echo "PRUNE_NEW_FORM_SCORE $BEFORE -> $AFTER delta=$((AFTER-BEFORE))"
          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          EOF
          set +e
          sentrux check . 2>&1 | tee /tmp/structure.txt
          set -e
          rm -rf .sentrux
          grep -Ei 'Max depth|depth|god file|circular|cycle' /tmp/structure.txt || true
          test "$AFTER" -gt "$BEFORE"
          ! grep -q 'Found [1-9][0-9]* circular dependencies' /tmp/structure.txt

      - name: Commit validated export pruning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentrux-refactor-bot'
          git config user.email 'sentrux-refactor-bot@users.noreply.github.com'
          git diff --cached --check
          git commit --no-verify -m 'refactor(views): prune unused NewFormContainer export [skip sentrux]'
          git push origin HEAD:agent/sentrux-convergence-20260816
