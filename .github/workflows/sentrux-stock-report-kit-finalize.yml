name: Sentrux depth-16 critical DAG retrace

on:
  push:
    branches: [agent/sentrux-convergence-20260816]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libvulkan-dev

      - name: Build instrumented Sentrux
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/sentrux/sentrux.git /tmp/sentrux-src
          git -C /tmp/sentrux-src checkout --quiet 6f8ff3c14b0423e4b58f42d1813d4d5f7fdc1d11
          echo '' | base64 -d > /tmp/patch-depth.py
          python3 /tmp/patch-depth.py
          cargo build --quiet --release -p sentrux --bin sentrux --manifest-path /tmp/sentrux-src/Cargo.toml
          cp /tmp/sentrux-src/target/release/sentrux /tmp/sentrux-trace

      - name: Trace current branch
        shell: bash
        run: |
          set -euo pipefail
          /tmp/sentrux-trace gate --save "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/trace.txt
          echo '=== CURRENT MAX SEEDS AND CRITICAL DAG ==='
          grep 'SENTRUX_DEPTH_' /tmp/trace.txt
          grep -E '^Quality:' /tmp/trace.txt || true
