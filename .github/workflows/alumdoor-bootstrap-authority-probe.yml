name: Alumdoor Bootstrap Authority Probe

on:
  pull_request:
    paths:
      - '.github/workflows/alumdoor-bootstrap-authority-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: Probe restart handoff prerequisites without mutation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "IDENTITY=$(whoami)"
          Write-Host "ELEVATED=$(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          Write-Host '=== PRIVILEGES ==='
          whoami /priv | ForEach-Object { Write-Host $_ }

          Write-Host '=== SERVICE BOOT CONTRACT ==='
          foreach ($name in @('ForgeAlumdoorWorker','ForgeAlumdoorBackend','ForgeAlumdoorDesk')) {
            $svc = Get-CimInstance Win32_Service -Filter "Name='$name'" -ErrorAction SilentlyContinue
            if ($svc) {
              Write-Host "SERVICE_BOOT name=$name state=$($svc.State) startMode=$($svc.StartMode) startName=$($svc.StartName) pid=$($svc.ProcessId) path=$($svc.PathName)"
            } else {
              Write-Host "SERVICE_BOOT name=$name absent=1"
            }
          }
          Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'actions.runner.nguyentrieu210-forge.*' } |
            ForEach-Object {
              Write-Host "RUNNER_SERVICE_BOOT name=$($_.Name) state=$($_.State) startMode=$($_.StartMode) startName=$($_.StartName) pid=$($_.ProcessId) path=$($_.PathName)"
            }

          Write-Host '=== RUNNER TASK CONTRACT ==='
          foreach ($name in @('AlumdoorGitHubRunner','AlumdoorWorkerLocal','AlumdoorClientLocal')) {
            $task = Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if (-not $task) { Write-Host "TASK_BOOT name=$name absent=1"; continue }
            $info = $task | Get-ScheduledTaskInfo -ErrorAction SilentlyContinue
            Write-Host "TASK_BOOT name=$name state=$($info.State) principal=$($task.Principal.UserId) logonType=$($task.Principal.LogonType) runLevel=$($task.Principal.RunLevel)"
            $task.Triggers | ForEach-Object {
              $type = $_.CimClass.CimClassName
              Write-Host "TASK_TRIGGER name=$name type=$type enabled=$($_.Enabled) startBoundary=$($_.StartBoundary) userId=$($_.UserId)"
            }
            $task.Actions | ForEach-Object { Write-Host "TASK_ACTION name=$name execute=$($_.Execute) args=$($_.Arguments) cwd=$($_.WorkingDirectory)" }
          }

          Write-Host '=== AUTO LOGON FLAG (NO SECRET OUTPUT) ==='
          $winlogon = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -ErrorAction SilentlyContinue
          Write-Host "AUTO_LOGON enabled=$($winlogon.AutoAdminLogon) defaultUser=$($winlogon.DefaultUserName) defaultDomain=$($winlogon.DefaultDomainName)"

          Write-Host 'ALUMDOOR_RESTART_HANDOFF_PROBE_PASS'
