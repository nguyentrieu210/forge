name: Install Alumdoor Metadata Production

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact merged main SHA containing Alumdoor 2.1.0"
        required: true
        type: string
      confirm:
        description: "Type INSTALL_ALUMDOOR_META_2_1_0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-alu-tenant-production
  cancel-in-progress: false

jobs:
  install-alumdoor-meta:
    name: Backup, restore drill, install and read-only smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TENANT: alu
      APP_ID: alumdoor
      EXPECTED_VERSION: 2.1.0
      TARGET_SHA: ${{ inputs.target_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.ALU_META_ADMIN_USER }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.ALU_META_ADMIN_PASSWORD }}
      FORGE_ORIGIN: https://alu.kairo.vn
      BACKUP_DIR: /tmp/alu-meta-backup
      EVIDENCE_DIR: /tmp/alu-meta-install-evidence

    steps:
      - name: Checkout exact release code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify protected release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$TENANT" = "alu"
          test "$APP_ID" = "alumdoor"
          test "$EXPECTED_VERSION" = "2.1.0"
          test "${{ inputs.confirm }}" = "INSTALL_ALUMDOOR_META_2_1_0"
          test "$TARGET_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$TARGET_SHA" = "$(git rev-parse origin/main)"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${FORGE_ADMIN_USER:-}"
          test -n "${FORGE_ADMIN_PASSWORD:-}"
          mkdir -p "$BACKUP_DIR" "$EVIDENCE_DIR"
          printf 'run_id=%s\ntarget_sha=%s\ntenant=%s\napp=%s\nexpected_version=%s\nstarted_at=%s\nwrite_scope=metadata_only\nsmoke_scope=read_only\n' \
            "$GITHUB_RUN_ID" "$TARGET_SHA" "$TENANT" "$APP_ID" "$EXPECTED_VERSION" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$EVIDENCE_DIR/state.txt"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate exact metadata package
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter cloudforge run build
          node --test \
            server/tests/app-registry.test.mjs \
            server/tests/app-installer-standard-metadata-adoption.test.mjs \
            server/tests/frappe-platform.test.mjs \
            server/tests/verify-installed-app.test.mjs \
            2>&1 | tee "$EVIDENCE_DIR/meta-tests.log"
          node server/scripts/verify-alumdoor-meta-completeness.mjs \
            2>&1 | tee "$EVIDENCE_DIR/meta-completeness.log"
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run \
            2>&1 | tee "$EVIDENCE_DIR/package-dry-run.log"
          grep -q 'app=alumdoor@2.1.0' "$EVIDENCE_DIR/package-dry-run.log"
          grep -q 'DRY_RUN_PASS alumdoor' "$EVIDENCE_DIR/package-dry-run.log"
          printf 'package_validation=pass\nmeta_tests=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Create fresh production backup
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/backup-dry.log"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$BACKUP_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/backup-live.log"
          backup_sql="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.sql' -print -quit)"
          test -n "$backup_sql"
          test -f "$backup_sql.json"
          backup_sha="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.sha256||'')" "$backup_sql.json")"
          test -n "$backup_sha"
          printf 'BACKUP_SQL=%s\nBACKUP_SHA=%s\n' "$backup_sql" "$backup_sha" >> "$GITHUB_ENV"
          printf 'backup=pass\nbackup_sha256=%s\nexternal_backup=github_actions_artifact\n' "$backup_sha" >> "$EVIDENCE_DIR/state.txt"

      - name: Copy backup to protected off-account artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: alu-meta-pre-install-backup-${{ github.run_id }}
          path: /tmp/alu-meta-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Create two isolated restore-drill databases
        shell: bash
        run: |
          set -euo pipefail
          drill_a="cloudforge-drill-alu-meta-${GITHUB_RUN_ID}-a"
          drill_b="cloudforge-drill-alu-meta-${GITHUB_RUN_ID}-b"
          printf 'DRILL_A=%s\nDRILL_B=%s\n' "$drill_a" "$drill_b" >> "$GITHUB_ENV"
          pnpm --dir server exec wrangler d1 create "$drill_a" --location apac \
            2>&1 | tee "$EVIDENCE_DIR/drill-a-create.log"
          touch /tmp/alu-meta-drill-a-created
          pnpm --dir server exec wrangler d1 create "$drill_b" --location apac \
            2>&1 | tee "$EVIDENCE_DIR/drill-b-create.log"
          touch /tmp/alu-meta-drill-b-created

      - name: Restore and verify the same backup twice
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_A" --file "$BACKUP_SQL" \
            2>&1 | tee "$EVIDENCE_DIR/drill-a-dry.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_A" --file "$BACKUP_SQL" \
            --execute --confirm "$DRILL_A" 2>&1 | tee "$EVIDENCE_DIR/drill-a-live.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_B" --file "$BACKUP_SQL" \
            2>&1 | tee "$EVIDENCE_DIR/drill-b-dry.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_B" --file "$BACKUP_SQL" \
            --execute --confirm "$DRILL_B" 2>&1 | tee "$EVIDENCE_DIR/drill-b-live.log"
          node - "$BACKUP_SQL.$DRILL_A.restore.json" "$BACKUP_SQL.$DRILL_B.restore.json" "$BACKUP_SHA" <<'NODE'
          const fs = require("fs");
          const [aPath, bPath, expected] = process.argv.slice(2);
          const a = JSON.parse(fs.readFileSync(aPath, "utf8"));
          const b = JSON.parse(fs.readFileSync(bPath, "utf8"));
          if (a.source_sha256 !== expected || b.source_sha256 !== expected) throw new Error("restore drill checksum mismatch");
          if (a.target_database_id === b.target_database_id) throw new Error("restore drills reused one database");
          if (a.routes_changed !== false || b.routes_changed !== false) throw new Error("restore drill changed routes");
          const ok = (row) => JSON.stringify(row.integrity).toLowerCase().includes("ok");
          if (!ok(a) || !ok(b)) throw new Error("restore drill quick_check failed");
          if (a.table_count !== b.table_count || a.table_count < 1) throw new Error("restore drill table count mismatch");
          process.stdout.write(`restore_drill_tables=${a.table_count}\n`);
          NODE
          printf 'restore_drill_a=pass\nrestore_drill_b=pass\nrestore_drill_sha256=%s\n' "$BACKUP_SHA" >> "$EVIDENCE_DIR/state.txt"

      - name: Install Alumdoor metadata and run read-only conformance smoke
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/forge-app.mjs briefs/alumdoor-v2.json \
            --origin "$FORGE_ORIGIN" \
            --admin "$FORGE_ADMIN_USER" \
            --provision-standard \
            2>&1 | tee "$EVIDENCE_DIR/install-and-smoke.log"
          grep -q 'app=alumdoor@2.1.0' "$EVIDENCE_DIR/install-and-smoke.log"
          grep -q 'provisioning standard metadata .* ok' "$EVIDENCE_DIR/install-and-smoke.log"
          grep -q 'installed form/link/chart contract' "$EVIDENCE_DIR/install-and-smoke.log"
          grep -q '^LIVE  https://alu.kairo.vn' "$EVIDENCE_DIR/install-and-smoke.log"
          printf 'standard_metadata=pass\nmetadata_install=pass\ninstalled_version=2.1.0\nconformance_smoke=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify public health and guest auth boundary
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --output "$EVIDENCE_DIR/health.json" --write-out '%{http_code}' "$FORGE_ORIGIN/health")"
          guest="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' "$FORGE_ORIGIN/api/method/metaforge.api.get_boot")"
          test "$health" = "200"
          test "$guest" = "403"
          printf 'health=%s\nguest_boot=%s\npublic_smoke=pass\n' "$health" "$guest" >> "$EVIDENCE_DIR/state.txt"

      - name: Remove temporary restore-drill databases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            local name="$1" marker="$2" expected="$3"
            if [ ! -f "$marker" ]; then return 0; fi
            test "$name" = "$expected"
            case "$name" in
              cloudforge-drill-alu-meta-${GITHUB_RUN_ID}-a|cloudforge-drill-alu-meta-${GITHUB_RUN_ID}-b) ;;
              *) echo "Refusing unexpected D1 cleanup target: $name" >&2; exit 1 ;;
            esac
            pnpm --dir server exec wrangler d1 delete "$name" --skip-confirmation
          }
          cleanup "${DRILL_A:-}" /tmp/alu-meta-drill-a-created "cloudforge-drill-alu-meta-${GITHUB_RUN_ID}-a"
          cleanup "${DRILL_B:-}" /tmp/alu-meta-drill-b-created "cloudforge-drill-alu-meta-${GITHUB_RUN_ID}-b"
          printf 'drill_cleanup=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Publish protected install summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Alumdoor metadata protected install'
            echo
            echo '```text'
            cat "$EVIDENCE_DIR/state.txt" 2>/dev/null || echo 'state.txt missing'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-meta-production-install-${{ github.run_id }}
          path: /tmp/alu-meta-install-evidence/
          if-no-files-found: warn
          retention-days: 30
