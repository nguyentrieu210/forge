name: Validate Alumdoor Windows Service Fix

on:
  push:
    branches:
      - agent/fix-alumdoor-service-detection

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate syntax and installer invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check server/scripts/alumdoor-runtime-service-host.mjs
          node --check server/scripts/alumdoor-runtime-maintenance.mjs
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'server/scripts/install-alumdoor-runtime-services.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $installer = Get-Content 'server/scripts/install-alumdoor-runtime-services.ps1' -Raw
          if ($installer -match '(?m)icacls\.exe.*\s/T(?:\s|$)') { throw 'recursive icacls /T returned' }
          if ($installer -match '(?m)&\s+\$exe\s+refresh') { throw 'unsupported WinSW refresh returned' }
          if ($installer -notmatch 'sc\.exe delete \$id') { throw 'existing-service delete path missing' }
      - name: Exercise service host with pnpm path containing spaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'Alumdoor Test Root'
          $serviceHome = Join-Path $env:RUNNER_TEMP 'Alumdoor Service State'
          $pnpmDir = Join-Path $env:RUNNER_TEMP 'Program Files\nodejs'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'server'), (Join-Path $root 'client\apps\runtime'), $serviceHome, $pnpmDir | Out-Null
          $pnpm = Join-Path $pnpmDir 'pnpm.CMD'
          $cmdLines = @(
            '@echo off',
            '> "%TEST_OUTPUT%" echo ARGS:%*',
            '>> "%TEST_OUTPUT%" echo CWD:%CD%',
            '>> "%TEST_OUTPUT%" echo VITE:%VITE_FORGE_BACKEND%',
            'exit /b 0'
          )
          Set-Content -LiteralPath $pnpm -Value $cmdLines -Encoding ascii

          function Test-Role([string]$role) {
            $out = Join-Path $env:RUNNER_TEMP "$role-output.txt"
            Remove-Item $out -Force -ErrorAction SilentlyContinue
            $env:ALUMDOOR_ROOT = $root
            $env:ALUMDOOR_SERVICE_HOME = $serviceHome
            $env:ALUMDOOR_PNPM = $pnpm
            $env:TEST_OUTPUT = $out
            Remove-Item (Join-Path $serviceHome 'maintenance.flag'), (Join-Path $serviceHome 'desk-maintenance.flag') -Force -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath node -ArgumentList @('server/scripts/alumdoor-runtime-service-host.mjs','--role',$role) -PassThru -WindowStyle Hidden
            try {
              $deadline = (Get-Date).AddSeconds(15)
              while (-not (Test-Path $out) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
              if (-not (Test-Path $out)) { throw "$role host did not invoke pnpm.cmd" }
              $text = Get-Content $out -Raw
              if ($role -eq 'backend') {
                if ($text -notmatch 'ARGS:run dev:alumdoor-local') { throw "backend args wrong: $text" }
                if ($text -notmatch [regex]::Escape("CWD:$root\server")) { throw "backend cwd wrong: $text" }
              } else {
                if ($text -notmatch 'ARGS:run dev') { throw "desk args wrong: $text" }
                if ($text -notmatch 'VITE:http://127.0.0.1:8799') { throw "desk env wrong: $text" }
                if ($text -notmatch [regex]::Escape("CWD:$root\client\apps\runtime")) { throw "desk cwd wrong: $text" }
              }
            } finally {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

          Test-Role backend
          Test-Role desk
          Write-Host 'ALUMDOOR_SERVICE_HOST_WINDOWS_PASS'
      - name: Diff hygiene
        shell: bash
        run: git diff --check origin/main...HEAD
