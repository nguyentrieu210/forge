name: R5 06 Package Migration Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - "server/packages/app-registry/**"
      - "server/packages/migration/**"
      - "server/apps/tenant-worker/**"
      - "server/apps-src/hrm/**"
      - "server/apps-src/vn-accounting/**"
      - "server/apps-src/manufacturing-qms/**"
      - "server/apps-src/maintenance/**"
      - "server/migrations/**"
      - "server/scripts/pack-app.mjs"
      - "server/scripts/forge-app.mjs"
      - "server/scripts/verify-migration-governance.mjs"
      - "server/tests/app-registry.test.mjs"
      - "server/tests/migration-governance.test.mjs"
      - "server/tests/migration-opening.test.mjs"
      - "server/tests/migration-manifest-reconcile.test.mjs"
      - "server/tests/r5-package-migration-rehearsal.test.mjs"
      - "docs/agents/r5/R5_A6_PACKAGE_MIGRATION_REHEARSAL.md"
      - ".github/workflows/r5-06-package-migration-rehearsal.yml"

permissions:
  contents: read

concurrency:
  group: r5-06-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rehearsal:
    if: github.head_ref == 'agent/r5-06-package-migration-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit exact-head server dist and record baseline TypeScript debt
        working-directory: server
        run: |
          set +e
          pnpm exec tsc -p tsconfig.json --noEmitOnError false 2>&1 | tee /tmp/r5-06-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          test -f dist/packages/app-registry/src/index.js
          test -f dist/packages/migration/src/public.js
          if [ "$status" -ne 0 ]; then
            echo "Full-server TypeScript baseline remains non-zero; exact emitted App Registry and Migration code is exercised below."
            grep "error TS" /tmp/r5-06-tsc.log > /tmp/r5-06-typescript-baseline.log || true
            cat /tmp/r5-06-typescript-baseline.log
          fi

      - name: Migration sequence checksum and append-only governance
        id: migration_governance
        continue-on-error: true
        working-directory: server
        run: |
          node scripts/verify-migration-governance.mjs --base-ref "${{ github.event.pull_request.base.sha }}"
          node --test tests/migration-governance.test.mjs

      - name: Representative opening import order and reconciliation fixtures
        id: migration_fixtures
        continue-on-error: true
        working-directory: server
        run: |
          node --test tests/migration-opening.test.mjs
          node --test tests/migration-manifest-reconcile.test.mjs

      - name: Canonical App Registry package lifecycle regressions
        id: app_registry
        continue-on-error: true
        working-directory: server
        run: node --test tests/app-registry.test.mjs

      - name: HRM package source dry check
        id: pack_hrm
        continue-on-error: true
        working-directory: server
        run: node scripts/pack-app.mjs apps-src/hrm --check

      - name: VN Accounting package source dry check
        id: pack_vn_accounting
        continue-on-error: true
        working-directory: server
        run: node scripts/pack-app.mjs apps-src/vn-accounting --check

      - name: Manufacturing QMS package source dry check
        id: pack_manufacturing_qms
        continue-on-error: true
        working-directory: server
        run: node scripts/pack-app.mjs apps-src/manufacturing-qms --check

      - name: Maintenance package source dry check
        id: pack_maintenance
        continue-on-error: true
        working-directory: server
        run: node scripts/pack-app.mjs apps-src/maintenance --check

      - name: Disposable workerd package bootstrap lifecycle and tenant isolation
        id: disposable_tenant
        continue-on-error: true
        working-directory: server
        run: >-
          pnpm exec vitest run apps/tenant-worker/test/frappe-facade.integration.test.mts
          --config apps/tenant-worker/vitest.config.mts
          -t "logs in with a real password hash|repairs an older tenant from the standard catalogue|refuses a request routed for a different tenant|installs an app, and re-installing the identical package|upgrades an app REPEATEDLY|rolls an app install back atomically|refuses to uninstall an app whose doctypes still hold documents"

      - name: Diff hygiene
        id: diff_hygiene
        continue-on-error: true
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: R5-01 minimum-version dependency contract gate
        id: minimum_version
        continue-on-error: true
        working-directory: server
        run: node --test tests/r5-package-migration-rehearsal.test.mjs

      - name: Aggregate rehearsal verdict
        if: always()
        env:
          MIGRATION_GOVERNANCE: ${{ steps.migration_governance.outcome }}
          MIGRATION_FIXTURES: ${{ steps.migration_fixtures.outcome }}
          APP_REGISTRY: ${{ steps.app_registry.outcome }}
          PACK_HRM: ${{ steps.pack_hrm.outcome }}
          PACK_VN_ACCOUNTING: ${{ steps.pack_vn_accounting.outcome }}
          PACK_MANUFACTURING_QMS: ${{ steps.pack_manufacturing_qms.outcome }}
          PACK_MAINTENANCE: ${{ steps.pack_maintenance.outcome }}
          DISPOSABLE_TENANT: ${{ steps.disposable_tenant.outcome }}
          DIFF_HYGIENE: ${{ steps.diff_hygiene.outcome }}
          MINIMUM_VERSION: ${{ steps.minimum_version.outcome }}
        run: |
          failed=0
          for item in \
            "migration_governance=$MIGRATION_GOVERNANCE" \
            "migration_fixtures=$MIGRATION_FIXTURES" \
            "app_registry=$APP_REGISTRY" \
            "pack_hrm=$PACK_HRM" \
            "pack_vn_accounting=$PACK_VN_ACCOUNTING" \
            "pack_manufacturing_qms=$PACK_MANUFACTURING_QMS" \
            "pack_maintenance=$PACK_MAINTENANCE" \
            "disposable_tenant=$DISPOSABLE_TENANT" \
            "diff_hygiene=$DIFF_HYGIENE" \
            "minimum_version=$MINIMUM_VERSION"
          do
            echo "$item"
            case "$item" in
              *=success) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "R5-06 rehearsal BLOCKED: one or more executable gates failed."
            exit 1
          fi
