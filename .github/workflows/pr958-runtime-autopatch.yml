name: PR958 Runtime Autopatch

on:
  push:
    branches:
      - agent/alumdoor-pricing-convergence

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alumdoor-pricing-convergence
          fetch-depth: 0

      - name: Apply deterministic runtime patch
        run: node server/scripts/patch-pr958-runtime.mjs

      - name: Verify and publish patch
        shell: bash
        run: |
          git diff --check
          grep -F "priceVariant: item.price_variant" server/packages/clouderp-selling/src/commercial-sales-order-controller.ts
          grep -F "signedMoneyMinor(" server/packages/clouderp-pricing/src/commercial-policy.ts
          git rm .github/workflows/pr958-runtime-autopatch.yml server/scripts/patch-pr958-runtime.mjs
          git add server/packages/clouderp-selling/src/commercial-sales-order-controller.ts server/packages/clouderp-pricing/src/commercial-policy.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(pricing): support explicit variants and signed adjustments"
          git push origin HEAD:agent/alumdoor-pricing-convergence
