name: Purchase Base Sync

on:
  push:
    branches:
      - feat/purchase-receipt-complete-20260731

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/purchase-receipt-complete-20260731
          fetch-depth: 0

      - name: Merge current default with explicit conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin hotfix/alumdoor-print-list-delete
          set +e
          git merge --no-commit --no-ff origin/hotfix/alumdoor-print-list-delete
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            allowed='CURRENT_STATUS.md
NEXT_TASKS.md
.github/workflows/pr-validation.yml'
            unexpected="$(comm -23 <(printf '%s\n' "$conflicts" | sort) <(printf '%s\n' "$allowed" | sort))"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              echo "$unexpected"
              exit 1
            fi
            git checkout --ours CURRENT_STATUS.md NEXT_TASKS.md || true
            git checkout --theirs .github/workflows/pr-validation.yml || true
            git add CURRENT_STATUS.md NEXT_TASKS.md .github/workflows/pr-validation.yml
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without listed conflicts"
            exit "$merge_status"
          fi

          rm -f .github/workflows/purchase-base-sync.yml
          rm -f .github/workflows/purchase-source-snapshot.yml
          rm -f .github/sync-marker.tmp
          git add -A
          if git diff --cached --quiet; then
            echo "No sync changes to commit."
            exit 0
          fi
          git commit -m "merge: sync current default before purchase final gates"
          git push origin HEAD:feat/purchase-receipt-complete-20260731
