# Branch-only one-shot dispatcher. Do not merge this variant.
name: Finish Alumdoor Canonical BOM Local Now

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-main:
    if: ${{ github.event.pull_request.head.ref == 'agent/alumdoor-bom-finish-trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the reviewed main workflow and report its run id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime, json, os, time, urllib.parse, urllib.request
          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          dispatch = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/alumdoor-bom-finish-now.yml/dispatches',
              data=json.dumps({'ref': 'main'}).encode(),
              method='POST',
              headers=headers,
          )
          with urllib.request.urlopen(dispatch) as response:
              print(f'BOM_MAIN_DISPATCH=PASS status={response.status}')
          for attempt in range(1, 11):
              time.sleep(2)
              query = urllib.parse.urlencode({'event':'workflow_dispatch','branch':'main','per_page':'5'})
              runs_req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/workflows/alumdoor-bom-finish-now.yml/runs?{query}',
                  headers={k:v for k,v in headers.items() if k != 'Content-Type'},
              )
              with urllib.request.urlopen(runs_req) as response:
                  payload = json.load(response)
              runs = payload.get('workflow_runs', [])
              if runs:
                  run = runs[0]
                  print(f"BOM_MAIN_DISPATCH_RUN id={run.get('id')} run_number={run.get('run_number')} status={run.get('status')} conclusion={run.get('conclusion')} head_sha={run.get('head_sha')} created_at={run.get('created_at')}")
                  break
              print(f'BOM_MAIN_DISPATCH_LOOKUP attempt={attempt} no_run_yet')
          else:
              raise SystemExit('workflow dispatch accepted but no workflow_dispatch run appeared')
          PY
