# Branch-only cleanup. Do not merge this variant.
name: Finish Alumdoor Canonical BOM Local Now

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

jobs:
  cleanup-redundant-run:
    if: ${{ github.event.pull_request.head.ref == 'agent/alumdoor-bom-finish-trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel redundant workflow_dispatch run and preserve original merge run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          repo = os.environ['REPO']
          redundant = 32103962700
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{redundant}/cancel',
              data=b'{}', method='POST', headers=headers,
          )
          try:
              with urllib.request.urlopen(req) as response:
                  print(f'BOM_REDUNDANT_RUN_CANCEL=PASS run_id={redundant} status={response.status}')
          except urllib.error.HTTPError as error:
              body = error.read().decode(errors='replace')
              if error.code == 409:
                  print(f'BOM_REDUNDANT_RUN_CANCEL=NOOP run_id={redundant} status=409 body={body}')
              else:
                  raise
          for run_id in (32102913565, 32103962700):
              r = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}', headers={k:v for k,v in headers.items() if k!='Content-Type'})
              with urllib.request.urlopen(r) as response:
                  run = json.load(response)
              print(f"BOM_RUN_STATE id={run_id} number={run.get('run_number')} status={run.get('status')} conclusion={run.get('conclusion')} event={run.get('event')} head_sha={run.get('head_sha')}")
          PY
