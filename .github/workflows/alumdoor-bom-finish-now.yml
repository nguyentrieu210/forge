name: Finish Alumdoor Canonical BOM Local Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alumdoor-bom-finish-now.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  enqueue-evidence:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/alumdoor-bom-finish-trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report one-shot enqueue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = f"## BOM ONE-SHOT ENQUEUED\n\nhead_sha: `{os.environ['HEAD_SHA']}`"
          req = urllib.request.Request(
              'https://api.github.com/repos/nguyentrieu210/forge/issues/951/comments',
              data=json.dumps({'body': body}).encode(), method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(req).read()
          PY

  finish-bom-local:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/alumdoor-bom-finish-trigger' }}
    runs-on: [self-hosted]
    timeout-minutes: 45
    concurrency:
      group: alumdoor-bom-finish-now
      cancel-in-progress: false
    steps:
      - name: Bootstrap latest main then reconcile source-complete BOM
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Continue'
          $logPath = Join-Path $env:RUNNER_TEMP 'alumdoor-bom-finish-now.log'
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            "BOM_FINISH_ATTEMPT=$attempt" | Tee-Object -FilePath $logPath -Append
            Remove-Item Env:FORGE_LOCAL_EXPECTED_SHA -ErrorAction SilentlyContinue
            & node scripts\local-runner\run-local-import.mjs bootstrap 2>&1 | Tee-Object -FilePath $logPath -Append
            $bootstrapExit = $LASTEXITCODE
            if ($bootstrapExit -ne 0) {
              "BOM_FINISH_BOOTSTRAP_EXIT=$bootstrapExit" | Tee-Object -FilePath $logPath -Append
              continue
            }
            Remove-Item Env:FORGE_LOCAL_EXPECTED_SHA -ErrorAction SilentlyContinue
            & node scripts\local-runner\run-local-import.mjs bom 2>&1 | Tee-Object -FilePath $logPath -Append
            $bomExit = $LASTEXITCODE
            "BOM_FINISH_IMPORT_EXIT=$bomExit" | Tee-Object -FilePath $logPath -Append
            if ($bomExit -eq 0) { $ok = $true; break }
          }
          if (-not $ok) { throw 'Canonical source-complete BOM local persistence did not complete successfully' }

      - name: Publish final BOM evidence to PR 951
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'alumdoor-bom-finish-now.log'
          $lines = @()
          if (Test-Path $logPath) {
            $patterns = @(
              'BOM_FINISH_',
              'BOOTSTRAP_SOURCE_SYNC=',
              'RUNNER_EVIDENCE ',
              'INFRA_STATUS=',
              'DATA_STATUS=',
              'ALUMDOOR_BOM_SOURCE_COMPLETE ',
              'ALUMDOOR_BOM_DATA_READY ',
              'GLOBAL_D1_LOCK=',
              'BACKUP_STATUS=',
              'ALUMDOOR_ITEM_LOCAL_IMPORT_PASS ',
              'ALUMDOOR_BOM_LOCAL_IMPORT_PASS ',
              'ALUMDOOR_BOM_TEMPLATE_IMPORT_PASS ',
              'ALUMDOOR_BOM_D1_SUMMARY ',
              'ALUMDOOR_BOM_D1_CANONICAL ',
              'ALUMDOOR_BOM_D1_VERIFY_PASS',
              'ALUMDOOR_LOCAL_BOM_IDEMPOTENCE_PASS ',
              'BOM_AUDIT_TOTAL=',
              'BOM_COMPLETE=',
              'BOM_INCOMPLETE=',
              'BOM_COMPONENTS_TOTAL=',
              'MISSING_COMPONENTS=',
              'MISSING_ITEMS=',
              'ITEMS_ADDED=',
              'BOM_CREATED=',
              'BOM_UPDATED=',
              'BOM_UNCHANGED=',
              'BOM_TEMPLATE_CREATED=',
              'BOM_TEMPLATE_UPDATED=',
              'IDEMPOTENT_SECOND_PASS=',
              'PENDING_VALUE_ROWS=',
              'D1_',
              'FORGE_LOCAL_IMPORT_EXECUTION_PASS ',
              'EXECUTION_STATUS='
            )
            foreach ($line in Get-Content $logPath) {
              foreach ($pattern in $patterns) {
                if ($line -like "*$pattern*") { $lines += $line; break }
              }
            }
          }
          if ($lines.Count -eq 0 -and (Test-Path $logPath)) { $lines = @(Get-Content $logPath | Select-Object -Last 80) }
          $evidence = ($lines | Select-Object -Last 220) -join "`n"
          $body = @"
          ## BOM LOCAL SOURCE-COMPLETE FINAL EXECUTION

          ```text
          $evidence
          ```
          "@
          $payload = @{ body = $body } | ConvertTo-Json -Depth 4
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/nguyentrieu210/forge/issues/951/comments' -Headers $headers -Body $payload -ContentType 'application/json' | Out-Null
