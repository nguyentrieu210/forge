# Branch-only workflow-run diagnostic. Do not merge this variant.
name: Finish Alumdoor Canonical BOM Local Now

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  inspect-runs:
    if: ${{ github.event.pull_request.head.ref == 'agent/alumdoor-bom-finish-trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: List recent finish workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          query = urllib.parse.urlencode({'per_page':'20'})
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/alumdoor-bom-finish-now.yml/runs?{query}",
              headers=headers,
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          for run in payload.get('workflow_runs', []):
              print('BOM_FINISH_RUN ' + ' '.join([
                  f"id={run.get('id')}", f"number={run.get('run_number')}", f"event={run.get('event')}",
                  f"status={run.get('status')}", f"conclusion={run.get('conclusion')}",
                  f"head_branch={run.get('head_branch')}", f"head_sha={run.get('head_sha')}",
                  f"created_at={run.get('created_at')}", f"updated_at={run.get('updated_at')}",
              ]))
          PY
