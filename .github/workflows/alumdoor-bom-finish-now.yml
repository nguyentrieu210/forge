# Branch-only Actions diagnostic. Do not merge this variant.
name: Finish Alumdoor Canonical BOM Local Now

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  inspect-active-jobs:
    if: ${{ github.event.pull_request.head.ref == 'agent/alumdoor-bom-finish-trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect queued and in-progress runner assignments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          repo = os.environ['REPO']
          seen = set()
          for status in ('in_progress','queued','waiting','pending'):
              query = urllib.parse.urlencode({'status':status,'per_page':'50'})
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?{query}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  runs = json.load(response).get('workflow_runs', [])
              for run in runs:
                  run_id = run.get('id')
                  if run_id in seen:
                      continue
                  seen.add(run_id)
                  jobs_req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100', headers=headers)
                  with urllib.request.urlopen(jobs_req) as response:
                      jobs = json.load(response).get('jobs', [])
                  for job in jobs:
                      labels = ','.join(job.get('labels') or [])
                      runner = job.get('runner_name') or 'UNASSIGNED'
                      runner_group = job.get('runner_group_name') or 'NONE'
                      print('ACTIVE_JOB ' + ' '.join([
                          f"run_id={run_id}", f"workflow={json.dumps(run.get('name'))}", f"run_status={run.get('status')}",
                          f"job_id={job.get('id')}", f"job={json.dumps(job.get('name'))}", f"job_status={job.get('status')}",
                          f"runner={json.dumps(runner)}", f"runner_group={json.dumps(runner_group)}", f"labels={json.dumps(labels)}",
                          f"created_at={run.get('created_at')}", f"updated_at={run.get('updated_at')}",
                      ]))
          PY
