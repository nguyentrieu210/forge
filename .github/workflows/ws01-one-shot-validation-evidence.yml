name: WS01 one-shot validation evidence

on:
  push:
    branches:
      - agent/ent-01-finance-vn
    paths:
      - .github/workflows/ws01-one-shot-validation-evidence.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ent-01-finance-vn
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Run gates and write evidence
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/ws01-logs docs/agents/workstreams
          run_gate() {
            name="$1"; shift
            "$@" >"/tmp/ws01-logs/${name}.log" 2>&1
            code=$?
            echo "$code" >"/tmp/ws01-logs/${name}.code"
            return 0
          }
          run_gate install pnpm install --frozen-lockfile --prefer-offline
          if [ "$(cat /tmp/ws01-logs/install.code)" = "0" ]; then
            run_gate build pnpm --filter cloudforge run build
            run_gate unit pnpm --filter cloudforge run test:unit
            run_gate sql pnpm --filter cloudforge run test:sql
            run_gate app_check pnpm --filter cloudforge run app:check
            run_gate worker_typecheck pnpm --filter cloudforge run typecheck:workers
          else
            for name in build unit sql app_check worker_typecheck; do echo 125 >"/tmp/ws01-logs/${name}.code"; echo "SKIPPED: install failed" >"/tmp/ws01-logs/${name}.log"; done
          fi
          head_sha="$(git rev-parse HEAD)"
          {
            echo "# WS01 exact-head validation evidence"
            echo
            echo "Generated by temporary GitHub Actions validation on branch \`agent/ent-01-finance-vn\`."
            echo
            echo "- Head before evidence commit: \`${head_sha}\`"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Production mutation/deploy: none"
            echo
            echo "| Gate | Exit | Status |"
            echo "| --- | ---: | --- |"
            failed=0
            for name in install build unit sql app_check worker_typecheck; do
              code="$(cat /tmp/ws01-logs/${name}.code)"
              if [ "$code" = "0" ]; then status=PASS; else status=FAIL; failed=1; fi
              echo "| ${name} | ${code} | ${status} |"
            done
            echo
            for name in install build unit sql app_check worker_typecheck; do
              code="$(cat /tmp/ws01-logs/${name}.code)"
              if [ "$code" != "0" ]; then
                echo "## ${name} failure tail"
                echo '```text'
                tail -n 100 "/tmp/ws01-logs/${name}.log"
                echo '```'
                echo
              fi
            done
            echo "VALIDATION_FAILED=${failed}"
          } > docs/agents/workstreams/WS01_VALIDATION_EVIDENCE.md
          git rm .github/workflows/ws01-one-shot-validation-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/workstreams/WS01_VALIDATION_EVIDENCE.md
          git commit -m "test(ws01): record exact-head validation evidence"
          git push origin HEAD:agent/ent-01-finance-vn
          exit "$failed"
