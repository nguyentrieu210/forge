name: PR Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changed-file policy
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/active-changed-files.txt"
          cat "$RUNNER_TEMP/active-changed-files.txt"

          forbidden='(^|/)\.env($|\.)|(^|/)server/work/|(^|/)tmp/|(^|/)(backup|backups)/|(^|/).*generated[-_ ]evidence|^\.github/workflows/.*(once|sync|transport|temporary).*\.ya?ml$|^server/scripts/\..*trigger$'
          if grep -Eiq "$forbidden" "$RUNNER_TEMP/active-changed-files.txt"; then
            echo "Forbidden temporary, secret, backup, generated, or transport file detected:" >&2
            grep -Ei "$forbidden" "$RUNNER_TEMP/active-changed-files.txt" >&2 || true
            exit 1
          fi

      - name: Confirm validation ownership
        run: |
          echo "Full test, typecheck, and build run once in CI."
          echo "Feature workflows run focused gates or pass quickly when unrelated."
          echo "Production deployment is not part of PR validation."
