name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  rbac-slice-b-wire:
    name: Wire and gate RBAC Slice B
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply, verify and commit pending wiring
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" != "feat/rbac-permission-slice-b-core-20260731" ] || [ ! -f server/scripts/apply-rbac-slice-b-wiring.py ]; then
            echo "No pending Slice B wiring patch for $HEAD_REF."
            exit 0
          fi
          pr="$(gh pr list --repo "${{ github.repository }}" --head "$HEAD_REF" --state open --json number --jq '.[0].number // empty')"
          trap 'if [ -n "$pr" ]; then gh pr comment "$pr" --repo "${{ github.repository }}" --body "RBAC Slice B wiring failed in workflow run ${RUN_ID}. No wiring commit was pushed." || true; fi' ERR
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server/scripts/apply-rbac-slice-b-wiring.py")
          text = path.read_text(encoding="utf-8")
          old = '''    count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")
          '''
          new = '''    count = text.count(old)
              if count == 1:
                  target.write_text(text.replace(old, new), encoding="utf-8")
                  return
              if (
                  path == "server/tests/rbac-contract.test.mjs"
                  and old == "    users: userStore(),\\n"
                  and count == 3
              ):
                  index = text.rfind(old)
                  target.write_text(text[:index] + new + text[index + len(old):], encoding="utf-8")
                  return
              raise SystemExit(f"{path}: expected one exact match, found {count}")
          '''
          if text.count(old) != 1:
              raise SystemExit("wiring helper anchor changed")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python3 server/scripts/apply-rbac-slice-b-wiring.py
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm build
          rm server/scripts/apply-rbac-slice-b-wiring.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/packages/auth/src/user-store.ts \
            server/packages/frappe-api/src/router.ts \
            server/tests/rbac-contract.test.mjs \
            server/scripts/apply-rbac-slice-b-wiring.py
          git diff --cached --check
          git commit -m "feat(rbac): wire atomic administration into API"
          git push origin HEAD:"$HEAD_REF"
