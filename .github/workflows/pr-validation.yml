name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  rbac-slice-b-apply:
    name: Apply and gate RBAC Slice B
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Slice B branch
        uses: actions/checkout@v4
        with:
          ref: feat/rbac-permission-slice-b-20260731
          fetch-depth: 0

      - name: Apply, verify and commit when pending
        env:
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$PR_NUMBER" != "38" ] || [ ! -f .github/rbac-slice-b-patch.gz.b64 ]; then
            echo "No pending Slice B payload for this pull request."
            exit 0
          fi
          trap 'gh pr comment 38 --repo "${{ github.repository }}" --body "RBAC Slice B apply/gate failed in workflow run ${RUN_ID}. No implementation commit was pushed." || true' ERR
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          base64 --decode .github/rbac-slice-b-patch.gz.b64 | gzip --decompress > /tmp/apply-rbac-slice-b.py
          python /tmp/apply-rbac-slice-b.py
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm build
          rm -f .github/workflows/rbac-slice-b-one-shot.yml .github/rbac-slice-b-patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/rbac-slice-b-one-shot.yml \
            .github/rbac-slice-b-patch.gz.b64 \
            server/migrations/tenant/0030_rbac_audit.sql \
            server/scripts/test-rbac-audit-migration.py \
            server/packages/auth/src/user-store.ts \
            server/packages/frappe-model/src/permission.ts \
            server/packages/frappe-api/src/router.ts \
            server/tests/rbac-admin-contract.test.mjs \
            server/package.json
          git diff --cached --check
          git commit -m "feat(rbac): add atomic access administration and audit"
          git push origin HEAD:feat/rbac-permission-slice-b-20260731
