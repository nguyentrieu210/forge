name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  rbac-slice-b-wire:
    name: Wire and gate RBAC Slice B
    if: "${{ github.event.pull_request.number == 39 && github.event.pull_request.head.sha == 'abc34716361d709394fdada6bb13b2edd78d697d' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact Slice B branch
        uses: actions/checkout@v4
        with:
          ref: feat/rbac-permission-slice-b-core-20260731
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply exact wiring patch
        run: python3 server/scripts/apply-rbac-slice-b-wiring.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Commit verified wiring
        run: |
          rm server/scripts/apply-rbac-slice-b-wiring.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/packages/auth/src/user-store.ts \
            server/packages/frappe-api/src/router.ts \
            server/tests/rbac-contract.test.mjs \
            server/scripts/apply-rbac-slice-b-wiring.py
          git diff --cached --check
          git commit -m "feat(rbac): wire atomic administration into API"
          git push origin HEAD:feat/rbac-permission-slice-b-core-20260731

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 39 --repo "${{ github.repository }}" --body "RBAC Slice B wiring failed in workflow run ${{ github.run_id }}. No wiring commit was pushed."
