name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - hotfix/alumdoor-print-list-delete
    paths:
      - .github/release/alu-production.trigger

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  release_alu:
    if: github.event_name == 'push'
    name: Release alu production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      TENANT: alu
      TARGET_SHA: 4500799f13de48ada1948ab583afcf2e52b4c2dd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5

    steps:
      - name: Checkout verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare release directories
        shell: bash
        run: |
          set -euo pipefail
          test "$TENANT" = "alu"
          test "$TARGET_SHA" = "4500799f13de48ada1948ab583afcf2e52b4c2dd"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/alu-release-evidence" >> "$GITHUB_ENV"
          echo "BACKUP_DIR=$RUNNER_TEMP/alu-backup" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/alu-release-evidence" "$RUNNER_TEMP/alu-backup"
          printf 'run_id=%s\ntarget_sha=%s\nstarted_at=%s\nfifo_rollout=disabled\n' \
            "$GITHUB_RUN_ID" "$TARGET_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$RUNNER_TEMP/alu-release-evidence/state.txt"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backup tenant
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/backup-dry.log"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$BACKUP_DIR" 2>&1 | tee "$EVIDENCE_DIR/backup-live.log"
          echo 'backup=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-pre-release-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-backup/
          if-no-files-found: error
          retention-days: 14

      - name: Migrate tenant
        shell: bash
        run: |
          set -euo pipefail
          cd server
          node scripts/migrate-tenant.mjs --tenant "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/migrate-dry.log"
          node scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/migrate-live.log"
          echo 'migration=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy tenant
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/alu-release-evidence/wrangler-output.ndjson
        run: |
          set -euo pipefail
          cd server
          node scripts/deploy-tenant.mjs --tenant "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/deploy-dry.log"
          node scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/deploy-live.log"
          echo 'deploy=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://alu.kairo.vn'
          health=0
          for attempt in $(seq 1 18); do
            health="$(curl --silent --show-error --output "$EVIDENCE_DIR/health.json" --write-out '%{http_code}' "$BASE/health" || true)"
            [ "$health" = '200' ] && break
            sleep 5
          done
          test "$health" = '200'
          boot="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' "$BASE/api/method/metaforge.api.get_boot" || true)"
          test "$boot" = '403'
          printf 'health=%s\nguest_boot=%s\nsmoke=pass\n' "$health" "$boot" >> "$EVIDENCE_DIR/state.txt"

      - name: Collect Cloudflare evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cloudforge-tenant-alu/deployments" \
            --output "$EVIDENCE_DIR/deployments.json"
          echo 'provider_evidence=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-production-release-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-release-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Report release result on PR 47
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const dir = `${process.env.RUNNER_TEMP}/alu-release-evidence`;
            const state = fs.existsSync(`${dir}/state.txt`)
              ? fs.readFileSync(`${dir}/state.txt`, 'utf8')
              : 'release job did not create state.txt';
            const marker = '<!-- alu-sales-production-release -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n# alu sales production release\n\n\`\`\`text\n${state}\n\`\`\`\n\n[Workflow and artifacts](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 47,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 47, body });
            }
