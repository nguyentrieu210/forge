name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect validation scope
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - name: Classify changed files
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('heavy', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const filenames = files.map((file) => file.filename);
            const docsOnly = filenames.length > 0 && filenames.every((filename) =>
              filename.endsWith('.md') ||
              filename.startsWith('docs/') ||
              filename.startsWith('.github/release/')
            );
            core.info(`Heavy validation: ${!docsOnly}; files: ${filenames.join(', ')}`);
            core.setOutput('heavy', String(!docsOnly));

  validate:
    name: Test, typecheck and build
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  result:
    name: PR Validation Result
    needs: [scope, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce validation result
        shell: bash
        run: |
          set -euo pipefail
          scope='${{ needs.scope.result }}'
          validate='${{ needs.validate.result }}'
          test "$scope" = 'success'
          if [ "$validate" != 'success' ] && [ "$validate" != 'skipped' ]; then
            echo "Validation job ended with: $validate"
            exit 1
          fi
          echo "PR validation result: pass ($validate)"
