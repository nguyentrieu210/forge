name: Temporary Run Surface Finish Exclusions

on:
  push:
    paths:
      - '.github/workflows/_tmp-run-surface-finish-exclusions.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alumdoor-surface-finish-exclusions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply base and V2 patches
        run: |
          python3 server/scripts/_tmp-surface-finish-exclusions.py
          python3 server/scripts/_tmp-surface-finish-exclusions-v2.py
          python3 server/scripts/_tmp-surface-finish-exclusions-childfix.py
      - name: Install and build server
        working-directory: server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Validate metadata and catalog
        working-directory: server
        run: |
          node scripts/forge-app.mjs briefs/alumdoor.json --dry-run
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
          node --test tests/alumdoor-color-catalog.test.mjs tests/alumdoor-color-seed-authority.test.mjs
      - name: Test exclusion resolver
        working-directory: server
        run: node --test tests/alumdoor-color-scopes.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/briefs/alumdoor.json server/briefs/alumdoor-v2.json server/scripts/lib/alumdoor-color-catalog.mjs server/apps-src/alumdoor-worker/src/color-scopes.ts server/tests/alumdoor-color-scopes.test.mjs server/tests/alumdoor-color-catalog.test.mjs server/tests/alumdoor-color-seed-authority.test.mjs
          git diff --cached --check
          git commit -m "feat(alumdoor): add Surface Finish exclusions"
          git push origin HEAD:fix/alumdoor-surface-finish-exclusions
