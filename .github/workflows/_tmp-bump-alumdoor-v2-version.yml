name: Temporary Bump Alumdoor V2 Version

on:
  push:
    paths:
      - '.github/workflows/_tmp-bump-alumdoor-v2-version.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alumdoor-surface-finish-exclusions-v2-version
      - name: Bump version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('server/briefs/alumdoor-v2.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['version'] == '2.0.42', data['version']
          data['version'] = '2.0.43'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/briefs/alumdoor-v2.json
          git diff --cached --check
          git commit -m "fix(alumdoor): bump V2 for Surface Finish exclusions"
          git push origin HEAD:fix/alumdoor-surface-finish-exclusions-v2-version
