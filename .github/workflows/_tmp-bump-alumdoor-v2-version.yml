name: Temporary Cleanup Alumdoor V2 Bump

on:
  push:
    paths:
      - '.github/workflows/_tmp-bump-alumdoor-v2-version.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alumdoor-surface-finish-exclusions-v2-version
          fetch-depth: 0
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-bump-alumdoor-v2-version.yml
          git commit -m "chore(alumdoor): remove temporary V2 bump workflow"
          git push origin HEAD:fix/alumdoor-surface-finish-exclusions-v2-version
