name: TEMP Finalize Compact Sales Header
on:
  push:
    branches: [ui/alumdoor-sales-header-compact]
    paths: [.github/workflows/temp-sales-compact-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/alumdoor-sales-header-compact
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Finalize header and verify
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''            <div className="mb-3 flex items-center justify-between gap-3">\n              <h2 className="text-base font-semibold">Thông tin khách hàng</h2>\n              {text(header.customer_group) ? (\n                <span className="text-[11px] text-muted-foreground">{text(header.customer_group)}</span>\n              ) : null}\n            </div>'''
          new = '''            <div className="mb-3">\n              <h2 className="text-base font-semibold">Thông tin khách hàng</h2>\n            </div>'''
          if old not in s:
              raise SystemExit('header marker not found')
          s = s.replace(old, new, 1)
          old_phone = 'const phoneValue = salesPhoneField ? text(header[salesPhoneField]) : customerPhone;'
          new_phone = 'const phoneValue = salesPhoneField ? text(header[salesPhoneField]) || customerPhone : customerPhone;'
          if old_phone not in s:
              raise SystemExit('phone marker not found')
          s = s.replace(old_phone, new_phone, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check -- client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          pnpm --filter metaforge run build
          git config user.name "forge-ui-bot"
          git config user.email "forge-ui-bot@users.noreply.github.com"
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git commit -m "refactor(ui): keep AlumDoor sales header essential-only"
          git push origin HEAD:ui/alumdoor-sales-header-compact
