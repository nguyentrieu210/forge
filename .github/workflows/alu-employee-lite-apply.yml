name: ALU Apply Employee Lite

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alu-employee-lite-apply.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ALU_EMPLOYEE_LITE to apply the tenant customization
        required: true
        type: string
      target_sha:
        description: Exact merged main SHA to run; defaults to selected ref SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-alu-employee-lite
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and verify Employee Lite on ALU
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'ALU_EMPLOYEE_LITE')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha || github.sha }}
      FORGE_ORIGIN: https://alu.kairo.vn
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}

    steps:
      - name: Checkout exact merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require target to be merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Refusing Employee Lite apply: $TARGET_SHA is not merged into main."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FORGE_ADMIN_USER" || { echo "Missing FORGE_ADMIN_USER/ALU_META_ADMIN_USER"; exit 1; }
          test -n "$FORGE_ADMIN_PASSWORD" || { echo "Missing FORGE_ADMIN_PASSWORD/ALU_META_ADMIN_PASSWORD"; exit 1; }

      - name: Apply tenant-scoped Employee Lite metadata
        run: node server/scripts/apply-alumdoor-employee-lite.mjs --execute --confirm ALU_EMPLOYEE_LITE

      - name: Verify public production health remains available
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' https://alu.kairo.vn/health >/dev/null
          echo "ALU_EMPLOYEE_LITE_PRODUCTION_OK sha=$TARGET_SHA"
