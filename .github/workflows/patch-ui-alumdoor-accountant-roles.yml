name: Patch Alumdoor accountant Warehouse Cash roles

on:
  push:
    branches:
      - fix/ui-alumdoor-warehouse-cash-accountant-roles-20260803
    paths:
      - .github/workflows/patch-ui-alumdoor-accountant-roles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-alumdoor-warehouse-cash-accountant-roles-20260803
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Add accountant roles to Warehouse Cash UI allowlist
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/apps/runtime/src/experiences/AlumdoorOperationsCenter.tsx')
          s = p.read_text()
          old = '  "Kế toán trưởng",\n  "Accounts Manager",'
          new = '  "Kế toán trưởng",\n  "Kế toán tổng hợp",\n  "Kế toán",\n  "Accounts Manager",'
          if old not in s:
              raise SystemExit('expected Warehouse Cash role block not found')
          p.write_text(s.replace(old, new, 1))
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter metaforge run build
      - name: Verify exact UI role coverage
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"Kế toán tổng hợp"' client/apps/runtime/src/experiences/AlumdoorOperationsCenter.tsx
          grep -q '"Kế toán"' client/apps/runtime/src/experiences/AlumdoorOperationsCenter.tsx
      - name: Commit validated UI patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client/apps/runtime/src/experiences/AlumdoorOperationsCenter.tsx
          git commit -m 'fix(ui): show Warehouse Cash to accounting roles'
          git push origin HEAD:fix/ui-alumdoor-warehouse-cash-accountant-roles-20260803
