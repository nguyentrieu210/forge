name: Sentrux parallel Alumdoor lane 3

on:
  pull_request:
    branches: [main]
    paths:
      - "server/apps-src/alumdoor-worker/**"
      - ".github/workflows/sentrux-parallel-alumdoor-lane3.yml"

permissions:
  contents: read

concurrency:
  group: sentrux-parallel-alumdoor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/sentrux-parallel-alumdoor'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout lane baseline
        uses: actions/checkout@v4
        with:
          ref: 7a44c58458e2fe54dfc0db915dfb9df07b05a898
          fetch-depth: 0

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Measure exact lane baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-before.txt
          quality=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-before.txt | tail -1 | grep -Eo '[0-9]+')
          echo "quality=$quality" >> "$GITHUB_OUTPUT"
          echo "BASELINE_QUALITY=$quality"

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Measure source-only candidate and require score gain
        shell: bash
        env:
          BEFORE: ${{ steps.before.outputs.quality }}
        run: |
          set -euo pipefail
          # This workflow exists only to measure the candidate. Remove it from the
          # candidate scan so a CI file cannot manufacture a Sentrux score gain.
          git rm -q --cached .github/workflows/sentrux-parallel-alumdoor-lane3.yml
          rm -f .github/workflows/sentrux-parallel-alumdoor-lane3.yml

          sentrux gate --save . | tee /tmp/sentrux-after.txt
          after=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-after.txt | tail -1 | grep -Eo '[0-9]+')
          echo "BEFORE_QUALITY=$BEFORE"
          echo "AFTER_QUALITY=$after"
          test "$after" -gt "$BEFORE"

          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          max_cc = 25
          EOF
          set +e
          sentrux check . 2>&1 | tee /tmp/sentrux-check.txt
          check_status=${PIPESTATUS[0]}
          set -e
          echo "CHECK_STATUS=$check_status"
          echo "=== Alumdoor entry complexity after refactor ==="
          grep -F 'server/apps-src/alumdoor-worker/src/entry.ts:' /tmp/sentrux-check.txt || true
          if grep -qi 'circular dependencies\|cycle(s) found' /tmp/sentrux-check.txt; then
            echo "Candidate introduced a dependency cycle"
            exit 1
          fi
          rm -rf .sentrux

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit server dist and reject changed-file TypeScript errors
        working-directory: server
        shell: bash
        run: |
          set +e
          pnpm exec tsc -p tsconfig.json --noEmitOnError false --pretty false 2>&1 | tee /tmp/sentrux3-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          test -f dist/apps-src/alumdoor-worker/src/entry.js
          if [ "$status" -ne 0 ]; then
            grep "error TS" /tmp/sentrux3-tsc.log > /tmp/sentrux3-ts-errors.log || true
            cat /tmp/sentrux3-ts-errors.log
            if grep -E 'apps-src/alumdoor-worker/src/entry\.ts' /tmp/sentrux3-ts-errors.log; then
              echo "Lane 3 changed file has TypeScript errors"
              exit 1
            fi
          fi

      - name: Focused Alumdoor entry tests
        working-directory: server
        run: |
          node --test \
            tests/aluminum-entry-authority.test.mjs \
            tests/aluminum-item-validator-boundary.test.mjs \
            tests/alumdoor-item-validator.test.mjs \
            tests/aluminum-validation-bridge.test.mjs

      - name: Diff hygiene
        run: git diff --check 7a44c58458e2fe54dfc0db915dfb9df07b05a898...HEAD
