name: Alumdoor Pricing Convergence Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/alumdoor/docs/nguon/ms-lien/ĐM.md"
      - "apps/alumdoor/docs/nguon/ms-lien/Trang-tính29.md"
      - "server/scripts/extract-alumdoor-pricing-source.mjs"
      - "server/scripts/build-alumdoor-pricing-payload.mjs"
      - "server/scripts/validate-alumdoor-pricing-payload.mjs"
      - "server/scripts/import-alumdoor-pricing-local.mjs"
      - "server/tests/sales-price-field-lookup.test.mjs"
      - "server/packages/clouderp-pricing/**"
      - "server/packages/clouderp-selling/**"
      - ".github/workflows/alumdoor-pricing-convergence-validation.yml"
      - ".github/workflows/alumdoor-pricing-local-import.yml"

permissions:
  contents: read

jobs:
  validate-real-pricing-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Syntax check convergence scripts
        run: |
          node --check server/scripts/extract-alumdoor-pricing-source.mjs
          node --check server/scripts/build-alumdoor-pricing-payload.mjs
          node --check server/scripts/validate-alumdoor-pricing-payload.mjs
          node --check server/scripts/import-alumdoor-pricing-local.mjs

      - name: Regenerate canonical Item evidence
        run: |
          mkdir -p /tmp/alumdoor-pricing
          node server/scripts/extract-alumdoor-real-source-records.mjs \
            /tmp/alumdoor-pricing/item-source.json \
            /tmp/alumdoor-pricing/item-source.report.json
          node server/scripts/build-alumdoor-item-master-payload.mjs \
            /tmp/alumdoor-pricing/item-source.json \
            /tmp/alumdoor-pricing/items.json \
            /tmp/alumdoor-pricing/items.audit.json

      - name: Extract complete pricing source
        run: |
          node server/scripts/extract-alumdoor-pricing-source.mjs \
            /tmp/alumdoor-pricing/pricing-source.json \
            /tmp/alumdoor-pricing/pricing-source.report.json

      - name: Build pricing payload twice
        run: |
          node server/scripts/build-alumdoor-pricing-payload.mjs \
            /tmp/alumdoor-pricing/pricing-source.json \
            /tmp/alumdoor-pricing/items.json \
            /tmp/alumdoor-pricing/pricing-payload-1.json \
            /tmp/alumdoor-pricing/pricing-payload-1.report.json
          node server/scripts/build-alumdoor-pricing-payload.mjs \
            /tmp/alumdoor-pricing/pricing-source.json \
            /tmp/alumdoor-pricing/items.json \
            /tmp/alumdoor-pricing/pricing-payload-2.json \
            /tmp/alumdoor-pricing/pricing-payload-2.report.json
          cmp /tmp/alumdoor-pricing/pricing-payload-1.json /tmp/alumdoor-pricing/pricing-payload-2.json
          cmp /tmp/alumdoor-pricing/pricing-payload-1.report.json /tmp/alumdoor-pricing/pricing-payload-2.report.json

      - name: Validate real-data coverage and lineage
        run: |
          node server/scripts/validate-alumdoor-pricing-payload.mjs \
            /tmp/alumdoor-pricing/pricing-source.json \
            /tmp/alumdoor-pricing/pricing-payload-1.json \
            /tmp/alumdoor-pricing/pricing-payload-1.report.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        working-directory: server
        run: pnpm run build

      - name: Focused pricing authority regression
        working-directory: server
        run: node --test tests/sales-price-field-lookup.test.mjs

      - name: Preserve generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alumdoor-pricing-convergence-${{ github.sha }}
          path: |
            /tmp/alumdoor-pricing/pricing-source.json
            /tmp/alumdoor-pricing/pricing-source.report.json
            /tmp/alumdoor-pricing/pricing-payload-1.json
            /tmp/alumdoor-pricing/pricing-payload-1.report.json
            /tmp/alumdoor-pricing/items.json
            /tmp/alumdoor-pricing/items.audit.json
          if-no-files-found: error
