name: TMP ALU Full Production Release 4ea0ca1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-alu-full-4ea0ca1.yml"
      - "ops/releases/alu-full-4ea0ca1-authorization.txt"

permissions:
  contents: read

concurrency:
  group: release-alu-tenant-production
  cancel-in-progress: false

jobs:
  release:
    name: Backup, migrate, deploy ALU full release and verify
    if: github.head_ref == 'release/alu-full-4ea0ca1-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      TENANT: alu
      TARGET_SHA: 4ea0ca19b24257aab55d65a5c57ebc8e3b096bc7
      AUTH_FILE: ops/releases/alu-full-4ea0ca1-authorization.txt
      APP_WORKER: cloudforge-app-alumdoor
      DISPATCH_NAMESPACE: cloudforge-production
      FORGE_ORIGIN: https://alu.kairo.vn
      EXPECTED_APP_VERSION: 2.2.6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}
      VITE_FORGE_RELEASE_SHA: 4ea0ca19b24257aab55d65a5c57ebc8e3b096bc7
      EVIDENCE_DIR: /tmp/alu-full-release-evidence

    steps:
      - name: Checkout temporary release authorization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify explicit authorization and immutable main target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test -f "$AUTH_FILE"
          grep -Fxq 'ACTION=FULL_ALU_PRODUCTION_RELEASE' "$AUTH_FILE"
          grep -Fxq 'TENANT=alu' "$AUTH_FILE"
          grep -Fxq 'TARGET_SHA=4ea0ca19b24257aab55d65a5c57ebc8e3b096bc7' "$AUTH_FILE"
          grep -Fxq 'SOURCE_PR=711' "$AUTH_FILE"
          grep -Fxq 'R6_RUN=30977062886' "$AUTH_FILE"
          grep -Fxq 'APPROVAL=EXPLICIT_USER_APPROVAL_2026-08-05' "$AUTH_FILE"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${FORGE_ADMIN_USER:-}"
          test -n "${FORGE_ADMIN_PASSWORD:-}"
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$TARGET_SHA" || {
            echo "Refusing production release: authorized target $TARGET_SHA is not current main $current_main."
            exit 1
          }
          mapfile -t changed < <(git diff --name-only "$TARGET_SHA"...HEAD | sort -u)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/tmp-alu-full-4ea0ca1.yml'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'ops/releases/alu-full-4ea0ca1-authorization.txt'
          printf 'run_id=%s\ntarget_sha=%s\ntenant=%s\nsource_pr=711\nr6_run=30977062886\nauthorization=explicit\nstarted_at=%s\n' \
            "$GITHUB_RUN_ID" "$TARGET_SHA" "$TENANT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$EVIDENCE_DIR/state.txt"

      - name: Checkout exact authorized merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile frozen-install worktree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          for file in "${dirty[@]}"; do
            case "$file" in
              pnpm-lock.yaml)
                echo "Restoring exact candidate lockfile after successful frozen install."
                git restore --source=HEAD --staged --worktree -- pnpm-lock.yaml
                ;;
              *)
                echo "Refusing full release: dependency install changed unexpected source path: $file"
                exit 1
                ;;
            esac
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build exact production candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter cloudforge run build
          pnpm --filter metaforge run build
          node server/scripts/stage-client-bundle.mjs
          printf 'build=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify canonical release safety before mutation
        shell: bash
        run: |
          set -euo pipefail
          # Exact target already passed R6 Pass Convergence run 30977062886.
          # Do not add a second release gate with stricter error-copy assertions than the canonical lane.
          npm --prefix server run verify:release-safety \
            2>&1 | tee "$EVIDENCE_DIR/release-safety.log"
          printf 'r6_exact_head=pass:30977062886\nrelease_safety=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Guard generated release worktree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          for file in "${dirty[@]}"; do
            case "$file" in
              client/apps/kho/dist-mobile/*|server/apps/gateway-worker/public/*) ;;
              *)
                echo "Refusing full release: unexpected worktree change after exact build: $file"
                exit 1
                ;;
            esac
          done
          printf 'Approved generated release paths (%s):\n' "${#dirty[@]}"
          printf '  %s\n' "${dirty[@]}"

      - name: Plan tenant migrations
        working-directory: server
        run: node scripts/migrate-tenant.mjs --tenant "$TENANT"

      - name: Backup and verify tenant before migration
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/alu-backup"
          mkdir -p "$backup_dir"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$backup_dir"
          mapfile -t backups < <(find "$backup_dir" -maxdepth 1 -type f -name '*.sql' -print | sort)
          [ "${#backups[@]}" -eq 1 ] || {
            echo "Expected exactly one SQL backup, found ${#backups[@]}."
            exit 1
          }
          node server/scripts/verify-tenant-backup.mjs \
            --tenant "$TENANT" \
            --file "${backups[0]}" \
            --output "$RUNNER_TEMP/alu-backup-verification.json"
          backup_sha="$(node -e "const fs=require('fs');const p=process.argv[1];const j=JSON.parse(fs.readFileSync(p,'utf8'));process.stdout.write(j.sha256||j.source_sha256||'')" "$RUNNER_TEMP/alu-backup-verification.json")"
          printf 'backup=pass\nbackup_sha256=%s\n' "$backup_sha" >> "$EVIDENCE_DIR/state.txt"

      - name: Migrate tenant
        working-directory: server
        run: node scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" --allow-dirty

      - name: Deploy tenant Worker
        working-directory: server
        run: node scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" --allow-dirty

      - name: Deploy Alumdoor app Worker
        working-directory: server
        run: |
          pnpm exec wrangler deploy \
            --config apps-src/alumdoor-worker/wrangler.jsonc \
            --name "$APP_WORKER" \
            --dispatch-namespace "$DISPATCH_NAMESPACE" \
            --strict

      - name: Install Alumdoor metadata package through canonical browser path
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/forge-app.mjs briefs/alumdoor-v2.json \
            --origin "$FORGE_ORIGIN" \
            --admin "$FORGE_ADMIN_USER" \
            2>&1 | tee "$EVIDENCE_DIR/app-install.log"
          grep -q "app=alumdoor@$EXPECTED_APP_VERSION" "$EVIDENCE_DIR/app-install.log"
          grep -q '^LIVE  https://alu.kairo.vn' "$EVIDENCE_DIR/app-install.log"
          printf 'alumdoor_metadata=installed:%s\n' "$EXPECTED_APP_VERSION" >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy Gateway and exact UI bundle
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Verify production procurement tabs from installed manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$EVIDENCE_DIR/production-nav.json"
          const origin = process.env.FORGE_ORIGIN.replace(/\/$/, "");
          const user = process.env.FORGE_ADMIN_USER;
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map();
          let csrf = "";
          function store(response) {
            for (const value of response.headers.getSetCookie?.() ?? []) {
              const pair = value.split(";")[0];
              const i = pair.indexOf("=");
              if (i > 0) jar.set(pair.slice(0, i).trim(), pair.slice(i + 1).trim());
            }
          }
          async function call(method, body = {}) {
            const response = await fetch(`${origin}/api/method/${method}`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                ...(jar.size ? { cookie: [...jar].map(([k,v]) => `${k}=${v}`).join("; ") } : {}),
                ...(csrf ? { "x-frappe-csrf-token": csrf } : {}),
              },
              body: JSON.stringify(body),
            });
            store(response);
            csrf = response.headers.get("x-frappe-csrf-token") ?? csrf;
            const text = await response.text();
            const parsed = JSON.parse(text);
            if (!response.ok) throw new Error(`${method} HTTP ${response.status}: ${parsed.message ?? text.slice(0, 200)}`);
            return parsed.message ?? parsed;
          }
          await call("login", { usr: user, pwd: password });
          const manifest = await call("metaforge.api.get_app_manifest", { app: "alumdoor" });
          const nav = manifest.nav ?? [];
          const expected = [
            ["action:tao-don-mua", "Mua hàng"],
            ["action:nhap-nhom-fifo", "Nhập hàng"],
            ["report:Mua hàng theo nhà cung cấp", "Báo cáo"],
            ["Purchase Order", "Lịch sử mua hàng"],
          ];
          const positions = [];
          for (const [key, label] of expected) {
            const index = nav.findIndex((entry) => entry.key === key);
            if (index < 0) throw new Error(`missing procurement navigation: ${key}`);
            if (nav[index].label !== label) throw new Error(`unexpected label for ${key}: ${nav[index].label}`);
            positions.push(index);
          }
          for (let i = 1; i < positions.length; i += 1) {
            if (positions[i] <= positions[i - 1]) throw new Error(`procurement navigation order mismatch: ${positions.join(",")}`);
          }
          process.stdout.write(JSON.stringify({
            app: "alumdoor",
            expected_version: process.env.EXPECTED_APP_VERSION,
            tabs_after_shell_quy_trinh: expected.map(([key, label]) => ({ key, label })),
            positions,
            declaration_driven: true,
          }, null, 2));
          NODE
          printf 'procurement_tabs=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify production convergence and exact release marker
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/sre-health-snapshot.mjs \
            --base "$FORGE_ORIGIN" \
            --allow-remote \
            --confirm-host alu.kairo.vn \
            --expected-release-sha "$TARGET_SHA" \
            --attempts 12 \
            --delay-ms 5000 \
            --output "$EVIDENCE_DIR/health.json" \
            2>&1 | tee "$EVIDENCE_DIR/health.log"
          printf 'migration=pass\ntenant_worker=deployed\nalumdoor_worker=deployed\ngateway=deployed\nproduction_health=pass\ncompleted_at=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$EVIDENCE_DIR/state.txt"

      - name: Upload backup verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-full-backup-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-backup-verification.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-full-release-${{ github.run_id }}
          path: /tmp/alu-full-release-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Temporary ALU full production release'
            echo
            echo '```text'
            cat "$EVIDENCE_DIR/state.txt" 2>/dev/null || echo 'state.txt missing'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
