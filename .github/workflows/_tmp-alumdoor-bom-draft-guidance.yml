name: Temporary Alumdoor Draft BOM Guidance
on:
  push:
    branches: ['agent/alumdoor-bom-draft-guidance']
    paths: ['.github/workflows/_tmp-alumdoor-bom-draft-guidance.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Add draft-line BOM requirement preview
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def block(*lines):
              return "\n".join(lines) + "\n"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          materializer = 'server/apps-src/alumdoor-worker/src/bom-template-materializer.ts'
          marker = block(
              'export interface BomPreviewResult extends BomMaterializationResult {',
              '  actual_requirements: BomActualRequirement[];',
              '  missing_actual_component_keys: string[];',
              '  actual_complete: boolean;',
              '}',
          )
          addition = marker + block(
              '',
              'export interface BomRequirementInspectionResult {',
              '  bom_template: string;',
              '  bom_template_code: string;',
              '  components: ResolvedBomTemplate["components"];',
              '  actual_requirements: BomActualRequirement[];',
              '  missing_actual_component_keys: string[];',
              '  actual_complete: boolean;',
              '}',
          )
          replace_once(materializer, marker, addition)

          preview_anchor = block(
              'export async function previewProductionLineBom(',
              '  call: BomMaterializerCall,',
              '  input: { line: BomProductionLineInput; company: string },',
              '): Promise<BomPreviewResult> {',
          )
          inspector = block(
              'export async function inspectProductionLineBomRequirements(',
              '  call: BomMaterializerCall,',
              '  line: BomProductionLineInput,',
              '): Promise<BomRequirementInspectionResult> {',
              '  const templates = await loadTemplates(call);',
              '  if (!templates.length) {',
              '    throw new Error(`${line.item_code}: chưa có BOM tĩnh và chưa cấu hình BOM Template.`);',
              '  }',
              '  const { context, values } = bomContextFromProductionLine(line);',
              '  const resolved = resolveBomTemplate({ templates, context, values });',
              '  if (resolved.item_code !== line.item_code) {',
              '    throw new Error(`${resolved.template_code}: thành phẩm ${resolved.item_code} không khớp dòng bán ${line.item_code}.`);',
              '  }',
              '  const source = templates.find((template) => template.template_code === resolved.template_code);',
              '  if (!source) throw new Error(`${resolved.template_code}: không xác định được BOM Template nguồn.`);',
              '  const inspection = inspectBomActualComponents({',
              '    template_code: resolved.template_code,',
              '    ...(line.bom_actual_components === undefined ? {} : { actual_components: line.bom_actual_components }),',
              '    required_actual_component_keys: source.required_actual_component_keys,',
              '    allowed_item_codes_by_key: source.actual_component_allowed_items,',
              '  });',
              '  return {',
              '    bom_template: source.source_name,',
              '    bom_template_code: resolved.template_code,',
              '    components: resolved.components,',
              '    actual_requirements: inspection.requirements,',
              '    missing_actual_component_keys: inspection.missing_component_keys,',
              '    actual_complete: inspection.complete,',
              '  };',
              '}',
              '',
          ) + preview_anchor
          replace_once(materializer, preview_anchor, inspector)

          core = 'server/apps-src/alumdoor-worker/src/sales-production-core.ts'
          replace_once(
              core,
              'import { previewProductionLineBom, resolveProductionLineBom } from "./bom-template-materializer.js";',
              'import { inspectProductionLineBomRequirements, previewProductionLineBom, resolveProductionLineBom } from "./bom-template-materializer.js";',
          )
          replace_once(
              core,
              '      leaf_rounding: text(chosen.raw.leaf_rounding),\n      leaf_count: leaf?.leaf_count ?? null,',
              '      leaf_rounding: text(chosen.raw.leaf_rounding),\n      ray_type: text(chosen.raw.ray_type) || null,\n      leaf_count: leaf?.leaf_count ?? null,',
          )
          draft_anchor = 'export async function previewSalesProduction(call: ProductionPlatformCall, args: Json): Promise<Response> {\n'
          draft_function = block(
              'export async function previewDraftSalesBomRequirements(call: ProductionPlatformCall, args: Json): Promise<Response> {',
              '  try {',
              '    const itemCode = text(args.item_code);',
              '    if (!itemCode) throw new Error("Cần chọn mặt hàng cửa.");',
              '    const customerGroup = text(args.customer_group);',
              '    if (customerGroup !== "Đại lý" && customerGroup !== "Lẻ") {',
              '      throw new Error("Cần Nhóm giá Đại lý/Lẻ để xem BOM theo đúng công thức bán.");',
              '    }',
              '    const [calculationResponse, item, staticBoms] = await Promise.all([',
              '      calculateSalesProductionLine(call, {',
              '        ...args,',
              '        item_code: itemCode,',
              '        customer_group: customerGroup,',
              '        set_count: 1,',
              '        purpose: "sales",',
              '      }),',
              '      readDoc<ItemDoc>(call, "Item", itemCode),',
              '      listDocs<BomDoc>(call, "Bill of Materials", [',
              '        "name", "item", "color", "docstatus", "is_active", "bom_status",',
              '        "effective_from", "effective_to", "revision", "generated_by_configurator",',
              '      ]).catch(() => []),',
              '    ]);',
              '    if (!calculationResponse.ok) return calculationResponse;',
              '    const calculation = await calculationResponse.json() as Json;',
              '    const staticBom = selectBom(',
              '      staticBoms, itemCode, text(args.color), dateOnly(args.delivery_date) || new Date().toISOString().slice(0, 10), true,',
              '    );',
              '    if (staticBom) {',
              '      return answer({',
              '        item_code: itemCode,',
              '        bom_no: staticBom,',
              '        bom_template: "",',
              '        bom_template_code: "",',
              '        actual_requirements: [],',
              '        missing_actual_component_keys: [],',
              '        actual_complete: true,',
              '        static_bom: true,',
              '      });',
              '    }',
              '    const stockUom = text(item.stock_uom) || "Bộ";',
              '    const billableArea = finitePositive(calculation.billable_area_sqm, "Diện tích tính tiền");',
              '    const outputQty = ["m2", "m²", "sqm"].includes(normalized(stockUom)) ? billableArea : 1;',
              '    const formulaSnapshot = {',
              '      schema_version: 1,',
              '      item_code: itemCode,',
              '      item_group: text(calculation.item_group),',
              '      door_type: text(calculation.door_type),',
              '      customer_group: customerGroup,',
              '      sales_mode: text(args.sales_mode) || "Trọn bộ",',
              '      width_m: Number(args.width_m),',
              '      height_m: Number(args.height_m),',
              '      mesh_height_m: args.mesh_height_m ?? null,',
              '      formula_policy: calculation.formula_policy,',
              '      formula_version: calculation.formula_version,',
              '      width_basis: calculation.width_basis,',
              '      cut_width_m: calculation.cut_width_m,',
              '      billable_area_sqm: calculation.billable_area_sqm,',
              '      leaf_count: calculation.leaf_count,',
              '      single_layer_leaf_count: calculation.single_layer_leaf_count,',
              '      double_layer_leaf_count: calculation.double_layer_leaf_count,',
              '      estimated_weight_kg: calculation.estimated_weight_kg,',
              '      leaf_variant: calculation.leaf_variant ?? args.leaf_variant ?? null,',
              '      ray_type: calculation.ray_type ?? null,',
              '    };',
              '    const inspection = await inspectProductionLineBomRequirements(call, {',
              '      item_code: itemCode,',
              '      output_qty: outputQty,',
              '      source_warehouse: "",',
              '      item_group: text(calculation.item_group),',
              '      door_type: text(calculation.door_type),',
              '      sales_mode: text(args.sales_mode) || "Trọn bộ",',
              '      width_m: Number(args.width_m),',
              '      height_m: Number(args.height_m),',
              '      ...(args.mesh_height_m == null || args.mesh_height_m === "" ? {} : { mesh_height_m: Number(args.mesh_height_m) }),',
              '      cut_width_m: Number(calculation.cut_width_m),',
              '      billable_area_sqm: billableArea,',
              '      ...(calculation.leaf_count == null ? {} : { leaf_count: Number(calculation.leaf_count) }),',
              '      ...(calculation.single_layer_leaf_count == null ? {} : { single_layer_leaf_count: Number(calculation.single_layer_leaf_count) }),',
              '      ...(calculation.double_layer_leaf_count == null ? {} : { double_layer_leaf_count: Number(calculation.double_layer_leaf_count) }),',
              '      ...(calculation.estimated_weight_kg == null ? {} : { estimated_weight_kg: Number(calculation.estimated_weight_kg) }),',
              '      ...(text(args.color) ? { color: text(args.color) } : {}),',
              '      ...(text(args.motor_model) ? { motor_model: text(args.motor_model) } : {}),',
              '      paint_required: checked(args.paint_required) ? 1 : 0,',
              '      formula_snapshot: JSON.stringify(formulaSnapshot),',
              '      ...(args.bom_actual_components === undefined ? {} : { bom_actual_components: normalizeBomActualComponents(args.bom_actual_components) }),',
              '    });',
              '    return answer({',
              '      item_code: itemCode,',
              '      stock_uom: stockUom,',
              '      output_qty: outputQty,',
              '      static_bom: false,',
              '      ...inspection,',
              '    });',
              '  } catch (error) {',
              '    return refuse(error instanceof Error ? error.message : "Không xem trước được yêu cầu BOM của dòng bán.");',
              '  }',
              '}',
              '',
          ) + draft_anchor
          replace_once(core, draft_anchor, draft_function)

          sales = 'server/apps-src/alumdoor-worker/src/sales-production.ts'
          replace_once(
              sales,
              '  previewSalesProduction,\n  validateProductionRequest,',
              '  previewDraftSalesBomRequirements,\n  previewSalesProduction,\n  validateProductionRequest,',
          )
          replace_once(
              sales,
              '  calculateSalesProductionLine,\n  previewSalesProduction,',
              '  calculateSalesProductionLine,\n  previewDraftSalesBomRequirements,\n  previewSalesProduction,',
          )

          index = 'server/apps-src/alumdoor-worker/src/index.ts'
          replace_once(
              index,
              '  createSalesProduction,\n  previewSalesProduction,',
              '  createSalesProduction,\n  previewDraftSalesBomRequirements,\n  previewSalesProduction,',
          )
          replace_once(
              index,
              '        if (method === "alumdoor.sales.preview_production") return await previewSalesProduction(call, args);',
              '        if (method === "alumdoor.sales.preview_bom_requirements") return await previewDraftSalesBomRequirements(call, args);\n        if (method === "alumdoor.sales.preview_production") return await previewSalesProduction(call, args);',
          )

          test_path = Path('server/tests/alumdoor-bom-actual-guidance.test.mjs')
          test_text = test_path.read_text()
          old_import = '  previewProductionLineBom,\n} from "../dist/apps-src/alumdoor-worker/src/bom-template-materializer.js";'
          new_import = '  inspectProductionLineBomRequirements,\n  previewProductionLineBom,\n} from "../dist/apps-src/alumdoor-worker/src/bom-template-materializer.js";'
          if test_text.count(old_import) != 1:
              raise SystemExit('test import anchor mismatch')
          test_text = test_text.replace(old_import, new_import, 1)
          test_text += '''\n\ntest("draft requirement inspection resolves source slots without company, warehouse or writes", async () => {\n  const { call, requests } = makeCall();\n  const result = await inspectProductionLineBomRequirements(call, { ...baseLine, source_warehouse: "" });\n  assert.equal(result.bom_template_code, "SRC-GUIDE");\n  assert.equal(result.actual_complete, false);\n  assert.deepEqual(result.missing_actual_component_keys, ["PULLEY", "SPRING"]);\n  assert.equal(result.components.length, 1);\n  assert.equal(requests.some((entry) => entry.init.method === "POST"), false);\n});\n'''
          test_path.write_text(test_text)
          PY
      - name: Validate server slice
        working-directory: server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          node --test tests/alumdoor-bom-actual-guidance.test.mjs
          node --test tests/alumdoor-bom-template-core.test.mjs tests/alumdoor-bom-template-materializer.test.mjs tests/alumdoor-bom-actual-components.test.mjs
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
      - name: Commit product change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-alumdoor-bom-draft-guidance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/apps-src/alumdoor-worker/src/bom-template-materializer.ts server/apps-src/alumdoor-worker/src/sales-production-core.ts server/apps-src/alumdoor-worker/src/sales-production.ts server/apps-src/alumdoor-worker/src/index.ts server/tests/alumdoor-bom-actual-guidance.test.mjs .github/workflows/_tmp-alumdoor-bom-draft-guidance.yml
          git commit -m 'feat(alumdoor): preview draft BOM requirements'
          git push origin HEAD:agent/alumdoor-bom-draft-guidance
