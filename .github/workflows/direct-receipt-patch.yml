name: Direct Receipt Patch

on:
  push:
    branches:
      - feat/alumdoor-direct-purchase-receipt-20260805

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alumdoor-direct-purchase-receipt-20260805
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply exact source patch
        run: python3 ops/direct-receipt-patch.py
      - name: Build server
        run: pnpm --filter cloudforge run build
      - name: Run focused regressions
        run: |
          node --test \
            server/tests/alumdoor-purchase-direct-receipt.test.mjs \
            server/tests/purchase-receipt-optional-order.test.mjs \
            server/tests/alumdoor-procurement-navigation-contract.test.mjs \
            server/tests/tien-dat-purchase-bulk-fifo.test.mjs
      - name: Validate package
        run: |
          node server/scripts/verify-alumdoor-meta-completeness.mjs
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run | tee /tmp/package.log
          grep -q 'DRY_RUN_PASS alumdoor' /tmp/package.log
          grep -q 'app=alumdoor@2.2.9' /tmp/package.log
      - name: Commit validated patch and remove temporary machinery
        run: |
          rm .github/workflows/direct-receipt-patch.yml ops/direct-receipt-patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(purchase): allow direct supplier receipt without purchase order'
          git push origin HEAD:feat/alumdoor-direct-purchase-receipt-20260805
