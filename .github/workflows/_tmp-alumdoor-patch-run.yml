name: Temporary Alumdoor Patch Run

on:
  push:
    branches:
      - agent/alumdoor-bom-realdata-continuation
    paths:
      - .github/workflows/_tmp-alumdoor-patch-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Patch test and publish
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'C:\alumdoor'
          $work = "C:\alumdoor-worktrees\patch-$env:GITHUB_RUN_ID"
          Write-Host 'PATCH_ATTEMPT=customer-fixture-v4'
          git -C $source fetch origin main agent/alumdoor-bom-realdata-continuation --prune
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $work) | Out-Null
          git -C $source worktree add --detach $work $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'worktree add failed' }
          try {
            Set-Location $work
            git merge --no-edit origin/main
            if ($LASTEXITCODE -ne 0) { throw 'merge main failed' }
            $localModules = Join-Path $source 'server\node_modules'
            $workModules = Join-Path $work 'server\node_modules'
            if (-not (Test-Path $localModules)) { throw 'local server node_modules missing' }
            if (-not (Test-Path $workModules)) { New-Item -ItemType Junction -Path $workModules -Target $localModules | Out-Null }
            Set-Location (Join-Path $work 'server')
            node scripts\_tmp-patch-alumdoor-dynamic-uom-validator.mjs
            if ($LASTEXITCODE -ne 0) { throw 'patch script failed' }
            pnpm run build
            if ($LASTEXITCODE -ne 0) { throw 'server build failed' }
            node --test tests\alumdoor-item-validator.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'focused tests failed' }
            Set-Location $work
            if (Test-Path $workModules) { Remove-Item $workModules -Force }
            Get-ChildItem '.github\workflows' -Filter '_tmp-alumdoor-*.yml' -File -ErrorAction SilentlyContinue | Remove-Item -Force
            Remove-Item 'server\scripts\_tmp-patch-alumdoor-dynamic-uom-validator.mjs' -Force
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git status --short
            git commit -m 'fix(alumdoor): honor measurement profile for dynamic sales UOM'
            if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
            git remote set-url origin "https://x-access-token:$env:GH_TOKEN@github.com/nguyentrieu210/forge.git"
            git push origin HEAD:agent/alumdoor-bom-realdata-continuation
            if ($LASTEXITCODE -ne 0) { throw 'push failed' }
            Write-Host "PATCH_PUBLISHED=$((git rev-parse HEAD).Trim())"
          }
          finally {
            Set-Location $source
            if (Test-Path $work) { git -C $source worktree remove --force $work }
            git -C $source worktree prune
          }
