name: Issue 942 Provenance Probe

on:
  push:
    branches:
      - agent/alumdoor-v2-reproducible

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply evidence-backed probe fixes only
        run: |
          python <<'PY'
          import json
          p='server/briefs/alumdoor.json'
          b=json.load(open(p,encoding='utf-8'))
          name='Cửa tấm liền Úc — công thức chuẩn'
          if not any(x.get('type')=='Cutting Policy' and x.get('name')==name for x in b.get('fixtures',[])):
              anchor=next(i for i,x in enumerate(b['fixtures']) if x.get('type')=='Cutting Policy' and x.get('name')=='Cửa Úc — công thức chuẩn')
              b['fixtures'].insert(anchor+1,{'type':'Cutting Policy','name':name,'data':{
                  'policy_name':name,'door_type':'Cửa tấm liền Úc',
                  'dealer_width_basis':'Phủ bì ray','retail_width_basis':'Phủ bì ray',
                  'dealer_cut_deduction_m':0.03,'retail_cut_deduction_m':0.03,
                  'dealer_split_sales_basis':'Phủ bì ray','dealer_full_sales_basis':'Phủ bì ray','retail_sales_basis':'Phủ bì ray',
                  'purchase_formula':'Kg thực tế','leaf_height_deduction_m':0.13,'leaf_rounding':'Làm tròn xuống',
                  'leaf_formula':'Kiểu tấm liền Úc','leaf_divisor_source':'Hằng số của chính sách','leaf_divisor_const':0.068
              }})
          renamed=0
          for x in b.get('fixtures',[]):
              if x.get('type')=='Item Color' and isinstance(x.get('data'),dict) and 'finish' in x['data'] and 'surface_finish' not in x['data']:
                  x['data']['surface_finish']=x['data'].pop('finish'); renamed+=1
          print('renamed Item Color keys',renamed)
          open(p,'w',encoding='utf-8').write(json.dumps(b,ensure_ascii=False,indent=2)+'\n')
          PY
          python <<'PY'
          p='server/scripts/build-alumdoor-v2-brief.mjs'
          s=open(p,encoding='utf-8').read()
          old='const canonicalAluminumProfile = fixture("Measurement Profile", "Nhôm cây/lá").data;'
          new='const canonicalAluminumProfile = { ...fixture("Measurement Profile", "Nhôm cây/lá").data };'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('canonicalAluminumProfile pattern drift')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Run official generator first pass
        run: node server/scripts/build-alumdoor-v2-brief.mjs
      - name: Structural diff classification
        run: |
          git diff --numstat -- server/briefs/alumdoor-v2.json
          node <<'NODE'
          const fs=require('node:fs'), cp=require('node:child_process');
          const cur=JSON.parse(cp.execFileSync('git',['show','HEAD:server/briefs/alumdoor-v2.json'],{encoding:'utf8'}));
          const gen=JSON.parse(fs.readFileSync('server/briefs/alumdoor-v2.json','utf8'));
          const by=(b)=>new Map((b.doctypes||[]).map(d=>[d.name,d])); const a=by(cur), b=by(gen);
          console.log('doctype-count current/generated',a.size,b.size);
          console.log('only-current', [...a.keys()].filter(k=>!b.has(k)).sort());
          console.log('only-generated', [...b.keys()].filter(k=>!a.has(k)).sort());
          const fn=d=>(d?.fields||[]).map(f=>typeof f==='string'?f.split(':')[0].trim():f.fieldname);
          for(const n of ['Customer','Price List','Item Price','Quotation Item','Sales Order Item','Sales Order','Delivery Note Item','Sales Invoice Item','Production Request Item']){
            const A=new Set(fn(a.get(n))),B=new Set(fn(b.get(n)));
            console.log('FIELDS',n,'only-current',[...A].filter(x=>!B.has(x)),'only-generated',[...B].filter(x=>!A.has(x)));
          }
          NODE
      - name: Trace provenance of current-only contracts
        run: |
          for needle in 'Credit Note' 'Phường Xã' 'Tài khoản ngân hàng' 'Tỉnh Thành' 'Địa chỉ giao lắp' 'install_province' 'install_ward' 'install_address_line1' 'shipping_note' 'customer_group' 'bank_account' 'contact_person' 'discount_percentage' 'sales_option' 'sales_mode'; do
            echo "===== $needle ====="
            git log --all --date=short --format='%H %ad %s' -S"$needle" -- server/briefs/alumdoor-v2.json server/briefs/alumdoor.json server/scripts/build-alumdoor-v2-brief.mjs | head -8 || true
          done
      - name: Verify probe did not write repository
        run: git status --short
