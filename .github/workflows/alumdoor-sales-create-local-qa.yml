name: Diagnose Forge Desktop Ownership

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose-owner:
    runs-on: [self-hosted]
    timeout-minutes: 3
    steps:
      - name: Inspect Desk process owner and available Forge startup tasks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $listener = Get-NetTCPConnection -LocalPort 5173 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($listener) {
            $p = Get-CimInstance Win32_Process -Filter "ProcessId = $($listener.OwningProcess)" -ErrorAction SilentlyContinue
            Write-Host "DESK_PID=$($listener.OwningProcess)"
            if ($p) {
              $owner = Invoke-CimMethod -InputObject $p -MethodName GetOwner -ErrorAction SilentlyContinue
              Write-Host "DESK_OWNER=$($owner.Domain)\\$($owner.User) RETURN=$($owner.ReturnValue)"
              Write-Host "DESK_PARENT=$($p.ParentProcessId)"
            }
          }
          Write-Host '=== Scheduled tasks matching Forge/alumdoor ==='
          Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -match 'Forge|alumdoor' -or $_.TaskPath -match 'Forge|alumdoor' } | ForEach-Object {
            $i = Get-ScheduledTaskInfo -TaskName $_.TaskName -TaskPath $_.TaskPath -ErrorAction SilentlyContinue
            Write-Host "TASK=$($_.TaskPath)$($_.TaskName) STATE=$($_.State) USER=$($_.Principal.UserId) LOGON=$($_.Principal.LogonType) RUNLEVEL=$($_.Principal.RunLevel) LAST=$($i.LastRunTime) RESULT=$($i.LastTaskResult)"
            foreach ($a in $_.Actions) { Write-Host "  ACTION=$($a.Execute) $($a.Arguments) WD=$($a.WorkingDirectory)" }
          }
          Write-Host '=== Startup files visible to runner ==='
          foreach ($path in @(
            'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp',
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup"
          )) {
            Write-Host "PATH=$path"
            Get-ChildItem -Force $path -ErrorAction SilentlyContinue | Select-Object Name,FullName | Format-Table -AutoSize
          }
