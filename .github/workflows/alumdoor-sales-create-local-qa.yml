name: Recover Forge Local 5173 IPv6

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: recover-forge-local-5173-ipv6
  cancel-in-progress: false

jobs:
  rescue-5173:
    runs-on: [self-hosted]
    timeout-minutes: 8
    steps:
      - name: Verify backend and current 5173 surfaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(5000)}).then(r=>{console.log('backend',r.status);process.exit((r.ok||r.status===401||r.status===403)?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
          if ($LASTEXITCODE -ne 0) { throw 'Backend 8799 unhealthy.' }
          node -e "fetch('http://127.0.0.1:5173/',{signal:AbortSignal.timeout(3000)}).then(r=>console.log('ipv4-5173',r.status,r.headers.get('content-type'))).catch(e=>console.log('ipv4-5173 ERROR',e.message))"
          node -e "fetch('http://[::1]:5173/',{signal:AbortSignal.timeout(3000)}).then(r=>console.log('ipv6-before',r.status,r.headers.get('content-type'))).catch(e=>console.log('ipv6-before ERROR',e.message))"
          node -e "require('node:dns').lookup('localhost',{all:true},(e,a)=>console.log('localhost-addresses',e||a))"

      - name: Start healthy Desk on IPv6 loopback port 5173
        shell: powershell
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          $ErrorActionPreference = 'Stop'
          $alreadyHealthy = $false
          node -e "fetch('http://[::1]:5173/',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -eq 0) { $alreadyHealthy = $true }
          if (-not $alreadyHealthy) {
            $env:VITE_FORGE_BACKEND='http://127.0.0.1:8799'
            $runtime='C:\alumdoor\client\apps\runtime'
            $log='C:\alumdoor\desk-5173-ipv6.log'
            $cmd="pnpm run dev -- --host ::1 --port 5173 > `"$log`" 2>&1"
            Start-Process -FilePath 'cmd.exe' -ArgumentList '/c',$cmd -WorkingDirectory $runtime -WindowStyle Hidden
          }
          $ok=$false
          for ($i=0; $i -lt 60; $i++) {
            node -e "fetch('http://[::1]:5173/',{signal:AbortSignal.timeout(3000)}).then(r=>{console.log('ipv6-5173',r.status,r.headers.get('content-type'));process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))"
            if ($LASTEXITCODE -eq 0) { $ok=$true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            if (Test-Path 'C:\alumdoor\desk-5173-ipv6.log') { Get-Content 'C:\alumdoor\desk-5173-ipv6.log' -Tail 200 }
            throw 'Could not bind healthy Desk to [::1]:5173.'
          }

      - name: Verify localhost resolves to a healthy 5173 response
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '--- curl localhost ---'
          & curl.exe -sS -D - -o NUL --max-time 5 http://localhost:5173/
          Write-Host "curl_exit=$LASTEXITCODE"
          Write-Host '--- node localhost ---'
          node -e "fetch('http://localhost:5173/',{signal:AbortSignal.timeout(5000)}).then(r=>{console.log('localhost-node',r.status,r.headers.get('content-type'));process.exit(r.status===200?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
          Write-Host "node_exit=$LASTEXITCODE"
          Write-Host '--- listeners ---'
          Get-NetTCPConnection -LocalPort 5173 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize
          exit 0

  verify-persisted:
    needs: rescue-5173
    runs-on: [self-hosted]
    timeout-minutes: 3
    steps:
      - name: Confirm IPv6 Desk survived runner cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(5000)}).then(r=>{console.log('backend-final',r.status);process.exit((r.ok||r.status===401||r.status===403)?0:1)}).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) { throw 'Backend 8799 down.' }
          node -e "fetch('http://[::1]:5173/',{signal:AbortSignal.timeout(5000)}).then(r=>{console.log('ipv6-final',r.status,r.headers.get('content-type'));process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) { throw 'IPv6 Desk 5173 did not survive cleanup.' }
          & curl.exe -sS -D - -o NUL --max-time 5 http://localhost:5173/
          Get-NetTCPConnection -LocalPort 5173 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize
