name: Recover Forge Local Dev

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-forge-local-dev
  cancel-in-progress: false

jobs:
  recover-local-dev:
    runs-on: [self-hosted]
    timeout-minutes: 8
    steps:
      - name: Start canonical local Forge services without touching runner workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'C:\alumdoor\start-forge.bat'
          if (-not (Test-Path $script)) { throw "Missing recovery script: $script" }
          & cmd.exe /c $script
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path 'C:\alumdoor\start-forge.log') { Get-Content 'C:\alumdoor\start-forge.log' -Tail 200 }
            throw "start-forge.bat failed with exit code $LASTEXITCODE"
          }

      - name: Verify backend 8799 and Desk 5173
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $backendReady = $false
          $deskReady = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (-not $backendReady) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8799/api/method/metaforge.api.get_boot' -TimeoutSec 3 -ErrorAction Stop
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 500) { $backendReady = $true }
              } catch {
                if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -in 401,403) { $backendReady = $true }
              }
            }
            if (-not $deskReady) {
              try {
                $u = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5173/' -TimeoutSec 3 -ErrorAction Stop
                if ($u.StatusCode -eq 200) { $deskReady = $true }
              } catch {}
            }
            if ($backendReady -and $deskReady) { break }
            Start-Sleep -Seconds 2
          }
          Write-Host "backend8799=$backendReady desk5173=$deskReady"
          if (-not ($backendReady -and $deskReady)) {
            Write-Host '--- start-forge.log ---'
            if (Test-Path 'C:\alumdoor\start-forge.log') { Get-Content 'C:\alumdoor\start-forge.log' -Tail 200 }
            Write-Host '--- listeners ---'
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 8799,5173 } | Format-Table -AutoSize
            throw 'Forge local services did not recover.'
          }
