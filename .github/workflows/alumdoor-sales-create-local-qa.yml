name: Recover Forge Local Runtime Final

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: recover-forge-local-runtime-final
  cancel-in-progress: true

jobs:
  recover-runtime:
    runs-on: [self-hosted]
    timeout-minutes: 6
    steps:
      - name: Start backend 8799 detached from runner cleanup
        shell: powershell
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          $ErrorActionPreference = 'Stop'
          $healthy=$false
          node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit((r.ok||r.status===401||r.status===403)?0:1)).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -eq 0) { $healthy=$true }
          if (-not $healthy) {
            $existing=Get-NetTCPConnection -LocalPort 8799 -State Listen -ErrorAction SilentlyContinue
            if ($existing) { throw 'Port 8799 is occupied but backend health probe failed; refusing to kill an unknown listener.' }
            $server='C:\alumdoor\server'
            $log='C:\alumdoor\backend-8799-live.log'
            $cmd="set RUNNER_TRACKING_ID=&& pnpm run dev:alumdoor-local > `"$log`" 2>&1"
            Start-Process -FilePath 'cmd.exe' -ArgumentList '/c',$cmd -WorkingDirectory $server -WindowStyle Hidden
          }
          $ok=$false
          for ($i=0; $i -lt 90; $i++) {
            node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(2500)}).then(r=>{console.log('backend8799',r.status);process.exit((r.ok||r.status===401||r.status===403)?0:1)}).catch(()=>process.exit(1))"
            if ($LASTEXITCODE -eq 0) { $ok=$true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            if (Test-Path 'C:\alumdoor\backend-8799-live.log') { Get-Content 'C:\alumdoor\backend-8799-live.log' -Tail 250 }
            throw 'Backend 8799 did not become healthy.'
          }

      - name: Start healthy Desk 5174 detached from runner cleanup
        shell: powershell
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          $ErrorActionPreference = 'Stop'
          $healthy=$false
          node -e "fetch('http://127.0.0.1:5174/',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -eq 0) { $healthy=$true }
          if (-not $healthy) {
            $existing=Get-NetTCPConnection -LocalPort 5174 -State Listen -ErrorAction SilentlyContinue
            if ($existing) { throw 'Port 5174 is occupied but not healthy; refusing unknown listener.' }
            $runtime='C:\alumdoor\client\apps\runtime'
            $log='C:\alumdoor\desk-5174-live.log'
            $cmd="set RUNNER_TRACKING_ID=&& set VITE_FORGE_BACKEND=http://127.0.0.1:8799&& pnpm run dev -- --host 127.0.0.1 --port 5174 > `"$log`" 2>&1"
            Start-Process -FilePath 'cmd.exe' -ArgumentList '/c',$cmd -WorkingDirectory $runtime -WindowStyle Hidden
          }
          $ok=$false
          for ($i=0; $i -lt 60; $i++) {
            node -e "fetch('http://127.0.0.1:5174/',{signal:AbortSignal.timeout(2500)}).then(r=>{console.log('desk5174',r.status,r.headers.get('content-type'));process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))"
            if ($LASTEXITCODE -eq 0) { $ok=$true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            if (Test-Path 'C:\alumdoor\desk-5174-live.log') { Get-Content 'C:\alumdoor\desk-5174-live.log' -Tail 250 }
            throw 'Desk 5174 did not become healthy.'
          }

      - name: Start IPv6-only proxy for localhost 5173
        shell: powershell
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          $ErrorActionPreference = 'Stop'
          $proxyPath='C:\alumdoor\localhost-5173-ipv6-proxy.mjs'
          $proxyLog='C:\alumdoor\localhost-5173-ipv6-proxy.log'
          $proxy=@'
          import http from "node:http";
          import net from "node:net";
          const targetHost = "127.0.0.1";
          const targetPort = 5174;
          const server = http.createServer((req, res) => {
            const headers = { ...req.headers, host: `${targetHost}:${targetPort}` };
            const upstream = http.request({ hostname: targetHost, port: targetPort, path: req.url, method: req.method, headers }, (upstreamRes) => {
              res.writeHead(upstreamRes.statusCode ?? 502, upstreamRes.headers);
              upstreamRes.pipe(res);
            });
            upstream.on("error", (error) => {
              if (!res.headersSent) res.writeHead(502, { "content-type": "text/plain; charset=utf-8" });
              res.end(`Forge localhost proxy upstream error: ${error.message}`);
            });
            req.pipe(upstream);
          });
          server.on("upgrade", (req, socket, head) => {
            const upstream = net.connect(targetPort, targetHost, () => {
              const lines = [`${req.method} ${req.url} HTTP/${req.httpVersion}`];
              for (const [name, value] of Object.entries(req.headers)) {
                if (value === undefined) continue;
                if (Array.isArray(value)) for (const item of value) lines.push(`${name}: ${item}`);
                else lines.push(`${name}: ${value}`);
              }
              upstream.write(lines.join("\r\n") + "\r\n\r\n");
              if (head?.length) upstream.write(head);
              socket.pipe(upstream).pipe(socket);
            });
            upstream.on("error", () => { try { socket.destroy(); } catch {} });
            socket.on("error", () => { try { upstream.destroy(); } catch {} });
          });
          server.on("error", (error) => { console.error(error); process.exit(1); });
          server.listen({ host: "::1", port: 5173, ipv6Only: true }, () => {
            console.log("FORGE_LOCALHOST_PROXY_READY [::1]:5173 -> 127.0.0.1:5174");
          });
          '@
          Set-Content -Path $proxyPath -Value $proxy -Encoding utf8

          $healthy=$false
          node -e "fetch('http://[::1]:5173/',{signal:AbortSignal.timeout(1500)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -eq 0) { $healthy=$true }
          if (-not $healthy) {
            $ipv6Listener=Get-NetTCPConnection -LocalPort 5173 -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalAddress -match ':' }
            if ($ipv6Listener) { throw 'IPv6 5173 is occupied but not healthy; refusing unknown listener.' }
            $cmd="set RUNNER_TRACKING_ID=&& node `"$proxyPath`" > `"$proxyLog`" 2>&1"
            Start-Process -FilePath 'cmd.exe' -ArgumentList '/c',$cmd -WorkingDirectory 'C:\alumdoor' -WindowStyle Hidden
          }
          $ok=$false
          for ($i=0; $i -lt 30; $i++) {
            node -e "fetch('http://[::1]:5173/',{signal:AbortSignal.timeout(2000)}).then(r=>{console.log('ipv6proxy5173',r.status,r.headers.get('content-type'));process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))"
            if ($LASTEXITCODE -eq 0) { $ok=$true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) {
            if (Test-Path $proxyLog) { Get-Content $proxyLog -Tail 250 }
            Get-NetTCPConnection -LocalPort 5173 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize
            throw 'IPv6 proxy [::1]:5173 did not become healthy.'
          }

      - name: Verify exact localhost URL surface
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== IPv4 stale surface ==='
          node -e "fetch('http://127.0.0.1:5173/',{signal:AbortSignal.timeout(3000)}).then(r=>console.log('ipv4-5173',r.status,r.headers.get('content-type'))).catch(e=>console.log('ipv4-5173 ERROR',e.message))"
          Write-Host '=== IPv6 healthy surface ==='
          node -e "fetch('http://[::1]:5173/',{signal:AbortSignal.timeout(3000)}).then(r=>console.log('ipv6-5173',r.status,r.headers.get('content-type'))).catch(e=>console.log('ipv6-5173 ERROR',e.message))"
          Write-Host '=== localhost resolution ==='
          node -e "require('node:dns').lookup('localhost',{all:true},(e,a)=>console.log(e||a))"
          & curl.exe -6 -sS -D - -o NUL --max-time 5 http://localhost:5173/
          Write-Host "curl6_exit=$LASTEXITCODE"
          & curl.exe -sS -D - -o NUL --max-time 5 http://localhost:5173/
          Write-Host "curl_default_exit=$LASTEXITCODE"
          Get-NetTCPConnection -LocalPort 8799,5173,5174 -State Listen -ErrorAction SilentlyContinue | Sort-Object LocalPort,LocalAddress | Format-Table -AutoSize
          exit 0

  verify-persisted:
    needs: recover-runtime
    runs-on: [self-hosted]
    timeout-minutes: 3
    steps:
      - name: Confirm backend, Desk and localhost proxy survived cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(5000)}).then(r=>{console.log('backend-final',r.status);process.exit((r.ok||r.status===401||r.status===403)?0:1)}).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) { throw 'Backend 8799 did not survive cleanup.' }
          node -e "fetch('http://127.0.0.1:5174/',{signal:AbortSignal.timeout(5000)}).then(r=>{console.log('desk5174-final',r.status);process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) { throw 'Desk 5174 did not survive cleanup.' }
          node -e "fetch('http://[::1]:5173/',{signal:AbortSignal.timeout(5000)}).then(r=>{console.log('ipv6proxy-final',r.status);process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) { throw 'IPv6 localhost proxy did not survive cleanup.' }
          & curl.exe -6 -sS -D - -o NUL --max-time 5 http://localhost:5173/
          if ($LASTEXITCODE -ne 0) { throw 'localhost:5173 is not healthy over IPv6.' }
          Get-NetTCPConnection -LocalPort 8799,5173,5174 -State Listen -ErrorAction SilentlyContinue | Sort-Object LocalPort,LocalAddress | Format-Table -AutoSize
