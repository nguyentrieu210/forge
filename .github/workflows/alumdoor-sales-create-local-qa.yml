name: Diagnose Forge Local Dev

on:
  pull_request:
    branches: [main]
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-local-dev:
    runs-on: [self-hosted]
    timeout-minutes: 3
    steps:
      - name: Inspect listeners, owners and HTTP surfaces without mutation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($port in 8799,5173) {
            Write-Host "=== PORT $port ==="
            $listeners = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            $listeners | Format-Table -AutoSize
            foreach ($l in $listeners) {
              $p = Get-CimInstance Win32_Process -Filter "ProcessId = $($l.OwningProcess)" -ErrorAction SilentlyContinue
              if ($p) {
                Write-Host "PID=$($p.ProcessId) NAME=$($p.Name)"
                Write-Host "CMD=$($p.CommandLine)"
                if ($p.ParentProcessId) {
                  $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($p.ParentProcessId)" -ErrorAction SilentlyContinue
                  if ($parent) { Write-Host "PARENT PID=$($parent.ProcessId) NAME=$($parent.Name) CMD=$($parent.CommandLine)" }
                }
              }
            }
          }

          foreach ($url in @(
            'http://127.0.0.1:8799/api/method/metaforge.api.get_boot',
            'http://localhost:8799/api/method/metaforge.api.get_boot',
            'http://127.0.0.1:5173/',
            'http://localhost:5173/',
            'http://127.0.0.1:5173/index.html',
            'http://localhost:5173/index.html'
          )) {
            node -e "fetch('$url',{signal:AbortSignal.timeout(5000)}).then(async r=>{console.log('$url',r.status,r.headers.get('content-type'),(await r.text()).slice(0,120).replace(/\\s+/g,' '))}).catch(e=>console.log('$url','ERROR',e.message))"
          }
