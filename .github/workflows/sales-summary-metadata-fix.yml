name: Sales Summary Metadata Fix

on:
  push:
    branches:
      - fix/sales-order-summary-metadata-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sales-order-summary-metadata-20260811
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch canonical AlumDoor brief generator
        shell: python
        run: |
          from pathlib import Path

          path = Path("server/scripts/build-alumdoor-v2-brief.mjs")
          source = path.read_text(encoding="utf-8")

          source = source.replace('brief.version = "2.0.35";', 'brief.version = "2.0.36";', 1)

          anchor = '''  "operational_change_reason:Small Text- Lý do đổi vận hành",
          );
          const salesFormHidden = new Set(["product_group", "against_quotation", "note"]);'''
          replacement = '''  "operational_change_reason:Small Text- Lý do đổi vận hành",
          );

          // Sales totals remain server-authoritative. Metadata only projects the canonical preview/save
          // fields back into a dedicated summary section; no pricing/tax formula lives in FormView.
          const existingGrandTotalIndex = operationalSalesOrder.fields.findIndex((field) => nameOf(field) === "grand_total");
          if (existingGrandTotalIndex < 0) throw new Error("Sales Order: không thấy grand_total để dựng Tổng kết");
          const [grandTotalSource] = operationalSalesOrder.fields.splice(existingGrandTotalIndex, 1);
          const grandTotalField = parseField(grandTotalSource, existingGrandTotalIndex);
          operationalSalesOrder.fields.push(
            { fieldname: "sales_summary_section", fieldtype: "Section Break", label: "Tổng kết", form_section_style: "summary" },
            { fieldname: "total_amount", fieldtype: "Currency", label: "Tổng cộng tiền hàng", read_only: true },
            { fieldname: "discount_amount", fieldtype: "Currency", label: "Tiền chiết khấu", read_only: true },
            { fieldname: "surcharge_amount", fieldtype: "Currency", label: "Phụ thu", read_only: true },
            { fieldname: "vat_rate", fieldtype: "Percent", label: "% VAT", default: 0 },
            { fieldname: "vat_amount", fieldtype: "Currency", label: "Số tiền VAT", read_only: true },
            { ...grandTotalField, fieldname: "grand_total", label: "Tiền phải thu", fieldtype: "Currency", read_only: true },
          );

          const salesFormHidden = new Set(["product_group", "against_quotation", "note"]);'''

          if anchor not in source:
              raise SystemExit("Sales Order generator anchor not found")
          source = source.replace(anchor, replacement, 1)
          path.write_text(source, encoding="utf-8")

      - name: Regenerate materialized AlumDoor V2 metadata
        working-directory: server
        run: node scripts/build-alumdoor-v2-brief.mjs

      - name: Targeted metadata regressions
        working-directory: server
        run: |
          node --test \
            tests/alumdoor-sales-summary-metadata.test.mjs \
            tests/alumdoor-child-presentation.test.mjs

      - name: Server build
        working-directory: server
        run: pnpm run build

      - name: Brief verification
        working-directory: server
        run: pnpm run brief:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified source and materialized metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server/scripts/build-alumdoor-v2-brief.mjs server/briefs/alumdoor-v2.json; then
            echo "No metadata patch to commit"
            exit 0
          fi
          git config user.name "Forge UI Metadata Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/scripts/build-alumdoor-v2-brief.mjs server/briefs/alumdoor-v2.json
          git commit -m "fix(alumdoor): restore metadata-driven Sales totals [skip ci]"
          git push origin HEAD:fix/sales-order-summary-metadata-20260811
