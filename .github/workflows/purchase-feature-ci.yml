name: Purchase Feature CI

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: purchase-feature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect purchase scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Classify changed files
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const shared = [
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'server/package.json',
              '.github/workflows/purchase-feature-ci.yml',
            ];
            const purchasePatterns = [
              /purchase/i,
              /supplier/i,
              /fifo/i,
              /payment-ledger/i,
              /stock-ledger/i,
              /^server\/apps-src\/alumdoor-worker\//,
              /^client\/packages\/views\//,
            ];
            const run = files.some(({ filename }) =>
              shared.includes(filename) || purchasePatterns.some((pattern) => pattern.test(filename))
            );
            core.info(`Purchase scope: ${run}; files: ${files.map((file) => file.filename).join(', ')}`);
            core.setOutput('run', String(run));

  focused-gates:
    name: Purchase feature gates
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server unit tests
        shell: bash
        run: |
          set +e
          pnpm --dir server run test:unit > /tmp/server-unit.log 2>&1
          status=$?
          tail -n 200 /tmp/server-unit.log
          exit $status

      - name: Server SQL tests
        shell: bash
        run: |
          set +e
          pnpm --dir server run test:sql > /tmp/server-sql.log 2>&1
          status=$?
          tail -n 200 /tmp/server-sql.log
          exit $status

      - name: Client tests
        shell: bash
        run: |
          set +e
          pnpm run client:test > /tmp/client-test.log 2>&1
          status=$?
          tail -n 200 /tmp/client-test.log
          exit $status

      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/typecheck.log 2>&1
          status=$?
          tail -n 200 /tmp/typecheck.log
          exit $status

      - name: Build
        shell: bash
        run: |
          set +e
          pnpm build > /tmp/build.log 2>&1
          status=$?
          tail -n 200 /tmp/build.log
          exit $status
