name: Purchase Feature CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'server/apps-src/alumdoor-worker/src/*purchase*'
      - 'server/apps/purchase-qa-callback/**'
      - 'server/apps/tenant-worker/wrangler.purchase-qa.jsonc'
      - 'server/apps-src/alumdoor-worker/wrangler.purchase-qa.jsonc'
      - 'server/packages/app-registry/**'
      - 'server/scripts/seed-local.mjs'
      - 'server/scripts/seed-purchase-qa-local.mjs'
      - 'server/tests/*purchase*'
      - 'server/tests/app-installer-standard-metadata-adoption.test.mjs'
      - 'client/e2e-forge/**/purchase*'
      - 'client/e2e-forge/playwright.auth.config.ts'
      - '.github/workflows/purchase-feature-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purchase-feature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-gates:
    name: Purchase feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter cloudforge run build

      - name: Run focused Purchase regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find server/tests -maxdepth 1 -type f \( -name '*purchase*.test.mjs' -o -name 'app-installer-standard-metadata-adoption.test.mjs' \) -print | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

      - name: Run Purchase SQL safeguards
        run: pnpm --dir server run test:sql
