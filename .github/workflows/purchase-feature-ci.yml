name: Purchase Feature CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purchase-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-gates:
    name: Purchase feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter cloudforge run build

      - name: Run focused Purchase regressions
        run: node --test server/tests/*purchase*.test.mjs server/tests/app-installer-standard-metadata-adoption.test.mjs

      - name: Run Purchase SQL safeguards
        run: pnpm --dir server run test:sql
