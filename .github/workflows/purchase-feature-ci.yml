name: Purchase Feature CI

on:
  push:
    branches:
      - feat/purchase-receipt-complete-20260731
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    paths:
      - 'server/**'
      - 'client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/purchase-feature-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purchase-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-backfill-cli:
    name: Patch backfill CLI control flow
    if: github.event_name == 'push' && github.ref_name == 'feat/purchase-receipt-complete-20260731'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/purchase-receipt-complete-20260731
          fetch-depth: 0
      - name: Replace top-level returns
        id: patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/scripts/backfill-purchase-receipt-allocations.mjs')
          text = path.read_text()
          old = '''  if (!args.execute) {
            if (plan.unresolved.length > 0) process.exitCode = 2;
            return;
          }
          if (!source.database) fail("--execute is unavailable with --input; use a remote tenant database");
          if (args.activate) {
            activate(source.database, plan, args);
            return;
          }
          executeBackfill(source.database, plan, args);'''
          new = '''  if (!args.execute) {
            if (plan.unresolved.length > 0) process.exitCode = 2;
          } else if (!source.database) {
            fail("--execute is unavailable with --input; use a remote tenant database");
          } else if (args.activate) {
            activate(source.database, plan, args);
          } else {
            executeBackfill(source.database, plan, args);
          }'''
          if old not in text:
              raise SystemExit('expected backfill CLI block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/scripts/backfill-purchase-receipt-allocations.mjs
          git commit -m 'fix(procurement): use valid backfill CLI control flow'
          git pull --rebase origin feat/purchase-receipt-complete-20260731
          git push origin HEAD:feat/purchase-receipt-complete-20260731

  focused-gates:
    name: Purchase feature gates
    needs: patch-backfill-cli
    if: always() && (needs.patch-backfill-cli.result == 'skipped' || needs.patch-backfill-cli.outputs.changed == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server unit tests
        shell: bash
        run: |
          set +e
          pnpm --dir server run test:unit > /tmp/server-unit.log 2>&1
          status=$?
          tail -n 200 /tmp/server-unit.log
          exit $status

      - name: Server SQL tests
        shell: bash
        run: |
          set +e
          pnpm --dir server run test:sql > /tmp/server-sql.log 2>&1
          status=$?
          tail -n 200 /tmp/server-sql.log
          exit $status

      - name: Client tests
        shell: bash
        run: |
          set +e
          pnpm run client:test > /tmp/client-test.log 2>&1
          status=$?
          tail -n 200 /tmp/client-test.log
          exit $status

      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/typecheck.log 2>&1
          status=$?
          tail -n 200 /tmp/typecheck.log
          exit $status

      - name: Build
        shell: bash
        run: |
          set +e
          pnpm build > /tmp/build.log 2>&1
          status=$?
          tail -n 200 /tmp/build.log
          exit $status
