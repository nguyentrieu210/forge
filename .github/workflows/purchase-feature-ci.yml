name: Purchase Feature CI

on:
  push:
    branches:
      - feat/purchase-receipt-complete-20260731
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    paths:
      - 'server/**'
      - 'client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/purchase-feature-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purchase-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-gates:
    name: Purchase feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/purchase-receipt-complete-20260731
          fetch-depth: 0

      - name: Apply supplier debt integration
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/apply-purchase-supplier-debt.py ]; then
            python .github/apply-purchase-supplier-debt.py
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server unit tests
        shell: bash
        run: |
          set +e
          pnpm --dir server run test:unit > /tmp/server-unit.log 2>&1
          status=$?
          tail -n 200 /tmp/server-unit.log
          exit $status

      - name: Server SQL tests
        shell: bash
        run: |
          set +e
          pnpm --dir server run test:sql > /tmp/server-sql.log 2>&1
          status=$?
          tail -n 200 /tmp/server-sql.log
          exit $status

      - name: Client tests
        shell: bash
        run: |
          set +e
          pnpm run client:test > /tmp/client-test.log 2>&1
          status=$?
          tail -n 200 /tmp/client-test.log
          exit $status

      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/typecheck.log 2>&1
          status=$?
          tail -n 200 /tmp/typecheck.log
          exit $status

      - name: Build
        shell: bash
        run: |
          set +e
          pnpm build > /tmp/build.log 2>&1
          status=$?
          tail -n 200 /tmp/build.log
          exit $status

      - name: Commit verified integration
        if: steps.patch.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply-purchase-supplier-debt.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/apply-purchase-supplier-debt.py \
            server/apps/tenant-worker/src/index.ts \
            client/packages/views/src/container/AllocationTimelineDialog.tsx \
            client/packages/views/src/container/PurchaseSupplierDebtReportDialog.tsx
          git diff --cached --check
          git commit -m "feat(purchase): integrate supplier debt report"
          git push origin HEAD:feat/purchase-receipt-complete-20260731
