name: Temporary Cutting Policy UI Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build runtime and architecture guard
        run: pnpm --filter runtime... run build
