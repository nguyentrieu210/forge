name: Temp Fix UI Matrix Ref

on:
  push:
    branches:
      - fix/ui-matrix-scroll-ref-20260803
    paths:
      - ".github/workflows/tmp-fix-ui-matrix-ref.yml"

permissions:
  contents: write
  statuses: write

jobs:
  fix-build-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-matrix-scroll-ref-20260803
          fetch-depth: 0

      - name: Patch Matrix ref contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("client/packages/views/src/matrix/MatrixGrid.tsx")
          text = path.read_text()
          old_import = 'import type { KeyboardEvent, RefObject } from "react";'
          old_prop = '  scrollRef: RefObject<HTMLDivElement | null>;'
          if text.count(old_import) != 1 or text.count(old_prop) != 1:
              raise SystemExit("Matrix ref anchors changed; refusing speculative patch")
          text = text.replace(old_import, 'import type { KeyboardEvent, Ref } from "react";', 1)
          text = text.replace(old_prop, '  scrollRef: Ref<HTMLDivElement>;', 1)
          path.write_text(text)

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build runtime and mobile PWA
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter runtime... run build
          pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json
          pnpm --dir client/apps/kho exec vite build --config vite.mobile.config.ts

      - name: Commit clean UI-only fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-ui-matrix-ref.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client/packages/views/src/matrix/MatrixGrid.tsx .github/workflows/tmp-fix-ui-matrix-ref.yml
          git commit -m "fix(ui): align Matrix scroll ref with React contract"
          git push origin HEAD:fix/ui-matrix-scroll-ref-20260803

      - name: Publish clean-head validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          payload=$(jq -nc \
            --arg state success \
            --arg context "ui-matrix-ref-build" \
            --arg description "runtime + warehouse mobile builds passed" \
            '{state:$state,context:$context,description:$description}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -d "$payload" >/dev/null
