name: Prestaging Alumdoor Service Control Remediation

on:
  pull_request:
    paths:
      - 'server/scripts/grant-alumdoor-runner-service-control.ps1'
      - 'server/scripts/test-alumdoor-service-control-contract.mjs'
      - 'server/scripts/install-alumdoor-runtime-services.ps1'
      - '.github/workflows/alumdoor-service-control-remediation-prestage.yml'
  push:
    branches: [main]
    paths:
      - 'server/scripts/grant-alumdoor-runner-service-control.ps1'
      - 'server/scripts/test-alumdoor-service-control-contract.mjs'
      - 'server/scripts/install-alumdoor-runtime-services.ps1'
      - '.github/workflows/alumdoor-service-control-remediation-prestage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prestage:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Checkout exact reviewed source for remediation artifact only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize one-time elevated remediation outside canonical source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'server\scripts\grant-alumdoor-runner-service-control.ps1'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing remediation source: $source" }

          $home = 'C:\ForgeServices\Alumdoor'
          New-Item -ItemType Directory -Force -Path $home | Out-Null
          $target = Join-Path $home 'grant-alumdoor-runner-service-control.ps1'
          Copy-Item -LiteralPath $source -Destination $target -Force

          $cmd = Join-Path $home 'RUN-AS-ADMIN-Grant-Alumdoor-Runner-Service-Control.cmd'
          @"
@echo off
powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$target"
set EXITCODE=%ERRORLEVEL%
echo.
if not "%EXITCODE%"=="0" echo FAILED exit=%EXITCODE%
if "%EXITCODE%"=="0" echo ALUMDOOR_RUNNER_SERVICE_CONTROL_PASS
pause
exit /b %EXITCODE%
"@ | Set-Content -LiteralPath $cmd -Encoding ASCII

          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          Write-Host "SERVICE_CONTROL_REMEDIATION_PRESTAGED=PASS script=$target launcher=$cmd sha256=$hash"
          Write-Host 'No elevation was attempted by this workflow. The files only stage the exact reviewed remediation for one manual UAC-approved run.'
