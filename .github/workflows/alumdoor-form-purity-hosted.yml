name: Alumdoor app install contract audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/alumdoor-form-purity-hosted.yml"]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate app install source and method contract
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/forge-alumdoor-appinstall-audit"
          git clone --quiet --branch exp/alumdoor-pricing-policy "https://x-access-token:${GH_TOKEN}@github.com/nguyentrieu210/forge.git" "$p"
          cd "$p"
          echo "AUDIT_HEAD=$(git rev-parse HEAD)"
          echo '=== USE APP INSTALL FILES ==='
          find client -type f -name 'useAppInstall.ts' -print
          while IFS= read -r f; do
            echo "=== $f 150-210 ==="
            nl -ba "$f" | sed -n '150,210p'
          done < <(find client -type f -name 'useAppInstall.ts')
          echo '=== CALL CONTRACT REFERENCES ==='
          grep -RniE 'method: string; args: Record<string, unknown>|callMethod|callPost|invokeMethod|install_app|uninstall_app' client/packages client/apps | head -240 || true
          echo APP_INSTALL_CONTRACT_AUDIT_PASS
