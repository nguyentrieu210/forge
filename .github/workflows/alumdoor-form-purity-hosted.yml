name: Alumdoor final hosted certification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/alumdoor-form-purity-hosted.yml"]

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone experiment
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/forge-alumdoor-final-hosted"
          git clone --quiet --branch exp/alumdoor-pricing-policy "https://x-access-token:${GH_TOKEN}@github.com/nguyentrieu210/forge.git" "$p"
          echo "CERT_ROOT=$p" >> "$GITHUB_ENV"
          cd "$p" && echo "CERT_HEAD=$(git rev-parse HEAD)"

      - name: Build metadata and audit canonical stock view
        shell: bash
        run: |
          set -euo pipefail
          cd "$CERT_ROOT/server"
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run brief:check
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const brief=JSON.parse(readFileSync("briefs/alumdoor-v2.json","utf8"));
          const rx=/(tồn.*nhôm|nhôm.*tồn|aluminium\s+lot|stock.*length|length.*stock)/iu;
          const nav=(brief.navigation?.items??[]).filter(x=>rx.test(typeof x==="string"?x:JSON.stringify(x)));
          const reports=(brief.reports??[]).filter(x=>rx.test(JSON.stringify(x)));
          const links=(brief.links??[]).filter(x=>rx.test(JSON.stringify(x)));
          console.log(`ALUMINIUM_STOCK_NAV=${JSON.stringify(nav)}`);
          console.log(`ALUMINIUM_STOCK_APP_REPORT_DUPLICATES=${reports.length}`);
          console.log(`ALUMINIUM_STOCK_LINKS=${JSON.stringify(links)}`);
          if(reports.length!==0) throw new Error("duplicate app-owned aluminium stock report");
          const generator=readFileSync("scripts/build-alumdoor-v2-brief.mjs","utf8");
          if(!generator.includes('Báo cáo "Tồn nhôm theo khổ" đọc Batch + sổ kho')) throw new Error("canonical Stock Ledger/Batch ownership note missing");
          console.log("ALUMINIUM_STOCK_CANONICAL_SOURCE_PASS");
          NODE
          find migrations/tenant -maxdepth 1 -type f | grep '0025' || true
          grep -RniE 'Tồn nhôm|Aluminium Lot|stock.*length|length.*stock' migrations/tenant 2>/dev/null | head -80 || true

      - name: Focused domain closure slices
        shell: bash
        run: |
          set -euo pipefail
          cd "$CERT_ROOT/server"
          run_slice(){ label="$1"; regex="$2"; mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.test.mjs' | grep -Ei "$regex" | sort); echo "${label}_FILES=${#tests[@]}"; printf '%s\n' "${tests[@]}"; test "${#tests[@]}" -gt 0; node --test "${tests[@]}"; echo "${label}_PASS"; }
          run_slice MANUFACTURING '(manufactur|production|work-order|cut-order|bom|job-card)'
          run_slice PRINT '(print|pdf|a4)'
          run_slice ACCOUNTING_CLOSURE '(transaction.*closure|reconcil|receivable|payable|payment|general-ledger|accounting|stock-ledger)'

      - name: Full server regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$CERT_ROOT/server"
          pnpm test:unit
          echo FULL_SERVER_REGRESSION_PASS

      - name: Client contract and product readiness
        shell: bash
        run: |
          set -euo pipefail
          cd "$CERT_ROOT/client"
          pnpm --filter @metaforge/views... run build
          pnpm run lint
          pnpm run test
          pnpm run product:check
          node --test packages/views/tests/form-view-metadata-purity.test.mjs packages/views/tests/metadata-child-grid-runtime.test.mjs packages/views/tests/child-grid-presentation.test.mjs
          echo CLIENT_RUNTIME_CONTRACT_PASS

      - name: Responsive browser smoke and bundle budget
        shell: bash
        run: |
          set -euo pipefail
          cd "$CERT_ROOT/client"
          pnpm --filter @metaforge/demo exec playwright install --with-deps chromium
          pnpm --filter @metaforge/demo run e2e
          pnpm --filter @metaforge/demo run build
          largest=$(find apps/demo/dist -type f -name '*.js' -printf '%s\n' | sort -nr | head -1)
          echo "LARGEST_DEMO_JS_BYTES=$largest"
          test -n "$largest" && test "$largest" -le 2097152
          echo PLAYWRIGHT_RESPONSIVE_UX_PASS
          echo CLIENT_BUNDLE_BUDGET_PASS
