name: Temporary Cut Bundle Authority

on:
  push:
    branches:
      - agent/alumdoor-cut-bundle-authority
    paths:
      - .github/workflows/_tmp-cut-bundle-authority.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Materialize source-batch lineage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('server/apps-src/alumdoor-worker/src/index.ts')
          text = index_path.read_text(encoding='utf-8')
          interface_anchor = '  source_warehouse?: string;\n'
          if '  source_batch_no?: string;\n' not in text:
              if interface_anchor not in text:
                  raise SystemExit('V2CutOrderItem source_warehouse anchor not found')
              text = text.replace(interface_anchor, interface_anchor + '  source_batch_no?: string;\n', 1)
          draft_anchor = '        item_code: proposal.item_code,\n        serial_and_batch_bundle: outward,\n'
          draft_replacement = '        item_code: proposal.item_code,\n        source_warehouse: pick.warehouse,\n        source_batch_no: pick.batch_no,\n        serial_and_batch_bundle: outward,\n'
          if '        source_batch_no: pick.batch_no,\n' not in text:
              if draft_anchor not in text:
                  raise SystemExit('draft Cut Order item anchor not found')
              text = text.replace(draft_anchor, draft_replacement, 1)
          index_path.write_text(text, encoding='utf-8')

          brief_path = Path('server/briefs/alumdoor-v2.json')
          brief = brief_path.read_text(encoding='utf-8')
          serial_block = '\n'.join([
              '        {',
              '          "fieldname": "serial_and_batch_bundle",',
              '          "label": "Lô đem cắt (bundle Outward)",',
              '          "fieldtype": "Link",',
              '          "options": "Serial and Batch Bundle",',
              '          "required": true,',
              '          "surface": "quick"',
              '        },',
              '',
          ])
          lineage_block = '\n'.join([
              '        {',
              '          "fieldname": "source_batch_no",',
              '          "label": "Lô nguồn FIFO",',
              '          "fieldtype": "Link",',
              '          "options": "Batch",',
              '          "required": true,',
              '          "read_only": true,',
              '          "surface": "expanded"',
              '        },',
              '',
          ])
          if '"fieldname": "source_batch_no"' not in brief:
              if serial_block not in brief:
                  raise SystemExit('Cut Order Item serial bundle schema anchor not found')
              brief = brief.replace(serial_block, serial_block + lineage_block, 1)
          form_anchor = '\n'.join([
              '        "fields": [',
              '          "serial_and_batch_bundle",',
              '          "offcut_bundle",',
              '          "item_code",',
              '          "source_warehouse",',
              '',
          ])
          form_replacement = '\n'.join([
              '        "fields": [',
              '          "serial_and_batch_bundle",',
              '          "source_batch_no",',
              '          "offcut_bundle",',
              '          "item_code",',
              '          "source_warehouse",',
              '',
          ])
          if form_replacement not in brief:
              if form_anchor not in brief:
                  raise SystemExit('Cut Order Item form anchor not found')
              brief = brief.replace(form_anchor, form_replacement, 1)
          brief_path.write_text(brief, encoding='utf-8')
          PY
          grep -n "source_batch_no" server/apps-src/alumdoor-worker/src/index.ts
          grep -n "source_batch_no" server/briefs/alumdoor-v2.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate server and bundle lineage
        run: |
          cd server
          pnpm run build
          node --test tests/alumdoor-cut-bom-authority.test.mjs
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
          node scripts/verify-alumdoor-meta-completeness.mjs
          cd ..
          git diff --check b24cfe64d28d7dd31d15766f4864952cb3fcc53d...HEAD
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/apps-src/alumdoor-worker/src/index.ts server/briefs/alumdoor-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(alumdoor): persist cut source batch lineage"
            git push origin HEAD:agent/alumdoor-cut-bundle-authority
          fi

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/_tmp-cut-bundle-authority.yml
          git commit -m "chore: remove temporary cut bundle validation"
          git push origin HEAD:agent/alumdoor-cut-bundle-authority
