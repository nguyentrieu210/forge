name: Issue 942 Latest Main Gate

on:
  push:
    branches:
      - agent/alumdoor-v2-reproducible

permissions:
  contents: write

jobs:
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[issue-942-latest-main]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge exact latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          echo "LATEST_MAIN=$(git rev-parse origin/main)"
          git merge --no-edit origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Official generator first and second pass
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cp server/briefs/alumdoor-v2.json /tmp/v2-first.json
          node server/scripts/build-alumdoor-v2-brief.mjs
          cmp -s /tmp/v2-first.json server/briefs/alumdoor-v2.json
          git diff --exit-code -- server/briefs/alumdoor-v2.json
      - name: Focused reproducibility tests
        run: node --test server/tests/alumdoor-v2-generator-reproducibility.test.mjs
      - name: Server build
        run: pnpm run server:build
      - name: Brief check
        run: pnpm --dir server run brief:check
      - name: Diff hygiene
        run: git diff --check
      - name: Push merged latest-main tree and remove temporary workflow
        run: |
          rm .github/workflows/issue-942-latest-main-gate.yml
          git add .github/workflows/issue-942-latest-main-gate.yml
          git commit -m "ci(alumdoor): remove issue 942 latest-main gate [issue-942-latest-main]"
          git push origin HEAD:agent/alumdoor-v2-reproducible
