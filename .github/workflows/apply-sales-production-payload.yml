name: Apply Sales Production Payload

on:
  push:
    branches:
      - feat/sales-order-production-flow-20260801
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete

permissions:
  contents: write

concurrency:
  group: apply-sales-production-payload-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && (github.head_ref == 'feat/sales-order-production-flow-20260801' || github.ref_name == 'feat/sales-order-production-flow-20260801') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-order-production-flow-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild staged module
        shell: bash
        run: |
          set -euo pipefail
          parts=(server/scripts/.sales-production-payload/module-*.txt)
          test -e "${parts[0]}"
          cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/sales-production.ts
          test -s /tmp/sales-production.ts
          grep -q 'export' /tmp/sales-production.ts
          mv /tmp/sales-production.ts server/apps-src/alumdoor-worker/src/sales-production.ts
          rm -rf server/scripts/.sales-production-payload
          rm -f .github/workflows/apply-sales-production-payload.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter cloudforge run build

      - name: Commit decoded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(sales): add production request domain module'
          git push origin HEAD:feat/sales-order-production-flow-20260801
