name: Purchase Source Materializer

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: purchase-source-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize verified purchase source
    if: ${{ github.head_ref == 'feat/purchase-fifo-production-completion-20260731' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct exact verified source
        shell: bash
        run: |
          set -euo pipefail
          payload="$(tr -d '\r\n' < .github/purchase-completion.patch.gz.b64)"
          actual="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
          expected='6995a2a9aca39363db69b394e447932e0a22186448081ed73bc9efacf4099183'
          test "$actual" = "$expected"
          printf '%s' "$payload" | base64 --decode | gzip -dc > /tmp/purchase-completion.patch
          git apply --check /tmp/purchase-completion.patch
          git apply /tmp/purchase-completion.patch

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/purchase-completion-apply.yml')
          lines = workflow.read_text().splitlines()
          marker = "          python3 - <<'PY'"
          start = lines.index(marker) + 1
          end = next(index for index in range(start, len(lines)) if lines[index] == '          PY')
          body = []
          for line in lines[start:end]:
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          Path('/tmp/purchase-normalize.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/purchase-normalize.py

          rm -f .github/purchase-completion.patch.gz.b64
          rm -f .github/purchase-completion-v2.patch.gz.b64
          rm -f .github/workflows/purchase-completion-apply.yml
          rm -f .github/workflows/purchase-materialize.yml

          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git diff --cached --stat

      - name: Create commit object and publish SHA
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.environ['PARENT_SHA']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f'{api}{path}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent_commit = request('GET', f'/repos/{repository}/git/commits/{parent}')
          raw = subprocess.check_output(['git', 'diff', '--cached', '--name-status', '--no-renames', '-z'])
          fields = raw.decode().split('\0')
          entries = []
          index = 0
          while index < len(fields) and fields[index]:
              status = fields[index]
              path = fields[index + 1]
              index += 2
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              blob = request('POST', f'/repos/{repository}/git/blobs', {
                  'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode(),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = request('POST', f'/repos/{repository}/git/trees', {
              'base_tree': parent_commit['tree']['sha'],
              'tree': entries,
          })
          commit = request('POST', f'/repos/{repository}/git/commits', {
              'message': 'fix(purchase): complete lifecycle and browser QA',
              'tree': tree['sha'],
              'parents': [parent],
          })
          print(f'VERIFIED_COMMIT_SHA={commit["sha"]}')
          print(f'VERIFIED_TREE_SHA={tree["sha"]}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={commit["sha"]}\n')
              output.write(f'tree={tree["sha"]}\n')
          PY

      - name: Publish commit evidence
        shell: bash
        run: |
          echo "verified_commit_sha=${{ steps.commit.outputs.sha }}"
          echo "verified_tree_sha=${{ steps.commit.outputs.tree }}"
          {
            echo '## Purchase source materialized'
            echo
            echo "Commit object: \`${{ steps.commit.outputs.sha }}\`"
            echo "Tree: \`${{ steps.commit.outputs.tree }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
