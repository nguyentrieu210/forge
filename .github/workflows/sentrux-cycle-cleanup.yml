name: Sentrux cycle cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-cycle-cleanup-20260815

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
          sentrux --version

      - name: Capture baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-before.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-before.txt | tail -1 | grep -Eo '[0-9]+')
          test -n "$QUALITY"
          echo "quality=$QUALITY" >> "$GITHUB_OUTPUT"

      - name: Break core-selling cycle
        run: node scripts/sentrux-break-core-selling-cycle.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm run server:typecheck

      - name: Sentrux gate
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate . | tee /tmp/sentrux-gate.txt

      - name: Require score increase
        id: after
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-after.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-after.txt | tail -1 | grep -Eo '[0-9]+')
          test -n "$QUALITY"
          BEFORE='${{ steps.before.outputs.quality }}'
          if [ "$QUALITY" -le "$BEFORE" ]; then
            echo "Sentrux score did not increase: $BEFORE -> $QUALITY"
            exit 1
          fi
          echo "Sentrux score increased: $BEFORE -> $QUALITY"

      - name: Commit validated production patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sentrux
          rm -f scripts/sentrux-break-core-selling-cycle.mjs
          rm -f .github/workflows/sentrux-cycle-cleanup.yml
          git config user.name "sentrux-refactor-bot"
          git config user.email "sentrux-refactor-bot@users.noreply.github.com"
          git add -A -- \
            server/packages/clouderp-core/src/types.ts \
            server/packages/clouderp-core/src/tax-types.ts \
            server/packages/clouderp-selling/src/types.ts \
            scripts/sentrux-break-core-selling-cycle.mjs \
            .github/workflows/sentrux-cycle-cleanup.yml
          git commit -m "refactor(clouderp): break core-selling type cycle [skip sentrux-cycle]"
          git push origin HEAD:agent/sentrux-cycle-cleanup-20260815
