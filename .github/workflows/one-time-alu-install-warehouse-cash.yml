# Retry marker: HRM Leave Type ownership fixed in PR #284; continue full Alumdoor sync.
name: One-time ALU Warehouse Cash Install

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-alu-install-warehouse-cash.yml"

permissions:
  contents: write

concurrency:
  group: one-time-alu-warehouse-cash-install
  cancel-in-progress: false

jobs:
  install:
    name: Install Warehouse Cash backend and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TENANT: alu
      ORIGIN: https://alu.kairo.vn
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact release revision
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Require production credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$FORGE_ADMIN_PASSWORD" || { echo "Missing FORGE_ADMIN_PASSWORD"; exit 1; }

      - name: Set up pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build server installer and workers
        id: build
        run: pnpm --filter cloudforge run build

      - name: Validate app packages before touching production
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/forge-app.mjs server/apps-src/hrm --dry-run
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting --dry-run

      - name: Backup ALU tenant
        id: backup
        run: node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$RUNNER_TEMP/alu-before-warehouse-cash"

      - name: Apply tenant migrations
        id: migrate
        run: node server/scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Deploy current tenant worker
        id: deploy_worker
        run: node server/scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Install or upgrade HRM dependency
        id: install_hrm
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_USER="${FORGE_ADMIN_USER:-admin}"
          set +e
          node server/scripts/forge-app.mjs server/apps-src/hrm \
            --origin "$ORIGIN" \
            --admin "$ADMIN_USER" 2>&1 | tee "$RUNNER_TEMP/install-hrm.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Install or upgrade VN Accounting and Warehouse Cash
        id: install_vn_accounting
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_USER="${FORGE_ADMIN_USER:-admin}"
          set +e
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting \
            --origin "$ORIGIN" \
            --admin "$ADMIN_USER" 2>&1 | tee "$RUNNER_TEMP/install-vn-accounting.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Verify production health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$ORIGIN/health" >/dev/null

      - name: Record successful install evidence
        id: success_evidence
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const path = 'deploy-evidence/alu-warehouse-cash-install.json';
            const payload = {
              deployedSha: process.env.DEPLOYED_SHA,
              tenant: 'alu',
              origin: 'https://alu.kairo.vn',
              apps: ['hrm', 'vn-accounting'],
              warehouseCash: true,
              steps: ['backup', 'migrate', 'tenant-worker', 'app-install', 'manifest-verify', 'health'],
              completedAt: new Date().toISOString(),
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `ops: record ALU Warehouse Cash install ${process.env.DEPLOYED_SHA.slice(0, 12)}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {}),
            });

      - name: Record failed install evidence
        if: ${{ failure() }}
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.TARGET_SHA }}
          HRM_LOG_PATH: ${{ runner.temp }}/install-hrm.log
          VN_LOG_PATH: ${{ runner.temp }}/install-vn-accounting.log
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_CREDENTIALS: ${{ steps.credentials.outcome }}
          OUTCOME_SETUP_PNPM: ${{ steps.setup_pnpm.outcome }}
          OUTCOME_SETUP_NODE: ${{ steps.setup_node.outcome }}
          OUTCOME_DEPENDENCIES: ${{ steps.dependencies.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_VALIDATE: ${{ steps.validate.outcome }}
          OUTCOME_BACKUP: ${{ steps.backup.outcome }}
          OUTCOME_MIGRATE: ${{ steps.migrate.outcome }}
          OUTCOME_DEPLOY_WORKER: ${{ steps.deploy_worker.outcome }}
          OUTCOME_INSTALL_HRM: ${{ steps.install_hrm.outcome }}
          OUTCOME_INSTALL_VN_ACCOUNTING: ${{ steps.install_vn_accounting.outcome }}
          OUTCOME_HEALTH: ${{ steps.health.outcome }}
          OUTCOME_SUCCESS_EVIDENCE: ${{ steps.success_evidence.outcome }}
        with:
          script: |
            const fs = require('fs');
            const tail = (path) => {
              try {
                return fs.readFileSync(path, 'utf8').split(/\r?\n/).slice(-80).join('\n');
              } catch {
                return null;
              }
            };
            const outcomes = {
              checkout: process.env.OUTCOME_CHECKOUT,
              credentials: process.env.OUTCOME_CREDENTIALS,
              setup_pnpm: process.env.OUTCOME_SETUP_PNPM,
              setup_node: process.env.OUTCOME_SETUP_NODE,
              dependencies: process.env.OUTCOME_DEPENDENCIES,
              build: process.env.OUTCOME_BUILD,
              validate: process.env.OUTCOME_VALIDATE,
              backup: process.env.OUTCOME_BACKUP,
              migrate: process.env.OUTCOME_MIGRATE,
              deploy_worker: process.env.OUTCOME_DEPLOY_WORKER,
              install_hrm: process.env.OUTCOME_INSTALL_HRM,
              install_vn_accounting: process.env.OUTCOME_INSTALL_VN_ACCOUNTING,
              health: process.env.OUTCOME_HEALTH,
              success_evidence: process.env.OUTCOME_SUCCESS_EVIDENCE,
            };
            const failedStep = Object.entries(outcomes).find(([, outcome]) => outcome === 'failure')?.[0] ?? 'unknown';
            const payload = {
              deployedSha: process.env.DEPLOYED_SHA,
              tenant: 'alu',
              origin: 'https://alu.kairo.vn',
              failedStep,
              outcomes,
              hrmLogTail: tail(process.env.HRM_LOG_PATH),
              vnAccountingLogTail: tail(process.env.VN_LOG_PATH),
              failedAt: new Date().toISOString(),
            };
            const path = 'deploy-evidence/alu-warehouse-cash-failure.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `ops: record ALU Warehouse Cash failure ${process.env.DEPLOYED_SHA.slice(0, 12)}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {}),
            });
