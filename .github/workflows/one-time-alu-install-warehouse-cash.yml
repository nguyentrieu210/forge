# Retry marker: HRM department context blocker fixed in PR #277.
name: One-time ALU Warehouse Cash Install

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-alu-install-warehouse-cash.yml"

permissions:
  contents: write

concurrency:
  group: one-time-alu-warehouse-cash-install
  cancel-in-progress: false

jobs:
  install:
    name: Install Warehouse Cash backend and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TENANT: alu
      ORIGIN: https://alu.kairo.vn
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$FORGE_ADMIN_PASSWORD" || { echo "Missing FORGE_ADMIN_PASSWORD"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build server installer and workers
        run: pnpm --filter cloudforge run build

      - name: Validate app packages before touching production
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/forge-app.mjs server/apps-src/hrm --dry-run
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting --dry-run

      - name: Backup ALU tenant
        run: node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$RUNNER_TEMP/alu-before-warehouse-cash"

      - name: Apply tenant migrations
        run: node server/scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Deploy current tenant worker
        run: node server/scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Install or upgrade HRM dependency
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_USER="${FORGE_ADMIN_USER:-admin}"
          node server/scripts/forge-app.mjs server/apps-src/hrm \
            --origin "$ORIGIN" \
            --admin "$ADMIN_USER"

      - name: Install or upgrade VN Accounting and Warehouse Cash
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_USER="${FORGE_ADMIN_USER:-admin}"
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting \
            --origin "$ORIGIN" \
            --admin "$ADMIN_USER"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$ORIGIN/health" >/dev/null

      - name: Record successful install evidence
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const path = 'deploy-evidence/alu-warehouse-cash-install.json';
            const payload = {
              deployedSha: process.env.DEPLOYED_SHA,
              tenant: 'alu',
              origin: 'https://alu.kairo.vn',
              apps: ['hrm', 'vn-accounting'],
              warehouseCash: true,
              steps: ['backup', 'migrate', 'tenant-worker', 'app-install', 'manifest-verify', 'health'],
              completedAt: new Date().toISOString(),
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main',
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `ops: record ALU Warehouse Cash install ${process.env.DEPLOYED_SHA.slice(0, 12)}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {}),
            });
