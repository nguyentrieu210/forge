name: Patch Purchase In-Memory Invariant

on:
  push:
    branches:
      - feat/purchase-receipt-complete-20260731
    paths:
      - '.github/workflows/patch-purchase-in-memory-store.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/purchase-receipt-complete-20260731
          fetch-depth: 0
      - name: Patch invariant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/packages/document-kernel/src/in-memory-store.ts')
          text = path.read_text()
          old = '''      const source = this.documents.get(this.docKey(plan.command.tenant_id, "Purchase Order", line.purchase_order));
                if (!source || source.docstatus !== 1) throw errors.reference(`Submitted Purchase Order ${line.purchase_order} is required`);'''
          new = '''      const storedSource = this.documents.get(this.docKey(plan.command.tenant_id, "Purchase Order", line.purchase_order));
                const currentSource = plan.document.doctype === "Purchase Order"
                  && plan.document.name === line.purchase_order
                  && plan.document.docstatus === 1
                  ? plan.document
                  : null;
                const source = storedSource?.docstatus === 1 ? storedSource : currentSource;
                if (!source) throw errors.reference(`Submitted Purchase Order ${line.purchase_order} is required`);'''
          if old not in text:
              print('Invariant already patched or source changed; no action.')
          else:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/packages/document-kernel/src/in-memory-store.ts
          git commit -m 'fix(test-store): accept PO submitted in current mutation'
          git push origin HEAD:feat/purchase-receipt-complete-20260731
