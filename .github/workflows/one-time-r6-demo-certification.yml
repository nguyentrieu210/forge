name: One-time R6 Demo Production Certification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-r6-demo-certification.yml"

permissions:
  contents: write

concurrency:
  group: one-time-r6-demo-production-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Certify ALU demo production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      TARGET_SHA: 396f28a06ddb0f2d58da1d221cbd267390feb953
      TENANT: alu
      ORIGIN: https://alu.kairo.vn
      APP_WORKER: cloudforge-app-alumdoor
      DISPATCH_NAMESPACE: cloudforge-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD }}
      VITE_FORGE_RELEASE_SHA: 396f28a06ddb0f2d58da1d221cbd267390feb953

    steps:
      - name: Checkout exact merged R6 runtime candidate
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove candidate is merged into main
        id: ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Require authorized demo-production credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$FORGE_ADMIN_PASSWORD"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Full candidate build and source certification
        id: build
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter cloudforge run build
          pnpm --filter metaforge run build
          node server/scripts/stage-client-bundle.mjs
          node server/scripts/verify-cloudflare-governance.mjs --json > "$RUNNER_TEMP/r6-e01-governance.json"
          node server/scripts/verify-observability-config.mjs > "$RUNNER_TEMP/r6-e01-observability.txt"
          (cd server && npm run verify:release-safety)
          (cd server && npm run verify:queue-safety)
          (cd server && node --test tests/d1-migrate-remote-safety.test.mjs tests/sre-destructive-guards.test.mjs)
          (cd server && pnpm exec vitest run apps/tenant-worker/test/health.integration.test.mts --config apps/tenant-worker/vitest.config.mts --reporter=verbose)
          (cd server && pnpm exec vitest run apps/tenant-worker/test/frappe-facade.integration.test.mts --config apps/tenant-worker/vitest.config.mts -t "logs in with a real password hash|rejects a write without the CSRF header|refuses a request routed for a different tenant" --reporter=verbose)
          (cd server && pnpm exec vitest run apps/tenant-worker/test/tenant-provisioning.integration.test.mts --config apps/tenant-worker/vitest.config.mts --reporter=verbose)
          (cd server && pnpm exec vitest run apps/tenant-worker/test/r6-golden-flow.integration.test.mts --config apps/tenant-worker/vitest.config.mts --reporter=verbose)
          node server/tests/r5-04-manufacturing-service-integration.test.mjs
          node server/scripts/forge-app.mjs server/apps-src/hrm --dry-run
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting --dry-run
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run

      - name: Fresh ALU backup and isolated verification
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/r6-demo-backup"
          mkdir -p "$backup_dir"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$backup_dir"
          mapfile -t backups < <(find "$backup_dir" -maxdepth 1 -type f -name '*.sql' -print | sort)
          test "${#backups[@]}" -eq 1
          backup_file="${backups[0]}"
          node server/scripts/verify-tenant-backup.mjs \
            --tenant "$TENANT" \
            --file "$backup_file" \
            --output "$RUNNER_TEMP/r6-e07-e08-backup.json"
          echo "R6_BACKUP_FILE=$backup_file" >> "$GITHUB_ENV"

      - name: Create disposable remote D1 restore target
        id: drill_create
        shell: bash
        run: |
          set -euo pipefail
          drill="cloudforge-drill-r6-${GITHUB_RUN_ID}"
          pnpm --dir server exec wrangler d1 create "$drill"
          echo "R6_DRILL=$drill" >> "$GITHUB_ENV"

      - name: Restore verified backup into disposable remote D1
        id: drill_restore
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/restore-tenant-drill.mjs \
            --tenant "$TENANT" \
            --target "$R6_DRILL" \
            --file "$R6_BACKUP_FILE" \
            --execute \
            --confirm "$R6_DRILL"
          restore_evidence="$R6_BACKUP_FILE.$R6_DRILL.restore.json"
          test -f "$restore_evidence"
          cp "$restore_evidence" "$RUNNER_TEMP/r6-e09-remote-restore.json"

      - name: Reconcile live opening/cutover snapshot against disposable restore
        id: cutover
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { d1Query, wrangler } from './server/scripts/wrangler-cli.mjs';
          import { findTenantDatabaseId, removeTenantConfig, writeTenantConfig } from './server/scripts/tenant-wrangler.mjs';

          const tenant = process.env.TENANT;
          const drillName = process.env.R6_DRILL;
          const liveId = findTenantDatabaseId(tenant, wrangler);
          if (!liveId) throw new Error(`missing live D1 cloudforge-${tenant}`);
          const databases = JSON.parse(wrangler(['d1','list','--json']));
          const drill = databases.find((entry) => entry.name === drillName);
          if (!drill?.uuid) throw new Error(`missing drill D1 ${drillName}`);

          const liveConfig = writeTenantConfig({ tenant, databaseId: liveId, publicOrigin: process.env.ORIGIN });
          const drillConfig = writeTenantConfig({ tenant: `drill-${tenant}`, databaseId: drill.uuid, databaseName: drillName });
          const live = { name: `cloudforge-${tenant}`, id: liveId, configArg: liveConfig.relativeConfig };
          const restored = { name: drillName, id: drill.uuid, configArg: drillConfig.relativeConfig };
          const scalar = (db, sql) => {
            const row = d1Query(db, sql)[0] ?? {};
            return Object.fromEntries(Object.entries(row).map(([k,v]) => [k, String(v ?? '')]));
          };
          const exists = (db, table) => Number(d1Query(db, `SELECT COUNT(*) AS total FROM sqlite_schema WHERE type='table' AND name='${table}'`)[0]?.total ?? 0) === 1;
          const metric = (db, table, sql) => exists(db, table) ? scalar(db, sql) : { absent: 'true' };
          const collect = (db) => ({
            documents: metric(db, 'documents', 'SELECT COUNT(*) AS rows FROM documents'),
            master_records: metric(db, 'master_records', 'SELECT COUNT(*) AS rows FROM master_records'),
            installed_apps: metric(db, 'installed_apps', 'SELECT COUNT(*) AS rows FROM installed_apps'),
            migrations: metric(db, 'd1_migrations', 'SELECT COUNT(*) AS rows FROM d1_migrations'),
            stock: metric(db, 'stock_ledger_entries', 'SELECT COUNT(*) AS rows, COALESCE(SUM(actual_qty_micros),0) AS qty_micros FROM stock_ledger_entries'),
            ar: metric(db, 'payment_ledger_entries', "SELECT COUNT(*) AS rows, COALESCE(SUM(amount_minor),0) AS amount_minor FROM payment_ledger_entries WHERE against_voucher_type='Sales Invoice'"),
            ap: metric(db, 'payment_ledger_entries', "SELECT COUNT(*) AS rows, COALESCE(SUM(amount_minor),0) AS amount_minor FROM payment_ledger_entries WHERE against_voucher_type='Purchase Invoice'"),
            payment: metric(db, 'payment_ledger_entries', 'SELECT COUNT(*) AS rows, COALESCE(SUM(amount_minor),0) AS amount_minor FROM payment_ledger_entries'),
            gl: metric(db, 'gl_entries', 'SELECT COUNT(*) AS rows, COALESCE(SUM(debit_minor),0) AS debit_minor, COALESCE(SUM(credit_minor),0) AS credit_minor, COALESCE(SUM(debit_minor-credit_minor),0) AS balance_minor FROM gl_entries'),
            cash_bank: exists(db, 'gl_entries') && exists(db, 'master_records')
              ? scalar(db, "SELECT COUNT(*) AS rows, COALESCE(SUM(g.debit_minor-g.credit_minor),0) AS balance_minor FROM gl_entries g JOIN master_records m ON m.tenant_id=g.tenant_id AND m.record_type='Account' AND m.name=g.account WHERE json_extract(m.data_json,'$.account_type') IN ('Cash','Bank')")
              : { absent: 'true' },
          });
          try {
            const source = collect(live);
            const replay = collect(restored);
            const keys = Object.keys(source);
            const comparisons = keys.map((key) => ({ metric: key, source: source[key], restored: replay[key], matches: JSON.stringify(source[key]) === JSON.stringify(replay[key]) }));
            const evidence = {
              format: 'forge-r6-cutover-reconciliation/v1',
              evidence_id: 'R6-E11',
              observed_at: new Date().toISOString(),
              environment_class: 'DISPOSABLE_REMOTE',
              mutation: 'DISPOSABLE_ONLY',
              source_database: `cloudforge-${tenant}`,
              restored_database: drillName,
              comparisons,
              status: comparisons.every((x) => x.matches) ? 'PASS' : 'BLOCKED',
            };
            writeFileSync(path.join(process.env.RUNNER_TEMP, 'r6-e11-cutover-reconciliation.json'), JSON.stringify(evidence, null, 2) + '\n');
            if (evidence.status !== 'PASS') throw new Error('cutover reconciliation mismatch');
          } finally {
            removeTenantConfig(liveConfig.configPath);
            removeTenantConfig(drillConfig.configPath);
          }
          NODE

      - name: Delete disposable restore D1
        id: drill_cleanup
        if: always() && env.R6_DRILL != ''
        continue-on-error: true
        shell: bash
        run: pnpm --dir server exec wrangler d1 delete "$R6_DRILL" --skip-confirmation

      - name: Apply all pending ALU tenant migrations
        id: migrate
        shell: bash
        run: node server/scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Verify zero pending/unknown migrations
        id: migration_verify
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { d1Query, wrangler } from './server/scripts/wrangler-cli.mjs';
          import { findTenantDatabaseId, removeTenantConfig, writeTenantConfig } from './server/scripts/tenant-wrangler.mjs';
          const tenant = process.env.TENANT;
          const databaseId = findTenantDatabaseId(tenant, wrangler);
          if (!databaseId) throw new Error(`missing D1 cloudforge-${tenant}`);
          const generated = writeTenantConfig({ tenant, databaseId, publicOrigin: process.env.ORIGIN });
          try {
            const db = { name: `cloudforge-${tenant}`, id: databaseId, configArg: generated.relativeConfig };
            const expected = readdirSync('./server/migrations/tenant').filter((name) => name.endsWith('.sql')).sort();
            const applied = d1Query(db, 'SELECT name FROM d1_migrations ORDER BY name').map((row) => String(row.name));
            const appliedSet = new Set(applied);
            const expectedSet = new Set(expected);
            const pending = expected.filter((name) => !appliedSet.has(name));
            const unknown = applied.filter((name) => !expectedSet.has(name));
            const evidence = {
              format: 'forge-r6-migration-convergence/v1',
              evidence_id: 'R6-E06',
              observed_at: new Date().toISOString(),
              environment_class: 'PILOT_TARGET_OBSERVED',
              mutation: 'AUTHORIZED_PRODUCTION',
              expected: expected.length,
              applied: applied.length,
              pending,
              unknown,
              status: pending.length === 0 && unknown.length === 0 ? 'PASS' : 'BLOCKED',
            };
            writeFileSync(path.join(process.env.RUNNER_TEMP, 'r6-e06-migrations.json'), JSON.stringify(evidence, null, 2) + '\n');
            if (evidence.status !== 'PASS') throw new Error(`migration convergence failed pending=${pending.length} unknown=${unknown.length}`);
          } finally {
            removeTenantConfig(generated.configPath);
          }
          NODE

      - name: Deploy ALU tenant Worker with current binding contract
        id: tenant_deploy
        run: node server/scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Deploy Alumdoor app Worker with observability
        id: app_deploy
        working-directory: server
        run: >-
          pnpm exec wrangler deploy
          --config apps-src/alumdoor-worker/wrangler.jsonc
          --name "$APP_WORKER"
          --dispatch-namespace "$DISPATCH_NAMESPACE"
          --strict

      - name: Install or upgrade canonical pilot packages
        id: package_install
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_USER="${FORGE_ADMIN_USER:-Administrator}"
          node server/scripts/forge-app.mjs server/apps-src/hrm --origin "$ORIGIN" --admin "$ADMIN_USER"
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting --origin "$ORIGIN" --admin "$ADMIN_USER"
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --origin "$ORIGIN" --admin "$ADMIN_USER"

      - name: Apply active Alumdoor capability profile
        id: capability_profile
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          const origin = process.env.ORIGIN.replace(/\/$/, '');
          const user = process.env.FORGE_ADMIN_USER || 'Administrator';
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map();
          const store = (response) => {
            for (const value of response.headers.getSetCookie?.() ?? []) {
              const pair = value.split(';')[0];
              const i = pair.indexOf('=');
              if (i > 0) jar.set(pair.slice(0,i).trim(), pair.slice(i+1).trim());
            }
          };
          const cookie = () => [...jar].map(([k,v]) => `${k}=${v}`).join('; ');
          let csrf = '';
          async function request(pathname, { method='GET', body } = {}) {
            const response = await fetch(`${origin}${pathname}`, {
              method,
              headers: {
                ...(body ? { 'content-type': 'application/json' } : {}),
                ...(jar.size ? { cookie: cookie() } : {}),
                ...(csrf && method !== 'GET' ? { 'x-frappe-csrf-token': csrf } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            store(response);
            csrf = response.headers.get('x-frappe-csrf-token') || csrf;
            const text = await response.text();
            let data = null;
            try { data = JSON.parse(text); } catch {}
            if (!response.ok) throw new Error(`${pathname} HTTP ${response.status}: ${data?.message ?? text.slice(0,300)}`);
            return data?.message ?? data;
          }
          await request('/api/method/login', { method:'POST', body:{ usr:user, pwd:password } });
          const current = await request('/api/method/metaforge.api.get_capability_profile');
          const expectedVersion = Number(current?.version ?? 0);
          const applied = await request('/api/method/metaforge.api.apply_capability_profile', {
            method:'POST',
            body:{ profile_id:'alumdoor-pilot', expected_version:expectedVersion, selections:[] },
          });
          const final = await request('/api/method/metaforge.api.get_capability_profile');
          const evidence = {
            format:'forge-r6-capability-profile-apply/v1',
            evidence_id:'R6-E18',
            observed_at:new Date().toISOString(),
            environment_class:'PILOT_TARGET_OBSERVED',
            mutation:'AUTHORIZED_PRODUCTION',
            actor:user,
            previous_version:expectedVersion,
            apply_result:applied,
            active:final,
            status: final?.profile_id === 'alumdoor-pilot' && Number(final?.version ?? 0) > expectedVersion && final?.resolution?.valid !== false ? 'PASS' : 'BLOCKED',
          };
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'r6-e18-profile-apply.json'), JSON.stringify(evidence, null, 2) + '\n');
          if (evidence.status !== 'PASS') throw new Error('active capability profile did not converge');
          NODE

      - name: Deploy exact Gateway UI and release marker
        id: gateway_deploy
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Bounded pilot pressure evidence
        id: pressure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          const url = `${process.env.ORIGIN.replace(/\/$/,'')}/health`;
          const total = 50;
          const concurrency = 5;
          const latencies = [];
          let errors = 0;
          let next = 0;
          const started = performance.now();
          async function worker() {
            for (;;) {
              const index = next++;
              if (index >= total) return;
              const t0 = performance.now();
              try {
                const response = await fetch(url, { redirect:'error' });
                const body = await response.text();
                if (response.status !== 200 || !/ok/i.test(body)) errors += 1;
              } catch { errors += 1; }
              latencies.push(performance.now() - t0);
            }
          }
          await Promise.all(Array.from({length:concurrency}, worker));
          const durationMs = performance.now() - started;
          latencies.sort((a,b) => a-b);
          const p = (q) => Number(latencies[Math.min(latencies.length-1, Math.max(0, Math.ceil(latencies.length*q)-1))]?.toFixed(2) ?? 0);
          const evidence = {
            format:'forge-r6-pilot-pressure/v1', evidence_id:'R6-E17', observed_at:new Date().toISOString(),
            environment_class:'PILOT_TARGET_OBSERVED', mutation:'NONE', requests:total, concurrency,
            errors, error_rate:errors/total, rps:Number((total/(durationMs/1000)).toFixed(2)),
            latency_ms:{p50:p(0.50),p95:p(0.95),p99:p(0.99)},
            status:errors===0?'PASS':'BLOCKED',
          };
          writeFileSync(path.join(process.env.RUNNER_TEMP,'r6-e17-pressure.json'), JSON.stringify(evidence,null,2)+'\n');
          if (errors) throw new Error(`bounded pressure saw ${errors} errors`);
          NODE

      - name: Verify exact public release and auth boundary
        id: health
        run: >-
          node server/scripts/sre-health-snapshot.mjs
          --base "$ORIGIN"
          --expected-release-sha "$TARGET_SHA"
          --allow-remote
          --confirm-host alu.kairo.vn
          --attempts 10
          --delay-ms 2000
          --output "$RUNNER_TEMP/r6-e03-e04-health.json"

      - name: Observe provider convergence after deploy
        id: provider
        run: >-
          node server/scripts/r6-provider-readonly.mjs
          --source-sha "$TARGET_SHA"
          --output "$RUNNER_TEMP/r6-e02-e05-provider.json"

      - name: Observe exact package/profile/release identity after deploy
        id: identity
        run: >-
          node server/scripts/r6-convergence-identity-readonly.mjs
          --tenant "$TENANT"
          --origin "$ORIGIN"
          --expected-release-sha "$TARGET_SHA"
          --output "$RUNNER_TEMP/r6-e18-identity.json"

      - name: Fresh PITR decision evidence after migration
        id: pitr
        shell: bash
        run: |
          set -euo pipefail
          target_ts="$(date -u -d '5 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          node server/scripts/d1-pitr.mjs \
            --tenant "$TENANT" \
            --timestamp "$target_ts" \
            --output "$RUNNER_TEMP/r6-e10-pitr.json"

      - name: Delete plaintext backup after certification probes
        id: erase_backup
        if: always() && env.R6_BACKUP_FILE != ''
        shell: bash
        run: rm -f "$R6_BACKUP_FILE" "$R6_BACKUP_FILE.json" "$R6_BACKUP_FILE".*.restore.json "$R6_BACKUP_FILE".d1-safe-*.sql

      - name: Publish sanitized R6 execution artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-demo-production-certification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r6-e01-governance.json
            ${{ runner.temp }}/r6-e01-observability.txt
            ${{ runner.temp }}/r6-e06-migrations.json
            ${{ runner.temp }}/r6-e07-e08-backup.json
            ${{ runner.temp }}/r6-e09-remote-restore.json
            ${{ runner.temp }}/r6-e10-pitr.json
            ${{ runner.temp }}/r6-e11-cutover-reconciliation.json
            ${{ runner.temp }}/r6-e17-pressure.json
            ${{ runner.temp }}/r6-e18-profile-apply.json
            ${{ runner.temp }}/r6-e03-e04-health.json
            ${{ runner.temp }}/r6-e02-e05-provider.json
            ${{ runner.temp }}/r6-e18-identity.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record PASS/BLOCKED execution verdict on main
        if: always()
        uses: actions/github-script@v7
        env:
          OUT_CHECKOUT: ${{ steps.checkout.outcome }}
          OUT_ANCESTRY: ${{ steps.ancestry.outcome }}
          OUT_CREDENTIALS: ${{ steps.credentials.outcome }}
          OUT_INSTALL: ${{ steps.install.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_BACKUP: ${{ steps.backup.outcome }}
          OUT_DRILL_CREATE: ${{ steps.drill_create.outcome }}
          OUT_DRILL_RESTORE: ${{ steps.drill_restore.outcome }}
          OUT_CUTOVER: ${{ steps.cutover.outcome }}
          OUT_DRILL_CLEANUP: ${{ steps.drill_cleanup.outcome }}
          OUT_MIGRATE: ${{ steps.migrate.outcome }}
          OUT_MIGRATION_VERIFY: ${{ steps.migration_verify.outcome }}
          OUT_TENANT_DEPLOY: ${{ steps.tenant_deploy.outcome }}
          OUT_APP_DEPLOY: ${{ steps.app_deploy.outcome }}
          OUT_PACKAGE_INSTALL: ${{ steps.package_install.outcome }}
          OUT_PROFILE: ${{ steps.capability_profile.outcome }}
          OUT_GATEWAY: ${{ steps.gateway_deploy.outcome }}
          OUT_PRESSURE: ${{ steps.pressure.outcome }}
          OUT_HEALTH: ${{ steps.health.outcome }}
          OUT_PROVIDER: ${{ steps.provider.outcome }}
          OUT_IDENTITY: ${{ steps.identity.outcome }}
          OUT_PITR: ${{ steps.pitr.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const names = [
              'CHECKOUT','ANCESTRY','CREDENTIALS','INSTALL','BUILD','BACKUP','DRILL_CREATE','DRILL_RESTORE','CUTOVER',
              'MIGRATE','MIGRATION_VERIFY','TENANT_DEPLOY','APP_DEPLOY','PACKAGE_INSTALL','PROFILE','GATEWAY','PRESSURE','HEALTH','PROVIDER','IDENTITY','PITR'
            ];
            const outcomes = Object.fromEntries(names.map(name => [name.toLowerCase(), process.env[`OUT_${name}`] || 'not-run']));
            // Drill cleanup is hygiene; retain it separately and do not rewrite successful E09 if provider cleanup has a transient failure.
            outcomes.drill_cleanup = process.env.OUT_DRILL_CLEANUP || 'not-run';
            const required = names.map(name => outcomes[name.toLowerCase()]);
            const status = required.every(value => value === 'success') ? 'PASS' : 'BLOCKED';
            const read = (filename) => {
              try { return JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, filename), 'utf8')); }
              catch { return null; }
            };
            const payload = {
              format: 'forge-r6-demo-production-certification/v1',
              status,
              candidate_sha: process.env.TARGET_SHA,
              tenant: process.env.TENANT,
              origin: process.env.ORIGIN,
              authorized_context: 'project owner explicitly authorized unrestricted mutation of the demo production environment for R6 certification',
              mutation: 'AUTHORIZED_PRODUCTION',
              completed_at: new Date().toISOString(),
              workflow_run_id: String(context.runId),
              outcomes,
              evidence: {
                e06: read('r6-e06-migrations.json'),
                e07_e08: read('r6-e07-e08-backup.json'),
                e09: read('r6-e09-remote-restore.json'),
                e10: read('r6-e10-pitr.json'),
                e11: read('r6-e11-cutover-reconciliation.json'),
                e17: read('r6-e17-pressure.json'),
                e18_profile_apply: read('r6-e18-profile-apply.json'),
                e03_e04: read('r6-e03-e04-health.json'),
                e02_e05: read('r6-e02-e05-provider.json'),
                e18_identity: read('r6-e18-identity.json'),
              },
            };
            const evidencePath = `deploy-evidence/r6-demo-production-certification-${process.env.TARGET_SHA.slice(0,12)}.json`;
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner:context.repo.owner, repo:context.repo.repo, path:evidencePath, ref:'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner, repo:context.repo.repo, path:evidencePath,
              message:`ops(r6): record ${status} demo certification ${process.env.TARGET_SHA.slice(0,12)}`,
              content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'), branch:'main', ...(sha?{sha}:{}),
            });

      - name: Enforce final execution verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          required=(
            '${{ steps.checkout.outcome }}'
            '${{ steps.ancestry.outcome }}'
            '${{ steps.credentials.outcome }}'
            '${{ steps.install.outcome }}'
            '${{ steps.build.outcome }}'
            '${{ steps.backup.outcome }}'
            '${{ steps.drill_create.outcome }}'
            '${{ steps.drill_restore.outcome }}'
            '${{ steps.cutover.outcome }}'
            '${{ steps.migrate.outcome }}'
            '${{ steps.migration_verify.outcome }}'
            '${{ steps.tenant_deploy.outcome }}'
            '${{ steps.app_deploy.outcome }}'
            '${{ steps.package_install.outcome }}'
            '${{ steps.capability_profile.outcome }}'
            '${{ steps.gateway_deploy.outcome }}'
            '${{ steps.pressure.outcome }}'
            '${{ steps.health.outcome }}'
            '${{ steps.provider.outcome }}'
            '${{ steps.identity.outcome }}'
            '${{ steps.pitr.outcome }}'
          )
          for outcome in "${required[@]}"; do test "$outcome" = success; done
          echo "R6_DEMO_PRODUCTION_EXECUTION_PASS candidate=$TARGET_SHA"
