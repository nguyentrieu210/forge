name: TMP Complete Alumdoor 2.2.10 Gateway Production 2026-08-05

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-complete-alu-main-1c6baab-20260805.yml"

permissions:
  contents: read

concurrency:
  group: release-alu-tenant-production
  cancel-in-progress: false

jobs:
  complete:
    name: Verify installed 2.2.10, deploy exact Gateway, verify release
    if: github.head_ref == 'release/alu-main-1c6baab-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TENANT: alu
      TARGET_SHA: 1c6baab0a1de69a5f35f16f7bcc18855ec77ab39
      EXPECTED_PACKAGE: 2.2.10
      FORGE_ORIGIN: https://alu.kairo.vn
      EVIDENCE_DIR: /tmp/alu-main-1c6baab-gateway-completion
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout release bridge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfirm immutable current-main authorization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${FORGE_ADMIN_USER:-}"
          test -n "${FORGE_ADMIN_PASSWORD:-}"
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$TARGET_SHA" || {
            echo "Refusing continuation: target $TARGET_SHA is not current main $current_main."
            exit 1
          }
          printf 'target_sha=%s\nexpected_package=%s\nprior_release_run=31026329482\nprior_backup_sha256=4b7faf7f25c7ddebc0012c670333ec6424a30b129b4ead7282a0750b359922fe\nprior_backup_artifact=8938828860\nprior_restore_drills=pass\n' \
            "$TARGET_SHA" "$EXPECTED_PACKAGE" > "$EVIDENCE_DIR/state.txt"

      - name: Checkout exact authorized main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA"
          git checkout --force --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git clean -fdx

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source package and installed production manifest before Gateway mutation
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run \
            2>&1 | tee "$EVIDENCE_DIR/package-source.log"
          grep -Fq 'DRY_RUN_PASS alumdoor' "$EVIDENCE_DIR/package-source.log"
          grep -Fq 'app=alumdoor@2.2.10' "$EVIDENCE_DIR/package-source.log"
          node --input-type=module <<'NODE' | tee "$EVIDENCE_DIR/pre-gateway-manifest.log"
          const origin = process.env.FORGE_ORIGIN.replace(/\/$/, '');
          const user = process.env.FORGE_ADMIN_USER;
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map();
          let csrf = '';
          function store(response) {
            for (const value of response.headers.getSetCookie?.() ?? []) {
              const pair = value.split(';')[0];
              const i = pair.indexOf('=');
              if (i > 0) jar.set(pair.slice(0, i).trim(), pair.slice(i + 1).trim());
            }
          }
          async function call(method, body = {}) {
            const response = await fetch(`${origin}/api/method/${method}`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'cache-control': 'no-cache',
                ...(jar.size ? { cookie: [...jar].map(([k,v]) => `${k}=${v}`).join('; ') } : {}),
                ...(csrf ? { 'x-frappe-csrf-token': csrf } : {}),
              },
              body: JSON.stringify(body),
            });
            store(response);
            csrf = response.headers.get('x-frappe-csrf-token') ?? csrf;
            const text = await response.text();
            const parsed = JSON.parse(text);
            if (!response.ok) throw new Error(`${method} HTTP ${response.status}: ${parsed.message ?? text.slice(0,200)}`);
            return parsed.message ?? parsed;
          }
          await call('login', { usr: user, pwd: password });
          const manifest = await call('metaforge.api.get_app_manifest', { app: 'alumdoor' });
          const nav = Array.isArray(manifest.nav) ? manifest.nav : [];
          const mustHave = [
            'action:tao-don-mua', 'action:nhap-nhom-hang-loat', 'action:bao-cao-giao-hang-ncc', 'Purchase Order',
            'alumdoor-operations:workbench', 'Sales Order', 'Delivery Note', 'action:giao-hang-theo-ngay', 'report:Đơn hàng theo khách'
          ];
          for (const key of mustHave) if (!nav.some((entry) => entry?.key === key)) throw new Error(`installed manifest missing ${key}`);
          console.log(`INSTALLED_MANIFEST_PASS nav=${nav.length}`);
          NODE
          printf 'source_package=pass\ninstalled_manifest_pre_gateway=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Build and stage exact runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          VITE_FORGE_RELEASE_SHA="$TARGET_SHA" pnpm --filter metaforge run build \
            2>&1 | tee "$EVIDENCE_DIR/metaforge-build.log"
          VITE_FORGE_RELEASE_SHA="$TARGET_SHA" node server/scripts/stage-client-bundle.mjs \
            2>&1 | tee "$EVIDENCE_DIR/stage-client.log"
          grep -Fq "release=$TARGET_SHA" "$EVIDENCE_DIR/stage-client.log"
          node server/scripts/stage-client-bundle.mjs --check \
            2>&1 | tee "$EVIDENCE_DIR/stage-check.log"
          printf 'exact_client_stage=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Recheck exact main immediately before Gateway deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$TARGET_SHA" || {
            echo "Refusing Gateway deploy: main moved to $current_main after staging."
            exit 1
          }

      - name: Deploy exact Gateway assets and Worker source
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc \
            2>&1 | tee "$EVIDENCE_DIR/gateway-deploy.log"
          printf 'gateway_deploy=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify exact release marker, boundaries, and converged navigation
        shell: bash
        run: |
          set -euo pipefail
          health_code="$(curl --silent --show-error --max-time 15 -o /tmp/health.json -w '%{http_code}' \
            -H 'Cache-Control: no-cache' "$FORGE_ORIGIN/health?sha=$TARGET_SHA&run=$GITHUB_RUN_ID")"
          test "$health_code" = "200"

          release_ok=false
          for attempt in $(seq 1 20); do
            code="$(curl --silent --show-error --max-time 15 -o /tmp/release.json -w '%{http_code}' \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$FORGE_ORIGIN/release.json?sha=$TARGET_SHA&run=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            if [ "$code" = "200" ] && node - /tmp/release.json "$TARGET_SHA" <<'NODE'
          const fs = require('fs');
          const [path, expected] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (release.releaseSha !== expected || !release.bundleHash) process.exit(2);
          console.log(`EXACT_RELEASE_PASS sha=${release.releaseSha} bundle=${release.bundleHash}`);
          NODE
            then release_ok=true; break; fi
            sleep 2
          done
          [ "$release_ok" = true ]
          bundle_hash="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/release.json','utf8'));process.stdout.write(r.bundleHash||'')")"
          printf 'release_marker=pass\nbundle_hash=%s\n' "$bundle_hash" >> "$EVIDENCE_DIR/state.txt"

          guest_code="$(curl --silent --show-error --max-time 15 -o /tmp/guest.json -w '%{http_code}' \
            -H 'content-type: application/json' -H 'Cache-Control: no-cache' \
            -X POST "$FORGE_ORIGIN/api/method/frappe.desk.desktop.get_bootinfo?sha=$TARGET_SHA&run=$GITHUB_RUN_ID" --data '{}')"
          test "$guest_code" = "403"

          node --input-type=module <<'NODE' | tee "$EVIDENCE_DIR/final-manifest.log"
          const origin = process.env.FORGE_ORIGIN.replace(/\/$/, '');
          const user = process.env.FORGE_ADMIN_USER;
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map(); let csrf = '';
          function store(response) { for (const value of response.headers.getSetCookie?.() ?? []) { const pair=value.split(';')[0]; const i=pair.indexOf('='); if(i>0) jar.set(pair.slice(0,i).trim(), pair.slice(i+1).trim()); } }
          async function call(method, body={}) { const response=await fetch(`${origin}/api/method/${method}`, {method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache',...(jar.size?{cookie:[...jar].map(([k,v])=>`${k}=${v}`).join('; ')}:{}),...(csrf?{'x-frappe-csrf-token':csrf}:{})},body:JSON.stringify(body)}); store(response); csrf=response.headers.get('x-frappe-csrf-token')??csrf; const text=await response.text(); const parsed=JSON.parse(text); if(!response.ok) throw new Error(`${method} HTTP ${response.status}: ${parsed.message??text.slice(0,200)}`); return parsed.message??parsed; }
          await call('login',{usr:user,pwd:password});
          const manifest=await call('metaforge.api.get_app_manifest',{app:'alumdoor'});
          const nav=Array.isArray(manifest.nav)?manifest.nav:[];
          const procurement=nav.filter((entry)=>entry?.group==='Mua hàng');
          const sales=nav.filter((entry)=>entry?.group==='Bán hàng');
          const pKeys=['action:tao-don-mua','action:nhap-nhom-hang-loat','action:bao-cao-giao-hang-ncc','Purchase Order'];
          const pLabels=['Mua hàng','Nhập hàng','Báo cáo','Lịch sử mua hàng'];
          const sKeys=['alumdoor-operations:workbench','Sales Order','Delivery Note','action:giao-hang-theo-ngay','report:Đơn hàng theo khách'];
          const sLabels=['Bán hàng','Đơn hàng','Phiếu xuất kho','Giao hàng','Báo cáo'];
          if(JSON.stringify(procurement.map(e=>e.key))!==JSON.stringify(pKeys)) throw new Error(`unexpected procurement keys ${JSON.stringify(procurement)}`);
          if(JSON.stringify(procurement.map(e=>e.label))!==JSON.stringify(pLabels)) throw new Error(`unexpected procurement labels ${JSON.stringify(procurement)}`);
          if(JSON.stringify(sales.map(e=>e.key))!==JSON.stringify(sKeys)) throw new Error(`unexpected sales keys ${JSON.stringify(sales)}`);
          if(JSON.stringify(sales.map(e=>e.label))!==JSON.stringify(sLabels)) throw new Error(`unexpected sales labels ${JSON.stringify(sales)}`);
          for(const hidden of ['Purchase Receipt','action:nhap-nhom-fifo','action:doi-soat-giao-hang-ncc','action:tinh-cong-thuc-cua']) if(nav.some(e=>e?.key===hidden)) throw new Error(`hidden daily entry visible: ${hidden}`);
          console.log(`ALUMDOOR_DECLARATION_PASS nav=${nav.length} procurement=${procurement.length} sales=${sales.length}`);
          NODE
          printf 'health=pass\nguest_boundary=pass\nalumdoor_navigation=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Publish completion summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Alumdoor 2.2.10 Gateway completion'
            echo
            echo '```text'
            cat "$EVIDENCE_DIR/state.txt" 2>/dev/null || echo 'state.txt missing'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-main-1c6baab-gateway-completion-${{ github.run_id }}
          path: /tmp/alu-main-1c6baab-gateway-completion/
          if-no-files-found: warn
          retention-days: 30
