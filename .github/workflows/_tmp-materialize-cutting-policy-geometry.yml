name: Temporary Materialize Cutting Policy Geometry

on:
  push:
    branches: ['fix/alumdoor-cutting-policy-geometry-rules']
    paths: ['.github/workflows/_tmp-materialize-cutting-policy-geometry.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Patch canonical metadata and gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { CUTTING_POLICIES, cuttingPolicyFixtureData } from './server/scripts/lib/alumdoor-cutting-policy-catalog.mjs';

          function replaceOnce(path, before, after, label) {
            let text = fs.readFileSync(path, 'utf8');
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected 1 match, got ${count}`);
            fs.writeFileSync(path, text.replace(before, after), 'utf8');
          }

          const builder = 'server/scripts/build-alumdoor-v2-brief.mjs';
          replaceOnce(builder,
            'import { GEOMETRY_FIELDS, GEOMETRY_PROFILES } from "./lib/alumdoor-geometry-catalog.mjs";\n',
            'import { GEOMETRY_FIELDS, GEOMETRY_PROFILES } from "./lib/alumdoor-geometry-catalog.mjs";\nimport { CUTTING_POLICIES, cuttingPolicyFixtureData } from "./lib/alumdoor-cutting-policy-catalog.mjs";\n',
            'cutting catalog import');
          replaceOnce(builder, 'brief.version = "2.3.0";', 'brief.version = "2.4.0";', 'v2 version');
          replaceOnce(builder,
            '  "ray_type:Select(U75,U100,Ray sắt U70,Không dùng ray)!=(U75) Loại ray");',
            '  "ray_type:Select(U75,U100,Ray hộp/đơn U76,Ray sắt U70,Không dùng ray)!=(U75) Loại ray");\naddAfter(cp, "ray_type",\n  "geometry_profile:Link(Geometry Profile)! Bộ quy cách hình học",\n  "geometry_rules:Table(Cutting Policy Rule) Quy tắc hình học");',
            'cutting geometry fields');
          replaceOnce(builder,
            'note("Cutting Policy: +9 trường (ray_type, chia lá) · +doctype con Leaf Variant");',
            `note("Cutting Policy: +9 trường (ray_type, chia lá) · +doctype con Leaf Variant");\n\nbrief.doctypes.push({\n  name: "Cutting Policy Rule", child: true, label: "Quy tắc hình học", group: "Sản xuất", naming: "autoincrement",\n  fields: [\n    "rule_code:Data*! Mã quy tắc",\n    "target_field:Link(Geometry Field)! Trường kết quả",\n    "source_field:Link(Geometry Field)! Trường nguồn",\n    "operator:Select(COPY,SUBTRACT,ADD)!=(SUBTRACT) Phép tính",\n    "operand_m:Float=(0) Giá trị cộng/trừ (m)",\n    "customer_group:Select(,Đại lý,Lẻ) Nhóm khách",\n    "ray_type:Select(,U75,U100,Ray hộp/đơn U76,Ray sắt U70,Không dùng ray) Loại ray",\n    "has_butterfly_bracket:Check Có bắn bướm",\n    "priority:Int=(0) Ưu tiên",\n    "sequence:Int=(10) Thứ tự",\n    "note:Small Text Ghi chú nguồn",\n  ],\n  permissions: { "Chủ xưởng": "rwc", "Kinh doanh": "r", "Sản xuất": "r" },\n});\nfor (const policy of CUTTING_POLICIES) {\n  const fixture = brief.fixtures.find((entry) => entry.type === "Cutting Policy" && entry.name === policy.name);\n  if (!fixture) throw new Error(\`Cutting Policy fixture missing: \${policy.name}\`);\n  Object.assign(fixture.data, cuttingPolicyFixtureData(policy));\n}\nnote(\`Cutting Policy: gắn Geometry Profile + \${CUTTING_POLICIES.reduce((sum, policy) => sum + policy.rules.length, 0)} geometry rules canonical\`);`,
            'cutting child schema + fixture materialization');

          const briefPath = 'server/briefs/alumdoor-v2.json';
          const brief = JSON.parse(fs.readFileSync(briefPath, 'utf8'));
          brief.version = '2.4.0';
          const doctypes = Array.isArray(brief.doctypes) ? brief.doctypes : Object.values(brief.doctypes);
          const cp = doctypes.find((entry) => entry.name === 'Cutting Policy');
          if (!cp) throw new Error('static brief missing Cutting Policy');
          const fieldName = (field) => typeof field === 'string' ? field.split(':', 1)[0] : field.fieldname;
          const ray = cp.fields.find((field) => fieldName(field) === 'ray_type');
          if (!ray || typeof ray === 'string') throw new Error('ray_type should be materialized field object');
          if (!String(ray.options ?? '').includes('Ray hộp/đơn U76')) ray.options = String(ray.options ?? '').replace('Ray sắt U70', 'Ray hộp/đơn U76\nRay sắt U70');
          const rayIndex = cp.fields.findIndex((field) => fieldName(field) === 'ray_type');
          const additions = [
            { fieldname: 'geometry_profile', fieldtype: 'Link', options: 'Geometry Profile', label: 'Bộ quy cách hình học', required: true },
            { fieldname: 'geometry_rules', fieldtype: 'Table', options: 'Cutting Policy Rule', label: 'Quy tắc hình học' },
          ];
          for (const addition of additions) {
            if (!cp.fields.some((field) => fieldName(field) === addition.fieldname)) cp.fields.splice(rayIndex + 1, 0, addition);
          }
          if (!doctypes.some((entry) => entry.name === 'Cutting Policy Rule')) {
            doctypes.push({
              name: 'Cutting Policy Rule', child: true, label: 'Quy tắc hình học', group: 'Sản xuất', naming: 'autoincrement',
              fields: [
                { fieldname: 'rule_code', fieldtype: 'Data', label: 'Mã quy tắc', required: true },
                { fieldname: 'target_field', fieldtype: 'Link', options: 'Geometry Field', label: 'Trường kết quả', required: true },
                { fieldname: 'source_field', fieldtype: 'Link', options: 'Geometry Field', label: 'Trường nguồn', required: true },
                { fieldname: 'operator', fieldtype: 'Select', options: 'COPY\nSUBTRACT\nADD', label: 'Phép tính', required: true, default: 'SUBTRACT' },
                { fieldname: 'operand_m', fieldtype: 'Float', label: 'Giá trị cộng/trừ (m)', default: 0 },
                { fieldname: 'customer_group', fieldtype: 'Select', options: '\nĐại lý\nLẻ', label: 'Nhóm khách' },
                { fieldname: 'ray_type', fieldtype: 'Select', options: '\nU75\nU100\nRay hộp/đơn U76\nRay sắt U70\nKhông dùng ray', label: 'Loại ray' },
                { fieldname: 'has_butterfly_bracket', fieldtype: 'Check', label: 'Có bắn bướm' },
                { fieldname: 'priority', fieldtype: 'Int', label: 'Ưu tiên', default: 0 },
                { fieldname: 'sequence', fieldtype: 'Int', label: 'Thứ tự', default: 10 },
                { fieldname: 'note', fieldtype: 'Small Text', label: 'Ghi chú nguồn' },
              ],
              permissions: { 'Chủ xưởng': 'rwc', 'Kinh doanh': 'r', 'Sản xuất': 'r' },
            });
          }
          for (const policy of CUTTING_POLICIES) {
            const fixture = brief.fixtures.find((entry) => entry.type === 'Cutting Policy' && entry.name === policy.name);
            if (!fixture) throw new Error(`static fixture missing ${policy.name}`);
            Object.assign(fixture.data, cuttingPolicyFixtureData(policy));
          }
          fs.writeFileSync(briefPath, `${JSON.stringify(brief, null, 2)}\n`, 'utf8');

          const gate = '.github/workflows/alumdoor-master-layer0.yml';
          let gateText = fs.readFileSync(gate, 'utf8');
          for (const anchor of ["      - 'server/tests/alumdoor-measurement-geometry-master.test.mjs'\n"]) {
            const add = `${anchor}      - 'server/scripts/lib/alumdoor-cutting-policy-catalog.mjs'\n      - 'server/apps-src/alumdoor-worker/src/geometry-policy.ts'\n      - 'server/tests/alumdoor-cutting-policy-geometry.test.mjs'\n`;
            gateText = gateText.replace(anchor, add);
          }
          if (!gateText.includes('name: Lock Cutting Policy geometry rules')) {
            gateText += `\n  cutting_policy_geometry:\n    name: Lock Cutting Policy geometry rules\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n      - name: Build and test canonical Cutting Policy geometry\n        working-directory: server\n        run: |\n          corepack enable\n          pnpm install --frozen-lockfile\n          pnpm run build\n          node --test tests/alumdoor-cutting-policy-geometry.test.mjs\n          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run\n`;
          }
          fs.writeFileSync(gate, gateText, 'utf8');
          NODE

      - name: Build and test
        working-directory: server
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          node --test tests/alumdoor-cutting-policy-geometry.test.mjs
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run

      - name: Commit product files and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-materialize-cutting-policy-geometry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/scripts/lib/alumdoor-cutting-policy-catalog.mjs server/apps-src/alumdoor-worker/src/geometry-policy.ts server/tests/alumdoor-cutting-policy-geometry.test.mjs server/scripts/build-alumdoor-v2-brief.mjs server/briefs/alumdoor-v2.json .github/workflows/alumdoor-master-layer0.yml .github/workflows/_tmp-materialize-cutting-policy-geometry.yml
          git commit -m 'feat(alumdoor): lock geometry-driven Cutting Policy'
          git push origin HEAD:fix/alumdoor-cutting-policy-geometry-rules
