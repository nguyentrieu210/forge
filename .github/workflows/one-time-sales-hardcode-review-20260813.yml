name: One-time Sales hardcode review patch

on:
  push:
    branches:
      - fix/sales-hardcode-review-20260813
    paths:
      - ".github/workflows/one-time-sales-hardcode-review-20260813.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/sales-hardcode-review-20260813
          fetch-depth: 0

      - name: Patch hardcoded Sales Order UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'function today(): string {',
              'function commercialNormalized(value: unknown): string {\n  return text(value).toLocaleLowerCase("vi");\n}\n\nfunction today(): string {',
              'commercial normalizer',
          )

          replace_once(
              '  if (typeof value === "string") return normalized(value);\n  return value == null ? null : normalized(value);',
              '  if (typeof value === "string") return commercialNormalized(value);\n  return value == null ? null : commercialNormalized(value);',
              'sales option comparable normalization',
          )

          replace_once(
              '  if (itemGroup && normalized(itemGroup) !== normalized(line._context?.item_group)) return false;',
              '  if (itemGroup && commercialNormalized(itemGroup) !== commercialNormalized(line._context?.item_group)) return false;',
              'sales option group normalization',
          )

          replace_once(
              '  const closeSeen = useRef(props.closeRequest ?? 0);\n  const lineSeq = useRef(new Map<string, number>());',
              '  const closeSeen = useRef(props.closeRequest ?? 0);\n  const lineSeq = useRef(new Map<string, number>());\n  const headerSeq = useRef(0);',
              'header sequence ref',
          )

          replace_once(
              '''  const setHeaderField = useCallback((field: string, value: unknown, preview = false) => {\n    const next = { ...header, [field]: value };\n    setHeader(next);\n    if (!preview) return;\n    void previewDocument(next, field)\n      .then((resolved) => setHeader(resolved))\n      .catch((error) => toast.error(mapError(error).message));\n  }, [header, previewDocument]);''',
              '''  const setHeaderField = useCallback((field: string, value: unknown, preview = false) => {\n    const seq = ++headerSeq.current;\n    const next = { ...header, [field]: value };\n    setHeader(next);\n    if (!preview) return;\n    void previewDocument(next, field)\n      .then((resolved) => {\n        if (headerSeq.current === seq) setHeader(resolved);\n      })\n      .catch((error) => {\n        if (headerSeq.current === seq) toast.error(mapError(error).message);\n      });\n  }, [header, previewDocument]);''',
              'header preview sequence guard',
          )

          old_loader = '''  const loadSalesOptions = useCallback(async (itemCode: string, itemGroup: string): Promise<Doc[]> => {\n    if (!itemGroup) return [];\n    try {\n      const rows = await adapter.getList("Sales Option", {\n        fields: [\n          "name",\n          "option_label",\n          "item_group",\n          "item_code",\n          "is_default",\n          "disabled",\n          "option_code",\n          "conditions",\n          "priority",\n          "sales_mode",\n          "price_variant",\n          "discount_basis_variant",\n          "sales_package",\n        ],\n        filters: { item_group: itemGroup, disabled: 0 },\n        pageLength: 100,\n      });\n      return rows\n        .filter((row) => !text(row.item_code) || text(row.item_code) === itemCode)\n        .sort((left, right) => (Number(right.priority) || 0) - (Number(left.priority) || 0) || text(left.option_label).localeCompare(text(right.option_label), "vi"));\n    } catch {\n      return [];\n    }\n  }, [adapter]);'''
          new_loader = '''  const loadSalesOptions = useCallback(async (itemCode: string, itemGroup: string): Promise<Doc[]> => {\n    if (!itemCode) return [];\n    try {\n      const rows = await adapter.getList("Sales Option", {\n        fields: [\n          "name",\n          "option_label",\n          "item_group",\n          "item_code",\n          "is_default",\n          "disabled",\n          "option_code",\n          "conditions",\n          "priority",\n          "sales_mode",\n          "price_variant",\n          "discount_basis_variant",\n          "sales_package",\n        ],\n        filters: { disabled: 0 },\n        pageLength: 1000,\n      });\n      return rows\n        .filter((row) => {\n          const scopedItem = text(row.item_code);\n          if (scopedItem && scopedItem !== itemCode) return false;\n          const scopedGroup = text(row.item_group);\n          if (scopedGroup && commercialNormalized(scopedGroup) !== commercialNormalized(itemGroup)) return false;\n          return true;\n        })\n        .sort((left, right) => (Number(right.priority) || 0) - (Number(left.priority) || 0) || text(left.option_label).localeCompare(text(right.option_label), "vi"));\n    } catch {\n      return [];\n    }\n  }, [adapter]);'''
          replace_once(old_loader, new_loader, 'Sales Option candidate loading')

          replace_once(
              '''    if (field === "item_code") {\n      const itemCode = text(value);''',
              '''    if (field === "item_code") {\n      lineSeq.current.set(key, (lineSeq.current.get(key) ?? 0) + 1);\n      const itemCode = text(value);''',
              'item preview invalidation',
          )

          path.write_text(text)
          PY

      - name: Verify patch scope
        run: |
          git diff --check
          git diff -- client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx

      - name: Commit UI patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-sales-hardcode-review-20260813.yml
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git commit -m "fix(ui): stabilize hardcoded Sales Order state"
          git push origin HEAD:fix/sales-hardcode-review-20260813
