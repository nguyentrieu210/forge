name: CFMAX R2 Integrated Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cfmax-r2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrated:
    if: startsWith(github.head_ref, 'cloudflare/cfmax-09-convergence-r2')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused CF01 TypeScript check
        working-directory: server
        run: |
          cat > tsconfig.cfmax-cf01.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": { "noEmit": true, "declaration": false },
            "include": [
              "packages/core/src/**/*.ts",
              "packages/query/src/**/*.ts",
              "apps/query-worker/src/**/*.ts",
              "types/**/*.d.ts"
            ],
            "exclude": ["dist", "node_modules"]
          }
          JSON
          pnpm exec tsc -p tsconfig.cfmax-cf01.json

      - name: Focused CF02 Workflow build
        working-directory: server
        run: |
          cat > tsconfig.cfmax-cf02.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": false,
              "declaration": false,
              "sourceMap": false,
              "outDir": "dist"
            },
            "include": [
              "apps/workflow-worker/src/**/*.ts",
              "packages/core/src/**/*.ts",
              "types/**/*.d.ts"
            ],
            "exclude": ["dist", "node_modules"]
          }
          JSON
          pnpm exec tsc -p tsconfig.cfmax-cf02.json
          test -f dist/apps/workflow-worker/src/contracts.js
          test -f dist/apps/workflow-worker/src/index.js

      - name: Focused CF03 telemetry build
        working-directory: server
        run: |
          cat > tsconfig.cfmax-cf03-build.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": false,
              "declaration": false,
              "sourceMap": false,
              "outDir": "dist"
            },
            "include": ["packages/usage-telemetry/src/**/*.ts", "types/**/*.d.ts"],
            "exclude": ["dist", "node_modules"]
          }
          JSON
          pnpm exec tsc -p tsconfig.cfmax-cf03-build.json
          test -f dist/packages/usage-telemetry/src/index.js

      - name: Focused CF05 AI build
        working-directory: server
        run: |
          cat > tsconfig.cfmax-cf05.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": false,
              "declaration": false,
              "sourceMap": false,
              "outDir": "dist"
            },
            "include": [
              "packages/ai-policy/src/**/*.ts",
              "apps/tenant-worker/src/ai-assistant.ts",
              "apps/tenant-worker/src/env.ts",
              "types/**/*.d.ts"
            ],
            "exclude": ["dist", "node_modules"]
          }
          JSON
          pnpm exec tsc -p tsconfig.cfmax-cf05.json
          test -f dist/packages/ai-policy/src/index.js
          test -f dist/apps/tenant-worker/src/ai-assistant.js

      - name: Build CF06 print UI dependency chain
        run: |
          pnpm --filter @metaforge/charts run build
          pnpm --filter @metaforge/visual run build
          pnpm --filter @metaforge/views run build

      - name: Query worker real-workerd D1 suite
        working-directory: server
        run: pnpm exec vitest run --config apps/query-worker/vitest.config.mts

      - name: CFMAX integrated regressions
        working-directory: server
        run: |
          node --test \
            tests/cfmax-d1-client-bookmark-contract.test.mjs \
            tests/cfmax-workflow-orchestration.test.mjs \
            tests/edge-security-policy.test.mjs \
            tests/cfmax-usage-telemetry.test.mjs \
            tests/ai-policy.test.mjs \
            tests/ai-assistant.test.mjs \
            tests/cfmax-render-export.test.mjs

      - name: Cloudflare governance source/drift validation
        working-directory: server
        run: node scripts/verify-cloudflare-governance.mjs

      - name: Build and stage canonical Gateway assets
        run: |
          pnpm --filter runtime run build
          pnpm --filter kho run build
          node server/scripts/stage-client-bundle.mjs
          node server/scripts/stage-client-bundle.mjs --check

      - name: Bundle Gateway with usage telemetry and edge source
        working-directory: server
        run: pnpm exec wrangler deploy --dry-run --config apps/gateway-worker/wrangler.jsonc --outdir /tmp/cfmax-gateway-worker

      - name: Bundle Tenant Worker with Browser Run and AI policy
        working-directory: server
        run: pnpm exec wrangler deploy --dry-run --config apps/tenant-worker/wrangler.jsonc --outdir /tmp/cfmax-tenant-worker

      - name: Parse Query config and bindings
        working-directory: server
        run: pnpm exec wrangler types /tmp/cfmax-query.d.ts --config apps/query-worker/wrangler.jsonc --env-interface CfmaxQueryBindings --include-runtime false

      - name: Bundle Workflow worker and binding
        working-directory: server
        run: pnpm exec wrangler deploy --dry-run --config apps/workflow-worker/wrangler.jsonc --outdir /tmp/cfmax-workflow-worker
