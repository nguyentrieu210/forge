name: HR Payroll Contract Validation

on:
  push:
    paths:
      - ".github/workflows/hr-payroll-validation.yml"
      - "client/apps/hrm/**"
      - "server/apps/tenant-worker/src/payroll-coordinator.ts"
      - "server/apps-src/alumdoor-attendance/**"
      - "server/apps-src/alumdoor-worker/**"
      - "server/apps-src/hrm/doctypes/overtime-request.json"
      - "server/packages/alumdoor-hr-payroll-contract/**"
      - "server/packages/clouderp-erpnext/src/alumdoor-attendance*.ts"
      - "server/packages/clouderp-erpnext/src/alumdoor-payroll*.ts"
      - "server/packages/clouderp-erpnext/src/hrm-salary-slip.ts"
  pull_request:
    paths:
      - ".github/workflows/hr-payroll-validation.yml"
      - "client/apps/hrm/**"
      - "server/apps/tenant-worker/src/payroll-coordinator.ts"
      - "server/apps-src/alumdoor-attendance/**"
      - "server/apps-src/alumdoor-worker/**"
      - "server/apps-src/hrm/doctypes/overtime-request.json"
      - "server/packages/alumdoor-hr-payroll-contract/**"
      - "server/packages/clouderp-erpnext/src/alumdoor-attendance*.ts"
      - "server/packages/clouderp-erpnext/src/alumdoor-payroll*.ts"
      - "server/packages/clouderp-erpnext/src/hrm-salary-slip.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Attendance / payroll contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build server TypeScript
        working-directory: server
        run: pnpm run build

      - name: Run focused attendance and payroll tests
        working-directory: server
        run: |
          pnpm exec vitest run \
            apps-src/alumdoor-worker/tests/attendance-core.test.ts \
            apps-src/alumdoor-worker/tests/attendance-lite.test.ts \
            apps-src/alumdoor-worker/tests/attendance-lite-scan.test.ts \
            apps-src/alumdoor-worker/tests/payroll-core.test.ts \
            apps-src/alumdoor-worker/tests/payroll-reconciliation.test.ts \
            apps-src/alumdoor-worker/tests/fixed-hourly-payroll-flow.test.ts \
            apps-src/alumdoor-worker/tests/payroll-paid-leave-projection.test.ts \
            apps-src/alumdoor-worker/tests/payroll-coordinator.test.ts
