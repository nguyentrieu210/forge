name: Validate HRM Department Context

on:
  push:
    branches:
      - fix/hrm-department-context-20260803
    paths:
      - .github/workflows/validate-hrm-department-context.yml
  pull_request:
    branches:
      - main
    paths:
      - server/apps-src/hrm/app.json
      - .github/workflows/validate-hrm-department-context.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter cloudforge run build
      - run: node server/scripts/forge-app.mjs server/apps-src/hrm --dry-run
      - run: node server/scripts/forge-app.mjs server/apps-src/vn-accounting --dry-run
