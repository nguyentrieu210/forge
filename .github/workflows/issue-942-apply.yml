name: Issue 942 Apply Reproducibility

on:
  push:
    branches: [agent/alumdoor-v2-reproducible]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-942-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Migrate proven runtime contracts back to source
        run: |
          python <<'PY'
          import json, subprocess
          SRC='server/briefs/alumdoor.json'
          src=json.load(open(SRC,encoding='utf-8'))
          def snap(commit):
              return json.loads(subprocess.check_output(['git','show',f'{commit}:server/briefs/alumdoor-v2.json'],text=True))
          A=snap('a71725a2977ab08ae793b5b64bcf4b5da8f7c3ee')
          B=snap('b07e4f4d35e8e11fa5775a99833d1f437a6dd263')
          M=snap('ffecf83e53fe350d9bd82c977fe3840afb5bf3d2')
          G=snap('0c56ebcf20202fecb6b68b50503ebcfb3da01f05')
          C=snap('d6427f435fb300f72f790a67f640114d6453cad4')
          COLOR=snap('ea6d267b05c0e912f91afacfe62376c5a6e15e4f')
          def dt(b,n):
              return next(x for x in b['doctypes'] if x['name']==n)
          def fld(d,n):
              for f in d.get('fields',[]):
                  name=f.split(':',1)[0].strip() if isinstance(f,str) else f.get('fieldname')
                  if name==n: return f
              raise KeyError(f'{d["name"]}.{n}')
          def srcdt(n): return dt(src,n)
          def replace_dt(n,obj):
              src['doctypes']=[x for x in src['doctypes'] if x['name']!=n]
              src['doctypes'].append(obj)
          def upsert_field(target,obj,after=None):
              name=obj.split(':',1)[0].strip() if isinstance(obj,str) else obj['fieldname']
              fields=target.setdefault('fields',[])
              fields[:]=[f for f in fields if (f.split(':',1)[0].strip() if isinstance(f,str) else f.get('fieldname'))!=name]
              if after:
                  for i,f in enumerate(fields):
                      fn=f.split(':',1)[0].strip() if isinstance(f,str) else f.get('fieldname')
                      if fn==after:
                          fields.insert(i+1,obj); return
              fields.append(obj)
          # Whole master/transaction definitions introduced intentionally in the cited commits.
          for n in ['Tỉnh Thành','Phường Xã','Địa chỉ giao lắp','Tài khoản ngân hàng']:
              replace_dt(n,dt(A,n))
          for n in ['Credit Note','Credit Note Item','Stock Return']:
              replace_dt(n,dt(B,n))
          replace_dt('Item Color Scope',dt(COLOR,'Item Color Scope'))
          # Customer/address contract from a71725a; retire the stale single address field.
          customer=srcdt('Customer')
          customer['fields']=[f for f in customer['fields'] if (f.split(':',1)[0].strip() if isinstance(f,str) else f.get('fieldname'))!='address']
          anchor='email'
          for n in ['install_province','install_ward','install_address_line1','shipping_note']:
              upsert_field(customer,fld(dt(A,'Customer'),n),anchor); anchor=n
          # Commercial masters/doc fields intentionally added by a71725a.
          upsert_field(srcdt('Price List'),fld(dt(A,'Price List'),'customer_group'),'price_list_name')
          for n,anchor in [
              ('bank_account','payment_method'),('contact_person','customer_group'),('phone','contact_person'),
              ('install_province','phone'),('install_ward','install_province'),('shipping_note','install_address')]:
              upsert_field(srcdt('Sales Order'),fld(dt(A,'Sales Order'),n),anchor)
          upsert_field(srcdt('Sales Order Item'),fld(dt(A,'Sales Order Item'),'discount_percentage'),'rate')
          # Later canonical source contracts.
          for n in ['theoretical_kg_per_m','scrap_threshold_m']:
              upsert_field(srcdt('Material Specification'),fld(dt(M,'Material Specification'),n))
          for n in ['geometry_profile','geometry_rules']:
              upsert_field(srcdt('Cutting Policy'),fld(dt(G,'Cutting Policy'),n))
          upsert_field(srcdt('Cut Order Item'),fld(dt(C,'Cut Order Item'),'source_batch_no'))
          # Item became catalogue-read-only for Chủ xưởng in the sales workflow convergence.
          srcdt('Item').setdefault('permissions',{})['Chủ xưởng']=dt(A,'Item')['permissions']['Chủ xưởng']
          # Preserve sales-navigation contracts from the O2C closure commit.
          q=srcdt('Quotation'); q['inbox']=dt(B,'Quotation').get('inbox',False); q.pop('menu',None)
          srcdt('Sales Invoice').pop('menu',None)
          action=next(x for x in B.get('actions',[]) if x.get('name')=='don-ban-thanh-hoa-don')
          src['actions']=[x for x in src.get('actions',[]) if x.get('name')!='don-ban-thanh-hoa-don']+[action]
          for action_name in ['bao-gia-thanh-don','don-ban-thanh-phieu-xuat']:
              for x in src.get('actions',[]):
                  if x.get('name')==action_name: x.pop('menu',None)
          validator=next(x for x in B.get('validators',[]) if x.get('doctype')=='Stock Return')
          src['validators']=[x for x in src.get('validators',[]) if x.get('doctype')!='Stock Return']+[validator]
          # Issue #941 source fixture, backed by migration 0128 + source docs.
          name='Cửa tấm liền Úc — công thức chuẩn'
          src['fixtures']=[x for x in src.get('fixtures',[]) if not (x.get('type')=='Cutting Policy' and x.get('name')==name)]
          anchor=next(i for i,x in enumerate(src['fixtures']) if x.get('type')=='Cutting Policy' and x.get('name')=='Cửa Úc — công thức chuẩn')
          src['fixtures'].insert(anchor+1,{'type':'Cutting Policy','name':name,'data':{
              'policy_name':name,'door_type':'Cửa tấm liền Úc','dealer_width_basis':'Phủ bì ray','retail_width_basis':'Phủ bì ray',
              'dealer_cut_deduction_m':0.03,'retail_cut_deduction_m':0.03,'dealer_split_sales_basis':'Phủ bì ray',
              'dealer_full_sales_basis':'Phủ bì ray','retail_sales_basis':'Phủ bì ray','purchase_formula':'Kg thực tế',
              'note':'Bán theo Cao PB × PB ray. Chia lá tấm liền: (Cao PB − 0,13) ÷ 0,068.',
              'leaf_height_deduction_m':0.13,'leaf_rounding':'Làm tròn xuống','leaf_formula':'Kiểu tấm liền Úc',
              'leaf_divisor_source':'Hằng số của chính sách','leaf_divisor_const':0.068
          }})
          # Lossless schema-key convergence for Item Color fixtures.
          renamed=0
          for x in src.get('fixtures',[]):
              if x.get('type')=='Item Color' and isinstance(x.get('data'),dict) and 'finish' in x['data']:
                  if 'surface_finish' in x['data'] and x['data']['surface_finish']!=x['data']['finish']:
                      raise SystemExit(f'conflicting finish/surface_finish for {x.get("name")}')
                  x['data']['surface_finish']=x['data'].pop('finish'); renamed+=1
          print('renamed Item Color finish keys:',renamed)
          open(SRC,'w',encoding='utf-8').write(json.dumps(src,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Patch generator convergence boundary
        run: |
          python <<'PY'
          p='server/scripts/build-alumdoor-v2-brief.mjs'
          s=open(p,encoding='utf-8').read()
          old='const brief = JSON.parse(readFileSync(SRC, "utf8"));'
          new='const sourceBrief = JSON.parse(readFileSync(SRC, "utf8"));\nconst brief = structuredClone(sourceBrief);'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('sourceBrief bootstrap pattern drift')
          old='const canonicalAluminumProfile = fixture("Measurement Profile", "Nhôm cây/lá").data;'
          new='const canonicalAluminumProfile = { ...fixture("Measurement Profile", "Nhôm cây/lá").data };'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('canonicalAluminumProfile pattern drift')
          marker='const childPresentation = applyAlumdoorChildPresentation(brief);'
          if marker not in s: raise SystemExit('child presentation marker missing')
          block=r'''
// ── SOURCE → GENERATED REPRODUCIBILITY CONVERGENCE ──
// These contracts were introduced directly in alumdoor-v2.json by historical O2C/master
// commits. They now live in alumdoor.json; this final boundary prevents later V2 transforms
// from silently dropping them again. Deprecated Sales Option / Sales Package fields were
// removed by 46cff213 and are forbidden from regenerated metadata.
{
  const sourceDoctype = (name) => {
    const value = sourceBrief.doctypes.find((entry) => entry.name === name);
    if (!value) throw new Error(`Nguồn thiếu doctype ${name}`);
    return value;
  };
  const replaceFromSource = (name) => {
    const index = brief.doctypes.findIndex((entry) => entry.name === name);
    const value = structuredClone(sourceDoctype(name));
    if (index >= 0) brief.doctypes[index] = value; else brief.doctypes.push(value);
  };
  const sourceField = (doctypeName, fieldname) => {
    const field = sourceDoctype(doctypeName).fields.find((entry) => nameOf(entry) === fieldname);
    if (!field) throw new Error(`Nguồn thiếu ${doctypeName}.${fieldname}`);
    return structuredClone(field);
  };
  const upsertSourceField = (doctypeName, fieldname) => {
    const target = doctype(doctypeName);
    const value = sourceField(doctypeName, fieldname);
    const index = target.fields.findIndex((entry) => nameOf(entry) === fieldname);
    if (index >= 0) target.fields[index] = value; else target.fields.push(value);
  };
  for (const name of [
    "Tỉnh Thành", "Phường Xã", "Địa chỉ giao lắp", "Tài khoản ngân hàng",
    "Credit Note", "Credit Note Item", "Stock Return", "Item Color Scope",
  ]) replaceFromSource(name);
  for (const fieldname of ["install_province", "install_ward", "install_address_line1", "shipping_note"])
    upsertSourceField("Customer", fieldname);
  dropFields(doctype("Customer"), ["address"]);
  upsertSourceField("Price List", "customer_group");
  for (const fieldname of ["bank_account", "contact_person", "phone", "install_province", "install_ward", "shipping_note"])
    upsertSourceField("Sales Order", fieldname);
  upsertSourceField("Sales Order Item", "discount_percentage");
  for (const fieldname of ["theoretical_kg_per_m", "scrap_threshold_m"])
    upsertSourceField("Material Specification", fieldname);
  for (const fieldname of ["geometry_profile", "geometry_rules"])
    upsertSourceField("Cutting Policy", fieldname);
  upsertSourceField("Cut Order Item", "source_batch_no");
  doctype("Item").permissions["Chủ xưởng"] = sourceDoctype("Item").permissions["Chủ xưởng"];

  const sourceAction = sourceBrief.actions.find((entry) => entry.name === "don-ban-thanh-hoa-don");
  if (!sourceAction) throw new Error("Nguồn thiếu action don-ban-thanh-hoa-don");
  brief.actions = brief.actions.filter((entry) => entry.name !== "don-ban-thanh-hoa-don");
  brief.actions.push(structuredClone(sourceAction));
  for (const actionName of ["bao-gia-thanh-don", "don-ban-thanh-phieu-xuat"])
    delete brief.actions.find((entry) => entry.name === actionName)?.menu;
  const sourceStockReturnValidator = sourceBrief.validators.find((entry) => entry.doctype === "Stock Return");
  if (!sourceStockReturnValidator) throw new Error("Nguồn thiếu validator Stock Return");
  brief.validators = brief.validators.filter((entry) => entry.doctype !== "Stock Return");
  brief.validators.push(structuredClone(sourceStockReturnValidator));

  const quotation = doctype("Quotation");
  quotation.inbox = false;
  delete quotation.menu;
  delete doctype("Sales Invoice").menu;

  // Commercial authority is Item Price/Pricing Rule. Never regenerate retired option/package fields.
  for (const target of brief.doctypes) {
    target.fields = (target.fields ?? []).filter((entry) => !["sales_option", "sales_mode"].includes(nameOf(entry)));
    if (Array.isArray(target.search)) target.search = target.search.filter((entry) => entry !== "sales_option" && entry !== "sales_mode");
  }
  const itemPrice = doctype("Item Price");
  const priceVariantIndex = itemPrice.fields.findIndex((entry) => nameOf(entry) === "price_variant");
  if (priceVariantIndex >= 0 && typeof itemPrice.fields[priceVariantIndex] === "object") {
    const value = { ...itemPrice.fields[priceVariantIndex] };
    if (String(value.fetch_from ?? "").startsWith("sales_option.")) delete value.fetch_from;
    itemPrice.fields[priceVariantIndex] = value;
  }
  const installAddressIndex = doctype("Sales Order").fields.findIndex((entry) => nameOf(entry) === "install_address");
  if (installAddressIndex >= 0 && typeof doctype("Sales Order").fields[installAddressIndex] === "object") {
    const value = { ...doctype("Sales Order").fields[installAddressIndex] };
    if (value.fetch_from === "customer.address") delete value.fetch_from;
    doctype("Sales Order").fields[installAddressIndex] = value;
  }
  if (brief.doctypes.some((entry) => ["Sales Option", "Sales Package"].includes(entry.name)))
    throw new Error("Generator resurrected deprecated Sales Option/Sales Package DocType");
  note("REPRO · source-authoritative O2C/master contracts restored; Sales Option/Sales Package fields forbidden");
}

'''
          if 'SOURCE → GENERATED REPRODUCIBILITY CONVERGENCE' not in s:
              s=s.replace(marker,block+marker,1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Add focused reproducibility regression
        run: |
          cat > server/tests/alumdoor-v2-generator-reproducibility.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { resolve } from "node:path";

          const ROOT = resolve(import.meta.dirname, "..", "..");
          const SOURCE = resolve(ROOT, "server/briefs/alumdoor.json");
          const GENERATED = resolve(ROOT, "server/briefs/alumdoor-v2.json");
          const GENERATOR = resolve(ROOT, "server/scripts/build-alumdoor-v2-brief.mjs");
          const nameOf = (field) => typeof field === "string" ? field.split(":", 1)[0].trim() : field.fieldname;
          const doc = (brief, name) => brief.doctypes.find((entry) => entry.name === name);
          const field = (brief, doctype, fieldname) => doc(brief, doctype)?.fields?.find((entry) => nameOf(entry) === fieldname);

          test("alumdoor-v2 generator is idempotent and preserves current runtime contracts", () => {
            const before = readFileSync(GENERATED, "utf8");
            execFileSync(process.execPath, [GENERATOR], { cwd: ROOT, stdio: "pipe" });
            const after = readFileSync(GENERATED, "utf8");
            assert.equal(after, before, "official generator must be a zero-diff second pass");
            const generated = JSON.parse(after);
            for (const required of ["Tỉnh Thành", "Phường Xã", "Địa chỉ giao lắp", "Tài khoản ngân hàng", "Credit Note", "Credit Note Item"])
              assert.ok(doc(generated, required), `missing regenerated ${required}`);
            for (const required of [
              ["Customer", "install_province"], ["Customer", "install_ward"], ["Customer", "install_address_line1"],
              ["Price List", "customer_group"], ["Sales Order Item", "discount_percentage"],
              ["Sales Order", "bank_account"], ["Sales Order", "contact_person"], ["Sales Order", "phone"],
              ["Sales Order", "install_province"], ["Sales Order", "install_ward"], ["Sales Order", "shipping_note"],
              ["Cutting Policy", "geometry_profile"], ["Cutting Policy", "geometry_rules"], ["Cut Order Item", "source_batch_no"],
            ]) assert.ok(field(generated, ...required), `missing regenerated ${required.join(".")}`);
            for (const dt of generated.doctypes) {
              assert.ok(!["Sales Option", "Sales Package"].includes(dt.name), `deprecated doctype ${dt.name}`);
              for (const f of dt.fields ?? []) assert.ok(!["sales_option", "sales_mode"].includes(nameOf(f)), `deprecated ${dt.name}.${nameOf(f)}`);
            }
            const stockReturn = doc(generated, "Stock Return");
            for (const required of ["party_doctype", "party", "return_against_doctype", "return_against"])
              assert.ok(stockReturn.fields.some((entry) => nameOf(entry) === required), `Stock Return missing ${required}`);
            assert.ok(generated.actions.some((entry) => entry.name === "don-ban-thanh-hoa-don"), "missing Sales Order → Sales Invoice action");
            assert.ok(generated.validators.some((entry) => entry.doctype === "Stock Return"), "missing Stock Return validator");
          });

          test("alumdoor source owns tấm liền Úc and canonical Item Color keys", () => {
            const source = JSON.parse(readFileSync(SOURCE, "utf8"));
            const policy = source.fixtures.find((entry) => entry.type === "Cutting Policy" && entry.name === "Cửa tấm liền Úc — công thức chuẩn");
            assert.ok(policy);
            assert.equal(policy.data.leaf_formula, "Kiểu tấm liền Úc");
            assert.equal(policy.data.leaf_divisor_const, 0.068);
            for (const color of source.fixtures.filter((entry) => entry.type === "Item Color")) {
              assert.ok(!Object.hasOwn(color.data, "finish"), `${color.name} still uses legacy finish key`);
              assert.ok(Object.hasOwn(color.data, "surface_finish"), `${color.name} missing surface_finish`);
            }
          });
          TEST

      - name: Official generator first pass
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cp server/briefs/alumdoor-v2.json /tmp/alumdoor-v2-first.json
          git diff --numstat -- server/briefs/alumdoor-v2.json

      - name: Critical semantic assertions
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const b=JSON.parse(fs.readFileSync('server/briefs/alumdoor-v2.json','utf8'));
          const nameOf=f=>typeof f==='string'?f.split(':')[0].trim():f.fieldname;
          const d=n=>{const x=b.doctypes.find(v=>v.name===n); if(!x) throw new Error('missing doctype '+n); return x};
          const has=(dt,f)=>d(dt).fields.some(x=>nameOf(x)===f);
          for(const n of ['Tỉnh Thành','Phường Xã','Địa chỉ giao lắp','Tài khoản ngân hàng','Credit Note','Credit Note Item','Stock Return']) d(n);
          for(const [dt,f] of [['Sales Order Item','discount_percentage'],['Cutting Policy','geometry_profile'],['Cutting Policy','geometry_rules'],['Cut Order Item','source_batch_no'],['Price List','customer_group']]) if(!has(dt,f)) throw new Error(`missing ${dt}.${f}`);
          for(const x of b.doctypes) for(const f of x.fields||[]) if(['sales_option','sales_mode'].includes(nameOf(f))) throw new Error(`deprecated ${x.name}.${nameOf(f)}`);
          if(b.doctypes.some(x=>['Sales Option','Sales Package'].includes(x.name))) throw new Error('deprecated sales doctype resurrected');
          const spec=d('Material Specification');
          for(const f of ['theoretical_kg_per_m','scrap_threshold_m']) { const x=spec.fields.find(v=>nameOf(v)===f); if(!String(x?.depends_on||'').includes('Vật tư tuyến tính')) throw new Error(`${f} lost Vật tư tuyến tính`); }
          console.log('critical semantic assertions PASS');
          NODE

      - name: Official generator second pass zero diff
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cmp -s /tmp/alumdoor-v2-first.json server/briefs/alumdoor-v2.json
          echo 'second-pass generator: ZERO DIFF'

      - name: Focused reproducibility tests
        run: node --test server/tests/alumdoor-v2-generator-reproducibility.test.mjs
      - name: Brief check
        run: pnpm --dir server run brief:check
      - name: Server build
        run: pnpm run server:build
      - name: Diff hygiene
        run: git diff --check

      - name: Commit product source and remove temporary workflows
        run: |
          rm -f .github/workflows/issue-942-provenance-probe.yml \
                .github/workflows/issue-942-semantic-probe.yml \
                .github/workflows/issue-942-remaining-provenance.yml \
                .github/workflows/issue-942-validator-detail.yml \
                .github/workflows/issue-942-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/briefs/alumdoor.json server/briefs/alumdoor-v2.json server/scripts/build-alumdoor-v2-brief.mjs server/tests/alumdoor-v2-generator-reproducibility.test.mjs .github/workflows
          git diff --cached --check
          git commit -m "fix(alumdoor): make V2 brief reproducible [issue-942-applied]"
          git push origin HEAD:agent/alumdoor-v2-reproducible
