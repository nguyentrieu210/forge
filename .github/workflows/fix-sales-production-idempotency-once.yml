name: Fix Sales Production Idempotency Once

on:
  push:
    branches:
      - feat/sales-order-production-flow-final-20260801
    paths:
      - .github/workflows/fix-sales-production-idempotency-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-order-production-flow-final-20260801
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Patch fail-closed probes and regressions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source_path = Path('server/apps-src/alumdoor-worker/src/sales-production.ts')
          source = source_path.read_text()
          replacements = [
              (
                  '''  ).catch(() => []);\n  return text(rows.find((row) => row.name)?.name);\n}\n\nasync function existingWorkOrder''',
                  '''  );\n  return text(rows.find((row) => row.name)?.name);\n}\n\nasync function existingWorkOrder''',
              ),
              (
                  '''  ).catch(() => []);\n  return text(rows[0]?.name);\n}\n\nexport async function createSalesProduction''',
                  '''  );\n  return text(rows[0]?.name);\n}\n\nexport async function createSalesProduction''',
              ),
              (
                  '''    [["cut_order", "=", cutOrder]],\n    200,\n  ).catch(() => []);\n  if (direction === -1) {''',
                  '''    [["cut_order", "=", cutOrder]],\n    200,\n  );\n  if (direction === -1) {''',
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'missing expected source block: {old[:80]!r}')
              source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('server/tests/sales-production-flow.test.mjs')
          tests = test_path.read_text()
          old_import = '''  buildSalesProductionLines,\n  calculateLeafPlan,\n} from "../dist/apps-src/alumdoor-worker/src/sales-production.js";'''
          new_import = '''  buildSalesProductionLines,\n  calculateLeafPlan,\n  createSalesProduction,\n  syncPaintJobsFromCut,\n} from "../dist/apps-src/alumdoor-worker/src/sales-production.js";'''
          if old_import not in tests:
              raise SystemExit('missing sales-production import block')
          tests = tests.replace(old_import, new_import, 1)

          marker = 'test("idempotency probes fail closed when platform list reads fail"'
          if marker not in tests:
              tests += r'''

function dataResponse(data, status = 200) {
  return new Response(JSON.stringify({ data }), {
    status,
    headers: { "content-type": "application/json" },
  });
}

function salesProductionCall({ requestListStatus = 200, workOrderListStatus = 200 } = {}) {
  const writes = [];
  const call = async (path, init = {}) => {
    const method = init.method ?? "GET";
    if (method !== "GET") {
      writes.push({ path, method });
      return dataResponse({ name: "UNEXPECTED-WRITE" }, 201);
    }
    if (path.startsWith("resource/Sales%20Order/")) return dataResponse({
      name: "DH-IDEMPOTENCY",
      docstatus: 1,
      customer_group: "Đại lý",
      company: "ALU",
      delivery_date: "2026-08-10",
      items: [{
        row_id: "ROW-IDEMPOTENCY",
        item_code: "CUA-DUC-IDEMPOTENCY",
        width_m: 4,
        height_m: 3,
        set_count: 1,
        sales_mode: "Trọn bộ",
        leaf_divisor_m: 0.055,
        color: "GHI",
      }],
    });
    if (path.startsWith("resource/Item/")) return dataResponse({
      item_code: "CUA-DUC-IDEMPOTENCY",
      item_group: "Cửa CN Đức",
      door_type: "Cửa Đức",
      inventory_mode: "Thành phẩm theo m2",
      stock_uom: "Bộ",
      min_area_sqm: 0,
    });
    if (path.startsWith("resource/Cutting%20Policy?")) return dataResponse([
      fixturePolicy("Cửa Đức — công thức chuẩn"),
    ]);
    if (path.startsWith("resource/Production%20Standard?")) return dataResponse([]);
    if (path.startsWith("resource/Bill%20of%20Materials?")) return dataResponse([{
      name: "BOM-DUC-IDEMPOTENCY",
      item: "CUA-DUC-IDEMPOTENCY",
      color: "GHI",
      docstatus: 1,
      bom_status: "Active",
      revision: 1,
    }]);
    if (path.startsWith("resource/Production%20Request?")) {
      if (requestListStatus !== 200) return dataResponse([], requestListStatus);
      return dataResponse([{ name: "PR-IDEMPOTENCY" }]);
    }
    if (path.startsWith("resource/Production%20Request/")) return dataResponse({
      name: "PR-IDEMPOTENCY",
      modified: "2026-08-01T00:00:00.000Z",
    });
    if (path.startsWith("resource/Work%20Order?")) {
      if (workOrderListStatus !== 200) return dataResponse([], workOrderListStatus);
      return dataResponse([{ name: "WO-IDEMPOTENCY" }]);
    }
    throw new Error(`unexpected platform path: ${path}`);
  };
  return { call, writes };
}

test("idempotency probes fail closed when platform list reads fail", async () => {
  const args = {
    sales_order: "DH-IDEMPOTENCY",
    source_warehouse: "K36",
    target_warehouse: "K36-TP",
  };

  const requestProbe = salesProductionCall({ requestListStatus: 503 });
  const requestResponse = await createSalesProduction(requestProbe.call, args);
  assert.equal(requestResponse.status, 422);
  assert.match((await requestResponse.json()).message, /Không đọc được danh sách Production Request/);
  assert.equal(requestProbe.writes.length, 0);

  const workOrderProbe = salesProductionCall({ workOrderListStatus: 503 });
  const workOrderResponse = await createSalesProduction(workOrderProbe.call, args);
  assert.equal(workOrderResponse.status, 422);
  assert.match((await workOrderResponse.json()).message, /Không đọc được danh sách Work Order/);
  assert.equal(workOrderProbe.writes.length, 0);
});

test("paint-job idempotency probe fails closed when the list read fails", async () => {
  const writes = [];
  const call = async (path, init = {}) => {
    const method = init.method ?? "GET";
    if (method !== "GET") {
      writes.push({ path, method });
      return dataResponse({ name: "UNEXPECTED-WRITE" }, 201);
    }
    if (path.startsWith("resource/Cut%20Order/")) return dataResponse({
      name: "CUT-IDEMPOTENCY",
      work_order: "WO-IDEMPOTENCY",
      items: [],
    });
    if (path.startsWith("resource/Paint%20Job?")) return dataResponse([], 503);
    throw new Error(`unexpected platform path: ${path}`);
  };

  await assert.rejects(
    syncPaintJobsFromCut(call, "CUT-IDEMPOTENCY", 1),
    /Không đọc được danh sách Paint Job/,
  );
  assert.equal(writes.length, 0);
});
'''
          test_path.write_text(tests)
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build server and run focused regression
        run: |
          pnpm --filter cloudforge run build
          node --test server/tests/sales-production-flow.test.mjs
      - name: Commit clean patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-sales-production-idempotency-once.yml
          git add server/apps-src/alumdoor-worker/src/sales-production.ts server/tests/sales-production-flow.test.mjs
          git commit -m "fix(sales): fail closed on production idempotency probes"
          git push origin HEAD:feat/sales-order-production-flow-final-20260801
