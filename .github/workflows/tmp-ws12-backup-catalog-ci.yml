name: Temp WS12 Backup Catalog CI

on:
  push:
    branches:
      - fix/ws12-backup-catalog-scope-20260803

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - id: build
        continue-on-error: true
        run: pnpm --filter cloudforge run build
      - id: tests
        continue-on-error: true
        run: node --test server/tests/tenant-backup-verification.test.mjs
      - id: release
        continue-on-error: true
        run: pnpm --filter cloudforge run verify:release-safety
      - name: Report to purchase funding PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          SHA: ${{ github.sha }}
        run: gh pr comment 383 --body "WS12_BACKUP_CATALOG_CI sha=$SHA build=$BUILD tests=$TESTS release_safety=$RELEASE"
      - name: Fail when validation failed
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          RELEASE: ${{ steps.release.outcome }}
        run: |
          test "$BUILD" = success
          test "$TESTS" = success
          test "$RELEASE" = success
