name: Sentrux Kho generated boundary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-generated-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-10k-20260815

      - name: Detect whether boundary is still needed
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -- client/apps/kho/dist-mobile client/apps/kho/dist-attendance-mobile | grep -q .; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Kho generated bundles are still tracked"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Kho generated bundles are already outside the Git source graph"
          fi

      - name: Install Sentrux
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Baseline quality and structure
        if: steps.detect.outputs.needed == 'true'
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before-score.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before-score.txt | tail -1 | grep -Eo '[0-9]+')
          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          max_cc = 25
          EOF
          sentrux check . 2>&1 | tee /tmp/before-structure.txt || true
          GODS=$(grep -Eo '[0-9]+ god file\(s\) found' /tmp/before-structure.txt | tail -1 | grep -Eo '^[0-9]+' || true)
          GODS=${GODS:-0}
          echo "quality=$QUALITY" >> "$GITHUB_OUTPUT"
          echo "gods=$GODS" >> "$GITHUB_OUTPUT"
          echo "BEFORE quality=$QUALITY gods=$GODS"

      - name: Remove generated Kho bundles from Git source graph
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > client/apps/kho/.gitignore <<'EOF'
          node_modules
          dist
          dist-mobile
          dist-attendance-mobile
          *.log
          EOF
          git rm -r client/apps/kho/dist-mobile client/apps/kho/dist-attendance-mobile
          test ! -e client/apps/kho/dist-mobile
          test ! -e client/apps/kho/dist-attendance-mobile

      - name: Install dependencies
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Rebuild all client artifacts from source
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter 'runtime...' run build
          pnpm --filter 'kho...' run build
          test -s client/apps/runtime/dist/index.html
          test -s client/apps/kho/dist-mobile/index.html
          test -s client/apps/kho/dist-mobile/manifest.webmanifest
          test -s client/apps/kho/dist-mobile/warehouse-sw.js
          test -s client/apps/kho/dist-attendance-mobile/index.html
          test -s client/apps/kho/dist-attendance-mobile/manifest.webmanifest
          test -s client/apps/kho/dist-attendance-mobile/attendance-sw.js

      - name: Stage and verify exact release bundle
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/stage-client-bundle.mjs
          node server/scripts/stage-client-bundle.mjs --check
          test -s server/apps/gateway-worker/public/mobile/warehouse/index.html
          test -s server/apps/gateway-worker/public/mobile/attendance/index.html

      - name: Full client typecheck
        if: steps.detect.outputs.needed == 'true'
        run: pnpm run client:typecheck

      - name: Server typecheck
        if: steps.detect.outputs.needed == 'true'
        run: pnpm run server:typecheck

      - name: Sentrux gate
        if: steps.detect.outputs.needed == 'true'
        run: sentrux gate .

      - name: Require score improvement and zero cycles
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after-score.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after-score.txt | tail -1 | grep -Eo '[0-9]+')
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          max_cc = 25
          EOF
          sentrux check . 2>&1 | tee /tmp/after-structure.txt || true
          GODS=$(grep -Eo '[0-9]+ god file\(s\) found' /tmp/after-structure.txt | tail -1 | grep -Eo '^[0-9]+' || true)
          GODS=${GODS:-0}
          BEFORE_Q='${{ steps.before.outputs.quality }}'
          echo "AFTER quality=$QUALITY gods=$GODS"
          test "$QUALITY" -gt "$BEFORE_Q"
          ! grep -q 'Found [1-9][0-9]* circular dependencies' /tmp/after-structure.txt
          ! grep -q 'client/apps/kho/dist-attendance-mobile' /tmp/after-structure.txt
          ! grep -q 'client/apps/kho/dist-mobile' /tmp/after-structure.txt

      - name: Commit validated generated-artifact boundary
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sentrux
          git config user.name "sentrux-refactor-bot"
          git config user.email "sentrux-refactor-bot@users.noreply.github.com"
          git add -- client/apps/kho/.gitignore
          git add -u :/
          git status --short
          git diff --cached --stat
          git commit --no-verify -m "chore(kho): keep generated mobile bundles out of source graph [skip sentrux]"
          git push origin HEAD:agent/sentrux-10k-20260815
