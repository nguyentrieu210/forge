name: Sentrux workspace vertical boundary apply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect workspace vertical boundary
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'AlumdoorWorkspaceBoundary.js' client/packages/views/src/app/DoctypeWorkspace.tsx; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Report disabled apply state
        if: steps.detect.outputs.needed == 'true'
        run: |
          echo 'Automatic workspace-boundary mutation is disabled. Use a reviewed source commit instead.'
