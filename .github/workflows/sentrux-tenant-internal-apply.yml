name: Sentrux tenant internal route apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-10k-20260815

      - name: Detect whether split is already applied
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'async function routeInternalRequest(' server/apps/tenant-worker/src/index-core-base.ts; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Tenant internal route split already present'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Sentrux
        if: steps.detect.outputs.needed == 'true'
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Baseline score
        if: steps.detect.outputs.needed == 'true'
        id: before
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt
          Q=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          echo "quality=$Q" >> "$GITHUB_OUTPUT"
          echo "BEFORE=$Q"

      - name: Split internal routes from tenant fetch
        if: steps.detect.outputs.needed == 'true'
        run: |
          set -euo pipefail
          python3 .github/sentrux-tenant-internal-transform
          git diff --check
          git diff --stat -- server/apps/tenant-worker/src/index-core-base.ts

      - name: Install dependencies
        if: steps.detect.outputs.needed == 'true'
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Server typecheck
        if: steps.detect.outputs.needed == 'true'
        run: pnpm run server:typecheck

      - name: Require Sentrux improvement
        if: steps.detect.outputs.needed == 'true'
        env:
          BEFORE: ${{ steps.before.outputs.quality }}
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after.txt
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          EOF
          sentrux check . 2>&1 | tee /tmp/structure.txt
          rm -rf .sentrux
          echo "TENANT_INTERNAL_SCORE $BEFORE -> $AFTER delta=$((AFTER-BEFORE))"
          grep -E 'tenant-worker/src/index-core-base.ts:(fetch|routeInternalRequest)|circular dependencies' /tmp/structure.txt || true
          test "$AFTER" -gt "$BEFORE"

      - name: Commit validated source improvement
        if: steps.detect.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'sentrux-refactor-bot'
          git config user.email 'sentrux-refactor-bot@users.noreply.github.com'
          git add -- server/apps/tenant-worker/src/index-core-base.ts
          git diff --cached --check
          git diff --cached --stat
          git commit --no-verify -m 'refactor(tenant): split internal routes from fetch [skip sentrux]'
          git push origin HEAD:agent/sentrux-10k-20260815
