name: Sentrux tenant wrapper refinement apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.head_ref, 'agent/sentrux-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect wrapper refinement
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'from "./operational-router.js"' server/apps/tenant-worker/src/index-base.ts; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Sentrux
        if: steps.detect.outputs.needed == 'true'
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Baseline score
        if: steps.detect.outputs.needed == 'true'
        id: before
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt
          Q=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          echo "quality=$Q" >> "$GITHUB_OUTPUT"

      - name: Refine wrapper routing
        if: steps.detect.outputs.needed == 'true'
        run: |
          set -euo pipefail
          python3 .github/sentrux-tenant-wrapper-transform
          grep -q 'from "./operational-router.js"' server/apps/tenant-worker/src/index-base.ts
          grep -q 'from "./account-security-routes.js"' server/apps/tenant-worker/src/index-base.ts
          test -f server/apps/tenant-worker/src/operational-router.ts
          test -f server/apps/tenant-worker/src/account-security-routes.ts
          git diff --check
          git diff --stat -- server/apps/tenant-worker/src/index-base.ts server/apps/tenant-worker/src/operational-router.ts server/apps/tenant-worker/src/account-security-routes.ts

      - name: Install dependencies
        if: steps.detect.outputs.needed == 'true'
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Server typecheck
        if: steps.detect.outputs.needed == 'true'
        run: pnpm run server:typecheck

      - name: Require score, cycle, fan-out and complexity improvement
        if: steps.detect.outputs.needed == 'true'
        env:
          BEFORE: ${{ steps.before.outputs.quality }}
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after.txt
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          max_cc = 25
          EOF
          set +e
          sentrux check . 2>&1 | tee /tmp/structure.txt
          set -e
          rm -rf .sentrux
          echo "TENANT_WRAPPER_REFINEMENT_SCORE $BEFORE -> $AFTER delta=$((AFTER-BEFORE))"
          test "$AFTER" -ge "$BEFORE"
          if grep -q 'server/apps/tenant-worker/src/index-base.ts (fan-out=' /tmp/structure.txt; then exit 1; fi
          if grep -q 'server/apps/tenant-worker/src/index-base.ts:fetch (cc=' /tmp/structure.txt; then exit 1; fi
          if grep -Eq 'server/apps/tenant-worker/src/(operational-router|account-security-routes).ts \(fan-out=' /tmp/structure.txt; then exit 1; fi
          if grep -Eq 'server/apps/tenant-worker/src/(operational-router|account-security-routes).ts:.* \(cc=' /tmp/structure.txt; then exit 1; fi
          if grep -q 'Found [1-9][0-9]* circular dependencies' /tmp/structure.txt; then exit 1; fi

      - name: Commit validated source improvement
        if: steps.detect.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'sentrux-refactor-bot'
          git config user.email 'sentrux-refactor-bot@users.noreply.github.com'
          git add -- server/apps/tenant-worker/src/index-base.ts server/apps/tenant-worker/src/operational-router.ts server/apps/tenant-worker/src/account-security-routes.ts
          git diff --cached --check
          git diff --cached --stat
          git commit --no-verify -m 'refactor(tenant): refine wrapper routing boundaries [skip sentrux]'
          git push origin HEAD:${{ github.head_ref }}
