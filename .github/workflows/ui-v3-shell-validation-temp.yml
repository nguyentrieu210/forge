name: UI V3 Shell Validation Temp

on:
  push:
    branches:
      - ui/v3-02-shell-exec-20260804

permissions:
  contents: read

concurrency:
  group: ui-v3-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Shell typecheck
        run: pnpm --filter @metaforge/shell run typecheck
      - name: Client typecheck
        run: pnpm run client:typecheck
      - name: Client tests
        run: pnpm run client:test
      - name: Client build
        run: pnpm run client:build
