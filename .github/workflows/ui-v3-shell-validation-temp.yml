name: UI V3 Shell Validation Temp

on:
  pull_request:
    branches:
      - main
    paths:
      - "client/packages/shell/**"
      - ".github/workflows/ui-v3-shell-validation-temp.yml"

permissions:
  contents: read

concurrency:
  group: ui-v3-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shell:
    if: github.head_ref == 'ui/v3-02-shell-exec-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Shell typecheck
        run: pnpm --filter @metaforge/shell run typecheck
      - name: Full client typecheck baseline
        continue-on-error: true
        run: pnpm run client:typecheck
      - name: Client lint and shell mobile checks
        run: pnpm --filter metaforge run lint
      - name: Client selfchecks
        run: pnpm --filter metaforge run test
      - name: Shell build
        run: pnpm --filter @metaforge/shell run build
