name: Deploy UI Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_FORGE_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build Gateway UI
        run: |
          pnpm --filter runtime... run build
          pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json
          pnpm --dir client/apps/kho exec vite build --config vite.mobile.config.ts
      - name: Stage UI bundle
        run: node server/scripts/stage-client-bundle.mjs
      - name: Deploy Gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc
      - name: Smoke
        run: |
          curl --fail --silent --show-error https://alu.kairo.vn/health >/dev/null
          curl --fail --silent --show-error "https://alu.kairo.vn/release.json?sha=$TARGET_SHA" -o "$RUNNER_TEMP/release.json"
          node - "$RUNNER_TEMP/release.json" <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (release.releaseSha !== process.env.TARGET_SHA) throw new Error(`release mismatch: ${release.releaseSha}`);
          if (!release.bundleHash) throw new Error('missing bundleHash');
          console.log(`PRODUCTION_RELEASE_OK sha=${release.releaseSha}`);
          NODE
