name: Alumdoor Postmerge Actions Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: 9fc90544c46436d90fbf2c245764ef9340f890a3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clean stale queue and dispatch exact-main Bootstrap
        shell: bash
        run: |
          set -euo pipefail
          root='https://api.github.com/repos/nguyentrieu210/forge/actions'
          workflows="$root/workflows"
          api='https://api.github.com/repos/nguyentrieu210/forge'
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          cancel_run() {
            local id="$1" reason="$2"
            echo "CANCEL_RUN id=$id reason=$reason"
            curl -fsSL -X POST "${headers[@]}" "$root/runs/$id/cancel" -o /dev/null || true
          }

          echo '=== CLEAN TEMPORARY OBSERVERS ==='
          observers="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-postmerge-local-acceptance-observer.yml/runs?per_page=50")"
          while read -r id; do [ -z "$id" ] || cancel_run "$id" 'temporary-observer'; done < <(jq -r '.workflow_runs[] | select(.status!="completed") | .id' <<<"$observers")

          echo '=== CLEAN INVALID FOLLOWERS FROM CANCELLED 9fc BOOTSTRAP ==='
          for wf in alumdoor-pricing-local-import.yml alumdoor-reason-master-local-import.yml; do
            data="$(curl -fsSL "${headers[@]}" "$workflows/$wf/runs?per_page=50")"
            while read -r id; do [ -z "$id" ] || cancel_run "$id" "invalid-follower-$wf"; done < <(jq -r --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha and .status!="completed") | .id' <<<"$data")
          done

          echo '=== CLEAN STALE 529c MUTATION RUNS ==='
          cancel_run 32076926299 'stale-bootstrap-529c'
          cancel_run 32076926297 'stale-bom-finish-529c'

          main_sha="$(curl -fsSL "${headers[@]}" "$api/commits/main" | jq -r .sha)"
          echo "MAIN_SHA=$main_sha"
          if [ "$main_sha" != "$EXPECTED_SHA" ]; then
            echo "REFUSE_DISPATCH main_drift expected=$EXPECTED_SHA actual=$main_sha"
            exit 9
          fi

          echo '=== DISPATCH EXACT MAIN BOOTSTRAP ==='
          curl -fsSL -X POST "${headers[@]}" \
            -H 'Content-Type: application/json' \
            "$workflows/bootstrap-alumdoor-local.yml/dispatches" \
            -d '{"ref":"main"}' -o /dev/null
          echo "BOOTSTRAP_DISPATCH=PASS sha=$EXPECTED_SHA"

          Start=''
          echo 'ALUMDOOR_EXACT_MAIN_BOOTSTRAP_DISPATCH_PASS'
