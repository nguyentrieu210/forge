name: Alumdoor Postmerge Actions Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: 37b88c760d781a4f8642de4006ae015bcde25ad5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover or dispatch exact-main Bootstrap
        shell: bash
        run: |
          set -euo pipefail
          root='https://api.github.com/repos/nguyentrieu210/forge/actions'
          workflows="$root/workflows"
          api='https://api.github.com/repos/nguyentrieu210/forge'
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          observers="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-postmerge-local-acceptance-observer.yml/runs?per_page=50")"
          while read -r id; do
            [ -z "$id" ] || { echo "CANCEL_TEMP_OBSERVER id=$id"; curl -fsSL -X POST "${headers[@]}" "$root/runs/$id/cancel" -o /dev/null || true; }
          done < <(jq -r '.workflow_runs[] | select(.status!="completed") | .id' <<<"$observers")

          main_sha="$(curl -fsSL "${headers[@]}" "$api/commits/main" | jq -r .sha)"
          echo "MAIN_SHA=$main_sha"
          if [ "$main_sha" != "$EXPECTED_SHA" ]; then
            echo "REFUSE_DISPATCH main_drift expected=$EXPECTED_SHA actual=$main_sha"
            exit 9
          fi

          bootstrap="$(curl -fsSL "${headers[@]}" "$workflows/bootstrap-alumdoor-local.yml/runs?branch=main&per_page=50")"
          echo '=== EXISTING EXACT MAIN BOOTSTRAP ==='
          jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$bootstrap"

          usable="$(jq -r --arg sha "$EXPECTED_SHA" '[.workflow_runs[] | select(.head_sha==$sha and (.status!="completed" or .conclusion=="success"))] | length' <<<"$bootstrap")"
          if [ "$usable" -eq 0 ]; then
            curl -fsSL -X POST "${headers[@]}" -H 'Content-Type: application/json' \
              "$workflows/bootstrap-alumdoor-local.yml/dispatches" -d '{"ref":"main"}' -o /dev/null
            echo "BOOTSTRAP_DISPATCH=PASS sha=$EXPECTED_SHA"
            sleep 3
            bootstrap="$(curl -fsSL "${headers[@]}" "$workflows/bootstrap-alumdoor-local.yml/runs?branch=main&per_page=50")"
          else
            echo "BOOTSTRAP_DISPATCH=SKIP reason=exact-main-run-already-usable count=$usable"
          fi

          echo '=== EXACT MAIN BOOTSTRAP AFTER DECISION ==='
          jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$bootstrap"
          echo '=== ACTIVE MUTATION-RELATED RUNS ==='
          curl -fsSL "${headers[@]}" "$root/runs?status=in_progress&per_page=50" | jq -c '.workflow_runs[] | select(.name|test("Alumdoor|Pricing|Bootstrap|Reason|Purchase|Customer|BOM";"i")) | {id,name,status,event,head_branch,head_sha,created_at}'
          echo '=== QUEUED MUTATION-RELATED RUNS ==='
          curl -fsSL "${headers[@]}" "$root/runs?status=queued&per_page=50" | jq -c '.workflow_runs[] | select(.name|test("Alumdoor|Pricing|Bootstrap|Reason|Purchase|Customer|BOM";"i")) | {id,name,status,event,head_branch,head_sha,created_at}'
          echo 'ALUMDOOR_EXACT_MAIN_BOOTSTRAP_DISCOVERY_PASS'
