name: Alumdoor Postmerge Actions Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deduplicate diagnostics and inspect self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          root='https://api.github.com/repos/nguyentrieu210/forge/actions'
          workflows="$root/workflows"
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          cancel_id() {
            local id="$1" reason="$2"
            echo "CANCEL id=$id reason=$reason"
            curl -fsSL -X POST "${headers[@]}" "$root/runs/$id/cancel" -o /dev/null || true
          }

          observers="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-postmerge-local-acceptance-observer.yml/runs?per_page=50")"
          while read -r id; do [ -z "$id" ] || cancel_id "$id" observer; done < <(jq -r '.workflow_runs[] | select(.status!="completed") | .id' <<<"$observers")

          singular="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-bootstrap-log-diagnostic.yml/runs?per_page=50")"
          while read -r id; do [ -z "$id" ] || cancel_id "$id" duplicate-unredacted-diagnostic; done < <(jq -r '.workflow_runs[] | select(.status!="completed") | .id' <<<"$singular")

          plural="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-bootstrap-log-diagnostics.yml/runs?per_page=50")"
          keep="$(jq -r '[.workflow_runs[] | select(.status!="completed")] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$plural")"
          echo "KEEP_REDACTED_DIAGNOSTIC=$keep"
          while read -r id; do
            [ -z "$id" ] || [ "$id" = "$keep" ] || cancel_id "$id" stale-redacted-diagnostic
          done < <(jq -r '.workflow_runs[] | select(.status!="completed") | .id' <<<"$plural")

          echo "MAIN_SHA=$(curl -fsSL "${headers[@]}" 'https://api.github.com/repos/nguyentrieu210/forge/commits/main' | jq -r .sha)"
          echo '=== RUNNERS ==='
          if runners="$(curl -fsSL "${headers[@]}" "$root/runners?per_page=100" 2>/dev/null)"; then
            jq -c '.runners[] | {id,name,os,status,busy,labels:[.labels[].name]}' <<<"$runners"
          else
            echo 'RUNNER_LIST_UNAVAILABLE'
          fi
          echo '=== ACTIVE ==='
          curl -fsSL "${headers[@]}" "$root/runs?status=in_progress&per_page=100" |
            jq -c '.workflow_runs[] | {id,name,status,event,head_branch,head_sha,created_at}'
          echo '=== QUEUED ==='
          curl -fsSL "${headers[@]}" "$root/runs?status=queued&per_page=100" |
            jq -c '.workflow_runs[] | {id,name,status,event,head_branch,head_sha,created_at}'
          echo 'LOCAL_RUNNER_DIAGNOSTIC_DEDUPE_PASS'
