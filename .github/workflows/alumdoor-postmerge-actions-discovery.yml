name: Alumdoor Postmerge Actions Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: 683144d74329212492df5a4d78f12a1e7452b3d5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover exact-main Bootstrap and Pricing runs
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/nguyentrieu210/forge/actions/workflows'
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          bootstrap="$(curl -fsSL "${headers[@]}" "$api/bootstrap-alumdoor-local.yml/runs?branch=main&per_page=30")"
          pricing="$(curl -fsSL "${headers[@]}" "$api/alumdoor-pricing-local-import.yml/runs?per_page=30")"
          bom="$(curl -fsSL "${headers[@]}" "$api/alumdoor-bom-local-import.yml/runs?per_page=30")"

          echo '=== EXACT MAIN BOOTSTRAP RUNS ==='
          jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$bootstrap"
          echo '=== EXACT MAIN PRICING RUNS ==='
          jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$pricing"
          echo '=== EXACT MAIN BOM RUNS ==='
          jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$bom"
          echo 'ALUMDOOR_POSTMERGE_ACTION_DISCOVERY_PASS'
