name: Alumdoor Postmerge Actions Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: 9fc90544c46436d90fbf2c245764ef9340f890a3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel temporary self-hosted observers and discover latest-main state
        shell: bash
        run: |
          set -euo pipefail
          root='https://api.github.com/repos/nguyentrieu210/forge/actions'
          workflows="$root/workflows"
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          echo '=== CANCEL TEMPORARY OBSERVERS ==='
          observers="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-postmerge-local-acceptance-observer.yml/runs?per_page=50")"
          mapfile -t stale_ids < <(jq -r '.workflow_runs[] | select(.status=="queued" or .status=="in_progress") | .id' <<<"$observers")
          for id in "${stale_ids[@]}"; do
            echo "CANCEL_OBSERVER_RUN id=$id"
            curl -fsSL -X POST "${headers[@]}" "$root/runs/$id/cancel" -o /dev/null || true
          done

          bootstrap="$(curl -fsSL "${headers[@]}" "$workflows/bootstrap-alumdoor-local.yml/runs?branch=main&per_page=50")"
          pricing="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-pricing-local-import.yml/runs?per_page=50")"
          bom="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-bom-local-import.yml/runs?per_page=50")"
          active="$(curl -fsSL "${headers[@]}" "$root/runs?status=in_progress&per_page=50")"
          queued="$(curl -fsSL "${headers[@]}" "$root/runs?status=queued&per_page=50")"

          echo '=== LATEST MAIN BOOTSTRAP RUNS ==='
          jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,name,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$bootstrap"
          echo '=== LATEST MAIN PRICING RUNS ==='
          jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,name,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$pricing"
          echo '=== LATEST MAIN BOM RUNS ==='
          jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,name,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$bom"
          echo '=== ACTIVE RUNS AFTER CLEANUP REQUEST ==='
          jq -c '.workflow_runs[] | {id,name,status,event,head_branch,head_sha,created_at}' <<<"$active"
          echo '=== QUEUED RUNS AFTER CLEANUP REQUEST ==='
          jq -c '.workflow_runs[] | {id,name,status,event,head_branch,head_sha,created_at}' <<<"$queued"
          echo 'ALUMDOOR_POSTMERGE_ACTION_CLEANUP_DISCOVERY_PASS'
