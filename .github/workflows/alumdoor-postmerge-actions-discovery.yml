name: Alumdoor Postmerge Actions Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: 9fc90544c46436d90fbf2c245764ef9340f890a3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover exact-main Bootstrap and follower state
        shell: bash
        run: |
          set -euo pipefail
          root='https://api.github.com/repos/nguyentrieu210/forge/actions'
          workflows="$root/workflows"
          api='https://api.github.com/repos/nguyentrieu210/forge'
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          observers="$(curl -fsSL "${headers[@]}" "$workflows/alumdoor-postmerge-local-acceptance-observer.yml/runs?per_page=50")"
          while read -r id; do
            [ -z "$id" ] || { echo "CANCEL_TEMP_OBSERVER id=$id"; curl -fsSL -X POST "${headers[@]}" "$root/runs/$id/cancel" -o /dev/null || true; }
          done < <(jq -r '.workflow_runs[] | select(.status!="completed") | .id' <<<"$observers")

          main_sha="$(curl -fsSL "${headers[@]}" "$api/commits/main" | jq -r .sha)"
          echo "MAIN_SHA=$main_sha"

          for spec in \
            'BOOTSTRAP:bootstrap-alumdoor-local.yml' \
            'PRICING:alumdoor-pricing-local-import.yml' \
            'REASON:alumdoor-reason-master-local-import.yml' \
            'BOM:alumdoor-bom-local-import.yml'; do
            label="${spec%%:*}"; wf="${spec#*:}"
            echo "=== $label EXACT SHA ==="
            data="$(curl -fsSL "${headers[@]}" "$workflows/$wf/runs?per_page=50")"
            jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha) | {id,name,status,conclusion,event,run_number,run_attempt,head_sha,created_at,updated_at}' <<<"$data"
          done

          echo '=== ACTIVE ==='
          curl -fsSL "${headers[@]}" "$root/runs?status=in_progress&per_page=50" | jq -c '.workflow_runs[] | {id,name,status,event,head_branch,head_sha,created_at}'
          echo '=== QUEUED ==='
          curl -fsSL "${headers[@]}" "$root/runs?status=queued&per_page=50" | jq -c '.workflow_runs[] | {id,name,status,event,head_branch,head_sha,created_at}'
          echo 'ALUMDOOR_EXACT_MAIN_ACTION_DISCOVERY_PASS'
