name: Alumdoor Master Layer 0

on:
  push:
    paths:
      - 'server/scripts/lib/alumdoor-uom-catalog.mjs'
      - 'server/scripts/seed-alumdoor-uom-local.mjs'
      - 'server/tests/alumdoor-uom-catalog.test.mjs'
      - 'server/scripts/lib/alumdoor-color-catalog.mjs'
      - 'server/scripts/build-alumdoor-color-correction.mjs'
      - 'server/tests/alumdoor-color-catalog.test.mjs'
      - 'server/tests/alumdoor-color-seed-authority.test.mjs'
      - 'server/scripts/lib/alumdoor-item-group-catalog.mjs'
      - 'server/scripts/seed-alumdoor-item-groups-local.sql'
      - 'server/scripts/build-alumdoor-item-only-import.mjs'
      - 'server/scripts/lib/alumdoor-item-standardization.mjs'
      - 'server/imports/alumdoor-item-group-bosung-2026-08-15.sql'
      - 'server/tests/alumdoor-item-group-catalog.test.mjs'
      - '.github/workflows/alumdoor-master-layer0.yml'
  pull_request:
    paths:
      - 'server/scripts/lib/alumdoor-uom-catalog.mjs'
      - 'server/scripts/seed-alumdoor-uom-local.mjs'
      - 'server/tests/alumdoor-uom-catalog.test.mjs'
      - 'server/scripts/lib/alumdoor-color-catalog.mjs'
      - 'server/scripts/build-alumdoor-color-correction.mjs'
      - 'server/tests/alumdoor-color-catalog.test.mjs'
      - 'server/tests/alumdoor-color-seed-authority.test.mjs'
      - 'server/scripts/lib/alumdoor-item-group-catalog.mjs'
      - 'server/scripts/seed-alumdoor-item-groups-local.sql'
      - 'server/scripts/build-alumdoor-item-only-import.mjs'
      - 'server/scripts/lib/alumdoor-item-standardization.mjs'
      - 'server/imports/alumdoor-item-group-bosung-2026-08-15.sql'
      - 'server/tests/alumdoor-item-group-catalog.test.mjs'
      - '.github/workflows/alumdoor-master-layer0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uom:
    name: Lock canonical UOM catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Alumdoor canonical UOM layer
        run: node --test server/tests/alumdoor-uom-catalog.test.mjs

  color:
    name: Lock canonical Item Color catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Alumdoor canonical color catalogue
        run: node --test server/tests/alumdoor-color-catalog.test.mjs
      - name: Test Alumdoor color seed authority
        run: node --test server/tests/alumdoor-color-seed-authority.test.mjs

  item_group:
    name: Lock canonical Item Group tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Alumdoor canonical Item Group layer
        run: node --test server/tests/alumdoor-item-group-catalog.test.mjs
