name: Alumdoor Master Layer 0

on:
  push:
    paths:
      - 'server/scripts/lib/alumdoor-uom-catalog.mjs'
      - 'server/scripts/seed-alumdoor-uom-local.mjs'
      - 'server/tests/alumdoor-uom-catalog.test.mjs'
      - '.github/workflows/alumdoor-master-layer0.yml'
  pull_request:
    paths:
      - 'server/scripts/lib/alumdoor-uom-catalog.mjs'
      - 'server/scripts/seed-alumdoor-uom-local.mjs'
      - 'server/tests/alumdoor-uom-catalog.test.mjs'
      - '.github/workflows/alumdoor-master-layer0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uom:
    name: Lock canonical UOM catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Alumdoor canonical UOM layer
        run: node --test server/tests/alumdoor-uom-catalog.test.mjs
