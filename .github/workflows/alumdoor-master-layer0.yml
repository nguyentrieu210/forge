name: Alumdoor Master Layer 0

on:
  push:
    paths:
      - 'server/scripts/lib/alumdoor-uom-catalog.mjs'
      - 'server/scripts/seed-alumdoor-uom-local.mjs'
      - 'server/tests/alumdoor-uom-catalog.test.mjs'
      - 'server/scripts/lib/alumdoor-color-catalog.mjs'
      - 'server/scripts/build-alumdoor-color-correction.mjs'
      - 'server/apps-src/alumdoor-worker/src/color-scopes.ts'
      - 'server/briefs/alumdoor.json'
      - 'server/briefs/alumdoor-v2.json'
      - 'server/tests/alumdoor-color-catalog.test.mjs'
      - 'server/tests/alumdoor-color-seed-authority.test.mjs'
      - 'server/tests/alumdoor-color-scopes.test.mjs'
      - 'server/scripts/lib/alumdoor-item-group-catalog.mjs'
      - 'server/scripts/seed-alumdoor-item-groups-local.sql'
      - 'server/scripts/build-alumdoor-item-only-import.mjs'
      - 'server/scripts/lib/alumdoor-item-standardization.mjs'
      - 'server/imports/alumdoor-item-group-bosung-2026-08-15.sql'
      - 'server/tests/alumdoor-item-group-catalog.test.mjs'
      - 'server/scripts/lib/alumdoor-material-specification-catalog.mjs'
      - 'server/scripts/seed-alumdoor-material-specifications-local.mjs'
      - 'server/scripts/build-alumdoor-profile-specifications.mjs'
      - 'server/tests/alumdoor-material-specification-catalog.test.mjs'
      - 'server/scripts/lib/alumdoor-measurement-profile-catalog.mjs'
      - 'server/scripts/lib/alumdoor-geometry-catalog.mjs'
      - 'server/scripts/apply-alumdoor-measurement-geometry-overlay.mjs'
      - 'server/scripts/seed-alumdoor-measurement-geometry-local.mjs'
      - 'server/scripts/build-alumdoor-v2-brief.mjs'
      - 'server/tests/alumdoor-measurement-geometry-master.test.mjs'
      - 'server/scripts/lib/alumdoor-cutting-policy-catalog.mjs'
      - 'server/apps-src/alumdoor-worker/src/geometry-policy.ts'
      - 'server/tests/alumdoor-cutting-policy-geometry.test.mjs'
      - '.github/workflows/alumdoor-master-layer0.yml'
  pull_request:
    paths:
      - 'server/scripts/lib/alumdoor-uom-catalog.mjs'
      - 'server/scripts/seed-alumdoor-uom-local.mjs'
      - 'server/tests/alumdoor-uom-catalog.test.mjs'
      - 'server/scripts/lib/alumdoor-color-catalog.mjs'
      - 'server/scripts/build-alumdoor-color-correction.mjs'
      - 'server/apps-src/alumdoor-worker/src/color-scopes.ts'
      - 'server/briefs/alumdoor.json'
      - 'server/briefs/alumdoor-v2.json'
      - 'server/tests/alumdoor-color-catalog.test.mjs'
      - 'server/tests/alumdoor-color-seed-authority.test.mjs'
      - 'server/tests/alumdoor-color-scopes.test.mjs'
      - 'server/scripts/lib/alumdoor-item-group-catalog.mjs'
      - 'server/scripts/seed-alumdoor-item-groups-local.sql'
      - 'server/scripts/build-alumdoor-item-only-import.mjs'
      - 'server/scripts/lib/alumdoor-item-standardization.mjs'
      - 'server/imports/alumdoor-item-group-bosung-2026-08-15.sql'
      - 'server/tests/alumdoor-item-group-catalog.test.mjs'
      - 'server/scripts/lib/alumdoor-material-specification-catalog.mjs'
      - 'server/scripts/seed-alumdoor-material-specifications-local.mjs'
      - 'server/scripts/build-alumdoor-profile-specifications.mjs'
      - 'server/tests/alumdoor-material-specification-catalog.test.mjs'
      - 'server/scripts/lib/alumdoor-measurement-profile-catalog.mjs'
      - 'server/scripts/lib/alumdoor-geometry-catalog.mjs'
      - 'server/scripts/apply-alumdoor-measurement-geometry-overlay.mjs'
      - 'server/scripts/seed-alumdoor-measurement-geometry-local.mjs'
      - 'server/scripts/build-alumdoor-v2-brief.mjs'
      - 'server/tests/alumdoor-measurement-geometry-master.test.mjs'
      - 'server/scripts/lib/alumdoor-cutting-policy-catalog.mjs'
      - 'server/apps-src/alumdoor-worker/src/geometry-policy.ts'
      - 'server/tests/alumdoor-cutting-policy-geometry.test.mjs'
      - '.github/workflows/alumdoor-master-layer0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uom:
    name: Lock canonical UOM catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Alumdoor canonical UOM layer
        run: node --test server/tests/alumdoor-uom-catalog.test.mjs

  color:
    name: Lock canonical Item Color and Surface Finish catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Alumdoor canonical color catalogue
        run: node --test server/tests/alumdoor-color-catalog.test.mjs
      - name: Test Alumdoor color seed authority
        run: node --test server/tests/alumdoor-color-seed-authority.test.mjs
      - name: Build Surface Finish resolver
        working-directory: server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Test Surface Finish include/exclusion resolver
        working-directory: server
        run: node --test tests/alumdoor-color-scopes.test.mjs

  item_group:
    name: Lock canonical Item Group tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Alumdoor canonical Item Group layer
        run: node --test server/tests/alumdoor-item-group-catalog.test.mjs

  material_specification:
    name: Lock canonical Material Specification catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test canonical Material Specification layer
        run: node --test server/tests/alumdoor-material-specification-catalog.test.mjs
      - name: Test Item standardization compatibility
        run: node --test server/tests/alumdoor-item-standardization.test.mjs
      - name: Generate canonical Material Specification seed
        run: |
          node server/scripts/seed-alumdoor-material-specifications-local.mjs demo "$RUNNER_TEMP/material-spec.sql" >/dev/null
          grep -q "Material Specification" "$RUNNER_TEMP/material-spec.sql"

  measurement_geometry:
    name: Lock Measurement Profile and Geometry masters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test canonical Measurement and Geometry contracts
        run: |
          node --test server/tests/alumdoor-measurement-geometry-master.test.mjs
          node server/scripts/seed-alumdoor-measurement-geometry-local.mjs demo "$RUNNER_TEMP/measurement-geometry.sql" >/dev/null
          grep -q "Geometry Field" "$RUNNER_TEMP/measurement-geometry.sql"
          grep -q "Geometry Profile" "$RUNNER_TEMP/measurement-geometry.sql"
      - name: Verify generated builder authority
        run: |
          grep -q 'brief.version = "2.4.0"' server/scripts/build-alumdoor-v2-brief.mjs
          grep -q 'alumdoor-geometry-catalog.mjs' server/scripts/build-alumdoor-v2-brief.mjs
          grep -q 'alumdoor-measurement-profile-catalog.mjs' server/scripts/build-alumdoor-v2-brief.mjs
      - name: Build and dry-run Alumdoor V2 metadata
        working-directory: server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
          node scripts/verify-alumdoor-meta-completeness.mjs

  cutting_policy_geometry:
    name: Lock Cutting Policy geometry rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test canonical Cutting Policy geometry
        working-directory: server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          node --test tests/alumdoor-cutting-policy-geometry.test.mjs
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
