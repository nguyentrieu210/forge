name: UI V3-05 Validation Base

on:
  pull_request:
    branches:
      - tmp/ui-v3-05-validation-base-20260804
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: ui-v3-05-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ui/v3-05-charts-command-center-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DELIVERY_HEAD: ${{ github.event.pull_request.head.sha }}
      DELIVERY_BRANCH: ${{ github.event.pull_request.head.ref }}
      DELIVERY_BASE_MAIN: fe0c2f1a9c490eb400e19a5d55baea9a4b60c307
      ROOT_LOCK_BRANCH: deps/ui-v3-05-root-lock-20260804

    steps:
      - name: Checkout exact delivery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Generate root workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate nested client lockfile
        run: pnpm --dir client install --no-frozen-lockfile

      - name: Prove generated root lock is frozen-installable
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prove generated client lock is frozen-installable
        run: pnpm --dir client install --frozen-lockfile --prefer-offline

      - name: Run chart model tests
        run: pnpm --filter @metaforge/charts run test

      - name: Typecheck command visual package
        run: pnpm --filter @metaforge/visual run typecheck

      - name: Typecheck shared views
        run: pnpm --filter @metaforge/views run typecheck

      - name: Typecheck complete client workspace
        run: pnpm --dir client run typecheck

      - name: Ensure dashboard selfcheck targets Forge chart contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("client/apps/demo/src/selfcheck.ts")
          source = path.read_text(encoding="utf-8")
          old = '  assert.ok(html.includes("recharts-responsive-container") || html.includes("recharts"), "chart Recharts mount");'
          marker = '  assert.ok(html.includes(\'aria-label="Doanh thu"\'), "Forge chart surface mount");'
          replacement = marker + '\n  assert.ok(!html.includes("recharts"), "Dashboard không còn sở hữu Recharts trực tiếp");'
          if old in source:
              path.write_text(source.replace(old, replacement, 1), encoding="utf-8")
          elif marker in source:
              print("Forge chart selfcheck already migrated")
          else:
              raise SystemExit("dashboard chart selfcheck contract not found")
          PY

      - name: Run client selfchecks
        run: pnpm --dir client run test

      - name: Run repository native UI lint
        id: native-lint
        run: pnpm --dir client run lint

      - name: Build runtime dependency graph
        run: pnpm --filter runtime... run build

      - name: Install Chromium for V3-05 evidence
        run: pnpm --dir client/apps/demo exec playwright install --with-deps chromium

      - name: Run V3-05 responsive and accessibility evidence
        run: pnpm --dir client/apps/demo exec playwright test e2e/v3-05-charts.spec.ts --config playwright.e2e.config.mjs --project=desktop-chromium --tsconfig=e2e/tsconfig.json

      - name: Upload V3-05 visual evidence
        id: visual-evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-v3-05-visual-evidence-${{ github.run_id }}
          path: client/apps/demo/test-results/
          if-no-files-found: error
          retention-days: 14

      - name: Save generated root lock
        run: cp pnpm-lock.yaml "$RUNNER_TEMP/ui-v3-05-root-pnpm-lock.yaml"

      - name: Record exact-head validation evidence
        shell: bash
        run: |
          cat > client/docs/ui-v3-05-validation.md <<EOF
          # UI V3-05 validation evidence

          Date: 2026-08-04
          Source delivery SHA: \`${DELIVERY_HEAD}\`
          Validation run: \`${GITHUB_RUN_ID}\`
          Visual evidence artifact: \`${{ steps.visual-evidence.outputs.artifact-id }}\`
          Runner: GitHub Actions / Node 22 / pnpm 9.15.0 / Playwright Chromium
          Temporary validation base: \`tmp/ui-v3-05-validation-base-20260804\`

          Passed on the exact delivery source head after deterministic lock generation:

          - root workspace dependency resolution;
          - nested client workspace dependency resolution;
          - root frozen-lock install replay;
          - client frozen-lock install replay;
          - \`@metaforge/charts\` build + chart-model tests;
          - \`@metaforge/visual\` typecheck;
          - \`@metaforge/views\` typecheck;
          - complete client workspace typecheck;
          - client selfchecks with the Forge chart-surface contract;
          - repository native UI lint;
          - runtime dependency-graph production build;
          - dashboard visual evidence at 1440×1000, 768×1024 and 390×844;
          - light and dark dashboard evidence;
          - command-center fullscreen evidence;
          - repeated command-center resize without ECharts canvas multiplication;
          - reduced-motion media behavior;
          - WCAG A/AA serious-or-critical Axe scan for dashboard and command-center evidence surfaces.

          The Playwright evidence harness is isolated under \`client/apps/demo/v3-05.html\` and uses mock presentation data only. It does not create an authoritative production route or metadata contract.

          Generated dependency outputs:

          - \`client/pnpm-lock.yaml\` and the updated dashboard selfcheck are committed to the delivery branch;
          - root \`pnpm-lock.yaml\` is committed separately on \`deps/ui-v3-05-root-lock-20260804\` so the production UI-only deploy guard is not bypassed.

          No backend, schema, migration, permission, tenant or business-authority mutation was performed by this validation lane.
          EOF

      - name: Commit client lock and validation evidence to delivery
        shell: bash
        run: |
          set -euo pipefail
          git add client/pnpm-lock.yaml client/apps/demo/src/selfcheck.ts client/docs/ui-v3-05-validation.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui-v3): refresh V3-05 validation evidence"
            git push origin HEAD:"${DELIVERY_BRANCH}"
          fi

      - name: Refresh root-lock-only dependency branch
        shell: bash
        run: |
          set -euo pipefail
          git restore pnpm-lock.yaml
          git checkout --detach "${DELIVERY_BASE_MAIN}"
          git checkout -B "${ROOT_LOCK_BRANCH}"
          cp "$RUNNER_TEMP/ui-v3-05-root-pnpm-lock.yaml" pnpm-lock.yaml
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Root lockfile did not change; dependency branch already current."
            exit 0
          fi
          git commit -m "chore(deps): prepare root lock for UI V3-05"
          git push --force-with-lease origin HEAD:"${ROOT_LOCK_BRANCH}"
