name: UI V3-05 Validation Base

on:
  pull_request:
    branches:
      - tmp/ui-v3-05-validation-base-20260804
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: ui-v3-05-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ui/v3-05-charts-command-center-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DELIVERY_HEAD: ${{ github.event.pull_request.head.sha }}
      DELIVERY_BRANCH: ${{ github.event.pull_request.head.ref }}
      DELIVERY_BASE_MAIN: fe0c2f1a9c490eb400e19a5d55baea9a4b60c307
      ROOT_LOCK_BRANCH: deps/ui-v3-05-root-lock-20260804

    steps:
      - name: Checkout exact delivery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Generate root workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate nested client lockfile
        run: pnpm --dir client install --no-frozen-lockfile

      - name: Prove generated root lock is frozen-installable
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prove generated client lock is frozen-installable
        run: pnpm --dir client install --frozen-lockfile --prefer-offline

      - name: Run chart model tests
        run: pnpm --filter @metaforge/charts run test

      - name: Typecheck command visual package
        run: pnpm --filter @metaforge/visual run typecheck

      - name: Typecheck shared views
        run: pnpm --filter @metaforge/views run typecheck

      - name: Typecheck complete client workspace
        run: pnpm --dir client run typecheck

      - name: Migrate stale dashboard selfcheck to Forge chart contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("client/apps/demo/src/selfcheck.ts")
          source = path.read_text(encoding="utf-8")
          old = '  assert.ok(html.includes("recharts-responsive-container") || html.includes("recharts"), "chart Recharts mount");'
          new = '  assert.ok(html.includes(\'aria-label="Doanh thu"\'), "Forge chart surface mount");\n  assert.ok(!html.includes("recharts"), "Dashboard không còn sở hữu Recharts trực tiếp");'
          if old not in source:
              raise SystemExit("stale Recharts dashboard selfcheck marker not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run client selfchecks
        run: pnpm --dir client run test

      - name: Observe repository native UI lint baseline
        id: native-lint
        continue-on-error: true
        run: pnpm --dir client run lint

      - name: Build runtime dependency graph
        run: pnpm --filter runtime... run build

      - name: Save generated root lock
        run: cp pnpm-lock.yaml "$RUNNER_TEMP/ui-v3-05-root-pnpm-lock.yaml"

      - name: Record exact-head validation evidence
        shell: bash
        run: |
          cat > client/docs/ui-v3-05-validation.md <<EOF
          # UI V3-05 validation evidence

          Date: 2026-08-04
          Source delivery SHA: \`${DELIVERY_HEAD}\`
          Validation run: \`${GITHUB_RUN_ID}\`
          Runner: GitHub Actions / Node 22 / pnpm 9.15.0
          Temporary validation base: \`tmp/ui-v3-05-validation-base-20260804\`

          Passed on the exact delivery source head after deterministic lock generation and migration of the stale dashboard Recharts selfcheck to the Forge chart-surface contract:

          - root workspace dependency resolution;
          - nested client workspace dependency resolution;
          - root frozen-lock install replay;
          - client frozen-lock install replay;
          - \`@metaforge/charts\` build + chart-model tests;
          - \`@metaforge/visual\` typecheck;
          - \`@metaforge/views\` typecheck;
          - complete client workspace typecheck;
          - client selfchecks;
          - runtime dependency-graph production build.

          Repository native UI lint observation: \`${{ steps.native-lint.outcome }}\`.
          This observation is recorded separately because current main already carries known cross-workstream native-UI lint debt; V3-05 does not suppress that debt.

          Generated dependency outputs:

          - \`client/pnpm-lock.yaml\` and the updated dashboard selfcheck are committed to the delivery branch;
          - root \`pnpm-lock.yaml\` is committed separately on \`deps/ui-v3-05-root-lock-20260804\` so the production UI-only deploy guard is not bypassed.

          No backend, schema, migration, permission, tenant or business-authority mutation was performed by this validation lane.
          EOF

      - name: Commit client lock and validation evidence to delivery
        shell: bash
        run: |
          set -euo pipefail
          git add client/pnpm-lock.yaml client/apps/demo/src/selfcheck.ts client/docs/ui-v3-05-validation.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui-v3): record V3-05 lock and validation evidence"
            git push origin HEAD:"${DELIVERY_BRANCH}"
          fi

      - name: Create root-lock-only dependency branch
        shell: bash
        run: |
          set -euo pipefail
          git restore pnpm-lock.yaml
          git checkout --detach "${DELIVERY_BASE_MAIN}"
          git checkout -B "${ROOT_LOCK_BRANCH}"
          cp "$RUNNER_TEMP/ui-v3-05-root-pnpm-lock.yaml" pnpm-lock.yaml
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Root lockfile did not change; dependency branch not needed."
            exit 0
          fi
          git commit -m "chore(deps): prepare root lock for UI V3-05"
          git push --force-with-lease origin HEAD:"${ROOT_LOCK_BRANCH}"
