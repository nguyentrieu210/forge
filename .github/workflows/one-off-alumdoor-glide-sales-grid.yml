name: One-off AlumDoor Glide Sales Grid

on:
  push:
    branches: [ui/alumdoor-glide-sales-grid]
  workflow_dispatch:

concurrency:
  group: one-off-alumdoor-glide-sales-grid
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/alumdoor-glide-sales-grid
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Align vendored Glide source and built artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/glide-upstream /tmp/glide-npm
          git clone --depth 1 --branch v6.0.4-alpha24 https://github.com/glideapps/glide-data-grid.git /tmp/glide-upstream
          mkdir -p client/vendor/glide-data-grid /tmp/glide-npm
          rsync -a --delete /tmp/glide-upstream/packages/core/src/ client/vendor/glide-data-grid/src/
          rm -rf client/vendor/glide-data-grid/src/docs client/vendor/glide-data-grid/src/stories client/vendor/glide-data-grid/src/data-editor/stories
          find client/vendor/glide-data-grid/src -type f -name '*.stories.*' -delete
          cp /tmp/glide-upstream/packages/core/package.json client/vendor/glide-data-grid/package.json
          cp /tmp/glide-upstream/packages/core/LICENSE client/vendor/glide-data-grid/LICENSE
          cp /tmp/glide-upstream/packages/core/README.md client/vendor/glide-data-grid/README.md
          cp /tmp/glide-upstream/packages/core/API.md client/vendor/glide-data-grid/API.md
          upstream_sha=$(git -C /tmp/glide-upstream rev-parse HEAD)
          cat > client/vendor/glide-data-grid/UPSTREAM.md <<EOF
          # Glide Data Grid upstream

          - Repository: glideapps/glide-data-grid
          - Tag: v6.0.4-alpha24
          - Commit: ${upstream_sha}
          - License: MIT
          - Vendored runtime source: packages/core/src (runtime-only subset)
          - Runtime dist: official npm artifact @glideapps/glide-data-grid@6.0.4-alpha24

          Forge keeps the upstream runtime source and matching built distribution in-repo. `forge-bundle/` bundles Glide and its non-React runtime dependencies for the AlumDoor preview/runtime, so local Vite does not require an extra install step.
          EOF
          tarball=$(npm pack @glideapps/glide-data-grid@6.0.4-alpha24 --pack-destination /tmp --silent | tail -1)
          tar -xzf "/tmp/${tarball}" -C /tmp/glide-npm
          rm -rf client/vendor/glide-data-grid/dist
          cp -R /tmp/glide-npm/package/dist client/vendor/glide-data-grid/dist

      - name: Apply Sales Order integration
        run: |
          python3 server/scripts/patch-alumdoor-glide-sales-grid.py
          python3 server/scripts/fix-alumdoor-glide-package.py

      - name: Resolve temporary build dependencies
        working-directory: client
        run: pnpm install --no-frozen-lockfile

      - name: Create self-contained Glide runtime bundle
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/glide-data-grid/forge-bundle
          mkdir -p vendor/glide-data-grid/forge-bundle
          pnpm dlx esbuild@0.25.12 vendor/glide-data-grid/dist/esm/index.js \
            --bundle \
            --platform=browser \
            --format=esm \
            --external:react \
            --external:react-dom \
            --external:react/jsx-runtime \
            --outfile=vendor/glide-data-grid/forge-bundle/index.js
          cp vendor/glide-data-grid/dist/index.css vendor/glide-data-grid/forge-bundle/index.css
          cat > vendor/glide-data-grid/forge-bundle/index.d.ts <<'EOF'
          export * from "../dist/dts/index";
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/views/src/app/vertical/alumdoor/AlumdoorSalesLinesGrid.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace('from "@glideapps/glide-data-grid";', 'from "../../../../../../vendor/glide-data-grid/forge-bundle/index.js";')
          text = text.replace('import "@glideapps/glide-data-grid/dist/index.css";', 'import "../../../../../../vendor/glide-data-grid/forge-bundle/index.css";')
          path.write_text(text, encoding="utf-8")
          PY
          git checkout origin/main -- pnpm-workspace.yaml pnpm-lock.yaml packages/views/package.json packages/views/tsconfig.json ../.github/workflows/sync-alumdoor-ui-local.yml

      - name: Targeted final Sales Order bundle check
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx esbuild@0.25.12 packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx \
            --bundle \
            --platform=browser \
            --format=esm \
            --jsx=automatic \
            '--external:@metaforge/*' \
            --external:react \
            --external:react-dom \
            --external:react/jsx-runtime \
            --external:lucide-react \
            --external:@tanstack/react-query \
            --outfile=/tmp/alumdoor-sales-order.js
          test -s /tmp/alumdoor-sales-order.js

      - name: Commit integration source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "forge-ui-bot"
          git config user.email "forge-ui-bot@users.noreply.github.com"
          git add -A client/vendor/glide-data-grid
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesLinesGrid.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(ui): wire AlumDoor Sales Order to Glide grid"
          git push origin HEAD:ui/alumdoor-glide-sales-grid
