name: One-off AlumDoor Glide Sales Grid

on:
  push:
    branches: [ui/alumdoor-glide-sales-grid]
  workflow_dispatch:

concurrency:
  group: one-off-alumdoor-glide-sales-grid
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/alumdoor-glide-sales-grid
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Apply source patch
        run: python3 server/scripts/patch-alumdoor-glide-sales-grid.py

      - name: Resolve workspace lockfile
        working-directory: client
        run: pnpm install --no-frozen-lockfile

      - name: Targeted typecheck
        working-directory: client
        run: pnpm exec tsc -b vendor/glide-data-grid packages/views --pretty false

      - name: Commit integration source only
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/one-off-alumdoor-glide-sales-grid.yml server/scripts/patch-alumdoor-glide-sales-grid.py
          git config user.name "forge-ui-bot"
          git config user.email "forge-ui-bot@users.noreply.github.com"
          git add client/pnpm-workspace.yaml client/pnpm-lock.yaml client/vendor/glide-data-grid/package.json client/vendor/glide-data-grid/tsconfig.json client/packages/views/package.json client/packages/views/tsconfig.json client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesLinesGrid.tsx .github/workflows/sync-alumdoor-ui-local.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(ui): wire AlumDoor Sales Order to Glide grid"
          git push origin HEAD:ui/alumdoor-glide-sales-grid
