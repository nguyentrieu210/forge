name: Temporary Alumdoor BOM Source Catalog
on:
  push:
    branches: ['agent/alumdoor-bom-source-catalog']
    paths: ['.github/workflows/_tmp-alumdoor-bom-source-catalog.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - name: Wire source provenance schema and fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const builderPath = 'server/scripts/build-alumdoor-v2-brief.mjs';
          let builder = fs.readFileSync(builderPath, 'utf8');
          const importAnchor = 'import { CUTTING_POLICIES, cuttingPolicyFixtureData } from "./lib/alumdoor-cutting-policy-catalog.mjs";\n';
          const sourceImport = 'import { bomSourceFixtureRows } from "./lib/alumdoor-bom-template-source-catalog.mjs";\n';
          if (!builder.includes(sourceImport)) {
            if (!builder.includes(importAnchor)) throw new Error('builder import anchor missing');
            builder = builder.replace(importAnchor, importAnchor + sourceImport);
          }

          const componentFieldAnchor = '    "quantity_formula_json:Code! Công thức số lượng JSON",\n    "note:Small Text Ghi chú"';
          if (!builder.includes('"source_row:Int Dòng nguồn"')) {
            if (!builder.includes(componentFieldAnchor)) throw new Error('BOM Component Rule field anchor missing');
            builder = builder.replace(componentFieldAnchor,
              '    "quantity_formula_json:Code! Công thức số lượng JSON",\n'
              + '    "source_row:Int Dòng nguồn",\n'
              + '    "source_uom:Data ĐVT nguồn",\n'
              + '    "source_formula:Small Text Công thức nguồn",\n'
              + '    "note:Small Text Ghi chú"');
          }

          const templateFieldAnchor = '    "disabled:Check=(0) Ngừng dùng",\n    "required_context_fields_json:Code Ngữ cảnh bắt buộc JSON",';
          if (!builder.includes('"source_status:Select(READY,DEFERRED)!=(DEFERRED) Trạng thái chuẩn hóa nguồn"')) {
            if (!builder.includes(templateFieldAnchor)) throw new Error('BOM Template field anchor missing');
            builder = builder.replace(templateFieldAnchor,
              '    "disabled:Check=(0) Ngừng dùng",\n'
              + '    "source_status:Select(READY,DEFERRED)!=(DEFERRED) Trạng thái chuẩn hóa nguồn",\n'
              + '    "source_ref:Data Tham chiếu nguồn",\n'
              + '    "deferred_components_json:Code Thành phần chờ chuẩn hóa JSON",\n'
              + '    "required_context_fields_json:Code Ngữ cảnh bắt buộc JSON",');
          }

          const fixtureAnchor = 'note("BOM Template: +doctype mẫu/quy tắc + metadata materialization trên Bill of Materials");';
          if (!builder.includes('for (const fixture of bomSourceFixtureRows())')) {
            if (!builder.includes(fixtureAnchor)) throw new Error('BOM fixture anchor missing');
            builder = builder.replace(fixtureAnchor,
              fixtureAnchor + '\n'
              + 'for (const fixture of bomSourceFixtureRows()) {\n'
              + '  const existing = brief.fixtures.find((row) => row.type === fixture.type && row.name === fixture.name);\n'
              + '  if (existing) existing.data = fixture.data;\n'
              + '  else brief.fixtures.push(fixture);\n'
              + '}\n'
              + 'note(`BOM Template nguồn: ${bomSourceFixtureRows().length} fixture catalog`);');
          }
          fs.writeFileSync(builderPath, builder, 'utf8');
          NODE

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { bomSourceFixtureRows } from './server/scripts/lib/alumdoor-bom-template-source-catalog.mjs';

          const path = 'server/briefs/alumdoor-v2.json';
          const brief = JSON.parse(fs.readFileSync(path, 'utf8'));
          const component = brief.doctypes.find((row) => row.name === 'BOM Component Rule');
          const template = brief.doctypes.find((row) => row.name === 'BOM Template');
          if (!component || !template) throw new Error('BOM schema from base PR missing');
          const nameOf = (entry) => typeof entry === 'string' ? entry.split(':')[0].trim() : entry.fieldname;
          const addField = (doctype, spec) => {
            if (!doctype.fields.some((entry) => nameOf(entry) === nameOf(spec))) doctype.fields.push(spec);
          };
          for (const spec of [
            'source_row:Int Dòng nguồn',
            'source_uom:Data ĐVT nguồn',
            'source_formula:Small Text Công thức nguồn',
          ]) addField(component, spec);
          for (const spec of [
            'source_status:Select(READY,DEFERRED)!=(DEFERRED) Trạng thái chuẩn hóa nguồn',
            'source_ref:Data Tham chiếu nguồn',
            'deferred_components_json:Code Thành phần chờ chuẩn hóa JSON',
          ]) addField(template, spec);
          for (const fixture of bomSourceFixtureRows()) {
            const index = brief.fixtures.findIndex((row) => row.type === fixture.type && row.name === fixture.name);
            if (index >= 0) brief.fixtures[index] = fixture;
            else brief.fixtures.push(fixture);
          }
          fs.writeFileSync(path, JSON.stringify(brief, null, 2) + '\n');
          NODE
      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Build server
        working-directory: server
        run: pnpm run build
      - name: Run BOM source and base tests
        working-directory: server
        run: |
          node --test tests/alumdoor-bom-template-core.test.mjs
          node --test tests/alumdoor-bom-template-materializer.test.mjs
          node --test tests/alumdoor-bom-source-catalog.test.mjs
          node --test tests/alumdoor-cutting-policy-geometry.test.mjs
      - name: Validate source fixture and brief dry-run
        working-directory: server
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { bomSourceFixtureRows } from './scripts/lib/alumdoor-bom-template-source-catalog.mjs';
          const brief = JSON.parse(fs.readFileSync('briefs/alumdoor-v2.json', 'utf8'));
          const expected = bomSourceFixtureRows()[0];
          const actual = brief.fixtures.find((row) => row.type === expected.type && row.name === expected.name);
          if (!actual) throw new Error('Source BOM fixture missing from static brief');
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Static source BOM fixture drifted from catalog');
          if (actual.data.disabled !== true || actual.data.source_status !== 'DEFERRED') throw new Error('Deferred source pilot must remain disabled');
          NODE
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
      - name: Commit validated source catalog and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-alumdoor-bom-source-catalog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/scripts/lib/alumdoor-bom-template-source-catalog.mjs \
            server/tests/alumdoor-bom-source-catalog.test.mjs \
            server/scripts/build-alumdoor-v2-brief.mjs \
            server/briefs/alumdoor-v2.json \
            .github/workflows/_tmp-alumdoor-bom-source-catalog.yml
          git commit -m 'feat(alumdoor): seed source-backed BOM catalog pilot'
          git push origin HEAD:agent/alumdoor-bom-source-catalog
