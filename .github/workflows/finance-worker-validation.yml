name: Finance Worker Validation

on:
  push:
    branches:
      - feat/finance-ar-ap-completion

permissions:
  contents: read
  issues: write

concurrency:
  group: finance-worker-validation
  cancel-in-progress: true

jobs:
  finance-aging-worker:
    name: Finance aging query worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run finance aging Query Worker integration
        working-directory: server
        run: pnpm exec vitest run --config apps/query-worker/vitest.config.mts test/finance-aging.integration.test.mts

      - name: Publish validation evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- finance-worker-validation -->';
            const outcome = '${{ job.status }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Finance Worker Validation\n\n- Head SHA: \`${context.sha}\`\n- Job: \`Finance aging query worker\`\n- Result: **${outcome.toUpperCase()}**\n- Run: ${runUrl}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 15,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 15, body });
            }
