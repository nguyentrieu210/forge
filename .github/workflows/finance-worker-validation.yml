name: Finance Worker Validation

on:
  push:
    branches:
      - feat/finance-ar-ap-completion

permissions:
  contents: read

concurrency:
  group: finance-worker-validation
  cancel-in-progress: true

jobs:
  finance-aging-worker:
    name: Finance aging query worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run finance aging Query Worker integration
        working-directory: server
        run: pnpm exec vitest run --config apps/query-worker/vitest.config.mts test/finance-aging.integration.test.mts
