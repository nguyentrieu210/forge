name: Purchase Current Snapshot

on:
  pull_request:
    types: [synchronize, reopened, edited]
    branches:
      - hotfix/alumdoor-print-list-delete

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'feat/purchase-receipt-complete-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/purchase-receipt-complete-20260731
      - uses: actions/upload-artifact@v4
        with:
          name: purchase-current-${{ github.event.pull_request.head.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !**/node_modules/**
            !server/work/**
            !tmp/**
            !**/.env*
            !.github/purchase-final-patch.*
            !.github/workflows/purchase-current-snapshot.yml
          include-hidden-files: true
          retention-days: 1
