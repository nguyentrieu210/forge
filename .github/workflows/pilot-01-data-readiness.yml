name: Pilot-01 Data Readiness

on:
  pull_request:
    paths:
      - "docs/pilot/alumdoor/**"
      - ".github/workflows/pilot-01-data-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify preview-only source batch controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Pilot-01 tools
        run: |
          node --check docs/pilot/alumdoor/tools/validate-pilot-batch.mjs
          node --check docs/pilot/alumdoor/tools/normalize-pilot-identities.mjs
          node --check docs/pilot/alumdoor/tools/normalize-pilot-aliases-suppliers.mjs
          node --check docs/pilot/alumdoor/tools/reconcile-pilot-uom.mjs
          node --check docs/pilot/alumdoor/tools/verify-pilot-01-cutoff-feasibility.mjs
      - name: Verify Pilot-00 / Pilot-01 identity contract
        run: node docs/pilot/alumdoor/tools/verify-pilot-01-contract.mjs
      - name: Verify cutoff feasibility evidence remains fail-closed
        run: node docs/pilot/alumdoor/tools/verify-pilot-01-cutoff-feasibility.mjs
      - name: Verify UOM reconciliation policy
        run: node docs/pilot/alumdoor/tools/reconcile-pilot-uom.mjs
      - name: Run fail-closed batch validator tests
        run: node --test docs/pilot/alumdoor/tools/validate-pilot-batch.test.mjs
      - name: Run identity and UOM normalization tests
        run: |
          node --test docs/pilot/alumdoor/tools/normalize-pilot-identities.test.mjs
          node --test docs/pilot/alumdoor/tools/normalize-pilot-aliases-suppliers.test.mjs
          node --test docs/pilot/alumdoor/tools/reconcile-pilot-uom.test.mjs
      - name: Assert no production mutation authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'wrangler deploy|--execute|migrate-tenant\.mjs|deploy-tenant\.mjs|reset-remote-admin-password\.mjs' \
            docs/pilot/alumdoor/tools .github/workflows/pilot-01-data-readiness.yml
          grep -q 'production_write_authorized.*false' docs/pilot/alumdoor/PILOT_DATA_MAPPING_V1.json
          grep -q 'production_write_authorized.*false' docs/pilot/alumdoor/PILOT_01_IDENTITY_DISPOSITION_V1.json
          grep -q 'production_write_authorized.*false' docs/pilot/alumdoor/PILOT_01_ALIAS_SUPPLIER_RECONCILIATION_V1.json
          grep -q 'production_write_authorized.*false' docs/pilot/alumdoor/PILOT_01_UOM_RECONCILIATION_V1.json
          grep -q 'production_write_authorized.*false' docs/pilot/alumdoor/PILOT_01_CUTOFF_FEASIBILITY_20260805.json
