name: Pilot-01 Data Readiness

on:
  pull_request:
    paths:
      - "docs/pilot/alumdoor/**"
      - ".github/workflows/pilot-01-data-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify preview-only source batch controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check validator
        run: node --check docs/pilot/alumdoor/tools/validate-pilot-batch.mjs
      - name: Verify Pilot-00 / Pilot-01 identity contract
        run: node docs/pilot/alumdoor/tools/verify-pilot-01-contract.mjs
      - name: Run fail-closed batch validator tests
        run: node --test docs/pilot/alumdoor/tools/validate-pilot-batch.test.mjs
      - name: Assert no production mutation authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'wrangler deploy|--execute|migrate-tenant\.mjs|deploy-tenant\.mjs|reset-remote-admin-password\.mjs' \
            docs/pilot/alumdoor/tools .github/workflows/pilot-01-data-readiness.yml
          grep -q 'production_write_authorized.*false' docs/pilot/alumdoor/PILOT_DATA_MAPPING_V1.json
