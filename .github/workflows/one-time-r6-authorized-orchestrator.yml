name: One-time R6 Authorized Orchestrator

on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-r6-authorized-orchestrator.yml"]

permissions:
  actions: write
  contents: write

concurrency:
  group: one-time-r6-authorized-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Dispatch canonical R6 release and certification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_SHA: 9062e5a47d255d4b75ba16de6585b0c61f908573
      ORCHESTRATOR_PATH: .github/workflows/one-time-r6-authorized-orchestrator.yml
      FINAL_EVIDENCE_PATH: deploy-evidence/r6-final-production-certification-9062e5a47d25.json

    steps:
      - name: Prove target remains on main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const target = process.env.TARGET_SHA;
            const compare = await github.rest.repos.compareCommits({ owner, repo, base: target, head: 'main' });
            if (!['ahead', 'identical'].includes(compare.data.status)) {
              core.setFailed(`Target ${target} is not an ancestor of main: ${compare.data.status}`);
            }

      - name: Dispatch canonical full ALU release
        id: dispatch_deploy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = 'alu-build-deploy.yml';
            const before = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 50 });
            const known = new Set(before.data.workflow_runs.map(run => run.id));
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: 'main',
              inputs: { scope: 'full', confirm: 'alu', target_sha: process.env.TARGET_SHA },
            });
            for (let attempt = 0; attempt < 40; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 3000));
              const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 20 });
              const created = runs.data.workflow_runs.find(run => !known.has(run.id));
              if (created) {
                core.setOutput('run_id', String(created.id));
                core.setOutput('html_url', created.html_url);
                console.log(`Canonical deploy run: ${created.html_url}`);
                return;
              }
            }
            core.setFailed('Canonical deploy workflow dispatch was not observed');

      - name: Wait for canonical full ALU release
        id: wait_deploy
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ steps.dispatch_deploy.outputs.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = Number(process.env.RUN_ID);
            if (!run_id) return core.setFailed('Missing canonical deploy run id');
            for (let attempt = 0; attempt < 480; attempt++) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
              if (run.status === 'completed') {
                core.setOutput('conclusion', run.conclusion || 'unknown');
                console.log(`Canonical deploy completed: ${run.conclusion} ${run.html_url}`);
                if (run.conclusion !== 'success') core.setFailed(`Canonical deploy failed: ${run.conclusion}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed('Canonical deploy did not complete within orchestrator window');

      - name: Dispatch R6 post-release certification
        id: dispatch_cert
        if: steps.wait_deploy.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = 'r6-post-release-certification.yml';
            const before = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 50 });
            const known = new Set(before.data.workflow_runs.map(run => run.id));
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: 'main',
              inputs: { target_sha: process.env.TARGET_SHA, confirm: 'alu' },
            });
            for (let attempt = 0; attempt < 40; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 3000));
              const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 20 });
              const created = runs.data.workflow_runs.find(run => !known.has(run.id));
              if (created) {
                core.setOutput('run_id', String(created.id));
                core.setOutput('html_url', created.html_url);
                console.log(`R6 certification run: ${created.html_url}`);
                return;
              }
            }
            core.setFailed('R6 certification workflow dispatch was not observed');

      - name: Wait for R6 post-release certification
        id: wait_cert
        if: steps.dispatch_cert.outcome == 'success'
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ steps.dispatch_cert.outputs.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = Number(process.env.RUN_ID);
            if (!run_id) return core.setFailed('Missing certification run id');
            for (let attempt = 0; attempt < 480; attempt++) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
              if (run.status === 'completed') {
                core.setOutput('conclusion', run.conclusion || 'unknown');
                console.log(`R6 certification completed: ${run.conclusion} ${run.html_url}`);
                if (run.conclusion !== 'success') core.setFailed(`R6 certification failed: ${run.conclusion}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed('R6 certification did not complete within orchestrator window');

      - name: Verify recorded PILOT-GO evidence
        id: verdict
        if: steps.wait_cert.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = process.env.FINAL_EVIDENCE_PATH;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                const payload = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
                console.log(JSON.stringify({ status: payload.status, candidate_sha: payload.candidate_sha, workflow_run_id: payload.workflow_run_id }, null, 2));
                if (payload.candidate_sha !== process.env.TARGET_SHA) return core.setFailed(`Evidence SHA mismatch: ${payload.candidate_sha}`);
                if (payload.status !== 'PILOT-GO') return core.setFailed(`Final R6 verdict is ${payload.status}`);
                core.setOutput('status', payload.status);
                return;
              } catch (error) {
                if (error.status !== 404) throw error;
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
            core.setFailed(`Final evidence not found at ${path}`);

      - name: Record orchestrator outcome
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_RUN_ID: ${{ steps.dispatch_deploy.outputs.run_id }}
          CERT_RUN_ID: ${{ steps.dispatch_cert.outputs.run_id }}
          DEPLOY_OUTCOME: ${{ steps.wait_deploy.outcome }}
          CERT_OUTCOME: ${{ steps.wait_cert.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          VERDICT_STATUS: ${{ steps.verdict.outputs.status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const status = process.env.VERDICT_STATUS === 'PILOT-GO' && process.env.VERDICT_OUTCOME === 'success' ? 'PILOT-GO' : 'BLOCKED';
            const payload = {
              format: 'forge-r6-authorized-orchestrator/v1',
              target_sha: process.env.TARGET_SHA,
              completed_at: new Date().toISOString(),
              authorization: 'USER_EXPLICIT',
              canonical_deploy_workflow: 'alu-build-deploy.yml',
              certification_workflow: 'r6-post-release-certification.yml',
              deploy_run_id: process.env.DEPLOY_RUN_ID || null,
              certification_run_id: process.env.CERT_RUN_ID || null,
              outcomes: {
                deploy: process.env.DEPLOY_OUTCOME || 'not-run',
                certification: process.env.CERT_OUTCOME || 'not-run',
                verdict: process.env.VERDICT_OUTCOME || 'not-run',
              },
              status,
            };
            const path = `deploy-evidence/r6-authorized-orchestrator-${process.env.TARGET_SHA.slice(0,12)}.json`;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              message: `ops(r6): record authorized orchestrator ${status}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              ...(sha ? { sha } : {}),
            });

      - name: Remove one-time orchestrator
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = process.env.ORCHESTRATOR_PATH;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              await github.rest.repos.deleteFile({
                owner,
                repo,
                path,
                branch: 'main',
                sha: current.data.sha,
                message: 'chore(r6): remove completed authorized orchestrator',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Enforce final R6 verdict
        if: always()
        shell: bash
        run: |
          test '${{ steps.wait_deploy.outcome }}' = success
          test '${{ steps.wait_cert.outcome }}' = success
          test '${{ steps.verdict.outputs.status }}' = PILOT-GO
          echo "R6_DONE target=$TARGET_SHA verdict=PILOT-GO"
