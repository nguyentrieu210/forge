name: One-time R6 Authorized Orchestrator

on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-r6-authorized-orchestrator.yml"]

permissions:
  actions: write
  contents: write

concurrency:
  group: one-time-r6-authorized-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Dispatch canonical R6 release and certification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_SHA: 49315112a21182d2ce077b08a1fb9e26db07fd36
      ORCHESTRATOR_PATH: .github/workflows/one-time-r6-authorized-orchestrator.yml
      FINAL_EVIDENCE_PATH: deploy-evidence/r6-final-production-certification-49315112a211.json

    steps:
      - name: Dispatch and wait for governed R6 workflows
        id: execute
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const target = process.env.TARGET_SHA;
            const compare = await github.rest.repos.compareCommits({ owner, repo, base: target, head: 'main' });
            if (!['ahead', 'identical'].includes(compare.data.status)) {
              core.setOutput('status', 'BLOCKED');
              core.setOutput('reason', `target_not_on_main:${compare.data.status}`);
              return;
            }
            async function dispatchAndWait(workflow_id, inputs) {
              const before = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 50 });
              const known = new Set(before.data.workflow_runs.map(run => run.id));
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: 'main', inputs });
              let run;
              for (let attempt = 0; attempt < 40; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 3000));
                const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 20 });
                run = runs.data.workflow_runs.find(candidate => !known.has(candidate.id));
                if (run) break;
              }
              if (!run) return { run_id: null, conclusion: 'dispatch-not-observed' };
              for (let attempt = 0; attempt < 480; attempt++) {
                const observed = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
                if (observed.data.status === 'completed') {
                  return { run_id: String(run.id), conclusion: observed.data.conclusion || 'unknown', url: observed.data.html_url };
                }
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
              return { run_id: String(run.id), conclusion: 'timeout', url: run.html_url };
            }
            const deploy = await dispatchAndWait('alu-build-deploy.yml', { scope: 'full', confirm: 'alu', target_sha: target });
            core.setOutput('deploy_run_id', deploy.run_id || '');
            core.setOutput('deploy_conclusion', deploy.conclusion);
            console.log(`canonical deploy: ${JSON.stringify(deploy)}`);
            if (deploy.conclusion !== 'success') {
              core.setOutput('status', 'BLOCKED');
              core.setOutput('reason', `deploy:${deploy.conclusion}`);
              return;
            }
            const cert = await dispatchAndWait('r6-post-release-certification.yml', { target_sha: target, confirm: 'alu' });
            core.setOutput('cert_run_id', cert.run_id || '');
            core.setOutput('cert_conclusion', cert.conclusion);
            console.log(`certification: ${JSON.stringify(cert)}`);
            if (cert.conclusion !== 'success') {
              core.setOutput('status', 'BLOCKED');
              core.setOutput('reason', `certification:${cert.conclusion}`);
              return;
            }
            let verdict;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path: process.env.FINAL_EVIDENCE_PATH, ref: 'main' });
                verdict = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
            const ok = verdict?.candidate_sha === target && verdict?.status === 'PILOT-GO';
            core.setOutput('status', ok ? 'PILOT-GO' : 'BLOCKED');
            core.setOutput('reason', ok ? 'evidence_23_of_23' : `verdict:${verdict?.status || 'missing'}`);

      - name: Record orchestrator outcome
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.execute.outputs.status }}
          REASON: ${{ steps.execute.outputs.reason }}
          DEPLOY_RUN_ID: ${{ steps.execute.outputs.deploy_run_id }}
          DEPLOY_CONCLUSION: ${{ steps.execute.outputs.deploy_conclusion }}
          CERT_RUN_ID: ${{ steps.execute.outputs.cert_run_id }}
          CERT_CONCLUSION: ${{ steps.execute.outputs.cert_conclusion }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const payload = {
              format: 'forge-r6-authorized-orchestrator/v2',
              target_sha: process.env.TARGET_SHA,
              completed_at: new Date().toISOString(),
              authorization: 'USER_EXPLICIT',
              canonical_deploy_workflow: 'alu-build-deploy.yml',
              certification_workflow: 'r6-post-release-certification.yml',
              deploy_run_id: process.env.DEPLOY_RUN_ID || null,
              certification_run_id: process.env.CERT_RUN_ID || null,
              outcomes: { deploy: process.env.DEPLOY_CONCLUSION || 'not-run', certification: process.env.CERT_CONCLUSION || 'not-run' },
              reason: process.env.REASON || null,
              status: process.env.STATUS || 'BLOCKED',
            };
            const path = `deploy-evidence/r6-authorized-orchestrator-${process.env.TARGET_SHA.slice(0,12)}.json`;
            let sha;
            try { const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' }); sha = existing.data.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', message: `ops(r6): record authorized orchestrator ${payload.status}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'), ...(sha ? { sha } : {}),
            });

      - name: Remove one-time orchestrator
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path: process.env.ORCHESTRATOR_PATH, ref: 'main' });
              await github.rest.repos.deleteFile({ owner, repo, path: process.env.ORCHESTRATOR_PATH, branch: 'main', sha: current.data.sha, message: 'chore(r6): remove completed authorized orchestrator' });
            } catch (error) { if (error.status !== 404) throw error; }

      - name: Enforce final R6 verdict
        if: always()
        shell: bash
        run: |
          test '${{ steps.execute.outputs.status }}' = PILOT-GO
          echo "R6_DONE target=$TARGET_SHA verdict=PILOT-GO"
