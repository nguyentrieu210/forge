name: Issue 941 Apply Source Fix

on:
  push:
    branches:
      - agent/alumdoor-cutting-policy-tam-lien-uc

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-941-source-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Restore source fixture only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/briefs/alumdoor.json';
          const brief = JSON.parse(fs.readFileSync(path, 'utf8'));
          const name = 'Cửa tấm liền Úc — công thức chuẩn';
          if (!Array.isArray(brief.fixtures)) throw new Error('brief.fixtures missing');
          if (brief.fixtures.some((entry) => entry.type === 'Cutting Policy' && entry.name === name)) {
            throw new Error('source fixture already exists; refuse duplicate/implicit rewrite');
          }
          const anchor = brief.fixtures.findIndex((entry) => entry.type === 'Cutting Policy' && entry.name === 'Cửa Úc — công thức chuẩn');
          if (anchor < 0) throw new Error('Cửa Úc fixture anchor missing');
          brief.fixtures.splice(anchor + 1, 0, {
            type: 'Cutting Policy',
            name,
            data: {
              policy_name: name,
              door_type: 'Cửa tấm liền Úc',
              dealer_width_basis: 'Phủ bì ray',
              retail_width_basis: 'Phủ bì ray',
              dealer_cut_deduction_m: 0.03,
              retail_cut_deduction_m: 0.03,
              dealer_split_sales_basis: 'Phủ bì ray',
              dealer_full_sales_basis: 'Phủ bì ray',
              retail_sales_basis: 'Phủ bì ray',
              purchase_formula: 'Kg thực tế',
              note: 'Bán theo Cao PB × PB ray. Chia lá tấm liền: (Cao PB − 0,13) ÷ 0,068. Hai số trừ 0,03 là dữ liệu tương thích legacy từ migration 0128; hình học cắt hiện do Geometry Rules theo loại ray quyết định.',
              leaf_height_deduction_m: 0.13,
              leaf_rounding: 'Làm tròn xuống',
              leaf_formula: 'Kiểu tấm liền Úc',
              leaf_divisor_source: 'Hằng số của chính sách',
              leaf_divisor_const: 0.068
            }
          });
          fs.writeFileSync(path, JSON.stringify(brief, null, 2) + '\n');
          NODE
          read added removed < <(git diff --numstat -- server/briefs/alumdoor.json)
          echo "alumdoor.json added=$added removed=$removed"
          test "${added:-9999}" -le 80
          test "${removed:-9999}" -le 20
          git diff --check -- server/briefs/alumdoor.json

      - name: Add structured regression
        run: |
          cat > server/tests/alumdoor-tam-lien-uc-policy-source.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import {
            CUTTING_POLICIES,
            assertCuttingPolicyCatalog,
          } from "../scripts/lib/alumdoor-cutting-policy-catalog.mjs";

          const SOURCE = new URL("../briefs/alumdoor.json", import.meta.url);
          const POLICY_NAME = "Cửa tấm liền Úc — công thức chuẩn";

          async function sourceFixture() {
            const brief = JSON.parse(await readFile(SOURCE, "utf8"));
            return brief.fixtures.find((entry) => entry.type === "Cutting Policy" && entry.name === POLICY_NAME);
          }

          test("tấm liền Úc source fixture preserves the evidence-backed commercial and leaf contract", async () => {
            const fixture = await sourceFixture();
            assert.ok(fixture, `missing source fixture ${POLICY_NAME}`);
            assert.equal(fixture.data.policy_name, POLICY_NAME);
            assert.equal(fixture.data.door_type, "Cửa tấm liền Úc");
            assert.equal(fixture.data.dealer_width_basis, "Phủ bì ray");
            assert.equal(fixture.data.retail_width_basis, "Phủ bì ray");
            assert.equal(fixture.data.dealer_split_sales_basis, "Phủ bì ray");
            assert.equal(fixture.data.dealer_full_sales_basis, "Phủ bì ray");
            assert.equal(fixture.data.retail_sales_basis, "Phủ bì ray");
            assert.equal(fixture.data.purchase_formula, "Kg thực tế");
            assert.equal(fixture.data.leaf_formula, "Kiểu tấm liền Úc");
            assert.equal(fixture.data.leaf_height_deduction_m, 0.13);
            assert.equal(fixture.data.leaf_divisor_source, "Hằng số của chính sách");
            assert.equal(fixture.data.leaf_divisor_const, 0.068);
            assert.equal(fixture.data.leaf_rounding, "Làm tròn xuống");
            assert.equal(fixture.data.ray_type, undefined, "ray type is a per-line choice, not a fixed policy default");
          });

          test("tấm liền Úc live geometry stays ray-specific in the canonical catalog", () => {
            assert.equal(assertCuttingPolicyCatalog(), true);
            const policy = CUTTING_POLICIES.find((entry) => entry.name === POLICY_NAME);
            assert.ok(policy, `missing canonical policy ${POLICY_NAME}`);
            assert.equal(policy.code, "CP-CUA-TAM-LIEN-UC");
            assert.equal(policy.geometryProfile, "GP-CUA-UC");

            const u70 = policy.rules.find((entry) => entry.code === "TLUC-RCL-U70");
            const u76 = policy.rules.find((entry) => entry.code === "TLUC-RCL-U76");
            assert.deepEqual(
              { target: u70?.targetField, source: u70?.sourceField, operator: u70?.operator, operand: u70?.operandM, ray: u70?.conditions.ray_type },
              { target: "CAT_LA_RONG", source: "PB_RAY_RONG", operator: "SUBTRACT", operand: 0.05, ray: "Ray sắt U70" },
            );
            assert.deepEqual(
              { target: u76?.targetField, source: u76?.sourceField, operator: u76?.operator, operand: u76?.operandM, ray: u76?.conditions.ray_type },
              { target: "CAT_LA_RONG", source: "PB_RAY_RONG", operator: "SUBTRACT", operand: 0.08, ray: "Ray hộp/đơn U76" },
            );
          });
          TEST
          node --test server/tests/alumdoor-tam-lien-uc-policy-source.test.mjs

      - name: Server build
        run: pnpm run server:build

      - name: Diff hygiene
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit source fix and remove temporary workflow
        run: |
          rm .github/workflows/issue-941-apply-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/briefs/alumdoor.json server/tests/alumdoor-tam-lien-uc-policy-source.test.mjs .github/workflows/issue-941-apply-source.yml
          git commit -m "fix(alumdoor): restore tấm liền Úc source policy [issue-941-source-applied]"
          git push origin HEAD:agent/alumdoor-cutting-policy-tam-lien-uc
