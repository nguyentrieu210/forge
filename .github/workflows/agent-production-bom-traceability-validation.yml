name: Agent Production BOM Traceability Validation

on:
  push:
    branches:
      - agent/alumdoor-production-bom-traceability

permissions:
  contents: read

concurrency:
  group: agent-production-bom-traceability
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted]
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Typecheck MetaForge views
        shell: powershell
        run: pnpm --filter @metaforge/views typecheck

      - name: Diff hygiene
        shell: powershell
        run: git diff --check HEAD^...HEAD

      - name: Sentrux snapshot
        shell: powershell
        continue-on-error: true
        run: sentrux gate --save .
