name: WS11 temporary approved validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ent-11-security-iam-saas
          fetch-depth: 0
      - name: Normalize branch-owned compile blockers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/apps/control-plane-worker/src/entitlement-store.ts')
          text = path.read_text()
          text = text.replace('import type { JsonObject } from "../../../packages/contracts/src/index.js";\n', '')
          text = text.replace('export interface StoredPlanEntitlement extends JsonObject {', 'export interface StoredPlanEntitlement {')
          text = text.replace('throw errors.conflict("Plan entitlement version changed");', 'throw errors.version(current?.version);')
          path.write_text(text)

          path = Path('server/packages/auth/src/mfa.ts')
          text = path.read_text().replace(
              '  private readonly keys?: MfaKeyRing;',
              '  private readonly keys: MfaKeyRing | undefined;',
          )
          path.write_text(text)

          path = Path('server/packages/organization-security/src/network-policy.ts')
          text = path.read_text()
          text = text.replace('  let parsed = value;', '  let parsed: unknown = value;')
          text = text.replace(
              '      output[index] &= (0xff << (8 - remaining)) & 0xff;',
              '      output[index] = output[index]! & ((0xff << (8 - remaining)) & 0xff);',
          )
          path.write_text(text)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build server
        run: pnpm --filter cloudforge run build
      - name: Security regressions
        working-directory: server
        run: node --test tests/security-recent-auth.test.mjs tests/authentication-context.test.mjs tests/native-security.test.mjs tests/security-alerts.test.mjs tests/session-registry.test.mjs tests/mfa-service.test.mjs tests/mfa-routes.test.mjs tests/mfa-config.test.mjs tests/login-mfa.test.mjs tests/user-session-registry-migration.test.mjs tests/user-mfa-totp-migration.test.mjs tests/network-policy.test.mjs tests/plan-entitlements.test.mjs tests/control-route-governance.test.mjs
      - name: Security SQL regressions
        working-directory: server
        run: |
          python3 scripts/test-user-session-registry-migration.py
          python3 scripts/test-user-mfa-totp-migration.py
          python3 scripts/test-control-route-governance-migration.py
          python3 scripts/test-plan-entitlements-migration.py
      - name: Worker typecheck
        run: pnpm --filter cloudforge run typecheck:workers
      - name: Persist validated compile fixes and remove temporary workflow
        run: |
          git rm .github/workflows/ws11-pr-validation-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/apps/control-plane-worker/src/entitlement-store.ts server/packages/auth/src/mfa.ts server/packages/organization-security/src/network-policy.ts
          git commit -m "fix(ws11): close exact-head security compile blockers"
          git push origin HEAD:agent/ent-11-security-iam-saas
