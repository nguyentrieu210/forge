name: V3-07 UI QA Temporary Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "client/apps/demo/**"
      - "client/e2e-forge/**"
      - "client/packages/**"
      - "docs/agents/ui-v3/**"
      - "docs/design/FORGE_VBEN_NEXT_UI_V3_TECHNICAL_SPEC_20260804.md"
      - ".github/workflows/ui-v3-07-qa-temp.yml"

permissions:
  contents: read

concurrency:
  group: ui-v3-07-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mobile-qa:
    if: github.head_ref == 'ui/v3-07-mobile-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR merge candidate
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 1

      - name: Record candidate SHA
        run: |
          echo "PR_HEAD=${{ github.event.pull_request.head.sha }}"
          echo "PR_BASE=${{ github.event.pull_request.base.sha }}"
          echo "MERGE_CANDIDATE=$(git rev-parse HEAD)"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm 9.15
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @metaforge/demo exec playwright install --with-deps chromium

      - name: Build demo dependency graph
        id: demo_build
        continue-on-error: true
        run: pnpm --filter @metaforge/demo... run build

      - name: Run cross-device demo matrix
        id: demo_test
        if: steps.demo_build.outcome == 'success'
        run: pnpm --filter @metaforge/demo run e2e:v3:qa

      - name: Record demo dependency blocker
        if: steps.demo_build.outcome != 'success'
        run: echo "::warning::Demo matrix is blocked by the existing @metaforge/builder TypeScript build failure owned by V3-06; runtime QA continues independently."

      - name: Build runtime dependency graph
        id: runtime_build
        run: pnpm --filter runtime... run build

      - name: Run runtime login/mobile matrix
        id: runtime_test
        run: pnpm --filter e2e-forge exec playwright test --config playwright.v3-mobile-qa.config.ts

      - name: V3-07 independent gate summary
        if: always()
        run: |
          echo "demo_build=${{ steps.demo_build.outcome }}"
          echo "demo_test=${{ steps.demo_test.outcome }}"
          echo "runtime_build=${{ steps.runtime_build.outcome }}"
          echo "runtime_test=${{ steps.runtime_test.outcome }}"
          test "${{ steps.runtime_build.outcome }}" = "success"
          test "${{ steps.runtime_test.outcome }}" = "success"

      - name: Upload V3-07 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-07-ui-qa-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          path: |
            client/apps/demo/playwright-report/v3-mobile-qa/**
            client/apps/demo/test-results/**
            client/e2e-forge/playwright-report/v3-mobile-qa/**
            client/e2e-forge/test-results/v3-mobile-qa/**
