name: Temporary Patch Surface Finish Exclusions

on:
  push:
    paths:
      - '.github/workflows/_tmp-patch-surface-finish-exclusions.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alumdoor-surface-finish-exclusions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch schema, resolver and tests
        shell: python
        run: |
          from pathlib import Path
          from copy import deepcopy
          import json
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          # 1) Surface Finish schema: include groups + excluded groups + excluded items.
          brief_path = Path('server/briefs/alumdoor.json')
          brief = json.loads(brief_path.read_text(encoding='utf-8'))
          surface = next(d for d in brief['doctypes'] if d['name'] == 'Surface Finish')

          def fieldname(field):
              if isinstance(field, str):
                  return field.split(':', 1)[0].strip()
              return field.get('fieldname', '')

          names = [fieldname(f) for f in surface['fields']]
          if 'excluded_groups' not in names:
              anchor = names.index('applies_to_all_groups') + 1
              surface['fields'][anchor:anchor] = [
                  {
                      'fieldname': 'excluded_groups',
                      'fieldtype': 'Table',
                      'options': 'Surface Finish Excluded Group',
                      'label': 'Nhóm SP loại trừ',
                      'description': 'Loại cả nhóm và mọi nhóm con, dù nhóm cha đang nằm trong phạm vi áp dụng.'
                  },
                  {
                      'fieldname': 'excluded_items',
                      'fieldtype': 'Table',
                      'options': 'Surface Finish Excluded Item',
                      'label': 'Mặt hàng loại trừ',
                      'description': 'Loại từng Item cụ thể, dù Item thuộc Nhóm SP đang được áp dụng.'
                  },
              ]

          doctypes = {d['name']: d for d in brief['doctypes']}
          scope_dt = doctypes['Surface Finish Scope']
          if 'Surface Finish Excluded Group' not in doctypes:
              excluded_group = deepcopy(scope_dt)
              excluded_group['name'] = 'Surface Finish Excluded Group'
              excluded_group['label'] = 'Nhóm SP loại trừ (Bề mặt)'
              brief['doctypes'].append(excluded_group)
          if 'Surface Finish Excluded Item' not in doctypes:
              excluded_item = deepcopy(scope_dt)
              excluded_item['name'] = 'Surface Finish Excluded Item'
              excluded_item['label'] = 'Mặt hàng loại trừ (Bề mặt)'
              excluded_item['title'] = 'item_code'
              excluded_item['fields'] = ['item_code:Link(Item)! Mặt hàng']
              brief['doctypes'].append(excluded_item)

          parts = str(brief.get('version', '1.27.4')).split('.')
          if len(parts) == 3 and parts[:2] == ['1', '27'] and int(parts[2]) < 5:
              brief['version'] = '1.27.5'
          brief_path.write_text(json.dumps(brief, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2) Canonical Surface Finish payload always owns the exclusion fields too.
          catalog_path = Path('server/scripts/lib/alumdoor-color-catalog.mjs')
          catalog = catalog_path.read_text(encoding='utf-8')
          old = '''    applies_to_groups: (finish.groups ?? []).map((itemGroup, index) => ({
      row_id: `SCOPE-${String(index + 1).padStart(2, "0")}`,
      item_group: itemGroup,
    })),
    applies_to_all_groups: Boolean(finish.appliesToAllGroups),'''
          new = '''    applies_to_groups: (finish.groups ?? []).map((itemGroup, index) => ({
      row_id: `SCOPE-${String(index + 1).padStart(2, "0")}`,
      item_group: itemGroup,
    })),
    excluded_groups: (finish.excludedGroups ?? []).map((itemGroup, index) => ({
      row_id: `EX-GROUP-${String(index + 1).padStart(2, "0")}`,
      item_group: itemGroup,
    })),
    excluded_items: (finish.excludedItems ?? []).map((itemCode, index) => ({
      row_id: `EX-ITEM-${String(index + 1).padStart(2, "0")}`,
      item_code: itemCode,
    })),
    applies_to_all_groups: Boolean(finish.appliesToAllGroups),'''
          catalog = replace_once(catalog, old, new, 'catalog exclusion payload')
          catalog_path.write_text(catalog, encoding='utf-8')

          # 3) Resolver: include scope first; exclusions have final precedence.
          resolver_path = Path('server/apps-src/alumdoor-worker/src/color-scopes.ts')
          resolver = resolver_path.read_text(encoding='utf-8')
          old = '''function scopeGroups(entity: Json): string[] {
  if (!Array.isArray(entity.applies_to_groups)) return [];
  return entity.applies_to_groups
    .filter((row): row is Json => Boolean(row) && typeof row === "object" && !Array.isArray(row))
    .map((row) => text(row.item_group))
    .filter(Boolean);
}'''
          new = '''function tableRows(value: unknown): Json[] {
  if (!Array.isArray(value)) return [];
  return value.filter((row): row is Json => Boolean(row) && typeof row === "object" && !Array.isArray(row));
}

function groupTable(entity: Json, field: "applies_to_groups" | "excluded_groups"): string[] {
  return tableRows(entity[field]).map((row) => text(row.item_group)).filter(Boolean);
}

function itemTable(entity: Json, field: "excluded_items"): string[] {
  return tableRows(entity[field]).map((row) => text(row.item_code)).filter(Boolean);
}

function scopeGroups(entity: Json): string[] {
  return groupTable(entity, "applies_to_groups");
}'''
          resolver = replace_once(resolver, old, new, 'resolver table helpers')

          old = '''/** Fail-closed: rỗng + không applies_to_all_groups = KHÔNG áp dụng cho nhóm nào. */
function finishAppliesToGroups(finish: Json, groupsInLineage: Set<string>): boolean {
  if (checked(finish.applies_to_all_groups)) return true;
  const scopes = scopeGroups(finish);
  if (!scopes.length) return false;
  return scopes.some((scope) => groupsInLineage.has(scope));
}'''
          new = '''/**
 * Fail-closed ở phía include; exclusion luôn thắng include.
 * - applies_to_groups / applies_to_all_groups quyết định có nằm trong phạm vi rộng hay không.
 * - excluded_groups loại cả một nhánh Item Group theo lineage.
 * - excluded_items loại đúng Item cụ thể.
 */
function finishAppliesToContext(finish: Json, groupsInLineage: Set<string>, itemCode = ""): boolean {
  const scopes = scopeGroups(finish);
  const included = checked(finish.applies_to_all_groups)
    || (scopes.length > 0 && scopes.some((scope) => groupsInLineage.has(scope)));
  if (!included) return false;

  const excludedGroups = groupTable(finish, "excluded_groups");
  if (excludedGroups.some((group) => groupsInLineage.has(group))) return false;

  const code = text(itemCode);
  if (code && itemTable(finish, "excluded_items").some((excluded) => excluded === code)) return false;
  return true;
}'''
          resolver = replace_once(resolver, old, new, 'resolver finish precedence')

          old = '''export async function allowedFinishesForGroup(
  call: ColorScopePlatformCall,
  itemGroup: string,
  usage: ColorUsage = "internal",
): Promise<Array<{ code: string; name: string; requires_color: boolean }>> {'''
          new = '''export async function allowedFinishesForGroup(
  call: ColorScopePlatformCall,
  itemGroup: string,
  usage: ColorUsage = "internal",
  itemCode = "",
): Promise<Array<{ code: string; name: string; requires_color: boolean }>> {'''
          resolver = replace_once(resolver, old, new, 'allowedFinishes signature')
          resolver = replace_once(
              resolver,
              '.filter((finish) => finishAppliesToGroups(finish, groups))',
              '.filter((finish) => finishAppliesToContext(finish, groups, itemCode))',
              'allowedFinishes exclusion filter',
          )

          old = '''export async function allowedColorNamesForGroup(
  call: ColorScopePlatformCall,
  itemGroup: string,
  usage: ColorUsage = "internal",
): Promise<string[]> {
  const finishes = await allowedFinishesForGroup(call, itemGroup, usage);'''
          new = '''export async function allowedColorNamesForGroup(
  call: ColorScopePlatformCall,
  itemGroup: string,
  usage: ColorUsage = "internal",
  itemCode = "",
): Promise<string[]> {
  const finishes = await allowedFinishesForGroup(call, itemGroup, usage, itemCode);'''
          resolver = replace_once(resolver, old, new, 'allowed colors item context')
          resolver = replace_once(
              resolver,
              'allowed_colors: await allowedColorNamesForGroup(call, itemGroup, usage),',
              'allowed_colors: await allowedColorNamesForGroup(call, itemGroup, usage, code),',
              'colorScopeForItem exclusion',
          )
          resolver = replace_once(
              resolver,
              'const allowedFinishes = await allowedFinishesForGroup(call, itemGroup, usage);',
              'const allowedFinishes = await allowedFinishesForGroup(call, itemGroup, usage, code);',
              'finishColorContext exclusion',
          )
          resolver = resolver.replace('`finishAppliesToGroups` đã pass', '`finishAppliesToContext` đã pass')
          resolver_path.write_text(resolver, encoding='utf-8')

          # 4) Resolver fixtures/tests prove both group and item exclusions.
          scope_test_path = Path('server/tests/alumdoor-color-scopes.test.mjs')
          scope_test = scope_test_path.read_text(encoding='utf-8')
          scope_test = replace_once(
              scope_test,
              '  "Cửa CN Đức": { parent_item_group: "Cửa thành phẩm" },\n',
              '  "Cửa CN Đức": { parent_item_group: "Cửa thành phẩm" },\n  "Cửa CN Đức thử nghiệm": { parent_item_group: "Cửa CN Đức" },\n',
              'test subgroup fixture',
          )
          old = '  { name: "SON_VAN_GO", finish_code: "SON_VAN_GO", finish_name: "SƠN VÂN GỖ", requires_color: true, applies_to_all_groups: false, applies_to_groups: scope(["Cửa CN Đức"]), usage_scope: "Mua & bán", disabled: false },'
          new = '  { name: "SON_VAN_GO", finish_code: "SON_VAN_GO", finish_name: "SƠN VÂN GỖ", requires_color: true, applies_to_all_groups: false, applies_to_groups: scope(["Cửa CN Đức"]), excluded_groups: scope(["Cửa CN Đức thử nghiệm"]), excluded_items: [{ row_id: "EX-I1", item_code: "AL595-BLOCKED" }], usage_scope: "Mua & bán", disabled: false },'
          scope_test = replace_once(scope_test, old, new, 'test finish exclusions')
          scope_test = replace_once(
              scope_test,
              '  AL548: { item_group: "Cửa CN Đức" },\n',
              '  AL548: { item_group: "Cửa CN Đức" },\n  "AL595-BLOCKED": { item_group: "Cửa CN Đức" },\n  "GERMAN-TEST-01": { item_group: "Cửa CN Đức thử nghiệm" },\n',
              'test item exclusions',
          )
          marker = '''test("SƠN VÂN GỖ hiện không có màu nào ngoài VÂN GỖ", async () => {
  const colors = await allowedColorNamesForGroupAndFinish(fakeCall(), "Cửa CN Đức", "SON_VAN_GO", "internal");
  assert.deepEqual(colors, ["VÂN GỖ"]);
});
'''
          addition = marker + '''

test("excluded_items thắng group include: Item bị loại không còn SƠN VÂN GỖ/VÂN GỖ", async () => {
  const result = await finishColorContextForItem(fakeCall(), "AL595-BLOCKED", undefined, "internal");
  assert.ok(!result.allowed_finishes.some((finish) => finish.code === "SON_VAN_GO"));
  assert.ok(!result.allowed_colors.includes("VÂN GỖ"));
});

test("excluded_groups thắng group cha include và loại toàn bộ nhánh con", async () => {
  const finishes = await allowedFinishesForGroup(fakeCall(), "Cửa CN Đức thử nghiệm", "internal");
  assert.ok(!finishes.some((finish) => finish.code === "SON_VAN_GO"));
  const item = await finishColorContextForItem(fakeCall(), "GERMAN-TEST-01", undefined, "internal");
  assert.ok(!item.allowed_finishes.some((finish) => finish.code === "SON_VAN_GO"));
});

test("exclusion không ảnh hưởng Item khác cùng nhóm đang được áp dụng", async () => {
  const result = await finishColorContextForItem(fakeCall(), "AL548", undefined, "internal");
  assert.ok(result.allowed_finishes.some((finish) => finish.code === "SON_VAN_GO"));
  assert.ok(result.allowed_colors.includes("VÂN GỖ"));
});
'''
          scope_test = replace_once(scope_test, marker, addition, 'resolver exclusion tests')
          scope_test_path.write_text(scope_test, encoding='utf-8')

          # 5) Catalog unit test proves serialization of both exclusion tables.
          catalog_test_path = Path('server/tests/alumdoor-color-catalog.test.mjs')
          catalog_test = catalog_test_path.read_text(encoding='utf-8')
          marker = '''test("SƠN TĨNH ĐIỆN / MẠ MÀU / SƠN VÂN GỖ: requires_color=true", () => {
  for (const code of ["SON_TINH_DIEN", "MA_MAU", "SON_VAN_GO"]) {
    const payload = alumdoorSurfaceFinishPayload(ALUMDOOR_SURFACE_FINISH_CATALOG.find((f) => f.code === code));
    assert.equal(payload.requires_color, true, code);
    assert.equal(payload.applies_to_all_groups, false, code);
  }
});
'''
          addition = marker + '''

test("Surface Finish payload hỗ trợ loại trừ theo Nhóm hàng và Item", () => {
  const payload = alumdoorSurfaceFinishPayload({
    code: "TEST",
    name: "TEST",
    groups: ["Cửa CN Đức"],
    excludedGroups: ["Cửa CN Đức thử nghiệm"],
    excludedItems: ["AL595-BLOCKED"],
    requiresColor: true,
  });
  assert.deepEqual(payload.excluded_groups.map((row) => row.item_group), ["Cửa CN Đức thử nghiệm"]);
  assert.deepEqual(payload.excluded_items.map((row) => row.item_code), ["AL595-BLOCKED"]);
});
'''
          catalog_test = replace_once(catalog_test, marker, addition, 'catalog exclusion test')
          catalog_test_path.write_text(catalog_test, encoding='utf-8')

          # 6) Seed/schema authority test ensures UI metadata actually exposes both tables.
          authority_path = Path('server/tests/alumdoor-color-seed-authority.test.mjs')
          authority = authority_path.read_text(encoding='utf-8')
          authority += '''\n\ntest("Surface Finish schema exposes group and item exclusions in base and V2 briefs", () => {\n  for (const relative of ["server/briefs/alumdoor.json", "server/briefs/alumdoor-v2.json"]) {\n    const brief = JSON.parse(readFileSync(join(repoRoot, relative), "utf8"));\n    const surface = brief.doctypes.find((row) => row.name === "Surface Finish");\n    assert.ok(surface, `${relative}: missing Surface Finish`);\n    const fieldNames = surface.fields.map((field) => typeof field === "string" ? field.split(":")[0].trim() : field.fieldname);\n    assert.ok(fieldNames.includes("excluded_groups"), `${relative}: missing excluded_groups`);\n    assert.ok(fieldNames.includes("excluded_items"), `${relative}: missing excluded_items`);\n    assert.ok(brief.doctypes.some((row) => row.name === "Surface Finish Excluded Group"));\n    assert.ok(brief.doctypes.some((row) => row.name === "Surface Finish Excluded Item"));\n  }\n});\n'''
          authority_path.write_text(authority, encoding='utf-8')

      - name: Regenerate V2 brief
        run: node server/scripts/build-alumdoor-v2-brief.mjs

      - name: Validate brief metadata
        working-directory: server
        run: |
          node scripts/forge-app.mjs briefs/alumdoor.json --dry-run
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run

      - name: Test canonical catalog/schema
        run: node --test server/tests/alumdoor-color-catalog.test.mjs server/tests/alumdoor-color-seed-authority.test.mjs

      - name: Build server and test exclusion resolver
        working-directory: server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          node --test tests/alumdoor-color-scopes.test.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/briefs/alumdoor.json server/briefs/alumdoor-v2.json server/scripts/lib/alumdoor-color-catalog.mjs server/apps-src/alumdoor-worker/src/color-scopes.ts server/tests/alumdoor-color-scopes.test.mjs server/tests/alumdoor-color-catalog.test.mjs server/tests/alumdoor-color-seed-authority.test.mjs
          git diff --cached --check
          git commit -m "feat(alumdoor): add Surface Finish exclusions"
          git push origin HEAD:fix/alumdoor-surface-finish-exclusions
