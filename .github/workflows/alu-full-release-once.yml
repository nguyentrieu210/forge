name: ALU Full Release Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alu-full-release-once.yml"

permissions:
  contents: read

concurrency:
  group: production-alu-full
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build and deploy full ALU release once
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      TARGET_SHA: 1cefa9b3ab0a3c62af349b51b1994d460f93ab60
      TENANT: alu
      APP_WORKER: cloudforge-app-alumdoor
      DISPATCH_NAMESPACE: cloudforge-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_FORGE_RELEASE_SHA: 1cefa9b3ab0a3c62af349b51b1994d460f93ab60

    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require target to be merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Refusing production full release: $TARGET_SHA is not merged into main."
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile frozen-install worktree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          for file in "${dirty[@]}"; do
            case "$file" in
              pnpm-lock.yaml)
                echo "Restoring exact candidate lockfile after successful frozen install."
                git restore --source=HEAD --staged --worktree -- pnpm-lock.yaml
                ;;
              *)
                echo "Refusing full release: dependency install changed unexpected source path: $file"
                exit 1
                ;;
            esac
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build once
        run: |
          pnpm --filter cloudforge run build
          pnpm --filter metaforge run build
          node server/scripts/stage-client-bundle.mjs

      - name: Guard full-release generated worktree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          for file in "${dirty[@]}"; do
            case "$file" in
              client/apps/kho/dist-mobile/*|server/apps/gateway-worker/public/*) ;;
              *)
                echo "Refusing full release: unexpected worktree change after exact build: $file"
                exit 1
                ;;
            esac
          done
          printf 'Approved generated release paths (%s):\n' "${#dirty[@]}"
          printf '  %s\n' "${dirty[@]}"

      - name: Plan tenant migrations
        working-directory: server
        run: node scripts/migrate-tenant.mjs --tenant "$TENANT"

      - name: Backup and verify tenant before migration
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/alu-backup"
          mkdir -p "$backup_dir"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$backup_dir"
          mapfile -t backups < <(find "$backup_dir" -maxdepth 1 -type f -name '*.sql' -print | sort)
          [ "${#backups[@]}" -eq 1 ] || {
            echo "Expected exactly one SQL backup, found ${#backups[@]}."
            exit 1
          }
          node server/scripts/verify-tenant-backup.mjs \
            --tenant "$TENANT" \
            --file "${backups[0]}" \
            --output "$RUNNER_TEMP/alu-backup-verification.json"

      - name: Migrate tenant
        working-directory: server
        run: node scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" --allow-dirty

      - name: Deploy tenant Worker
        working-directory: server
        run: node scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" --allow-dirty

      - name: Deploy Alumdoor app Worker
        working-directory: server
        run: |
          pnpm exec wrangler deploy \
            --config apps-src/alumdoor-worker/wrangler.jsonc \
            --name "$APP_WORKER" \
            --dispatch-namespace "$DISPATCH_NAMESPACE" \
            --strict

      - name: Deploy Gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Upload backup verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-backup-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-backup-verification.json
          if-no-files-found: warn
          retention-days: 30
