name: Verify Alumdoor Local Persistence

on:
  workflow_run:
    workflows: ["Bootstrap Alumdoor Local C Drive"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-alumdoor-local-persistence
  cancel-in-progress: true

jobs:
  post-cleanup-health:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted]
    timeout-minutes: 5
    env:
      FORGE_LOCAL_REQUIRED_SERVICES: backend,frontend
    steps:
      - name: Verify declared services after previous runner job cleanup
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'

          if (-not (Test-Path (Join-Path $target '.git'))) {
            throw 'C:\alumdoor is not an initialized Git workspace.'
          }

          & node scripts\local-runner\service-verification.mjs --services=$env:FORGE_LOCAL_REQUIRED_SERVICES
          if ($LASTEXITCODE -ne 0) {
            throw "Persistent required-service verification failed: $env:FORGE_LOCAL_REQUIRED_SERVICES"
          }

          Write-Host "LOCAL_PERSISTENCE_PASS required_services=$env:FORGE_LOCAL_REQUIRED_SERVICES"
          Write-Host 'Desk    : http://localhost:5173'
          Write-Host 'Backend : http://localhost:8799'
          git -C $target log -1 --oneline
