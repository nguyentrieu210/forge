name: RC-021 Critical Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "docs/agents/rc/RC-021-finance-ar-reconciliation.md"
      - ".github/workflows/rc021-validation.yml"

permissions:
  contents: read

concurrency:
  group: rc021-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rc021:
    if: github.head_ref == 'rc/w2-finance-ar-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Exact-main currently has unrelated TypeScript debt in MRP/QMS/CRM/App Registry.
      # Keep the baseline build visible, but do not let an inherited failure prevent
      # the RC-021 focused evidence from executing. tsc still emits dist by default.
      - name: Full server build baseline (inherited debt visible)
        continue-on-error: true
        run: pnpm run server:build

      - name: Verify emitted AR artifacts
        run: |
          test -f server/dist/packages/clouderp-selling/src/ar-sales-invoice-controller.js
          test -f server/dist/packages/clouderp-selling/src/finance-controllers.js
          test -f server/dist/packages/query/src/finance-aging.js

      - name: Focused RC-021 TypeScript check
        working-directory: server
        run: |
          cat > tsconfig.rc021.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": true,
              "declaration": false
            },
            "include": [
              "packages/clouderp-selling/src/ar-sales-invoice-controller.ts",
              "packages/clouderp-selling/src/controllers.ts",
              "packages/clouderp-selling/src/finance-controllers.ts",
              "packages/clouderp-selling/src/safe-finance-payment-entry.ts",
              "packages/clouderp-selling/src/types.ts",
              "packages/query/src/finance-aging.ts",
              "types/**/*.d.ts"
            ],
            "exclude": ["dist", "node_modules", "apps"]
          }
          JSON
          pnpm exec tsc -p tsconfig.rc021.json

      - name: Full worker typecheck baseline (inherited debt visible)
        continue-on-error: true
        run: pnpm run server:typecheck

      - name: Focused AR unit, integration, permission, failure and idempotency regressions
        working-directory: server
        run: >-
          node --test
          tests/finance-ar-rc021.test.mjs
          tests/finance-ar-migration-rc021.test.mjs
          tests/finance-aging-policy.test.mjs
          tests/finance-aging-query.test.mjs
          tests/o2c.test.mjs

      - name: AR SQL, tenant and reconciliation migration semantics
        working-directory: server
        run: |
          python3 scripts/verify-sql.py
          python3 scripts/test-finance-ar-reconciliation.py
