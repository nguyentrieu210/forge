name: Sentrux Alumdoor helper refine experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-10k-20260815

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt
          Q=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          echo "quality=$Q" >> "$GITHUB_OUTPUT"
          echo "BEFORE=$Q"

      - name: Refine same-file helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/sentrux-alumdoor-refine
          git diff --check
          git diff --stat -- server/apps-src/alumdoor-worker/src/index.ts

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Server typecheck
        run: pnpm run server:typecheck

      - name: Measure structure and score
        shell: bash
        env:
          BEFORE: ${{ steps.before.outputs.quality }}
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after.txt
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          max_cc = 25
          EOF
          sentrux check . 2>&1 | tee /tmp/structure.txt || true
          rm -rf .sentrux
          echo "REFINE_SCORE $BEFORE -> $AFTER delta=$((AFTER-BEFORE))"
          grep -E 'validateTransactionLines|calculateDoorBillableArea|validateAreaTransactionQuantity|validateSalesTransactionQuantity|validateOrdinarySalesQuantity|validateWidthSalesQuantity|validateLinearSalesQuantity|validateAluminiumMetreSalesQuantity|validateAluminiumPieceSalesQuantity|god file|circular dependencies' /tmp/structure.txt || true
          test "$AFTER" -gt "$BEFORE"
          ! grep -q 'Found [1-9][0-9]* circular dependencies' /tmp/structure.txt

      - name: Emit server dist
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec tsc -p tsconfig.json --noEmitOnError false --pretty false 2>&1 | tee /tmp/refine-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          test -f dist/apps-src/alumdoor-worker/src/index.js
          if [ "$status" -ne 0 ]; then
            grep 'error TS' /tmp/refine-tsc.log > /tmp/refine-errors.log || true
            cat /tmp/refine-errors.log
            if grep -E 'apps-src/alumdoor-worker/src/index\.ts' /tmp/refine-errors.log; then exit 1; fi
          fi

      - name: Focused tests
        working-directory: server
        run: node --test tests/alumdoor-item-validator.test.mjs tests/aluminum-item-validator-boundary.test.mjs
