name: RC4 A8 Reconcile Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rc4-a8-reconcile-validation.yml"
      - "server/apps/tenant-worker/src/aggregate-do.ts"
      - "server/packages/integration-hub/**"
      - "server/tests/integration-hub-*.test.mjs"
      - "docs/agents/rc4/RC4_A8_INTEGRATION_PROVIDER*.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: A8 changed-authority TypeScript guard
        shell: bash
        run: |
          set +e
          pnpm --dir server exec tsc -p tsconfig.json --noEmitOnError false 2>&1 | tee /tmp/a8-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          echo "repository_tsc_status=${status}"
          if grep 'error TS' /tmp/a8-tsc.log | grep -E 'packages/integration-hub/src/(einvoice-provider|queue-recovery)\.ts|apps/tenant-worker/src/aggregate-do\.ts'; then
            echo "TypeScript regression intersects reconciled A8 authority"
            exit 1
          fi
      - name: A8 adversarial regression slice
        working-directory: server
        run: node --test tests/integration-hub-einvoice-provider.test.mjs tests/integration-hub-kernel-registration.test.mjs tests/integration-hub-queue-recovery.test.mjs
      - name: Registry composition invariant
        shell: bash
        run: |
          grep -q 'registerIntegrationHubControllers' server/apps/tenant-worker/src/aggregate-do.ts
          grep -q 'registerAppFactoryControllers' server/apps/tenant-worker/src/aggregate-do.ts
          grep -q 'APP_FACTORY_APPROVAL_PROCESS_DOCTYPE' server/apps/tenant-worker/src/aggregate-do.ts
      - name: SQL and code diff safety
        run: |
          python3 server/scripts/verify-sql.py
          git fetch origin main
          git diff --check origin/main...HEAD -- server/apps/tenant-worker/src/aggregate-do.ts server/packages/integration-hub server/tests/integration-hub-einvoice-provider.test.mjs server/tests/integration-hub-kernel-registration.test.mjs server/tests/integration-hub-queue-recovery.test.mjs
