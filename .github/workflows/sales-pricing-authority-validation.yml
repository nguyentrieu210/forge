name: Sales Pricing Authority Validation

on:
  push:
    branches:
      - feat/sales-pricing-authority-20260811
  pull_request:
    branches:
      - docs/sales-commercial-architecture-20260811
    paths:
      - "server/packages/clouderp-pricing/**"
      - "server/packages/clouderp-selling/**"
      - "server/migrations/tenant/0117_sales_pricing_authority.sql"
      - "server/scripts/test-sales-pricing-authority-migration.py"
      - "server/tests/**"
      - ".github/workflows/sales-pricing-authority-validation.yml"

permissions:
  contents: read

concurrency:
  group: sales-pricing-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build server
        working-directory: server
        run: pnpm run build
      - name: Commercial pricing regressions
        working-directory: server
        run: node --test tests/commercial-pricing-policy.test.mjs tests/commercial-line-authority.test.mjs tests/sales-uom-pricing.test.mjs tests/sales-price-field-lookup.test.mjs tests/transaction-closure-sales-o2c.test.mjs
      - name: Pricing Rule migration replay
        working-directory: server
        run: python3 scripts/test-sales-pricing-authority-migration.py
      - name: Prebuild views dependencies
        run: |
          pnpm --filter @metaforge/charts run build
          pnpm --filter @metaforge/visual run build
      - name: Full server unit suite
        working-directory: server
        run: pnpm run test:unit
