name: CFMAX-06 Render Export Validation

on:
  push:
    branches:
      - cloudflare/cfmax-06-render-export
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfmax06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cfmax06:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: CFMAX-06 source regression
        run: node --test server/tests/cfmax-render-export.test.mjs

      - name: Build print UI package
        run: pnpm --filter @metaforge/views run build

      - name: Validate tenant Worker bundle and Browser Run binding
        working-directory: server
        run: |
          pnpm exec wrangler deploy --dry-run --config apps/tenant-worker/wrangler.jsonc --outdir /tmp/cfmax06-worker
          test -s /tmp/cfmax06-worker/index.js

      - name: Generate exact tenant binding types
        working-directory: server
        run: |
          pnpm exec wrangler types /tmp/cfmax06-worker-configuration.d.ts --config apps/tenant-worker/wrangler.jsonc --env-interface TenantWorkerBindings --include-runtime false
          grep -q 'BROWSER' /tmp/cfmax06-worker-configuration.d.ts
          grep -q 'index-cf6' /tmp/cfmax06-worker-configuration.d.ts
          cat /tmp/cfmax06-worker-configuration.d.ts

      - name: Full server build baseline
        continue-on-error: true
        run: pnpm run server:build
