name: Closure 02 Manufacturing Wire Temp

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/closure-02-manufacturing-wire-temp.yml"

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'rc/transaction-closure-02-manufacturing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/transaction-closure-02-manufacturing
          fetch-depth: 0

      - name: Harden Manufacturing MRP compile seams
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tenant = Path("server/apps/tenant-worker/src/index.ts")
          source = tenant.read_text()
          old = '''          listMaterialRequests: () => documents.listDocumentsByDoctype<JsonObject>(tenantId, "Material Request"),
          createCanonicalMaterialRequest: (document) => createDocumentThroughCore(request, env, "Material Request", document),'''
          new = '''          listMaterialRequests: () => documents.listDocumentsByDoctype<JsonObject>(tenantId, "Material Request"),
          getStockBalanceMicros: (itemCode, warehouse) => documents.getStockBalanceMicros(tenantId, itemCode, warehouse),
          createCanonicalMaterialRequest: (document) => createDocumentThroughCore(request, env, "Material Request", document),'''
          if old not in source:
              raise SystemExit("tenant-worker MRP context no longer matches audited source")
          tenant.write_text(source.replace(old, new, 1))

          bulk = Path("server/apps/tenant-worker/src/manufacturing-bom-bulk-api.ts")
          source = bulk.read_text()
          old_import = '''  previewBulkBomDraft,
  type BulkBomDraftInput,
} from "../../../packages/clouderp-erpnext/src/index.js";'''
          new_import = '''  previewBulkBomDraft,
  type BomQuantityBasis,
  type BulkBomDraftInput,
} from "../../../packages/clouderp-erpnext/src/index.js";'''
          if old_import not in source:
              raise SystemExit("bulk BOM import block no longer matches audited source")
          source = source.replace(old_import, new_import, 1)
          old_basis = '''      ...(row.qty_basis !== undefined ? { qty_basis: scalar(row.qty_basis) as BulkBomDraftInput["rows"][number]["qty_basis"] } : {}),'''
          new_basis = '''      ...(row.qty_basis !== undefined ? { qty_basis: scalar(row.qty_basis) as BomQuantityBasis } : {}),'''
          if old_basis not in source:
              raise SystemExit("bulk BOM qty_basis block no longer matches audited source")
          bulk.write_text(source.replace(old_basis, new_basis, 1))

          mrp = Path("server/packages/clouderp-erpnext/src/manufacturing-mrp.ts")
          source = mrp.read_text()
          old_root = '''    explodeBom({
      rootRowId: rowId,
      rootItemCode: itemCode,
      parentQtyMicros: qtyMicros,
      parentWarehouse: warehouse,
      scheduleDate,
      dimensions,
      selected,
      byItem,
      path: [itemCode],
      requirements,
      warnings,
      depth: 0,
    });'''
          new_root = '''    explodeBom({
      rootRowId: rowId,
      rootItemCode: itemCode,
      parentQtyMicros: qtyMicros,
      ...(warehouse ? { parentWarehouse: warehouse } : {}),
      ...(scheduleDate ? { scheduleDate } : {}),
      ...(dimensions ? { dimensions } : {}),
      selected,
      byItem,
      path: [itemCode],
      requirements,
      warnings,
      depth: 0,
    });'''
          if old_root not in source:
              raise SystemExit("MRP root explode block no longer matches audited source")
          source = source.replace(old_root, new_root, 1)

          old_child = '''      explodeBom({
        ...input,
        parentQtyMicros: requiredMicros,
        parentWarehouse: warehouse,
        // A subassembly may have its own dimensional semantics. Inheriting the finished
        // product dimensions would be guesswork, so only fixed rows are allowed below root
        // until an explicit dimension mapping contract exists.
        dimensions: undefined,
        selected: childBoms[0]!,
        path: [...input.path, row.item_code],
        depth: input.depth + 1,
      });'''
          new_child = '''      const { parentWarehouse: _parentWarehouse, dimensions: _dimensions, ...childInput } = input;
      explodeBom({
        ...childInput,
        parentQtyMicros: requiredMicros,
        ...(warehouse ? { parentWarehouse: warehouse } : {}),
        // A subassembly may have its own dimensional semantics. Inheriting the finished
        // product dimensions would be guesswork, so only fixed rows are allowed below root
        // until an explicit dimension mapping contract exists.
        selected: childBoms[0]!,
        path: [...input.path, row.item_code],
        depth: input.depth + 1,
      });'''
          if old_child not in source:
              raise SystemExit("MRP child explode block no longer matches audited source")
          mrp.write_text(source.replace(old_child, new_child, 1))
          PY

      - name: Commit branch-only Manufacturing wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/closure-02-manufacturing-wire-temp.yml
          git add server/apps/tenant-worker/src/index.ts \
                  server/apps/tenant-worker/src/manufacturing-bom-bulk-api.ts \
                  server/packages/clouderp-erpnext/src/manufacturing-mrp.ts
          git commit -m "fix(manufacturing): close MRP runtime wiring gaps"
          git push origin HEAD:rc/transaction-closure-02-manufacturing
