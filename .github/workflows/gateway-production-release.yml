name: Gateway Production Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact verified commit SHA used to build the candidate
        required: true
        type: string
      version_id:
        description: Immutable Cloudflare Worker version ID from release.json
        required: true
        type: string
      confirm:
        description: Type RELEASE_GATEWAY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-gateway
  cancel-in-progress: false

jobs:
  release:
    name: Promote Gateway version and smoke production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      VERSION_ID: ${{ inputs.version_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EVIDENCE_DIR: ${{ runner.temp }}/gateway-release-evidence
    steps:
      - name: Validate explicit release authorization
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.confirm }}' = 'RELEASE_GATEWAY'
          test "${#TARGET_SHA}" -eq 40
          test "$TARGET_SHA" = "${TARGET_SHA#refs/heads/}"
          printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-fA-F-]{16,}$'
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Set up Forge
        uses: ./.github/actions/setup-forge

      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf 'run_id=%s\ntarget_sha=%s\ngateway_version_id=%s\nstarted_at=%s\n' \
            "$GITHUB_RUN_ID" "$TARGET_SHA" "$VERSION_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$EVIDENCE_DIR/state.txt"

      - name: Verify immutable Worker version
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir server exec wrangler versions view "$VERSION_ID" \
            --config apps/gateway-worker/wrangler.jsonc \
            --json > "$EVIDENCE_DIR/version.json"
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/version.json','utf8'));if((v.id||v.version_id)!==process.env.VERSION_ID)process.exit(1)"
          echo 'version_verified=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Promote exact version to production
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/gateway-release-evidence/wrangler-output.ndjson
        run: |
          set -euo pipefail
          pnpm --dir server exec wrangler versions deploy "$VERSION_ID@100%" \
            --config apps/gateway-worker/wrangler.jsonc \
            -y 2>&1 | tee "$EVIDENCE_DIR/deploy.log"
          echo 'deploy=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://alu.kairo.vn'
          health=0
          root=0
          for attempt in $(seq 1 18); do
            health="$(curl --silent --show-error --output "$EVIDENCE_DIR/health.json" --write-out '%{http_code}' "$BASE/health" || true)"
            root="$(curl --silent --show-error --output "$EVIDENCE_DIR/root.html" --write-out '%{http_code}' "$BASE/" || true)"
            [ "$health" = '200' ] && [ "$root" = '200' ] && break
            sleep 5
          done
          boot="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' "$BASE/api/method/metaforge.api.get_boot" || true)"
          test "$health" = '200'
          test "$root" = '200'
          test "$boot" = '403'
          printf 'health=%s\nroot=%s\nguest_boot=%s\nsmoke=pass\n' "$health" "$root" "$boot" >> "$EVIDENCE_DIR/state.txt"

      - name: Verify provider deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          deployed="$(node -e "const fs=require('fs');const rows=fs.readFileSync(process.env.EVIDENCE_DIR+'/wrangler-output.ndjson','utf8').trim().split(/\\r?\\n/).filter(Boolean).map(JSON.parse);const row=[...rows].reverse().find(x=>x.type==='version-deploy');const ids=(row?.versions||row?.version_ids||[]).map(v=>typeof v==='string'?v:v.version_id||v.id);process.stdout.write(ids.includes(process.env.VERSION_ID)?process.env.VERSION_ID:'')")"
          test "$deployed" = "$VERSION_ID"
          echo 'provider_evidence=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-production-release-${{ inputs.version_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gateway-release-evidence/
          if-no-files-found: warn
          retention-days: 30
