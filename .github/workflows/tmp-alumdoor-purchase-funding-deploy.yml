name: Temp ALU Purchase Funding Backup Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tmp-alumdoor-purchase-funding-deploy.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: production-alu-full
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only ALU metadata scope diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Read tenant-scope counts
        shell: bash
        run: |
          set -euo pipefail
          runq() {
            local label="$1"
            local sql="$2"
            echo "### $label" >> "$RUNNER_TEMP/scope.txt"
            pnpm --dir server exec wrangler d1 execute cloudforge-alu --remote --json --command "$sql" >> "$RUNNER_TEMP/scope.txt"
            echo >> "$RUNNER_TEMP/scope.txt"
          }
          : > "$RUNNER_TEMP/scope.txt"
          runq doctype_definitions "SELECT tenant_id, COUNT(*) AS rows FROM doctype_definitions GROUP BY tenant_id ORDER BY tenant_id"
          runq documents "SELECT tenant_id, COUNT(*) AS rows FROM documents GROUP BY tenant_id ORDER BY tenant_id"
          runq installed_apps "SELECT tenant_id, COUNT(*) AS rows FROM installed_apps GROUP BY tenant_id ORDER BY tenant_id"
          runq metadata_provenance "SELECT tenant_id, modified_by, COUNT(*) AS rows FROM doctype_definitions GROUP BY tenant_id, modified_by ORDER BY tenant_id, rows DESC"
          runq demo_vs_standard "SELECT tenant_id, COUNT(*) AS rows, COUNT(DISTINCT doctype) AS doctypes FROM doctype_definitions WHERE tenant_id IN ('demo','__standard__') GROUP BY tenant_id ORDER BY tenant_id"
          runq foreign_metadata "SELECT tenant_id, doctype, module, modified_by FROM doctype_definitions WHERE tenant_id NOT IN ('alu','demo','__standard__') ORDER BY tenant_id, doctype LIMIT 30"
      - name: Report diagnosis to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'ALU_BACKUP_SCOPE_DIAGNOSIS_PRODUCTION'
            echo '```text'
            cat "$RUNNER_TEMP/scope.txt" 2>/dev/null || true
            echo '```'
          } > "$RUNNER_TEMP/comment.txt"
          gh pr comment 383 --body-file "$RUNNER_TEMP/comment.txt"
