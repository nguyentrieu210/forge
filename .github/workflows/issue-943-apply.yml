name: Issue 943 Apply

on:
  push:
    branches:
      - agent/alumdoor-tam-lien-ray-geometry

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-943-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply issue 943 patch
        run: |
          python .github/issue-943-prepatch.py
          python .github/issue-943-apply.py
          python .github/issue-943-postpatch.py
      - name: Generate metadata first pass
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cp server/briefs/alumdoor-v2.json /tmp/v2-first.json
      - name: Generate metadata second pass zero diff
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cmp -s /tmp/v2-first.json server/briefs/alumdoor-v2.json
      - name: Server build
        run: pnpm run server:build
      - name: Focused production flow and geometry tests
        run: |
          node --test server/tests/sales-production-flow.test.mjs
          node --test server/tests/alumdoor-geometry-policy.test.mjs
      - name: Brief check
        run: pnpm --dir server run brief:check
      - name: MetaForge typecheck
        run: pnpm --dir client run typecheck
      - name: MetaForge production build
        run: pnpm --dir client run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit product tree and remove temporary probes
        run: |
          rm -f .github/issue-943-apply.py
          rm -f .github/issue-943-prepatch.py
          rm -f .github/issue-943-postpatch.py
          rm -f .github/workflows/issue-943-trace.yml
          rm -f .github/workflows/issue-943-sales-meta-trace.yml
          rm -f .github/workflows/issue-943-runtime-shape.yml
          rm -f .github/workflows/issue-943-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/scripts/build-alumdoor-v2-brief.mjs server/briefs/alumdoor-v2.json \
                  server/apps-src/alumdoor-worker/src/sales-production-core.ts \
                  server/apps-src/alumdoor-worker/src/ui-child-preview.ts \
                  server/tests/sales-production-flow.test.mjs \
                  client/packages/views/src/app/vertical/alumdoor/sales-order-v2/model.ts \
                  client/packages/views/src/app/vertical/alumdoor/sales-order-v2/AlumdoorSalesOrderLineTable.tsx \
                  .github
          git diff --cached --check
          git commit -m "fix(alumdoor): use per-line ray geometry in production [issue-943-applied]"
          git push origin HEAD:agent/alumdoor-tam-lien-ray-geometry
