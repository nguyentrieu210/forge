name: Bootstrap Alumdoor Local C Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  bootstrap-local:
    runs-on: [self-hosted]
    timeout-minutes: 45
    env:
      FORGE_LOCAL_EXPECTED_SHA: ${{ github.sha }}
      FORGE_LOCAL_REPO_ROOT: C:\alumdoor
    steps:
      - name: Checkout exact bootstrap source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure C:\alumdoor source workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $repo = 'https://github.com/nguyentrieu210/forge.git'

          if (-not (Test-Path $target)) {
            git clone --branch main --single-branch $repo $target
            if ($LASTEXITCODE -ne 0) { throw 'Initial clone to C:\alumdoor failed' }
          } elseif (-not (Test-Path (Join-Path $target '.git'))) {
            $entries = @(Get-ChildItem -Force $target -ErrorAction SilentlyContinue)
            if ($entries.Count -gt 0) {
              throw 'C:\alumdoor exists with data but is not a Git repo; refusing to overwrite'
            }
            git clone --branch main --single-branch $repo $target
            if ($LASTEXITCODE -ne 0) { throw 'Initial clone to C:\alumdoor failed' }
          }

          $origin = (git -C $target remote get-url origin).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read git origin in C:\alumdoor' }
          if ($origin -notmatch 'github\.com[:/]nguyentrieu210/forge(?:\.git)?$') {
            throw "C:\alumdoor points to another repository: $origin"
          }

          $branch = (git -C $target rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'main') {
            throw "C:\alumdoor must stay on main; found '$branch'"
          }

          $excludeFile = Join-Path $target '.git\info\exclude'
          $safeLocalPatterns = @('.sentrux.local-backup/', 'package-lock.json')
          $existingExcludes = @()
          if (Test-Path $excludeFile) {
            $existingExcludes = @(Get-Content $excludeFile -ErrorAction SilentlyContinue)
          }
          foreach ($pattern in $safeLocalPatterns) {
            if ($existingExcludes -notcontains $pattern) {
              Add-Content -Path $excludeFile -Value $pattern
            }
          }

          # Preserve only the known service-generated source artifacts. Anything
          # outside this allowlist blocks bootstrap instead of being overwritten.
          $runtimeTracked = @(
            'run-local.bat',
            'server/scripts/alumdoor-runtime-service-host.mjs',
            'server/scripts/install-alumdoor-runtime-services.ps1'
          )
          $runtimeUntracked = @(
            'client/start-client.cmd',
            'server/start-worker.cmd'
          )

          $dirty = @(git -C $target status --porcelain=v1)
          if ($dirty.Count -gt 0) {
            $unexpected = @()
            foreach ($entry in $dirty) {
              if ($entry.Length -lt 4) {
                $unexpected += $entry
                continue
              }
              $status = $entry.Substring(0, 2)
              $path = $entry.Substring(3).Trim()
              $knownTracked = $runtimeTracked -contains $path
              $knownUntracked = ($status -eq '??') -and ($runtimeUntracked -contains $path)
              if (-not $knownTracked -and -not $knownUntracked) {
                $unexpected += $entry
              }
            }

            if ($unexpected.Count -gt 0) {
              Write-Host 'Unexpected local source changes:'
              $unexpected | ForEach-Object { Write-Host "  $_" }
              throw 'Bootstrap blocked to protect local source changes'
            }

            $backupRoot = Join-Path 'C:\ForgeServices\Alumdoor\source-backups' (Get-Date -Format 'yyyyMMdd-HHmmss')
            New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null
            foreach ($path in @($runtimeTracked + $runtimeUntracked)) {
              $sourcePath = Join-Path $target ($path -replace '/', '\')
              if (-not (Test-Path -LiteralPath $sourcePath)) { continue }
              $backupPath = Join-Path $backupRoot ($path -replace '/', '\')
              New-Item -ItemType Directory -Force -Path (Split-Path $backupPath -Parent) | Out-Null
              Copy-Item -LiteralPath $sourcePath -Destination $backupPath -Force
            }

            git -C $target restore --worktree --staged -- @runtimeTracked
            if ($LASTEXITCODE -ne 0) { throw 'Cannot restore tracked runtime-generated files' }
            foreach ($path in $runtimeUntracked) {
              $sourcePath = Join-Path $target ($path -replace '/', '\')
              if (Test-Path -LiteralPath $sourcePath) {
                Remove-Item -LiteralPath $sourcePath -Force
              }
            }

            $remaining = @(git -C $target status --porcelain=v1)
            if ($remaining.Count -gt 0) {
              $remaining | ForEach-Object { Write-Host "  $_" }
              throw 'Runtime cleanup did not return C:\alumdoor to a clean state'
            }
          }

          Write-Host 'Canonical workspace ready for guarded bootstrap:'
          git -C $target log -1 --oneline

      - name: Run exact-SHA bootstrap mutation contract
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = Join-Path $env:GITHUB_WORKSPACE 'scripts\local-runner\run-local-import.mjs'
          if (-not (Test-Path -LiteralPath $runner)) {
            throw "Exact-SHA bootstrap runner is missing: $runner"
          }
          $workspaceSha = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($workspaceSha -ne $env:FORGE_LOCAL_EXPECTED_SHA) {
            throw "Bootstrap workspace SHA mismatch expected=$env:FORGE_LOCAL_EXPECTED_SHA actual=$workspaceSha"
          }
          & node $runner bootstrap
          if ($LASTEXITCODE -ne 0) {
            throw "Bootstrap execution contract failed with exit code $LASTEXITCODE"
          }

      - name: Verify canonical source and local services
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:FORGE_LOCAL_EXPECTED_SHA) {
            throw "Post-bootstrap SHA mismatch expected=$env:FORGE_LOCAL_EXPECTED_SHA actual=$actual"
          }
          & node -e "Promise.all([fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(5000)}).then(r=>{if(![200,401,403].includes(r.status))throw new Error('backend '+r.status)}),fetch('http://127.0.0.1:5173',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)throw new Error('ui '+r.status)})]).catch(e=>{console.error(e);process.exit(1)})"
          if ($LASTEXITCODE -ne 0) { throw 'Post-bootstrap local service verification failed' }
          Write-Host "LOCAL_BOOTSTRAP_ACCEPTED sha=$actual"

      - name: Print local diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host '=== latest execution-layer evidence ==='
          $root = 'C:\alumdoor\local-backups\execution-layer\bootstrap'
          if (Test-Path $root) {
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 2 |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-ChildItem $_.FullName -File -ErrorAction SilentlyContinue |
                  ForEach-Object { Write-Host $_.Name }
              }
          }

          Write-Host '=== run-local.log (tail) ==='
          if (Test-Path 'C:\alumdoor\run-local.log') {
            Get-Content 'C:\alumdoor\run-local.log' -Tail 160
          }

          Write-Host '=== Windows service logs ==='
          if (Test-Path 'C:\ForgeServices\Alumdoor\logs') {
            Get-ChildItem 'C:\ForgeServices\Alumdoor\logs' -Recurse -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 4 |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue
              }
          }
