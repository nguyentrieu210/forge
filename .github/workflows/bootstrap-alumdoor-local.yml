name: Bootstrap Alumdoor Local C Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-alumdoor-local-machine-v2
  cancel-in-progress: true

jobs:
  bootstrap-local:
    runs-on: [self-hosted]
    timeout-minutes: 45
    steps:
      - name: Ensure C:\alumdoor source workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $repo = 'https://github.com/nguyentrieu210/forge.git'

          if (-not (Test-Path $target)) {
            Write-Host "C:\alumdoor chua ton tai - clone main lan dau."
            git clone --branch main --single-branch $repo $target
            if ($LASTEXITCODE -ne 0) { throw 'git clone that bai' }
          } elseif (-not (Test-Path (Join-Path $target '.git'))) {
            $entries = @(Get-ChildItem -Force $target -ErrorAction SilentlyContinue)
            if ($entries.Count -gt 0) {
              throw 'C:\alumdoor da ton tai va co du lieu nhung khong phai Git repo; runner se khong ghi de.'
            }
            Write-Host "C:\alumdoor rong - clone main lan dau."
            git clone --branch main --single-branch $repo $target
            if ($LASTEXITCODE -ne 0) { throw 'git clone that bai' }
          }

          $origin = (git -C $target remote get-url origin).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Khong doc duoc git origin trong C:\alumdoor' }
          if ($origin -notmatch 'github\.com[:/]nguyentrieu210/forge(?:\.git)?$') {
            throw "C:\alumdoor dang tro toi repo khac: $origin"
          }

          $branch = (git -C $target rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'main') {
            throw "C:\alumdoor dang o branch '$branch'. Runner chi cap nhat local main de khong pha working branch."
          }

          # These are generated local-only artifacts seen on the self-hosted machine.
          # Preserve them on disk, but hide them from Git status so they cannot block a
          # safe fast-forward. Any other source change still fails the bootstrap.
          $excludeFile = Join-Path $target '.git\info\exclude'
          $safeLocalPatterns = @('.sentrux.local-backup/', 'package-lock.json')
          $existingExcludes = @()
          if (Test-Path $excludeFile) {
            $existingExcludes = @(Get-Content $excludeFile -ErrorAction SilentlyContinue)
          }
          foreach ($pattern in $safeLocalPatterns) {
            if ($existingExcludes -notcontains $pattern) {
              Add-Content -Path $excludeFile -Value $pattern
              Write-Host "Local-only exclude: $pattern"
            }
          }

          # Runtime/service installation may leave a very small, known set of generated
          # wrappers or local rewrites in the source workspace. Back up and clean only
          # that allowlist so automatic main fast-forward remains safe. Any other local
          # source edit still blocks bootstrap instead of being overwritten.
          $runtimeTracked = @(
            'run-local.bat',
            'server/scripts/alumdoor-runtime-service-host.mjs',
            'server/scripts/install-alumdoor-runtime-services.ps1'
          )
          $runtimeUntracked = @(
            'client/start-client.cmd',
            'server/start-worker.cmd'
          )

          $dirty = @(git -C $target status --porcelain=v1)
          if ($dirty.Count -gt 0) {
            $unexpected = @()
            foreach ($entry in $dirty) {
              if ($entry.Length -lt 4) {
                $unexpected += $entry
                continue
              }
              $status = $entry.Substring(0, 2)
              $path = $entry.Substring(3).Trim()
              $knownTracked = $runtimeTracked -contains $path
              $knownUntracked = ($status -eq '??') -and ($runtimeUntracked -contains $path)
              if (-not $knownTracked -and -not $knownUntracked) {
                $unexpected += $entry
              }
            }

            if ($unexpected.Count -gt 0) {
              Write-Host 'Working tree co thay doi ngoai allowlist runtime:'
              $unexpected | ForEach-Object { Write-Host "  $_" }
              throw 'Dung bootstrap de tranh mat thay doi local. Commit/stash/sua working tree truoc.'
            }

            $backupRoot = Join-Path 'C:\ForgeServices\Alumdoor\source-backups' (Get-Date -Format 'yyyyMMdd-HHmmss')
            New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null
            foreach ($path in @($runtimeTracked + $runtimeUntracked)) {
              $sourcePath = Join-Path $target ($path -replace '/', '\')
              if (-not (Test-Path -LiteralPath $sourcePath)) { continue }
              $backupPath = Join-Path $backupRoot ($path -replace '/', '\')
              $backupDir = Split-Path $backupPath -Parent
              New-Item -ItemType Directory -Force -Path $backupDir | Out-Null
              Copy-Item -LiteralPath $sourcePath -Destination $backupPath -Force
            }
            Write-Host "Runtime-generated local source backed up: $backupRoot"

            git -C $target restore --worktree --staged -- @runtimeTracked
            if ($LASTEXITCODE -ne 0) { throw 'Khong restore duoc tracked runtime-generated files' }
            foreach ($path in $runtimeUntracked) {
              $sourcePath = Join-Path $target ($path -replace '/', '\')
              if (Test-Path -LiteralPath $sourcePath) {
                Remove-Item -LiteralPath $sourcePath -Force
              }
            }

            $remaining = @(git -C $target status --porcelain=v1)
            if ($remaining.Count -gt 0) {
              Write-Host 'Working tree van dirty sau runtime cleanup:'
              $remaining | ForEach-Object { Write-Host "  $_" }
              throw 'Runtime cleanup khong dua workspace ve trang thai sach.'
            }
          }

          Write-Host 'Workspace hop le:'
          git -C $target log -1 --oneline

      - name: Sync and fully bootstrap local Alumdoor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'

          $maintenance = Join-Path $target 'server\scripts\alumdoor-runtime-maintenance.mjs'
          $serviceNames = @('ForgeAlumdoorBackend', 'ForgeAlumdoorDesk')
          $installedServices = @(
            $serviceNames |
              ForEach-Object { Get-Service -Name $_ -ErrorAction SilentlyContinue } |
              Where-Object { $null -ne $_ }
          )
          $managedByServices = $installedServices.Count -gt 0

          if (Test-Path $maintenance) {
            & node $maintenance on
            if ($LASTEXITCODE -ne 0) { throw 'Khong bat duoc Alumdoor runtime maintenance' }
          }

          if ($managedByServices) {
            Write-Host "Windows runtime services detected: $($installedServices.Name -join ', ')"

            # Maintenance is advisory to the service host. During bootstrap we need a
            # deterministic port hand-off before touching the source tree/D1, so stop
            # the Windows services themselves and then clean up any orphan children.
            foreach ($service in $installedServices) {
              $current = Get-Service -Name $service.Name -ErrorAction Stop
              if ($current.Status -ne 'Stopped') {
                Write-Host "Stopping Windows service $($service.Name) status=$($current.Status)"
                Stop-Service -Name $service.Name -Force -ErrorAction Stop
                $current.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
              }
            }

            & node "$target\server\scripts\stop-local-dev.mjs" --ports=8799,5173
            if ($LASTEXITCODE -ne 0) { throw 'Khong dung duoc orphan local dev stack sau khi stop Windows services' }

            $listeners = @(
              Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
                Where-Object { $_.LocalPort -in @(8799, 5173) }
            )
            if ($listeners.Count -gt 0) {
              Write-Host 'Runtime ports van bi chiem sau khi stop services/orphans:'
              $listeners | ForEach-Object {
                Write-Host "  port=$($_.LocalPort) pid=$($_.OwningProcess)"
              }
              throw 'Khong the giai phong local ports truoc bootstrap.'
            }
            Write-Host 'Windows runtime services and orphan children are stopped.'
          } else {
            # No managed Windows services: clean up the legacy/manual dev processes.
            & node "$target\server\scripts\stop-local-dev.mjs" --ports=8799,5173
            if ($LASTEXITCODE -ne 0) { throw 'Khong dung duoc local dev stack truoc khi sync' }
          }

          & node "$target\server\scripts\backup-local-state.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Khong sao luu duoc local Wrangler state' }

          git -C $target fetch origin main --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch origin main that bai' }

          $counts = (git -C $target rev-list --left-right --count HEAD...origin/main).Trim() -split '\s+'
          if ($LASTEXITCODE -ne 0 -or $counts.Count -lt 2) { throw 'Khong tinh duoc ahead/behind cua local main' }
          $ahead = [int]$counts[0]
          $behind = [int]$counts[1]
          if ($ahead -gt 0) {
            throw "Local main co $ahead commit chua co tren GitHub; runner khong ghi de."
          }
          if ($behind -gt 0) {
            git -C $target merge --ff-only origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Khong fast-forward duoc C:\alumdoor len origin/main' }
          }

          Write-Host 'Source sau sync:'
          git -C $target log -1 --oneline

          # Runtime bootstrap remains strict on dependencies, build, migration,
          # seed, HTTP smoke, app install and client build. Repo-wide translation
          # and business-suite gates run in CI separately and must not prevent the
          # local ERP stack from being initialized.
          & cmd.exe /d /c "C:\alumdoor\sync-local.bat --bootstrap --skip-source-verify"
          if ($LASTEXITCODE -ne 0) {
            throw "sync-local.bat runtime bootstrap that bai voi exit code $LASTEXITCODE"
          }

      - name: Verify local services remain healthy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Wait-NodeHttp {
            param(
              [string]$Url,
              [string]$Mode,
              [int]$TimeoutSeconds = 120
            )
            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            do {
              if ($Mode -eq 'backend') {
                & node -e "fetch('$Url',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit([200,401,403].includes(r.status)?0:1)).catch(()=>process.exit(1))"
              } else {
                & node -e "fetch('$Url',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
              }
              if ($LASTEXITCODE -eq 0) { return }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)
            throw "Local service khong healthy sau $TimeoutSeconds giay: $Url"
          }

          Wait-NodeHttp -Url 'http://127.0.0.1:8799/api/method/metaforge.api.get_boot' -Mode 'backend'
          Wait-NodeHttp -Url 'http://127.0.0.1:5173' -Mode 'ui'

          Write-Host '=== LOCAL READY ==='
          Write-Host 'Desk    : http://localhost:5173'
          Write-Host 'Backend : http://localhost:8799'
          git -C C:\alumdoor log -1 --oneline

      - name: Print local logs on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host '=== run-local.log (tail) ==='
          if (Test-Path 'C:\alumdoor\run-local.log') {
            Get-Content 'C:\alumdoor\run-local.log' -Tail 160
          }
          Write-Host '=== smoke log ==='
          if (Test-Path 'C:\alumdoor\run-local.log.smoke') {
            Get-Content 'C:\alumdoor\run-local.log.smoke' -Tail 160
          }
          Write-Host '=== Windows service logs ==='
          if (Test-Path 'C:\ForgeServices\Alumdoor\logs') {
            Get-ChildItem 'C:\ForgeServices\Alumdoor\logs' -Recurse -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 4 |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue
              }
          }
