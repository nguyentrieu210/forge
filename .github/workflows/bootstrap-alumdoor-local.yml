name: Bootstrap Alumdoor Local C Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  bootstrap-local:
    runs-on: [self-hosted]
    timeout-minutes: 45
    env:
      FORGE_LOCAL_EXPECTED_SHA: ${{ github.sha }}
      FORGE_LOCAL_REQUIRED_SERVICES: backend
    steps:
      - name: Validate canonical workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $repo = 'https://github.com/nguyentrieu210/forge.git'

          if (-not (Test-Path $target)) {
            git clone --branch main --single-branch $repo $target
            if ($LASTEXITCODE -ne 0) { throw 'Initial clone to C:\alumdoor failed' }
          } elseif (-not (Test-Path (Join-Path $target '.git'))) {
            if (@(Get-ChildItem -Force $target -ErrorAction SilentlyContinue).Count -gt 0) {
              throw 'C:\alumdoor exists with data but is not a Git repo; refusing to overwrite'
            }
            git clone --branch main --single-branch $repo $target
            if ($LASTEXITCODE -ne 0) { throw 'Initial clone to C:\alumdoor failed' }
          }

          $origin = (git -C $target remote get-url origin).Trim()
          if ($LASTEXITCODE -ne 0 -or $origin -notmatch 'github\.com[:/]nguyentrieu210/forge(?:\.git)?$') {
            throw "Unexpected C:\alumdoor origin: $origin"
          }
          $branch = (git -C $target rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'main') { throw "C:\alumdoor must stay on main; found '$branch'" }

          $excludeFile = Join-Path $target '.git\info\exclude'
          foreach ($pattern in @('.sentrux.local-backup/', 'package-lock.json')) {
            if (-not (Select-String -LiteralPath $excludeFile -SimpleMatch $pattern -Quiet -ErrorAction SilentlyContinue)) {
              Add-Content -Path $excludeFile -Value $pattern
            }
          }

          # Only these service-generated source artifacts may be repaired before
          # source convergence. Any operator change blocks bootstrap.
          $runtimeTracked = @(
            'run-local.bat',
            'server/scripts/alumdoor-runtime-service-host.mjs',
            'server/scripts/install-alumdoor-runtime-services.ps1'
          )
          $runtimeUntracked = @('client/start-client.cmd', 'server/start-worker.cmd')
          $dirty = @(git -C $target status --porcelain=v1)
          if ($dirty.Count -gt 0) {
            $unexpected = @()
            foreach ($entry in $dirty) {
              if ($entry.Length -lt 4) { $unexpected += $entry; continue }
              $status = $entry.Substring(0, 2)
              $path = $entry.Substring(3).Trim()
              if (-not (($runtimeTracked -contains $path) -or (($status -eq '??') -and ($runtimeUntracked -contains $path)))) {
                $unexpected += $entry
              }
            }
            if ($unexpected.Count -gt 0) {
              $unexpected | ForEach-Object { Write-Host "DIRTY $_" }
              throw 'Bootstrap blocked to protect local source changes'
            }

            $backupRoot = Join-Path 'C:\ForgeServices\Alumdoor\source-backups' (Get-Date -Format 'yyyyMMdd-HHmmss')
            foreach ($path in @($runtimeTracked + $runtimeUntracked)) {
              $sourcePath = Join-Path $target ($path -replace '/', '\')
              if (-not (Test-Path -LiteralPath $sourcePath)) { continue }
              $backupPath = Join-Path $backupRoot ($path -replace '/', '\')
              New-Item -ItemType Directory -Force -Path (Split-Path $backupPath -Parent) | Out-Null
              Copy-Item -LiteralPath $sourcePath -Destination $backupPath -Force
            }
            git -C $target restore --worktree --staged -- @runtimeTracked
            if ($LASTEXITCODE -ne 0) { throw 'Cannot restore tracked runtime-generated files' }
            foreach ($path in $runtimeUntracked) {
              Remove-Item -LiteralPath (Join-Path $target ($path -replace '/', '\')) -Force -ErrorAction SilentlyContinue
            }
            if (@(git -C $target status --porcelain=v1).Count -gt 0) {
              throw 'Runtime cleanup did not return C:\alumdoor to a clean state'
            }
          }

          Write-Host 'Canonical workspace validated:'
          git -C $target log -1 --oneline

      - name: Converge source and retire verified legacy runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $serviceHome = 'C:\ForgeServices\Alumdoor'
          $lockDir = Join-Path $target 'local-locks'
          $lockPath = Join-Path $lockDir 'local-d1-mutation.lock'
          $requestPath = Join-Path $serviceHome 'legacy-runtime-migration.request.json'
          $donePath = Join-Path $serviceHome 'legacy-runtime-migration.done.json'
          $transitionRun = "bootstrap-transition-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $lockOwned = $false

          New-Item -ItemType Directory -Force -Path $lockDir | Out-Null
          New-Item -ItemType Directory -Force -Path $serviceHome | Out-Null

          function Process-Ancestry([int]$StartPid) {
            $all = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $byId = @{}
            foreach ($proc in $all) { $byId[[int]$proc.ProcessId] = $proc }
            $result = @()
            $seen = @{}
            $current = $StartPid
            while ($current -gt 0 -and -not $seen.ContainsKey($current)) {
              $seen[$current] = $true
              $proc = $byId[$current]
              if (-not $proc) { break }
              $result += $proc
              $current = [int]$proc.ParentProcessId
            }
            return @($result)
          }

          function Legacy-Runtime-Present {
            $legacy = Get-CimInstance Win32_Service -Filter "Name='ForgeAlumdoorWorker'" -ErrorAction SilentlyContinue
            if ($legacy -and $legacy.State -ne 'Stopped') { return $true }

            # Bootstrap/data only owns the backend capability. A Desk/5173 listener
            # is not evidence of a legacy data runtime and must not be mutated here.
            $managedBackend = Get-CimInstance Win32_Service -Filter "Name='ForgeAlumdoorBackend'" -ErrorAction SilentlyContinue
            foreach ($listener in @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -eq 8799 })) {
              $chain = @(Process-Ancestry -StartPid ([int]$listener.OwningProcess))
              $managedPid = [int]$managedBackend.ProcessId
              if ($managedPid -le 0 -or -not ($chain | Where-Object { [int]$_.ProcessId -eq $managedPid })) { return $true }
            }
            return $false
          }

          try {
            $lockPayload = [ordered]@{
              format='forge-bootstrap-source-transition/v3'; run_id=$transitionRun; adapter='bootstrap-source-transition';
              pid=$PID; hostname=$env:COMPUTERNAME; started_at=(Get-Date).ToUniversalTime().ToString('o');
              workflow=$env:GITHUB_WORKFLOW; github_run_id=$env:GITHUB_RUN_ID; github_run_attempt=$env:GITHUB_RUN_ATTEMPT
            } | ConvertTo-Json -Depth 4
            try {
              $stream = [System.IO.File]::Open($lockPath,[System.IO.FileMode]::CreateNew,[System.IO.FileAccess]::Write,[System.IO.FileShare]::None)
              try { $bytes=[Text.Encoding]::UTF8.GetBytes($lockPayload+"`n"); $stream.Write($bytes,0,$bytes.Length) } finally { $stream.Dispose() }
              $lockOwned = $true
              Write-Host "LEGACY_SOURCE_LOCK=ACQUIRED run_id=$transitionRun"
            } catch { throw "Transition lock is active or ownership is unproven: $lockPath" }

            git -C $target fetch origin main --prune
            if ($LASTEXITCODE -ne 0) { throw 'Source transition fetch failed' }
            $local = (git -C $target rev-parse HEAD).Trim()
            $remote = (git -C $target rev-parse origin/main).Trim()
            if ($remote -ne $env:FORGE_LOCAL_EXPECTED_SHA) {
              throw "Transition target mismatch expected=$env:FORGE_LOCAL_EXPECTED_SHA origin_main=$remote"
            }
            $counts = ((git -C $target rev-list --left-right --count HEAD...origin/main).Trim() -split '\s+')
            if ($LASTEXITCODE -ne 0 -or $counts.Count -ne 2) { throw 'Cannot classify local main ahead/behind state' }
            if ([int]$counts[0] -ne 0) { throw "Local main is ahead by $($counts[0]); refusing source transition" }

            if ([int]$counts[1] -gt 0) {
              # This is source-only convergence. No Wrangler/D1 command is allowed
              # in this bridge; authenticated local-state backup remains owned by
              # the canonical runner after runtime quiescence is proven.
              git -C $target merge --ff-only origin/main
              if ($LASTEXITCODE -ne 0) { throw 'Source transition ff-only merge failed' }
              Write-Host "LEGACY_SOURCE_SYNC=PASS from=$local to=$remote d1_mutation=0"
            }

            $actual = (git -C $target rev-parse HEAD).Trim()
            if ($actual -ne $env:FORGE_LOCAL_EXPECTED_SHA) { throw "Exact-SHA source failure expected=$env:FORGE_LOCAL_EXPECTED_SHA actual=$actual" }
            foreach ($required in @(
              'scripts\local-runner\run-local-import.mjs',
              'server\scripts\alumdoor-legacy-runtime-migration.mjs',
              'server\scripts\alumdoor-runtime-maintenance.mjs'
            )) {
              if (-not (Test-Path -LiteralPath (Join-Path $target $required) -PathType Leaf)) { throw "Post-sync dependency missing: $required" }
            }

            if (Legacy-Runtime-Present) {
              if (Test-Path -LiteralPath $requestPath) {
                throw "Previous legacy migration request is still pending: $requestPath"
              }
              Remove-Item -LiteralPath $donePath -Force -ErrorAction SilentlyContinue
              $request = [ordered]@{
                format='forge-alumdoor-legacy-runtime-migration/v1';
                run_id=$transitionRun;
                expected_sha=$actual;
                requested_at=(Get-Date).ToUniversalTime().ToString('o')
              } | ConvertTo-Json -Depth 4
              [System.IO.File]::WriteAllText($requestPath,$request+"`n",(New-Object System.Text.UTF8Encoding($false)))
              Write-Host "LEGACY_RUNTIME_MIGRATION_REQUEST=CREATED run_id=$transitionRun"

              # The already-running backend service host is LocalSystem. Toggling
              # backend maintenance restarts only its owned child. The refreshed
              # child executes the fixed migration helper, which independently
              # proves authority before retiring an actual legacy runtime.
              & node (Join-Path $target 'server\scripts\alumdoor-runtime-maintenance.mjs') on backend
              if ($LASTEXITCODE -ne 0) { throw 'Failed to enable backend migration handoff maintenance' }
              Start-Sleep -Seconds 2
              & node (Join-Path $target 'server\scripts\alumdoor-runtime-maintenance.mjs') off backend
              if ($LASTEXITCODE -ne 0) { throw 'Failed to release backend migration handoff maintenance' }

              $deadline = (Get-Date).AddSeconds(90)
              $accepted = $false
              do {
                if (Test-Path -LiteralPath $donePath) {
                  try {
                    $done = Get-Content -Raw $donePath | ConvertFrom-Json
                    if ($done.run_id -eq $transitionRun -and $done.expected_sha -eq $actual) {
                      $accepted = $true
                      break
                    }
                  } catch {}
                }
                Start-Sleep -Milliseconds 500
              } while ((Get-Date) -lt $deadline)

              if (-not $accepted) {
                Write-Host '=== migration timeout diagnostics ==='
                Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -in @('ForgeAlumdoorBackend','ForgeAlumdoorDesk','ForgeAlumdoorWorker') } |
                  ForEach-Object { Write-Host "SERVICE name=$($_.Name) state=$($_.State) start=$($_.StartName) pid=$($_.ProcessId) path=$($_.PathName)" }
                Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
                  Where-Object { $_.LocalPort -in @(8799,5173) } |
                  ForEach-Object { Write-Host "LISTENER port=$($_.LocalPort) pid=$($_.OwningProcess)" }
                throw 'Ownership-verified legacy runtime migration did not complete'
              }
              Write-Host "LEGACY_RUNTIME_MIGRATION=PASS run_id=$transitionRun"
            } else {
              Write-Host 'LEGACY_RUNTIME_MIGRATION=SKIP reason=already-managed-or-quiet'
            }
          } finally {
            if ($lockOwned -and (Test-Path -LiteralPath $lockPath)) {
              $current = Get-Content -Raw $lockPath | ConvertFrom-Json
              if ($current.run_id -ne $transitionRun) { throw "Refusing to release transition lock owned by $($current.run_id)" }
              Remove-Item -LiteralPath $lockPath -Force
              Write-Host "LEGACY_SOURCE_LOCK=RELEASED run_id=$transitionRun"
            }
          }

      - name: Run canonical bootstrap mutation contract
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts\local-runner\run-local-import.mjs bootstrap
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap execution contract failed with exit code $LASTEXITCODE" }

      - name: Verify canonical source and declared local services
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:FORGE_LOCAL_EXPECTED_SHA) { throw "Post-bootstrap SHA mismatch expected=$env:FORGE_LOCAL_EXPECTED_SHA actual=$actual" }
          & node scripts\local-runner\service-verification.mjs --services=$env:FORGE_LOCAL_REQUIRED_SERVICES
          if ($LASTEXITCODE -ne 0) { throw 'Post-bootstrap required-service verification failed' }
          Write-Host "LOCAL_BOOTSTRAP_ACCEPTED sha=$actual required_services=$env:FORGE_LOCAL_REQUIRED_SERVICES"

      - name: Print local diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host '=== source ==='
          if (Test-Path 'C:\alumdoor\.git') { git -C C:\alumdoor status --short --branch; git -C C:\alumdoor log -1 --oneline }
          Write-Host '=== services ==='
          Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('ForgeAlumdoorBackend','ForgeAlumdoorDesk','ForgeAlumdoorWorker') } |
            ForEach-Object { Write-Host "SERVICE name=$($_.Name) state=$($_.State) start=$($_.StartName) pid=$($_.ProcessId) path=$($_.PathName)" }
          Write-Host '=== listeners ==='
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in @(8799,5173) } |
            Format-Table -AutoSize
          Write-Host '=== latest execution evidence ==='
          $root = 'C:\alumdoor\local-backups\execution-layer\bootstrap'
          if (Test-Path $root) {
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-ChildItem $_.FullName -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
            }
          }
