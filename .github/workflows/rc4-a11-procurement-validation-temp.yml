name: RC4 A11 Procurement Validation Temp

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - "docs/agents/rc4/A11-HANDOFF.md"
      - ".github/workflows/rc4-a11-procurement-validation-temp.yml"

permissions:
  contents: read

concurrency:
  group: rc4-a11-procurement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  procurement-critical:
    if: github.head_ref == 'agent/rc4-11-procurement-p2p'
    name: RC4 A11 Procurement CRITICAL gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit server dist and reject A11 TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm --dir server exec tsc -p tsconfig.json --noEmitOnError false 2>&1 | tee /tmp/rc4-a11-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          echo "full_server_tsc_status=${status}"

          if grep -E 'packages/clouderp-core/src/(supplier-lifecycle-controllers|procurement-integrity-controllers|procurement-p2p-controllers|procurement-p2p-rollout-controllers|procurement-decisions|procurement-landed-cost|procurement-analytics|supplier-contract-enforcement|supplier-selection-controller)\.ts' /tmp/rc4-a11-tsc.log; then
            echo "RC4 A11 authoritative source has TypeScript errors"
            exit 1
          fi

          test -f server/dist/packages/clouderp-core/src/supplier-lifecycle-controllers.js
          test -f server/dist/packages/clouderp-core/src/procurement-p2p-controllers.js

      - name: Procurement lifecycle and P2P regressions
        working-directory: server
        run: >-
          node --test
          tests/procurement-rc4-supplier-lifecycle-permissions.test.mjs
          tests/supplier-lifecycle.test.mjs
          tests/supplier-qualification-adoption.test.mjs
          tests/supplier-selection.test.mjs
          tests/supplier-contract-release.test.mjs
          tests/procurement-rfq-integrity.test.mjs
          tests/procurement-decisions.test.mjs
          tests/procurement-analytics.test.mjs
          tests/procurement-p2p-closure.test.mjs
          tests/procurement-p2p-correction-boundary.test.mjs
          tests/procurement-landed-cost.test.mjs
          tests/procurement-app-source.test.mjs
          tests/erp-core.test.mjs
          tests/erpnext-core.test.mjs

      - name: Procurement metadata package gate
        run: node server/scripts/pack-app.mjs server/apps-src/procurement --check

      - name: Scope and authority audit
        shell: bash
        run: |
          git fetch origin main
          merge_base=$(git merge-base origin/main HEAD)
          test -n "$merge_base"
          echo "main=$(git rev-parse origin/main)"
          echo "head=$(git rev-parse HEAD)"
          echo "merge_base=$merge_base"
          git diff --name-only "$merge_base"...HEAD | tee /tmp/rc4-a11-files.txt

          if grep -E '^server/migrations/' /tmp/rc4-a11-files.txt; then
            echo "Unexpected migration in RC4 A11"
            exit 1
          fi

          if grep -E '^client/' /tmp/rc4-a11-files.txt; then
            echo "Unexpected client/UI delta in RC4 A11 backend hardening"
            exit 1
          fi
