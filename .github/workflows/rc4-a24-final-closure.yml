name: RC4 A24 Final Closure Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rc4-a24-final-closure.yml"
      - "docs/agents/rc4/RC4_A24_RELEASE_CONFIDENCE_QA_R2.md"
      - "docs/agents/rc4/RC4_A24_RELEASE_CONFIDENCE_QA_R2_HANDOFF.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: rc4-a24-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  final-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact A24 PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact A24 head and current main baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "269c690bda7abf90ea13225204352bdff908d63b"

      - name: Verify final A19 independent replay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/30875933640")
          node -e 'const r=JSON.parse(process.argv[1]); if(r.status!=="completed"||r.conclusion!=="success"||r.head_sha!=="fea98132a0adfbef1c6ca3066082320d28be364d") throw new Error(JSON.stringify({status:r.status,conclusion:r.conclusion,head_sha:r.head_sha})); console.log("A19 final independent replay: PASS")' "$run"

      - name: Validate final A20 materialized convergence head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/rc4-20-capability-convergence-r2
          test "$(git rev-parse origin/agent/rc4-20-capability-convergence-r2)" = "cb52ab69572f47fb961b3f0ceb588de1994f4885"
          git worktree add /tmp/a20 cb52ab69572f47fb961b3f0ceb588de1994f4885
          cd /tmp/a20
          node server/scripts/validate-enterprise-capability-status.mjs
          RC4_EXPECTED_MAIN_SHA=269c690bda7abf90ea13225204352bdff908d63b node server/scripts/validate-rc4-capability-convergence.mjs
          grep -F '| RC | 66 | 6.90% |' docs/FORGE_ENTERPRISE_CAPABILITY_STATUS.md
          grep -F '| Wired | 406 | 42.47% |' docs/FORGE_ENTERPRISE_CAPABILITY_STATUS.md

      - name: Verify A21/A22/A23 closure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          check_run() {
            id="$1"; expected="$2"; label="$3"
            json=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}")
            node -e 'const r=JSON.parse(process.argv[1]); const expected=process.argv[2]; const label=process.argv[3]; if(r.status!=="completed"||r.conclusion!=="success"||r.head_sha!==expected) throw new Error(label+":"+JSON.stringify({status:r.status,conclusion:r.conclusion,head_sha:r.head_sha})); console.log(label+": PASS")' "$json" "$expected" "$label"
          }
          check_run 30868898863 fe473ccc3723f46094c5db4719b2acac0c9bf8db A21
          check_run 30875326244 e3df86ae5e1645ad75f21bccd7584b20c2d94ef3 A22
          check_run 30874137767 7d7aff633a943b881d7488cd50e661fbdcffaace A23

      - name: Verify A6 browser evidence is merged
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 834da8cf8fbf496f6c58cb0d8ba2119c40a6b66c origin/main

      - name: Preserve provider and production non-claims
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('server/config/cloudflare-governance.json','utf8'));
          if (cfg?.remote_observation?.status !== 'unverified') {
            throw new Error(`Provider observation must remain explicit/unverified at RC4 closure, got ${cfg?.remote_observation?.status}`);
          }
          console.log('Provider/live hardening remains explicitly unverified: PASS');
          NODE

      - name: A24 authority boundary
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base...HEAD")
          echo "$changed"
          if echo "$changed" | grep -Ev '^(\.github/workflows/rc4-a24-final-closure\.yml|docs/agents/rc4/RC4_A24_RELEASE_CONFIDENCE_QA_R2(_HANDOFF)?\.md)$'; then
            echo "A24 changed runtime/domain/schema authority"
            exit 1
          fi
          git diff --check "$base...HEAD" -- .github/workflows/rc4-a24-final-closure.yml
