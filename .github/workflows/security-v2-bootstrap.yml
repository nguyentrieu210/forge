name: Forge Security V2 Bootstrap

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-security-v2-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Security Generation V2
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/forge-security-v2-bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout trusted default-branch command parser
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and authorize owner command
        id: command
        env:
          FORGE_SECURITY_V2_COMMAND_BODY: ${{ github.event.comment.body }}
          FORGE_SECURITY_V2_COMMAND_ISSUE: ${{ github.event.issue.number }}
          FORGE_SECURITY_V2_COMMAND_AUTHOR: ${{ github.event.comment.user.login }}
          FORGE_SECURITY_V2_COMMAND_ASSOCIATION: ${{ github.event.comment.author_association }}
          FORGE_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node server/scripts/parse-security-v2-command.mjs

      - name: Checkout exact authorized source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.command.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact target merged into main
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Refusing Security V2 production bootstrap: $TARGET_SHA is not merged into main."
            exit 1
          }

      - name: Require production provider credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build server and exact Gateway client bundle
        env:
          VITE_FORGE_RELEASE_SHA: ${{ steps.command.outputs.target_sha }}
        run: |
          pnpm --filter cloudforge run build
          pnpm --filter runtime... run build
          pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json
          pnpm --dir client/apps/kho exec vite build --config vite.mobile.config.ts
          node server/scripts/stage-client-bundle.mjs

      - name: Verify Security V2 source contracts
        run: |
          node --test \
            server/tests/security-generation-v2.test.mjs \
            server/tests/control-security-v2.test.mjs \
            server/tests/security-v2-command.test.mjs
          python3 server/scripts/test-security-v2-migration.py
          node --check server/scripts/bootstrap-security-v2.mjs
          node --check server/scripts/provision-tenant-v2.mjs

      - name: Resolve canonical Cloudflare account
        id: account
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { resolveCloudflareAccountId } from './server/scripts/lib/demo-provider-credentials.mjs';
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is required');
          const resolved = await resolveCloudflareAccountId({ token, accountHint: '' });
          appendFileSync(process.env.GITHUB_OUTPUT, `account_id=${resolved.accountId}\n`, 'utf8');
          console.log(`provider account selected by ${resolved.selection}`);
          NODE

      - name: Backup Control D1 before security migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir server exec wrangler d1 export cloudforge-control \
            --config apps/control-plane-worker/wrangler.jsonc \
            --remote \
            --skip-confirmation \
            --output "$RUNNER_TEMP/control-pre-security-v2.sql"
          test -s "$RUNNER_TEMP/control-pre-security-v2.sql"

      - name: Apply append-only Control security migration
        working-directory: server
        run: node scripts/d1-migrate-remote.mjs --config apps/control-plane-worker/wrangler.jsonc

      - name: Coordinate V2 platform masters before first V2 tenant
        working-directory: server
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: >-
          node scripts/bootstrap-security-v2.mjs
          --phase prepare
          --account "$ACCOUNT_ID"
          --source-sha "$TARGET_SHA"

      - name: Deploy Control Plane V2 wrapper
        working-directory: server
        run: pnpm exec wrangler deploy --config apps/control-plane-worker/wrangler.jsonc

      - name: Deploy Jobs V2 wrapper
        working-directory: server
        run: pnpm exec wrangler deploy --config apps/jobs-worker/wrangler.jsonc

      - name: Deploy Gateway V2 wrapper with staged client
        working-directory: server
        run: pnpm exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Finalize immutable provider account authority
        working-directory: server
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: >-
          node scripts/bootstrap-security-v2.mjs
          --phase finalize
          --account "$ACCOUNT_ID"
          --source-sha "$TARGET_SHA"

      - name: Verify legacy ALU still converges through generation-1 path
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        run: >-
          node server/scripts/sre-health-snapshot.mjs
          --base https://alu.kairo.vn
          --expected-release-sha "$TARGET_SHA"
          --allow-remote
          --confirm-host alu.kairo.vn
          --attempts 10
          --delay-ms 2000
          --output "$RUNNER_TEMP/security-v2-legacy-health.json"

      - name: Upload security bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-v2-bootstrap-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/control-pre-security-v2.sql
            ${{ runner.temp }}/security-v2-legacy-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish result back to command issue
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = process.env.JOB_STATUS === 'success';
            const lines = [
              `## Forge Security V2 Bootstrap ${ok ? 'SUCCESS' : 'FAILED'}`,
              '',
              `- Target SHA: ${process.env.TARGET_SHA || '(parse failed)'}`,
              `- Run: ${runUrl}`,
              `- Legacy ALU verification: ${ok ? 'PASS' : 'see run'}`,
            ];
            if (!ok) lines.push('', 'No automatic rollback or destructive cleanup was attempted.');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
