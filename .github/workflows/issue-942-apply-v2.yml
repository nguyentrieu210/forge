name: Issue 942 Apply V2

on:
  push:
    branches:
      - agent/alumdoor-v2-reproducible

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply source and generator convergence
        run: |
          python .github/issue-942-prepatch.py
          python .github/issue-942-apply.py
      - name: Generator first pass
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cp server/briefs/alumdoor-v2.json /tmp/alumdoor-v2-first.json
          git diff --numstat -- server/briefs/alumdoor-v2.json
      - name: Critical semantic assertions
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const b=JSON.parse(fs.readFileSync('server/briefs/alumdoor-v2.json','utf8'));
          const nameOf=f=>typeof f==='string'?f.split(':')[0].trim():f.fieldname;
          const d=n=>{const xs=b.doctypes.filter(v=>v.name===n); if(xs.length!==1) throw new Error(`expected exactly one ${n}, got ${xs.length}`); return xs[0]};
          const has=(dt,f)=>d(dt).fields.some(x=>nameOf(x)===f);
          for(const n of ['Tỉnh Thành','Phường Xã','Địa chỉ giao lắp','Tài khoản ngân hàng','Credit Note','Credit Note Item','Stock Return','Cut Order Item']) d(n);
          for(const [dt,f] of [['Sales Order Item','discount_percentage'],['Cutting Policy','geometry_profile'],['Cutting Policy','geometry_rules'],['Cut Order Item','source_batch_no'],['Price List','customer_group']]) if(!has(dt,f)) throw new Error(`missing ${dt}.${f}`);
          for(const x of b.doctypes) for(const f of x.fields||[]) if(['sales_option','sales_mode'].includes(nameOf(f))) throw new Error(`deprecated ${x.name}.${nameOf(f)}`);
          if(b.doctypes.some(x=>['Sales Option','Sales Package'].includes(x.name))) throw new Error('deprecated sales doctype resurrected');
          const spec=d('Material Specification');
          for(const f of ['theoretical_kg_per_m','scrap_threshold_m']) { const x=spec.fields.find(v=>nameOf(v)===f); if(!String(x?.depends_on||'').includes('Vật tư tuyến tính')) throw new Error(`${f} lost Vật tư tuyến tính`); }
          console.log('critical semantic assertions PASS');
          NODE
      - name: Generator second pass zero diff
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cmp -s /tmp/alumdoor-v2-first.json server/briefs/alumdoor-v2.json
          echo 'second-pass generator: ZERO DIFF'
      - name: Focused generator regression
        run: node --test server/tests/alumdoor-v2-generator-reproducibility.test.mjs
      - name: Server build
        run: pnpm run server:build
      - name: Brief check
        run: pnpm --dir server run brief:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit and remove temporary probes
        run: |
          rm -f .github/issue-942-apply.py
          rm -f .github/issue-942-prepatch.py
          rm -f .github/workflows/issue-942-provenance-probe.yml
          rm -f .github/workflows/issue-942-semantic-probe.yml
          rm -f .github/workflows/issue-942-remaining-provenance.yml
          rm -f .github/workflows/issue-942-validator-detail.yml
          rm -f .github/workflows/issue-942-customfields-probe.yml
          rm -f .github/workflows/issue-942-schema-probe.yml
          rm -f .github/workflows/issue-942-apply.yml
          rm -f .github/workflows/issue-942-apply-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/briefs/alumdoor.json server/briefs/alumdoor-v2.json server/briefs/brief.schema.json server/scripts/build-alumdoor-v2-brief.mjs server/tests/alumdoor-v2-generator-reproducibility.test.mjs .github
          git diff --cached --check
          git commit -m "fix(alumdoor): make V2 brief reproducible [issue-942-applied]"
          git push origin HEAD:agent/alumdoor-v2-reproducible
