name: Apply Sales Production Feature Once

on:
  push:
    branches:
      - feat/sales-order-production-flow-20260801
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete

permissions:
  contents: write

concurrency:
  group: apply-sales-production-feature-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feat/sales-order-production-flow-20260801' || github.ref_name == 'feat/sales-order-production-flow-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-order-production-flow-20260801
          fetch-depth: 0

      - name: Restore reviewed feature sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/tests server/scripts
          cat server/scripts/.sales-production-payload-v2/module-*.txt \
            | base64 -d | gzip -d > server/apps-src/alumdoor-worker/src/sales-production.ts
          cat server/scripts/.sales-production-payload-v2/test-*.txt \
            | base64 -d | gzip -d > server/tests/sales-production-flow.test.mjs
          cat server/scripts/.sales-production-payload-v2/patch-*.txt \
            | base64 -d | gzip -d > server/scripts/apply-sales-production-feature.mjs
          node --check server/scripts/apply-sales-production-feature.mjs
          node --check server/tests/sales-production-flow.test.mjs

      - name: Apply metadata and integration patch
        run: node server/scripts/apply-sales-production-feature.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and focused regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter cloudforge run build
          node --test \
            server/tests/door-formulas.test.mjs \
            server/tests/sales-production-flow.test.mjs \
            server/tests/sales-price-unicode-normalization.test.mjs
          pnpm --filter metaforge run typecheck

      - name: Commit verified feature
        shell: bash
        run: |
          set -euo pipefail
          rm -rf server/scripts/.sales-production-payload server/scripts/.sales-production-payload-v2
          rm -f server/scripts/apply-sales-production-feature.mjs
          rm -f .github/workflows/apply-sales-production-feature-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(sales): complete order to production flow"
          git push origin HEAD:feat/sales-order-production-flow-20260801
