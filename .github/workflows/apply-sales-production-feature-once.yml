name: Apply Sales Production Feature Once

on:
  push:
    branches:
      - feat/sales-order-production-flow-20260801
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete

permissions:
  contents: write

concurrency:
  group: apply-sales-production-feature-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feat/sales-order-production-flow-20260801' || github.ref_name == 'feat/sales-order-production-flow-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-order-production-flow-20260801
          fetch-depth: 0

      - name: Restore reviewed feature sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/tests server/scripts
          cat server/scripts/.sales-production-payload-v2/module-*.txt \
            | base64 -d | gzip -d > server/apps-src/alumdoor-worker/src/sales-production.ts
          cat server/scripts/.sales-production-payload-v2/test-*.txt \
            | base64 -d | gzip -d > server/tests/sales-production-flow.test.mjs
          cat server/scripts/.sales-production-payload-v2/patch-*.txt \
            | base64 -d | gzip -d > server/scripts/apply-sales-production-feature.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('server/scripts/apply-sales-production-feature.mjs')
          source = path.read_text().replace('\\\\n', '\\n')
          cut_before = '''  const cut = findDoctype(brief, "Cut Order");
            addField(cut, "work_order:Link(Work Order) Theo lệnh sản xuất", "so_reference");
            addField(cut, "target_color:Link(Item Color) Màu thành phẩm cần đạt", "work_order");
          '''
          cut_after = '''  const cut = brief.doctypes.find((entry) => entry.name === "Cut Order");
            if (cut) {
              addField(cut, "work_order:Link(Work Order) Theo lệnh sản xuất", "so_reference");
              addField(cut, "target_color:Link(Item Color) Màu thành phẩm cần đạt", "work_order");
            }
          '''
          if cut_before not in source:
              raise SystemExit('Cut Order compatibility patch target not found')
          source = source.replace(cut_before, cut_after)
          target_before = "    '    const copied: Record<string, unknown> = { row_id: `R${index + 1}` };',"
          target_after = "    '    const orderedQty = Number(line.qty ?? 0);\\n    const copied: Record<string, unknown> = { row_id: `R${index + 1}` };',"
          replacement_before = "    '    const copied: Record<string, unknown> = { row_id: `R${index + 1}`, sales_order_row_id: sourceRow };',"
          replacement_after = "    '    const orderedQty = Number(line.qty ?? 0);\\n    const copied: Record<string, unknown> = { row_id: `R${index + 1}`, sales_order_row_id: sourceRow };',"
          if target_before not in source or replacement_before not in source:
              raise SystemExit('Delivery row context patch target not found')
          source = source.replace(target_before, target_after).replace(replacement_before, replacement_after)
          path.write_text(source)
          PY
          node --check server/scripts/apply-sales-production-feature.mjs
          node --check server/tests/sales-production-flow.test.mjs

      - name: Apply metadata and integration patch
        run: node server/scripts/apply-sales-production-feature.mjs

      - name: Complete policy fixtures, parser and strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for brief_path in [Path('server/briefs/alumdoor.json'), Path('server/briefs/alumdoor-v2.json')]:
              brief = json.loads(brief_path.read_text())
              fixtures = {
                  fixture.get('name'): fixture.setdefault('data', {})
                  for fixture in brief.get('fixtures', [])
                  if fixture.get('type') == 'Cutting Policy'
              }
              german = fixtures.get('Cửa Đức — công thức chuẩn')
              australian = fixtures.get('Cửa Úc — công thức chuẩn')
              if german is None or australian is None:
                  raise SystemExit(f'{brief_path}: missing canonical German/Australian policy fixture')
              german.update({
                  'leaf_formula': 'Kiểu Đức',
                  'leaf_height_deduction_m': 0.13,
                  'leaf_divisor_source': 'Bản lá của bộ quy cách',
                  'leaf_rounding': 'Ngưỡng trừ-một-lá',
                  'leaf_round_threshold': 0.6,
              })
              australian.update({
                  'leaf_formula': 'Kiểu Úc',
                  'leaf_height_deduction_m': 0,
                  'leaf_divisor_source': 'Hằng số của chính sách',
                  'leaf_divisor_const': 0.465,
                  'leaf_rounding': 'Nấc 0-0.3-0.7-1',
                  'leaf_variants': [
                      {'variant_label': 'motor trong', 'addend': 2},
                      {'variant_label': 'kéo tay', 'addend': 2},
                      {'variant_label': 'motor ngoài', 'addend': 1.5},
                      {'variant_label': 'motor ngoài tự dừng', 'addend': 1.3},
                  ],
              })
              brief_path.write_text(json.dumps(brief, ensure_ascii=False, indent=2) + '\n')

          door_path = Path('server/apps-src/alumdoor-worker/src/door-formulas.ts')
          door_source = door_path.read_text()
          parser_anchor = '    ...(input.note ? { note: String(input.note) } : {}),\n  };\n}'
          parser_replacement = '''    ...(input.note ? { note: String(input.note) } : {}),
              ...(input.ray_type ? { ray_type: String(input.ray_type) as NonNullable<DoorFormulaPolicy["ray_type"]> } : {}),
              ...(input.leaf_formula ? { leaf_formula: String(input.leaf_formula) as NonNullable<DoorFormulaPolicy["leaf_formula"]> } : {}),
              ...(input.leaf_height_deduction_m == null || input.leaf_height_deduction_m === ""
                ? {}
                : { leaf_height_deduction_m: Number(input.leaf_height_deduction_m) }),
              ...(input.leaf_divisor_source
                ? { leaf_divisor_source: String(input.leaf_divisor_source) as NonNullable<DoorFormulaPolicy["leaf_divisor_source"]> }
                : {}),
              ...(input.leaf_divisor_const == null || input.leaf_divisor_const === ""
                ? {}
                : { leaf_divisor_const: Number(input.leaf_divisor_const) }),
              ...(input.leaf_rounding
                ? { leaf_rounding: String(input.leaf_rounding) as NonNullable<DoorFormulaPolicy["leaf_rounding"]> }
                : {}),
              ...(input.leaf_round_threshold == null || input.leaf_round_threshold === ""
                ? {}
                : { leaf_round_threshold: Number(input.leaf_round_threshold) }),
              ...(Array.isArray(input.leaf_variants)
                ? { leaf_variants: input.leaf_variants as NonNullable<DoorFormulaPolicy["leaf_variants"]> }
                : {}),
            };
          }'''
          if door_source.count(parser_anchor) != 1:
              raise SystemExit(f'policy parser anchor count={door_source.count(parser_anchor)}')
          door_path.write_text(door_source.replace(parser_anchor, parser_replacement, 1))

          index_path = Path('server/apps-src/alumdoor-worker/src/index.ts')
          index_source = index_path.read_text()
          index_needle = '    const sourceRow = String(line.row_id ?? line.name ?? `R${index + 1}`).trim();'
          index_replacement = '    const orderedStock = Number(line.stock_qty ?? line.qty ?? 0);\n' + index_needle
          if index_source.count(index_needle) != 1:
              raise SystemExit(f'orderedStock insertion target count={index_source.count(index_needle)}')
          index_path.write_text(index_source.replace(index_needle, index_replacement, 1))

          production_path = Path('server/apps-src/alumdoor-worker/src/sales-production.ts')
          production_source = production_path.read_text()
          replacements = [
              (
                  '      mesh_height_m: row.mesh_height_m == null || row.mesh_height_m === "" ? undefined : Number(row.mesh_height_m),',
                  '      ...(row.mesh_height_m == null || row.mesh_height_m === "" ? {} : { mesh_height_m: Number(row.mesh_height_m) }),',
                  1,
              ),
              (
                  '      kg_per_m2: Number(item.purchase_kg_per_m2 ?? 0) || undefined,',
                  '      ...(Number(item.purchase_kg_per_m2 ?? 0) > 0 ? { kg_per_m2: Number(item.purchase_kg_per_m2) } : {}),',
                  2,
              ),
              (
                  '      mesh_height_m: args.mesh_height_m == null || args.mesh_height_m === "" ? undefined : Number(args.mesh_height_m),',
                  '      ...(args.mesh_height_m == null || args.mesh_height_m === "" ? {} : { mesh_height_m: Number(args.mesh_height_m) }),',
                  1,
              ),
          ]
          for before, after, expected in replacements:
              count = production_source.count(before)
              if count != expected:
                  raise SystemExit(f'strict optional target count={count}, expected={expected}: {before}')
              production_source = production_source.replace(before, after)
          production_path.write_text(production_source)
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and focused regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter cloudforge run build
          node --test \
            server/tests/door-formulas.test.mjs \
            server/tests/sales-production-flow.test.mjs \
            server/tests/sales-price-unicode-normalization.test.mjs
          pnpm --filter metaforge run typecheck

      - name: Commit verified feature
        shell: bash
        run: |
          set -euo pipefail
          rm -rf server/scripts/.sales-production-payload server/scripts/.sales-production-payload-v2
          rm -f server/scripts/apply-sales-production-feature.mjs
          rm -f .github/workflows/apply-sales-production-feature-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(sales): complete order to production flow"
          git push origin HEAD:feat/sales-order-production-flow-20260801
