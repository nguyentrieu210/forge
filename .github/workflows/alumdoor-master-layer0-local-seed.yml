name: Seed Alumdoor Local Master Layer 0

on:
  workflow_run:
    workflows:
      - Bootstrap Alumdoor Local C Drive
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  seed-layer0:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]
    timeout-minutes: 45
    env:
      FORGE_LOCAL_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      FORGE_LOCAL_REQUIRED_SERVICES: backend
    steps:
      - name: Run canonical local Layer 0 contract
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts\local-runner\run-local-import.mjs layer0
          if ($LASTEXITCODE -ne 0) { throw "Layer 0 execution contract failed with exit code $LASTEXITCODE" }

      - name: Print execution evidence on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host '=== latest execution-layer evidence ==='
          $root = 'C:\alumdoor\local-backups\execution-layer\layer0'
          if (Test-Path $root) {
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 2 |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-ChildItem $_.FullName -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
              }
          }
