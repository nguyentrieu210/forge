name: Validate WS01 Finance

on:
  push:
    branches:
      - agent/ent-01-finance-vn
  pull_request:
    branches:
      - main
    paths:
      - server/apps-src/vn-accounting/**
      - server/apps-src/vn-accounting-worker/**
      - server/packages/clouderp-erpnext/src/finance-budget.ts
      - server/packages/clouderp-erpnext/src/registry.ts
      - server/migrations/tenant/0048_*.sql
      - server/migrations/tenant/0049_*.sql
      - server/migrations/tenant/0050_*.sql
      - server/migrations/tenant/0051_*.sql
      - server/migrations/tenant/0052_*.sql
      - server/migrations/tenant/0053_*.sql
      - server/migrations/tenant/0054_*.sql
      - server/scripts/test-vn-*.py
      - server/scripts/test-finance-budget-migration.py
      - server/tests/vn-*.test.mjs
      - server/tests/finance-budget.test.mjs
      - server/package.json
      - .github/workflows/validate-ws01-finance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --prefer-offline 2>&1 | tail -n 80
      - name: Build server
        run: |
          set -o pipefail
          pnpm --filter cloudforge run build 2>&1 | tail -n 80
      - name: Unit regressions
        run: |
          set -o pipefail
          pnpm --filter cloudforge run test:unit 2>&1 | tail -n 80
      - name: SQL regressions
        run: |
          set -o pipefail
          pnpm --filter cloudforge run test:sql 2>&1 | tail -n 80
      - name: Validate VN accounting package
        run: |
          set -o pipefail
          pnpm --filter cloudforge run app:check 2>&1 | tail -n 80
      - name: Typecheck worker boundary
        run: |
          set -o pipefail
          pnpm --filter cloudforge run typecheck:workers 2>&1 | tail -n 80
