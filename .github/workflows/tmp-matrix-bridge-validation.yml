name: TMP Matrix Bridge Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'feat/matrix-named-source-action-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact workspace
        run: pnpm install --frozen-lockfile
      - name: Compile server and isolate Matrix-owned errors
        shell: bash
        run: |
          set +e
          pnpm --dir server exec tsc -p tsconfig.json --noEmitOnError false 2>&1 | tee /tmp/server-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          echo "full server tsc status=${status}; current main has unrelated compile debt, so owned-path errors are gated separately"
          if grep -E 'apps/tenant-worker/src/(pricing-matrix-binding|matrix-api|matrix-canonical-mutation)\.ts' /tmp/server-tsc.log; then
            echo "Matrix-owned server TypeScript errors remain"
            exit 1
          fi
          test -f server/dist/apps/tenant-worker/src/matrix-api.js
          test -f server/dist/apps/tenant-worker/src/pricing-matrix-binding.js
          test -f server/dist/apps/tenant-worker/src/matrix-canonical-mutation.js
          (cd server && node scripts/ensure-tenant-worker-core.mjs)
      - name: Server Matrix and App Factory regressions
        working-directory: server
        run: >-
          node --test
          tests/matrix-source-action-registry.test.mjs
          tests/read-brief-matrix-sidecar.test.mjs
          tests/alumdoor-matrix-view-contract.test.mjs
          tests/pricing-matrix-authority.test.mjs
          tests/ui01-compile-view-policy.test.mjs
      - name: Matrix views typecheck and tests
        run: pnpm --dir client --filter @metaforge/views run test:matrix
      - name: Shared runtime domain-leak gate
        working-directory: client
        run: node scripts/check-matrix-domain-leaks.mjs
