name: Pilot-04 Synthetic Cutover Decision Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/pilot/alumdoor/PILOT_04_SYNTHETIC_DECISION_V1.json"
      - "docs/pilot/alumdoor/PILOT_04_STATUS.json"
      - "docs/pilot/alumdoor/tools/evaluate-pilot-04-synthetic.mjs"
      - "docs/pilot/alumdoor/tools/evaluate-pilot-04-synthetic.test.mjs"
      - ".github/workflows/pilot-04-synthetic-decision.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-04-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    name: Rehearse deterministic synthetic GO and NO-GO gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax and authority checks
        run: |
          node --check docs/pilot/alumdoor/tools/evaluate-pilot-04-synthetic.mjs
          node --check docs/pilot/alumdoor/tools/evaluate-pilot-04-synthetic.test.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('docs/pilot/alumdoor/PILOT_00_LOCK.json', 'utf8'));
          const p01 = JSON.parse(fs.readFileSync('docs/pilot/alumdoor/PILOT_01_STATUS.json', 'utf8'));
          const p02 = JSON.parse(fs.readFileSync('docs/pilot/alumdoor/PILOT_02_STATUS.json', 'utf8'));
          const p03 = JSON.parse(fs.readFileSync('docs/pilot/alumdoor/PILOT_03_STATUS.json', 'utf8'));
          if (lock.status !== 'PILOT-00-LOCKED') throw new Error('Pilot-00 lock missing');
          if (p01.blocking_mode !== 'EXTERNAL_SOURCE_DEPENDENCY') throw new Error('real Pilot-01 boundary unexpectedly changed');
          if (p02.synthetic_pilot_02?.status !== 'SYNTHETIC_DRY_RUN_PASS') throw new Error('Pilot-02 synthetic PASS missing');
          if (p03.synthetic_pilot_03?.status !== 'SYNTHETIC_PARALLEL_PASS') throw new Error('Pilot-03 synthetic PASS missing');
          NODE

      - name: Run deterministic GO and NO-GO scenario tests
        run: node --test docs/pilot/alumdoor/tools/evaluate-pilot-04-synthetic.test.mjs

      - name: Verify baseline synthetic GO is authorization-safe
        shell: bash
        run: |
          set -euo pipefail
          node docs/pilot/alumdoor/tools/evaluate-pilot-04-synthetic.mjs > /tmp/pilot-04-decision.json
          node - /tmp/pilot-04-decision.json <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (result.synthetic_verdict !== 'GO') throw new Error(`expected synthetic GO, got ${result.synthetic_verdict}`);
          if (result.blockers.length !== 0) throw new Error('baseline synthetic GO has blockers');
          if (result.passed_gate_count !== result.gate_count) throw new Error('not all synthetic GO gates passed');
          if (result.production_write_authorized !== false) throw new Error('production write must remain false');
          if (result.cutover_authorized !== false) throw new Error('cutover authorization must remain false');
          if (result.real_pilot_transition_allowed !== false) throw new Error('real pilot transition must remain false');
          NODE

      - name: Assert no production mutation or cutover path
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/pilot-04-synthetic-decision.yml
          ! grep -nE 'environment:[[:space:]]*production|CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|wrangler[[:space:]]+deploy|alu\.kairo\.vn|deploy-tenant\.mjs|migrate-tenant\.mjs|--remote' "$workflow"
          grep -q '"production_write_authorized": false' docs/pilot/alumdoor/PILOT_04_SYNTHETIC_DECISION_V1.json
          grep -q '"cutover_authorized": false' docs/pilot/alumdoor/PILOT_04_SYNTHETIC_DECISION_V1.json
          grep -q '"real_pilot_transition_allowed": false' docs/pilot/alumdoor/PILOT_04_SYNTHETIC_DECISION_V1.json
          git diff --check

      - name: Upload rehearsal decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-04-synthetic-decision-${{ github.run_id }}
          path: /tmp/pilot-04-decision.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Pilot-04 synthetic cutover-decision rehearsal'
            echo '- Tests deterministic GO/NO-GO governance only.'
            echo '- Synthetic GO is never production/cutover authorization.'
            echo '- Real Pilot-01 remains externally blocked and real Pilot-04 remains NOT STARTED.'
          } >> "$GITHUB_STEP_SUMMARY"
