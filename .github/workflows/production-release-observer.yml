name: Production Release Observer

on:
  workflow_run:
    workflows:
      - Release Alumdoor App Worker Production
      - Release alu Tenant Worker Production
      - Release Gateway Production
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  publish-evidence:
    name: Publish release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Download release evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "*production-release-*"
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build redacted report
        if: always()
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVIDENCE_ROOT: ${{ runner.temp }}/release-evidence
          REPORT_PATH: ${{ runner.temp }}/release-report.md
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production release evidence"
            echo
            echo "- Workflow: \`$WORKFLOW_NAME\`"
            echo "- Run ID: \`$RUN_ID\`"
            echo "- Head SHA: \`$HEAD_SHA\`"
            echo "- Conclusion: **${CONCLUSION^^}**"
            echo "- Workflow run: $RUN_URL"
            echo
            summary="$(find "$EVIDENCE_ROOT" -type f -name summary.md -print -quit 2>/dev/null || true)"
            state="$(find "$EVIDENCE_ROOT" -type f -name state.txt -print -quit 2>/dev/null || true)"
            if [ -n "$summary" ]; then
              cat "$summary"
            elif [ -n "$state" ]; then
              echo '```text'
              cat "$state"
              echo '```'
            else
              echo '> Release artifact was unavailable. The workflow conclusion and run link above remain authoritative.'
            fi
          } > "$REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert source PR evidence
        if: always()
        uses: actions/github-script@v7
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          REPORT_PATH: ${{ runner.temp }}/release-report.md
        with:
          script: |
            const fs = require('node:fs');
            const mapping = {
              'Release Alumdoor App Worker Production': { issue: 82, marker: '<!-- alumdoor-app-production-evidence -->' },
              'Release alu Tenant Worker Production': { issue: 113, marker: '<!-- alu-tenant-production-evidence -->' },
              'Release Gateway Production': { issue: 114, marker: '<!-- gateway-production-evidence -->' },
            };
            const target = mapping[process.env.WORKFLOW_NAME];
            if (!target) throw new Error(`No evidence target for ${process.env.WORKFLOW_NAME}`);
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${target.marker}\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: target.issue,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(target.marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.issue,
                body,
              });
            }
