name: Alumdoor Item Import Policy

on:
  push:
    paths:
      - 'server/scripts/lib/alumdoor-item-import-policy.mjs'
      - 'server/scripts/lib/alumdoor-item-source-contract.mjs'
      - 'server/scripts/lib/alumdoor-item-evidence-overrides.mjs'
      - 'server/scripts/lib/alumdoor-item-source-preflight.mjs'
      - 'server/scripts/lib/alumdoor-item-blocker-partition.mjs'
      - 'server/scripts/lib/alumdoor-item-known-source-defects.mjs'
      - 'server/scripts/lib/alumdoor-item-master-classification.mjs'
      - 'server/scripts/preflight-alumdoor-item-catalog.mjs'
      - 'server/scripts/preflight-alumdoor-item-source-records.mjs'
      - 'server/scripts/build-alumdoor-item-master-payload.mjs'
      - 'server/scripts/import-alumdoor-item-master-local.mjs'
      - 'server/scripts/export-alumdoor-item-reference-map.mjs'
      - 'server/scripts/test-alumdoor-item-import-policy.mjs'
      - 'server/scripts/test-alumdoor-item-source-contract.mjs'
      - 'server/scripts/test-alumdoor-item-evidence-overrides.mjs'
      - 'server/scripts/test-alumdoor-item-luoimv-inox.mjs'
      - 'server/scripts/test-alumdoor-item-bkan-uom.mjs'
      - 'server/scripts/test-alumdoor-item-super-spec.mjs'
      - 'server/scripts/test-alumdoor-item-known-source-defects.mjs'
      - 'server/scripts/test-alumdoor-item-source-preflight.mjs'
      - 'server/scripts/test-alumdoor-item-master-classification.mjs'
      - 'server/scripts/test-alumdoor-item-master-payload.mjs'
      - 'server/scripts/test-alumdoor-item-local-importer.mjs'
      - 'server/scripts/test-alumdoor-item-catalog-preflight.mjs'
      - '.github/workflows/alumdoor-item-import-policy.yml'
  pull_request:
    paths:
      - 'server/scripts/lib/alumdoor-item-import-policy.mjs'
      - 'server/scripts/lib/alumdoor-item-source-contract.mjs'
      - 'server/scripts/lib/alumdoor-item-evidence-overrides.mjs'
      - 'server/scripts/lib/alumdoor-item-source-preflight.mjs'
      - 'server/scripts/lib/alumdoor-item-blocker-partition.mjs'
      - 'server/scripts/lib/alumdoor-item-known-source-defects.mjs'
      - 'server/scripts/lib/alumdoor-item-master-classification.mjs'
      - 'server/scripts/preflight-alumdoor-item-catalog.mjs'
      - 'server/scripts/preflight-alumdoor-item-source-records.mjs'
      - 'server/scripts/build-alumdoor-item-master-payload.mjs'
      - 'server/scripts/import-alumdoor-item-master-local.mjs'
      - 'server/scripts/export-alumdoor-item-reference-map.mjs'
      - 'server/scripts/test-alumdoor-item-import-policy.mjs'
      - 'server/scripts/test-alumdoor-item-source-contract.mjs'
      - 'server/scripts/test-alumdoor-item-evidence-overrides.mjs'
      - 'server/scripts/test-alumdoor-item-luoimv-inox.mjs'
      - 'server/scripts/test-alumdoor-item-bkan-uom.mjs'
      - 'server/scripts/test-alumdoor-item-super-spec.mjs'
      - 'server/scripts/test-alumdoor-item-known-source-defects.mjs'
      - 'server/scripts/test-alumdoor-item-source-preflight.mjs'
      - 'server/scripts/test-alumdoor-item-master-classification.mjs'
      - 'server/scripts/test-alumdoor-item-master-payload.mjs'
      - 'server/scripts/test-alumdoor-item-local-importer.mjs'
      - 'server/scripts/test-alumdoor-item-catalog-preflight.mjs'
      - '.github/workflows/alumdoor-item-import-policy.yml'
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node server/scripts/test-alumdoor-item-import-policy.mjs
      - run: node server/scripts/test-alumdoor-item-source-contract.mjs
      - run: node server/scripts/test-alumdoor-item-evidence-overrides.mjs
      - run: node server/scripts/test-alumdoor-item-luoimv-inox.mjs
      - run: node server/scripts/test-alumdoor-item-bkan-uom.mjs
      - run: node server/scripts/test-alumdoor-item-super-spec.mjs
      - run: node server/scripts/test-alumdoor-item-known-source-defects.mjs
      - run: node server/scripts/test-alumdoor-item-source-preflight.mjs
      - run: node server/scripts/test-alumdoor-item-master-classification.mjs
      - run: node server/scripts/test-alumdoor-item-master-payload.mjs
      - run: node server/scripts/test-alumdoor-item-local-importer.mjs
      - run: node server/scripts/test-alumdoor-item-catalog-preflight.mjs
      - name: Reject retired legacy Item reference source
        shell: bash
        run: |
          if ALUMDOOR_ALLOW_LEGACY_ITEM_SQL=0 node server/scripts/export-alumdoor-item-reference-map.mjs server/imports/alumdoor-item-only-2026-08-11.sql alumdoor-item-reference-map.json; then
            echo "Retired legacy Item source was unexpectedly accepted" >&2
            exit 1
          fi
          echo "ALUMDOOR_LEGACY_ITEM_SOURCE_RETIRED_PASS"
