name: Alumdoor Item Import Policy

on:
  push:
    paths:
      - 'server/scripts/lib/alumdoor-item-import-policy.mjs'
      - 'server/scripts/preflight-alumdoor-item-catalog.mjs'
      - 'server/scripts/export-alumdoor-item-reference-map.mjs'
      - 'server/scripts/test-alumdoor-item-import-policy.mjs'
      - 'server/scripts/test-alumdoor-item-catalog-preflight.mjs'
      - 'server/imports/alumdoor-item-only-2026-08-11.sql'
      - '.github/workflows/alumdoor-item-import-policy.yml'
  pull_request:
    paths:
      - 'server/scripts/lib/alumdoor-item-import-policy.mjs'
      - 'server/scripts/preflight-alumdoor-item-catalog.mjs'
      - 'server/scripts/export-alumdoor-item-reference-map.mjs'
      - 'server/scripts/test-alumdoor-item-import-policy.mjs'
      - 'server/scripts/test-alumdoor-item-catalog-preflight.mjs'
      - 'server/imports/alumdoor-item-only-2026-08-11.sql'
      - '.github/workflows/alumdoor-item-import-policy.yml'
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node server/scripts/test-alumdoor-item-import-policy.mjs
      - run: node server/scripts/test-alumdoor-item-catalog-preflight.mjs
      - name: Export Item reference map
        run: node server/scripts/export-alumdoor-item-reference-map.mjs server/imports/alumdoor-item-only-2026-08-11.sql alumdoor-item-reference-map.json
      - uses: actions/upload-artifact@v4
        with:
          name: alumdoor-item-reference-map
          path: alumdoor-item-reference-map.json
          if-no-files-found: error
