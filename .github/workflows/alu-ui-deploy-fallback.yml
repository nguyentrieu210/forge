name: ALU UI Deploy Fallback

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "client/**"

permissions:
  contents: read

concurrency:
  group: production-alu-ui
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy merged ALU UI fallback
    if: github.event.pull_request.merged == true && github.event.pull_request.title == 'ci(ui): retrigger ALU production UI deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      VITE_FORGE_RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require target merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Gateway UI only
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter runtime... run build
          pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json
          pnpm --dir client/apps/kho exec vite build --config vite.mobile.config.ts

      - name: Stage UI bundle
        run: node server/scripts/stage-client-bundle.mjs

      - name: Deploy Gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Verify exact live release
        run: >-
          node server/scripts/sre-health-snapshot.mjs
          --base https://alu.kairo.vn
          --expected-release-sha "$TARGET_SHA"
          --allow-remote
          --confirm-host alu.kairo.vn
          --attempts 10
          --delay-ms 2000
