name: ALU Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      scope:
        description: Deploy UI only or perform the full production release
        required: true
        default: ui
        type: choice
        options:
          - ui
          - full
      confirm:
        description: Type alu to confirm production deploy
        required: true
        type: string
      target_sha:
        description: Exact merged main SHA to build and deploy; defaults to selected ref SHA
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'issue_comment' && 'production-security-v2-bootstrap' || ((github.event_name == 'push' || inputs.scope == 'ui') && 'production-alu-ui' || 'production-alu-full') }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  ui-deploy:
    name: Fast UI build and deploy after main merge
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ui' && inputs.confirm == 'alu')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_FORGE_RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha || github.sha }}
    outputs:
      target_sha: ${{ steps.release-target.outputs.target_sha }}

    steps:
      - name: Record release target
        id: release-target
        shell: bash
        run: echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout merged UI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require manual UI target to be merged into main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Refusing production UI release: $TARGET_SHA is not merged into main."
            exit 1
          }

      - name: Guard automatic main push as UI-only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(jq -r '[.commits[]? | (.added[]?, .modified[]?, .removed[]?)] | unique[]' "$GITHUB_EVENT_PATH")
          if [ "${#changed[@]}" -eq 0 ]; then
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          fi
          test "${#changed[@]}" -gt 0

          has_client=false
          for file in "${changed[@]}"; do
            case "$file" in
              client/*) has_client=true ;;
              RUNBOOK.md|CURRENT_STATUS.md|NEXT_TASKS.md|AI_HANDOFF.md|DELIVERY_POLICY.md|docs/agents/workstreams/*) ;;
              *)
                echo "Blocked non-UI file in automatic production UI deploy: $file"
                exit 1
                ;;
            esac
          done
          test "$has_client" = true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from cache
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Gateway UI only
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter runtime... run build
          pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json
          pnpm --dir client/apps/kho exec vite build --config vite.mobile.config.ts

      - name: Stage UI bundle
        run: node server/scripts/stage-client-bundle.mjs

      - name: Deploy Gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

  build-deploy:
    name: Build and deploy full ALU release
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full' && inputs.confirm == 'alu'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      TENANT: alu
      APP_WORKER: cloudforge-app-alumdoor
      DISPATCH_NAMESPACE: cloudforge-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_FORGE_RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
    outputs:
      target_sha: ${{ steps.release-target.outputs.target_sha }}

    steps:
      - name: Record release target
        id: release-target
        shell: bash
        run: echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require target to be merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Refusing production full release: $TARGET_SHA is not merged into main."
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile frozen-install worktree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          for file in "${dirty[@]}"; do
            case "$file" in
              pnpm-lock.yaml)
                echo "Restoring exact candidate lockfile after successful frozen install."
                git restore --source=HEAD --staged --worktree -- pnpm-lock.yaml
                ;;
              *)
                echo "Refusing full release: dependency install changed unexpected source path: $file"
                exit 1
                ;;
            esac
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build once
        run: |
          pnpm --filter cloudforge run build
          pnpm --filter metaforge run build
          node server/scripts/stage-client-bundle.mjs

      - name: Guard full-release generated worktree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          for file in "${dirty[@]}"; do
            case "$file" in
              client/apps/kho/dist-mobile/*|server/apps/gateway-worker/public/*) ;;
              *)
                echo "Refusing full release: unexpected worktree change after exact build: $file"
                exit 1
                ;;
            esac
          done
          printf 'Approved generated release paths (%s):\n' "${#dirty[@]}"
          printf '  %s\n' "${dirty[@]}"

      - name: Plan tenant migrations
        working-directory: server
        run: node scripts/migrate-tenant.mjs --tenant "$TENANT"

      - name: Backup and verify tenant before migration
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/alu-backup"
          mkdir -p "$backup_dir"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$backup_dir"
          mapfile -t backups < <(find "$backup_dir" -maxdepth 1 -type f -name '*.sql' -print | sort)
          [ "${#backups[@]}" -eq 1 ] || {
            echo "Expected exactly one SQL backup, found ${#backups[@]}."
            exit 1
          }
          node server/scripts/verify-tenant-backup.mjs \
            --tenant "$TENANT" \
            --file "${backups[0]}" \
            --output "$RUNNER_TEMP/alu-backup-verification.json"

      - name: Migrate tenant
        working-directory: server
        run: node scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" --allow-dirty

      - name: Deploy tenant Worker
        working-directory: server
        run: node scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" --allow-dirty

      - name: Deploy Alumdoor app Worker
        working-directory: server
        run: |
          pnpm exec wrangler deploy \
            --config apps-src/alumdoor-worker/wrangler.jsonc \
            --name "$APP_WORKER" \
            --dispatch-namespace "$DISPATCH_NAMESPACE" \
            --strict

      - name: Deploy Gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Upload backup verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-backup-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-backup-verification.json
          if-no-files-found: warn
          retention-days: 30

  security-v2-bootstrap:
    name: Bootstrap Security Generation V2
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/forge-security-v2-bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    outputs:
      target_sha: ${{ steps.command.outputs.target_sha }}

    steps:
      - name: Checkout trusted default-branch security command parser
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and authorize Security V2 owner command
        id: command
        env:
          FORGE_SECURITY_V2_COMMAND_BODY: ${{ github.event.comment.body }}
          FORGE_SECURITY_V2_COMMAND_ISSUE: ${{ github.event.issue.number }}
          FORGE_SECURITY_V2_COMMAND_AUTHOR: ${{ github.event.comment.user.login }}
          FORGE_SECURITY_V2_COMMAND_ASSOCIATION: ${{ github.event.comment.author_association }}
          FORGE_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node server/scripts/parse-security-v2-command.mjs

      - name: Checkout exact authorized Security V2 revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.command.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require Security V2 target to be merged into main
        shell: bash
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Refusing Security V2 production bootstrap: $TARGET_SHA is not merged into main."
            exit 1
          }

      - name: Require production provider credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Set up pnpm for Security V2
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js for Security V2
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked Security V2 dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Security V2 release candidate and exact Gateway client bundle
        env:
          VITE_FORGE_RELEASE_SHA: ${{ steps.command.outputs.target_sha }}
        run: |
          pnpm --filter cloudforge run build
          pnpm --filter runtime... run build
          pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json
          pnpm --dir client/apps/kho exec vite build --config vite.mobile.config.ts
          node server/scripts/stage-client-bundle.mjs

      - name: Guard Security V2 generated worktree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          for file in "${dirty[@]}"; do
            case "$file" in
              client/apps/kho/dist-mobile/*|server/apps/gateway-worker/public/*) ;;
              *)
                echo "Refusing Security V2 release: unexpected worktree change after exact build: $file"
                exit 1
                ;;
            esac
          done

      - name: Verify Security V2 source contracts
        run: |
          node --test \
            server/tests/security-generation-v2.test.mjs \
            server/tests/control-security-v2.test.mjs \
            server/tests/security-v2-command.test.mjs
          python3 server/scripts/test-security-v2-migration.py
          node --check server/scripts/bootstrap-security-v2.mjs
          node --check server/scripts/provision-tenant-v2.mjs

      - name: Resolve canonical Cloudflare account
        id: security-account
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { resolveCloudflareAccountId } from './server/scripts/lib/demo-provider-credentials.mjs';
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is required');
          const resolved = await resolveCloudflareAccountId({ token, accountHint: '' });
          appendFileSync(process.env.GITHUB_OUTPUT, `account_id=${resolved.accountId}\n`, 'utf8');
          console.log(`provider account selected by ${resolved.selection}`);
          NODE

      - name: Backup Control D1 before Security V2 migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir server exec wrangler d1 export cloudforge-control \
            --config apps/control-plane-worker/wrangler.jsonc \
            --remote \
            --skip-confirmation \
            --output "$RUNNER_TEMP/control-pre-security-v2.sql"
          test -s "$RUNNER_TEMP/control-pre-security-v2.sql"

      - name: Apply append-only Control Security V2 migration
        working-directory: server
        run: node scripts/d1-migrate-remote.mjs --config apps/control-plane-worker/wrangler.jsonc

      - name: Coordinate V2 platform masters before first V2 tenant
        working-directory: server
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          ACCOUNT_ID: ${{ steps.security-account.outputs.account_id }}
        run: >-
          node scripts/bootstrap-security-v2.mjs
          --phase prepare
          --account "$ACCOUNT_ID"
          --source-sha "$TARGET_SHA"

      - name: Deploy Control Plane V2 wrapper
        working-directory: server
        run: pnpm exec wrangler deploy --config apps/control-plane-worker/wrangler.jsonc

      - name: Deploy Jobs V2 wrapper
        working-directory: server
        run: pnpm exec wrangler deploy --config apps/jobs-worker/wrangler.jsonc

      - name: Deploy Gateway V2 wrapper
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Finalize immutable Security V2 provider account authority
        working-directory: server
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          ACCOUNT_ID: ${{ steps.security-account.outputs.account_id }}
        run: >-
          node scripts/bootstrap-security-v2.mjs
          --phase finalize
          --account "$ACCOUNT_ID"
          --source-sha "$TARGET_SHA"

      - name: Upload Security V2 backup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-v2-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/control-pre-security-v2.sql
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Security V2 result back to command issue
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = process.env.JOB_STATUS === 'success';
            const lines = [
              `## Forge Security V2 Bootstrap ${ok ? 'SUCCESS' : 'FAILED'}`,
              '',
              `- Target SHA: ${process.env.TARGET_SHA || '(parse failed)'}`,
              `- Run: ${runUrl}`,
              `- Legacy ALU verification: ${ok ? 'delegated to canonical verify-production' : 'see run'}`,
            ];
            if (!ok) lines.push('', 'No automatic rollback or destructive cleanup was attempted.');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });

  verify-production:
    name: Verify exact production convergence
    needs: [ui-deploy, build-deploy, security-v2-bootstrap]
    if: ${{ always() && (needs.ui-deploy.result == 'success' || needs.build-deploy.result == 'success' || needs.security-v2-bootstrap.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ needs.ui-deploy.outputs.target_sha || needs.build-deploy.outputs.target_sha || needs.security-v2-bootstrap.outputs.target_sha }}

    steps:
      - name: Checkout current SRE control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe health, auth boundary and exact UI release marker
        run: >-
          node server/scripts/sre-health-snapshot.mjs
          --base https://alu.kairo.vn
          --expected-release-sha "$TARGET_SHA"
          --allow-remote
          --confirm-host alu.kairo.vn
          --attempts 10
          --delay-ms 2000
          --output "$RUNNER_TEMP/release-health.json"

      - name: Upload release health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-release-health-${{ github.run_id }}
          path: ${{ runner.temp }}/release-health.json
          if-no-files-found: warn
          retention-days: 30
