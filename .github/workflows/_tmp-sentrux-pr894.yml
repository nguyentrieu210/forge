name: Temporary Sentrux PR 894
on:
  push:
    branches: ['agent/alumdoor-bom-draft-guidance']
    paths: ['.github/workflows/_tmp-sentrux-pr894.yml']
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install Sentrux
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
      - name: Enforce committed architecture rules
        run: |
          set -euo pipefail
          test -f .sentrux/rules.toml
          sentrux check .
      - name: Capture quality signal
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/gate.txt
          grep -E 'Quality:' /tmp/gate.txt || true
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-sentrux-pr894.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/_tmp-sentrux-pr894.yml
          git commit -m 'ci: remove PR 894 Sentrux validation'
          git push origin HEAD:agent/alumdoor-bom-draft-guidance
