name: Temporary Sentrux PR 894
on:
  push:
    branches: ['agent/alumdoor-bom-draft-guidance']
    paths: ['.github/workflows/_tmp-sentrux-pr894.yml']
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install Sentrux
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
      - name: Compare head with PR 893 base
        shell: bash
        run: |
          set -u
          rm .github/workflows/_tmp-sentrux-pr894.yml

          set +e
          sentrux check . > /tmp/head-check.txt 2>&1
          head_check=$?
          sentrux gate --save . > /tmp/head-gate.txt 2>&1
          head_gate=$?

          git worktree add --detach /tmp/pr893 03de0547197992caac88a3abd60c0ab1ec5b3a3b >/tmp/worktree.txt 2>&1
          cd /tmp/pr893
          sentrux check . > /tmp/base-check.txt 2>&1
          base_check=$?
          sentrux gate --save . > /tmp/base-gate.txt 2>&1
          base_gate=$?
          cd "$GITHUB_WORKSPACE"
          set -e

          echo "HEAD_CHECK_EXIT=$head_check"
          echo "HEAD_GATE_EXIT=$head_gate"
          echo "BASE_CHECK_EXIT=$base_check"
          echo "BASE_GATE_EXIT=$base_gate"
          echo '=== HEAD CHECK ==='
          cat /tmp/head-check.txt
          echo '=== HEAD GATE ==='
          cat /tmp/head-gate.txt
          echo '=== BASE CHECK ==='
          cat /tmp/base-check.txt
          echo '=== BASE GATE ==='
          cat /tmp/base-gate.txt

          head_quality=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/head-gate.txt | tail -1 || true)
          base_quality=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/base-gate.txt | tail -1 || true)
          echo "::notice title=Sentrux PR894 head::check=$head_check gate=$head_gate ${head_quality:-Quality unavailable}"
          echo "::notice title=Sentrux PR893 base::check=$base_check gate=$base_gate ${base_quality:-Quality unavailable}"

          while IFS= read -r line; do
            [ -n "$line" ] && echo "::warning title=Sentrux HEAD::$line"
          done < <(grep -Ei 'quality|boundary|cycle|circular|violation|fail|error|threshold|minimum' /tmp/head-check.txt | tail -20 || true)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::warning title=Sentrux BASE::$line"
          done < <(grep -Ei 'quality|boundary|cycle|circular|violation|fail|error|threshold|minimum' /tmp/base-check.txt | tail -20 || true)
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/_tmp-sentrux-pr894.yml
          git commit -m 'ci: remove PR 894 Sentrux validation'
          git push origin HEAD:agent/alumdoor-bom-draft-guidance
