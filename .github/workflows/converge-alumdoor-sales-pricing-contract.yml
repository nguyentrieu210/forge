name: Converge Alumdoor Sales Pricing Contract

on:
  push:
    branches:
      - agent/alumdoor-sales-order-v2-complete

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report cutting fixtures
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const b = JSON.parse(fs.readFileSync('server/briefs/alumdoor.json','utf8'));
          const rows=(b.fixtures||[]).filter(x=>x.type==='Cutting Policy').map(x=>({name:x.name,door_type:x.data?.door_type,leaf_formula:x.data?.leaf_formula,ray_type:x.data?.ray_type,leaf_divisor_const:x.data?.leaf_divisor_const,leaf_rounding:x.data?.leaf_rounding,leaf_height_deduction_m:x.data?.leaf_height_deduction_m}));
          console.log(JSON.stringify(rows,null,2));
          console.log('COUNT',rows.length);
          console.log('::error title=Cutting fixture catalog::'+JSON.stringify(rows));
          NODE
