name: Converge Alumdoor Sales Pricing Contract

on:
  push:
    branches:
      - agent/alumdoor-sales-order-v2-complete

permissions:
  contents: write

jobs:
  converge:
    if: ${{ !contains(github.event.head_commit.message, '[pricing-contract-converged]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align source contract with runtime controller
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/briefs/alumdoor.json")
          source = path.read_text(encoding="utf-8")
          old = '''      "//do": [
              "Đơn hàng để TRỐNG `selling_price_list` thì giá gõ tay như cũ — đó là mặc định, và là",
              "cách xưởng đang làm ('tùy trường hợp'). CHỌN một bảng giá thì giá do SERVER quyết:",
              "nhân đọc `Item Price` tên `<bảng giá>:<mã hàng>:<ĐVT>`, áp `Pricing Rule` khớp nhất, rồi GHI",
              "ĐÈ đơn giá trên dòng. Thiếu dòng Item Price cho một mặt hàng thì ĐƠN BỊ TỪ CHỐI, không",
              "im lặng lấy giá 0 — nhưng cũng có nghĩa là bật bảng giá thì phải nạp đủ giá trước."
            ],'''
          new = '''      "//do": [
              "Đơn bán hàng phải resolve được `selling_price_list` trước khi lưu — controller runtime là authority.",
              "Người lập vẫn được nhập đơn giá/chiết khấu trên dòng; server so với Item Price + Pricing Rule và",
              "đánh dấu cần duyệt khi lệch chính sách. Submit mới là boundary kiểm quyền duyệt thương mại.",
              "Thiếu Item Price phù hợp với bảng giá/mã hàng/ĐVT thì từ chối thay vì im lặng lấy giá 0."
            ],'''
          if old not in source:
              if "Đơn bán hàng phải resolve được `selling_price_list`" in source:
                  print("Pricing contract source is already converged.")
                  raise SystemExit(0)
              raise SystemExit("Legacy Price List contract block not found byte-exactly.")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Regenerate Alumdoor V2 brief
        run: node server/scripts/build-alumdoor-v2-brief.mjs
      - name: Verify generated diff
        run: |
          git diff --check
          git diff --exit-code -- server/scripts/build-alumdoor-v2-brief.mjs
          git status --short
      - name: Commit generated convergence
        run: |
          if git diff --quiet -- server/briefs/alumdoor.json server/briefs/alumdoor-v2.json; then
            echo "No pricing contract drift remained."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/briefs/alumdoor.json server/briefs/alumdoor-v2.json
          git commit -m "fix(sales): align price list contract [pricing-contract-converged]"
          git push origin HEAD:agent/alumdoor-sales-order-v2-complete
