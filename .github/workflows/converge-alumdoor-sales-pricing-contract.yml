name: Converge Alumdoor Sales Pricing Contract

on:
  push:
    branches:
      - agent/alumdoor-sales-order-v2-complete

permissions:
  contents: write

jobs:
  converge:
    if: ${{ !contains(github.event.head_commit.message, '[capability-guard-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply new-order create capability guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/packages/views/src/app/vertical/alumdoor/sales-order-v2/AlumdoorSalesOrderWorkbenchComplete.tsx')
          source = path.read_text(encoding='utf-8')
          old = 'const formReadOnly = isExisting && (!caps.write || docstatus !== 0);'
          new = 'const formReadOnly = isExisting ? (!caps.write || docstatus !== 0) : !caps.create;'
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Capability guard contract not found')
          PY
          git diff --check
      - name: Commit guard
        run: |
          if git diff --quiet -- client/packages/views/src/app/vertical/alumdoor/sales-order-v2/AlumdoorSalesOrderWorkbenchComplete.tsx; then
            echo 'Guard already applied.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/packages/views/src/app/vertical/alumdoor/sales-order-v2/AlumdoorSalesOrderWorkbenchComplete.tsx
          git commit -m "fix(sales): enforce create capability on new orders [capability-guard-applied]"
          git push origin HEAD:agent/alumdoor-sales-order-v2-complete
