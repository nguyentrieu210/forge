name: Sentrux client depth contract experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt
          python3 - <<'PY'
          import json, select, subprocess, time
          p=subprocess.Popen(['sentrux','--mcp'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,bufsize=1)
          def send(x): p.stdin.write(json.dumps(x,separators=(',',':'))+'\n'); p.stdin.flush()
          def recv(i):
              end=time.time()+30
              while time.time()<end:
                  ready,_,_=select.select([p.stdout],[],[],end-time.time())
                  if not ready: break
                  msg=json.loads(p.stdout.readline())
                  if msg.get('id')==i:return msg
              raise SystemExit('mcp timeout')
          send({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'core-leaf','version':'1'}}});recv(1)
          send({'jsonrpc':'2.0','method':'notifications/initialized','params':{}})
          send({'jsonrpc':'2.0','id':2,'method':'tools/call','params':{'name':'scan','arguments':{'path':'.'}}});recv(2)
          send({'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':'health','arguments':{}}})
          print('BEFORE_HEALTH',json.dumps(recv(3),separators=(',',':')))
          p.kill()
          PY

      - name: Expose core leaf contracts and bypass root barrel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('client/packages/core/package.json')
          package = json.loads(package_path.read_text())
          package['exports']['./types/doc'] = {
              'types': './dist/types/doc.d.ts',
              'import': './dist/types/doc.js',
          }
          package['exports']['./business/display'] = {
              'types': './dist/business/display.d.ts',
              'import': './dist/business/display.js',
          }
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          dto_path = Path('client/packages/adapter-frappe/src/dto.ts')
          text = dto_path.read_text()
          old = 'import type { DisplayValueResult, Doc, LabelValue } from "@metaforge/core";'
          new = 'import type { DisplayValueResult } from "@metaforge/core/business/display";\nimport type { Doc, LabelValue } from "@metaforge/core/types/doc";'
          if old not in text:
              raise SystemExit('core barrel dto import not found')
          dto_path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- client/packages/core/package.json client/packages/adapter-frappe/src/dto.ts

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Client typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm run client:typecheck

      - name: Measure candidate
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after.txt
          python3 - <<'PY'
          import json, select, subprocess, time
          p=subprocess.Popen(['sentrux','--mcp'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,bufsize=1)
          def send(x): p.stdin.write(json.dumps(x,separators=(',',':'))+'\n'); p.stdin.flush()
          def recv(i):
              end=time.time()+30
              while time.time()<end:
                  ready,_,_=select.select([p.stdout],[],[],end-time.time())
                  if not ready: break
                  msg=json.loads(p.stdout.readline())
                  if msg.get('id')==i:return msg
              raise SystemExit('mcp timeout')
          send({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'core-leaf','version':'1'}}});recv(1)
          send({'jsonrpc':'2.0','method':'notifications/initialized','params':{}})
          send({'jsonrpc':'2.0','id':2,'method':'tools/call','params':{'name':'scan','arguments':{'path':'.'}}});recv(2)
          send({'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':'health','arguments':{}}})
          print('AFTER_HEALTH',json.dumps(recv(3),separators=(',',':')))
          p.kill()
          PY
          BEFORE=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          echo "CORE_LEAF_SCORE $BEFORE -> $AFTER delta=$((AFTER-BEFORE))"
          test "$AFTER" -gt "$BEFORE"
