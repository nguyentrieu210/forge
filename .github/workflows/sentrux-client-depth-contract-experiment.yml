name: Sentrux client depth contract experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  experiment:
    if: startsWith(github.head_ref, 'agent/sentrux-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt

      - name: Expose core leaf contracts and bypass root barrel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('client/packages/core/package.json')
          package = json.loads(package_path.read_text())
          package['exports']['./types/doc'] = {
              'types': './dist/types/doc.d.ts',
              'import': './dist/types/doc.js',
          }
          package['exports']['./business/display'] = {
              'types': './dist/business/display.d.ts',
              'import': './dist/business/display.js',
          }
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          dto_path = Path('client/packages/adapter-frappe/src/dto.ts')
          text = dto_path.read_text()
          old = 'import type { Doc, DisplayValueResult, LabelValue } from "@metaforge/core";'
          new = 'import type { DisplayValueResult } from "@metaforge/core/business/display";\nimport type { Doc, LabelValue } from "@metaforge/core/types/doc";'
          if old not in text:
              raise SystemExit('core barrel dto import not found')
          dto_path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- client/packages/core/package.json client/packages/adapter-frappe/src/dto.ts

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Client typecheck
        run: pnpm run client:typecheck

      - name: Measure candidate
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after.txt
          BEFORE=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          echo "CORE_LEAF_SCORE $BEFORE -> $AFTER delta=$((AFTER-BEFORE))"
          test "$AFTER" -gt "$BEFORE"

      - name: Commit validated candidate
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          if [ "$REMOTE_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "branch moved during validation: expected=$EXPECTED_HEAD remote=$REMOTE_HEAD"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/packages/core/package.json client/packages/adapter-frappe/src/dto.ts
          git commit -m "refactor(sentrux): bypass core barrel in adapter DTO"
          git push origin "HEAD:$TARGET_BRANCH"
