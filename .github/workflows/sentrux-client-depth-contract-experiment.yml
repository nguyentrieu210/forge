name: Sentrux client depth contract experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  experiment:
    if: startsWith(github.head_ref, 'agent/sentrux-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt

      - name: Bypass views root barrel in runtime shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('client/packages/views/package.json')
          package = json.loads(package_path.read_text())
          exports = package['exports']
          exports['./assistant'] = {'types': './dist/assistant/AssistantBubble.d.ts', 'import': './dist/assistant/AssistantBubble.js'}
          exports['./print-container'] = {'types': './dist/print/PrintContainer.d.ts', 'import': './dist/print/PrintContainer.js'}
          exports['./print-route'] = {'types': './dist/print/printRoute.d.ts', 'import': './dist/print/printRoute.js'}
          exports['./recent-docs'] = {'types': './dist/container/recent-docs.d.ts', 'import': './dist/container/recent-docs.js'}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          runtime_path = Path('client/apps/runtime/src/main-base.tsx')
          text = runtime_path.read_text()
          old = 'import { AssistantBubble, buildPrintPath, loadRecentDocs, PrintContainer, setAssistantContext } from "@metaforge/views";'
          new = '''import { AssistantBubble, setAssistantContext } from "@metaforge/views/assistant";
import { PrintContainer } from "@metaforge/views/print-container";
import { buildPrintPath } from "@metaforge/views/print-route";
import { loadRecentDocs } from "@metaforge/views/recent-docs";'''
          if old not in text:
              raise SystemExit('runtime views root import not found')
          runtime_path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- client/packages/views/package.json client/apps/runtime/src/main-base.tsx

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Client typecheck
        run: pnpm run client:typecheck

      - name: Measure candidate
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/after.txt
          BEFORE=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          echo "RUNTIME_VIEWS_LEAF_SCORE $BEFORE -> $AFTER delta=$((AFTER-BEFORE))"
          test "$AFTER" -gt "$BEFORE"

      - name: Commit validated candidate
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          if [ "$REMOTE_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "branch moved during validation: expected=$EXPECTED_HEAD remote=$REMOTE_HEAD"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/packages/views/package.json client/apps/runtime/src/main-base.tsx
          git commit -m "refactor(sentrux): bypass views barrel in runtime shell"
          git push origin "HEAD:$TARGET_BRANCH"
