name: One-time R6 Restore Size Diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-r6-restore-size-diagnostic.yml"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TARGET_SHA: c6078d329c4022d55df8c16071b885b6f7a43d46
      TENANT: alu
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TARGET_SHA }}", persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - name: Fresh backup and statement-size analysis
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r6-size"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$RUNNER_TEMP/r6-size"
          file="$(find "$RUNNER_TEMP/r6-size" -maxdepth 1 -type f -name '*.sql' | head -1)"
          test -n "$file"
          FILE="$file" node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import path from 'node:path';
          import {rewriteOversizedInstalledAppRows} from './server/scripts/lib/d1-backup-import.mjs';
          const source=readFileSync(process.env.FILE,'utf8');
          const sanitized=rewriteOversizedInstalledAppRows(source);
          function splitStatements(sql){
            const out=[]; let start=0,inString=false;
            for(let i=0;i<sql.length;i++){
              const c=sql[i];
              if(c==="'") { if(inString&&sql[i+1]==="'") i++; else inString=!inString; }
              else if(c===';'&&!inString){ const s=sql.slice(start,i+1).trim(); if(s) out.push(s); start=i+1; }
            }
            const tail=sql.slice(start).trim(); if(tail) out.push(tail); return out;
          }
          const statements=splitStatements(sanitized.sql);
          const rows=statements.map((sql,index)=>{
            const bytes=Buffer.byteLength(sql);
            const m=sql.match(/^(?:INSERT INTO|UPDATE)\s+"?([^"\s(]+)"?/i);
            return {index,bytes,table:m?.[1]??'OTHER',prefix:sql.slice(0,120).replace(/\s+/g,' ')};
          }).sort((a,b)=>b.bytes-a.bytes);
          const buckets={gt8k:rows.filter(x=>x.bytes>8192).length,gt12k:rows.filter(x=>x.bytes>12288).length,gt16k:rows.filter(x=>x.bytes>16384).length,gt24k:rows.filter(x=>x.bytes>24576).length,gt30k:rows.filter(x=>x.bytes>30720).length,gt32k:rows.filter(x=>x.bytes>32768).length};
          const byTable={}; for(const r of rows){const x=byTable[r.table]??={count:0,max:0,gt16k:0,gt24k:0,gt30k:0};x.count++;x.max=Math.max(x.max,r.bytes);if(r.bytes>16384)x.gt16k++;if(r.bytes>24576)x.gt24k++;if(r.bytes>30720)x.gt30k++;byTable[r.table]=x;}
          const ev={format:'forge-r6-restore-size-diagnostic/v1',candidate_sha:process.env.TARGET_SHA,observed_at:new Date().toISOString(),source_bytes:Buffer.byteLength(source),sanitized_bytes:Buffer.byteLength(sanitized.sql),rewrite:sanitized,buckets,largest:rows.slice(0,30),by_table:Object.entries(byTable).sort((a,b)=>b[1].max-a[1].max).slice(0,30)};
          delete ev.rewrite.sql;
          const out=path.join(process.env.RUNNER_TEMP,'r6-restore-size-diagnostic.json');writeFileSync(out,JSON.stringify(ev,null,2)+'\n'); console.log(JSON.stringify(ev,null,2));
          NODE
          rm -f "$file" "$file.json" "$file".*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r6-restore-size-${{ github.run_id }}
          path: ${{ runner.temp }}/r6-restore-size-diagnostic.json
          retention-days: 7
      - name: Record diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path'); const p=path.join(process.env.RUNNER_TEMP,'r6-restore-size-diagnostic.json'); if(!fs.existsSync(p)) return;
            const data=fs.readFileSync(p); const target='deploy-evidence/r6-restore-size-diagnostic.json'; let sha;
            try{const r=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:target,ref:'main'});sha=r.data.sha}catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:target,message:'ops(r6): record restore size diagnostic',content:data.toString('base64'),branch:'main',...(sha?{sha}:{})});
