name: R6-00 Source Lock Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-lock:
    if: github.head_ref == 'agent/r6-00-release-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR base candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize exact source identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { readBriefSource } from './server/scripts/lib/read-brief-source.mjs';

          const sha256 = (value) => createHash('sha256').update(value).digest('hex');
          const sha256File = (file) => sha256(readFileSync(file));
          const walk = (root) => {
            const out = [];
            const visit = (dir) => {
              for (const name of readdirSync(dir).sort()) {
                const full = path.join(dir, name);
                const stat = statSync(full);
                if (stat.isDirectory()) visit(full);
                else if (stat.isFile() && name.endsWith('.sql')) out.push(full);
              }
            };
            visit(root);
            return out;
          };

          const migrationRoot = path.resolve('server/migrations');
          const migrations = walk(migrationRoot).map((full) => ({
            path: path.relative(migrationRoot, full).split(path.sep).join('/'),
            sha256: sha256File(full),
          }));
          const inventoryCanonical = migrations.map((entry) => `${entry.path}\t${entry.sha256}`).join('\n') + '\n';
          const migrationDirs = [...new Set(migrations.map((entry) => entry.path.split('/').slice(0, -1).join('/')))].sort();

          const alumdoor = await readBriefSource(path.resolve('server/briefs/alumdoor-v2.json'));
          const readJson = (file) => JSON.parse(readFileSync(file, 'utf8'));
          const hrm = readJson('server/apps-src/hrm/app.json');
          const accounting = readJson('server/apps-src/vn-accounting/app.json');
          const manufacturing = readJson('server/apps-src/manufacturing-qms/app.json');
          const maintenance = readJson('server/apps-src/maintenance/app.json');

          const report = {
            sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            migrationInventory: {
              algorithm: 'sha256(sorted path\\tfileSha256 lines with final newline)',
              fileCount: migrations.length,
              directories: migrationDirs,
              digest: sha256(inventoryCanonical),
              first: migrations[0] ?? null,
              last: migrations.at(-1) ?? null,
            },
            packages: {
              alumdoor: alumdoor.version,
              hrm: hrm.version,
              'vn-accounting': accounting.version,
              'manufacturing-qms': manufacturing.version,
              maintenance: maintenance.version,
            },
            alumdoorRequires: alumdoor.requires ?? [],
          };
          console.log('R6_SOURCE_LOCK_JSON=' + JSON.stringify(report));
          NODE
