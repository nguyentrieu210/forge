name: Sentrux depth path probe

on:
  push:
    branches:
      - agent/sentrux-convergence-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Sentrux Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libvulkan-dev

      - name: Build instrumented Sentrux v0.5.7
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/sentrux/sentrux.git /tmp/sentrux-src
          cd /tmp/sentrux-src
          git checkout --quiet 6f8ff3c14b0423e4b58f42d1813d4d5f7fdc1d11
          python3 <<'PY'
          from pathlib import Path
          p = Path('sentrux-core/src/metrics/mod.rs')
          s = p.read_text()
          start = s.index('fn compute_max_depth(edges: &[ImportEdge], entry_points: &[EntryPoint]) -> u32 {')
          end = s.index('\n// ── Pro metrics extension point', start)
          lines = [
              'fn compute_max_depth(edges: &[ImportEdge], entry_points: &[EntryPoint]) -> u32 {',
              '    if edges.is_empty() { return 0; }',
              '    let (seeds, adj, all_nodes) = find_depth_seeds(edges, entry_points);',
              '    let memo = longest_path_dfs(&seeds, &adj, all_nodes.len());',
              '    let max_depth = seeds.iter().filter_map(|s| memo.get(s).copied()).max().unwrap_or(0);',
              '    if std::env::var_os("SENTRUX_TRACE_DEPTH").is_some() {',
              '        eprintln!("SENTRUX_DEPTH_ENTRY_POINTS={}", entry_points.len());',
              '        eprintln!("SENTRUX_DEPTH_SEEDS={}", seeds.len());',
              '        eprintln!("SENTRUX_DEPTH_MAX={}", max_depth);',
              '        for seed in seeds.iter().filter(|s| memo.get(*s).copied() == Some(max_depth)) {',
              '            eprintln!("SENTRUX_DEPTH_MAX_SEED {}", seed);',
              '        }',
              '        eprintln!("SENTRUX_DEPTH_DAG_BEGIN");',
              '        let mut rows: Vec<(&str, &str, u32)> = Vec::new();',
              '        for (from, nexts) in &adj {',
              '            let Some(&d) = memo.get(from) else { continue; };',
              '            if d == 0 { continue; }',
              '            for to in nexts {',
              '                if memo.get(to).copied().map(|nd| nd.saturating_add(1) == d).unwrap_or(false) {',
              '                    rows.push((*from, *to, d));',
              '                }',
              '            }',
              '        }',
              '        rows.sort_by(|a,b| b.2.cmp(&a.2).then_with(|| a.0.cmp(b.0)).then_with(|| a.1.cmp(b.1)));',
              '        for (from, to, d) in rows {',
              '            eprintln!("SENTRUX_DEPTH_DAG remaining={} {} -> {}", d, from, to);',
              '        }',
              '        eprintln!("SENTRUX_DEPTH_DAG_END");',
              '    }',
              '    max_depth',
              '}',
          ]
          p.write_text(s[:start] + '\n'.join(lines) + s[end:])
          PY
          cargo build --quiet --release -p sentrux --bin sentrux
          cp target/release/sentrux /tmp/sentrux-trace

      - name: Trace exact Forge dependency depth DAG
        shell: bash
        run: |
          set -euo pipefail
          SENTRUX_TRACE_DEPTH=1 /tmp/sentrux-trace gate --save "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/depth-trace.txt
          echo '=== OFFICIAL DEPTH TRACE ==='
          grep 'SENTRUX_DEPTH_' /tmp/depth-trace.txt
          grep -E '^Quality:' /tmp/depth-trace.txt || true
