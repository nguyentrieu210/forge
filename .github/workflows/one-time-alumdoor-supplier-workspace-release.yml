name: One-time Alumdoor Supplier Workspace Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: one-time-alumdoor-supplier-workspace-release
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.head_ref == 'release/execute-supplier-workspace-20260803' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TARGET_SHA: 6ab9d39756112038ac3dcaa9c7cfd427e4d44c4d
      APP_WORKER: cloudforge-app-alumdoor
      DISPATCH_NAMESPACE: cloudforge-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      EVIDENCE_DIR: /tmp/supplier-workspace-release

    steps:
      - name: Checkout exact feature merge
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_SHA" = '6ab9d39756112038ac3dcaa9c7cfd427e4d44c4d'
          test "$APP_WORKER" = 'cloudforge-app-alumdoor'
          test "$DISPATCH_NAMESPACE" = 'cloudforge-production'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -q '"name": "cloudforge-app-alumdoor"' server/apps-src/alumdoor-worker/wrangler.jsonc
          mkdir -p "$EVIDENCE_DIR"
          printf 'target_sha=%s\nworker=%s\nnamespace=%s\nstarted_at=%s\n' \
            "$TARGET_SHA" "$APP_WORKER" "$DISPATCH_NAMESPACE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$EVIDENCE_DIR/state.txt"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build server
        run: pnpm --dir server run build

      - name: Run supplier workspace regression
        run: node --test server/tests/purchase-supplier-delivery-dashboard.test.mjs

      - name: Dry-run Alumdoor app Worker
        shell: bash
        run: |
          set -euo pipefail
          cd server
          pnpm exec wrangler deploy \
            --config apps-src/alumdoor-worker/wrangler.jsonc \
            --name "$APP_WORKER" \
            --dispatch-namespace "$DISPATCH_NAMESPACE" \
            --strict \
            --dry-run \
            --outdir "$EVIDENCE_DIR/dry-run" \
            2>&1 | tee "$EVIDENCE_DIR/dry-run.log"
          echo 'dry_run=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy Alumdoor app Worker
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: /tmp/supplier-workspace-release/wrangler-output.ndjson
        run: |
          set -euo pipefail
          cd server
          pnpm exec wrangler deploy \
            --config apps-src/alumdoor-worker/wrangler.jsonc \
            --name "$APP_WORKER" \
            --dispatch-namespace "$DISPATCH_NAMESPACE" \
            --strict \
            2>&1 | tee "$EVIDENCE_DIR/deploy.log"
          echo 'deploy=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify Cloudflare Worker and bindings
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/dispatch/namespaces/$DISPATCH_NAMESPACE/scripts/$APP_WORKER"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$base" > "$EVIDENCE_DIR/script-details.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$base/bindings" > "$EVIDENCE_DIR/script-bindings.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = process.env.EVIDENCE_DIR;
          const details = JSON.parse(fs.readFileSync(`${dir}/script-details.json`, 'utf8'));
          const bindingsPayload = JSON.parse(fs.readFileSync(`${dir}/script-bindings.json`, 'utf8'));
          if (!details.success) throw new Error('Cloudflare script lookup failed');
          const result = details.result ?? {};
          if (result.dispatch_namespace !== process.env.DISPATCH_NAMESPACE) throw new Error(`Unexpected dispatch namespace ${result.dispatch_namespace ?? 'missing'}`);
          if (result.script?.id !== process.env.APP_WORKER) throw new Error(`Unexpected worker ${result.script?.id ?? 'missing'}`);
          if (!bindingsPayload.success || !Array.isArray(bindingsPayload.result)) throw new Error('Cloudflare bindings lookup failed');
          const names = new Set(bindingsPayload.result.map((entry) => entry?.name).filter(Boolean));
          for (const required of ['PLATFORM', 'AI']) if (!names.has(required)) throw new Error(`Missing binding ${required}`);
          fs.appendFileSync(`${dir}/state.txt`, `provider_script=pass\nprovider_bindings=pass\nmodified_on=${result.modified_on ?? ''}\n`);
          NODE

      - name: Collect Worker version evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = process.env.EVIDENCE_DIR;
          const rows = fs.readFileSync(`${dir}/wrangler-output.ndjson`, 'utf8')
            .split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
          const deploy = [...rows].reverse().find((entry) => entry.type === 'deploy' && entry.version_id);
          if (!deploy?.version_id) throw new Error('Wrangler did not return version_id');
          fs.appendFileSync(`${dir}/state.txt`, `version_id=${deploy.version_id}\nfinished_at=${new Date().toISOString()}\noverall=pass\n`);
          NODE

      - name: Publish release evidence on PR 276
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const dir = process.env.EVIDENCE_DIR;
            const marker = '<!-- supplier-workspace-app-release -->';
            const state = fs.existsSync(`${dir}/state.txt`) ? fs.readFileSync(`${dir}/state.txt`, 'utf8') : 'state_file_missing=true';
            const passed = /(^|\n)overall=pass(\n|$)/.test(state);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Supplier workspace app Worker release: ${passed ? 'PASS' : 'FAIL'}\n\n- Exact feature SHA: \`${process.env.TARGET_SHA}\`\n- Worker: \`${process.env.APP_WORKER}\`\n- Namespace: \`${process.env.DISPATCH_NAMESPACE}\`\n- Workflow: ${runUrl}\n\n\`\`\`text\n${state}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: 276 });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 276, body });
