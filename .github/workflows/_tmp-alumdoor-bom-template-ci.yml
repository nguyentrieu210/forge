name: Temporary Alumdoor BOM Template CI
on:
  push:
    branches: ['agent/alumdoor-bom-template-resolver']
    paths:
      - 'server/apps-src/alumdoor-worker/src/bom-template-core.ts'
      - 'server/tests/alumdoor-bom-template-core.test.mjs'
      - '.github/workflows/_tmp-alumdoor-bom-template-ci.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: server
        shell: bash
        run: |
          set +e
          pnpm run build > /tmp/alumdoor-bom-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error::$safe"
            done < /tmp/alumdoor-bom-build.log
            exit "$status"
          fi
          cat /tmp/alumdoor-bom-build.log
      - name: Focused BOM resolver tests
        working-directory: server
        run: node --test tests/alumdoor-bom-template-core.test.mjs
