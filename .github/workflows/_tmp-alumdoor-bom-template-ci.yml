name: Temporary Alumdoor BOM Template CI
on:
  push:
    branches: ['agent/alumdoor-bom-template-resolver']
    paths:
      - 'server/apps-src/alumdoor-worker/src/bom-template-core.ts'
      - 'server/tests/alumdoor-bom-template-core.test.mjs'
      - '.github/workflows/_tmp-alumdoor-bom-template-ci.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Patch exact optional operand type
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'server/apps-src/alumdoor-worker/src/bom-template-core.ts';
          let text = fs.readFileSync(path, 'utf8');
          const before = 'value = readOperand({ field: base.field, offset: base.offset }, values, label);';
          const after = 'value = readOperand(base.offset === undefined ? { field: base.field } : { field: base.field, offset: base.offset }, values, label);';
          if (!text.includes(before)) throw new Error('Expected BOM FIELD operand line not found');
          if (text.split(before).length !== 2) throw new Error('Expected exactly one BOM FIELD operand line');
          text = text.replace(before, after);
          fs.writeFileSync(path, text, 'utf8');
          NODE
      - name: Install
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: server
        shell: bash
        run: |
          set +e
          pnpm run build > /tmp/alumdoor-bom-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error::$safe"
            done < /tmp/alumdoor-bom-build.log
            exit "$status"
          fi
          cat /tmp/alumdoor-bom-build.log
      - name: Focused BOM resolver tests
        working-directory: server
        shell: bash
        run: |
          set +e
          node --test tests/alumdoor-bom-template-core.test.mjs > /tmp/alumdoor-bom-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error::$safe"
            done < /tmp/alumdoor-bom-test.log
            exit "$status"
          fi
          cat /tmp/alumdoor-bom-test.log
      - name: Commit validated product fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-alumdoor-bom-template-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/apps-src/alumdoor-worker/src/bom-template-core.ts .github/workflows/_tmp-alumdoor-bom-template-ci.yml
          git commit -m 'fix(alumdoor): satisfy exact optional BOM operand types'
          git push origin HEAD:agent/alumdoor-bom-template-resolver
