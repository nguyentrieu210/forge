name: Finance Branch Reconcile

on:
  push:
    branches:
      - feat/finance-ar-ap-completion

permissions:
  contents: write

concurrency:
  group: finance-branch-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout finance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/finance-ar-ap-completion

      - name: Merge latest default branch and resolve handoff files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin hotfix/alumdoor-print-list-delete feat/finance-ar-ap-completion

          git show origin/hotfix/alumdoor-print-list-delete:CURRENT_STATUS.md > /tmp/base-current-status.md
          git show origin/hotfix/alumdoor-print-list-delete:NEXT_TASKS.md > /tmp/base-next-tasks.md

          set +e
          git merge --no-ff --no-commit origin/hotfix/alumdoor-print-list-delete
          merge_status=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$unresolved" | grep -Ev '^(CURRENT_STATUS\.md|NEXT_TASKS\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected merge conflicts:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          if printf '%s\n' "$unresolved" | grep -qx 'CURRENT_STATUS.md'; then
            git checkout --ours CURRENT_STATUS.md
            printf '\n' >> CURRENT_STATUS.md
            awk '/^## RBAC Slice A/{copy=1} copy' /tmp/base-current-status.md >> CURRENT_STATUS.md
            git add CURRENT_STATUS.md
          fi

          if printf '%s\n' "$unresolved" | grep -qx 'NEXT_TASKS.md'; then
            git checkout --ours NEXT_TASKS.md
            printf '\n' >> NEXT_TASKS.md
            awk '/^## P0 — RBAC Slice A/{copy=1} copy' /tmp/base-next-tasks.md >> NEXT_TASKS.md
            git add NEXT_TASKS.md
          fi

          remaining="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$remaining" ]; then
            printf 'Unresolved merge conflicts:\n%s\n' "$remaining" >&2
            exit 1
          fi

          if [ "$merge_status" -ne 0 ] && [ -z "$unresolved" ]; then
            echo "Merge failed without resolvable content conflicts" >&2
            exit 1
          fi

          git rm .github/workflows/finance-branch-reconcile.yml
          git diff --check
          git commit -m "chore(finance): merge latest default branch"
          git push origin HEAD:feat/finance-ar-ap-completion
