name: RC4 A6 Production Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rc4-a6-production-probe.yml"

permissions:
  contents: read
  actions: read

jobs:
  actions-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: dfc397d048aee3b426c2d230ff9aa34bc0fc3105
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read ALU deploy push runs
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/alu-build-deploy.yml/runs?event=push&branch=main&per_page=30"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/alu-runs.json"
          RUNS_FILE="$RUNNER_TEMP/alu-runs.json" TARGET_SHA="$TARGET_SHA" node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.RUNS_FILE, 'utf8'));
          const rows = (data.workflow_runs || []).map(r => ({
            id: r.id, run_number: r.run_number, event: r.event, head_sha: r.head_sha,
            status: r.status, conclusion: r.conclusion, created_at: r.created_at,
            updated_at: r.updated_at, html_url: r.html_url,
          }));
          console.log(JSON.stringify(rows.slice(0, 12), null, 2));
          const target = (data.workflow_runs || []).find(r => r.head_sha === process.env.TARGET_SHA);
          if (!target) {
            console.error(`No ALU Build and Deploy push run found for ${process.env.TARGET_SHA}`);
            process.exit(2);
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/alu-target-run-id.txt', String(target.id));
          console.log('TARGET_RUN=' + JSON.stringify({id: target.id, run_number: target.run_number, status: target.status, conclusion: target.conclusion, html_url: target.html_url}));
          NODE
      - name: Read target deploy jobs and steps
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat "$RUNNER_TEMP/alu-target-run-id.txt")"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            > "$RUNNER_TEMP/alu-target-jobs.json"
          JOBS_FILE="$RUNNER_TEMP/alu-target-jobs.json" node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.JOBS_FILE, 'utf8'));
          const jobs = (data.jobs || []).map(j => ({
            id: j.id, name: j.name, status: j.status, conclusion: j.conclusion,
            started_at: j.started_at, completed_at: j.completed_at,
            steps: (j.steps || []).map(s => ({number: s.number, name: s.name, status: s.status, conclusion: s.conclusion})),
          }));
          console.log(JSON.stringify(jobs, null, 2));
          NODE
      - name: Upload deploy diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc4-a6-alu-deploy-diagnosis
          path: |
            ${{ runner.temp }}/alu-runs.json
            ${{ runner.temp }}/alu-target-run-id.txt
            ${{ runner.temp }}/alu-target-jobs.json
          if-no-files-found: warn
          retention-days: 30
