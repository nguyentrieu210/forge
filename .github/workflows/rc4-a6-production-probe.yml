name: RC4 A6 Production Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rc4-a6-production-probe.yml"

permissions:
  contents: read

jobs:
  production-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect current production release marker
        shell: bash
        run: |
          set -uo pipefail
          echo "=== /release.json ==="
          curl -sS --max-time 15 -H 'cache-control: no-cache' https://alu.kairo.vn/release.json | tee "$RUNNER_TEMP/release.json"
          echo
          echo "=== /health ==="
          curl -sS --max-time 15 -H 'cache-control: no-cache' https://alu.kairo.vn/health | tee "$RUNNER_TEMP/health.json"
          echo
      - name: Evaluate production health snapshot
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/sre-health-snapshot.mjs \
            --base https://alu.kairo.vn \
            --allow-remote \
            --confirm-host alu.kairo.vn \
            --attempts 1 \
            --output "$RUNNER_TEMP/rc4-a6-production-inspect.json"
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc4-a6-production-inspect
          path: |
            ${{ runner.temp }}/release.json
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/rc4-a6-production-inspect.json
          if-no-files-found: warn
          retention-days: 30
