name: Issue 942 CustomFields Probe
on:
  push:
    branches: [agent/alumdoor-v2-reproducible]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply current temporary convergence and inspect Batch customFields
        run: |
          python .github/issue-942-prepatch.py
          python .github/issue-942-apply.py
          node server/scripts/build-alumdoor-v2-brief.mjs >/tmp/generator.log
          node <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync('server/briefs/alumdoor-v2.json','utf8'));
          console.log('Batch customFields count', b.customFields?.Batch?.length);
          for (const [i,x] of (b.customFields?.Batch||[]).entries()) console.log(i, JSON.stringify(x));
          NODE
          echo '--- schema/customFields references ---'
          grep -R "customFields" -n server/packages server/scripts | head -80 || true
