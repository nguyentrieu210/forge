name: Sentrux server dispatch probe

on:
  push:
    branches:
      - agent/sentrux-server-dispatch-probe-1

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-server-dispatch-probe-1
      - name: Guard retained candidate
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          msg=$(git log -1 --format=%s)
          if [[ "$msg" == refactor\(sentrux\):\ split\ frappe\ method\ dispatch* ]]; then
            echo 'run_probe=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_probe=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Sentrux
        if: steps.guard.outputs.run_probe == 'true'
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
      - name: Split giant method dispatcher and measure
        if: steps.guard.outputs.run_probe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(sentrux gate --save . | tee /tmp/sentrux-before.txt | sed -n 's/^Quality: //p' | tail -1)
          [[ "$baseline" =~ ^[0-9]+$ ]]
          test "$baseline" = "5906"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('server/packages/frappe-api/src/router.ts')
          original = path.read_text()

          route_old = '    const method = METHOD_PATH.exec(url.pathname);\n    if (method) return await dispatchMethod(method[1]!, request, args, context);\n'
          if original.count(route_old) != 1:
              raise SystemExit(f'expected one route dispatch call, found {original.count(route_old)}')

          fn_start = original.index('async function dispatchMethod(\n')
          next_fn = original.index('\nasync function commitAlumdoorAttendanceScan', fn_start)
          block = original[fn_start:next_fn]
          switch_marker = '  switch (methodName) {\n'
          switch_start = block.index(switch_marker) + len(switch_marker)
          default_start = block.index('    default: {', switch_start)
          cases_text = block[switch_start:default_start]

          sections = [part for part in re.split(r'(?=^    // ---- )', cases_text, flags=re.M) if part.strip()]
          if not sections:
              raise SystemExit('no method sections found')

          # Keep semantic sections intact. One existing section has 29 stacked/top-level
          # cases, so allow up to 30 here rather than splitting a fall-through cluster.
          max_cases = 30
          groups = []
          current = []
          current_cases = 0
          for section in sections:
              count = len(re.findall(r'^    case ', section, flags=re.M))
              if count == 0:
                  if current:
                      current.append(section)
                  continue
              if count > max_cases:
                  raise SystemExit(f'section has {count} cases, over limit {max_cases}')
              if current and current_cases + count > max_cases:
                  groups.append(''.join(current))
                  current = []
                  current_cases = 0
              current.append(section)
              current_cases += count
          if current:
              groups.append(''.join(current))

          if len(groups) < 3:
              raise SystemExit(f'expected at least 3 dispatch groups, got {len(groups)}')

          helpers = []
          route_calls = []
          for index, group in enumerate(groups, start=1):
              case_count = len(re.findall(r'^    case ', group, flags=re.M))
              name = f'dispatchMethodGroup{index}'
              print(f'{name}: {case_count} cases')
              helpers.append(
                  f'async function {name}(\n'
                  '  methodName: string,\n'
                  '  request: Request,\n'
                  '  args: FrappeArgs,\n'
                  '  context: FrappeRouterContext,\n'
                  '): Promise<Response | null> {\n'
                  '  switch (methodName) {\n'
                  f'{group}'
                  '    default:\n'
                  '      return null;\n'
                  '  }\n'
                  '}\n'
              )
              route_calls.append(
                  f'      const group{index} = await {name}(methodName, request, args, context);\n'
                  f'      if (group{index}) return group{index};\n'
              )

          route_new = (
              '    const method = METHOD_PATH.exec(url.pathname);\n'
              '    if (method) {\n'
              '      const methodName = method[1]!;\n'
              + ''.join(route_calls)
              + '      // An app owns its own dotted namespace and is checked only after platform methods.\n'
              '      const fromApp = await callAppMethod(methodName, args, context);\n'
              '      if (fromApp) return fromApp;\n'
              '      throw errors.notFound(`Method is not implemented on this platform: ${methodName}`);\n'
              '    }\n'
          )

          # Replace the old dispatcher using offsets from the untouched source first.
          # Replacing the earlier route call before this would shift fn_start/next_fn.
          text = original[:fn_start] + ''.join(helpers) + original[next_fn:]
          if text.count(route_old) != 1:
              raise SystemExit(f'route call changed unexpectedly after dispatcher replacement: {text.count(route_old)}')
          text = text.replace(route_old, route_new)
          path.write_text(text)
          PY

          git diff --check
          git diff --stat

          after_line=$(sentrux gate . | tee /tmp/sentrux-after.txt | grep '^Quality:' | tail -1)
          after=$(printf '%s\n' "$after_line" | awk -F'->' '{v=$NF; gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); print v}')
          [[ "$after" =~ ^[0-9]+$ ]]
          echo "BASELINE_QUALITY=$baseline"
          echo "CANDIDATE_QUALITY=$after"

          if (( after <= baseline )); then
            echo 'NO_GAIN=1'
            git checkout -- server/packages/frappe-api/src/router.ts
            exit 0
          fi

          mkdir -p .sentrux
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          max_cc = 25
          EOF
          set +e
          sentrux check . 2>&1 | tee /tmp/sentrux-check.txt
          set -e
          if grep -q 'max_cycles' /tmp/sentrux-check.txt; then
            echo 'CYCLE_REGRESSION=1'
            exit 1
          fi
          god_count=$(sed -n 's/.*no_god_files: \([0-9][0-9]*\) god file.*/\1/p' /tmp/sentrux-check.txt | tail -1)
          god_count=${god_count:-0}
          if (( god_count > 2 )); then
            echo "GOD_FILE_REGRESSION=$god_count"
            exit 1
          fi

          corepack enable
          pnpm install --frozen-lockfile
          pnpm run server:typecheck

          git config user.name 'sentrux-probe'
          git config user.email 'sentrux-probe@users.noreply.github.com'
          git add server/packages/frappe-api/src/router.ts
          git commit -m "refactor(sentrux): split frappe method dispatch ${baseline}-${after}"
          git push origin HEAD:agent/sentrux-server-dispatch-probe-1
