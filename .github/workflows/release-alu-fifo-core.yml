name: Release alu FIFO core

on:
  push:
    branches:
      - release/alu-fifo-core-20260731
    paths:
      - .github/workflows/release-alu-fifo-core.yml

permissions:
  contents: read

concurrency:
  group: production-alu
  cancel-in-progress: false

jobs:
  release:
    name: Backup, migrate, deploy and smoke alu
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      TENANT: alu
      TARGET_SHA: 591ca359937d6ae12803d36c74996db8482060af
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      EVIDENCE_DIR: ${{ runner.temp }}/forge-release-evidence
      BACKUP_DIR: ${{ runner.temp }}/forge-backup/alu

    steps:
      - name: Checkout exact verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$TENANT" = "alu"
          test "$TARGET_SHA" = "591ca359937d6ae12803d36c74996db8482060af"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          mkdir -p "$EVIDENCE_DIR" "$BACKUP_DIR"
          printf 'tenant=%s\ntarget_sha=%s\nstarted_at=%s\n' \
            "$TENANT" "$TARGET_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$EVIDENCE_DIR/release.txt"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm test 2>&1 | tee "$EVIDENCE_DIR/test.log"
          pnpm typecheck 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"
          pnpm build 2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Backup tenant dry run
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/backup-dry-run.log"

      - name: Backup tenant database
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs \
            --tenant "$TENANT" \
            --execute \
            --output-dir "$BACKUP_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/backup-live.log"

      - name: Upload pre-release backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-pre-release-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-backup/alu/
          if-no-files-found: warn
          retention-days: 14

      - name: Migration dry run
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            node scripts/migrate-tenant.mjs --tenant "$TENANT"
          ) 2>&1 | tee "$EVIDENCE_DIR/migration-dry-run.log"

      - name: Apply remote migrations
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            node scripts/migrate-tenant.mjs \
              --tenant "$TENANT" \
              --execute \
              --confirm "$TENANT"
          ) 2>&1 | tee "$EVIDENCE_DIR/migration-live.log"

      - name: Verify migrations and rollout disabled
        shell: bash
        run: |
          set -euo pipefail
          cd server
          pnpm exec wrangler d1 execute cloudforge-alu \
            --remote \
            --json \
            --command "SELECT name FROM d1_migrations WHERE name IN ('0027_purchase_receipt_allocation.sql','0028_purchase_allocation_cancel_guard.sql','0029_purchase_allocation_rollout.sql') ORDER BY name; SELECT enabled, unresolved_count FROM purchase_allocation_rollout_state;" \
            > "$EVIDENCE_DIR/post-migration.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(process.env.EVIDENCE_DIR + '/post-migration.json', 'utf8');
          const start = text.indexOf('[');
          if (start < 0) throw new Error('Wrangler returned no JSON array');
          const payload = JSON.parse(text.slice(start));
          const resultSets = Array.isArray(payload) ? payload : [];
          const migrationRows = resultSets[0]?.results ?? [];
          const names = new Set(migrationRows.map((row) => row.name));
          const required = [
            '0027_purchase_receipt_allocation.sql',
            '0028_purchase_allocation_cancel_guard.sql',
            '0029_purchase_allocation_rollout.sql',
          ];
          for (const name of required) {
            if (!names.has(name)) throw new Error(`Missing migration ${name}`);
          }
          const rolloutRows = resultSets[1]?.results ?? [];
          if (rolloutRows.some((row) => Number(row.enabled) === 1)) {
            throw new Error('FIFO rollout is enabled; release must stop');
          }
          console.log('Migrations present and FIFO rollout remains disabled.');
          NODE

      - name: Tenant deploy dry run
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            node scripts/deploy-tenant.mjs --tenant "$TENANT"
          ) 2>&1 | tee "$EVIDENCE_DIR/deploy-dry-run.log"

      - name: Deploy tenant Worker
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            node scripts/deploy-tenant.mjs \
              --tenant "$TENANT" \
              --execute \
              --confirm "$TENANT"
          ) 2>&1 | tee "$EVIDENCE_DIR/deploy-live.log"

      - name: Production health smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://alu.kairo.vn"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$BASE/health" \
              --output "$EVIDENCE_DIR/health.json"; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production health endpoint did not become ready." >&2
              exit 1
            fi
            sleep 5
          done
          STATUS="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' "$BASE/api/method/metaforge.api.get_boot")"
          test "$STATUS" = "403"
          printf 'health=pass\nguest_boot_status=%s\nfinished_at=%s\n' \
            "$STATUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$EVIDENCE_DIR/release.txt"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-release-evidence/
          if-no-files-found: warn
          retention-days: 30
