name: Release alu FIFO core

on:
  push:
    branches:
      - release/alu-fifo-core-20260731
    paths:
      - .github/release/alu-fifo-core.deploy.trigger

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-alu
  cancel-in-progress: false

jobs:
  release:
    name: Backup, migrate, deploy and smoke alu
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      TENANT: alu
      TARGET_SHA: 591ca359937d6ae12803d36c74996db8482060af
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      EVIDENCE_DIR: ${{ runner.temp }}/forge-release-evidence
      BACKUP_DIR: ${{ runner.temp }}/forge-backup/alu
      RELEASE_PR: '8'

    steps:
      - name: Checkout exact verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$TENANT" = "alu"
          test "$TARGET_SHA" = "591ca359937d6ae12803d36c74996db8482060af"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          mkdir -p "$EVIDENCE_DIR" "$BACKUP_DIR"
          printf 'tenant=%s\ntarget_sha=%s\nrun_id=%s\nstarted_at=%s\n' \
            "$TENANT" "$TARGET_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$EVIDENCE_DIR/release.txt"
          echo 'release_started=pass' >> "$EVIDENCE_DIR/release.txt"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm test 2>&1 | tee "$EVIDENCE_DIR/test.log"
          pnpm typecheck 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"
          pnpm build 2>&1 | tee "$EVIDENCE_DIR/build.log"
          echo 'gates=pass' >> "$EVIDENCE_DIR/release.txt"

      - name: Backup tenant dry run
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/backup-dry-run.log"

      - name: Backup tenant database
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs \
            --tenant "$TENANT" \
            --execute \
            --output-dir "$BACKUP_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/backup-live.log"
          echo 'backup=pass' >> "$EVIDENCE_DIR/release.txt"

      - name: Upload pre-release backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-pre-release-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-backup/alu/
          if-no-files-found: warn
          retention-days: 14

      - name: Migration dry run
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            node scripts/migrate-tenant.mjs --tenant "$TENANT"
          ) 2>&1 | tee "$EVIDENCE_DIR/migration-dry-run.log"

      - name: Apply remote migrations
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            node scripts/migrate-tenant.mjs \
              --tenant "$TENANT" \
              --execute \
              --confirm "$TENANT"
          ) 2>&1 | tee "$EVIDENCE_DIR/migration-live.log"
          echo 'migration_apply=pass' >> "$EVIDENCE_DIR/release.txt"

      - name: Verify migrations and rollout disabled
        shell: bash
        run: |
          set -euo pipefail
          cd server
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { findTenantDatabaseId, removeTenantConfig, writeTenantConfig } from './scripts/tenant-wrangler.mjs';
          import { d1BindingOf, d1Query, wrangler } from './scripts/wrangler-cli.mjs';

          const tenant = 'alu';
          const databaseId = findTenantDatabaseId(tenant, wrangler);
          if (!databaseId) throw new Error('cloudforge-alu database not found');
          const { configPath } = writeTenantConfig({ tenant, databaseId });
          try {
            const database = d1BindingOf(configPath);
            const migrations = d1Query(database, "SELECT name FROM d1_migrations WHERE name IN ('0027_purchase_receipt_allocation.sql','0028_purchase_allocation_cancel_guard.sql','0029_purchase_allocation_rollout.sql') ORDER BY name");
            const rollout = d1Query(database, 'SELECT enabled, unresolved_count FROM purchase_allocation_rollout_state');
            const names = new Set(migrations.map((row) => row.name));
            for (const name of [
              '0027_purchase_receipt_allocation.sql',
              '0028_purchase_allocation_cancel_guard.sql',
              '0029_purchase_allocation_rollout.sql',
            ]) {
              if (!names.has(name)) throw new Error(`Missing migration ${name}`);
            }
            if (rollout.some((row) => Number(row.enabled) === 1)) {
              throw new Error('FIFO rollout is enabled; release must stop');
            }
            fs.writeFileSync(`${process.env.EVIDENCE_DIR}/post-migration.json`, `${JSON.stringify({ migrations, rollout }, null, 2)}\n`);
          } finally {
            removeTenantConfig(configPath);
          }
          NODE
          echo 'migration_verify=pass' >> "$EVIDENCE_DIR/release.txt"

      - name: Tenant deploy dry run
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            node scripts/deploy-tenant.mjs --tenant "$TENANT"
          ) 2>&1 | tee "$EVIDENCE_DIR/deploy-dry-run.log"

      - name: Deploy tenant Worker
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/forge-release-evidence/wrangler-output.ndjson
        run: |
          set -euo pipefail
          (
            cd server
            node scripts/deploy-tenant.mjs \
              --tenant "$TENANT" \
              --execute \
              --confirm "$TENANT"
          ) 2>&1 | tee "$EVIDENCE_DIR/deploy-live.log"
          echo 'deploy=pass' >> "$EVIDENCE_DIR/release.txt"

      - name: Production health smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://alu.kairo.vn"
          HEALTH_STATUS=0
          for attempt in $(seq 1 18); do
            HEALTH_STATUS="$(curl --silent --show-error --output "$EVIDENCE_DIR/health.json" --write-out '%{http_code}' "$BASE/health" || true)"
            if [ "$HEALTH_STATUS" = "200" ]; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production health endpoint did not become ready: $HEALTH_STATUS" >&2
              exit 1
            fi
            sleep 5
          done
          BOOT_STATUS="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' "$BASE/api/method/metaforge.api.get_boot" || true)"
          test "$BOOT_STATUS" = "403"
          printf 'health_status=%s\nguest_boot_status=%s\nsmoke=pass\n' \
            "$HEALTH_STATUS" "$BOOT_STATUS" >> "$EVIDENCE_DIR/release.txt"

      - name: Collect Cloudflare deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cloudforge-tenant-alu/deployments" \
            --output "$EVIDENCE_DIR/deployments.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = process.env.EVIDENCE_DIR;
          const deploymentsResponse = JSON.parse(fs.readFileSync(`${dir}/deployments.json`, 'utf8'));
          const result = deploymentsResponse.result;
          const deployments = Array.isArray(result) ? result : (result?.deployments ?? []);
          const latest = deployments[0] ?? {};
          let versionId = null;
          const outputPath = `${dir}/wrangler-output.ndjson`;
          if (fs.existsSync(outputPath)) {
            for (const line of fs.readFileSync(outputPath, 'utf8').split(/\r?\n/)) {
              if (!line.trim()) continue;
              try {
                const event = JSON.parse(line);
                if (event.type === 'deploy' && event.version_id) versionId = event.version_id;
              } catch {}
            }
          }
          const summary = {
            tenant: 'alu',
            target_sha: process.env.TARGET_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            deployment_id: latest.id ?? null,
            deployment_created_on: latest.created_on ?? null,
            version_id: versionId,
            rollout_enabled: false,
            migrations: ['0027', '0028', '0029'],
            health_status: 200,
            guest_boot_status: 403,
            finished_at: new Date().toISOString(),
            passed: true,
          };
          fs.writeFileSync(`${dir}/summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          const markdown = [
            '# alu FIFO core production release',
            '',
            `- Target SHA: \`${summary.target_sha}\``,
            `- Deployment ID: \`${summary.deployment_id ?? 'not returned'}\``,
            `- Version ID: \`${summary.version_id ?? 'not returned'}\``,
            `- Deployment time: \`${summary.deployment_created_on ?? 'not returned'}\``,
            '- Migrations 0027–0029: PASS',
            '- FIFO rollout remains disabled: PASS',
            '- Health: 200',
            '- Guest boot: 403',
            '',
            '**Overall: PASS**',
          ].join('\n');
          fs.writeFileSync(`${dir}/summary.md`, `${markdown}\n`);
          fs.appendFileSync(`${dir}/release.txt`, `finished_at=${summary.finished_at}\nrelease=pass\n`);
          console.log(markdown);
          NODE

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-release-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment release result on PR 8
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const dir = process.env.EVIDENCE_DIR;
            const summaryPath = `${dir}/summary.md`;
            const statePath = `${dir}/release.txt`;
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : `# alu FIFO core production release\n\n**Overall: FAIL**\n\n\`\`\`text\n${fs.existsSync(statePath) ? fs.readFileSync(statePath, 'utf8') : 'No release state was produced.'}\n\`\`\``;
            const marker = '<!-- alu-fifo-core-production-release -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${summary}\n[Release workflow and artifacts](${runUrl})`;
            const issueNumber = Number(process.env.RELEASE_PR);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
