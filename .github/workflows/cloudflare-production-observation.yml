name: Cloudflare Production Release Observation

on:
  push:
    branches:
      - hotfix/alumdoor-print-list-delete
    paths:
      - .github/release/alu-purchase-observe.trigger
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: observe-production-alu
  cancel-in-progress: true

jobs:
  observe-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      RELEASE_NOT_BEFORE: '2026-07-31T12:18:22Z'
      EVIDENCE_DIR: /tmp/alu-purchase-release-observation
      TARGET_SHA: 7b3dc06dbbecbb5370ddb48259aa1614aef2ff32

    steps:
      - name: Verify observation inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          mkdir -p "$EVIDENCE_DIR"

      - name: Observe deployment and smoke production
        id: observe
        shell: bash
        run: |
          set -uo pipefail
          BASE='https://alu.kairo.vn'
          deployment_id=''
          deployment_created_on=''
          health='000'
          guest_boot='000'
          result='FAIL'

          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cloudforge-tenant-alu/deployments" \
              --output "$EVIDENCE_DIR/deployments.json" || true

            readarray -t deployment < <(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = `${process.env.EVIDENCE_DIR}/deployments.json`;
          if (!fs.existsSync(path)) process.exit(0);
          const response = JSON.parse(fs.readFileSync(path, 'utf8'));
          const result = response.result;
          const rows = Array.isArray(result) ? result : (result?.deployments ?? []);
          const latest = rows[0] ?? {};
          console.log(latest.id ?? '');
          console.log(latest.created_on ?? '');
          NODE
            )
            deployment_id="${deployment[0]:-}"
            deployment_created_on="${deployment[1]:-}"

            health="$(curl --silent --show-error --output "$EVIDENCE_DIR/health.json" --write-out '%{http_code}' "$BASE/health" || true)"
            guest_boot="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' "$BASE/api/method/metaforge.api.get_boot" || true)"

            if [ -n "$deployment_created_on" ] && \
               [[ "$deployment_created_on" > "$RELEASE_NOT_BEFORE" || "$deployment_created_on" == "$RELEASE_NOT_BEFORE" ]] && \
               [ "$health" = '200' ] && [ "$guest_boot" = '403' ]; then
              result='PASS'
              break
            fi
            sleep 10
          done

          cat > "$EVIDENCE_DIR/summary.md" <<EOF
          ## alu purchase production observation

          - Target SHA: \`$TARGET_SHA\`
          - Deployment ID: \`${deployment_id:-not found}\`
          - Deployment created: \`${deployment_created_on:-not found}\`
          - Required not-before: \`$RELEASE_NOT_BEFORE\`
          - Health: \`$health\`
          - Guest boot: \`$guest_boot\`
          - FIFO activation: **not requested / remains disabled**
          - Result: **$result**
          EOF

          printf 'result=%s\ndeployment_id=%s\ndeployment_created_on=%s\nhealth=%s\nguest_boot=%s\n' \
            "$result" "$deployment_id" "$deployment_created_on" "$health" "$guest_boot" \
            > "$EVIDENCE_DIR/state.txt"

          [ "$result" = 'PASS' ]

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-purchase-release-observation-${{ github.run_id }}
          path: /tmp/alu-purchase-release-observation/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment observation result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = '/tmp/alu-purchase-release-observation/summary.md';
            const summary = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '## alu purchase production observation\n\n**Result: FAIL**\n\nNo summary was produced.';
            const marker = '<!-- alu-purchase-production-observation -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${summary}\n\n[Workflow and artifacts](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 52,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 52,
                body,
              });
            }
