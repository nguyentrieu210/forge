name: Temporary Bump Alumdoor V2 2.2.4

on:
  push:
    paths:
      - '.github/workflows/_tmp-bump-alumdoor-v2-224.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alumdoor-v2-version-convergence
          fetch-depth: 0
      - name: Converge version and test floor
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          brief_path = Path('server/briefs/alumdoor-v2.json')
          brief = json.loads(brief_path.read_text(encoding='utf-8'))
          assert brief['version'] == '2.0.43', brief['version']
          brief['version'] = '2.2.4'
          brief_path.write_text(json.dumps(brief, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('server/tests/alumdoor-color-seed-authority.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              'Surface Finish exclusions require Alumdoor V2 metadata version 2.0.43 or newer',
              'Surface Finish exclusions require Alumdoor V2 metadata version 2.2.4 or newer',
          )
          text = text.replace('const minimum = [2, 0, 43];', 'const minimum = [2, 2, 4];')
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-bump-alumdoor-v2-224.yml
          git add server/briefs/alumdoor-v2.json server/tests/alumdoor-color-seed-authority.test.mjs
          git diff --cached --check
          git commit -m "fix(alumdoor): converge V2 version to 2.2.4"
          git push origin HEAD:fix/alumdoor-v2-version-convergence
