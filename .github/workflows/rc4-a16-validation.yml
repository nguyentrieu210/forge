name: RC4 A16 Workplace Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/packages/frappe-api/src/workplace-maintenance.ts"
      - "server/packages/frappe-api/src/index.ts"
      - "server/tests/rc4-a16-workplace-maintenance.test.mjs"
      - "server/apps-src/workplace/**"
      - "docs/agents/rc4/A16-HANDOFF.md"
      - ".github/workflows/rc4-a16-validation.yml"

permissions:
  contents: read

concurrency:
  group: rc4-a16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workplace:
    if: github.head_ref == 'agent/rc4-16-workplace-dms-collab'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Full server build baseline (inherited debt visible)
        continue-on-error: true
        run: pnpm run server:build

      - name: Focused A16 TypeScript delta check
        working-directory: server
        run: |
          cat > tsconfig.rc4-a16.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": true,
              "declaration": false
            },
            "include": [
              "packages/frappe-api/src/workplace-maintenance.ts",
              "types/**/*.d.ts"
            ],
            "exclude": ["dist", "node_modules", "apps"]
          }
          JSON

          log="$(mktemp)"
          set +e
          pnpm exec tsc -p tsconfig.rc4-a16.json >"$log" 2>&1
          code=$?
          set -e
          cat "$log"

          if [ "$code" -eq 0 ]; then
            exit 0
          fi

          # Exact-main already carries this one transitive frappe-model type error.
          # Keep it visible, but fail for every other TypeScript error so A16 cannot
          # hide a regression behind inherited debt.
          known='packages/frappe-model/src/validate.ts(113,71): error TS2379:'
          unexpected="$(grep -E 'error TS[0-9]+:' "$log" | grep -v -F "$known" || true)"
          known_count="$(grep -F -c "$known" "$log" || true)"

          if [ -n "$unexpected" ]; then
            echo 'Unexpected TypeScript errors in A16 focused graph:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if [ "$known_count" -ne 1 ]; then
            echo "Expected exactly one documented baseline TypeScript error; found $known_count" >&2
            exit 1
          fi
          echo 'A16 delta clean; only the documented exact-main frappe-model baseline error remains.'

      - name: Verify emitted A16 artifact
        working-directory: server
        run: test -f dist/packages/frappe-api/src/workplace-maintenance.js

      - name: Workplace package delta check
        working-directory: server
        run: |
          log="$(mktemp)"
          set +e
          node scripts/pack-app.mjs apps-src/workplace --check >"$log" 2>&1
          code=$?
          set -e
          cat "$log"

          if [ "$code" -eq 0 ]; then
            exit 0
          fi

          # The exact RC4 baseline already contains the legacy `status` field in the
          # workplace package while the newer App Factory parser reserves that name.
          # A16 does not alter workplace metadata/schema; keep this debt visible and
          # reject every other pack failure.
          known='PACK_FAILED workplace: Field name is reserved: status'
          if [ "$(grep -F -c "$known" "$log" || true)" -eq 1 ] && [ "$(wc -l < "$log")" -eq 1 ]; then
            echo 'Workplace package delta clean; only the documented exact-main reserved-status debt remains.'
            exit 0
          fi
          echo 'Unexpected workplace package validation failure:' >&2
          cat "$log" >&2
          exit 1

      - name: A16 scheduled alert and WS15 authorization regressions
        working-directory: server
        run: >-
          node --test
          tests/rc4-a16-workplace-maintenance.test.mjs
          tests/ws15-notification-delivery.test.mjs
          tests/ws15-assignment-access.test.mjs
          tests/ws15-collaboration-assignment-lifecycle.test.mjs
          tests/ws15-workplace-metadata.test.mjs
