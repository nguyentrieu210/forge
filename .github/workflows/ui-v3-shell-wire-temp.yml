name: UI V3 Shell Wire Temp

on:
  push:
    branches:
      - ui/v3-02-shell-exec-20260804
    paths:
      - ".github/workflows/ui-v3-shell-wire-temp.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v3-02-shell-exec-20260804
          fetch-depth: 0
      - name: Wire current module context into V3 shell
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/packages/shell/src/WorkspaceAppShell.tsx")
          source = path.read_text()

          old_nav = '''    const orderedNav = [
      ...(overviewItem ? [overviewItem] : []),
      ...moduleNav,
      ...(reportsItem ? [reportsItem] : []),
      ...(masterItem ? [masterItem] : []),
      ...remainingGlobal,
    ];'''
          new_nav = '''    const orderedNav = [
      ...(overviewItem ? [overviewItem] : []),
      ...moduleNav,
      ...workspaceItemsForTabs(selectedModule),
      ...(reportsItem ? [reportsItem] : []),
      ...(masterItem ? [masterItem] : []),
      ...remainingGlobal,
    ];'''
          if old_nav not in source:
              raise SystemExit("orderedNav block no longer matches exact audited source")
          source = source.replace(old_nav, new_nav, 1)

          old_shell = '''      <BaseAppShell
        {...shellProps}
        nav={orderedNav}
        activeKey={showModule ? selectedModule.key : activeSidebarKey}
        onNavigate={navigateSidebar}
      >
        {showModule ? <div className="flex h-full min-h-0 flex-col">
          <WorkspaceTabs
            module={selectedModule}
            activeKey={props.activeKey}
            processActive={processActive}
            onProcess={() => setProcessActive(true)}
            onNavigate={navigate}
          />
          <div className="min-h-0 flex-1 overflow-hidden">
            {processActive
              ? <ProcessPanel module={selectedModule} reports={reportItems} masters={masterItems} onNavigate={navigate} />
              : props.children as ReactNode}
          </div>
        </div> : props.children as ReactNode}
      </BaseAppShell>'''
          new_shell = '''      <BaseAppShell
        {...shellProps}
        nav={orderedNav}
        railNav={moduleNav}
        activeRailKey={showModule ? selectedModule.key : undefined}
        activeKey={showModule && processActive ? selectedModule.key : activeSidebarKey}
        onRailNavigate={selectModule}
        onNavigate={navigateSidebar}
      >
        {showModule ? <div className="flex h-full min-h-0 flex-col">
          <div className="min-h-0 flex-1 overflow-hidden">
            {processActive
              ? <ProcessPanel module={selectedModule} reports={reportItems} masters={masterItems} onNavigate={navigate} />
              : props.children as ReactNode}
          </div>
        </div> : props.children as ReactNode}
      </BaseAppShell>'''
          if old_shell not in source:
              raise SystemExit("BaseAppShell block no longer matches exact audited source")
          source = source.replace(old_shell, new_shell, 1)
          path.write_text(source)
          PY
      - name: Commit branch-only wiring and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-v3-shell-wire-temp.yml
          git add client/packages/shell/src/WorkspaceAppShell.tsx
          git commit -m "feat(ui-v3): wire module context into V3 shell"
          git push origin HEAD:ui/v3-02-shell-exec-20260804
