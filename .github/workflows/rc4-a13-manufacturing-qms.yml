name: RC4 A13 Manufacturing QMS Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/packages/clouderp-erpnext/src/manufacturing-*.ts"
      - "server/packages/clouderp-erpnext/src/qms-*.ts"
      - "server/packages/clouderp-erpnext/src/suite-controllers.ts"
      - "server/packages/clouderp-erpnext/src/types.ts"
      - "server/apps/tenant-worker/src/manufacturing-*.ts"
      - "server/apps/tenant-worker/src/qms-api.ts"
      - "server/apps-src/manufacturing-qms/**"
      - "server/tests/manufacturing-*.test.mjs"
      - "server/tests/qms-*.test.mjs"
      - "server/tests/rc4-a13-manufacturing-qms-release-confidence.test.mjs"
      - "docs/agents/rc4/A13-*.md"
      - ".github/workflows/rc4-a13-manufacturing-qms.yml"

permissions:
  contents: read

concurrency:
  group: rc4-a13-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/rc4-13-manufacturing-qms'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit exact-head server dist and record baseline TypeScript debt
        working-directory: server
        run: |
          set +e
          pnpm exec tsc -p tsconfig.json --noEmitOnError false 2>&1 | tee /tmp/rc4-a13-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          test -f dist/packages/clouderp-erpnext/src/index.js
          test -f dist/apps/tenant-worker/src/qms-api.js
          if [ "$status" -ne 0 ]; then
            echo "Full-server TypeScript baseline remains non-zero; exact emitted dist will be exercised below."
            grep "error TS" /tmp/rc4-a13-tsc.log > /tmp/rc4-a13-typescript-baseline.log || true
            cat /tmp/rc4-a13-typescript-baseline.log
          fi

      - name: Manufacturing transaction and costing regressions
        working-directory: server
        run: |
          node --test \
            tests/manufacturing-transaction-closure.test.mjs \
            tests/manufacturing-costing-read.test.mjs \
            tests/manufacturing-costing-api.test.mjs \
            tests/manufacturing-genealogy.test.mjs \
            tests/manufacturing-genealogy-api.test.mjs \
            tests/manufacturing-mrp.test.mjs \
            tests/manufacturing-mrp-api.test.mjs \
            tests/manufacturing-mrp-netting.test.mjs \
            tests/manufacturing-mrp-netting-api.test.mjs \
            tests/manufacturing-capacity.test.mjs \
            tests/manufacturing-capacity-api.test.mjs

      - name: QMS lifecycle, API and A13 closure regressions
        working-directory: server
        run: |
          node --test \
            tests/qms-lifecycle.test.mjs \
            tests/qms-api.test.mjs \
            tests/qms-sampling.test.mjs \
            tests/rc4-a13-manufacturing-qms-release-confidence.test.mjs

      - name: Manufacturing QMS metadata package gate
        working-directory: server
        run: |
          node scripts/verify-first-party-meta.mjs
          node scripts/pack-app.mjs apps-src/manufacturing-qms --check
