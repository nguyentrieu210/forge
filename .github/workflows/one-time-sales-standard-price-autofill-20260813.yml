name: One-time Sales ordinary price autofill

on:
  push:
    branches:
      - fix/sales-standard-price-autofill-20260813
    paths:
      - ".github/workflows/one-time-sales-standard-price-autofill-20260813.yml"

permissions:
  contents: write

jobs:
  patch-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/sales-standard-price-autofill-20260813
          fetch-depth: 0

      - name: Patch Sales ordinary-item projection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  inventory_mode?: string;\n  allowed_uoms?: string[];\n',
                  '  inventory_mode?: string;\n  selected_uom?: string;\n  allowed_uoms?: string[];\n',
              ),
              (
                  '      next._itemPrices = itemPrices;\n\n      let candidate = { ...row, ...next, _context: context } as SalesLine;\n',
                  '      next._itemPrices = itemPrices;\n\n      // item_context already resolves the Item master default sales UOM. Feed that\n      // projection into the shared commercial resolver; do not calculate money here.\n      const selectedUom = text(context.selected_uom);\n      if (!text(row.uom) && !text(next.uom) && selectedUom) next.uom = selectedUom;\n\n      let candidate = { ...row, ...next, _context: context } as SalesLine;\n',
              ),
              (
                  '    const salesOptionLabel = text(commercial.sales_option_label)\n      || text(selectedOption?.option_label)\n      || (text(line.sales_option) ? text(line.sales_option) : "Tiêu chuẩn");\n',
                  '    const salesOptionLabel = text(commercial.sales_option_label)\n      || text(selectedOption?.option_label)\n      || text(line.sales_option);\n',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one patch target, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Assert regression invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx").read_text(encoding="utf-8")
          assert "selected_uom?: string;" in source
          assert "if (!text(row.uom) && !text(next.uom) && selectedUom) next.uom = selectedUom;" in source
          assert '|| (text(line.sales_option) ? text(line.sales_option) : "Tiêu chuẩn")' not in source
          assert 'const salesOptionLabel = text(commercial.sales_option_label)' in source
          PY
          git diff --check

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install client workspace ignoring pre-existing stale lock
        working-directory: client
        run: pnpm install --no-frozen-lockfile

      - name: Bundle hardcoded Sales Order source for browser
        working-directory: client
        run: |
          pnpm dlx esbuild@0.25.12 packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx \
            --bundle \
            --platform=browser \
            --format=esm \
            --target=es2022 \
            '--external:@metaforge/*' \
            --external:react \
            --external:react-dom \
            --external:react/jsx-runtime \
            --outfile=/tmp/alumdoor-sales-order.js
          test -s /tmp/alumdoor-sales-order.js

      - name: Commit UI-only fix and remove one-time workflow
        run: |
          git restore client/pnpm-lock.yaml
          git rm .github/workflows/one-time-sales-standard-price-autofill-20260813.yml
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): autofill ordinary sales price"
          git push origin HEAD:fix/sales-standard-price-autofill-20260813
