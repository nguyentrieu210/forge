name: WS09 A1B Table Transaction Validation

on:
  pull_request:
    branches:
      - main
      - program/ws09-batch-productization-20260804
    paths:
      - "server/packages/app-registry/src/batch-action.ts"
      - "server/packages/app-registry/src/action-input-table*.ts"
      - "server/scripts/lib/batch-action-brief.mjs"
      - "server/scripts/lib/compile-brief-app-factory.mjs"
      - "server/scripts/lib/validate-brief-schema.mjs"
      - "server/tests/app-batch-action-*.test.mjs"
      - ".github/workflows/ws09-a1b-validation.yml"

permissions:
  contents: read

concurrency:
  group: ws09-a1b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: startsWith(github.head_ref, 'agent/ws09-batch-01b-table-transaction')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused App Factory TypeScript with baseline classification
        working-directory: server
        run: |
          cat > tsconfig.ws09-a1b.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "rootDir": ".",
              "outDir": "./dist",
              "declaration": false,
              "sourceMap": false,
              "noEmitOnError": false
            },
            "include": [
              "packages/app-registry/src/**/*.ts",
              "packages/contracts/src/**/*.ts",
              "packages/core/src/**/*.ts",
              "packages/document-kernel/src/**/*.ts",
              "packages/frappe-model/src/**/*.ts",
              "packages/money/src/**/*.ts",
              "packages/outbox/src/**/*.ts",
              "types/**/*.d.ts"
            ],
            "exclude": ["dist", "node_modules", "apps/web"]
          }
          JSON
          set +e
          pnpm exec tsc -p tsconfig.ws09-a1b.json 2>&1 | tee /tmp/ws09-a1b-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep "error TS" /tmp/ws09-a1b-tsc.log > /tmp/ws09-a1b-errors.log || true
            grep -vE '^packages/app-registry/src/app-factory-definition\.ts|^packages/frappe-model/src/validate\.ts' /tmp/ws09-a1b-errors.log > /tmp/ws09-a1b-unexpected.log || true
            if [ -s /tmp/ws09-a1b-unexpected.log ]; then
              echo "Unexpected TypeScript errors in WS09 A1B blast radius:"
              cat /tmp/ws09-a1b-unexpected.log
              exit 1
            fi
            echo "Only known unchanged baseline TypeScript debt was observed:"
            cat /tmp/ws09-a1b-errors.log
          fi

      - name: Batch contract regressions
        working-directory: server
        run: node --test tests/app-batch-action-contract.test.mjs tests/app-batch-action-brief.test.mjs
