name: UI6 Builder Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "client/apps/demo/src/BuilderRoutes.tsx"
      - "client/packages/builder/**"
      - ".github/workflows/ui6-builder-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck builder package
        run: pnpm --filter @metaforge/builder run typecheck
      - name: Build MetaForge demo
        run: pnpm --filter @metaforge/demo run build
