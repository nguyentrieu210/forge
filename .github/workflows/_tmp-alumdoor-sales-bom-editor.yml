name: Temporary Alumdoor Sales BOM Editor
on:
  push:
    branches: ['agent/alumdoor-bom-draft-guidance']
    paths: ['.github/workflows/_tmp-alumdoor-sales-bom-editor.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Wire actual BOM guidance into Sales Order
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx')
          text = path.read_text()

          def insert_before(anchor, addition):
              global text
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'before anchor count {count}: {anchor!r}')
              text = text.replace(anchor, dedent(addition).lstrip('\n') + anchor, 1)

          def insert_after(anchor, addition):
              global text
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'after anchor count {count}: {anchor!r}')
              text = text.replace(anchor, anchor + dedent(addition).lstrip('\n'), 1)

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replace anchor count {count}: {old!r}')
              text = text.replace(old, new, 1)

          insert_after('import { salesItemSearchTerms } from "./sales-item-search.js";\n', '''
          import {
            AlumdoorBomActualEditor,
            type BomActualComponentRow,
            type BomActualRequirement,
          } from "./AlumdoorBomActualEditor.js";
          ''')
          insert_after('  _splitPackageChecksum?: string;\n', '''
            _bomActualRequirements?: BomActualRequirement[];
            _bomActualComplete?: boolean;
            _bomTemplateCode?: string;
            _bomActualError?: string;
          ''')
          insert_after('  qty_bar?: number;\n', '  bom_actual_components?: BomActualComponentRow[];\n')

          insert_before('      patchLine(row._key, next);\n', '''
          const bomCandidate = { ...row, ...next, _context: context } as SalesLine;
          if (isAreaDoor(bomCandidate)
            && numberValue(bomCandidate.width_m) !== undefined
            && numberValue(bomCandidate.height_m) !== undefined
            && ["Đại lý", "Lẻ"].includes(text(header.customer_group))) {
            try {
              const bomPreview = await adapter.callPost<Json>("alumdoor.sales.preview_bom_requirements", {
                ...cleanLine(bomCandidate),
                customer_group: text(header.customer_group),
                delivery_date: text(header.delivery_date) || today(),
              });
              if (lineSeq.current.get(row._key) !== seq) return;
              const requirements = Array.isArray(bomPreview.actual_requirements)
                ? bomPreview.actual_requirements.filter((entry): entry is BomActualRequirement => Boolean(entry) && typeof entry === "object" && !Array.isArray(entry))
                : [];
              next._bomActualRequirements = requirements;
              next._bomActualComplete = bomPreview.actual_complete === true || bomPreview.actual_complete === 1;
              next._bomTemplateCode = text(bomPreview.bom_template_code) || undefined;
              next._bomActualError = "";
            } catch (error) {
              next._bomActualRequirements = [];
              next._bomActualComplete = false;
              next._bomTemplateCode = undefined;
              next._bomActualError = mapError(error).message;
            }
          } else {
            next._bomActualRequirements = [];
            next._bomActualComplete = undefined;
            next._bomTemplateCode = undefined;
            next._bomActualError = "";
          }

          ''')

          insert_after('        _splitPackageChecksum: undefined,\n', '''
            bom_actual_components: [],
            _bomActualRequirements: [],
            _bomActualComplete: undefined,
            _bomTemplateCode: undefined,
            _bomActualError: "",
          ''')

          insert_before('  const toggleSplitComponent = useCallback((parentKey: string, component: Json, checked: boolean) => {\n', '''
          const commitBomActualComponents = useCallback((key: string, rows: BomActualComponentRow[]) => {
            const current = linesRef.current.find((line) => line._key === key);
            if (!current) return;
            const patch: Partial<SalesLine> = { bom_actual_components: rows };
            patchLine(key, patch);
            void previewLine({ ...current, ...patch } as SalesLine, "bom_actual_components", patch);
          }, [patchLine, previewLine]);

          ''')

          replace_once(
              '    const message = row.error || row.pricingError;\n',
              '    const message = row.error || row.pricingError || lines[index]?._bomActualError;\n',
          )
          replace_once(
              '          const hasLinkedRows = hasInlineDetail || giftComponents.length > 0 || selectableComponents.length > 0;\n',
              '          const bomActualRequirements = line._bomActualRequirements ?? [];\n          const hasBomActualRow = Boolean(line._bomTemplateCode || line._bomActualError || bomActualRequirements.length > 0);\n          const hasLinkedRows = hasInlineDetail || hasBomActualRow || giftComponents.length > 0 || selectableComponents.length > 0;\n',
          )
          replace_once(
              '              <TableRow className={`${recordTone} ${giftComponents.length || selectableComponents.length ? "[&>td]:!border-b-0" : "border-b-2"} [&>td]:!bg-inherit`} data-section="sales-line-detail-row">\n',
              '              <TableRow className={`${recordTone} ${hasBomActualRow || giftComponents.length || selectableComponents.length ? "[&>td]:!border-b-0" : "border-b-2"} [&>td]:!bg-inherit`} data-section="sales-line-detail-row">\n',
          )

          insert_before('            {selectableComponents.map((component, componentIndex) => {\n', '''
          {hasBomActualRow ? (
            <TableRow
              className={`${recordTone} ${giftComponents.length || selectableComponents.length ? "[&>td]:!border-b-0" : "border-b-2"} [&>td]:!bg-inherit`}
              data-section="sales-line-bom-actual-row"
            >
              <TableCell className="px-1 py-2" />
              <TableCell className="w-20 whitespace-nowrap px-2 py-2 text-center align-top font-semibold text-foreground">BOM</TableCell>
              <TableCell colSpan={9} className="max-w-0 px-3 py-2 text-left align-top">
                <div className="space-y-2">
                  <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div className="font-medium text-foreground">
                      {line._bomTemplateCode ? `BOM Template · ${line._bomTemplateCode}` : "Yêu cầu vật tư BOM"}
                    </div>
                    {line._bomActualError ? (
                      <span className="font-medium text-destructive">Không resolve được BOM</span>
                    ) : line._bomActualComplete ? (
                      <span className="font-medium text-foreground">Đủ vật tư thực tế</span>
                    ) : (
                      <span className="font-medium text-destructive">
                        Còn thiếu {bomActualRequirements.filter((requirement) => requirement.missing).map((requirement) => requirement.component_key).join(", ") || "vật tư thực tế"}
                      </span>
                    )}
                  </div>
                  {line._bomActualError ? (
                    <div className="rounded-md border border-destructive/30 bg-destructive/5 px-3 py-2 text-xs text-destructive">
                      {line._bomActualError}
                    </div>
                  ) : null}
                  {bomActualRequirements.length > 0 ? (
                    <AlumdoorBomActualEditor
                      requirements={bomActualRequirements}
                      value={line.bom_actual_components ?? []}
                      disabled={formReadOnly || Boolean(line._loading)}
                      onChange={(rows) => commitBomActualComponents(line._key, rows)}
                    />
                  ) : null}
                </div>
              </TableCell>
            </TableRow>
          ) : null}
          ''')

          path.write_text(text)
          PY
      - name: Typecheck client
        working-directory: client
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run typecheck
      - name: Commit client change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-alumdoor-sales-bom-editor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx .github/workflows/_tmp-alumdoor-sales-bom-editor.yml
          git commit -m 'feat(alumdoor): guide actual BOM inputs in sales'
          git push origin HEAD:agent/alumdoor-bom-draft-guidance
