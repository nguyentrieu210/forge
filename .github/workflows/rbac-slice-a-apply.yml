name: Apply RBAC Slice A

on:
  push:
    branches:
      - feat/rbac-permission-completion-20260731

permissions:
  contents: write

concurrency:
  group: rbac-slice-a-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'chore(rbac): queue slice A implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rbac-permission-completion-20260731
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply reviewed Slice A patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              write(path, value.replace(old, new, 1))

          def replace_block(path: str, start: str, end: str, replacement: str) -> None:
              value = read(path)
              if value.count(start) != 1 or value.count(end) != 1:
                  raise SystemExit(f"{path}: block markers are not unique")
              left, tail = value.split(start, 1)
              _, right = tail.split(end, 1)
              write(path, left + replacement + end + right)

          access = "server/packages/frappe-api/src/access-control.ts"
          replace_once(
              access,
              '  const user = await input.users.get(input.tenantId, requested);\n  if (!user) throw errors.notFound("User not found");\n  const roles = await input.users.listRoles(input.tenantId, user.user_id);',
              '  const user = await input.users.get(input.tenantId, requested);\n  if (!user) throw errors.notFound("User not found");\n  if (!user.enabled) throw errors.permission("User account is disabled");\n  const roles = await input.users.listRoles(input.tenantId, user.user_id);',
          )
          replace_once(
              access,
              '/** D3: exact-value scope only until a hierarchy contract and evaluator exist. */',
              '''/** Decodes the stable User Permission identity without trusting browser-supplied roles or tenant. */
export function parseUserPermissionIdentity(identity: string): {
  user: string;
  allow: string;
  forValue: string;
  applicableFor?: string;
} {
  const parts = identity.split("|");
  if (parts.length !== 4) throw errors.validation("User Permission id is invalid");
  let decoded: string[];
  try {
    decoded = parts.map((part) => decodeURIComponent(part));
  } catch {
    throw errors.validation("User Permission id is invalid");
  }
  const user = decoded[0] ?? "";
  const allow = decoded[1] ?? "";
  const forValue = decoded[2] ?? "";
  const applicableFor = decoded[3] ?? "";
  if (!user || !allow || !forValue) throw errors.validation("User Permission id is invalid");
  return { user, allow, forValue, ...(applicableFor ? { applicableFor } : {}) };
}

/** D3: exact-value scope only until a hierarchy contract and evaluator exist. */''',
          )

          router = "server/packages/frappe-api/src/router.ts"
          replace_once(
              router,
              'import { assertKanbanField, type D1DeskViewStore } from "./desk-views.js";\n',
              '''import { assertKanbanField, type D1DeskViewStore } from "./desk-views.js";
import {
  assertExactUserPermission,
  evaluatePermissionCapabilities,
  isAccessAdministrator,
  parseUserPermissionIdentity,
  resolveAccessInspectionActor,
  userPermissionIdentity,
} from "./access-control.js";
''',
          )
          replace_once(
              router,
              'export const FORGE_CONTRACT_VERSION = "16.0.0-forge.2";',
              'export const FORGE_CONTRACT_VERSION = "16.0.0-forge.3";',
          )

          replace_block(
              router,
              'async function accessProfile(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {',
              '/**\n * Explains an effective permission decision.',
              '''async function accessProfile(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {
  const requested = args.text("user");
  if (requested && requested !== context.actor.user_id) requireMetadataAdmin(context);
  const user = requested ?? context.actor.user_id;
  const userRecord = await context.users.get(context.tenantId, user);
  if (!userRecord) throw errors.notFound("User not found");
  const roles = user === context.actor.user_id ? [...context.actor.roles] : await context.users.listRoles(context.tenantId, user);
  const permissions = await context.access.listUserPermissions(context.tenantId, user);
  const byDoctype = new Map<string, JsonObject[]>();
  for (const record of permissions) {
    const id = userPermissionIdentity({
      user,
      allow: record.allow_doctype,
      forValue: record.allow_name,
      applicableFor: record.applicable_for_doctype,
    });
    const list = byDoctype.get(record.allow_doctype) ?? [];
    list.push({
      id,
      value: record.allow_name,
      label: record.allow_name,
      ...(record.applicable_for_doctype ? { applicableFor: record.applicable_for_doctype } : {}),
      ...(record.is_default ? { isDefault: true } : {}),
      ...(record.hide_descendants ? { hideDescendants: true } : {}),
    });
    byDoctype.set(record.allow_doctype, list);
  }
  return {
    user,
    fullName: userRecord.full_name,
    enabled: userRecord.enabled,
    roles,
    assignedRoles: roles,
    scopes: [...byDoctype].map(([doctype, values]) => ({ doctype, values })) as unknown as JsonValue,
    canManage: isAccessAdministrator(context.actor),
    user_permissions: permissions.map((record) => ({
      id: userPermissionIdentity({
        user,
        allow: record.allow_doctype,
        forValue: record.allow_name,
        applicableFor: record.applicable_for_doctype,
      }),
      allow: record.allow_doctype,
      for_value: record.allow_name,
      applicable_for: record.applicable_for_doctype || null,
      is_default: record.is_default ? 1 : 0,
      hide_descendants: record.hide_descendants ? 1 : 0,
    })),
  };
}

''',
          )

          replace_block(
              router,
              'async function explainPermission(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {',
              'async function addUserPermission(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {',
              '''async function explainPermission(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {
  const doctype = args.requireText("doctype", 160);
  const name = args.text("name");
  const actor = await resolveAccessInspectionActor({
    requestedUser: args.text("user"),
    caller: context.actor,
    tenantId: context.tenantId,
    users: context.users,
  });
  const meta = await requireMeta(doctype, context);
  const document = name ? await context.documents.getDocument(context.tenantId, doctype, name) : null;
  if (name && !document) throw errors.notFound();
  const scope = await context.permissions.getReadScope(actor, context.tenantId, doctype).catch(() => null);
  const evaluation = await evaluatePermissionCapabilities({
    actor,
    tenantId: context.tenantId,
    doctype,
    meta,
    document,
    permissions: context.permissions,
  });
  return {
    user: actor.user_id,
    doctype,
    ...(name ? { name } : {}),
    roles: [...actor.roles],
    read_scope: scope?.mode ?? "denied",
    user_permissions: (scope?.user_permissions ?? []).map((constraint) => ({
      allow: constraint.allow_doctype,
      fields: constraint.fields,
      allowed_values: constraint.allowed_values,
    })),
    capabilities: evaluation.capabilities,
    trace: evaluation.trace as unknown as JsonValue,
  };
}

''',
          )

          replace_block(
              router,
              'async function addUserPermission(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {',
              'async function removeUserPermission(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {',
              '''async function addUserPermission(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {
  requireMetadataAdmin(context);
  const user = args.requireText("user", 320);
  const allow = args.requireText("allow", 160);
  const forValue = args.requireText("for_value", 320);
  const applicable = args.text("applicable_for") ?? "";
  const targetUser = await context.users.get(context.tenantId, user);
  if (!targetUser) throw errors.notFound("User not found");
  const hideDescendants = args.bool("hide_descendants", false);
  assertExactUserPermission(hideDescendants);

  const exists = await context.documents.hasMasterRecord(context.tenantId, allow, forValue)
    || Boolean(await context.documents.getDocument(context.tenantId, allow, forValue));
  if (!exists) throw errors.reference(`${allow} ${forValue} does not exist`);

  if (applicable) {
    const target = await context.metadata.getDocType(context.tenantId, applicable);
    if (!target || !target.fields.some((field) => field.fieldtype === "Link" && field.options === allow)) {
      throw errors.validation(`${applicable} has no Link field to ${allow}`);
    }
  }

  const isDefault = args.bool("is_default", false);
  const record = await context.access.putUserPermission?.(context.tenantId, {
    user,
    allow_doctype: allow,
    allow_name: forValue,
    applicable_for_doctype: applicable,
    is_default: isDefault,
    hide_descendants: false,
    created_by: context.actor.user_id,
    created_at: context.now(),
  });
  if (!record) throw errors.validation("User permissions are not writable on this deployment");
  return {
    id: userPermissionIdentity({ user, allow, forValue, applicableFor: applicable }),
    user,
    allow,
    for_value: forValue,
    applicable_for: applicable || null,
    is_default: isDefault ? 1 : 0,
    hide_descendants: 0,
  };
}

''',
          )

          replace_block(
              router,
              'async function removeUserPermission(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {',
              'async function setUserRoles(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {',
              '''async function removeUserPermission(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {
  requireMetadataAdmin(context);
  const encoded = args.text("id");
  const identity = encoded
    ? parseUserPermissionIdentity(encoded)
    : {
      user: args.requireText("user", 320),
      allow: args.requireText("allow", 160),
      forValue: args.requireText("for_value", 320),
      ...(args.text("applicable_for") ? { applicableFor: args.text("applicable_for")! } : {}),
    };
  if (!context.access.deleteUserPermission) {
    throw errors.validation("User permissions are not writable on this deployment");
  }
  await context.access.deleteUserPermission(
    context.tenantId,
    identity.user,
    identity.allow,
    identity.forValue,
    identity.applicableFor ?? "",
  );
  return { id: userPermissionIdentity(identity), removed: true };
}

''',
          )

          replace_once(
              "client/packages/adapter-frappe/src/adapter.ts",
              '  removeUserPermission(name: string): Promise<void>;',
              '  removeUserPermission(id: string): Promise<void>;',
          )
          replace_once(
              "client/packages/adapter-frappe/src/frappe-adapter.ts",
              '''  async removeUserPermission(name: string): Promise<void> {
    await this.app.call().post("metaforge.api.remove_user_permission", { name });
  }''',
              '''  async removeUserPermission(id: string): Promise<void> {
    await this.app.call().post("metaforge.api.remove_user_permission", { id });
  }''',
          )
          replace_once(
              "client/packages/views/src/access/PermissionCenter.tsx",
              '{data.trace.map((item, index) => (',
              '{(data.trace ?? []).map((item, index) => (',
          )

          test_path = "server/tests/rbac-contract.test.mjs"
          replace_once(
              test_path,
              '''  assertExactUserPermission,
  evaluatePermissionCapabilities,
  resolveAccessInspectionActor,
  userPermissionIdentity,
} from "../dist/packages/frappe-api/src/index.js";''',
              '''  assertExactUserPermission,
  evaluatePermissionCapabilities,
  parseUserPermissionIdentity,
  resolveAccessInspectionActor,
  routeFrappeApi,
  userPermissionIdentity,
} from "../dist/packages/frappe-api/src/index.js";''',
          )
          replace_once(test_path, 'function userStore() {', 'function userStore(enabled = true) {')
          replace_once(test_path, '        enabled: true,', '        enabled,')
          replace_once(
              test_path,
              '''test("a non-admin cannot inspect another user's access", async () => {
  await assert.rejects(
    resolveAccessInspectionActor({
      requestedUser: USER.user_id,
      caller: { user_id: "sales@example.com", roles: ["Sales User"] },
      tenantId: "tenant-a",
      users: userStore(),
    }),
    /System Manager is required/,
  );
});
''',
              '''test("a non-admin cannot inspect another user's access", async () => {
  await assert.rejects(
    resolveAccessInspectionActor({
      requestedUser: USER.user_id,
      caller: { user_id: "sales@example.com", roles: ["Sales User"] },
      tenantId: "tenant-a",
      users: userStore(),
    }),
    /System Manager is required/,
  );
});

test("a disabled user is not silently simulated as an active actor", async () => {
  await assert.rejects(
    resolveAccessInspectionActor({
      requestedUser: USER.user_id,
      caller: ADMIN,
      tenantId: "tenant-a",
      users: userStore(false),
    }),
    /disabled/,
  );
});
''',
          )
          replace_once(
              test_path,
              '''test("user-permission identity is stable and includes the applicable doctype", () => {
  const base = { user: USER.user_id, allow: "Warehouse", forValue: "KHO-1" };
  assert.equal(userPermissionIdentity(base), userPermissionIdentity(base));
  assert.notEqual(
    userPermissionIdentity(base),
    userPermissionIdentity({ ...base, applicableFor: "Stock Entry" }),
  );
});''',
              '''test("user-permission identity is stable, reversible and includes the applicable doctype", () => {
  const base = { user: USER.user_id, allow: "Warehouse", forValue: "KHO-1" };
  assert.equal(userPermissionIdentity(base), userPermissionIdentity(base));
  const scoped = { ...base, applicableFor: "Stock Entry" };
  const id = userPermissionIdentity(scoped);
  assert.notEqual(userPermissionIdentity(base), id);
  assert.deepEqual(parseUserPermissionIdentity(id), scoped);
  assert.throws(() => parseUserPermissionIdentity("broken"), /invalid/);
});''',
          )
          with Path(test_path).open("a", encoding="utf-8") as handle:
              handle.write(r'''

function routeFixture() {
  const permissions = [];
  const permissionCalls = [];
  const meta = {
    name: "Stock Entry",
    module: "Stock",
    fields: [],
    permissions: [{ role: "Stock User", read: true, write: true, create: true }],
    is_submittable: true,
    revision: 1,
  };
  const document = {
    tenant_id: "tenant-a",
    doctype: "Stock Entry",
    name: "STE-1",
    owner: "someone@example.com",
    docstatus: 0,
    status: "Draft",
    version: 1,
    created_at: "2026-07-31T00:00:00.000Z",
    modified_at: "2026-07-31T00:00:00.000Z",
    data: {},
    children: [],
  };
  const context = {
    tenantId: "tenant-a",
    actor: ADMIN,
    traceId: "trace-rbac",
    now: () => "2026-07-31T00:00:00.000Z",
    users: userStore(),
    metadata: {
      async getDocType(tenantId, doctype) {
        assert.equal(tenantId, "tenant-a");
        return doctype === "Stock Entry" ? meta : null;
      },
    },
    documents: {
      async getDocument(tenantId, doctype, name) {
        assert.equal(tenantId, "tenant-a");
        return doctype === "Stock Entry" && name === "STE-1" ? document : null;
      },
      async hasMasterRecord(tenantId, doctype, name) {
        return tenantId === "tenant-a" && doctype === "Warehouse" && name === "KHO-1";
      },
    },
    permissions: {
      async getReadScope(actor, tenantId, doctype) {
        assert.equal(tenantId, "tenant-a");
        assert.equal(doctype, "Stock Entry");
        return { mode: "all", actor_user_id: actor.user_id, user_permissions: [] };
      },
      async assert(request) {
        permissionCalls.push(request);
        if (["read", "create", "save"].includes(request.action)) return;
        throw new Error(`Role is not allowed to ${request.action}`);
      },
    },
    access: {
      async listUserPermissions(tenantId, user) {
        assert.equal(tenantId, "tenant-a");
        return permissions.filter((record) => record.user === user);
      },
      async putUserPermission(tenantId, record) {
        assert.equal(tenantId, "tenant-a");
        const index = permissions.findIndex((current) =>
          current.user === record.user
          && current.allow_doctype === record.allow_doctype
          && current.allow_name === record.allow_name
          && current.applicable_for_doctype === record.applicable_for_doctype);
        if (index >= 0) permissions[index] = record;
        else permissions.push(record);
        return record;
      },
      async deleteUserPermission(tenantId, user, allow, forValue, applicableFor) {
        assert.equal(tenantId, "tenant-a");
        const index = permissions.findIndex((record) =>
          record.user === user
          && record.allow_doctype === allow
          && record.allow_name === forValue
          && record.applicable_for_doctype === applicableFor);
        if (index >= 0) permissions.splice(index, 1);
      },
    },
  };
  return { context, permissionCalls, permissions };
}

async function callMethod(method, params, context) {
  const url = new URL(`https://tenant.test/api/method/${method}`);
  for (const [key, value] of Object.entries(params)) url.searchParams.set(key, String(value));
  const response = await routeFrappeApi(new Request(url), url, context);
  assert.ok(response);
  const body = await response.json();
  return { response, body };
}

test("explain_permission routes every decision through the selected user's actor", async () => {
  const fixture = routeFixture();
  const { response, body } = await callMethod("metaforge.api.explain_permission", {
    doctype: "Stock Entry",
    name: "STE-1",
    user: USER.user_id,
  }, fixture.context);
  assert.equal(response.status, 200);
  assert.equal(body.message.user, USER.user_id);
  assert.deepEqual(body.message.roles, USER.roles);
  assert.ok(Array.isArray(body.message.trace));
  assert.ok(body.message.trace.length > 0);
  assert.ok(fixture.permissionCalls.length >= 6);
  assert.ok(fixture.permissionCalls.every((request) => request.actor.user_id === USER.user_id));
});

test("User Permission add/profile/remove uses one stable id contract", async () => {
  const fixture = routeFixture();
  const added = await callMethod("metaforge.api.add_user_permission", {
    user: USER.user_id,
    allow: "Warehouse",
    for_value: "KHO-1",
  }, fixture.context);
  assert.equal(added.response.status, 200);
  const id = added.body.message.id;
  assert.equal(typeof id, "string");

  const profile = await callMethod("metaforge.api.get_access_profile", {
    user: USER.user_id,
  }, fixture.context);
  assert.equal(profile.body.message.scopes[0].values[0].id, id);

  const removed = await callMethod("metaforge.api.remove_user_permission", { id }, fixture.context);
  assert.equal(removed.response.status, 200);
  assert.equal(removed.body.message.id, id);
  assert.equal(fixture.permissions.length, 0);
});
''')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server tests
        run: pnpm run server:test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "Forge RBAC CI"
          git config user.email "actions@users.noreply.github.com"
          git add server/packages/frappe-api/src/access-control.ts \
                  server/packages/frappe-api/src/router.ts \
                  server/tests/rbac-contract.test.mjs \
                  client/packages/adapter-frappe/src/adapter.ts \
                  client/packages/adapter-frappe/src/frappe-adapter.ts \
                  client/packages/views/src/access/PermissionCenter.tsx
          git commit -m "feat(rbac): complete permission inspection contract"
          git push origin HEAD:feat/rbac-permission-completion-20260731
