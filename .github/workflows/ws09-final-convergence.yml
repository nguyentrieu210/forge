name: WS09 Final Convergence

on:
  pull_request:
    branches:
      - main
      - program/ws09-batch-productization-20260804
    paths:
      - "server/packages/app-registry/src/action-input-table*.ts"
      - "server/packages/app-registry/src/batch-action.ts"
      - "server/packages/batch-executor/**"
      - "server/packages/clouderp-erpnext/src/stock-reconciliation-batch*.ts"
      - "server/packages/clouderp-erpnext/src/manufacturing-bom-*.ts"
      - "server/apps/tenant-worker/src/manufacturing-bom-bulk-api.ts"
      - "server/migrations/tenant/0110_batch_replay_claims.sql"
      - "server/tests/app-batch-action-*.test.mjs"
      - "server/tests/batch-*.test.mjs"
      - "server/tests/stock-reconciliation-*.test.mjs"
      - "server/tests/manufacturing-bom-*.test.mjs"
      - "client/packages/core/src/app/action-input-table.ts"
      - "client/packages/views/src/action/**"
      - "client/packages/views/src/screen/**"
      - "client/packages/views/tests/action-input-table.test.mjs"
      - ".github/workflows/ws09-final-convergence.yml"

permissions:
  contents: read

concurrency:
  group: ws09-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: startsWith(github.head_ref, 'agent/ws09-batch-05-convergence') || github.head_ref == 'program/ws09-batch-productization-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact convergence head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit WS09 server graph and reject changed-source TypeScript errors
        working-directory: server
        run: |
          cat > tsconfig.ws09-final.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "rootDir": ".",
              "outDir": "./dist",
              "declaration": false,
              "sourceMap": false,
              "noEmitOnError": false
            },
            "include": [
              "apps/tenant-worker/src/manufacturing-bom-bulk-api.ts",
              "packages/app-registry/src/**/*.ts",
              "packages/batch-executor/src/**/*.ts",
              "packages/clouderp-erpnext/src/**/*.ts",
              "packages/clouderp-stock/src/**/*.ts",
              "packages/contracts/src/**/*.ts",
              "packages/core/src/**/*.ts",
              "packages/document-kernel/src/**/*.ts",
              "packages/frappe-model/src/**/*.ts",
              "packages/ledger/src/**/*.ts",
              "packages/money/src/**/*.ts",
              "packages/outbox/src/**/*.ts",
              "types/**/*.d.ts"
            ],
            "exclude": ["dist", "node_modules", "apps/web"]
          }
          JSON
          set +e
          pnpm exec tsc -p tsconfig.ws09-final.json 2>&1 | tee /tmp/ws09-final-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep "error TS" /tmp/ws09-final-tsc.log > /tmp/ws09-final-errors.log || true
            grep -E 'batch-action\.ts|action-input-table|packages/batch-executor/|stock-reconciliation-batch|manufacturing-bom-batch|manufacturing-bom-bulk-api\.ts' /tmp/ws09-final-errors.log > /tmp/ws09-final-changed-errors.log || true
            if [ -s /tmp/ws09-final-changed-errors.log ]; then
              echo "TypeScript error intersects WS09 changed authority:"
              cat /tmp/ws09-final-changed-errors.log
              exit 1
            fi
            echo "Only baseline TypeScript errors outside WS09 changed authority remain:"
            cat /tmp/ws09-final-errors.log
          fi

      - name: Shared BatchAction and executor regressions
        working-directory: server
        run: node --test tests/app-batch-action-contract.test.mjs tests/app-batch-action-brief.test.mjs tests/batch-executor.test.mjs tests/batch-a1-a2-integration.test.mjs tests/batch-a1-a2-table-integration.test.mjs tests/batch-d1-replay-store.test.mjs

      - name: Inventory critical regressions
        working-directory: server
        run: node --test tests/stock-reconciliation-batch-consumer.test.mjs tests/stock-reconciliation-batch-platform-integration.test.mjs tests/stock-reconciliation-integrity.test.mjs

      - name: Manufacturing BOM regressions
        working-directory: server
        run: node --test tests/manufacturing-bom-batch-platform-integration.test.mjs tests/manufacturing-bom-bulk.test.mjs tests/manufacturing-bom-bulk-api.test.mjs

      - name: Replay migration and SQL repository validation
        working-directory: server
        run: |
          python3 scripts/test-batch-replay-migration.py
          python3 scripts/verify-sql.py

      - name: Build client dependency declarations
        run: |
          pnpm --filter @metaforge/core run build
          pnpm --filter @metaforge/visual run build
          pnpm --filter @metaforge/charts run build
          pnpm --filter @metaforge/ui run build
          pnpm --filter @metaforge/controls run build
          pnpm --filter @metaforge/shell run build

      - name: Validate first-class input-table client
        run: pnpm --filter @metaforge/views run test:action-input-table

      - name: Build production runtime
        run: pnpm --filter runtime run build
