name: GRID-03 Regenerate Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: grid-03-regen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.head_ref == 'agent/grid-03-alumdoor-meta-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact GRID-03 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate AlumDoor V2 brief
        working-directory: server
        run: node scripts/build-alumdoor-v2-brief.mjs

      - name: Verify child-grid metadata contract
        working-directory: server
        run: node --test tests/alumdoor-child-presentation.test.mjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit generated brief when changed
        shell: bash
        run: |
          git add server/briefs/alumdoor-v2.json
          if git diff --cached --quiet; then
            echo "GRID-03 generated brief already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(grid-03): rematerialize child-grid presentation [grid03-regen]"
          git push origin HEAD:${{ github.head_ref }}
