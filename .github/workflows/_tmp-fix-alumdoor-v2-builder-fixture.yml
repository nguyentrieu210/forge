name: Temporary Fix Alumdoor V2 Builder Fixture
on:
  push:
    branches: ['agent/alumdoor-bom-template-resolver']
    paths:
      - '.github/workflows/_tmp-fix-alumdoor-v2-builder-fixture.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make canonical Cutting Policy fixtures regenerative
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'server/scripts/build-alumdoor-v2-brief.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const before = `for (const policy of CUTTING_POLICIES) {\n  const fixture = brief.fixtures.find((entry) => entry.type === "Cutting Policy" && entry.name === policy.name);\n  if (!fixture) throw new Error(\`Cutting Policy fixture missing: \${policy.name}\`);\n  Object.assign(fixture.data, cuttingPolicyFixtureData(policy));\n}`;
          const after = `for (const policy of CUTTING_POLICIES) {\n  let fixture = brief.fixtures.find((entry) => entry.type === "Cutting Policy" && entry.name === policy.name);\n  if (!fixture) {\n    fixture = { type: "Cutting Policy", name: policy.name, data: {} };\n    brief.fixtures.push(fixture);\n  }\n  Object.assign(fixture.data, cuttingPolicyFixtureData(policy));\n}`;
          if (!text.includes(before)) throw new Error('canonical Cutting Policy fixture loop not found');
          text = text.replace(before, after);
          fs.writeFileSync(path, text, 'utf8');
          NODE
      - name: Prove builder can regenerate current brief
        working-directory: server
        run: node scripts/build-alumdoor-v2-brief.mjs
      - name: Verify canonical policy exists in generated brief
        working-directory: server
        run: |
          node <<'NODE'
          const fs = require('fs');
          const brief = JSON.parse(fs.readFileSync('briefs/alumdoor-v2.json', 'utf8'));
          const fixture = brief.fixtures.find((row) => row.type === 'Cutting Policy' && row.name === 'Cửa tấm liền Úc — công thức chuẩn');
          if (!fixture) throw new Error('canonical Cửa tấm liền Úc fixture still missing');
          if (!fixture.data?.geometry_profile) throw new Error('canonical fixture missing geometry_profile');
          NODE
      - name: Commit builder fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-fix-alumdoor-v2-builder-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/scripts/build-alumdoor-v2-brief.mjs server/briefs/alumdoor-v2.json .github/workflows/_tmp-fix-alumdoor-v2-builder-fixture.yml
          git commit -m 'fix(alumdoor): regenerate missing canonical policy fixtures'
          git push origin HEAD:agent/alumdoor-bom-template-resolver
