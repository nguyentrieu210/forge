name: Runtime Gap Validation Once

on:
  push:
    branches:
      - chatgpt/runtime-ui-gap-fixes
    paths:
      - "client/packages/views/**"
      - "client/packages/controls/**"
      - "client/packages/shell/**"
      - "client/apps/runtime/**"
      - ".github/workflows/runtime-gap-validation-once.yml"

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-gap-validation-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runtime-ui-gap-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared client dependencies
        run: |
          pnpm --filter @metaforge/core run build
          pnpm --filter @metaforge/adapter-frappe run build
          pnpm --filter @metaforge/visual run build
          pnpm --filter @metaforge/charts run build
          pnpm --filter @metaforge/ui run build
          pnpm --filter @metaforge/controls run build
          pnpm --filter @metaforge/shell run build
      - name: Typecheck shared views
        run: pnpm --filter @metaforge/views run typecheck
      - name: Build production runtime
        run: pnpm --filter runtime run build
      - name: Retire temporary validation workflow
        run: |
          git rm .github/workflows/runtime-gap-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(runtime): retire one-shot validation [runtime-gap-validation-cleanup]"
          git push origin HEAD:chatgpt/runtime-ui-gap-fixes
