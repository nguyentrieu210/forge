name: Customer Import Canonicalize Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/customer-import-canonicalize-once.yml"

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.head_ref == 'customer-import-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require Customer price_group in canonical brief
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'server/briefs/alumdoor.json';
          const source = fs.readFileSync(file, 'utf8');
          const before = `          "fieldname": "price_group",\n          "fieldtype": "Select",\n          "options": "Đại lý\\nLẻ",\n          "label": "Nhóm giá",\n          "in_list_view": true,`;
          const after = `          "fieldname": "price_group",\n          "fieldtype": "Select",\n          "options": "Đại lý\\nLẻ",\n          "label": "Nhóm giá",\n          "required": true,\n          "in_list_view": true,`;
          const occurrences = source.split(before).length - 1;
          if (occurrences !== 1) throw new Error(`Expected exactly one canonical Customer.price_group target, found ${occurrences}`);
          const next = source.replace(before, after);
          const brief = JSON.parse(next);
          const customer = brief.doctypes.find((row) => row.name === 'Customer');
          const field = customer?.fields?.find((row) => row && typeof row === 'object' && row.fieldname === 'price_group');
          if (!field) throw new Error('Customer.price_group missing after patch');
          if (field.required !== true) throw new Error('Customer.price_group must be required');
          if (field.options !== 'Đại lý\nLẻ') throw new Error(`Unexpected Customer.price_group options: ${field.options}`);
          if (Object.prototype.hasOwnProperty.call(field, 'default')) throw new Error('Customer.price_group must not have a default');
          fs.writeFileSync(file, next, 'utf8');
          console.log('CUSTOMER_PRICE_GROUP_CANONICAL_PASS');
          NODE

      - name: Commit canonical source and remove one-shot workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git rm .github/workflows/customer-import-canonicalize-once.yml
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add server/briefs/alumdoor.json
          git diff --cached --check
          git commit -m "fix(alumdoor): require customer price group"
          git push origin "HEAD:${HEAD_BRANCH}"
