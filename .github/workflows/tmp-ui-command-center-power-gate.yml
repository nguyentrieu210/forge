name: Temp UI Command Center Power Finalize

on:
  push:
    branches:
      - ui/metaforge-command-center-power-20260803
    paths:
      - ".github/workflows/tmp-ui-command-center-power-gate.yml"

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/metaforge-command-center-power-20260803
          fetch-depth: 0

      - name: Mark finalization started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -nc --arg state pending --arg context "ui-command-center-power-finalize" --arg description "applying verified power layer and cleaning temporary files" '{state:$state,context:$context,description:$description}')
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Apply verified power layer
        run: |
          set -euo pipefail
          python scripts/tmp-apply-command-center-power.py
          grep -q "METAFORGE COMMAND CENTER · POWER VISUAL LAYER" client/packages/ui/src/styles.css
          test -z "$(git diff -- client/packages/shell/src/auth/LoginForm.tsx)"

      - name: Commit clean UI-only diff
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-ui-command-center-power.yml
          rm -f .github/workflows/tmp-ui-command-center-power-gate.yml
          rm -f .github/workflows/tmp-ui-command-center-power-pr-v2.yml
          rm -f scripts/tmp-apply-command-center-power.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -z "$(git diff --cached --name-only | grep -v '^client/packages/ui/src/styles.css$' || true)"
          git commit -m "feat(ui): power up MetaForge command center visuals"
          git push origin HEAD:ui/metaforge-command-center-power-20260803

      - name: Publish clean-head success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          payload=$(jq -nc --arg state success --arg context "ui-command-center-power" --arg description "runtime build + browser visual gate passed; Alumdoor login untouched" '{state:$state,context:$context,description:$description}')
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${sha}" -d "$payload" >/dev/null
