name: Actions Smoke Test

on:
  push:
    paths:
      - ".github/workflows/actions-smoke-test.yml"

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    name: GitHub-hosted runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner started
        run: |
          echo "RUNNER_OK"
          uname -a
      - name: Mark smoke status success
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d '{"state":"success","context":"actions-smoke-test","description":"GitHub-hosted runner executed successfully"}' >/dev/null
