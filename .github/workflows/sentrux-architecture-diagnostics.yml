name: Sentrux architecture diagnostics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Sentrux
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Evaluate committed architecture rules
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          test -f .sentrux/rules.toml
          set +e
          sentrux check . 2>&1 | tee /tmp/committed-check.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo '=== COMMITTED POLICY SUMMARY ==='
          grep -Ei 'Quality:|resolve\]|boundary|circular|cycle|god file|cyclomatic|complexity|coupling|depth|modular|redundan|violation' /tmp/committed-check.txt || true
          exit 0

      - name: Capture quality signal
        shell: bash
        run: |
          set -euo pipefail
          set +e
          sentrux gate --save . 2>&1 | tee /tmp/gate.txt
          status=${PIPESTATUS[0]}
          set -e
          grep -E 'Quality:|\[resolve\]' /tmp/gate.txt || true
          echo "GATE_EXIT=$status"

      - name: Strict architecture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp .sentrux/rules.toml /tmp/forge-rules.toml
          trap 'mv /tmp/forge-rules.toml .sentrux/rules.toml' EXIT
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          max_cc = 25

          [[boundaries]]
          from = "client/**/*"
          to = "server/**/*"
          reason = "Track remaining frontend-to-server implementation dependency debt"
          EOF

          set +e
          sentrux check . 2>&1 | tee /tmp/strict-check.txt
          status=${PIPESTATUS[0]}
          set -e

          echo '=== STRICT DIAGNOSTICS (NON-BLOCKING) ==='
          grep -Ei 'Quality:|resolve\]|boundary|circular|cycle|god file|cyclomatic|complexity|coupling|depth|modular|redundan|violation' /tmp/strict-check.txt || true
          echo "STRICT_CHECK_EXIT=$status"

      - name: Enforce committed policy result
        if: always()
        env:
          POLICY_STATUS: ${{ steps.policy.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "${POLICY_STATUS:-1}" -eq 0
