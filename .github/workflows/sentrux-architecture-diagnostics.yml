name: Sentrux architecture diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Sentrux
        run: |
          set -euo pipefail
          curl -L -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Enforce committed architecture rules
        shell: bash
        run: |
          set -euo pipefail
          test -f .sentrux/rules.toml
          sentrux check .

      - name: Capture quality signal
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/gate.txt
          grep -E 'Quality:' /tmp/gate.txt || true

      - name: Strict architecture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp .sentrux/rules.toml /tmp/forge-rules.toml
          cat > .sentrux/rules.toml <<'EOF'
          [constraints]
          max_cycles = 0
          no_god_files = true
          max_cc = 25

          [[boundaries]]
          from = "client/**/*"
          to = "server/**/*"
          reason = "Track remaining frontend-to-server implementation dependency debt"
          EOF

          set +e
          sentrux check . 2>&1 | tee /tmp/strict-check.txt
          status=${PIPESTATUS[0]}
          set -e

          mv /tmp/forge-rules.toml .sentrux/rules.toml

          echo '=== STRICT DIAGNOSTICS (NON-BLOCKING) ==='
          grep -Ei 'boundary|circular|cycle|god file|cyclomatic|complexity|coupling|depth|modular|redundan' /tmp/strict-check.txt || true
          echo "STRICT_CHECK_EXIT=$status"
          exit 0
