name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 15
    steps:
      - name: Inspect four remaining local failures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor

          function Show-Range($path, $from, $to) {
            Write-Host "`n--- $path [$from..$to] ---"
            $lines = Get-Content $path
            for ($i=$from; $i -le $to -and $i -le $lines.Length; $i++) {
              Write-Host ("{0,5}: {1}" -f $i, $lines[$i-1])
            }
          }

          Show-Range 'server/apps/tenant-worker/test/frappe-facade.integration.test.mts' 590 630
          Show-Range 'server/apps/tenant-worker/test/frappe-facade.integration.test.mts' 770 805
          Show-Range 'server/apps/tenant-worker/test/frappe-facade.integration.test.mts' 1040 1085
          Show-Range 'server/apps/tenant-worker/test/frappe-facade.integration.test.mts' 1690 1745

          Write-Host "`n=== SHARE IMPLEMENTATION MATCHES ==="
          Get-ChildItem server\packages,server\apps -Recurse -File -Include *.ts,*.mts,*.mjs |
            Select-String -Pattern 'frappe\.share\.add|share\.add|Storage operation failed|document_shares' |
            Select-Object -First 100 Path,LineNumber,Line | Format-Table -Wrap

          Write-Host "`n=== REPORT VALIDATION MATCHES ==="
          Get-ChildItem server\packages -Recurse -File -Include *.ts,*.mts |
            Select-String -Pattern 'Filter .*not allowed|filter.*whitelist|report_name|run_report' |
            Select-Object -First 120 Path,LineNumber,Line | Format-Table -Wrap

          Write-Host "`n=== NOTIFICATION AUTH MATCHES ==="
          Get-ChildItem server\packages,server\apps -Recurse -File -Include *.ts,*.mts,*.mjs |
            Select-String -Pattern 'NOTIFICATION_RECIPIENT_NOT_AUTHORIZED|notifications\.delivered|notification rule|recipient' |
            Select-Object -First 120 Path,LineNumber,Line | Format-Table -Wrap

          Write-Host "`n=== PACKAGE/APP OBJECT MATCHES ==="
          Get-ChildItem server\packages,server\apps -Recurse -File -Include *.ts,*.mts,*.mjs |
            Select-String -Pattern 'app_objects|fixture|objects\.length|doctypes\.length' |
            Select-Object -First 120 Path,LineNumber,Line | Format-Table -Wrap
