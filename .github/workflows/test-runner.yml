name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 5
    steps:
      - name: Switch dirty local worktree to pricing experiment branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'exp/alumdoor-pricing-policy'

          Write-Host '=== BEFORE ==='
          git rev-parse HEAD
          git branch --show-current
          git status --short --branch

          $exists = git branch --list $target
          if ([string]::IsNullOrWhiteSpace(($exists -join ''))) {
            git switch -c $target
          } else {
            git switch $target
          }

          Write-Host '=== AFTER ==='
          $head = git rev-parse HEAD
          $branch = git branch --show-current
          Write-Host "HEAD=$head"
          Write-Host "BRANCH=$branch"
          git status --short --branch

          if ($branch -ne $target) { throw "Local branch switch failed: $branch" }
          Write-Host 'LOCAL_EXPERIMENT_BRANCH_READY'
