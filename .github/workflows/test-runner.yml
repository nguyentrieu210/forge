name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/test-runner.yml"]

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 25
    steps:
      - name: Sync and verify attendance payroll branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'feature/attendance-payroll'
          $branch = (git branch --show-current).Trim()
          if ($branch -ne $target) { throw "Expected $target but found $branch" }
          $tracked = git status --porcelain --untracked-files=no
          if ($tracked) { throw "Tracked local changes exist; refusing to overwrite:`n$tracked" }

          git fetch origin $target --prune
          git merge --ff-only "origin/$target"
          Write-Host "LOCAL_HEAD=$((git rev-parse HEAD).Trim())"
          Write-Host "REMOTE_HEAD=$((git rev-parse origin/$target).Trim())"

          Push-Location server
          npm run build
          node scripts/pack-app.mjs apps-src/alumdoor-attendance --check
          $tests = Get-ChildItem tests -File | Where-Object { $_.Name -like 'alumdoor-attendance*.test.mjs' -or $_.Name -like 'alumdoor-payroll*.test.mjs' } | ForEach-Object { $_.FullName }
          node --test $tests
          Pop-Location

          Write-Host "STATUS_BEGIN"
          git status --short --untracked-files=all
          Write-Host "STATUS_END"
          Write-Host 'ATTENDANCE_PAYROLL_BACKEND_VERIFY_OK'
