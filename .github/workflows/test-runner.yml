name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 15
    steps:
      - name: Verify experiment checkout is untouched
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          if ((git branch --show-current) -ne 'exp/alumdoor-pricing-policy') { throw 'Wrong local branch' }
          $status = @(git status --porcelain --untracked-files=all)
          $unsafe = @($status | Where-Object { $_ -notmatch '^\?\? \.pricing-policy-backups/' })
          if ($unsafe.Count -gt 0) {
            $unsafe | ForEach-Object { Write-Host $_ }
            throw 'Local working tree has non-backup changes; refusing to continue'
          }
          Write-Host "LOCAL_COMMIT=$(git rev-parse HEAD)"

      - name: Patch generator and regenerate metadata in disposable clone
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'forge-alumdoor-presentation-migrate'
          if (Test-Path $probe) { Remove-Item -Recurse -Force $probe }
          git clone --quiet --branch exp/alumdoor-pricing-policy https://github.com/nguyentrieu210/forge.git $probe
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          Set-Location $probe
          git config user.name "Alumdoor Migration Runner"
          git config user.email "alumdoor-migration@local.invalid"

          @'
          import fs from "node:fs";
          const path = "server/scripts/build-alumdoor-v2-brief.mjs";
          let source = fs.readFileSync(path, "utf8");
          const importLine = 'import { applyAlumdoorChildPresentation } from "./lib/alumdoor-child-presentation.mjs";';
          if (!source.includes(importLine)) {
            source = source.replace(
              'import { dirname, resolve } from "node:path";\n',
              'import { dirname, resolve } from "node:path";\n' + importLine + '\n',
            );
          }
          const marker = 'const childPresentation = applyAlumdoorChildPresentation(brief);';
          if (!source.includes(marker)) {
            source = source.replace(
              '\nwriteFileSync(OUT, JSON.stringify(brief, null, 1) + "\\n", "utf8");',
              '\nconst childPresentation = applyAlumdoorChildPresentation(brief);\n'
                + 'note(`UI · child-grid presentation metadata: ${childPresentation.migrated} child DocType`);\n\n'
                + 'writeFileSync(OUT, JSON.stringify(brief, null, 1) + "\\n", "utf8");',
            );
          }
          if (!source.includes(importLine) || !source.includes(marker)) throw new Error("builder patch did not apply");
          fs.writeFileSync(path, source);
          '@ | node --input-type=module

          Set-Location server
          node scripts/build-alumdoor-v2-brief.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Alumdoor V2 brief regeneration failed' }
          node --test tests/alumdoor-child-presentation.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Alumdoor child presentation contract failed' }

          @'
          import fs from "node:fs";
          import { compileBrief } from "./scripts/lib/compile-brief.mjs";
          import { attachBriefUiViewPolicies } from "./scripts/lib/brief-ui-view-policy.mjs";
          const brief = JSON.parse(fs.readFileSync("briefs/alumdoor-v2.json", "utf8"));
          const pkg = attachBriefUiViewPolicies(brief, compileBrief(brief));
          const children = pkg.doctypes.filter((dt) => dt.is_child === true);
          console.log(`COMPILED_CHILD_DOCTYPES=${children.length}`);
          for (const name of ["Quotation Item","Sales Order Item","Purchase Order Item","Purchase Receipt Item","Delivery Note Item","Sales Invoice Item","Stock Entry Detail","Production Request Item","Work Order Item"]) {
            const dt = children.find((value) => value.name === name);
            if (!dt) throw new Error(`missing ${name}`);
            console.log(`${name} QUICK=${(dt.viewPolicy?.quickEntry?.fields ?? []).join("|")}`);
            console.log(`${name} FULL=${(dt.viewPolicy?.form?.fields ?? []).join("|")}`);
          }
          '@ | node --input-type=module

          Set-Location ..
          git status --short
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          git add server/scripts/build-alumdoor-v2-brief.mjs server/briefs/alumdoor-v2.json
          git commit -m "feat(meta): migrate Alumdoor child grids to presentation surfaces"
          if ($LASTEXITCODE -ne 0) { throw 'migration commit failed' }
          git push origin HEAD:exp/alumdoor-pricing-policy
          if ($LASTEXITCODE -ne 0) { throw 'migration push failed' }
          Write-Host "MIGRATION_COMMIT=$(git rev-parse HEAD)"
          Set-Location $env:RUNNER_TEMP
          Remove-Item -Recurse -Force $probe

# migrate-child-presentation-v3