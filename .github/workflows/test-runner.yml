name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 15
    steps:
      - name: Run reviewable real-data pricing lab
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'exp/alumdoor-pricing-policy'
          if ((git branch --show-current) -ne $target) { throw 'Wrong local branch' }
          $status = @(git status --porcelain --untracked-files=all)
          $unsafe = @($status | Where-Object { $_ -notmatch '^\?\? \.pricing-policy-backups/' })
          if ($unsafe.Count -gt 0) {
            $unsafe | ForEach-Object { Write-Host $_ }
            throw 'Local working tree has non-backup changes; refusing to sync'
          }
          git fetch origin $target
          git merge --ff-only "origin/$target"
          if ($LASTEXITCODE -ne 0) { throw 'Fast-forward sync failed' }

          $d1Root = 'C:\alumdoor\server\apps\tenant-worker\.wrangler\state\v3\d1\miniflare-D1DatabaseObject'
          $sourceDb = Get-ChildItem $d1Root -File -ErrorAction Stop |
            Where-Object { $_.Extension -eq '.sqlite' -and $_.Name -ne 'metadata.sqlite' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (!$sourceDb) { throw 'Local D1 sqlite file not found' }

          $labRoot = 'C:\ForgePricingLab'
          New-Item -ItemType Directory -Force -Path $labRoot | Out-Null
          $labDb = Join-Path $labRoot 'alumdoor-real-pricing.sqlite'
          Copy-Item $sourceDb.FullName $labDb -Force
          Write-Host "LAB_DB=$labDb source=$($sourceDb.FullName) bytes=$($sourceDb.Length)"

          Set-Location C:\alumdoor\server
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw 'Server build failed' }
          $env:LAB_DB = $labDb
          node scripts/test-alumdoor-pricing-real-data.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real-data pricing lab failed' }

          Write-Host 'REAL_DATA_PRICING_LAB_VERIFIED'
