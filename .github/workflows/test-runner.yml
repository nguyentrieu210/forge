name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 10
    steps:
      - name: Verify experiment checkout is untouched
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          if ((git branch --show-current) -ne 'exp/alumdoor-pricing-policy') { throw 'Wrong local branch' }
          $status = @(git status --porcelain --untracked-files=all)
          $unsafe = @($status | Where-Object { $_ -notmatch '^\?\? \.pricing-policy-backups/' })
          if ($unsafe.Count -gt 0) {
            $unsafe | ForEach-Object { Write-Host $_ }
            throw 'Local working tree has non-backup changes; refusing to continue'
          }
          git fetch origin exp/alumdoor-pricing-policy
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch pricing experiment' }
          git merge --ff-only origin/exp/alumdoor-pricing-policy
          if ($LASTEXITCODE -ne 0) { throw 'Local experiment branch cannot fast-forward safely' }
          Write-Host "TESTING_COMMIT=$(git rev-parse HEAD)"

      - name: Probe push auth in disposable clone only
        shell: cmd
        run: |
          @echo off
          set PROBE=%RUNNER_TEMP%\forge-push-probe
          if exist "%PROBE%" rmdir /s /q "%PROBE%"
          git clone --quiet --branch exp/alumdoor-pricing-policy https://github.com/nguyentrieu210/forge.git "%PROBE%" || exit /b 1
          git -C "%PROBE%" config user.name "Alumdoor Runner Probe"
          git -C "%PROBE%" config user.email "runner-probe@local.invalid"
          git -C "%PROBE%" commit --allow-empty -m "ci: disposable push auth probe" >nul || exit /b 1
          git -C "%PROBE%" push --dry-run origin HEAD:exp/alumdoor-pricing-policy
          if errorlevel 1 (
            echo RUNNER_PUSH_CAPABLE=0
            rmdir /s /q "%PROBE%"
            exit /b 0
          )
          echo RUNNER_PUSH_CAPABLE=1
          rmdir /s /q "%PROBE%"

# disposable-push-probe