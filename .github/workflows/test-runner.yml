name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/test-runner.yml"]

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 5
    steps:
      - name: Verify persistent local Forge server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $expected = 'local/manufacturing-20260811'
          $branch = (git branch --show-current).Trim()
          if ($branch -ne $expected) { throw "Expected $expected but found $branch" }

          $workerOk = $false
          try {
            $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8799/api/method/metaforge.api.get_boot' -TimeoutSec 3 -ErrorAction Stop
            if ($r.StatusCode -eq 403) { $workerOk = $true }
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 403) { $workerOk = $true }
          }
          if (-not $workerOk) { throw 'Backend 8799 is not alive after prior job cleanup' }

          $desk = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5173/' -TimeoutSec 3 -ErrorAction Stop
          if ($desk.StatusCode -lt 200 -or $desk.StatusCode -ge 500) { throw "Desk returned $($desk.StatusCode)" }

          Write-Host "LOCAL_BRANCH=$branch"
          Write-Host "LOCAL_HEAD=$((git rev-parse HEAD).Trim())"
          Write-Host "BACKEND_STATUS=403_READY"
          Write-Host "DESK_STATUS=$($desk.StatusCode)"
          Write-Host 'FORGE_LOCAL_SERVER_PERSISTENT_READY'
