name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/test-runner.yml"]

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 35
    steps:
      - name: Verify local experiment checkout is safe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          if ((git branch --show-current) -ne 'exp/alumdoor-pricing-policy') { throw 'Wrong local branch' }
          $status = @(git status --porcelain --untracked-files=all)
          $unsafe = @($status | Where-Object { $_ -notmatch '^\?\? \.pricing-policy-backups/' })
          if ($unsafe.Count -gt 0) { $unsafe | ForEach-Object { Write-Host $_ }; throw 'Unsafe local changes' }

      - name: Patch preview contract in disposable clone
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'forge-row-preview-wire'
          if (Test-Path $probe) { cmd /c "rmdir /s /q `"$probe`"" }
          git clone --quiet --branch exp/alumdoor-pricing-policy https://github.com/nguyentrieu210/forge.git $probe
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          Set-Location $probe
          git config user.name "Alumdoor Preview Runner"
          git config user.email "alumdoor-preview@local.invalid"

          @'
          import fs from "node:fs";
          function edit(path, transform) {
            const before = fs.readFileSync(path, "utf8");
            const after = transform(before);
            if (after === before) throw new Error(`no patch applied to ${path}`);
            fs.writeFileSync(path, after);
          }
          edit("server/packages/frappe-model/src/types.ts", (s) => s.replace(
            "  reasonRequiredOn?: string[];\n}",
            "  reasonRequiredOn?: string[];\n  /** Optional app method that derives a child-row UX preview; save/submit remain authoritative. */\n  previewMethod?: string;\n  /** Parent fields whose changes invalidate the row preview. */\n  previewParentFields?: string[];\n}",
          ));
          edit("client/packages/core/src/types/meta.ts", (s) => s.replace(
            "  reasonRequiredOn?: string[];\n  [k: string]: unknown;",
            "  reasonRequiredOn?: string[];\n  /** Dotted app method used for server-owned child-row preview. */\n  previewMethod?: string;\n  /** Parent fields whose changes trigger row preview refresh. */\n  previewParentFields?: string[];\n  [k: string]: unknown;",
          ));
          edit("server/packages/frappe-model/src/validate.ts", (s) => {
            const anchor = `    const reasonRequiredOn = entry.reasonRequiredOn === undefined\n      ? undefined\n      : array(entry.reasonRequiredOn, \`viewPolicy.\${key}.reasonRequiredOn\`).map((item, index) =>\n          text(item, \`viewPolicy.\${key}.reasonRequiredOn[\${index}]\`, 80));\n`;
            if (!s.includes(anchor)) throw new Error("validate preview anchor missing");
            s = s.replace(anchor, anchor + `    const previewMethod = entry.previewMethod === undefined\n      ? undefined\n      : text(entry.previewMethod, \`viewPolicy.\${key}.previewMethod\`, 240);\n    const previewParentFields = entry.previewParentFields === undefined\n      ? undefined\n      : array(entry.previewParentFields, \`viewPolicy.\${key}.previewParentFields\`).map((item, index) =>\n          text(item, \`viewPolicy.\${key}.previewParentFields[\${index}]\`, 160));\n`);
            const ret = "      ...(reasonRequiredOn ? { reasonRequiredOn } : {}),\n";
            if (!s.includes(ret)) throw new Error("validate return anchor missing");
            return s.replace(ret, ret + "      ...(previewMethod ? { previewMethod } : {}),\n      ...(previewParentFields ? { previewParentFields } : {}),\n");
          });
          edit("server/apps-src/alumdoor-worker/src/index.ts", (s) => {
            const importAnchor = 'import { salesItemContext } from "./sales-item-context.js";\n';
            const dispatchAnchor = '    if (method === "alumdoor.sales.item_context") return await salesItemContext(call, args);\n';
            if (!s.includes(importAnchor) || !s.includes(dispatchAnchor)) throw new Error("worker anchors missing");
            s = s.replace(importAnchor, importAnchor + 'import { previewChildRow } from "./ui-child-preview.js";\n');
            return s.replace(dispatchAnchor, dispatchAnchor + '    if (method === "alumdoor.ui.preview_child_row") return await previewChildRow(call, args);\n');
          });
          '@ | node --input-type=module

          Set-Location server
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'server install failed' }
          node scripts/build-alumdoor-v2-brief.mjs
          if ($LASTEXITCODE -ne 0) { throw 'brief regeneration failed' }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }
          node --test tests/alumdoor-child-presentation.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'presentation contract failed' }
          pnpm run brief:check
          if ($LASTEXITCODE -ne 0) { throw 'brief check failed' }
          pnpm exec vitest run apps-src/alumdoor-worker/src/ui-child-preview.test.ts --environment node
          if ($LASTEXITCODE -ne 0) { throw 'worker preview tests failed' }
          $bundle = Join-Path $env:RUNNER_TEMP 'alumdoor-worker-preview-bundle'
          if (Test-Path $bundle) { cmd /c "rmdir /s /q `"$bundle`"" }
          pnpm exec wrangler deploy --dry-run --config apps-src/alumdoor-worker/wrangler.purchase-qa.jsonc --outdir $bundle
          if ($LASTEXITCODE -ne 0) { throw 'worker dry-run bundle failed' }

          Set-Location ..\client
          pnpm install --no-frozen-lockfile --lockfile=false
          if ($LASTEXITCODE -ne 0) { throw 'client dependency bootstrap failed' }
          pnpm --filter @metaforge/views run build
          if ($LASTEXITCODE -ne 0) { throw 'views build failed' }
          Set-Location packages\views
          node --test tests/child-grid-presentation.test.mjs tests/metadata-child-grid-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'metadata grid tests failed' }

          Set-Location $probe
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          git add server/packages/frappe-model/src/types.ts client/packages/core/src/types/meta.ts server/packages/frappe-model/src/validate.ts server/apps-src/alumdoor-worker/src/index.ts server/briefs/alumdoor-v2.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'expected preview wiring changes are missing' }
          git commit -m "feat(meta): wire server-owned child row preview"
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:exp/alumdoor-pricing-policy
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
          Write-Host "PREVIEW_WIRING_COMMIT=$(git rev-parse HEAD)"
          Write-Host 'ALUMDOOR_CHILD_ROW_PREVIEW_WIRING_PASS'
          Set-Location $env:RUNNER_TEMP
          cmd /c "rmdir /s /q `"$probe`"" >nul 2>nul

# child-row-preview-wire-v2