name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 30
    steps:
      - name: Verify experiment checkout is untouched
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          if ((git branch --show-current) -ne 'exp/alumdoor-pricing-policy') { throw 'Wrong local branch' }
          $status = @(git status --porcelain --untracked-files=all)
          $unsafe = @($status | Where-Object { $_ -notmatch '^\?\? \.pricing-policy-backups/' })
          if ($unsafe.Count -gt 0) { $unsafe | ForEach-Object { Write-Host $_ }; throw 'Unsafe local changes' }

      - name: Regenerate and push metadata from disposable clone
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'forge-alumdoor-presentation-fix'
          if (Test-Path $probe) { Remove-Item -Recurse -Force $probe }
          git clone --quiet --branch exp/alumdoor-pricing-policy https://github.com/nguyentrieu210/forge.git $probe
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          Set-Location $probe
          git config user.name "Alumdoor Migration Runner"
          git config user.email "alumdoor-migration@local.invalid"
          Set-Location server
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'server dependency bootstrap failed' }
          node scripts/build-alumdoor-v2-brief.mjs
          if ($LASTEXITCODE -ne 0) { throw 'brief regeneration failed' }
          node --test tests/alumdoor-child-presentation.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'presentation tests failed' }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }
          pnpm run brief:check
          if ($LASTEXITCODE -ne 0) { throw 'brief check failed' }
          Set-Location ..
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          git add server/briefs/alumdoor-v2.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No generated metadata change required'
          } else {
            git commit -m "fix(meta): preserve editable fields outside grid views"
            if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
            git push origin HEAD:exp/alumdoor-pricing-policy
            if ($LASTEXITCODE -ne 0) { throw 'push failed' }
            Write-Host "REGENERATED_COMMIT=$(git rev-parse HEAD)"
          }
          Set-Location $env:RUNNER_TEMP
          Remove-Item -Recurse -Force $probe

# regenerate-surface-semantics-v4