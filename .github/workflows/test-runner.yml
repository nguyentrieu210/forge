name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 5
    steps:
      - name: Verify local pricing experiment branch tracks remote
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'exp/alumdoor-pricing-policy'

          $branch = git branch --show-current
          if ($branch -ne $target) { throw "Unexpected local branch: $branch" }

          git fetch origin $target
          $local = git rev-parse HEAD
          $remote = git rev-parse "origin/$target"
          Write-Host "LOCAL_HEAD=$local"
          Write-Host "REMOTE_HEAD=$remote"

          if ($local -ne $remote) { throw "Local and remote experiment branches differ; refusing to reset or rewrite" }

          git branch --set-upstream-to="origin/$target" $target
          git status --short --branch
          Write-Host 'EXPERIMENT_BRANCH_TRACKING_OK'
