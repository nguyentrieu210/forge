name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 15
    steps:
      - name: Inspect owner contracts for remaining failures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          function Show-Range($path, $from, $to) {
            Write-Host "`n--- $path [$from..$to] ---"
            $lines = Get-Content $path
            for ($i=$from; $i -le $to -and $i -le $lines.Length; $i++) {
              Write-Host ("{0,5}: {1}" -f $i, $lines[$i-1])
            }
          }

          Show-Range 'server/apps/tenant-worker/test/frappe-facade.integration.test.mts' 1 180
          Show-Range 'server/packages/frappe-api/src/router.ts' 1015 1055
          Show-Range 'server/packages/frappe-model/src/services.ts' 145 240
          Show-Range 'server/packages/frappe-api/src/router.ts' 2920 2995
          Show-Range 'server/packages/frappe-api/src/notification-runner.ts' 88 130
          Show-Range 'server/packages/frappe-model/src/services.ts' 80 115
          Show-Range 'server/packages/app-registry/src/installer.ts' 500 545

          Write-Host "`n=== document_shares schema ==="
          Get-ChildItem server\migrations -Recurse -File -Include *.sql |
            Select-String -Pattern 'CREATE TABLE.*document_shares|document_shares\(' -Context 2,8 |
            Select-Object -First 80 | ForEach-Object { $_.ToString() }
