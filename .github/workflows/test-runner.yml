name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 15
    steps:
      - name: Sync and test pricing experiment locally
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'exp/alumdoor-pricing-policy'
          if ((git branch --show-current) -ne $target) { throw 'Wrong local branch' }
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host $dirty
            throw 'Local working tree is dirty; refusing to overwrite or reset'
          }
          git fetch origin $target
          git merge --ff-only "origin/$target"
          if ($LASTEXITCODE -ne 0) { throw 'Fast-forward sync failed' }
          Write-Host "LOCAL_HEAD=$(git rev-parse HEAD)"

          Set-Location C:\alumdoor\server
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw 'Server build failed' }

          node --test tests/alumdoor-adjustment-policy.test.mjs tests/alumdoor-discount-policy.test.mjs tests/sales-uom-pricing.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Targeted pricing tests failed' }

          Write-Host 'PRICING_EXPERIMENT_TARGETED_PASS'
