name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 10
    steps:
      - name: Verify experiment checkout is untouched
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          if ((git branch --show-current) -ne 'exp/alumdoor-pricing-policy') { throw 'Wrong local branch' }
          $status = @(git status --porcelain --untracked-files=all)
          $unsafe = @($status | Where-Object { $_ -notmatch '^\?\? \.pricing-policy-backups/' })
          if ($unsafe.Count -gt 0) {
            $unsafe | ForEach-Object { Write-Host $_ }
            throw 'Local working tree has non-backup changes; refusing to continue'
          }
          Write-Host "LOCAL_COMMIT=$(git rev-parse HEAD)"

      - name: Inspect presentation metadata compiler contract in disposable clone
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'forge-view-policy-probe'
          if (Test-Path $probe) { Remove-Item -Recurse -Force $probe }
          git clone --quiet --branch exp/alumdoor-pricing-policy https://github.com/nguyentrieu210/forge.git $probe
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          Set-Location $probe
          Write-Host '=== VIEW POLICY REFERENCES ==='
          git grep -n -I -E 'viewPolicy|view_policy' -- server client | Select-Object -First 120 | ForEach-Object { Write-Host $_ }
          Write-Host '=== BRIEF EXAMPLES ==='
          @'
          import fs from "node:fs";
          import path from "node:path";
          const dir = "server/briefs";
          for (const name of fs.readdirSync(dir).filter((x) => x.endsWith(".json"))) {
            const p = path.join(dir, name);
            const value = JSON.parse(fs.readFileSync(p, "utf8"));
            const dts = Array.isArray(value.doctypes) ? value.doctypes : Object.values(value.doctypes ?? {});
            const hits = dts.filter((dt) => dt?.viewPolicy || dt?.view_policy);
            if (hits.length) console.log(`${name}: ${hits.slice(0,8).map((dt) => dt.name).join("|")}`);
          }
          '@ | node --input-type=module
          Set-Location $env:RUNNER_TEMP
          Remove-Item -Recurse -Force $probe

# inspect-view-policy-contract