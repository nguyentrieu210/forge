name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 30
    steps:
      - name: Apply row-scoped discount fix and run selfcheck
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $path = 'client/packages/views/src/form/ChildGrid.tsx'
          $full = (Resolve-Path $path)
          $text = [IO.File]::ReadAllText($full)

          $anchor = @'
              const DiscountControl = discountColumn ? registry.resolve(discountColumn.fieldtype) ?? FallbackControl : null;
              const DiscountAmountControl = discountAmountColumn ? registry.resolve(discountAmountColumn.fieldtype) ?? FallbackControl : null;
              const rateNeedsApproval = childMeta.name === "Sales Order Item" && row.rate_requires_approval === true;
'@
          $replacement = @'
              const DiscountControl = discountColumn ? registry.resolve(discountColumn.fieldtype) ?? FallbackControl : null;
              const DiscountAmountControl = discountAmountColumn ? registry.resolve(discountAmountColumn.fieldtype) ?? FallbackControl : null;
              // The sales grid renders discount on a dedicated row, but it must still obey
              // the same row-scoped metadata contract as every ordinary child-grid cell.
              const discountField = discountColumn
                ? fieldForRow(discountColumn.list_only ? { ...discountColumn, list_only: 0 } : discountColumn, row)
                : undefined;
              const resolvedDiscount = discountField
                ? resolveField(discountField, childMeta, { doc: row, parent: parentDoc, roles, assumeWritable: true })
                : undefined;
              const rateNeedsApproval = childMeta.name === "Sales Order Item" && row.rate_requires_approval === true;
'@
          if ($text.Contains($anchor)) {
            $text = $text.Replace($anchor, $replacement)
          } elseif (-not $text.Contains('const resolvedDiscount = discountField')) {
            throw 'discount resolver anchor not found; local file diverged'
          }

          $oldCondition = '              {discountColumn && discountAmountColumn && DiscountControl && DiscountAmountControl ? ('
          $newCondition = '              {discountColumn && discountAmountColumn && DiscountControl && DiscountAmountControl && resolvedDiscount?.visible ? ('
          if ($text.Contains($oldCondition)) {
            $text = $text.Replace($oldCondition, $newCondition)
          } elseif (-not $text.Contains($newCondition)) {
            throw 'discount row condition anchor not found'
          }

          $oldField = '                      field={fieldForRow(discountColumn.list_only ? { ...discountColumn, list_only: 0 } : discountColumn, row)}'
          $newField = '                      field={discountField!}'
          if ($text.Contains($oldField)) {
            $text = $text.Replace($oldField, $newField)
          } elseif (-not $text.Contains($newField)) {
            throw 'discount field anchor not found'
          }

          $discountAt = $text.IndexOf('                    <DiscountControl')
          if ($discountAt -lt 0) { throw 'DiscountControl block not found' }
          $oldReadOnly = '                      readOnly={readOnly}'
          $newReadOnly = "                      readOnly={readOnly || Boolean(resolvedDiscount?.readOnly)}`r`n                      masked={resolvedDiscount?.masked}"
          $readOnlyAt = $text.IndexOf($oldReadOnly, $discountAt)
          if ($readOnlyAt -ge 0) {
            $text = $text.Remove($readOnlyAt, $oldReadOnly.Length).Insert($readOnlyAt, $newReadOnly)
          } elseif (-not $text.Contains('readOnly={readOnly || Boolean(resolvedDiscount?.readOnly)}')) {
            throw 'DiscountControl readOnly anchor not found'
          }

          [IO.File]::WriteAllText($full, $text, [Text.UTF8Encoding]::new($false))

          Write-Host '=== PATCH DIFF ==='
          git diff -- $path

          Write-Host "`n=== DEMO SELFCHECK ==="
          pnpm --dir client --filter @metaforge/demo selfcheck
          exit $LASTEXITCODE
