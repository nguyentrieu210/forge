name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 30
    steps:
      - name: Patch stale local facade expectations and rerun
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $payload = ''
          [IO.File]::WriteAllBytes('C:\alumdoor\.tmp-local-patch.cjs', [Convert]::FromBase64String($payload))
          node C:\alumdoor\.tmp-local-patch.cjs
          Remove-Item C:\alumdoor\.tmp-local-patch.cjs -Force

          Write-Host '=== USERS SCHEMA ==='
          Push-Location server
          npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc --command "PRAGMA table_info(users);"
          Pop-Location

          Write-Host "`n=== PATCH DIFF ==="
          git diff -- server/apps/tenant-worker/test/frappe-facade.integration.test.mts

          Write-Host "`n=== TARGETED TEST ==="
          pnpm --dir server exec vitest run --config apps/tenant-worker/vitest.config.mts apps/tenant-worker/test/frappe-facade.integration.test.mts --reporter=verbose
          exit $LASTEXITCODE
