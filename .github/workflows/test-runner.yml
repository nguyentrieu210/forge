name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 30
    steps:
      - name: Inspect unfinished local verification
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location C:\alumdoor

          Write-Host "=== LOCAL HEAD / STATUS ==="
          git status --short --branch
          git log -1 --oneline

          Write-Host "`n=== DIFF STAT ==="
          git diff --stat

          Write-Host "`n=== KEY DIFF: integration-hub ==="
          git diff -- server/apps-src/integration-hub/app.json

          Write-Host "`n=== KEY DIFF: verifier ==="
          git diff -- server/scripts/verify-alumdoor-meta-completeness.mjs server/scripts/verify-local-source.mjs

          Write-Host "`n=== KEY DIFF: facade test/router ==="
          git diff -- server/apps/tenant-worker/test/frappe-facade.integration.test.mts server/packages/frappe-api/src/router.ts

          Write-Host "`n=== MIGRATION DIFF MATCHES ==="
          git diff --name-only | Select-String '0008_erpnext_breadth.sql'
          $migration = git diff --name-only | Where-Object { $_ -like '*0008_erpnext_breadth.sql' } | Select-Object -First 1
          if ($migration) { git diff -- $migration }

          Write-Host "`n=== LAST VERIFY ARTIFACTS ==="
          if (Test-Path server\VERIFY.json) { Get-Content server\VERIFY.json -Tail 120 }
          if (Test-Path server\BUILD_REPORT.md) { Get-Content server\BUILD_REPORT.md -Tail 120 }

          Write-Host "`n=== TARGETED FACADE TEST ==="
          pnpm --dir server exec vitest run --config apps/tenant-worker/vitest.config.mts apps/tenant-worker/test/frappe-facade.integration.test.mts --reporter=verbose
          $code = $LASTEXITCODE
          Write-Host "TARGETED_TEST_EXIT=$code"
          exit $code
