name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 60
    steps:
      - name: Run full local verification gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor

          Write-Host "=== LOCAL STATUS ==="
          git status --short --branch
          git diff --stat

          Write-Host "`n=== FULL LOCAL VERIFY ==="
          node server/scripts/verify-local-source.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "`n=== FINAL STATUS ==="
          git status --short --branch
