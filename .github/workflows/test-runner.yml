name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 10
    steps:
      - name: Locate authoritative Alumdoor dataset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          if ((git branch --show-current) -ne 'exp/alumdoor-pricing-policy') { throw 'Wrong local branch' }

          Write-Host '=== WRANGLER STATE ROOTS ==='
          Get-ChildItem C:\alumdoor -Directory -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq '.wrangler' } |
            Select-Object -ExpandProperty FullName

          Write-Host '=== SQLITE FILES ==='
          Get-ChildItem C:\alumdoor -File -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in @('.sqlite', '.sqlite3', '.db') } |
            Sort-Object Length -Descending |
            Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize

          Write-Host '=== ALUMDOOR IMPORT FILES ==='
          Get-ChildItem C:\alumdoor\server\imports -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'alumdoor*' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

          Write-Host '=== AUTHORITATIVE IMPORT REFERENCES ==='
          Set-Location C:\alumdoor\server
          rg -l --glob 'imports/**' --glob 'scripts/**' 'alumdoor-full-2026-07-28|alumdoor-release-1.26.2|build-alumdoor-master-data|Item Price' | Select-Object -First 100

          Write-Host '=== AUDIT SUMMARY ==='
          node -e "const fs=require('fs'); const p='imports/alumdoor-full-2026-07-28.audit.json'; if(!fs.existsSync(p)){console.log('AUDIT_NOT_FOUND'); process.exit(0)}; const x=JSON.parse(fs.readFileSync(p,'utf8')); console.log('keys='+Object.keys(x).join(',')); for(const [k,v] of Object.entries(x)){ if(Array.isArray(v)) console.log(k+'_count='+v.length); else if(v&&typeof v==='object') console.log(k+'_keys='+Object.keys(v).slice(0,30).join(',')); else console.log(k+'='+String(v).slice(0,200)); }"

          Write-Host 'AUTHORITATIVE_DATASET_LOCATION_SCAN_OK'
