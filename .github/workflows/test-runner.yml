name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/test-runner.yml"]

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 40
    steps:
      - name: Sync experiment safely
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          if ((git branch --show-current) -ne 'exp/alumdoor-pricing-policy') { throw 'Wrong local branch' }
          $status = @(git status --porcelain --untracked-files=all)
          $unsafe = @($status | Where-Object { $_ -notmatch '^\?\? \.pricing-policy-backups/' })
          if ($unsafe.Count -gt 0) { $unsafe | ForEach-Object { Write-Host $_ }; throw 'Unsafe local changes' }
          git fetch origin exp/alumdoor-pricing-policy
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
          git merge --ff-only origin/exp/alumdoor-pricing-policy
          if ($LASTEXITCODE -ne 0) { throw 'fast-forward failed' }
          Write-Host "TESTING_COMMIT=$(git rev-parse HEAD)"

      - name: Build server and validate Alumdoor metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor\server
          pnpm run clean
          if ($LASTEXITCODE -ne 0) { throw 'clean failed' }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }
          node --test tests/alumdoor-child-presentation.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'presentation contract failed' }
          pnpm run brief:check
          if ($LASTEXITCODE -ne 0) { throw 'brief check failed' }
          pnpm exec vitest run apps-src/alumdoor-worker/src/ui-child-preview.test.ts --environment node
          if ($LASTEXITCODE -ne 0) { throw 'worker preview tests failed' }
          pnpm exec wrangler deploy --dry-run --config apps-src/alumdoor-worker/wrangler.purchase-qa.jsonc --outdir "$env:RUNNER_TEMP\alumdoor-worker-cert"
          if ($LASTEXITCODE -ne 0) { throw 'worker dry-run failed' }
          Write-Host 'ALUMDOOR_META_PREVIEW_SERVER_PASS'

      - name: Build MetaForge dependency closure and runtime tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor\client
          if (!(Test-Path .\node_modules\.bin\tsc.cmd)) {
            pnpm install --no-frozen-lockfile --lockfile=false
            if ($LASTEXITCODE -ne 0) { throw 'client bootstrap failed' }
          }
          pnpm --filter @metaforge/views... run build
          if ($LASTEXITCODE -ne 0) { throw 'MetaForge closure build failed' }
          Set-Location packages\views
          node --test tests/child-grid-presentation.test.mjs tests/metadata-child-grid-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'metadata grid runtime tests failed' }
          Write-Host 'ALUMDOOR_METADATA_GRID_CLIENT_PASS'

      - name: Scan app worker for legacy reservation mutation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $hits = @(git grep -n -I -E 'consumeReservationsForCut|Stock Reservation|qty_reserved|Đã dùng' -- server/apps-src/alumdoor-worker/src)
          if ($hits.Count -eq 0) {
            Write-Host 'ALUMDOOR_WORKER_RESERVATION_MUTATION_SCAN=NONE'
          } else {
            Write-Host '=== RESERVATION REFERENCES ==='
            $hits | ForEach-Object { Write-Host $_ }
          }

      - name: Run inventory integrity slice
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor\server
          node --test tests/stock-reservation-integrity.test.mjs tests/reservation-source-lifecycle.test.mjs tests/outbound-reservation-guard.test.mjs tests/stock-return-integrity.test.mjs tests/stock-document-warehouse-integrity.test.mjs tests/inventory-coordinator.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'inventory integrity failed' }
          Write-Host 'ALUMDOOR_INVENTORY_CERT_PASS'

      - name: Run transaction closure certification slice
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor\server
          node --test tests/transaction-closure-sales-o2c.test.mjs tests/procurement-p2p-closure.test.mjs tests/manufacturing-transaction-closure.test.mjs tests/finance-payment-allocation.test.mjs tests/finance-stock-control-policy.test.mjs tests/finance-stock-control-query.test.mjs tests/sales-production-flow.test.mjs tests/alumdoor-manufacturing-lifecycle.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'transaction closure failed' }
          Write-Host 'ALUMDOOR_TRANSACTION_CLOSURE_CERT_PASS'

      - name: Run Alumdoor print certification slice
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor\server
          node --test tests/alumdoor-sales-order-print.test.mjs tests/alumdoor-purchase-order-print.test.mjs tests/alumdoor-delivery-note-print.test.mjs tests/alumdoor-cut-order-print.test.mjs tests/alumdoor-production-request-print.test.mjs tests/alumdoor-stock-reconciliation-print.test.mjs tests/alumdoor-handover-acceptance-print.test.mjs tests/alumdoor-print-brand-consistency.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'print certification failed' }
          Write-Host 'ALUMDOOR_PRINT_CERT_PASS'

      - name: Run full server regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor\server
          $log = Join-Path $env:RUNNER_TEMP 'alumdoor-full-test.log'
          cmd /c "node --test tests/*.test.mjs > `"$log`" 2>&1"
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            Select-String -Path $log -Pattern '^not ok ','AssertionError','ERR_','error:','expected:','actual:' -Context 2,5 | Select-Object -First 160 | ForEach-Object { Write-Host $_.ToString() }
            Get-Content $log -Tail 160 | ForEach-Object { Write-Host $_ }
            throw "full server regression failed with exit $exit"
          }
          Get-Content $log -Tail 35 | ForEach-Object { Write-Host $_ }
          Write-Host 'ALUMDOOR_FULL_SERVER_UNIT_PASS'

      - name: Re-run real Alumdoor pricing catalogue lab
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor\server
          $source = Get-ChildItem .\apps\tenant-worker\.wrangler\state -Recurse -File -Filter *.sqlite | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $source) { throw 'No local Wrangler D1 sqlite found' }
          $lab = Join-Path $env:RUNNER_TEMP 'alumdoor-real-pricing.sqlite'
          Copy-Item -Force $source.FullName $lab
          $env:LAB_DB = $lab
          node scripts/test-alumdoor-pricing-real-data.mjs
          if ($LASTEXITCODE -ne 0) { throw 'real pricing lab failed' }
          Write-Host 'ALUMDOOR_REAL_DATA_PRICING_CERT_PASS'

# certify-preview-wiring