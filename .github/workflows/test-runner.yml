name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/test-runner.yml"]

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 10
    steps:
      - name: Switch C:\alumdoor to attendance payroll branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor

          $target = 'feature/attendance-payroll'
          $current = git branch --show-current
          $status = @(git status --porcelain --untracked-files=all)
          $unsafe = @($status | Where-Object { $_ -notmatch '^\?\? \.pricing-policy-backups/' })
          if ($unsafe.Count -gt 0) {
            Write-Host "Refusing branch switch because C:\alumdoor has tracked or unexpected local changes:"
            $unsafe | ForEach-Object { Write-Host $_ }
            throw 'Unsafe local changes'
          }

          git fetch origin main --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch origin main failed' }
          $mainSha = (git rev-parse origin/main).Trim()

          $localTarget = git show-ref --verify --quiet "refs/heads/$target"
          if ($LASTEXITCODE -eq 0) {
            git switch $target
            if ($LASTEXITCODE -ne 0) { throw 'switch to existing attendance payroll branch failed' }
          } else {
            git switch -c $target origin/main
            if ($LASTEXITCODE -ne 0) { throw 'create attendance payroll branch from origin/main failed' }
          }

          $after = (git branch --show-current).Trim()
          if ($after -ne $target) { throw "Wrong local branch after switch: $after" }

          $head = (git rev-parse HEAD).Trim()
          Write-Host "PREVIOUS_BRANCH=$current"
          Write-Host "LOCAL_BRANCH=$after"
          Write-Host "LOCAL_HEAD=$head"
          Write-Host "ORIGIN_MAIN=$mainSha"

          $aheadBehind = (git rev-list --left-right --count "$target...origin/main").Trim()
          Write-Host "TARGET_VS_ORIGIN_MAIN=$aheadBehind"
          Write-Host 'ATTENDANCE_PAYROLL_LOCAL_BRANCH_READY'
