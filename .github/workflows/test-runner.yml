name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 10
    steps:
      - name: Back up actual tenant D1 and inspect commercial schema
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'exp/alumdoor-pricing-policy'
          $branch = git branch --show-current
          if ($branch -ne $target) { throw "Unexpected local branch: $branch" }

          $state = 'C:\alumdoor\server\apps\tenant-worker\.wrangler\state'
          if (!(Test-Path $state)) { throw "Actual tenant Wrangler state not found: $state" }
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $backup = "C:\alumdoor\.pricing-policy-backups\$stamp"
          New-Item -ItemType Directory -Force -Path $backup | Out-Null
          Copy-Item $state "$backup\tenant-worker-wrangler-state" -Recurse -Force
          $sourceFiles = Get-ChildItem $state -Recurse -File
          $backupFiles = Get-ChildItem "$backup\tenant-worker-wrangler-state" -Recurse -File
          if ($sourceFiles.Count -eq 0 -or $sourceFiles.Count -ne $backupFiles.Count) {
            throw "D1 backup verification failed: source=$($sourceFiles.Count) backup=$($backupFiles.Count)"
          }
          Write-Host "VERIFIED_BACKUP=$backup files=$($backupFiles.Count)"

          Set-Location C:\alumdoor\server
          Write-Host '=== MASTER_RECORDS SCHEMA ==='
          npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc --command "PRAGMA table_info(master_records);"
          Write-Host '=== DOCUMENTS SCHEMA ==='
          npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc --command "PRAGMA table_info(documents);"
          Write-Host '=== CHILDREN SCHEMA ==='
          npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc --command "PRAGMA table_info(document_children);"
          if ($LASTEXITCODE -ne 0) { throw "D1 schema inspection failed" }

          Write-Host 'REAL_D1_BACKUP_AND_SCHEMA_OK'
