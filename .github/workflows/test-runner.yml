name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 60
    steps:
      - name: Run final full local verification gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor

          Write-Host "=== FINAL LOCAL STATUS ==="
          git status --short --branch
          git diff --stat

          Write-Host "`n=== FULL LOCAL VERIFY ==="
          node server/scripts/verify-local-source.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "`n=== VERIFY ARTIFACT TAIL ==="
          if (Test-Path server\VERIFY.json) { Get-Content server\VERIFY.json -Tail 80 -Encoding UTF8 }
          if (Test-Path server\BUILD_REPORT.md) { Get-Content server\BUILD_REPORT.md -Tail 80 -Encoding UTF8 }

          Write-Host "`nFULL_LOCAL_GATE_PASS"
