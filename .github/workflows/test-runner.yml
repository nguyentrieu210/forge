name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 5
    steps:
      - name: Inspect local discount and surcharge implementation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor

          Write-Host '=== LOCAL STATUS ==='
          git status --short --branch

          Write-Host '=== DISCOUNT / SURCHARGE REFERENCES ==='
          git grep -n -I -i -E 'discount_percentage|discount|surcharge|phu.?thu|chi.?t.?kh.?u' -- client server briefs 2>$null | Select-Object -First 500

          Write-Host '=== CHANGED RELEVANT FILES ==='
          git diff --name-only | Select-String -Pattern 'ChildGrid|alumdoor|sales|pricing|discount|surcharge|metadata' -CaseSensitive:$false

          Write-Host '=== CHILDGRID DIFF ==='
          git diff -- client/packages/ui/src/components/ChildGrid.tsx

          Write-Host '=== ALUMDOOR BRIEF MATCHES ==='
          if (Test-Path briefs\alumdoor-v2.json) {
            Select-String -Path briefs\alumdoor-v2.json -Pattern 'discount_percentage|discount|surcharge|phu|chiết|khấu' -CaseSensitive:$false -Encoding UTF8 | Select-Object -First 200
          }

          Write-Host 'DISCOUNT_SURCHARGE_INSPECTION_DONE'
