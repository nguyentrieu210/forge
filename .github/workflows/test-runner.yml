name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 15
    steps:
      - name: Diagnose reversible ChildGrid mojibake
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $script = "$env:TEMP\forge-mojibake-check.py"
          $py = @(
            'from pathlib import Path',
            'p = Path(r"C:\alumdoor\client\packages\views\src\form\ChildGrid.tsx")',
            's = p.read_text(encoding="utf-8")',
            'special = {}',
            'for b in range(0x80, 0xA0):',
            '    try:',
            '        ch = bytes([b]).decode("cp1252")',
            '    except UnicodeDecodeError:',
            '        continue',
            '    special[ord(ch)] = b',
            'out = bytearray()',
            'bad = []',
            'for i, ch in enumerate(s):',
            '    o = ord(ch)',
            '    if o <= 0xFF:',
            '        out.append(o)',
            '    elif o in special:',
            '        out.append(special[o])',
            '    else:',
            '        bad.append((i, o, ch.encode("unicode_escape").decode("ascii")))',
            'print("SOURCE_LEN", len(s))',
            'print("NONREVERSIBLE_COUNT", len(bad))',
            'print("NONREVERSIBLE_SAMPLE", bad[:20])',
            'if bad:',
            '    raise SystemExit(2)',
            'fixed = bytes(out).decode("utf-8")',
            'sus = ("\\u00c3", "\\u00c2", "\\u00c4", "\\u00e2")',
            'print("SUSPECT_BEFORE", {x: s.count(x) for x in sus})',
            'print("SUSPECT_AFTER", {x: fixed.count(x) for x in sus})',
            'for needle in ("basis =", "discountField =", "resolvedDiscount =", "resolvedDiscount?.visible"):',
            '    hits = [line for line in fixed.splitlines() if needle in line]',
            '    print("SAMPLE", needle, [h.encode("unicode_escape").decode("ascii") for h in hits[:6]])',
            'print("REPAIR_PREVIEW_OK")'
          )
          [IO.File]::WriteAllLines($script, $py, [Text.Encoding]::ASCII)
          python $script
          exit $LASTEXITCODE
