name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 10
    steps:
      - name: Snapshot and inspect real local pricing data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'exp/alumdoor-pricing-policy'
          $branch = git branch --show-current
          if ($branch -ne $target) { throw "Unexpected local branch: $branch" }

          Write-Host '=== WORKTREE ==='
          git status --short --branch

          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $backup = "C:\alumdoor\.pricing-policy-backups\$stamp"
          New-Item -ItemType Directory -Force -Path $backup | Out-Null
          if (Test-Path 'C:\alumdoor\server\.wrangler\state') {
            Copy-Item 'C:\alumdoor\server\.wrangler\state' "$backup\wrangler-state" -Recurse -Force
          }
          Write-Host "BACKUP=$backup"

          Write-Host '=== LOCAL D1 FILES ==='
          Get-ChildItem 'C:\alumdoor\server\.wrangler' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in @('.sqlite', '.db', '.sqlite3') } |
            Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize

          Set-Location C:\alumdoor\server
          Write-Host '=== D1 TABLES ==='
          npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          if ($LASTEXITCODE -ne 0) { throw "wrangler d1 table inspection failed" }

          Write-Host 'REAL_DATA_SNAPSHOT_OK'
