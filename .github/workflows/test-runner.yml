name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/test-runner.yml"]

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 10
    steps:
      - name: Switch and verify manufacturing branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'local/manufacturing-20260811'

          $tracked = git status --porcelain --untracked-files=no
          if ($tracked) {
            Write-Host $tracked
            throw 'Tracked local changes exist; refusing to switch branch'
          }

          git fetch origin $target --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }

          $branch = (git branch --show-current).Trim()
          if ($branch -ne $target) {
            $localExists = (git branch --list $target).Trim()
            if ([string]::IsNullOrWhiteSpace($localExists)) {
              git switch --track -c $target "origin/$target"
            } else {
              git switch $target
            }
            if ($LASTEXITCODE -ne 0) { throw 'git switch failed' }
          }

          git merge --ff-only "origin/$target"
          if ($LASTEXITCODE -ne 0) { throw 'local manufacturing branch is not fast-forwardable; refusing destructive reset' }

          Write-Host "LOCAL_BRANCH=$((git branch --show-current).Trim())"
          Write-Host "LOCAL_HEAD=$((git rev-parse HEAD).Trim())"
          Write-Host "REMOTE_HEAD=$((git rev-parse origin/$target).Trim())"
          git status --short --untracked-files=all
          Write-Host 'MANUFACTURING_LOCAL_WORKER_READY'
