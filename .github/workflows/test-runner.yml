name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test-runner.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 15
    steps:
      - name: Trace share and notification paths
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor

          Write-Host "=== addShare definition ==="
          Select-String -Path server\packages\frappe-api\src\router.ts -Pattern '^async function addShare' -Context 0,35 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext }

          Write-Host "`n=== d1DeliveryAuthorizer definition ==="
          Select-String -Path server\packages\frappe-api\src\notification-runner.ts -Pattern 'function d1DeliveryAuthorizer|async function d1DeliveryAuthorizer' -Context 0,65 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext }

          Write-Host "`n=== test document creation names ==="
          Select-String -Path server\apps\tenant-worker\test\frappe-facade.integration.test.mts -Pattern 'createdName|FV-NOTIFY|System Manager' -Context 1,2 | Select-Object -First 100 | ForEach-Object { $_.ToString() }

          Write-Host "`n=== direct local D1 document_shares SQL probe ==="
          Push-Location server
          npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc --command "INSERT OR REPLACE INTO document_shares(tenant_id,doctype,name,user,can_read,can_write,can_share,submitted_by,created_at) VALUES('demo','Field Visit','SQL-PROBE','colleague@example.com',1,0,0,'sales@example.com','2026-08-10T00:00:00.000Z'); SELECT user,can_read FROM document_shares WHERE tenant_id='demo' AND name='SQL-PROBE'; DELETE FROM document_shares WHERE tenant_id='demo' AND name='SQL-PROBE';"
          Pop-Location
