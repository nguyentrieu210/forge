name: Test local runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/test-runner.yml"]

jobs:
  test:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 15
    steps:
      - name: Audit attendance payroll local branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\alumdoor
          $target = 'feature/attendance-payroll'
          $branch = (git branch --show-current).Trim()
          if ($branch -ne $target) { throw "Expected $target but found $branch" }
          Write-Host "LOCAL_BRANCH=$branch"
          Write-Host "LOCAL_HEAD=$((git rev-parse HEAD).Trim())"
          Write-Host "STATUS_BEGIN"
          git status --short --untracked-files=all
          Write-Host "STATUS_END"
          Write-Host "DIFFSTAT_BEGIN"
          git diff --stat origin/main...HEAD
          Write-Host "DIFFSTAT_END"

          $patterns = @(
            'AlumDoor Attendance Policy',
            'AlumDoor Attendance Day',
            'AlumDoor Pay Profile',
            'alumdoor.attendance.',
            'alumdoor.payroll.',
            'AlumDoor Salary Slip',
            'attendance-scan-coordinator',
            'commit_alumdoor_attendance_scan'
          )
          foreach ($pattern in $patterns) {
            Write-Host "PATTERN=$pattern"
            git grep -l -- "$pattern" -- ':!upstream/**' 2>$null | Select-Object -First 40
          }

          Write-Host "ATTENDANCE_FILES_BEGIN"
          Get-ChildItem server\apps-src\alumdoor-worker\src -File | Where-Object { $_.Name -match 'attendance|payroll' } | ForEach-Object { $_.FullName.Replace((Get-Location).Path + '\\','') }
          Get-ChildItem server\packages\clouderp-erpnext\src -File | Where-Object { $_.Name -match 'attendance|payroll|salary-slip' } | ForEach-Object { $_.FullName.Replace((Get-Location).Path + '\\','') }
          Write-Host "ATTENDANCE_FILES_END"

          Write-Host "TEST_FILES_BEGIN"
          Get-ChildItem server\tests -File | Where-Object { $_.Name -match 'alumdoor-attendance|hrm-payroll|salary|attendance' } | ForEach-Object { $_.Name }
          Write-Host "TEST_FILES_END"
          Write-Host 'ATTENDANCE_PAYROLL_AUDIT_OK'
