name: Validate HRM Wave 1

on:
  push:
    branches:
      - feat/hrm-statutory-payroll-evaluator-20260803-v2
    paths:
      - server/apps-src/hrm/**
      - server/packages/clouderp-erpnext/src/hrm-*.ts
      - server/packages/clouderp-erpnext/src/registry.ts
      - server/migrations/tenant/0043_hrm_statutory_payroll_integrity.sql
      - server/migrations/tenant/0044_hrm_wave1_closure.sql
      - server/migrations/tenant/0045_hrm_employee_self_service_shares.sql
      - server/migrations/tenant/0046_hrm_hiring_cycle_integrity.sql
      - server/migrations/tenant/0047_hrm_payslip_self_service_permission.sql
      - server/scripts/test-hrm-*.py
      - server/tests/hrm-*.test.mjs
      - server/package.json
      - .github/workflows/validate-hrm-wave1.yml
  pull_request:
    branches:
      - main
    paths:
      - server/apps-src/hrm/**
      - server/packages/clouderp-erpnext/src/hrm-*.ts
      - server/packages/clouderp-erpnext/src/registry.ts
      - server/migrations/tenant/0043_hrm_statutory_payroll_integrity.sql
      - server/migrations/tenant/0044_hrm_wave1_closure.sql
      - server/migrations/tenant/0045_hrm_employee_self_service_shares.sql
      - server/migrations/tenant/0046_hrm_hiring_cycle_integrity.sql
      - server/migrations/tenant/0047_hrm_payslip_self_service_permission.sql
      - server/scripts/test-hrm-*.py
      - server/tests/hrm-*.test.mjs
      - server/package.json
      - .github/workflows/validate-hrm-wave1.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build server
        run: pnpm --filter cloudforge run build
      - name: HRM and SQL regressions
        run: pnpm --filter cloudforge run test
      - name: Validate first-party HRM package
        run: pnpm --filter cloudforge run app:check
      - name: Typecheck worker boundary
        run: pnpm --filter cloudforge run typecheck:workers
