name: WS09 Client Input Table Validation

on:
  pull_request:
    branches:
      - program/ws09-batch-productization-20260804
    paths:
      - "client/packages/core/src/app/action-input-table.ts"
      - "client/packages/core/src/index.ts"
      - "client/packages/views/src/action/**"
      - "client/packages/views/src/screen/**"
      - "client/packages/views/src/index.ts"
      - "client/packages/views/package.json"
      - "client/packages/views/tests/action-input-table.test.mjs"
      - "client/apps/runtime/**"
      - ".github/workflows/ws09-client-input-table-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ws09-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'platform/ws09-input-table-native-r2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client dependency declarations
        run: |
          pnpm --filter @metaforge/core run build
          pnpm --filter @metaforge/visual run build
          pnpm --filter @metaforge/charts run build
          pnpm --filter @metaforge/ui run build
          pnpm --filter @metaforge/controls run build
          pnpm --filter @metaforge/shell run build

      - name: Build views and run input-table regression
        run: pnpm --filter @metaforge/views run test:action-input-table

      - name: Build production runtime
        run: pnpm --filter runtime run build
