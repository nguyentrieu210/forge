name: Purchase Completion Apply

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: purchase-completion-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    name: Apply, verify and prepare purchase source commit
    if: ${{ github.head_ref == 'feat/purchase-fifo-production-completion-20260731' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          payload="$(tr -d '\r\n' < .github/purchase-completion.patch.gz.b64)"
          actual="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
          expected='6995a2a9aca39363db69b394e447932e0a22186448081ed73bc9efacf4099183'
          printf 'payload_sha256=%s\n' "$actual"
          test "$actual" = "$expected"
          printf '%s' "$payload" | base64 --decode | gzip -dc > /tmp/purchase-completion.patch
          git apply --check /tmp/purchase-completion.patch
          git apply /tmp/purchase-completion.patch

          python3 - <<'PY'
          from pathlib import Path

          playwright = Path('client/e2e-forge/playwright.purchase.config.ts')
          text = playwright.read_text()
          old = '''    command: `pnpm --dir client exec vite --config e2e-forge/vite.purchase.config.ts --port ${port}`,
              cwd: path.join(here, "..", ".."),'''
          new = '''    command: `pnpm exec vite --config vite.purchase-e2e.config.ts --port ${port} --strictPort`,
              cwd: path.join(here, "..", "apps", "runtime"),'''
          if old not in text:
              raise SystemExit('purchase Playwright webServer block was not found')
          playwright.write_text(text.replace(old, new))

          source = Path('client/e2e-forge/vite.purchase.config.ts')
          runtime = Path('client/apps/runtime/vite.purchase-e2e.config.ts')
          config = source.read_text().replace(
              'root: path.join(here, "purchase-harness"),',
              'root: path.resolve(here, "..", "..", "e2e-forge", "purchase-harness"),',
          )
          runtime.write_text(config)
          source.unlink()

          tsconfig = Path('client/e2e-forge/tsconfig.json')
          ts_text = tsconfig.read_text().replace(
              '    "playwright.purchase.config.ts",\n    "vite.purchase.config.ts"\n',
              '    "playwright.purchase.config.ts"\n',
          )
          tsconfig.write_text(ts_text)
          PY

          rm -f .github/purchase-completion.patch.gz.b64
          rm -f .github/purchase-completion-v2.patch.gz.b64
          rm -f .github/workflows/purchase-completion-apply.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm --filter metaforge run lint

      - name: Server unit tests
        run: pnpm --dir server run test:unit

      - name: Server SQL tests
        run: pnpm --dir server run test:sql

      - name: Client tests
        run: pnpm run client:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter e2e-forge exec playwright install --with-deps chromium

      - name: Verify purchase harness Vite
        run: pnpm --dir client/apps/runtime exec vite --version

      - name: Purchase browser QA
        id: purchase_browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/purchase-browser"
          pnpm --filter e2e-forge exec playwright test --config playwright.purchase.config.ts 2>&1 \
            | tee "$RUNNER_TEMP/purchase-browser/playwright.log"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-completion-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/purchase-browser/
            client/e2e-forge/playwright-report/purchase-ui/
            client/e2e-forge/test-results/purchase-ui/
          if-no-files-found: warn
          retention-days: 14

      - name: Report browser failure on PR
        if: steps.purchase_browser.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- purchase-completion-browser-failure -->';
            const path = `${process.env.RUNNER_TEMP}/purchase-browser/playwright.log`;
            const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-12000) : 'Browser log unavailable.';
            const body = `${marker}\n## Purchase browser QA failed\n\n\`\`\`text\n${text}\n\`\`\`\n\n[Workflow and artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce browser QA result
        if: steps.purchase_browser.outcome == 'failure'
        run: exit 1

      - name: Verify generated source diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git diff --cached --stat

      - name: Create verified commit object
        id: verified_commit
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.environ['PARENT_SHA']
          pr_number = os.environ['PR_NUMBER']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f'{api}{path}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent_commit = request('GET', f'/repos/{repository}/git/commits/{parent}')
          base_tree = parent_commit['tree']['sha']
          raw = subprocess.check_output([
              'git', 'diff', '--cached', '--name-status', '--no-renames', '-z'
          ])
          fields = raw.decode().split('\0')
          entries = []
          index = 0
          while index < len(fields) and fields[index]:
              status = fields[index]
              path = fields[index + 1]
              index += 2
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              content = pathlib.Path(path).read_bytes()
              blob = request('POST', f'/repos/{repository}/git/blobs', {
                  'content': base64.b64encode(content).decode(),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = request('POST', f'/repos/{repository}/git/trees', {
              'base_tree': base_tree,
              'tree': entries,
          })
          commit = request('POST', f'/repos/{repository}/git/commits', {
              'message': 'fix(purchase): complete lifecycle and browser QA',
              'tree': tree['sha'],
              'parents': [parent],
          })
          marker = '<!-- purchase-completion-verified-commit -->'
          body = (
              f'{marker}\n## Verified Purchase completion commit\n\n'
              f'- Commit object: `{commit["sha"]}`\n'
              f'- Parent: `{parent}`\n'
              f'- Tree: `{tree["sha"]}`\n'
              f'- All lint, unit, SQL, client, typecheck, build and Chromium QA gates passed.\n\n'
              'The branch ref has not been moved by this workflow.'
          )
          comments = request('GET', f'/repos/{repository}/issues/{pr_number}/comments?per_page=100')
          existing = next((item for item in comments if marker in (item.get('body') or '')), None)
          if existing:
              request('PATCH', f'/repos/{repository}/issues/comments/{existing["id"]}', {'body': body})
          else:
              request('POST', f'/repos/{repository}/issues/{pr_number}/comments', {'body': body})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'commit_sha={commit["sha"]}\n')
              output.write(f'tree_sha={tree["sha"]}\n')
          PY

      - name: Summarize verified commit
        shell: bash
        run: |
          {
            echo '## Purchase completion source verified'
            echo
            echo "Commit object: \`${{ steps.verified_commit.outputs.commit_sha }}\`"
            echo "Tree: \`${{ steps.verified_commit.outputs.tree_sha }}\`"
            echo
            echo 'The workflow intentionally did not update the branch ref.'
          } >> "$GITHUB_STEP_SUMMARY"
