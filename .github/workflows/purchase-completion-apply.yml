name: Purchase Completion Apply

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: purchase-completion-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    name: Apply, verify and prepare purchase source commit
    if: ${{ github.head_ref == 'feat/purchase-fifo-production-completion-20260731' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and normalize source patch
        shell: bash
        run: |
          set -euo pipefail
          payload="$(tr -d '\r\n' < .github/purchase-completion.patch.gz.b64)"
          actual="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
          expected='6995a2a9aca39363db69b394e447932e0a22186448081ed73bc9efacf4099183'
          printf 'payload_sha256=%s\n' "$actual"
          test "$actual" = "$expected"
          printf '%s' "$payload" | base64 --decode | gzip -dc > /tmp/purchase-completion.patch
          git apply --check /tmp/purchase-completion.patch
          git apply /tmp/purchase-completion.patch

          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          playwright = Path('client/e2e-forge/playwright.purchase.config.ts')
          playwright_text = playwright.read_text()
          old_server = '''    command: `pnpm --dir client exec vite --config e2e-forge/vite.purchase.config.ts --port ${port}`,
              cwd: path.join(here, "..", ".."),'''
          new_server = '''    command: `pnpm exec vite --config vite.purchase-e2e.config.ts --port ${port} --strictPort`,
              cwd: path.join(here, "..", "apps", "runtime"),'''
          if old_server not in playwright_text:
              raise SystemExit('purchase Playwright webServer block was not found')
          playwright.write_text(playwright_text.replace(old_server, new_server))

          source_harness = Path('client/e2e-forge/purchase-harness')
          runtime_harness = Path('client/apps/runtime/purchase-harness')
          if not source_harness.is_dir():
              raise SystemExit('purchase harness source directory was not created by the patch')
          if runtime_harness.exists():
              raise SystemExit('runtime purchase harness already exists unexpectedly')
          shutil.move(str(source_harness), str(runtime_harness))

          main = runtime_harness / 'main.tsx'
          main_text = main.read_text()
          required = [
              'import { QueryClient } from "@tanstack/react-query";\n',
              '../../packages/views/src/container/provider.js',
              '../../packages/views/src/container/AllocationTimelineDialog.js',
              '../../apps/runtime/src/styles.css',
              '        queryClient={new QueryClient({ defaultOptions: { queries: { retry: false } } })}\n',
          ]
          missing = [value for value in required if value not in main_text]
          if missing:
              raise SystemExit(f'purchase harness normalization markers missing: {missing}')
          main_text = main_text.replace('import { QueryClient } from "@tanstack/react-query";\n', '')
          main_text = main_text.replace('../../packages/views/', '../../../packages/views/')
          main_text = main_text.replace('../../apps/runtime/src/styles.css', '../src/styles.css')
          main_text = main_text.replace(
              '        queryClient={new QueryClient({ defaultOptions: { queries: { retry: false } } })}\n',
              '',
          )
          main.write_text(main_text)

          old_vite = Path('client/e2e-forge/vite.purchase.config.ts')
          if not old_vite.is_file():
              raise SystemExit('purchase Vite config was not created by the patch')
          runtime_vite = Path('client/apps/runtime/vite.purchase-e2e.config.ts')
          runtime_vite.write_text('''import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          const here = path.dirname(fileURLToPath(import.meta.url));

          export default defineConfig({
            root: path.resolve(here, "purchase-harness"),
            plugins: [react(), tailwindcss()],
            server: { host: "127.0.0.1" },
          });
          '''.replace('          ', ''))
          old_vite.unlink()

          spec = Path('client/e2e-forge/purchase-tests/purchase-allocation-ui.spec.ts')
          spec_text = spec.read_text()
          old_selector = '  const supplier = page.getByLabel("Nhà cung cấp");'
          new_selector = '  const supplier = page.getByRole("textbox", { name: "Nhà cung cấp" });'
          if old_selector not in spec_text:
              raise SystemExit('supplier filter selector marker was not found')
          spec.write_text(spec_text.replace(old_selector, new_selector))

          tsconfig = Path('client/e2e-forge/tsconfig.json')
          ts_data = json.loads(tsconfig.read_text())
          ts_data['include'] = [
              value for value in ts_data.get('include', [])
              if value not in {'purchase-harness/**/*.tsx', 'vite.purchase.config.ts'}
          ]
          tsconfig.write_text(json.dumps(ts_data, ensure_ascii=False, indent=2) + '\n')
          PY

          rm -f .github/purchase-completion.patch.gz.b64
          rm -f .github/purchase-completion-v2.patch.gz.b64
          rm -f .github/workflows/purchase-completion-apply.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm --filter metaforge run lint

      - name: Server unit tests
        run: pnpm --dir server run test:unit

      - name: Server SQL tests
        run: pnpm --dir server run test:sql

      - name: Client tests
        run: pnpm run client:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter e2e-forge exec playwright install --with-deps chromium

      - name: Verify purchase harness Vite
        run: pnpm --dir client/apps/runtime exec vite --version

      - name: Purchase browser QA
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/purchase-browser"
          pnpm --filter e2e-forge exec playwright test --config playwright.purchase.config.ts 2>&1 \
            | tee "$RUNNER_TEMP/purchase-browser/playwright.log"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-completion-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/purchase-browser/
            client/e2e-forge/playwright-report/purchase-ui/
            client/e2e-forge/test-results/purchase-ui/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify generated source diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git diff --cached --stat

      - name: Create verified commit object
        id: verified_commit
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.environ['PARENT_SHA']
          pr_number = os.environ['PR_NUMBER']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f'{api}{path}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent_commit = request('GET', f'/repos/{repository}/git/commits/{parent}')
          base_tree = parent_commit['tree']['sha']
          raw = subprocess.check_output([
              'git', 'diff', '--cached', '--name-status', '--no-renames', '-z'
          ])
          fields = raw.decode().split('\0')
          entries = []
          index = 0
          while index < len(fields) and fields[index]:
              status = fields[index]
              path = fields[index + 1]
              index += 2
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              content = pathlib.Path(path).read_bytes()
              blob = request('POST', f'/repos/{repository}/git/blobs', {
                  'content': base64.b64encode(content).decode(),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = request('POST', f'/repos/{repository}/git/trees', {
              'base_tree': base_tree,
              'tree': entries,
          })
          commit = request('POST', f'/repos/{repository}/git/commits', {
              'message': 'fix(purchase): complete lifecycle and browser QA',
              'tree': tree['sha'],
              'parents': [parent],
          })
          marker = '<!-- purchase-completion-verified-commit -->'
          body = (
              f'{marker}\n## Verified Purchase completion commit\n\n'
              f'- Commit object: `{commit["sha"]}`\n'
              f'- Parent: `{parent}`\n'
              f'- Tree: `{tree["sha"]}`\n'
              '- Lint, unit, SQL, client, typecheck, build and Chromium QA all passed.\n\n'
              'The workflow intentionally did not update the branch ref.'
          )
          comments = request('GET', f'/repos/{repository}/issues/{pr_number}/comments?per_page=100')
          existing = next((item for item in comments if marker in (item.get('body') or '')), None)
          if existing:
              request('PATCH', f'/repos/{repository}/issues/comments/{existing["id"]}', {'body': body})
          else:
              request('POST', f'/repos/{repository}/issues/{pr_number}/comments', {'body': body})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'commit_sha={commit["sha"]}\n')
              output.write(f'tree_sha={tree["sha"]}\n')
          PY

      - name: Summarize verified commit
        shell: bash
        run: |
          {
            echo '## Purchase completion source verified'
            echo
            echo "Commit object: \`${{ steps.verified_commit.outputs.commit_sha }}\`"
            echo "Tree: \`${{ steps.verified_commit.outputs.tree_sha }}\`"
            echo
            echo 'The workflow intentionally did not update the branch ref.'
          } >> "$GITHUB_STEP_SUMMARY"
