name: Purchase Completion Apply

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: purchase-completion-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    name: Apply and verify purchase completion
    if: ${{ github.head_ref == 'feat/purchase-fifo-production-completion-20260731' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          payload="$(tr -d '\r\n' < .github/purchase-completion.patch.gz.b64)"
          actual="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
          expected='6995a2a9aca39363db69b394e447932e0a22186448081ed73bc9efacf4099183'
          printf 'payload_sha256=%s\n' "$actual"
          test "$actual" = "$expected"
          printf '%s' "$payload" | base64 --decode | gzip -dc > /tmp/purchase-completion.patch
          git apply --check /tmp/purchase-completion.patch
          git apply /tmp/purchase-completion.patch
          python3 - <<'PY'
          from pathlib import Path

          playwright = Path('client/e2e-forge/playwright.purchase.config.ts')
          text = playwright.read_text()
          old = '''command: `pnpm --dir client exec vite --config e2e-forge/vite.purchase.config.ts --port ${port}`,
              cwd: path.join(here, "..", ".."),'''
          new = '''command: `pnpm --dir client/apps/runtime exec vite --config vite.purchase.config.ts --port ${port} --strictPort`,
              cwd: path.join(here, "..", ".."),'''
          if old not in text:
              raise SystemExit('purchase Playwright webServer block was not found')
          playwright.write_text(text.replace(old, new))

          source = Path('client/e2e-forge/vite.purchase.config.ts')
          runtime = Path('client/apps/runtime/vite.purchase.config.ts')
          config = source.read_text()
          config = config.replace(
              'root: path.join(here, "purchase-harness"),',
              'root: path.join(here, "..", "..", "e2e-forge", "purchase-harness"),',
          )
          runtime.write_text(config)
          source.unlink()

          tsconfig = Path('client/e2e-forge/tsconfig.json')
          ts_text = tsconfig.read_text()
          ts_text = ts_text.replace(
              '    "playwright.purchase.config.ts",\n    "vite.purchase.config.ts"\n',
              '    "playwright.purchase.config.ts"\n',
          )
          tsconfig.write_text(ts_text)
          PY
          rm -f .github/purchase-completion.patch.gz.b64
          rm -f .github/purchase-completion-v2.patch.gz.b64
          rm -f .github/workflows/purchase-completion-apply.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm --filter metaforge run lint

      - name: Server unit tests
        run: pnpm --dir server run test:unit

      - name: Server SQL tests
        run: pnpm --dir server run test:sql

      - name: Client tests
        run: pnpm run client:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(purchase): complete lifecycle gates'
          git push origin HEAD:feat/purchase-fifo-production-completion-20260731
