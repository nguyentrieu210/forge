name: Purchase Completion Apply

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: purchase-completion-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    name: Apply and verify purchase completion
    if: ${{ github.head_ref == 'feat/purchase-fifo-production-completion-20260731' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          payload="$(tr -d '\r\n' < .github/purchase-completion.patch.gz.b64)"
          actual="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
          expected='6995a2a9aca39363db69b394e447932e0a22186448081ed73bc9efacf4099183'
          printf 'payload_sha256=%s\n' "$actual"
          test "$actual" = "$expected"
          printf '%s' "$payload" | base64 --decode | gzip -dc > /tmp/purchase-completion.patch
          git apply --check /tmp/purchase-completion.patch
          git apply /tmp/purchase-completion.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('client/e2e-forge/playwright.purchase.config.ts')
          text = path.read_text()
          old = '''command: `pnpm --dir client exec vite --config e2e-forge/vite.purchase.config.ts --port ${port}`,
              cwd: path.join(here, "..", ".."),'''
          new = '''command: `pnpm --dir client/apps/runtime exec vite --config ../../e2e-forge/vite.purchase.config.ts --port ${port} --strictPort`,
              cwd: path.join(here, "..", ".."),'''
          if old not in text:
              raise SystemExit('purchase Playwright webServer block was not found')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/purchase-completion.patch.gz.b64
          rm -f .github/purchase-completion-v2.patch.gz.b64
          rm -f .github/workflows/purchase-completion-apply.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm --filter metaforge run lint

      - name: Server unit tests
        run: pnpm --dir server run test:unit

      - name: Server SQL tests
        run: pnpm --dir server run test:sql

      - name: Client tests
        run: pnpm run client:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter e2e-forge exec playwright install --with-deps chromium

      - name: Verify purchase harness Vite
        run: pnpm --dir client/apps/runtime exec vite --version

      - name: Purchase browser QA
        id: purchase_browser
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/purchase-browser"
          pnpm --filter e2e-forge exec playwright test --config playwright.purchase.config.ts \
            2>&1 | tee "$RUNNER_TEMP/purchase-browser/console.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-completion-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/purchase-browser/
            client/e2e-forge/playwright-report/purchase-ui/
            client/e2e-forge/test-results/purchase-ui/
          if-no-files-found: warn
          retention-days: 14

      - name: Report browser failure on PR
        if: ${{ steps.purchase_browser.outputs.status != '0' }}
        uses: actions/github-script@v7
        env:
          PURCHASE_BROWSER_LOG: ${{ runner.temp }}/purchase-browser/console.log
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- purchase-completion-browser-failure -->';
            const path = process.env.PURCHASE_BROWSER_LOG;
            const raw = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No browser log was produced.';
            const tail = raw.split(/\r?\n/).slice(-160).join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Purchase browser QA failed\n\n\`\`\`text\n${tail}\n\`\`\`\n\n[Workflow and artifacts](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Enforce browser QA result
        if: ${{ steps.purchase_browser.outputs.status != '0' }}
        shell: bash
        run: exit 1

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(purchase): complete lifecycle and browser QA'
          git push origin HEAD:feat/purchase-fifo-production-completion-20260731
