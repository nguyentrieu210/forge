name: Purchase Source Snapshot

on:
  push:
    branches:
      - feat/purchase-receipt-complete-20260731
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: purchase-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !**/node_modules/**
            !server/work/**
            !tmp/**
            !**/.env*
          include-hidden-files: true
          retention-days: 1
