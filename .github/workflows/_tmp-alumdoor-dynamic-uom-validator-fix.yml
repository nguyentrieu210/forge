name: Temporary Alumdoor Dynamic UOM Validator Fix

on:
  push:
    branches: ['agent/alumdoor-bom-realdata-continuation']
    paths: ['.github/workflows/_tmp-alumdoor-dynamic-uom-validator-fix.yml']

permissions:
  contents: write

concurrency:
  group: alumdoor-dynamic-uom-validator-fix
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - name: Prepare isolated branch worktree and merge current main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='C:\alumdoor'
          $work="C:\alumdoor-worktrees\dynamic-uom-$env:GITHUB_RUN_ID"
          git -C $source fetch origin main 'agent/alumdoor-bom-realdata-continuation' --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          if (Test-Path $work) { throw "Unexpected existing worktree $work" }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $work) | Out-Null
          git -C $source worktree add --detach $work $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'worktree add failed' }
          Set-Location $work
          git merge --no-edit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'feature branch merge with current main failed' }
          Write-Host "WORKTREE=$work"
          Write-Host "BASE_MAIN=$((git rev-parse origin/main).Trim())"
          Write-Host "MERGED_HEAD=$((git rev-parse HEAD).Trim())"

      - name: Patch measurement-profile authority in both dynamic m2-to-set validators
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $work="C:\alumdoor-worktrees\dynamic-uom-$env:GITHUB_RUN_ID"
          $index=Join-Path $work 'server\apps-src\alumdoor-worker\src\index.ts'
          @'
          import fs from 'node:fs';
          const path=process.argv[2];
          let src=fs.readFileSync(path,'utf8');
          const masterOld=`const dynamicSquareMetreToSet = mode === "Thành phẩm theo m2"\n      && ["m2", "m²", "sqm"].includes(normalizedUom(uom))\n      && ["bộ", "bo", "set"].includes(normalizedUom(stockUom));`;
          const masterNew=`const dynamicSquareMetreToSet = profileName === "Thành phẩm theo m2"\n      && ["m2", "m²", "sqm"].includes(normalizedUom(uom))\n      && ["bộ", "bo", "set"].includes(normalizedUom(stockUom));`;
          if(!src.includes(masterOld)) throw new Error('master dynamic-UOM anchor missing');
          src=src.replace(masterOld,masterNew);
          const transactionMode=`const mode = String(item.inventory_mode ?? "Hàng thường");\n    const linearBasis = side === "sales" ? deriveLinearSalesBasis(item) : undefined;`;
          const transactionModeNew=`const mode = String(item.inventory_mode ?? "Hàng thường");\n    const measurementProfile = String(item.measurement_profile ?? "").trim();\n    const linearBasis = side === "sales" ? deriveLinearSalesBasis(item) : undefined;`;
          if(!src.includes(transactionMode)) throw new Error('transaction measurement-profile anchor missing');
          src=src.replace(transactionMode,transactionModeNew);
          const txOld=`const dynamicSquareMetreToSet = mode === "Thành phẩm theo m2"\n      && SALES_AREA_UOMS.has(selected)\n      && SALES_SET_UOMS.has(normalizedUom(stockUom));`;
          const txNew=`const dynamicSquareMetreToSet = measurementProfile === "Thành phẩm theo m2"\n      && SALES_AREA_UOMS.has(selected)\n      && SALES_SET_UOMS.has(normalizedUom(stockUom));`;
          if(!src.includes(txOld)) throw new Error('transaction dynamic-UOM anchor missing');
          src=src.replace(txOld,txNew);
          const stale=(src.match(/mode === "Thành phẩm theo m2"/g)||[]).length;
          if(stale!==0) throw new Error(`stale inventory_mode dynamic-UOM checks remain=${stale}`);
          fs.writeFileSync(path,src,'utf8');
          console.log('ALUMDOOR_DYNAMIC_UOM_AUTHORITY_PATCH_PASS master=measurement_profile transaction=measurement_profile');
          '@ | Set-Content -LiteralPath (Join-Path $work '.tmp-patch-uom.mjs') -Encoding utf8
          try { & node (Join-Path $work '.tmp-patch-uom.mjs') $index; if ($LASTEXITCODE -ne 0) { throw 'validator patch failed' } }
          finally { Remove-Item (Join-Path $work '.tmp-patch-uom.mjs') -ErrorAction SilentlyContinue }

      - name: Add functional Item-save and Sales-transaction regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $work="C:\alumdoor-worktrees\dynamic-uom-$env:GITHUB_RUN_ID"
          $test=Join-Path $work 'server\tests\alumdoor-item-validator.test.mjs'
          @'
          import fs from 'node:fs';
          const path=process.argv[2];
          let src=fs.readFileSync(path,'utf8');
          const marker='test("Item catalog invariants merge partial saves before checking purchase eligibility"';
          if(!src.includes(marker)) throw new Error('item validator test anchor missing');
          if(src.includes('Item validator accepts canonical finished-door m2 sales UOM without static conversion')) process.exit(0);
          const addition=String.raw`

function canonicalFinishedDoor() {
  return {
    item_code: "FG-M2-SET",
    item_group: "Thành phẩm",
    item_nature: "Hàng tồn kho",
    material_stage: "Thành phẩm",
    supply_type: "Tự sản xuất",
    is_stock_item: 1,
    is_purchase_item: 0,
    is_sales_item: 1,
    is_fixed_asset: 0,
    include_item_in_manufacturing: 1,
    is_sub_contracted_item: 0,
    inventory_mode: "Hàng thường",
    measurement_profile: "Thành phẩm theo m2",
    stock_uom: "Bộ",
    default_purchase_uom: "",
    default_sales_uom: "m2",
    uom_conversions: [],
  };
}

async function validateDocument(doctype, payload, masters = {}) {
  const request = new Request("https://alumdoor.test/hooks/validate", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-cloudforge-tenant": "alu",
      "x-cloudforge-callback": "https://platform.test/",
    },
    body: JSON.stringify({ doctype, name: `${doctype}-TEST`, action: "create", payload }),
  });
  return worker.fetch(
    request,
    { PLATFORM: platformFetcher(masters) },
    { waitUntil() {}, passThroughOnException() {} },
  );
}

test("Item validator accepts canonical finished-door m2 sales UOM without static conversion", async () => {
  const response = await validateItem(canonicalFinishedDoor(), {
    masters: {
      "Item Group:Thành phẩm": { item_group_name: "Thành phẩm", is_group: 0 },
    },
  });
  assert.equal(response.status, 200, await message(response));
});

test("Sales transaction accepts m2 commercial UOM for canonical set-stock finished door without static conversion", async () => {
  const item = canonicalFinishedDoor();
  const response = await validateDocument("Sales Order", {
    company: "ALUMDOOR",
    customer: "KH-TEST",
    items: [{ item_code: item.item_code, qty: 2, uom: "m2" }],
  }, {
    [`Item:${item.item_code}`]: item,
  });
  assert.equal(response.status, 200, await message(response));
});
`;
          src += addition;
          fs.writeFileSync(path,src,'utf8');
          console.log('ALUMDOOR_DYNAMIC_UOM_REGRESSION_TESTS_ADDED');
          '@ | Set-Content -LiteralPath (Join-Path $work '.tmp-add-uom-tests.mjs') -Encoding utf8
          try { & node (Join-Path $work '.tmp-add-uom-tests.mjs') $test; if ($LASTEXITCODE -ne 0) { throw 'test patch failed' } }
          finally { Remove-Item (Join-Path $work '.tmp-add-uom-tests.mjs') -ErrorAction SilentlyContinue }

      - name: Build and run focused validator tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $work="C:\alumdoor-worktrees\dynamic-uom-$env:GITHUB_RUN_ID"
          Set-Location (Join-Path $work 'server')
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }
          node --test tests/alumdoor-item-validator.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'alumdoor item validator tests failed' }
          Write-Host 'ALUMDOOR_DYNAMIC_UOM_VALIDATOR_TEST_PASS'

      - name: Remove temporary workflows, commit functional fix and push feature branch
        shell: powershell
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $work="C:\alumdoor-worktrees\dynamic-uom-$env:GITHUB_RUN_ID"
          Set-Location $work
          Get-ChildItem '.github\workflows' -Filter '_tmp-alumdoor-*.yml' -File -ErrorAction SilentlyContinue | Remove-Item -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/apps-src/alumdoor-worker/src/index.ts server/tests/alumdoor-item-validator.test.mjs server/scripts/lib/alumdoor-item-stock-uom-reconcile.mjs server/scripts/reconcile-alumdoor-item-stock-uom-local.mjs server/scripts/test-alumdoor-item-stock-uom-reconcile.mjs .github/workflows
          $status=@(git status --porcelain=v1)
          $status | ForEach-Object { Write-Host "STAGED $_" }
          if ($status.Count -eq 0) { throw 'No functional changes to publish' }
          git commit -m 'fix(alumdoor): honor measurement profile for dynamic sales UOM'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git remote set-url origin "https://x-access-token:$env:GH_PUSH_TOKEN@github.com/nguyentrieu210/forge.git"
          git push origin HEAD:agent/alumdoor-bom-realdata-continuation
          if ($LASTEXITCODE -ne 0) { throw 'git push feature branch failed' }
          Write-Host "PUBLISHED_HEAD=$((git rev-parse HEAD).Trim())"

      - name: Cleanup isolated worktree
        if: always()
        shell: powershell
        run: |
          $source='C:\alumdoor';$work="C:\alumdoor-worktrees\dynamic-uom-$env:GITHUB_RUN_ID";if(Test-Path $work){git -C $source worktree remove --force $work;git -C $source worktree prune}
