name: Sentrux hotspot probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev
      - name: Build instrumented Sentrux v0.5.7
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/sentrux/sentrux.git /tmp/sentrux-src
          cd /tmp/sentrux-src
          git checkout --quiet 6f8ff3c14b0423e4b58f42d1813d4d5f7fdc1d11
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sentrux-core/src/metrics/mod.rs')
          s = p.read_text()
          start = s.index('fn compute_max_depth(edges: &[ImportEdge], entry_points: &[EntryPoint]) -> u32 {')
          end = s.index('\n// ── Pro metrics extension point', start)
          lines = [
              'fn compute_max_depth(edges: &[ImportEdge], entry_points: &[EntryPoint]) -> u32 {',
              '    if edges.is_empty() { return 0; }',
              '    let (seeds, adj, all_nodes) = find_depth_seeds(edges, entry_points);',
              '    let memo = longest_path_dfs(&seeds, &adj, all_nodes.len());',
              '    let mut ranked: Vec<(&str, u32)> = seeds.iter().filter_map(|s| memo.get(s).map(|d| (*s, *d))).collect();',
              '    ranked.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(b.0)));',
              '    let best = ranked.first().copied();',
              '    if std::env::var_os("SENTRUX_TRACE_DEPTH").is_some() {',
              '        eprintln!("SENTRUX_DEPTH_ENTRY_POINTS={}", entry_points.len());',
              '        eprintln!("SENTRUX_DEPTH_SEEDS={}", seeds.len());',
              '        for (rank, &(start_node, start_depth)) in ranked.iter().take(20).enumerate() {',
              '            eprintln!("SENTRUX_DEPTH_SEED rank={} depth={} file={}", rank + 1, start_depth, start_node);',
              '            if start_depth < 14 { continue; }',
              '            let mut node = start_node;',
              '            let mut depth = start_depth;',
              '            let mut i = 0u32;',
              '            eprintln!("SENTRUX_DEPTH_PATH_BEGIN rank={} depth={}", rank + 1, start_depth);',
              '            loop {',
              '                eprintln!("SENTRUX_DEPTH_PATH rank={} step={:02} {} remaining={}", rank + 1, i, node, depth);',
              '                if depth == 0 { break; }',
              '                let next = adj.get(node).and_then(|ns| ns.iter().filter_map(|n| memo.get(n).map(|d| (*n, *d))).filter(|(_, d)| d.saturating_add(1) == depth).min_by(|a, b| a.0.cmp(b.0)));',
              '                match next { Some((n,d)) => { node=n; depth=d; i+=1; }, None => { eprintln!("SENTRUX_DEPTH_PATH_BROKEN rank={}", rank + 1); break; } }',
              '            }',
              '            eprintln!("SENTRUX_DEPTH_PATH_END rank={}", rank + 1);',
              '        }',
              '    }',
              '    best.map(|(_, d)| d).unwrap_or(0)',
              '}',
          ]
          p.write_text(s[:start] + '\n'.join(lines) + s[end:])
          PY
          cargo build --quiet --release -p sentrux --bin sentrux
          cp target/release/sentrux /tmp/sentrux-trace
      - name: Trace official Forge depth paths after FormView boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          SENTRUX_TRACE_DEPTH=1 /tmp/sentrux-trace gate --save . 2>&1 | tee /tmp/depth-trace.txt
          echo '=== OFFICIAL DEPTH TRACE ==='
          grep 'SENTRUX_DEPTH_' /tmp/depth-trace.txt
          grep -E '^Quality:' /tmp/depth-trace.txt || true
