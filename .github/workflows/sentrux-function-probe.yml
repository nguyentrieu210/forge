name: Sentrux hotspot probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-10k-20260815
      - name: Print hotspot functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def extract(path: str, marker: str) -> str:
              text = Path(path).read_text()
              start = text.index(marker)
              brace = text.index('{', start)
              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('"', "'", '`'):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
                  i += 1
              raise RuntimeError(f'unclosed function: {marker}')

          print('=== VALIDATE_TRANSACTION_LINES ===')
          print(extract('server/apps-src/alumdoor-worker/src/index.ts', 'async function validateTransactionLines('))
          print('=== TENANT_FETCH ===')
          print(extract('server/apps/tenant-worker/src/index-core-base.ts', 'async fetch(request: Request, env: TenantEnv): Promise<Response>'))
          PY
