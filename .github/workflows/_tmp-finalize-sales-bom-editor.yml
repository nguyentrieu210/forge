name: Temporary Finalize Sales BOM Editor
on:
  push:
    branches: ['agent/alumdoor-bom-draft-guidance']
    paths: ['.github/workflows/_tmp-finalize-sales-bom-editor.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply validated Sales BOM patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/_tmp-alumdoor-sales-bom-editor.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow:
              raise SystemExit('Sales BOM patch script start marker missing')
          body = workflow.split(start_marker, 1)[1]
          if end_marker not in body:
              raise SystemExit('Sales BOM patch script end marker missing')
          script = dedent(body.split(end_marker, 1)[0])
          exec(compile(script, 'sales-bom-editor-patch.py', 'exec'), {})
          PY
      - name: Install locked root workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck MetaForge
        run: pnpm --filter metaforge run typecheck
      - name: Verify diff hygiene
        run: git diff --check -- client/packages/views/src/app/vertical/alumdoor
      - name: Commit product change and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_tmp-alumdoor-sales-bom-editor.yml \
            .github/workflows/_tmp-typecheck-bom-editor-base.yml \
            .github/workflows/_tmp-finalize-sales-bom-editor.yml \
            TYPECHECK_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx \
            .github/workflows/_tmp-alumdoor-sales-bom-editor.yml \
            .github/workflows/_tmp-typecheck-bom-editor-base.yml \
            .github/workflows/_tmp-finalize-sales-bom-editor.yml \
            TYPECHECK_DIAGNOSTIC.txt
          git commit -m 'feat(alumdoor): guide actual BOM inputs in sales'
          git push origin HEAD:agent/alumdoor-bom-draft-guidance
