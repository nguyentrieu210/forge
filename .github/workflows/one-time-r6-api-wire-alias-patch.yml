name: One-time R6 API Wire Alias Patch
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-r6-api-wire-alias-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch PR branch through contents API
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo, branch='program/r6-report-alias-relock-20260804';
            async function patch(path, oldText, newText, message){
              const r=await github.rest.repos.getContent({owner,repo,path,ref:branch});
              if(Array.isArray(r.data)) throw new Error(`${path} is not a file`);
              let text=Buffer.from(r.data.content,'base64').toString('utf8');
              if(!text.includes(oldText)) throw new Error(`${path}: patch target not found exactly`);
              text=text.replace(oldText,newText);
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,sha:r.data.sha,message,content:Buffer.from(text).toString('base64')});
            }
            await patch(
              'server/packages/app-registry/src/manifest.ts',
              `  if (report.group_by !== dimensions[0]) throw errors.validation(\`charts[\${index}] dimension must match report group_by (\${report.group_by ?? "none"})\`);\n  const columns = new Map(report.columns.map((column) => [column.field, column]));\n  if (!columns.has(dimensions[0]!)) throw errors.validation(\`charts[\${index}] dimension is not a report column: \${dimensions[0]}\`);\n  for (const measure of measures) {\n    const column = columns.get(measure);\n    if (!column?.aggregate) throw errors.validation(\`charts[\${index}] measure must be an aggregated report column: \${measure}\`);\n  }\n`,
              `  // Query reports expose aggregate columns under their wire aliases, not source\n  // fieldnames: sum(grand_total) -> sum_grand_total, count(name) -> count_name.\n  // Charts are persisted/rendered against that response shape, so validate exactly the\n  // names the report endpoint returns.\n  const wireField = (column: AppReportColumn): string => column.aggregate\n    ? \`\${column.aggregate}_\${column.field}\`\n    : column.field;\n  const wireColumns = report.columns.map((column) => [wireField(column), column] as const);\n  assertUnique(wireColumns.map(([field]) => field), \`reports[\${index}] wire column\`);\n  const columns = new Map(wireColumns);\n  const groupByColumn = report.columns.find((column) => !column.aggregate && column.field === report.group_by);\n  const groupByWireField = groupByColumn ? wireField(groupByColumn) : report.group_by;\n  if (groupByWireField !== dimensions[0]) throw errors.validation(\`charts[\${index}] dimension must match report group_by (\${groupByWireField ?? "none"})\`);\n  if (!columns.has(dimensions[0]!)) throw errors.validation(\`charts[\${index}] dimension is not a report column: \${dimensions[0]}\`);\n  for (const measure of measures) {\n    const column = columns.get(measure);\n    if (!column?.aggregate) throw errors.validation(\`charts[\${index}] measure must be an aggregated report column: \${measure}\`);\n  }\n`,
              'fix(r6): validate charts against aggregate report wire aliases'
            );
            await patch(
              'server/scripts/lib/verify-installed-app.mjs',
              `      const reportColumns = new Set(report.columns.map((column) => column.field));\n      for (const field of [...chart.dimensions, ...chart.measures]) {\n        if (!reportColumns.has(field)) throw new Error(\`chart report \${chart.source} is missing column \${field}\`);\n      }\n`,
              `      const reportColumns = new Set(report.columns.map((column) => column.aggregate ? \`\${column.aggregate}_\${column.field}\` : column.field));\n      for (const field of [...chart.dimensions, ...chart.measures]) {\n        if (!reportColumns.has(field)) throw new Error(\`chart report \${chart.source} is missing wire column \${field}\`);\n      }\n`,
              'fix(r6): verify installed charts against report wire aliases'
            );
            await patch(
              'server/tests/app-registry.test.mjs',
              `  const chart = {\n    name: "Stock chart",\n    source: report.name,\n    type: "Bar",\n    dimensions: ["warehouse"],\n    measures: ["amount"],\n    roles: ["Kho User"],\n    drilldown: { route: "/report/Stock%20by%20warehouse" },\n    emptyFallback: "table",\n  };\n  assert.doesNotThrow(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [chart] }));\n  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, source: "Ghost" }] }), /declared report/);\n  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["name"] }] }), /aggregated report column/);\n`,
              `  const chart = {\n    name: "Stock chart",\n    source: report.name,\n    type: "Bar",\n    dimensions: ["warehouse"],\n    measures: ["sum_amount"],\n    roles: ["Kho User"],\n    drilldown: { route: "/report/Stock%20by%20warehouse" },\n    emptyFallback: "table",\n  };\n  assert.doesNotThrow(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [chart] }));\n  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, source: "Ghost" }] }), /declared report/);\n  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["amount"] }] }), /aggregated report column/);\n  assert.throws(() => manifest({ doctypes: [request], externalDocTypes: [], reports: [report], nav, charts: [{ ...chart, measures: ["name"] }] }), /aggregated report column/);\n`,
              'test(r6): lock app-registry aggregate wire aliases'
            );
            await patch(
              '.github/workflows/r6-pass-convergence.yml',
              `      - name: Verify App Factory report/chart wire aliases\n        working-directory: server\n        run: node --test tests/app-factory-report-chart-alias.test.mjs\n`,
              `      - name: Verify App Factory and app-registry report/chart wire aliases\n        working-directory: server\n        run: node --test tests/app-registry.test.mjs tests/app-factory-report-chart-alias.test.mjs\n`,
              'ci(r6): gate parser and compiler wire alias contract'
            );
