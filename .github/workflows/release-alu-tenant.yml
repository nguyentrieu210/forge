name: Release alu Tenant Worker Production

on:
  push:
    branches:
      - hotfix/alumdoor-print-list-delete
    paths:
      - "server/apps/tenant-worker/**"
      - "server/packages/**"
      - "server/scripts/backup-tenant.mjs"
      - "server/scripts/migrate-tenant.mjs"
      - "server/scripts/deploy-tenant.mjs"
      - "server/package.json"
      - "pnpm-lock.yaml"
      - ".github/release/alu-tenant-production.trigger"
      - ".github/workflows/release-alu-tenant.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Verified commit SHA to release; defaults to the selected ref SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-alu-tenant-production
  cancel-in-progress: false

jobs:
  release-alu-tenant:
    name: Backup, migrate, deploy and smoke alu tenant
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      TENANT: alu
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EVIDENCE_DIR: ${{ runner.temp }}/alu-tenant-release-evidence
      BACKUP_DIR: ${{ runner.temp }}/alu-tenant-backup

    steps:
      - name: Checkout selected code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$TENANT" = "alu"
          test -n "$TARGET_SHA"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TARGET_SHA")"
          mkdir -p "$EVIDENCE_DIR" "$BACKUP_DIR"
          printf 'run_id=%s\ntarget_sha=%s\ntenant=%s\nstarted_at=%s\nfifo_rollout=disabled\n' \
            "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" "$TENANT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$EVIDENCE_DIR/state.txt"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server artifacts
        run: pnpm --filter cloudforge run build

      - name: Run physical-stock regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            server/tests/physical-stock-read-model.test.mjs \
            server/tests/physical-stock-report-service.test.mjs \
            server/tests/d1-physical-stock-ledger-reader.test.mjs \
            server/tests/physical-stock-api.test.mjs \
            2>&1 | tee "$EVIDENCE_DIR/physical-stock-tests.log"
          echo 'physical_stock_regression=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Backup tenant
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/backup-dry.log"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$BACKUP_DIR" 2>&1 | tee "$EVIDENCE_DIR/backup-live.log"
          echo 'backup=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Upload pre-release backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-tenant-pre-release-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-tenant-backup/
          if-no-files-found: error
          retention-days: 14

      - name: Migrate tenant
        shell: bash
        run: |
          set -euo pipefail
          cd server
          node scripts/migrate-tenant.mjs --tenant "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/migrate-dry.log"
          node scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/migrate-live.log"
          echo 'migration=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy tenant Worker
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/alu-tenant-release-evidence/wrangler-output.ndjson
        run: |
          set -euo pipefail
          cd server
          node scripts/deploy-tenant.mjs --tenant "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/deploy-dry.log"
          node scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" 2>&1 | tee "$EVIDENCE_DIR/deploy-live.log"
          echo 'deploy=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://alu.kairo.vn'
          health=0
          for attempt in $(seq 1 18); do
            health="$(curl --silent --show-error --output "$EVIDENCE_DIR/health.json" --write-out '%{http_code}' "$BASE/health" || true)"
            [ "$health" = '200' ] && break
            sleep 5
          done
          test "$health" = '200'
          boot="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' "$BASE/api/method/metaforge.api.get_boot" || true)"
          test "$boot" = '403'
          physical_stock="$(curl --silent --show-error --output "$EVIDENCE_DIR/physical-stock-guest.json" --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' --data '{"company":"Alumdoor"}' \
            "$BASE/api/v1/reports/physical-stock" || true)"
          case "$physical_stock" in
            401|403) ;;
            *) echo "Unexpected unauthenticated physical-stock status: $physical_stock" >&2; exit 1 ;;
          esac
          printf 'health=%s\nguest_boot=%s\nphysical_stock_guest=%s\nsmoke=pass\n' \
            "$health" "$boot" "$physical_stock" >> "$EVIDENCE_DIR/state.txt"

      - name: Extract provider version evidence
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(node -e "const fs=require('fs');const p=process.env.EVIDENCE_DIR+'/wrangler-output.ndjson';const rows=fs.readFileSync(p,'utf8').trim().split(/\\r?\\n/).filter(Boolean).map(x=>JSON.parse(x));const row=[...rows].reverse().find(x=>x.type==='deploy'&&x.version_id);process.stdout.write(row?.version_id||'')")"
          test -n "$version_id"
          printf 'tenant_worker=cloudforge-tenant-alu\ntenant_version_id=%s\nprovider_evidence=pass\n' "$version_id" >> "$EVIDENCE_DIR/state.txt"

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# alu Tenant Worker production release'
            echo
            echo '```text'
            cat "$EVIDENCE_DIR/state.txt" 2>/dev/null || echo 'state.txt missing'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-tenant-production-release-${{ github.run_id }}
          path: ${{ runner.temp }}/alu-tenant-release-evidence/
          if-no-files-found: warn
          retention-days: 30
