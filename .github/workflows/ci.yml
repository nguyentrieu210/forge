name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  release-alu:
    name: Release alu production
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release/execute-alu-production-20260731' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: production-alu
      cancel-in-progress: false
    env:
      TENANT: alu
      TARGET_SHA: 60c604de69804b9daf9fb90bf9a5d6e86bb3af2d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      EVIDENCE_DIR: /tmp/alu-release-evidence
      BACKUP_DIR: /tmp/alu-backup

    steps:
      - name: Checkout verified code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$TENANT" = "alu"
          test "$TARGET_SHA" = "60c604de69804b9daf9fb90bf9a5d6e86bb3af2d"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          mkdir -p "$EVIDENCE_DIR" "$BACKUP_DIR"
          printf 'run_id=%s\ntarget_sha=%s\nstarted_at=%s\n' \
            "$GITHUB_RUN_ID" "$TARGET_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$EVIDENCE_DIR/state.txt"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backup tenant
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/backup-dry.log"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$BACKUP_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/backup-live.log"
          echo 'backup=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-pre-release-backup-${{ github.run_id }}
          path: /tmp/alu-backup/
          if-no-files-found: warn
          retention-days: 14

      - name: Migrate tenant
        shell: bash
        run: |
          set -euo pipefail
          cd server
          node scripts/migrate-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/migrate-dry.log"
          node scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/migrate-live.log"
          echo 'migration=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy tenant
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: /tmp/alu-release-evidence/wrangler-output.ndjson
        run: |
          set -euo pipefail
          cd server
          node scripts/deploy-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/deploy-dry.log"
          node scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/deploy-live.log"
          echo 'deploy=pass' >> "$EVIDENCE_DIR/state.txt"

      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://alu.kairo.vn'
          health=0
          for attempt in $(seq 1 18); do
            health="$(curl --silent --show-error --output "$EVIDENCE_DIR/health.json" --write-out '%{http_code}' "$BASE/health" || true)"
            [ "$health" = '200' ] && break
            sleep 5
          done
          [ "$health" = '200' ]
          boot="$(curl --silent --show-error --output "$EVIDENCE_DIR/guest-boot.json" --write-out '%{http_code}' "$BASE/api/method/metaforge.api.get_boot" || true)"
          [ "$boot" = '403' ]
          printf 'health=%s\nguest_boot=%s\nsmoke=pass\n' "$health" "$boot" >> "$EVIDENCE_DIR/state.txt"

      - name: Collect deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = process.env.EVIDENCE_DIR;
          const wranglerPath = `${dir}/wrangler-output.ndjson`;
          const rows = fs.readFileSync(wranglerPath, 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const deploy = [...rows].reverse().find((entry) =>
            entry.type === 'deploy' &&
            entry.worker_name === 'cloudforge-tenant-alu' &&
            entry.version_id
          );
          if (!deploy?.version_id) {
            throw new Error('Wrangler NDJSON did not contain the tenant Worker version ID');
          }
          const summary = {
            target_sha: process.env.TARGET_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            worker_name: deploy.worker_name,
            version_id: deploy.version_id,
            deployment_created_on: deploy.timestamp ?? null,
            migrations: 'all recorded tenant migrations',
            fifo_rollout_enabled: false,
            health: 200,
            guest_boot: 403,
            passed: true,
          };
          fs.writeFileSync(`${dir}/summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          const md = [
            '# alu production release',
            '',
            `- Target SHA: \`${summary.target_sha}\``,
            `- Worker: \`${summary.worker_name}\``,
            `- Version ID: \`${summary.version_id}\``,
            `- Deployment time: \`${summary.deployment_created_on ?? 'not returned'}\``,
            '- Recorded tenant migrations: PASS',
            '- FIFO rollout remains disabled: PASS',
            '- Health: 200',
            '- Guest boot: 403',
            '',
            '**Overall: PASS**',
          ].join('\n');
          fs.writeFileSync(`${dir}/summary.md`, `${md}\n`);
          NODE

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-production-release-${{ github.run_id }}
          path: /tmp/alu-release-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Report release result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const dir = process.env.EVIDENCE_DIR;
            const summary = fs.existsSync(`${dir}/summary.md`)
              ? fs.readFileSync(`${dir}/summary.md`, 'utf8')
              : `# alu production release\n\n**Overall: FAIL**\n\n\`\`\`text\n${fs.existsSync(`${dir}/state.txt`) ? fs.readFileSync(`${dir}/state.txt`, 'utf8') : 'No state file'}\n\`\`\``;
            const marker = '<!-- alu-production-release -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${summary}\n[Workflow and artifacts](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
