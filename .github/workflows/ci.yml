name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          full=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
            if ! grep -Eq '^(server/|client/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig[^/]*\.json$|\.github/workflows/)' "$RUNNER_TEMP/changed-files.txt"; then
              full=false
            fi
          else
            printf '%s\n' 'workflow_dispatch_or_missing_base' > "$RUNNER_TEMP/changed-files.txt"
          fi
          cat "$RUNNER_TEMP/changed-files.txt"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Docs-only fast path
        if: steps.scope.outputs.full != 'true'
        run: echo "No application, package, or workflow files changed; full CI skipped."

      - name: Install pnpm
        if: steps.scope.outputs.full == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.full == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/ci-test.log"

      - name: Upload temporary test diagnostics
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-log
          path: ${{ runner.temp }}/ci-test.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Run typecheck
        if: steps.scope.outputs.full == 'true'
        run: pnpm typecheck

      - name: Build
        if: steps.scope.outputs.full == 'true'
        run: pnpm build
