name: ALU Build and Deploy

on:
  push:
    branches:
      - "hotfix/ui-*"
      - "fix/ui-*"
      - "feat/ui-*"
      - "refactor/ui-*"
    paths:
      - "client/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type alu to confirm production deploy
        required: true
        type: string
      target_sha:
        description: Exact commit SHA to build and deploy; defaults to selected ref SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && format('ui-deploy-{0}', github.ref) || 'production-alu-build-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  ui-auto-deploy:
    name: Fast UI build and deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_FORGE_RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout UI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Guard this push as UI-only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(jq -r '[.commits[]? | (.added[]?, .modified[]?, .removed[]?)] | unique[]' "$GITHUB_EVENT_PATH")
          if [ "${#changed[@]}" -eq 0 ]; then
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          fi
          test "${#changed[@]}" -gt 0

          has_client=false
          for file in "${changed[@]}"; do
            case "$file" in
              client/*) has_client=true ;;
              RUNBOOK.md|CURRENT_STATUS.md|NEXT_TASKS.md|AI_HANDOFF.md|DELIVERY_POLICY.md) ;;
              *)
                echo "Blocked non-UI file in UI auto-deploy push: $file"
                exit 1
                ;;
            esac
          done
          test "$has_client" = true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from cache
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Gateway UI only
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter runtime... run build
          pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json
          pnpm --dir client/apps/kho exec vite build --config vite.mobile.config.ts

      - name: Stage UI bundle
        run: node server/scripts/stage-client-bundle.mjs

      - name: Deploy Gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Smoke exact release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://alu.kairo.vn/health >/dev/null
          curl --fail --silent --show-error "https://alu.kairo.vn/release.json?sha=$TARGET_SHA" -o "$RUNNER_TEMP/release.json"
          node - "$RUNNER_TEMP/release.json" <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (release.releaseSha !== process.env.TARGET_SHA) {
            throw new Error(`Production release mismatch: expected ${process.env.TARGET_SHA}, got ${release.releaseSha ?? '<missing>'}`);
          }
          if (!release.bundleHash) throw new Error('Production release marker has no bundleHash');
          console.log(`PRODUCTION_RELEASE_OK sha=${release.releaseSha} bundle=${release.bundleHash}`);
          NODE

  build-deploy:
    name: Build and deploy ALU
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'alu'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      TENANT: alu
      APP_WORKER: cloudforge-app-alumdoor
      DISPATCH_NAMESPACE: cloudforge-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_FORGE_RELEASE_SHA: ${{ inputs.target_sha || github.sha }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build once
        run: |
          pnpm --filter cloudforge run build
          pnpm --filter metaforge run build
          node server/scripts/stage-client-bundle.mjs

      - name: Backup and migrate tenant
        working-directory: server
        run: |
          node scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$RUNNER_TEMP/alu-backup"
          node scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Deploy tenant Worker
        working-directory: server
        run: node scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Deploy Alumdoor app Worker
        working-directory: server
        run: |
          pnpm exec wrangler deploy \
            --config apps-src/alumdoor-worker/wrangler.jsonc \
            --name "$APP_WORKER" \
            --dispatch-namespace "$DISPATCH_NAMESPACE" \
            --strict

      - name: Deploy Gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Smoke exact release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://alu.kairo.vn/health >/dev/null
          curl --fail --silent --show-error "https://alu.kairo.vn/release.json?sha=$TARGET_SHA" -o "$RUNNER_TEMP/release.json"
          node - "$RUNNER_TEMP/release.json" <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (release.releaseSha !== process.env.TARGET_SHA) {
            throw new Error(`Production release mismatch: expected ${process.env.TARGET_SHA}, got ${release.releaseSha ?? '<missing>'}`);
          }
          if (!release.bundleHash) throw new Error('Production release marker has no bundleHash');
          console.log(`PRODUCTION_RELEASE_OK sha=${release.releaseSha} bundle=${release.bundleHash}`);
          NODE