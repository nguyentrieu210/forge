name: ALU Build and Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type alu to confirm production deploy
        required: true
        type: string
      target_sha:
        description: Exact commit SHA to build and deploy; defaults to selected ref SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-alu-build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build and deploy production
    if: inputs.confirm == 'alu'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server and UI
        run: |
          pnpm --filter cloudforge run build
          pnpm --filter metaforge run build
          node server/scripts/stage-client-bundle.mjs

      - name: Deploy Gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc
