name: Execute Approved Alumdoor Item Import Once

on:
  workflow_run:
    workflows:
      - Reconcile Alumdoor Local Source and UOM
    types: [completed]

permissions:
  contents: read

concurrency:
  group: alumdoor-approved-item-import-once
  cancel-in-progress: false

jobs:
  import-once:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, 'execute approved Item import once')
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - name: Guard exact reconciled main and locate approved source
        id: guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $source = 'C:\alumdoor\local-imports\alumdoor-item-source-records.json'
          $expected = '${{ github.event.workflow_run.head_sha }}'

          $branch = (git -C $target rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'main') { throw "Local checkout is on '$branch', expected main." }
          $dirty = @(git -C $target status --porcelain=v1)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host "DIRTY $_" }
            throw 'Local source is dirty; refusing approved Item import.'
          }
          git -C $target fetch origin main --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch origin main failed' }
          $local = (git -C $target rev-parse HEAD).Trim()
          $remote = (git -C $target rev-parse origin/main).Trim()
          if ($local -ne $remote -or $local -ne $expected) {
            throw "Approved import requires exact reconciled main: local=$local remote=$remote expected=$expected"
          }
          & node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit([200,401,403].includes(r.status)?0:1)).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) { throw 'Local backend 8799 is not healthy.' }

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            Write-Host "ALUMDOOR_ITEM_IMPORT_SOURCE_MISSING path=$source"
            'run_import=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $runDir = "C:\alumdoor\local-backups\item-master-imports\approved-$stamp"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          "run_import=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_dir=$runDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ALUMDOOR_ITEM_IMPORT_SOURCE_FOUND path=$source run_dir=$runDir"

      - name: Verify canonical UOM 19
        if: steps.guard.outputs.run_import == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'C:\alumdoor\server'
          $output = Join-Path '${{ steps.guard.outputs.run_dir }}' 'uom-preimage.json'
          $env:FORGE_ORIGIN = 'http://127.0.0.1:8799'
          $env:FORGE_ADMIN_USER = 'dev@example.com'
          $env:FORGE_ADMIN_PASSWORD = 'local-dev-password-1'
          & node scripts\backup-alumdoor-uom-local.mjs $output
          $exit = $LASTEXITCODE
          Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          if ($exit -ne 0) { throw 'Authenticated UOM pre-image failed.' }
          $uom = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          if ([int]$uom.canonical_count -ne 19 -or [int]$uom.existing_count -ne 19) {
            throw "Local canonical UOM set is incomplete: existing=$($uom.existing_count) canonical=$($uom.canonical_count)"
          }
          Write-Host 'ALUMDOOR_ITEM_IMPORT_UOM_19_PASS'

      - name: Build zero-blocker canonical Item payload
        if: steps.guard.outputs.run_import == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'C:\alumdoor\server'
          $payload = Join-Path '${{ steps.guard.outputs.run_dir }}' 'item-master-payload.json'
          $audit = Join-Path '${{ steps.guard.outputs.run_dir }}' 'item-master-audit.json'
          & node scripts\build-alumdoor-item-master-payload.mjs '${{ steps.guard.outputs.source }}' $payload $audit
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Item master payload is blocked; no import attempted.' }
          $report = Get-Content -Raw -LiteralPath $audit | ConvertFrom-Json
          if ([int]$report.item_master_blocker_count -ne 0 -or [int]$report.other_blocker_count -ne 0 -or [int]$report.item_payload_blocker_count -ne 0) {
            throw 'Item master audit is not zero-blocker.'
          }
          Write-Host "ALUMDOOR_ITEM_IMPORT_PAYLOAD_READY items=$($report.item_payload_count) bom_blockers_retained=$($report.bom_blocker_count)"

      - name: Import exact-code Item master through local API
        if: steps.guard.outputs.run_import == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'C:\alumdoor\server'
          $payload = Join-Path '${{ steps.guard.outputs.run_dir }}' 'item-master-payload.json'
          $preimage = Join-Path '${{ steps.guard.outputs.run_dir }}' 'item-preimage.json'
          & node scripts\import-alumdoor-item-master-local.mjs $payload --validate-only
          if ($LASTEXITCODE -ne 0) { throw 'Importer validate-only gate failed.' }
          $env:FORGE_ORIGIN = 'http://127.0.0.1:8799'
          $env:FORGE_ADMIN_USER = 'dev@example.com'
          $env:FORGE_ADMIN_PASSWORD = 'local-dev-password-1'
          & node scripts\import-alumdoor-item-master-local.mjs $payload $preimage
          $exit = $LASTEXITCODE
          Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          if ($exit -ne 0) { throw 'Approved local Item import failed.' }
          Write-Host "ALUMDOOR_APPROVED_ITEM_IMPORT_PASS run_dir=${{ steps.guard.outputs.run_dir }}"

      - name: Report no-op when source is absent
        if: steps.guard.outputs.run_import == 'false'
        shell: powershell
        run: |
          Write-Host 'ALUMDOOR_APPROVED_ITEM_IMPORT_NOOP_SOURCE_MISSING'
