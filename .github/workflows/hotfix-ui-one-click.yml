name: ALU UI Hotfix - Auto Deploy
run-name: UI hotfix ${{ github.event.pull_request.head.ref || github.ref_name }} @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - "hotfix/ui-*"
    paths:
      - "client/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "client/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alu-ui-hotfix-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build bundle and deploy Gateway
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'hotfix/ui-'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_FORGE_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact hotfix SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate UI hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Hotfix branch must contain current main before production deploy."
            exit 1
          }

          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changes relative to main."
            exit 1
          fi

          has_client=false
          for file in "${changed[@]}"; do
            case "$file" in
              client/*) has_client=true ;;
              CURRENT_STATUS.md|NEXT_TASKS.md|AI_HANDOFF.md) ;;
              *)
                echo "Blocked non-UI hotfix file: $file"
                exit 1
                ;;
            esac
          done

          [ "$has_client" = true ] || {
            echo "Hotfix must contain at least one client/** change."
            exit 1
          }

          file_count="${#changed[@]}"
          line_count="$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          if [ "$file_count" -gt 10 ] || [ "$line_count" -gt 300 ]; then
            echo "Hotfix exceeds fast-lane limit: ${file_count} files, ${line_count} changed lines."
            exit 1
          fi

          printf 'Validated UI hotfix: %s files, %s changed lines\n' "$file_count" "$line_count"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI bundle
        run: pnpm --filter metaforge run build

      - name: Stage bundle into Gateway
        run: node server/scripts/stage-client-bundle.mjs

      - name: Deploy Gateway production
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc
