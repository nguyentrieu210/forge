name: ALU UI Hotfix - One Click Deploy
run-name: UI hotfix ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alu-ui-hotfix-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy UI
    uses: ./.github/workflows/release-gateway.yml
    with:
      target_sha: ${{ github.sha }}
      quick_ui_hotfix: true
    secrets: inherit
