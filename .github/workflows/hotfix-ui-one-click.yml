name: ALU UI Hotfix - One Click Deploy
run-name: UI hotfix ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: alu-ui-hotfix-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tiny UI-only hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.scope.outputs.target_sha }}

    steps:
      - name: Checkout selected hotfix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce tiny UI scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          case "$branch" in
            hotfix/ui-*) ;;
            *)
              echo "Only hotfix/ui-* branches can use this lane; got: $branch" >&2
              exit 1
              ;;
          esac

          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          target_sha="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor "$main_sha" "$target_sha"; then
            echo "Hotfix is stale. Recreate it from current main." >&2
            exit 1
          fi

          mapfile -t files < <(git diff --name-only "$main_sha...$target_sha")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changes found versus current main." >&2
            exit 1
          fi
          if [ "${#files[@]}" -gt 10 ]; then
            echo "Quick UI lane is capped at 10 changed files; got ${#files[@]}." >&2
            exit 1
          fi

          has_client_change=false
          for file in "${files[@]}"; do
            case "$file" in
              client/*)
                has_client_change=true
                ;;
              CURRENT_STATUS.md|NEXT_TASKS.md|AI_HANDOFF.md)
                ;;
              *)
                echo "Not allowed in quick UI lane: $file" >&2
                exit 1
                ;;
            esac

            case "$file" in
              package.json|pnpm-lock.yaml|*/package.json)
                echo "Dependency changes require normal release flow: $file" >&2
                exit 1
                ;;
            esac
          done

          if [ "$has_client_change" != true ]; then
            echo "Quick UI lane requires at least one client/** change." >&2
            exit 1
          fi

          changed_lines="$(git diff --numstat "$main_sha...$target_sha" | awk '
            BEGIN { total = 0 }
            $1 ~ /^[0-9]+$/ { total += $1 }
            $2 ~ /^[0-9]+$/ { total += $2 }
            END { print total }
          ')"
          if [ "$changed_lines" -gt 300 ]; then
            echo "Quick UI lane is capped at 300 changed text lines; got $changed_lines." >&2
            exit 1
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          {
            echo "target_sha=$target_sha"
            echo "main_sha=$main_sha"
            echo "changed_files=${#files[@]}"
            echo "changed_lines=$changed_lines"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Quick build, deploy and smoke
    needs: validate
    uses: ./.github/workflows/release-gateway.yml
    with:
      target_sha: ${{ needs.validate.outputs.target_sha }}
      quick_ui_hotfix: true
    secrets: inherit

  reconcile:
    name: Reconcile source after deploy
    needs: [validate, release]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Create or annotate reconciliation PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "hotfix(ui): reconcile ${branch#hotfix/ui-}" \
              --body "UI hotfix deployed from exact SHA \`$TARGET_SHA\` by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Merge this branch back to main after normal repository checks pass."
          else
            gh pr comment "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "UI hotfix deployed from exact SHA \`$TARGET_SHA\` by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi
