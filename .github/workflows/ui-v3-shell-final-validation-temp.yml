name: UI V3 Shell Final Validation Temp

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ui-v3-shell-final-validation-temp.yml"

permissions:
  contents: read

jobs:
  shell:
    if: github.head_ref == 'ui/v3-02-shell-exec-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current PR merge result
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Shell typecheck
        run: pnpm --filter @metaforge/shell run typecheck
      - name: Shell build
        run: pnpm --filter @metaforge/shell run build
      - name: Runtime production build
        run: pnpm --filter runtime... run build
      - name: Shell mobile regression
        run: node client/scripts/check-app-shell-mobile.mjs
      - name: Workspace navigation selfcheck
        working-directory: client
        run: pnpm --filter @metaforge/demo exec tsx ../../packages/shell/src/workspace-navigation-selfcheck.ts
      - name: Full client typecheck
        run: pnpm run client:typecheck
      - name: Client selfchecks
        run: pnpm --filter metaforge run test
