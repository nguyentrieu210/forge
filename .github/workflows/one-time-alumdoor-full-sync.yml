# Retry with server-only pre-migration build; frontend build happens after metadata install.
name: One-time ALU Full Alumdoor Sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-alumdoor-full-sync.yml"

permissions:
  contents: write

concurrency:
  group: production-alu-full-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ALU metadata workers and UI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}
      TENANT: alu
      ORIGIN: https://alu.kairo.vn
      APP_WORKER: cloudforge-app-alumdoor
      DISPATCH_NAMESPACE: cloudforge-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD }}
      VITE_FORGE_RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact release revision
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Require production credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$FORGE_ADMIN_PASSWORD" || { echo "Missing FORGE_ADMIN_PASSWORD"; exit 1; }

      - name: Set up pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build server release artifacts
        id: build
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter cloudforge run build

      - name: Validate all app packages
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/forge-app.mjs server/apps-src/hrm --dry-run
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting --dry-run
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run

      - name: Verify clean worktree before migration
        id: clean_worktree
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { meaningfulGitStatus } from "./server/scripts/git-worktree.mjs";
          const status = execFileSync("git", ["status", "--porcelain"], { encoding: "utf8" });
          if (meaningfulGitStatus(status)) {
            console.error("Meaningful dirty worktree before migration:\n" + status);
            process.exit(1);
          }
          console.log("worktree clean for production migration");
          NODE

      - name: Backup ALU tenant
        id: backup
        run: node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$RUNNER_TEMP/alu-before-full-sync"

      - name: Apply tenant migrations
        id: migrate
        run: node server/scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Deploy current tenant Worker
        id: deploy_tenant
        run: node server/scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT"

      - name: Install or upgrade HRM metadata
        id: install_hrm
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_USER="${FORGE_ADMIN_USER:-admin}"
          set +e
          node server/scripts/forge-app.mjs server/apps-src/hrm --origin "$ORIGIN" --admin "$ADMIN_USER" 2>&1 | tee "$RUNNER_TEMP/full-sync-hrm.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Install or upgrade VN Accounting metadata
        id: install_vn_accounting
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_USER="${FORGE_ADMIN_USER:-admin}"
          set +e
          node server/scripts/forge-app.mjs server/apps-src/vn-accounting --origin "$ORIGIN" --admin "$ADMIN_USER" 2>&1 | tee "$RUNNER_TEMP/full-sync-vn-accounting.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Install or upgrade Alumdoor metadata and sidebar
        id: install_alumdoor
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_USER="${FORGE_ADMIN_USER:-admin}"
          set +e
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --origin "$ORIGIN" --admin "$ADMIN_USER" 2>&1 | tee "$RUNNER_TEMP/full-sync-alumdoor.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Build current Gateway UI
        id: build_gateway
        run: pnpm --filter metaforge run build

      - name: Deploy current Alumdoor app Worker
        id: deploy_app_worker
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy \
            --config apps-src/alumdoor-worker/wrangler.jsonc \
            --name "$APP_WORKER" \
            --dispatch-namespace "$DISPATCH_NAMESPACE" \
            --strict

      - name: Stage current Gateway UI bundle
        id: stage_gateway
        run: node server/scripts/stage-client-bundle.mjs

      - name: Deploy current Gateway UI
        id: deploy_gateway
        run: pnpm --dir server exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc

      - name: Verify production release
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="$ORIGIN"
          health=0
          root=0
          release_ok=0
          for attempt in $(seq 1 12); do
            health="$(curl --silent --show-error --output /tmp/alu-health.json --write-out '%{http_code}' "$BASE/health?sync=$TARGET_SHA-$attempt" || true)"
            root="$(curl --silent --show-error --output /tmp/alu-root.html --write-out '%{http_code}' "$BASE/?sync=$TARGET_SHA-$attempt" || true)"
            if [ "$health" = '200' ] && [ "$root" = '200' ]; then break; fi
            sleep 5
          done
          test "$health" = '200'
          test "$root" = '200'
          guest_boot="$(curl --silent --show-error --output /tmp/alu-guest-boot.json --write-out '%{http_code}' "$BASE/api/method/metaforge.api.get_boot" || true)"
          test "$guest_boot" = '403'
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$BASE/release.json?sync=$TARGET_SHA-$attempt" > /tmp/alu-release.json || true
            if node -e 'const fs=require("fs");let x={};try{x=JSON.parse(fs.readFileSync("/tmp/alu-release.json","utf8"))}catch{};process.exit(x.releaseSha===process.env.TARGET_SHA && x.bundleHash ? 0 : 1)'; then
              release_ok=1
              break
            fi
            sleep 5
          done
          test "$release_ok" = '1'

      - name: Record successful full sync evidence
        id: success_evidence
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const fs = require('fs');
            const release = JSON.parse(fs.readFileSync('/tmp/alu-release.json', 'utf8'));
            const path = 'deploy-evidence/alu-full-sync.json';
            const payload = {
              deployedSha: process.env.DEPLOYED_SHA,
              tenant: 'alu',
              origin: 'https://alu.kairo.vn',
              apps: ['hrm', 'vn-accounting', 'alumdoor'],
              metadata: true,
              tenantWorker: true,
              alumdoorWorker: true,
              gatewayUI: true,
              sidebarFromCurrentManifest: true,
              releaseSha: release.releaseSha,
              bundleHash: release.bundleHash,
              completedAt: new Date().toISOString(),
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `ops: record ALU full sync ${process.env.DEPLOYED_SHA.slice(0, 12)}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {}),
            });

      - name: Record failed full sync evidence
        if: ${{ failure() }}
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.TARGET_SHA }}
          HRM_LOG_PATH: ${{ runner.temp }}/full-sync-hrm.log
          VN_LOG_PATH: ${{ runner.temp }}/full-sync-vn-accounting.log
          ALUMDOOR_LOG_PATH: ${{ runner.temp }}/full-sync-alumdoor.log
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_CREDENTIALS: ${{ steps.credentials.outcome }}
          O_DEPENDENCIES: ${{ steps.dependencies.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_VALIDATE: ${{ steps.validate.outcome }}
          O_CLEAN_WORKTREE: ${{ steps.clean_worktree.outcome }}
          O_BACKUP: ${{ steps.backup.outcome }}
          O_MIGRATE: ${{ steps.migrate.outcome }}
          O_DEPLOY_TENANT: ${{ steps.deploy_tenant.outcome }}
          O_INSTALL_HRM: ${{ steps.install_hrm.outcome }}
          O_INSTALL_VN: ${{ steps.install_vn_accounting.outcome }}
          O_INSTALL_ALUMDOOR: ${{ steps.install_alumdoor.outcome }}
          O_BUILD_GATEWAY: ${{ steps.build_gateway.outcome }}
          O_DEPLOY_APP: ${{ steps.deploy_app_worker.outcome }}
          O_STAGE_GATEWAY: ${{ steps.stage_gateway.outcome }}
          O_DEPLOY_GATEWAY: ${{ steps.deploy_gateway.outcome }}
          O_SMOKE: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const tail = (p) => { try { return fs.readFileSync(p, 'utf8').split(/\r?\n/).slice(-80).join('\n'); } catch { return null; } };
            const outcomes = {
              checkout: process.env.O_CHECKOUT,
              credentials: process.env.O_CREDENTIALS,
              dependencies: process.env.O_DEPENDENCIES,
              build: process.env.O_BUILD,
              validate: process.env.O_VALIDATE,
              clean_worktree: process.env.O_CLEAN_WORKTREE,
              backup: process.env.O_BACKUP,
              migrate: process.env.O_MIGRATE,
              deploy_tenant: process.env.O_DEPLOY_TENANT,
              install_hrm: process.env.O_INSTALL_HRM,
              install_vn_accounting: process.env.O_INSTALL_VN,
              install_alumdoor: process.env.O_INSTALL_ALUMDOOR,
              build_gateway: process.env.O_BUILD_GATEWAY,
              deploy_app_worker: process.env.O_DEPLOY_APP,
              stage_gateway: process.env.O_STAGE_GATEWAY,
              deploy_gateway: process.env.O_DEPLOY_GATEWAY,
              smoke: process.env.O_SMOKE,
            };
            const payload = {
              deployedSha: process.env.DEPLOYED_SHA,
              failedStep: Object.entries(outcomes).find(([,v]) => v === 'failure')?.[0] ?? 'unknown',
              outcomes,
              hrmLogTail: tail(process.env.HRM_LOG_PATH),
              vnAccountingLogTail: tail(process.env.VN_LOG_PATH),
              alumdoorLogTail: tail(process.env.ALUMDOOR_LOG_PATH),
              failedAt: new Date().toISOString(),
            };
            const path = 'deploy-evidence/alu-full-sync-failure.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `ops: record ALU full sync failure ${process.env.DEPLOYED_SHA.slice(0, 12)}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {}),
            });
