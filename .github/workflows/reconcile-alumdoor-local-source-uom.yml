name: Reconcile Alumdoor Local UOM

on:
  workflow_dispatch:
  push:
    branches:
      - agent/local-runner-import-stabilization
    paths:
      - 'scripts/local-runner/**'
      - '.github/workflows/reconcile-alumdoor-local-source-uom.yml'

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  seed-uom-api:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - name: Checkout isolated candidate source
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove candidate and canonical source boundaries
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.repository }}' -ne 'nguyentrieu210/forge') {
            throw 'Candidate acceptance is restricted to nguyentrieu210/forge.'
          }
          if ('${{ github.ref }}' -ne 'refs/heads/agent/local-runner-import-stabilization') {
            throw "Unexpected candidate ref: ${{ github.ref }}"
          }

          $candidate = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $canonical = 'C:\alumdoor'
          if ($candidate.TrimEnd('\').ToLowerInvariant() -eq $canonical.ToLowerInvariant() -or
              $candidate.ToLowerInvariant().StartsWith(($canonical + '\').ToLowerInvariant())) {
            throw "Candidate checkout is not isolated from canonical authority: $candidate"
          }

          $candidateSha = (git -C $candidate rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateSha -ne '${{ github.sha }}') {
            throw "Candidate SHA mismatch expected=${{ github.sha }} actual=$candidateSha"
          }
          $candidateDirty = @(git -C $candidate status --porcelain=v1)
          if ($candidateDirty.Count -gt 0) {
            $candidateDirty | ForEach-Object { Write-Host "CANDIDATE_DIRTY $_" }
            throw 'Candidate checkout is dirty.'
          }

          if (-not (Test-Path (Join-Path $canonical '.git'))) {
            throw 'Canonical C:\alumdoor Git authority is missing.'
          }
          $branch = (git -C $canonical rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'main') {
            throw "Canonical authority must remain on main; found '$branch'."
          }
          $canonicalDirty = @(git -C $canonical status --porcelain=v1)
          if ($canonicalDirty.Count -gt 0) {
            $canonicalDirty | ForEach-Object { Write-Host "CANONICAL_DIRTY $_" }
            throw 'Canonical authority is dirty; candidate acceptance fails closed.'
          }
          git -C $canonical fetch origin main --prune
          if ($LASTEXITCODE -ne 0) { throw 'Canonical git fetch origin main failed.' }
          $canonicalSha = (git -C $canonical rev-parse HEAD).Trim()
          $originMain = (git -C $canonical rev-parse origin/main).Trim()
          if ($canonicalSha -ne $originMain) {
            throw "Canonical authority is not exact origin/main: local=$canonicalSha origin_main=$originMain"
          }

          Write-Host "CANDIDATE_SOURCE_PROOF=PASS candidate_sha=$candidateSha source=$candidate"
          Write-Host "CANONICAL_AUTHORITY_PROOF=PASS canonical_sha=$canonicalSha repo=$canonical"

      - name: Run candidate UOM runner against canonical local authority
        if: github.event_name == 'push'
        shell: powershell
        working-directory: C:\alumdoor
        env:
          FORGE_LOCAL_REPO_ROOT: C:\alumdoor
          FORGE_LOCAL_CANDIDATE_SHA: ${{ github.sha }}
          FORGE_ORIGIN: http://127.0.0.1:8799
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:FORGE_LOCAL_EXPECTED_SHA -ErrorAction SilentlyContinue

          $runner = Join-Path $env:GITHUB_WORKSPACE 'scripts\local-runner\run-local-import.mjs'
          if (-not (Test-Path $runner)) { throw "Candidate runner missing: $runner" }

          $output = @(& node $runner uom 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $logPath = Join-Path $env:RUNNER_TEMP 'uom-candidate-acceptance.log'
          $output | Set-Content -Path $logPath -Encoding utf8
          if ($exitCode -ne 0) {
            throw "Candidate UOM execution contract failed with exit code $exitCode"
          }

          $text = $output -join [Environment]::NewLine
          foreach ($marker in @(
            'INFRA_STATUS=PASS',
            'DATA_STATUS=PASS',
            'GLOBAL_D1_LOCK=ACQUIRED',
            'BACKUP_STATUS=PASS',
            'ALUMDOOR_LOCAL_UOM_IDEMPOTENCE_PASS canonical=19',
            'VERIFY_STATUS=PASS',
            'GLOBAL_D1_LOCK=RELEASED',
            'FORGE_LOCAL_IMPORT_EXECUTION_PASS adapter=uom',
            'EXECUTION_STATUS=SUCCESS'
          )) {
            if (-not $text.Contains($marker)) {
              throw "Candidate acceptance evidence missing marker: $marker"
            }
          }

          $backupMatch = [regex]::Match($text, 'BACKUP_STATUS=PASS path=(.+?) bytes=(\d+)(?:\r?\n|$)')
          if (-not $backupMatch.Success) { throw 'Cannot parse validated backup evidence.' }
          $backupPath = $backupMatch.Groups[1].Value.Trim()
          $backupBytes = [int64]$backupMatch.Groups[2].Value
          if ($backupBytes -le 0 -or -not (Test-Path $backupPath)) {
            throw "Backup evidence invalid path=$backupPath bytes=$backupBytes"
          }

          $manifestPath = Join-Path $backupPath 'manifest.json'
          if (-not (Test-Path $manifestPath)) { throw "Backup manifest missing: $manifestPath" }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.format -ne 'forge-local-state-backup/v1') {
            throw "Unexpected backup manifest format: $($manifest.format)"
          }
          $canonicalState = @($manifest.sources | Where-Object { $_.path -eq 'server/apps/tenant-worker/.wrangler/state' })
          if ($canonicalState.Count -ne 1 -or -not $canonicalState[0].exists -or [int64]$canonicalState[0].bytes -le 0) {
            throw 'Canonical tenant-worker D1 state was not proven by the backup manifest.'
          }
          $copiedCanonicalState = Join-Path $backupPath 'server\apps\tenant-worker\.wrangler\state'
          if (-not (Test-Path $copiedCanonicalState)) {
            throw "Canonical D1 backup payload missing: $copiedCanonicalState"
          }

          $lockPath = 'C:\alumdoor\local-locks\local-d1-mutation.lock'
          if (Test-Path $lockPath) {
            throw "Mutation lock remained after successful execution: $lockPath"
          }

          $canonicalSha = (git -C 'C:\alumdoor' rev-parse HEAD).Trim()
          $originMain = (git -C 'C:\alumdoor' rev-parse origin/main).Trim()
          if ($canonicalSha -ne $originMain) {
            throw "Canonical source moved during candidate execution: local=$canonicalSha origin_main=$originMain"
          }
          $canonicalDirty = @(git -C 'C:\alumdoor' status --porcelain=v1)
          if ($canonicalDirty.Count -gt 0) {
            $canonicalDirty | ForEach-Object { Write-Host "CANONICAL_DIRTY_AFTER $_" }
            throw 'Canonical source became dirty during candidate execution.'
          }

          Write-Host "WINDOWS_HARDENED_CANDIDATE_ACCEPTANCE=PASS candidate_sha=${{ github.sha }} canonical_sha=$canonicalSha adapter=uom"
          Write-Host 'RUNTIME_RESTORE=PASS mode=unchanged adapter=uom'
          Write-Host 'REMOTE_MUTATION_COUNT=0'

      - name: Run canonical UOM local import contract
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        working-directory: C:\alumdoor
        env:
          FORGE_LOCAL_EXPECTED_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts\local-runner\run-local-import.mjs uom
          if ($LASTEXITCODE -ne 0) { throw "UOM execution contract failed with exit code $LASTEXITCODE" }
