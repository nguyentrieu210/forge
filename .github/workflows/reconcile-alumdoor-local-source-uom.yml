name: Reconcile Alumdoor Local UOM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  seed-uom-api:
    runs-on: [self-hosted]
    timeout-minutes: 15
    env:
      FORGE_LOCAL_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Run canonical UOM local import contract
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts\local-runner\run-local-import.mjs uom
          if ($LASTEXITCODE -ne 0) { throw "UOM execution contract failed with exit code $LASTEXITCODE" }
