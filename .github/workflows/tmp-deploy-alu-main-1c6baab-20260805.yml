name: TMP Deploy Alumdoor 2.2.10 Exact Main Production 2026-08-05

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-deploy-alu-main-1c6baab-20260805.yml"
      - "ops/releases/alu-main-1c6baab-20260805-authorization.txt"

permissions:
  contents: read

concurrency:
  group: release-alu-tenant-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Guard, backup, restore drill, full deploy, exact verify
    if: github.head_ref == 'release/alu-main-1c6baab-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      TENANT: alu
      APP_ID: alumdoor
      APP_WORKER: cloudforge-app-alumdoor
      DISPATCH_NAMESPACE: cloudforge-production
      EXPECTED_PACKAGE: 2.2.10
      AUTH_FILE: ops/releases/alu-main-1c6baab-20260805-authorization.txt
      FORGE_ORIGIN: https://alu.kairo.vn
      BACKUP_DIR: /tmp/alu-main-1c6baab-backup
      EVIDENCE_DIR: /tmp/alu-main-1c6baab-evidence
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}

    steps:
      - name: Checkout authorization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify explicit authorization and immutable exact main target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR" "$EVIDENCE_DIR"
          test -f "$AUTH_FILE"
          grep -Fxq 'ACTION=DEPLOY_ALUMDOOR_CURRENT_MAIN_PRODUCTION' "$AUTH_FILE"
          grep -Fxq 'TENANT=alu' "$AUTH_FILE"
          grep -Fxq 'APP=alumdoor' "$AUTH_FILE"
          grep -Fxq 'EXPECTED_PACKAGE=2.2.10' "$AUTH_FILE"
          grep -Fxq 'APPROVAL=EXPLICIT_USER_MERGE_AND_DEPLOY_APPROVAL_2026-08-05' "$AUTH_FILE"
          target_sha="$(sed -n 's/^TARGET_SHA=//p' "$AUTH_FILE")"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(grep -c '^TARGET_SHA=' "$AUTH_FILE")" -eq 1
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$target_sha" = "$current_main" || {
            echo "Refusing production release: authorized target $target_sha is not current main $current_main."
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${FORGE_ADMIN_USER:-}"
          test -n "${FORGE_ADMIN_PASSWORD:-}"
          printf 'TARGET_SHA=%s\n' "$target_sha" >> "$GITHUB_ENV"
          printf 'run_id=%s\ntarget_sha=%s\ntenant=%s\napp=%s\nexpected_package=%s\nstarted_at=%s\nwrite_scope=tenant_worker_app_worker_metadata_gateway\n' \
            "$GITHUB_RUN_ID" "$target_sha" "$TENANT" "$APP_ID" "$EXPECTED_PACKAGE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$EVIDENCE_DIR/state.txt"

      - name: Checkout exact authorized current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA"
          git checkout --force --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git clean -fdx

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate exact release source
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter cloudforge run build
          pnpm --filter metaforge run build
          pnpm --filter metaforge run typecheck
          node --test \
            server/tests/alumdoor-purchase-direct-receipt.test.mjs \
            server/tests/purchase-receipt-optional-order.test.mjs \
            server/tests/alumdoor-procurement-navigation-contract.test.mjs \
            server/tests/tien-dat-purchase-bulk-fifo.test.mjs \
            server/tests/alumdoor-sales-navigation-contract.test.mjs \
            server/tests/sales-wizard-context.test.mjs \
            2>&1 | tee "$EVIDENCE_DIR/converged-tests.log"
          node server/scripts/verify-alumdoor-meta-completeness.mjs \
            2>&1 | tee "$EVIDENCE_DIR/meta-completeness.log"
          node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run \
            2>&1 | tee "$EVIDENCE_DIR/package-dry-run.log"
          grep -Fq 'DRY_RUN_PASS alumdoor' "$EVIDENCE_DIR/package-dry-run.log"
          grep -Fq 'app=alumdoor@2.2.10' "$EVIDENCE_DIR/package-dry-run.log"
          printf 'source_validation=pass\ncloudforge_build=pass\nmetaforge_build=pass\ntypecheck=pass\npackage_identity=alumdoor@2.2.10\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Create fresh production backup
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/backup-dry.log"
          node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$BACKUP_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/backup-live.log"
          mapfile -t backups < <(find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.sql' -print | sort)
          test "${#backups[@]}" -eq 1
          backup_sql="${backups[0]}"
          test -f "$backup_sql.json"
          backup_sha="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(m.sha256||'')" "$backup_sql.json")"
          test -n "$backup_sha"
          printf 'BACKUP_SQL=%s\nBACKUP_SHA=%s\n' "$backup_sql" "$backup_sha" >> "$GITHUB_ENV"
          printf 'backup=pass\nbackup_sha256=%s\nexternal_backup=github_actions_artifact\n' "$backup_sha" >> "$EVIDENCE_DIR/state.txt"

      - name: Copy fresh backup to protected artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: alu-main-1c6baab-pre-deploy-backup-${{ github.run_id }}
          path: /tmp/alu-main-1c6baab-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Create two isolated restore-drill databases
        shell: bash
        run: |
          set -euo pipefail
          drill_a="cloudforge-drill-alu-1c6baab-${GITHUB_RUN_ID}-a"
          drill_b="cloudforge-drill-alu-1c6baab-${GITHUB_RUN_ID}-b"
          printf 'DRILL_A=%s\nDRILL_B=%s\n' "$drill_a" "$drill_b" >> "$GITHUB_ENV"
          pnpm --dir server exec wrangler d1 create "$drill_a" --location apac \
            2>&1 | tee "$EVIDENCE_DIR/drill-a-create.log"
          touch /tmp/alu-1c6baab-drill-a-created
          pnpm --dir server exec wrangler d1 create "$drill_b" --location apac \
            2>&1 | tee "$EVIDENCE_DIR/drill-b-create.log"
          touch /tmp/alu-1c6baab-drill-b-created

      - name: Restore and verify the same backup twice
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_A" --file "$BACKUP_SQL" \
            2>&1 | tee "$EVIDENCE_DIR/drill-a-dry.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_A" --file "$BACKUP_SQL" \
            --execute --confirm "$DRILL_A" 2>&1 | tee "$EVIDENCE_DIR/drill-a-live.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_B" --file "$BACKUP_SQL" \
            2>&1 | tee "$EVIDENCE_DIR/drill-b-dry.log"
          node server/scripts/restore-tenant-drill.mjs --tenant "$TENANT" --target "$DRILL_B" --file "$BACKUP_SQL" \
            --execute --confirm "$DRILL_B" 2>&1 | tee "$EVIDENCE_DIR/drill-b-live.log"
          node - "$BACKUP_SQL.$DRILL_A.restore.json" "$BACKUP_SQL.$DRILL_B.restore.json" "$BACKUP_SHA" <<'NODE'
          const fs = require('fs');
          const [aPath, bPath, expected] = process.argv.slice(2);
          const a = JSON.parse(fs.readFileSync(aPath, 'utf8'));
          const b = JSON.parse(fs.readFileSync(bPath, 'utf8'));
          if (a.source_sha256 !== expected || b.source_sha256 !== expected) throw new Error('restore drill checksum mismatch');
          if (a.target_database_id === b.target_database_id) throw new Error('restore drills reused one database');
          if (a.routes_changed !== false || b.routes_changed !== false) throw new Error('restore drill changed routes');
          const ok = (row) => JSON.stringify(row.integrity).toLowerCase().includes('ok');
          if (!ok(a) || !ok(b)) throw new Error('restore drill quick_check failed');
          if (a.table_count !== b.table_count || a.table_count < 1) throw new Error('restore drill table count mismatch');
          process.stdout.write(`restore_drill_tables=${a.table_count}\n`);
          NODE
          printf 'restore_drill_a=pass\nrestore_drill_b=pass\nrestore_drill_sha256=%s\n' "$BACKUP_SHA" >> "$EVIDENCE_DIR/state.txt"

      - name: Plan and apply tenant migrations
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrate-tenant.mjs --tenant "$TENANT" \
            2>&1 | tee "$EVIDENCE_DIR/migration-plan.log"
          node scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" --allow-dirty \
            2>&1 | tee "$EVIDENCE_DIR/migration-live.log"
          printf 'tenant_migration=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy exact tenant Worker
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" --allow-dirty \
            2>&1 | tee "$EVIDENCE_DIR/tenant-worker-deploy.log"
          printf 'tenant_worker_deploy=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy exact Alumdoor app Worker
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy \
            --config apps-src/alumdoor-worker/wrangler.jsonc \
            --name "$APP_WORKER" \
            --dispatch-namespace "$DISPATCH_NAMESPACE" \
            --strict \
            2>&1 | tee "$EVIDENCE_DIR/alumdoor-worker-deploy.log"
          printf 'alumdoor_worker_deploy=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Install exact Alumdoor metadata 2.2.10
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/forge-app.mjs briefs/alumdoor-v2.json \
            --origin "$FORGE_ORIGIN" \
            --admin "$FORGE_ADMIN_USER" \
            2>&1 | tee "$EVIDENCE_DIR/install-and-smoke.log"
          grep -Fq 'app=alumdoor@2.2.10' "$EVIDENCE_DIR/install-and-smoke.log"
          grep -Fq 'installed form/link/chart contract' "$EVIDENCE_DIR/install-and-smoke.log"
          grep -Fq '^LIVE  https://alu.kairo.vn' "$EVIDENCE_DIR/install-and-smoke.log"
          printf 'metadata_install=pass\ninstalled_identity=alumdoor@2.2.10\nconformance_smoke=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Stage exact runtime bundle and release marker
        shell: bash
        run: |
          set -euo pipefail
          VITE_FORGE_RELEASE_SHA="$TARGET_SHA" node server/scripts/stage-client-bundle.mjs \
            2>&1 | tee "$EVIDENCE_DIR/stage-client.log"
          grep -Fq "release=$TARGET_SHA" "$EVIDENCE_DIR/stage-client.log"
          node server/scripts/stage-client-bundle.mjs --check \
            2>&1 | tee "$EVIDENCE_DIR/stage-check.log"
          printf 'client_stage=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy exact Gateway assets and Worker source
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc \
            2>&1 | tee "$EVIDENCE_DIR/gateway-deploy.log"
          printf 'gateway_deploy=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify exact production release and Alumdoor declarations
        shell: bash
        run: |
          set -euo pipefail
          health_code="$(curl --silent --show-error --max-time 15 -o /tmp/health.json -w '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            "$FORGE_ORIGIN/health?sha=$TARGET_SHA&run=$GITHUB_RUN_ID")"
          test "$health_code" = "200"

          release_ok=false
          for attempt in $(seq 1 20); do
            code="$(curl --silent --show-error --max-time 15 -o /tmp/release.json -w '%{http_code}' \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$FORGE_ORIGIN/release.json?sha=$TARGET_SHA&run=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            if [ "$code" = "200" ] && node - /tmp/release.json "$TARGET_SHA" <<'NODE'
          const fs = require('fs');
          const [path, expected] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (release.releaseSha !== expected || !release.bundleHash) process.exit(2);
          console.log(`EXACT_RELEASE_PASS sha=${release.releaseSha} bundle=${release.bundleHash}`);
          NODE
            then
              release_ok=true
              break
            fi
            sleep 2
          done
          [ "$release_ok" = true ] || {
            echo "Production release marker did not converge to $TARGET_SHA."
            cat /tmp/release.json 2>/dev/null || true
            exit 1
          }
          bundle_hash="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/release.json','utf8'));process.stdout.write(r.bundleHash||'')")"
          printf 'release_observation=pass\nbundle_hash=%s\n' "$bundle_hash" >> "$EVIDENCE_DIR/state.txt"

          guest_code="$(curl --silent --show-error --max-time 15 -o /tmp/guest.json -w '%{http_code}' \
            -H 'content-type: application/json' -H 'Cache-Control: no-cache' \
            -X POST "$FORGE_ORIGIN/api/method/frappe.desk.desktop.get_bootinfo?sha=$TARGET_SHA&run=$GITHUB_RUN_ID" --data '{}')"
          test "$guest_code" = "403"
          printf 'guest_boundary=pass\n' >> "$EVIDENCE_DIR/state.txt"

          node --input-type=module <<'NODE'
          const origin = process.env.FORGE_ORIGIN.replace(/\/$/, '');
          const user = process.env.FORGE_ADMIN_USER;
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map();
          let csrf = '';
          function store(response) {
            for (const value of response.headers.getSetCookie?.() ?? []) {
              const pair = value.split(';')[0];
              const i = pair.indexOf('=');
              if (i > 0) jar.set(pair.slice(0, i).trim(), pair.slice(i + 1).trim());
            }
          }
          async function call(method, body = {}) {
            const response = await fetch(`${origin}/api/method/${method}`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'cache-control': 'no-cache',
                ...(jar.size ? { cookie: [...jar].map(([k,v]) => `${k}=${v}`).join('; ') } : {}),
                ...(csrf ? { 'x-frappe-csrf-token': csrf } : {}),
              },
              body: JSON.stringify(body),
            });
            store(response);
            csrf = response.headers.get('x-frappe-csrf-token') ?? csrf;
            const text = await response.text();
            const parsed = JSON.parse(text);
            if (!response.ok) throw new Error(`${method} HTTP ${response.status}: ${parsed.message ?? text.slice(0,200)}`);
            return parsed.message ?? parsed;
          }
          await call('login', { usr: user, pwd: password });
          const manifest = await call('metaforge.api.get_app_manifest', { app: 'alumdoor' });
          const nav = Array.isArray(manifest.nav) ? manifest.nav : [];
          const procurement = nav.filter((entry) => entry?.group === 'Mua hàng');
          const sales = nav.filter((entry) => entry?.group === 'Bán hàng');
          const procurementKeys = [
            'action:tao-don-mua',
            'action:nhap-nhom-hang-loat',
            'action:bao-cao-giao-hang-ncc',
            'Purchase Order',
          ];
          const procurementLabels = ['Mua hàng', 'Nhập hàng', 'Báo cáo', 'Lịch sử mua hàng'];
          const salesKeys = [
            'alumdoor-operations:workbench',
            'Sales Order',
            'Delivery Note',
            'action:giao-hang-theo-ngay',
            'report:Đơn hàng theo khách',
          ];
          const salesLabels = ['Bán hàng', 'Đơn hàng', 'Phiếu xuất kho', 'Giao hàng', 'Báo cáo'];
          if (JSON.stringify(procurement.map((entry) => entry.key)) !== JSON.stringify(procurementKeys)) {
            throw new Error(`unexpected procurement keys: ${JSON.stringify(procurement.map((entry) => entry.key))}`);
          }
          if (JSON.stringify(procurement.map((entry) => entry.label)) !== JSON.stringify(procurementLabels)) {
            throw new Error(`unexpected procurement labels: ${JSON.stringify(procurement.map((entry) => entry.label))}`);
          }
          if (JSON.stringify(sales.map((entry) => entry.key)) !== JSON.stringify(salesKeys)) {
            throw new Error(`unexpected sales keys: ${JSON.stringify(sales.map((entry) => entry.key))}`);
          }
          if (JSON.stringify(sales.map((entry) => entry.label)) !== JSON.stringify(salesLabels)) {
            throw new Error(`unexpected sales labels: ${JSON.stringify(sales.map((entry) => entry.label))}`);
          }
          for (const hidden of ['Purchase Receipt', 'action:nhap-nhom-fifo', 'action:doi-soat-giao-hang-ncc', 'action:tinh-cong-thuc-cua']) {
            if (nav.some((entry) => entry?.key === hidden)) throw new Error(`hidden daily entry visible: ${hidden}`);
          }
          console.log(`ALUMDOOR_DECLARATION_PASS nav=${nav.length} procurement=${procurement.length} sales=${sales.length}`);
          NODE
          printf 'alumdoor_navigation=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Remove temporary restore-drill databases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cleanup() {
            local name="$1" marker="$2" expected="$3"
            if [ ! -f "$marker" ]; then return 0; fi
            test "$name" = "$expected"
            case "$name" in
              cloudforge-drill-alu-1c6baab-${GITHUB_RUN_ID}-a|cloudforge-drill-alu-1c6baab-${GITHUB_RUN_ID}-b) ;;
              *) echo "Refusing unexpected D1 cleanup target: $name" >&2; exit 1 ;;
            esac
            pnpm --dir server exec wrangler d1 delete "$name" --skip-confirmation
          }
          cleanup "${DRILL_A:-}" /tmp/alu-1c6baab-drill-a-created "cloudforge-drill-alu-1c6baab-${GITHUB_RUN_ID}-a"
          cleanup "${DRILL_B:-}" /tmp/alu-1c6baab-drill-b-created "cloudforge-drill-alu-1c6baab-${GITHUB_RUN_ID}-b"
          printf 'drill_cleanup=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Alumdoor 2.2.10 exact-main production release'
            echo
            echo '```text'
            cat "$EVIDENCE_DIR/state.txt" 2>/dev/null || echo 'state.txt missing'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-main-1c6baab-production-release-${{ github.run_id }}
          path: /tmp/alu-main-1c6baab-evidence/
          if-no-files-found: warn
          retention-days: 30
