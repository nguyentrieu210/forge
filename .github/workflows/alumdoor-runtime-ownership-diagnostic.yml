name: Alumdoor Runtime Ownership Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/alumdoor-runtime-ownership-diagnostic.yml'
      - '.github/workflows/bootstrap-alumdoor-local.yml'
      - 'scripts/local-runner/**'
      - 'server/scripts/alumdoor-runtime-*.mjs'
      - 'server/scripts/stop-local-dev.mjs'

permissions:
  contents: read

jobs:
  ownership-diagnostic:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: Inspect runtime authority and legacy ownership
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "JOB_IDENTITY=$(whoami)"
          Write-Host "JOB_ELEVATED=$(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"

          Write-Host '=== SERVICES ==='
          Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('ForgeAlumdoorBackend','ForgeAlumdoorDesk') -or
              $_.Name -like 'actions.runner.nguyentrieu210-forge.*' -or
              $_.PathName -match '(?i)nssm'
            } |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "SERVICE name=$($_.Name) display=$($_.DisplayName) state=$($_.State) start_name=$($_.StartName) pid=$($_.ProcessId) path=$($_.PathName)"
            }

          $all = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
          $byId = @{}
          foreach ($proc in $all) { $byId[[int]$proc.ProcessId] = $proc }

          function Owner-Of($proc) {
            if (-not $proc) { return '<missing>' }
            try {
              $result = Invoke-CimMethod -InputObject $proc -MethodName GetOwner -ErrorAction Stop
              if ($result.ReturnValue -eq 0) { return "$($result.Domain)\$($result.User)" }
            } catch {}
            return '<unknown>'
          }

          Write-Host '=== LISTENER ANCESTRY ==='
          $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in @(8799,5173) })
          foreach ($listener in $listeners) {
            Write-Host "LISTENER port=$($listener.LocalPort) pid=$($listener.OwningProcess)"
            $current = [int]$listener.OwningProcess
            $seen = @{}
            for ($depth=0; $depth -lt 12 -and $current -gt 0; $depth++) {
              if ($seen.ContainsKey($current)) { break }
              $seen[$current] = $true
              $proc = $byId[$current]
              if (-not $proc) { Write-Host "ANCESTOR depth=$depth pid=$current missing=1"; break }
              $cmd = (($proc.CommandLine -replace '[\r\n]+',' ') -replace '\s+',' ').Trim()
              if ($cmd.Length -gt 500) { $cmd = $cmd.Substring(0,500) }
              Write-Host "ANCESTOR depth=$depth pid=$($proc.ProcessId) parent=$($proc.ParentProcessId) name=$($proc.Name) owner=$(Owner-Of $proc) exe=$($proc.ExecutablePath) cmd=$cmd"
              $current = [int]$proc.ParentProcessId
            }
          }

          Write-Host 'ALUMDOOR_RUNTIME_OWNERSHIP_DIAGNOSTIC_PASS'
