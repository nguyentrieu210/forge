name: Alumdoor FormView purity hosted v2
permissions:
  contents: write
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/alumdoor-form-purity-hosted-v2.yml"]
jobs:
  purity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clean schema race and remove commercial FormView logic
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/forge-alu-form-purity-v2"
          git clone --quiet --branch exp/alumdoor-pricing-policy "https://x-access-token:${GH_TOKEN}@github.com/nguyentrieu210/forge.git" "$p"
          cd "$p"; base="$(git rev-parse HEAD)"; export P="$p"
          python - <<'PY'
          from pathlib import Path
          import os
          r=Path(os.environ['P'])
          # Normalize presentation schema after an old queued workflow inserted duplicate declarations.
          f=r/'server/packages/frappe-model/src/types.ts'; s=f.read_text(encoding='utf-8')
          a=s.index('  form_control_width?: "compact";\n'); b=s.index('  /** Immutable after',a)
          s=s[:a]+'''  form_control_width?: "compact";\n  /** Render a Select as an inline choice list instead of a dropdown. */\n  form_control_style?: "choice_list";\n  /** Section-break presentation only; does not change document semantics. */\n  form_section_style?: "summary";\n'''+s[b:]; f.write_text(s,encoding='utf-8',newline='\n')
          f=r/'client/packages/core/src/types/meta.ts'; s=f.read_text(encoding='utf-8')
          a=s.index('  form_control_width?: "compact";\n'); b=s.index('  valueSource?:',a)
          s=s[:a]+'''  form_control_width?: "compact";\n  /** Generic Select presentation; options still come from field.options. */\n  form_control_style?: "choice_list";\n  /** Generic section presentation marker carried on Section Break fields. */\n  form_section_style?: "summary";\n'''+s[b:]; f.write_text(s,encoding='utf-8',newline='\n')
          f=r/'server/packages/frappe-model/src/validate.ts'; s=f.read_text(encoding='utf-8')
          a=s.index('  const formControlStyle ='); b=s.index('  const valueSource =',a)
          s=s[:a]+'''  const formControlStyle = input.form_control_style === undefined ? undefined : text(input.form_control_style, `fields[${index}].form_control_style`, 24);\n  if (formControlStyle !== undefined && formControlStyle !== "choice_list") throw errors.validation(`fields[${index}].form_control_style must be choice_list`);\n  const formSectionStyle = input.form_section_style === undefined ? undefined : text(input.form_section_style, `fields[${index}].form_section_style`, 24);\n  if (formSectionStyle !== undefined && formSectionStyle !== "summary") throw errors.validation(`fields[${index}].form_section_style must be summary`);\n'''+s[b:]
          a=s.index('    ...(formControlWidth === undefined'); b=s.index('    ...(valueSource ?',a)
          s=s[:a]+'''    ...(formControlWidth === undefined ? {} : { form_control_width: "compact" as const }),\n    ...(formControlStyle === undefined ? {} : { form_control_style: "choice_list" as const }),\n    ...(formSectionStyle === undefined ? {} : { form_section_style: "summary" as const }),\n'''+s[b:]; f.write_text(s,encoding='utf-8',newline='\n')

          f=r/'client/packages/views/src/form/FormView.tsx'; s=f.read_text(encoding='utf-8')
          s=s.replace('import { defaultSalesDiscountPercent } from "./sales-line-policy.js";\n','')
          a=s.index('const SALES_VND_FORMATTER ='); b=s.index('export interface FormViewProps')
          s=s[:a]+'''interface DocumentPreviewResult {\n  patch?: Record<string, unknown>;\n  clear?: string[];\n}\n\n'''+s[b:]
          old='    return [...names];\n  }, [meta, fetchRules]);\n'
          new='''    for (const fieldname of meta.viewPolicy?.form?.previewParentFields ?? []) {\n      if (meta.fields.some((field) => field.fieldname === fieldname)) names.add(fieldname);\n    }\n    return [...names];\n  }, [meta, fetchRules]);\n'''
          assert old in s; s=s.replace(old,new,1)
          a=s.index('  const reactiveValues = useWatch'); b=s.index('  // Ctrl/Cmd+S',a)
          preview='''  const reactiveValues = useWatch({ control: form.control, name: reactiveFields });\n  const values = useMemo(() => {\n    const current = { ...form.getValues() };\n    reactiveFields.forEach((fieldname, index) => { current[fieldname] = (reactiveValues as unknown[])[index]; });\n    return current;\n  }, [form, reactiveFields, reactiveValues]);\n  const formPreview = meta.viewPolicy?.form;\n  const previewMethod = typeof formPreview?.previewMethod === "string" ? formPreview.previewMethod.trim() : "";\n  const previewParentFields = useMemo(() => (formPreview?.previewParentFields ?? []).filter((fieldname) => meta.fields.some((field) => field.fieldname === fieldname)), [formPreview?.previewParentFields, meta.fields]);\n  const previewSequence = useRef(0);\n  const previewDocKey = useRef("");\n  const previewPrevious = useRef<Record<string, unknown>>({});\n  useEffect(() => {\n    if (!previewMethod || !services?.callPost) return;\n    const key = `${doc.name ?? ""}|${doc.modified ?? ""}`;\n    const current = Object.fromEntries(previewParentFields.map((fieldname) => [fieldname, form.getValues(fieldname)]));\n    const firstForDocument = previewDocKey.current !== key;\n    let changedField = "";\n    if (firstForDocument) { previewDocKey.current = key; previewPrevious.current = current; if (!props.isNew) return; }\n    else { changedField = previewParentFields.find((fieldname) => !Object.is(previewPrevious.current[fieldname], current[fieldname])) ?? ""; previewPrevious.current = current; if (!changedField) return; }\n    const sequence = ++previewSequence.current;\n    void services.callPost<DocumentPreviewResult>(previewMethod, { doctype: meta.name, doc: { ...form.getValues(), name: doc.name, modified: doc.modified }, changed_field: changedField }).then((result) => {\n      if (previewSequence.current !== sequence) return;\n      const known = new Set(meta.fields.map((field) => field.fieldname));\n      const shouldDirty = !firstForDocument;\n      for (const fieldname of result.clear ?? []) if (known.has(fieldname) && form.getValues(fieldname) !== undefined) form.setValue(fieldname, undefined as never, { shouldDirty, shouldValidate: false });\n      for (const [fieldname, value] of Object.entries(result.patch ?? {})) if (known.has(fieldname) && !Object.is(form.getValues(fieldname), value)) form.setValue(fieldname, value as never, { shouldDirty, shouldValidate: false });\n    }).catch(() => { /* preview does not replace canonical save validation */ });\n  }, [doc.modified, doc.name, form, meta.fields, meta.name, previewMethod, previewParentFields, props.isNew, services, reactiveValues]);\n\n'''
          s=s[:a]+preview+s[b:]
          a=s.index('  // Đơn bán:'); b=s.index('  const resolved: ResolvedField[]',a)
          aggregate='''  const totalFields = useMemo(() => {\n    if (previewMethod) return null;\n    const has = (name: string) => meta.fields.some((field) => field.fieldname === name);\n    const table = meta.fields.find((field) => field.fieldtype === "Table" && field.fieldname === "items");\n    if (!table) return null;\n    const sumAmount = has("grand_total"), sumQty = has("total_qty");\n    return { table: table.fieldname, sumAmount, sumQty, derived: [...(sumAmount ? ["grand_total"] : []), ...(sumQty ? ["total_qty"] : [])] };\n  }, [meta, previewMethod]);\n  useEffect(() => {\n    if (!totalFields) return;\n    const updateTotals = (current: FieldValues) => {\n      const rows = current[totalFields.table]; if (!Array.isArray(rows)) return;\n      const round = (value: number) => Math.round(value * 1e6) / 1e6;\n      if (totalFields.sumAmount) {\n        const subtotal = round(rows.reduce((sum, rawRow) => { const row = rawRow as Doc; const amount = Number(row.amount); if (Number.isFinite(amount)) return sum + amount; const qty = Number(row.qty), rate = Number(row.rate); return sum + (Number.isFinite(qty) && Number.isFinite(rate) ? qty * rate : 0); }, 0));\n        if (Number(current.grand_total ?? 0) !== subtotal) form.setValue("grand_total", subtotal as never, { shouldDirty: false });\n      }\n      if (totalFields.sumQty) { const totalQty = round(rows.reduce((sum, row) => sum + (Number((row as Doc)?.qty) || 0), 0)); if (Number(current.total_qty ?? 0) !== totalQty) form.setValue("total_qty", totalQty as never, { shouldDirty: false }); }\n    };\n    updateTotals(form.getValues());\n    const subscription = form.watch((next, info) => { if (!info.name || info.name === totalFields.table || info.name.startsWith(`${totalFields.table}.`)) updateTotals(next as FieldValues); });\n    return () => subscription.unsubscribe();\n  }, [form, totalFields]);\n\n'''
          s=s[:a]+aggregate+s[b:]
          block='''  const salesVatField = meta.name === "Sales Order"\n    ? resolved.find((field) => field.field.fieldname === "vat_rate")\n    : undefined;\n  const salesSurchargeField = meta.name === "Sales Order"\n    ? resolved.find((field) => field.field.fieldname === "surcharge_amount")\n    : undefined;\n'''; assert block in s; s=s.replace(block,'',1)
          a=s.index('            const sectionFields = section.columns.flatMap'); b=s.index('            const renderFields =',a)
          s=s[:a]+'''            const sectionFields = section.columns.flatMap((column) => column.fields);\n            const mainFields = sectionFields.filter((field) => field.field.form_region !== "aside" && field.field.form_region !== "full");\n            const asideFields = sectionFields.filter((field) => field.field.form_region === "aside");\n            const fullFields = sectionFields.filter((field) => field.field.form_region === "full");\n'''+s[b:]
          old='''                  // Khối thanh toán của đơn bán là phần để chốt với khách, đặt gọn ở giữa\n                  // thay vì kéo hết ngang form như các trường nhập liệu thông thường.\n                  meta.name === "Sales Order" && section.label === "Tổng kết"\n                    && "w-full rounded-lg border bg-muted/10 px-4 md:ml-auto md:max-w-[36rem] [&_.mf-form-grid]:justify-center [&_.mf-field]:text-center [&_.mf-field>label]:text-center [&_.mf-control]:justify-center [&_input]:text-center",\n'''
          assert old in s; s=s.replace(old,'                  section.style === "summary" && "w-full rounded-lg border bg-muted/10 px-4 md:ml-auto md:max-w-[36rem] [&_.mf-form-grid]:justify-center [&_.mf-field]:text-center [&_.mf-field>label]:text-center [&_.mf-control]:justify-center [&_input]:text-center",\n',1)
          a=s.index('                {isSalesOrderHeader ? ('); marker='                ) : asideFields.length ? ('; b=s.index(marker,a); s=s[:a]+'                {asideFields.length ? ('+s[b+len(marker):]
          a=s.index('          {salesSummary ? ('); marker='          ) : null}\n        </div>'; b=s.index(marker,a); s=s[:a]+s[b+len('          ) : null}\n'):]
          a=s.index('function SalesSummaryValue('); b=s.index('function groupCheckFields(',a); s=s[:a]+s[b:]
          old='''  const displayLabel = parentDoctype === "Sales Order" && field.fieldname === "customer_group"\n    ? "Nhóm khách hàng"\n    : field.label ?? field.fieldname;\n'''; assert old in s; s=s.replace(old,'  const displayLabel = field.label ?? field.fieldname;\n',1)
          a=s.index('        const isCheck = field.fieldtype === "Check";'); b=s.index('        const label = (',a)
          choice='''        const isCheck = field.fieldtype === "Check";\n        const choiceOptions = field.fieldtype === "Select" && field.form_control_style === "choice_list" ? String(field.options ?? "").split("\\n").map((option) => option.trim()).filter(Boolean) : [];\n        const control = choiceOptions.length ? (\n          <div className="mf-choice-list space-y-1" role="radiogroup" aria-label={displayLabel}>\n            {choiceOptions.map((option) => <label key={option} className="flex min-h-8 cursor-pointer items-center gap-2 text-sm"><Checkbox checked={f.value === option} disabled={rf.readOnly} onCheckedChange={(checked) => { if (checked === true) { f.onChange(option); if (fieldState.error) form.clearErrors(field.fieldname); } }} aria-label={field.optionLabels?.[option] ?? option} /><span>{field.optionLabels?.[option] ?? option}</span></label>)}\n          </div>\n        ) : (\n          <Control field={field} id={id} value={f.value} onChange={(v) => { f.onChange(v); if (fieldState.error) form.clearErrors(field.fieldname); }} readOnly={rf.readOnly} masked={rf.masked} error={fieldState.error?.message} describedBy={fieldState.error ? `${id}-error` : undefined} required={rf.required} label={displayLabel} services={services} docname={docName} linkTarget={linkTarget} parentDoctype={parentDoctype} docValues={controlValues} roles={roles} />\n        );\n'''; s=s[:a]+choice+s[b:]
          forbidden=['"Sales Order"','defaultSalesDiscountPercent','salesSummary','salesOrder','SALES_VND_FORMATTER','formatSalesVnd','"Price List"','"Customer"','customer_group']
          leftovers=[token for token in forbidden if token in s]
          if leftovers: raise SystemExit(f'FormView still contains business tokens: {leftovers}')
          f.write_text(s,encoding='utf-8',newline='\n')

          g=r/'server/scripts/build-alumdoor-v2-brief.mjs'; x=g.read_text(encoding='utf-8')
          old='''operationalSalesOrder.fields = operationalSalesOrder.fields.map((raw, index) => {\n  const field = parseField(raw, index);\n  if (["transaction_date", "delivery_date", "payment_method"].includes(field.fieldname)) field.form_region = "aside";\n  if (["customer", "responsible_person", "manual_note", "operational_change_reason", "selling_price_list", "customer_group", "install_address"].includes(field.fieldname)) field.form_region = "main";\n  if (field.fieldname === "install_address") field.form_width = "full";\n  if (field.fieldname === "customer_group") field.label = "Nhóm khách hàng";\n  if (field.fieldname === "payment_method") { field.default = "Ghi công nợ"; field.form_control_style = "choice_list"; }\n  return field;\n});\n'''
          new='''operationalSalesOrder.fields = operationalSalesOrder.fields.map((raw, index) => {\n  const field = parseField(raw, index);\n  if (!["Section Break", "Column Break", "Tab Break"].includes(field.fieldtype)) field.form_region = "full";\n  if (["transaction_date", "delivery_date", "payment_method"].includes(field.fieldname)) field.form_region = "aside";\n  if (["customer", "responsible_person", "manual_note", "operational_change_reason", "selling_price_list", "customer_group", "install_address"].includes(field.fieldname)) field.form_region = "main";\n  if (field.fieldname === "install_address") field.form_width = "full";\n  if (field.fieldname === "customer_group") field.label = "Nhóm khách hàng";\n  if (field.fieldname === "payment_method") { field.default = "Ghi công nợ"; field.form_control_style = "choice_list"; }\n  const summaryLabels = { total_amount: "Tổng cộng tiền hàng", discount_amount: "Tiền chiết khấu", surcharge_amount: "Phụ thu", vat_rate: "% VAT", vat_amount: "Số tiền VAT", grand_total: "Tiền phải thu" };\n  if (field.fieldname in summaryLabels) { field.label = summaryLabels[field.fieldname]; field.form_width = "full"; }\n  return field;\n});\n'''
          assert old in x; g.write_text(x.replace(old,new,1),encoding='utf-8',newline='\n')
          t=r/'client/packages/views/tests/form-view-metadata-purity.test.mjs'; t.write_text('''import test from "node:test";import assert from "node:assert/strict";import{readFileSync}from"node:fs";const source=readFileSync(new URL("../src/form/FormView.tsx",import.meta.url),"utf8");test("FormView is metadata-only",()=>{for(const token of["\\\"Sales Order\\\"","defaultSalesDiscountPercent","salesSummary","salesOrder","SALES_VND_FORMATTER","formatSalesVnd","\\\"Price List\\\"","\\\"Customer\\\"","customer_group"])assert.equal(source.includes(token),false,token);assert.match(source,/previewMethod/);assert.match(source,/services\.callPost<DocumentPreviewResult>/);assert.match(source,/form_control_style === "choice_list"/);assert.match(source,/section\.style === "summary"/);});\n''',encoding='utf-8',newline='\n')
          PY
          cd server; corepack enable; pnpm install --frozen-lockfile; pnpm run build; node scripts/build-alumdoor-v2-brief.mjs; pnpm run brief:check; pnpm exec wrangler deploy --dry-run --config apps-src/alumdoor-worker/wrangler.jsonc
          cd ../client; pnpm --filter @metaforge/views... run build; node --test packages/views/tests/form-view-metadata-purity.test.mjs packages/views/tests/metadata-child-grid-runtime.test.mjs packages/views/tests/child-grid-presentation.test.mjs
          cd ../server; pnpm test:unit
          cd ..; git diff --check; git fetch origin exp/alumdoor-pricing-policy --quiet; test "$(git rev-parse origin/exp/alumdoor-pricing-policy)" = "$base"
          git config user.name 'Alumdoor Hosted Convergence';git config user.email 'alumdoor-cert@local.invalid';git add client server;git commit -m 'refactor(metaform): remove commercial logic from generic FormView';git push origin HEAD:exp/alumdoor-pricing-policy
          echo "FORM_PURITY_V2_PUSHED=$(git rev-parse HEAD)"
