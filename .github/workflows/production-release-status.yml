name: Production Release Status Snapshot

on:
  push:
    branches:
      - hotfix/alumdoor-print-list-delete
    paths:
      - ".github/workflows/production-release-status.yml"
      - ".github/release/production-status.trigger"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  publish-status:
    name: Publish production release queue status
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot recent production runs
        uses: actions/github-script@v7
        with:
          script: |
            const targets = [
              { file: 'release-alu-tenant.yml', label: 'alu Tenant Worker' },
              { file: 'release-gateway.yml', label: 'Gateway' },
              { file: 'release-alumdoor-app.yml', label: 'Alumdoor app Worker' },
            ];
            const sections = [];
            for (const target of targets) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: target.file,
                branch: 'hotfix/alumdoor-print-list-delete',
                per_page: 10,
              });
              const rows = response.data.workflow_runs.slice(0, 6);
              sections.push(`### ${target.label}`);
              if (!rows.length) {
                sections.push('- No default-branch runs found.');
                continue;
              }
              for (const run of rows) {
                sections.push([
                  `- Run \`${run.id}\``,
                  `event=\`${run.event}\``,
                  `status=\`${run.status}\``,
                  `conclusion=\`${run.conclusion ?? 'pending'}\``,
                  `head=\`${run.head_sha}\``,
                  `[open](${run.html_url})`,
                  `created=\`${run.created_at}\``,
                ].join(' · '));
              }
              sections.push('');
            }
            const marker = '<!-- production-release-status-snapshot -->';
            const body = [
              marker,
              '## Production release queue snapshot',
              '',
              `Generated by run \`${context.runId}\` at \`${new Date().toISOString()}\`.`,
              '',
              ...sections,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 117,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 117,
                body,
              });
            }
            await core.summary.addRaw(body).write();
