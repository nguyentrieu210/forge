name: tmp-ui-v3-04-validation

on:
  push:
    branches:
      - ui/v3-04-data-surfaces
  pull_request:
    branches:
      - main

jobs:
  data-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Views typecheck
        run: pnpm --filter @metaforge/views run typecheck

      - name: V3 data-surface regression
        run: node --test client/packages/views/tests/data-surface-v3.test.mjs

      - name: Build production data-surface consumer
        run: pnpm --filter sample-wms run build

      - name: Verify generated CSS contains V3 business-surface selectors
        shell: bash
        run: |
          CSS_FILES=$(find client/apps/sample-wms/dist/assets -type f -name '*.css' -print)
          test -n "$CSS_FILES"
          grep -R -q 'mf-list-view' client/apps/sample-wms/dist/assets
          grep -R -q 'mf-form-section' client/apps/sample-wms/dist/assets
          grep -R -q 'mf-context-tabs' client/apps/sample-wms/dist/assets
