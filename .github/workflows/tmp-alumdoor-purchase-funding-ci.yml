# integration-base: 57461b481a8b22c8ab687af3e3f40468a9880958
name: Temp Alumdoor Purchase Funding CI

on:
  push:
    branches:
      - feat/alumdoor-purchase-funding-20260803-r3

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - id: server
        name: Build server
        continue-on-error: true
        run: pnpm --filter cloudforge run build
      - id: runtime
        name: Build runtime UI
        continue-on-error: true
        run: pnpm --filter runtime... run build
      - id: mobile
        name: Typecheck warehouse mobile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json 2>&1 | tee /tmp/mobile-tsc.log
      - id: contract
        name: Purchase funding contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test server/tests/alumdoor-purchase-funding-contract.test.mjs 2>&1 | tee /tmp/contract.log
      - id: sql
        name: Verify SQL migrations
        continue-on-error: true
        run: python3 server/scripts/verify-sql.py
      - name: Report validation result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          SERVER: ${{ steps.server.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          MOBILE: ${{ steps.mobile.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          SQL: ${{ steps.sql.outcome }}
        shell: bash
        run: |
          {
            echo "ALUMDOOR_PURCHASE_FUNDING_CI sha=$SHA server=$SERVER runtime=$RUNTIME mobile=$MOBILE contract=$CONTRACT sql=$SQL"
            if [ "$MOBILE" != success ] && [ -f /tmp/mobile-tsc.log ]; then
              echo
              echo '```text'
              tail -n 60 /tmp/mobile-tsc.log
              echo '```'
            fi
            if [ "$CONTRACT" != success ] && [ -f /tmp/contract.log ]; then
              echo
              echo '```text'
              tail -n 100 /tmp/contract.log
              echo '```'
            fi
          } > /tmp/pr-comment.txt
          gh pr comment 383 --body-file /tmp/pr-comment.txt
      - name: Fail job when any validation failed
        if: always()
        env:
          SERVER: ${{ steps.server.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          MOBILE: ${{ steps.mobile.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          SQL: ${{ steps.sql.outcome }}
        run: |
          test "$SERVER" = success
          test "$RUNTIME" = success
          test "$MOBILE" = success
          test "$CONTRACT" = success
          test "$SQL" = success
