name: Temporary Alumdoor Item Group Consumer Patch

on:
  push:
    paths:
      - '.github/workflows/_tmp-alumdoor-item-group-consumer-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize Item Group consumers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(file, from, to, expected = 1) {
            let text = fs.readFileSync(file, 'utf8');
            const count = text.split(from).length - 1;
            if (count !== expected) throw new Error(`${file}: expected ${expected} occurrences, found ${count}: ${from}`);
            text = text.split(from).join(to);
            fs.writeFileSync(file, text, 'utf8');
          }

          const itemOnly = 'server/scripts/build-alumdoor-item-only-import.mjs';
          replaceRequired(itemOnly,
            '    "Cửa siêu trường",\n',
            '    "Cửa Siêu Trường",\n');
          replaceRequired(itemOnly,
            '  if (doorGroups.has(sourceGroup)) return sourceGroup;\n',
            '  if (sourceGroup === "Cửa siêu trường") return "Cửa Siêu Trường";\n  if (doorGroups.has(sourceGroup)) return sourceGroup;\n');
          replaceRequired(itemOnly,
            '    ["Cửa siêu trường", "Cửa Siêu Trường"],\n',
            '    ["Cửa Siêu Trường", "Cửa Siêu Trường"],\n');

          const standardization = 'server/scripts/lib/alumdoor-item-standardization.mjs';
          replaceRequired(standardization,
            '    itemGroup: "Phụ kiện",\n',
            '    itemGroup: "Phụ kiện chung",\n',
            3);
          NODE
      - name: Commit normalized consumers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/scripts/build-alumdoor-item-only-import.mjs server/scripts/lib/alumdoor-item-standardization.mjs
          git diff --cached --check
          git commit -m "fix(alumdoor): normalize item group consumers"
          git push origin HEAD:${GITHUB_REF_NAME}
