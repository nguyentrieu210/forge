name: RC3 A0 Finalize Capability Status

on:
  push:
    branches:
      - agent/rc3-00-capability-convergence
    paths:
      - "server/scripts/rc3-finalize-capability-status.mjs"
      - "docs/FORGE_ENTERPRISE_CAPABILITY_STATUS.md"
      - "CURRENT_STATUS.md"
      - "NEXT_TASKS.md"
      - "docs/agents/rc/RC3_CONVERGENCE_20260804.md"
      - "docs/agents/rc/RC3_A0_FINALIZATION_REQUEST.md"
      - ".github/workflows/rc3-a0-finalize-capability-status.yml"
  pull_request:
    branches:
      - program/rc3-exact-main-release-confidence-20260804
      - main
    paths:
      - "server/scripts/rc3-finalize-capability-status.mjs"
      - "docs/FORGE_ENTERPRISE_CAPABILITY_STATUS.md"
      - "CURRENT_STATUS.md"
      - "NEXT_TASKS.md"
      - "docs/agents/rc/RC3_CONVERGENCE_20260804.md"
      - "docs/agents/rc/RC3_A0_FINALIZATION_REQUEST.md"
      - ".github/workflows/rc3-a0-finalize-capability-status.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair generator syntax deterministically
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server/scripts/rc3-finalize-capability-status.mjs")
          lines = path.read_text().splitlines()

          # Repair the Evidence Index regex without nested JS template-literal backticks.
          repaired_regex = False
          for i, line in enumerate(lines):
              if i > 0 and "Object.entries(evidence)" in lines[i - 1] and "const re = new RegExp(" in line:
                  lines[i] = '  const re = new RegExp("^- `" + key + "`:[^\\\\n]*$", "m");'
                  repaired_regex = True
                  break
          if not repaired_regex:
              raise SystemExit("RC3 evidence regex line not found")

          # Markdown code ticks inside these multiline JS template literals must be escaped.
          starts = (
              "const top30 = `",
              "const currentBlock = `",
              "const rc3Next = `",
          )
          in_block = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if not in_block and any(stripped.startswith(prefix) for prefix in starts):
                  in_block = True
                  # Preserve the opening delimiter, escape only additional ticks on the start line.
                  first = line.find("`")
                  prefix, rest = line[: first + 1], line[first + 1 :]
                  out = []
                  for j, ch in enumerate(rest):
                      if ch == "`" and (j == 0 or rest[j - 1] != "\\"):
                          out.append("\\`")
                      else:
                          out.append(ch)
                  lines[i] = prefix + "".join(out)
                  continue
              if in_block:
                  if stripped == "`;":
                      in_block = False
                      continue
                  out = []
                  for j, ch in enumerate(line):
                      if ch == "`" and (j == 0 or line[j - 1] != "\\"):
                          out.append("\\`")
                      else:
                          out.append(ch)
                  lines[i] = "".join(out)
          if in_block:
              raise SystemExit("RC3 multiline template sanitizer found an unterminated block")

          path.write_text("\n".join(lines) + "\n")
          PY
          node --check server/scripts/rc3-finalize-capability-status.mjs

      - name: Generate RC3 canonical status
        run: node server/scripts/rc3-finalize-capability-status.mjs

      - name: Validate 956 capability registry
        run: node server/scripts/validate-enterprise-capability-status.mjs

      - name: Diff safety
        run: git diff --check

      - name: Materialize generated convergence on A0 head
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/rc3-00-capability-convergence' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if git diff --quiet; then
            echo "RC3 canonical files already generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/scripts/rc3-finalize-capability-status.mjs docs/FORGE_ENTERPRISE_CAPABILITY_STATUS.md CURRENT_STATUS.md NEXT_TASKS.md docs/agents/rc/RC3_CONVERGENCE_20260804.md
          git commit -m "docs(rc3): finalize capability truth convergence"
          git push origin HEAD:agent/rc3-00-capability-convergence
          echo "Generated commit: $(git rev-parse HEAD)"
          node server/scripts/validate-enterprise-capability-status.mjs
