name: UI Pull Request Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, gate, browser QA and authenticated Purchase
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ui=true
          purchase=true
          auth=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
            ui=false
            purchase=false
            auth=false

            if grep -Eq '^(client/|server/apps/gateway-worker/|server/apps/tenant-worker/|server/apps-src/alumdoor-worker/|server/apps/purchase-qa-callback/|server/scripts/(seed-local|seed-purchase-qa-local|cleanup-stock-qa-local)\.mjs$|server/packages/app-registry/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ui-pr-validation\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
              ui=true
            fi
            if grep -Eiq '^(client/e2e-forge/.*purchase|server/.*purchase)' "$RUNNER_TEMP/changed-files.txt"; then
              purchase=true
              auth=true
            fi
            if grep -Eq '^(client/e2e-forge/auth-tests/|client/e2e-forge/playwright\.auth\.config\.ts$|server/apps/tenant-worker/|server/apps/purchase-qa-callback/|server/apps-src/alumdoor-worker/wrangler\.purchase-qa\.jsonc$|server/packages/app-registry/|server/scripts/(seed-local|seed-purchase-qa-local|cleanup-stock-qa-local)\.mjs$)' "$RUNNER_TEMP/changed-files.txt"; then
              auth=true
            fi
          fi
          cat "$RUNNER_TEMP/changed-files.txt" 2>/dev/null || true
          {
            echo "ui=$ui"
            echo "purchase=$purchase"
            echo "auth=$auth"
          } >> "$GITHUB_OUTPUT"

      - name: Unrelated fast path
        if: steps.scope.outputs.ui != 'true'
        run: echo "No UI, Gateway, tenant runtime, or browser QA files changed."

      - name: Install pnpm
        if: steps.scope.outputs.ui == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        if: steps.scope.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.ui == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        if: steps.scope.outputs.ui == 'true'
        run: pnpm --filter metaforge run lint

      - name: Build browser targets
        if: steps.scope.outputs.ui == 'true'
        run: pnpm build

      - name: Install Chromium for visual QA
        if: steps.scope.outputs.ui == 'true'
        run: pnpm --filter e2e-forge exec playwright install --with-deps chromium

      - name: Run MetaForge workspace browser QA
        if: steps.scope.outputs.ui == 'true'
        run: pnpm --filter @metaforge/demo run e2e

      - name: Run Alumdoor browser QA
        if: steps.scope.outputs.ui == 'true'
        run: pnpm --filter e2e-forge exec playwright test --config playwright.ui.config.ts

      - name: Run purchase allocation browser QA
        if: steps.scope.outputs.purchase == 'true'
        run: pnpm --filter e2e-forge exec playwright test --config playwright.purchase.config.ts

      - name: Upload browser evidence
        if: steps.scope.outputs.ui == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ github.run_id }}
          path: |
            client/apps/demo/test-results/
            client/e2e-forge/test-results/ui-visual/
            client/e2e-forge/playwright-report/ui-visual/
            client/e2e-forge/test-results/purchase-ui/
            client/e2e-forge/playwright-report/purchase-ui/
          if-no-files-found: warn
          retention-days: 14

      - name: Create ephemeral local auth credential
        if: steps.scope.outputs.auth == 'true'
        shell: bash
        run: |
          set -euo pipefail
          auth_user="qa-${GITHUB_RUN_ID}@example.test"
          auth_password="$(openssl rand -hex 24)"
          auth_session_secret="$(openssl rand -hex 32)"
          internal_auth_secret="$(openssl rand -hex 32)"
          cleanup_manifest="$RUNNER_TEMP/forge-stock-qa-cleanup-${GITHUB_RUN_ID}.jsonl"
          : > "$cleanup_manifest"
          echo "::add-mask::$auth_password"
          echo "::add-mask::$auth_session_secret"
          echo "::add-mask::$internal_auth_secret"
          {
            echo "FORGE_AUTH_USER=$auth_user"
            echo "FORGE_AUTH_PASSWORD=$auth_password"
            echo "FORGE_AUTH_SESSION_SECRET=$auth_session_secret"
            echo "FORGE_INTERNAL_AUTH_SECRET=$internal_auth_secret"
            echo "FORGE_QA_CLEANUP_MANIFEST=$cleanup_manifest"
            echo "FORGE_QA_TENANT_ID=demo"
          } >> "$GITHUB_ENV"

      - name: Prepare local tenant database
        if: steps.scope.outputs.auth == 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply cloudforge-demo --local --config apps/tenant-worker/wrangler.purchase-qa.jsonc
          node scripts/seed-local.mjs --auth-only --user "$FORGE_AUTH_USER" --password "$FORGE_AUTH_PASSWORD"

      - name: Start local tenant, callback gateway and Alumdoor app workers
        if: steps.scope.outputs.auth == 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail

          nohup pnpm exec wrangler dev \
            --config apps/tenant-worker/wrangler.purchase-qa.jsonc \
            --port 8801 \
            --inspector-port 9231 \
            --local \
            --var "SESSION_SECRET:$FORGE_AUTH_SESSION_SECRET" \
            --var "INTERNAL_AUTH_SECRET:$FORGE_INTERNAL_AUTH_SECRET" \
            > "$RUNNER_TEMP/forge-auth-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/forge-auth-backend.pid"

          nohup pnpm exec wrangler dev \
            --config apps/purchase-qa-callback/wrangler.jsonc \
            --port 8802 \
            --inspector-port 9232 \
            --local \
            --var "INTERNAL_AUTH_SECRET:$FORGE_INTERNAL_AUTH_SECRET" \
            > "$RUNNER_TEMP/forge-callback-gateway.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/forge-callback-gateway.pid"

          nohup pnpm exec wrangler dev \
            --config apps-src/alumdoor-worker/wrangler.purchase-qa.jsonc \
            --port 8803 \
            --inspector-port 9233 \
            --local \
            > "$RUNNER_TEMP/forge-alumdoor-worker.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/forge-alumdoor-worker.pid"

          tenant_ready=0
          callback_ready=0
          app_ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8801/health > /dev/null; then tenant_ready=1; fi
            if curl --fail --silent --show-error http://127.0.0.1:8802/health > /dev/null; then callback_ready=1; fi
            if curl --silent --show-error --output /dev/null http://127.0.0.1:8803/health; then app_ready=1; fi
            if [ "$tenant_ready" = "1" ] && [ "$callback_ready" = "1" ] && [ "$app_ready" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "$tenant_ready" != "1" ] || [ "$callback_ready" != "1" ] || [ "$app_ready" != "1" ]; then
            echo "tenant_ready=$tenant_ready callback_ready=$callback_ready app_ready=$app_ready"
            cat "$RUNNER_TEMP/forge-auth-backend.log" || true
            cat "$RUNNER_TEMP/forge-callback-gateway.log" || true
            cat "$RUNNER_TEMP/forge-alumdoor-worker.log" || true
            exit 1
          fi
          sleep 2

      - name: Install authoritative Alumdoor app and Purchase QA masters
        if: steps.scope.outputs.auth == 'true'
        working-directory: server
        shell: bash
        env:
          FORGE_ORIGIN: http://127.0.0.1:8801
          FORGE_ADMIN_USER: ${{ env.FORGE_AUTH_USER }}
          FORGE_ADMIN_PASSWORD: ${{ env.FORGE_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/forge-app.mjs briefs/alumdoor-v2.json \
            --origin "$FORGE_ORIGIN" \
            --admin "$FORGE_ADMIN_USER" \
            2>&1 | tee "$RUNNER_TEMP/forge-app-install.log"
          node scripts/seed-purchase-qa-local.mjs \
            2>&1 | tee "$RUNNER_TEMP/purchase-qa-seed.log"

      - name: Run Alumdoor cookie auth and Purchase lifecycle QA
        if: steps.scope.outputs.auth == 'true'
        env:
          FORGE_AUTH_BACKEND: http://127.0.0.1:8801
        run: pnpm --filter e2e-forge exec playwright test --config playwright.auth.config.ts

      - name: Stop local Purchase QA workers
        if: steps.scope.outputs.auth == 'true' && always()
        shell: bash
        run: |
          for pid_file in \
            "$RUNNER_TEMP/forge-auth-backend.pid" \
            "$RUNNER_TEMP/forge-callback-gateway.pid" \
            "$RUNNER_TEMP/forge-alumdoor-worker.pid"; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

      - name: Cleanup exact P0 QA lineage fixtures and verify no residue
        if: steps.scope.outputs.auth == 'true' && always()
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$FORGE_QA_CLEANUP_MANIFEST" ]; then
            echo "No P0 lineage fixtures were created; cleanup has nothing to remove."
            exit 0
          fi
          node scripts/cleanup-stock-qa-local.mjs --manifest="$FORGE_QA_CLEANUP_MANIFEST" \
            2>&1 | tee "$RUNNER_TEMP/stock-qa-cleanup.log"

      - name: Upload auth evidence
        if: steps.scope.outputs.auth == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: alumdoor-auth-session-evidence-${{ github.run_id }}
          path: |
            client/e2e-forge/test-results/auth-session/
            client/e2e-forge/playwright-report/auth-session/
            ${{ runner.temp }}/forge-auth-backend.log
            ${{ runner.temp }}/forge-callback-gateway.log
            ${{ runner.temp }}/forge-alumdoor-worker.log
            ${{ runner.temp }}/forge-app-install.log
            ${{ runner.temp }}/purchase-qa-seed.log
            ${{ runner.temp }}/stock-qa-cleanup.log
            ${{ env.FORGE_QA_CLEANUP_MANIFEST }}
          if-no-files-found: warn
          retention-days: 30
