name: UI Pull Request Validation

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, gate, browser QA and auth smoke
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ui=true
          purchase=true
          auth=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
            ui=false
            purchase=false
            auth=false

            if grep -Eq '^(client/|server/apps/gateway-worker/|server/apps/tenant-worker/|server/apps-src/alumdoor-worker/|server/apps/purchase-qa-callback/|server/scripts/(seed-local|seed-purchase-qa-local)\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ui-pr-validation\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
              ui=true
            fi
            if grep -Eiq '^(client/e2e-forge/.*purchase|server/.*purchase)' "$RUNNER_TEMP/changed-files.txt"; then
              purchase=true
              auth=true
            fi
            if grep -Eq '^(client/e2e-forge/auth-tests/|client/e2e-forge/playwright\.auth\.config\.ts$|server/apps/tenant-worker/|server/scripts/(seed-local|seed-purchase-qa-local)\.mjs$)' "$RUNNER_TEMP/changed-files.txt"; then
              auth=true
            fi
          fi
          cat "$RUNNER_TEMP/changed-files.txt" 2>/dev/null || true
          {
            echo "ui=$ui"
            echo "purchase=$purchase"
            echo "auth=$auth"
          } >> "$GITHUB_OUTPUT"

      - name: Unrelated fast path
        if: steps.scope.outputs.ui != 'true'
        run: echo "No UI, Gateway, tenant runtime, or browser QA files changed."

      - name: Install pnpm
        if: steps.scope.outputs.ui == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        if: steps.scope.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.ui == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        if: steps.scope.outputs.ui == 'true'
        run: pnpm --filter metaforge run lint

      - name: Build browser targets
        if: steps.scope.outputs.ui == 'true'
        run: pnpm build

      - name: Install Chromium for visual QA
        if: steps.scope.outputs.ui == 'true'
        run: pnpm --filter e2e-forge exec playwright install --with-deps chromium

      - name: Run Alumdoor browser QA
        if: steps.scope.outputs.ui == 'true'
        run: pnpm --filter e2e-forge exec playwright test --config playwright.ui.config.ts

      - name: Run purchase allocation browser QA
        if: steps.scope.outputs.purchase == 'true'
        run: pnpm --filter e2e-forge exec playwright test --config playwright.purchase.config.ts

      - name: Upload browser evidence
        if: steps.scope.outputs.ui == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: alumdoor-ui-evidence-${{ github.run_id }}
          path: |
            client/e2e-forge/test-results/ui-visual/
            client/e2e-forge/playwright-report/ui-visual/
            client/e2e-forge/test-results/purchase-ui/
            client/e2e-forge/playwright-report/purchase-ui/
          if-no-files-found: warn
          retention-days: 14

      - name: Create ephemeral local auth credential
        if: steps.scope.outputs.auth == 'true'
        shell: bash
        run: |
          set -euo pipefail
          auth_user="qa-${GITHUB_RUN_ID}@example.test"
          auth_password="$(openssl rand -hex 24)"
          auth_session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$auth_password"
          echo "::add-mask::$auth_session_secret"
          {
            echo "FORGE_AUTH_USER=$auth_user"
            echo "FORGE_AUTH_PASSWORD=$auth_password"
            echo "FORGE_AUTH_SESSION_SECRET=$auth_session_secret"
          } >> "$GITHUB_ENV"

      - name: Prepare local tenant database
        if: steps.scope.outputs.auth == 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc
          node scripts/seed-local.mjs --user "$FORGE_AUTH_USER" --password "$FORGE_AUTH_PASSWORD"

      - name: Start local tenant worker
        if: steps.scope.outputs.auth == 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm exec wrangler dev \
            --config apps/tenant-worker/wrangler.jsonc \
            --port 8801 \
            --local \
            --var "SESSION_SECRET:$FORGE_AUTH_SESSION_SECRET" \
            > "$RUNNER_TEMP/forge-auth-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/forge-auth-backend.pid"
          ready=0
          for ((attempt = 1; attempt <= 45; attempt++)); do
            if curl --fail --silent --show-error http://127.0.0.1:8801/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat "$RUNNER_TEMP/forge-auth-backend.log"
            exit 1
          fi

      - name: Run Alumdoor cookie auth smoke
        if: steps.scope.outputs.auth == 'true'
        env:
          FORGE_AUTH_BACKEND: http://127.0.0.1:8801
        run: pnpm --filter e2e-forge exec playwright test --config playwright.auth.config.ts

      - name: Upload auth evidence
        if: steps.scope.outputs.auth == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: alumdoor-auth-session-evidence-${{ github.run_id }}
          path: |
            client/e2e-forge/test-results/auth-session/
            client/e2e-forge/playwright-report/auth-session/
            ${{ runner.temp }}/forge-auth-backend.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local tenant worker
        if: steps.scope.outputs.auth == 'true' && always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/forge-auth-backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/forge-auth-backend.pid")" 2>/dev/null || true
          fi
