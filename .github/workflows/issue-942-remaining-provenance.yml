name: Issue 942 Remaining Provenance
on:
  push:
    branches: [agent/alumdoor-v2-reproducible]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Trace remaining current contracts
        run: |
          for needle in 'source_batch_no' 'Vật tư tuyến tính' 'geometry_profile' 'geometry_rules' 'Item Color Scope' 'Surface Finish Excluded Item' 'bom_actual_components' 'Chủ xưởng": "r"'; do
            echo "===== $needle ====="
            git log --all --date=short --format='%H %ad %s' -S"$needle" -- server/briefs/alumdoor-v2.json server/briefs/alumdoor.json server/scripts/build-alumdoor-v2-brief.mjs | head -12 || true
          done
