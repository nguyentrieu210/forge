name: Production Release Inspector

on:
  pull_request:
    branches:
      - hotfix/alumdoor-print-list-delete
    paths:
      - ".github/workflows/production-release-inspector.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Inspect production workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Print recent production runs
        uses: actions/github-script@v7
        with:
          script: |
            const targets = [
              { file: 'release-alu-tenant.yml', label: 'tenant' },
              { file: 'release-gateway.yml', label: 'gateway' },
              { file: 'release-alumdoor-app.yml', label: 'app' },
            ];
            const snapshot = {};
            for (const target of targets) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: target.file,
                branch: 'hotfix/alumdoor-print-list-delete',
                per_page: 12,
              });
              snapshot[target.label] = response.data.workflow_runs.slice(0, 12).map((run) => ({
                id: run.id,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                html_url: run.html_url,
                created_at: run.created_at,
                updated_at: run.updated_at,
              }));
            }
            console.log('PRODUCTION_RELEASE_SNAPSHOT_BEGIN');
            console.log(JSON.stringify(snapshot, null, 2));
            console.log('PRODUCTION_RELEASE_SNAPSHOT_END');
