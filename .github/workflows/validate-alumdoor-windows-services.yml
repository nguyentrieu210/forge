name: Validate Alumdoor Windows Services

on:
  push:
    branches:
      - agent/alumdoor-windows-runtime-services

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate runtime service scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          node --check server/scripts/alumdoor-runtime-maintenance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'maintenance script syntax failed' }
          node --check server/scripts/alumdoor-runtime-service-host.mjs
          if ($LASTEXITCODE -ne 0) { throw 'service host syntax failed' }

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'server/scripts/install-alumdoor-runtime-services.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell installer parse failed'
          }

      - name: Exercise maintenance sequencing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ALUMDOOR_SERVICE_HOME = Join-Path $env:RUNNER_TEMP 'alumdoor-service-test'
          New-Item -ItemType Directory -Force -Path $env:ALUMDOOR_SERVICE_HOME | Out-Null

          node server/scripts/alumdoor-runtime-maintenance.mjs on
          if (-not (Test-Path (Join-Path $env:ALUMDOOR_SERVICE_HOME 'maintenance.flag'))) { throw 'backend maintenance flag missing' }
          if (-not (Test-Path (Join-Path $env:ALUMDOOR_SERVICE_HOME 'desk-maintenance.flag'))) { throw 'Desk maintenance flag missing' }

          node server/scripts/alumdoor-runtime-maintenance.mjs off backend
          if (Test-Path (Join-Path $env:ALUMDOOR_SERVICE_HOME 'maintenance.flag')) { throw 'backend maintenance flag was not released' }
          if (-not (Test-Path (Join-Path $env:ALUMDOOR_SERVICE_HOME 'desk-maintenance.flag'))) { throw 'Desk was released too early' }

          node server/scripts/alumdoor-runtime-maintenance.mjs off desk
          if (Test-Path (Join-Path $env:ALUMDOOR_SERVICE_HOME 'desk-maintenance.flag')) { throw 'Desk maintenance flag was not released' }

      - name: Validate integration hooks and diff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runLocal = Get-Content run-local.bat -Raw
          if ($runLocal -notmatch 'off backend') { throw 'run-local does not release backend separately' }
          if ($runLocal -notmatch 'off desk') { throw 'run-local does not release Desk separately' }
          if ($runLocal -notmatch 'ForgeAlumdoorBackend') { throw 'backend service hook missing' }
          if ($runLocal -notmatch 'ForgeAlumdoorDesk') { throw 'Desk service hook missing' }

          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
