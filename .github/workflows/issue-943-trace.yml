name: Issue 943 Trace
on:
  push:
    branches:
      - agent/alumdoor-tam-lien-ray-geometry
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace ray type and geometry authority
        run: |
          echo '=== evaluateGeometryRules usage ==='
          grep -R "evaluateGeometryRules" -n server client --exclude-dir=node_modules || true
          echo '=== ray_type ==='
          grep -R "ray_type" -n server client --exclude-dir=node_modules | head -200 || true
          echo '=== Sales Order Item generated metadata ==='
          node <<'NODE'
          const fs=require('node:fs'); const b=JSON.parse(fs.readFileSync('server/briefs/alumdoor-v2.json','utf8'));
          const d=b.doctypes.find(x=>x.name==='Sales Order Item');
          console.log(JSON.stringify(d,null,2));
          console.log('Geometry Profile doctype',JSON.stringify(b.doctypes.find(x=>x.name==='Geometry Profile'),null,2));
          console.log('Geometry Field doctype',JSON.stringify(b.doctypes.find(x=>x.name==='Geometry Field'),null,2));
          console.log('Cutting Policy fields',JSON.stringify(b.doctypes.find(x=>x.name==='Cutting Policy')?.fields,null,2));
          const fixtures=b.fixtures.filter(x=>['Geometry Profile','Cutting Policy'].includes(x.type) && (x.name==='GP-CUA-UC'||x.name==='Cửa tấm liền Úc — công thức chuẩn'));
          console.log('fixtures',JSON.stringify(fixtures,null,2));
          NODE
          echo '=== Workbench dynamic/config field usage ==='
          grep -R "geometry_profile\|geometry_rules\|configFields\|dynamic.*field\|field_overrides" -n client/packages/views/src/app/vertical/alumdoor/sales-order-v2 server/apps-src/alumdoor-worker/src/ui-child-preview.ts | head -240 || true
