name: Runtime Gap One Shot Patch

on:
  push:
    branches:
      - chatgpt/runtime-ui-gap-fixes
    paths:
      - ".github/scripts/runtime-gap-child-grid-patch.py"
      - ".github/workflows/runtime-gap-one-shot-patch.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-gap-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runtime-ui-gap-fixes
          fetch-depth: 0
      - name: Apply exact-anchor ChildGrid policy extraction
        run: python .github/scripts/runtime-gap-child-grid-patch.py
      - name: Verify generated diff
        run: git diff --check
      - name: Retire one-shot patch machinery
        run: rm -f .github/scripts/runtime-gap-shell-patch.py .github/scripts/runtime-gap-child-grid-patch.py .github/workflows/runtime-gap-one-shot-patch.yml
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "refactor(runtime): isolate child-grid business policy [runtime-gap-autopatch]"
          git push origin HEAD:chatgpt/runtime-ui-gap-fixes
