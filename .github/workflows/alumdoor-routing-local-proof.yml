name: Alumdoor Routing Local Proof

on:
  push:
    branches: [agent-live]
    paths:
      - 'apps/alumdoor/data/production-routing.json'
      - 'server/scripts/alumdoor-routing-local.mjs'
      - 'server/apps-src/manufacturing-qms/doctypes/manufacturing-routing.json'
      - 'server/apps-src/manufacturing-qms/doctypes/manufacturing-routing-operation.json'
      - '.github/workflows/alumdoor-routing-local-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  routing-local-proof:
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - name: Validate, import and replay against local D1
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'server\reports\alumdoor-production-routing-audit.json'
          $sql = 'server\imports\alumdoor-production-routing-local.sql'
          $verify = 'server\imports\.alumdoor-routing-verify.sql'
          try {
            $dirty = git status --porcelain=v1
            if ($dirty) { throw "C:\alumdoor is dirty; refusing local D1 mutation: $dirty" }
            git fetch origin agent-live --prune
            if ($LASTEXITCODE -ne 0) { throw 'git fetch agent-live failed' }
            $branch = (git rev-parse --abbrev-ref HEAD).Trim()
            if ($branch -ne 'agent-live') { throw "Expected C:\alumdoor on agent-live, got $branch" }
            git merge --ff-only origin/agent-live
            if ($LASTEXITCODE -ne 0) { throw 'fast-forward agent-live failed' }

            & node server\scripts\alumdoor-routing-local.mjs validate
            if ($LASTEXITCODE -ne 0) { throw 'routing validate failed' }
            & node server\scripts\alumdoor-routing-local.mjs build
            if ($LASTEXITCODE -ne 0) { throw 'routing build failed' }
            & node server\scripts\alumdoor-routing-local.mjs import-local
            if ($LASTEXITCODE -ne 0) { throw 'routing local import failed' }
            & node server\scripts\alumdoor-routing-local.mjs verify-local
            if ($LASTEXITCODE -ne 0) { throw 'routing local verify failed' }
            & node server\scripts\alumdoor-routing-local.mjs replay-local
            if ($LASTEXITCODE -ne 0) { throw 'routing local replay failed' }
          }
          finally {
            git checkout -- $report 2>$null
            Remove-Item -Force $sql,$verify -ErrorAction SilentlyContinue
          }
