name: Validate Tiến Đạt Purchase Completion

on:
  pull_request:
    branches:
      - main
    paths:
      - server/apps-src/alumdoor-worker/**
      - server/packages/clouderp-core/**
      - server/packages/document-kernel/**
      - server/tests/purchase-*.test.mjs
      - server/tests/tien-dat-purchase-*.test.mjs
      - client/packages/views/src/action/**
      - .github/workflows/validate-tien-dat-purchase-completion.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build server and client
        run: pnpm run build
      - name: Typecheck server and client
        run: pnpm run typecheck
      - name: Focused Tiến Đạt regressions
        run: |
          node --test server/tests/purchase-receipt-submit-preview.test.mjs
          node --test server/tests/purchase-supplier-delivery-dashboard.test.mjs
          node --test server/tests/purchase-supplier-settlement.test.mjs
          node --test server/tests/tien-dat-purchase-fifo.test.mjs
          node --test server/tests/tien-dat-purchase-bulk-fifo.test.mjs
      - name: Full server test suite
        run: pnpm run server:test
      - name: Client test suite
        run: pnpm run client:test
