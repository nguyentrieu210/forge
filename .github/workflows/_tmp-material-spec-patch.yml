name: Temporary Material Specification Patch

on:
  push:
    paths:
      - '.github/workflows/_tmp-material-spec-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alumdoor-master-layer-material-specification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical Material Specification layer
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path('.')

          catalog = r'''/**
           * Canonical Alumdoor Material Specification policy.
           *
           * Material Specification owns intrinsic technical facts of a material:
           * section/profile code, material grade, thickness, standard geometry and kg/m.
           * It does NOT own stock/purchase UOM, lot measurement rules, cutting formulas,
           * leaf-count geometry, pricing or BOM quantities.
           *
           * The evidence-backed target list is intentionally loaded from the existing
           * atomic Item standardization source. This module is the single authority for
           * turning those targets into Material Specification records.
           */
          export const MATERIAL_SPECIFICATION_TYPES = Object.freeze([
            "Nhôm cây/lá",
            "Ống/trục",
            "Tấm/Kính",
            "Cuộn",
            "Vật tư tuyến tính",
            "Khác",
          ]);

          const SUPPLIER = "TIẾN ĐẠT";

          export function materialSpecificationCodeForTarget(target) {
            return `ĐM-${target.supplierCode ?? target.itemCode}`;
          }

          export function materialSpecificationTypeForTarget(target) {
            if (target.specType) return target.specType;
            if (target.inventoryMode === "Nhôm cây/lá") return "Nhôm cây/lá";
            if (Number(target.kgPerM) > 0) return "Vật tư tuyến tính";
            return "Khác";
          }

          export function materialSpecificationFromTarget(target) {
            const specCode = materialSpecificationCodeForTarget(target);
            const specType = materialSpecificationTypeForTarget(target);
            if (!MATERIAL_SPECIFICATION_TYPES.includes(specType)) {
              throw new Error(`Loại quy cách không hợp lệ cho ${target.itemCode}: ${specType}`);
            }
            const kgPerM = Number(target.kgPerM);
            if (!(kgPerM > 0)) throw new Error(`Thiếu kg/m kỹ thuật cho ${target.itemCode}`);
            if (!target.itemGroup) throw new Error(`Thiếu nhóm hàng cho ${target.itemCode}`);

            const payload = {
              spec_code: specCode,
              spec_name: `Quy cách ${target.itemName}`,
              item_group: target.itemGroup,
              spec_type: specType,
              profile_system: target.supplierCode ? SUPPLIER : "ALUMDOOR",
              theoretical_kg_per_m: kgPerM,
              ...(specType === "Nhôm cây/lá" || specType === "Ống/trục"
                ? { section_code: target.sectionCode ?? target.supplierCode ?? target.itemCode }
                : {}),
              ...(Number(target.thicknessMm) > 0 ? { thickness_mm: Number(target.thicknessMm) } : {}),
              note: `Barem kỹ thuật ${kgPerM} kg/m; dùng để đối chiếu/quy đổi kỹ thuật, không tự sinh số lượng mua, tồn, cắt hay BOM.`,
              disabled: false,
              _migration_source: "alumdoor-material-specification-canonical-2026-08-16",
            };
            return Object.freeze({
              specCode,
              itemCode: target.itemCode,
              itemName: target.itemName,
              itemGroup: target.itemGroup,
              specType,
              kgPerM,
              payload: Object.freeze(payload),
            });
          }

          export async function loadMaterialSpecificationCatalog(repoRoot) {
            // Dynamic import avoids a module-initialization cycle: item-standardization
            // imports the pure helpers above, while this catalogue loader reuses its
            // already-audited 17 atomic kg/m targets.
            const { loadKgItems } = await import("./alumdoor-item-standardization.mjs");
            const targets = await loadKgItems(repoRoot);
            const rows = targets.map(materialSpecificationFromTarget);
            const duplicateSpecs = rows.filter((row, index) => rows.findIndex((x) => x.specCode === row.specCode) !== index);
            const duplicateItems = rows.filter((row, index) => rows.findIndex((x) => x.itemCode === row.itemCode) !== index);
            if (duplicateSpecs.length) throw new Error(`Mã quy cách bị lặp: ${duplicateSpecs.map((x) => x.specCode).join(", ")}`);
            if (duplicateItems.length) throw new Error(`Item có nhiều quy cách canonical: ${duplicateItems.map((x) => x.itemCode).join(", ")}`);
            return Object.freeze(rows);
          }
          '''
          # Remove indentation introduced by Python raw block.
          import textwrap
          (root/'server/scripts/lib/alumdoor-material-specification-catalog.mjs').write_text(textwrap.dedent(catalog).lstrip(), encoding='utf-8')

          seed = r'''import { fileURLToPath, pathToFileURL } from "node:url";
          import { dirname, resolve } from "node:path";
          import { writeFile } from "node:fs/promises";
          import { loadMaterialSpecificationCatalog } from "./lib/alumdoor-material-specification-catalog.mjs";

          const quote = (value) => `'${String(value).replaceAll("'", "''")}'`;
          const now = "2026-08-16T15:15:00.000Z";

          function appendDocumentUpsert(sql, tenant, doctype, name, payload) {
            const json = JSON.stringify(payload);
            sql.push(`INSERT INTO documents
            (tenant_id,doc_key,doctype,name,owner,docstatus,status,version,created_at,modified_at,modified_by,payload_json)
          VALUES(${quote(tenant)},${quote(`${doctype}:${name}`)},${quote(doctype)},${quote(name)},'admin',0,'Draft',1,${quote(now)},${quote(now)},'admin',${quote(json)})
          ON CONFLICT(tenant_id,doc_key) DO UPDATE SET
            payload_json=excluded.payload_json,modified_at=excluded.modified_at,modified_by=excluded.modified_by,
            version=documents.version+1
          WHERE documents.payload_json<>excluded.payload_json;`);
          }

          function appendSearchUpsert(sql, tenant, doctype, name, title, content) {
            sql.push(`INSERT INTO document_search(tenant_id,doctype,name,title,content,modified_at)
          VALUES(${quote(tenant)},${quote(doctype)},${quote(name)},${quote(title)},${quote(content)},${quote(now)})
          ON CONFLICT(tenant_id,doctype,name) DO UPDATE SET
            title=excluded.title,content=excluded.content,modified_at=excluded.modified_at
          WHERE document_search.title<>excluded.title OR document_search.content<>excluded.content;`);
          }

          export async function buildMaterialSpecificationSeed(repoRoot, tenant = "demo") {
            const catalog = await loadMaterialSpecificationCatalog(repoRoot);
            const sql = [
              "-- Canonical Alumdoor Material Specification seed.",
              "-- Scope is deliberately narrow: technical specification docs + Item links only.",
              "-- NO Measurement Profile, UOM, inventory mode, cutting geometry, pricing or BOM writes.",
            ];
            for (const row of catalog) {
              appendDocumentUpsert(sql, tenant, "Material Specification", row.specCode, row.payload);
              appendSearchUpsert(
                sql, tenant, "Material Specification", row.specCode, row.payload.spec_name,
                `${row.specCode} ${row.itemCode} ${row.itemGroup} ${row.specType} ${row.kgPerM} kg/m`,
              );
              sql.push(`UPDATE documents
          SET payload_json=json_set(payload_json,'$.material_specification',${quote(row.specCode)}),
              modified_at=${quote(now)},modified_by='admin',version=version+1
          WHERE tenant_id=${quote(tenant)} AND doctype='Item' AND name=${quote(row.itemCode)}
            AND COALESCE(json_extract(payload_json,'$.material_specification'),'')<>${quote(row.specCode)};`);
            }
            return { sql: sql.join("\n\n") + "\n", catalog };
          }

          async function main() {
            const [tenant = "demo", outputArg] = process.argv.slice(2);
            const repoRoot = resolve(dirname(fileURLToPath(import.meta.url)), "..", "..");
            const { sql, catalog } = await buildMaterialSpecificationSeed(repoRoot, tenant);
            if (outputArg) await writeFile(resolve(outputArg), sql, "utf8");
            else process.stdout.write(sql);
            console.error(JSON.stringify({ tenant, canonical_specs: catalog.length, linked_items: catalog.length, output: outputArg ?? "stdout" }));
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(resolve(process.argv[1])).href) await main();
          '''
          (root/'server/scripts/seed-alumdoor-material-specifications-local.mjs').write_text(textwrap.dedent(seed).lstrip(), encoding='utf-8')

          builder = r'''import { writeFile } from "node:fs/promises";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          import { buildMaterialSpecificationSeed } from "./seed-alumdoor-material-specifications-local.mjs";

          const [tenantArg = "demo", sqlArg, auditArg] = process.argv.slice(2);
          if (!sqlArg || !auditArg) {
            throw new Error("Usage: node build-alumdoor-profile-specifications.mjs [tenant] <output.sql> <audit.json>");
          }
          const repoRoot = resolve(dirname(fileURLToPath(import.meta.url)), "..", "..");
          const { sql, catalog } = await buildMaterialSpecificationSeed(repoRoot, tenantArg);
          const audit = {
            generated_at: "2026-08-16T15:15:00.000Z",
            authority: "server/scripts/lib/alumdoor-material-specification-catalog.mjs",
            canonical_specs: catalog.length,
            item_links: catalog.map((row) => ({ item_code: row.itemCode, material_specification: row.specCode })),
            retired_legacy_profile_map: true,
          };
          await writeFile(resolve(sqlArg), sql, "utf8");
          await writeFile(resolve(auditArg), `${JSON.stringify(audit, null, 2)}\n`, "utf8");
          console.log(JSON.stringify({ sql: resolve(sqlArg), audit: resolve(auditArg), canonical_specs: catalog.length }, null, 2));
          '''
          (root/'server/scripts/build-alumdoor-profile-specifications.mjs').write_text(textwrap.dedent(builder).lstrip(), encoding='utf-8')

          # Route standardization through the canonical Material Specification policy.
          p = root/'server/scripts/lib/alumdoor-item-standardization.mjs'
          s = p.read_text(encoding='utf-8')
          marker = 'import { resolve } from "node:path";\n'
          if 'alumdoor-material-specification-catalog.mjs' not in s:
            s = s.replace(marker, marker + 'import { materialSpecificationCodeForTarget, materialSpecificationFromTarget } from "./alumdoor-material-specification-catalog.mjs";\n')
          old = '''function specCode(target) {\n  return `ĐM-${target.supplierCode ?? target.itemCode}`;\n}\n\n'''
          if old not in s:
            raise SystemExit('specCode function not found')
          s = s.replace(old, '')
          s = s.replace('material_specification: specCode(target),', 'material_specification: materialSpecificationCodeForTarget(target),')
          old_loop = '''  for (const target of targets) {\n    const spec = specCode(target);\n    appendPatchUpsert(sql, "Material Specification", spec, {\n      spec_code: spec,\n      spec_name: `Định mức ${target.itemName}`,\n      item_group: target.itemGroup,\n      spec_type: target.specType ?? "Nhôm cây/lá",\n      profile_system: target.supplierCode ? SUPPLIER : "Alumdoor",\n      section_code: target.sectionCode ?? target.supplierCode ?? target.itemCode,\n      theoretical_kg_per_m: target.kgPerM,\n      ...(target.thicknessMm ? { thickness_mm: target.thicknessMm } : {}),\n      note: `Định mức xác nhận: ${target.kgPerM} kg/m. Chỉ lưu để đối chiếu và quy đổi đơn vị; không tự sinh số kg đặt mua.`,\n      disabled: false,\n      _migration_source: MIGRATION_SOURCE,\n    });\n    appendSearchUpsert(\n      sql,\n      "Material Specification",\n      spec,\n      `Định mức ${target.itemName}`,\n      `${spec} ${target.itemCode} ${target.supplierCode ?? ""} ${target.kgPerM} kg/m`,\n    );\n'''
          new_loop = '''  for (const target of targets) {\n    const specification = materialSpecificationFromTarget(target);\n    const spec = specification.specCode;\n    appendPatchUpsert(sql, "Material Specification", spec, specification.payload);\n    appendSearchUpsert(\n      sql,\n      "Material Specification",\n      spec,\n      specification.payload.spec_name,\n      `${spec} ${target.itemCode} ${target.supplierCode ?? ""} ${target.kgPerM} kg/m`,\n    );\n'''
          if old_loop not in s:
            raise SystemExit('Material Specification standardization loop not found')
          s = s.replace(old_loop, new_loop)
          p.write_text(s, encoding='utf-8')

          # Extend schema for linear technical materials and bump V2 metadata version.
          for rel in ['server/briefs/alumdoor.json', 'server/briefs/alumdoor-v2.json']:
            p = root/rel
            data = json.loads(p.read_text(encoding='utf-8'))
            dt = next((x for x in data['doctypes'] if x.get('name') == 'Material Specification'), None)
            if not dt:
              raise SystemExit(f'{rel}: Material Specification missing')
            fields = dt['fields']
            for i, field in enumerate(fields):
              if isinstance(field, str) and field.startswith('spec_type:Select('):
                fields[i] = 'spec_type:Select(Nhôm cây/lá,Ống/trục,Tấm/Kính,Cuộn,Vật tư tuyến tính,Khác)! Loại quy cách'
              elif isinstance(field, dict) and field.get('fieldname') == 'theoretical_kg_per_m':
                field['depends_on'] = "eval:doc.spec_type == 'Nhôm cây/lá' || doc.spec_type == 'Ống/trục' || doc.spec_type == 'Vật tư tuyến tính'"
              elif isinstance(field, dict) and field.get('fieldname') == 'scrap_threshold_m':
                field['depends_on'] = "eval:doc.spec_type == 'Nhôm cây/lá' || doc.spec_type == 'Ống/trục' || doc.spec_type == 'Cuộn' || doc.spec_type == 'Vật tư tuyến tính'"
            if rel.endswith('alumdoor-v2.json'):
              if data.get('version') != '2.2.4':
                raise SystemExit(f'unexpected V2 version {data.get("version")}')
              data['version'] = '2.2.5'
            p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test = r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          import { spawnSync } from "node:child_process";
          import {
            MATERIAL_SPECIFICATION_TYPES,
            loadMaterialSpecificationCatalog,
          } from "../scripts/lib/alumdoor-material-specification-catalog.mjs";
          import { ALUMDOOR_ITEM_GROUP_CATALOG } from "../scripts/lib/alumdoor-item-group-catalog.mjs";
          import { buildMaterialSpecificationSeed } from "../scripts/seed-alumdoor-material-specifications-local.mjs";

          const repoRoot = resolve(dirname(fileURLToPath(import.meta.url)), "..", "..");

          test("canonical Material Specification catalog has exactly 17 evidence-backed atomic specs", async () => {
            const rows = await loadMaterialSpecificationCatalog(repoRoot);
            assert.equal(rows.length, 17);
            assert.equal(new Set(rows.map((x) => x.specCode)).size, 17);
            assert.equal(new Set(rows.map((x) => x.itemCode)).size, 17);
            assert.equal(rows.filter((x) => x.payload.profile_system === "TIẾN ĐẠT").length, 12);
            assert.deepEqual(
              rows.filter((x) => x.specType === "Ống/trục").map((x) => x.itemCode).sort(),
              ["TRỤC 114_1.8LY", "TRỤC 114_2.1LY"],
            );
            assert.deepEqual(
              rows.filter((x) => x.specType === "Vật tư tuyến tính").map((x) => x.itemCode).sort(),
              ["RNINOX-DR", "RNHUA-DR", "RON-DD"],
            );
          });

          test("every canonical spec uses a canonical leaf Item Group and valid technical values", async () => {
            const rows = await loadMaterialSpecificationCatalog(repoRoot);
            const leaves = new Set(ALUMDOOR_ITEM_GROUP_CATALOG.filter((x) => !x.isGroup).map((x) => x.name));
            for (const row of rows) {
              assert.ok(leaves.has(row.itemGroup), `${row.itemCode}: non-leaf/unknown group ${row.itemGroup}`);
              assert.ok(MATERIAL_SPECIFICATION_TYPES.includes(row.specType), `${row.itemCode}: invalid type`);
              assert.ok(row.kgPerM > 0, `${row.itemCode}: kg/m must be positive`);
              assert.equal(row.payload.spec_code, row.specCode);
              assert.equal(row.payload.item_group, row.itemGroup);
              assert.equal(row.payload.theoretical_kg_per_m, row.kgPerM);
              for (const forbidden of [
                "stock_uom", "default_purchase_uom", "inventory_mode", "measurement_profile",
                "require_color", "require_length", "track_bundle_qty", "leaf_divisor_m",
                "cutting_policy", "purchase_kg_per_m2", "uom_conversions",
              ]) assert.equal(forbidden in row.payload, false, `${row.specCode}: must not own ${forbidden}`);
            }
          });

          test("known technical evidence stays exact", async () => {
            const rows = await loadMaterialSpecificationCatalog(repoRoot);
            const byItem = new Map(rows.map((x) => [x.itemCode, x]));
            assert.equal(byItem.get("TP-RAY HỘP TD U100")?.kgPerM, 1.419);
            assert.equal(byItem.get("TP-RAYHOP")?.kgPerM, 1.119);
            assert.equal(byItem.get("RNHUA-DR")?.kgPerM, 0.263);
            assert.equal(byItem.get("RNINOX-DR")?.kgPerM, 0.124);
            assert.equal(byItem.get("TRỤC 114_1.8LY")?.payload.section_code, "Φ114");
            assert.equal(byItem.get("TRỤC 114_1.8LY")?.payload.thickness_mm, 1.8);
            assert.equal(byItem.get("TRỤC 114_2.1LY")?.payload.thickness_mm, 2.1);
          });

          test("seed is Material-Specification-only and links Items without changing measurement/UOM/geometry", async () => {
            const { sql, catalog } = await buildMaterialSpecificationSeed(repoRoot, "demo");
            assert.equal(catalog.length, 17);
            assert.match(sql, /Material Specification/);
            assert.match(sql, /material_specification/);
            assert.doesNotMatch(sql, /Measurement Profile/);
            assert.doesNotMatch(sql, /stock_uom|default_purchase_uom|inventory_mode|measurement_profile/);
            assert.doesNotMatch(sql, /leaf_divisor_m|cutting_policy|purchase_kg_per_m2/);
          });

          test("brief schema exposes linear material specs and V2 is 2.2.5", () => {
            for (const rel of ["server/briefs/alumdoor.json", "server/briefs/alumdoor-v2.json"]) {
              const brief = JSON.parse(readFileSync(resolve(repoRoot, rel), "utf8"));
              const dt = brief.doctypes.find((x) => x.name === "Material Specification");
              const type = dt.fields.find((x) => typeof x === "string" && x.startsWith("spec_type:Select("));
              assert.match(type, /Vật tư tuyến tính/);
              const kg = dt.fields.find((x) => typeof x === "object" && x.fieldname === "theoretical_kg_per_m");
              assert.match(kg.depends_on, /Vật tư tuyến tính/);
              if (rel.endsWith("alumdoor-v2.json")) assert.equal(brief.version, "2.2.5");
            }
          });

          test("legacy profile-spec builder delegates to canonical authority instead of maintaining a second map", () => {
            const source = readFileSync(resolve(repoRoot, "server/scripts/build-alumdoor-profile-specifications.mjs"), "utf8");
            assert.doesNotMatch(source, /PROFILE_WEIGHT_ITEMS/);
            assert.match(source, /buildMaterialSpecificationSeed/);
          });
          '''
          (root/'server/tests/alumdoor-material-specification-catalog.test.mjs').write_text(textwrap.dedent(test).lstrip(), encoding='utf-8')

      - name: Test patched Material Specification layer
        run: |
          node --test server/tests/alumdoor-material-specification-catalog.test.mjs
          node --test server/tests/alumdoor-item-standardization.test.mjs
          node server/scripts/seed-alumdoor-material-specifications-local.mjs demo "$RUNNER_TEMP/material-spec.sql" >/dev/null
          grep -q "Material Specification" "$RUNNER_TEMP/material-spec.sql"
      - name: Commit product files and self-clean
        shell: bash
        run: |
          git rm .github/workflows/_tmp-material-spec-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/scripts/lib/alumdoor-material-specification-catalog.mjs \
                  server/scripts/seed-alumdoor-material-specifications-local.mjs \
                  server/scripts/build-alumdoor-profile-specifications.mjs \
                  server/scripts/lib/alumdoor-item-standardization.mjs \
                  server/briefs/alumdoor.json server/briefs/alumdoor-v2.json \
                  server/tests/alumdoor-material-specification-catalog.test.mjs
          git commit -m "feat(alumdoor): lock canonical Material Specification layer"
          git push origin HEAD:fix/alumdoor-master-layer-material-specification
