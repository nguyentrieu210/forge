name: UI V3 Shell Reconcile Temp

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ui-v3-shell-reconcile-temp.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'ui/v3-02-shell-exec-20260804'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: ui/v3-02-shell-exec-20260804
          fetch-depth: 0
      - name: Preserve current-main runtime CSS and apply only V3 consumer opt-in
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- client/apps/runtime/src/styles.css
          python3 - <<'PY'
          from pathlib import Path
          path = Path('client/apps/runtime/src/styles.css')
          source = path.read_text()
          old = '@import "@metaforge/ui/styles.css";'
          new = '@import "@metaforge/ui/v3.css";'
          if old not in source:
              raise SystemExit('expected current-main UI stylesheet import not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit reconciled runtime style
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/apps/runtime/src/styles.css
          if git diff --cached --quiet; then
            echo "Runtime style already reconciled."
            exit 0
          fi
          git commit -m "fix(ui-v3): preserve current runtime styles"
          git push origin HEAD:ui/v3-02-shell-exec-20260804
