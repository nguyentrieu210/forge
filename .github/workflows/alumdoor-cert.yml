name: Alumdoor isolated certification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/alumdoor-cert.yml"
  workflow_dispatch:

jobs:
  live-cert:
    runs-on: [self-hosted, Windows, alumdoor]
    timeout-minutes: 45
    steps:
      - name: Clone experiment without touching local worktree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'forge-alumdoor-isolated-cert'
          if (Test-Path $probe) { cmd /c "rmdir /s /q `"$probe`"" | Out-Null }
          git clone --quiet --branch exp/alumdoor-pricing-policy https://github.com/nguyentrieu210/forge.git $probe
          if ($LASTEXITCODE -ne 0) { throw 'experiment clone failed' }
          Set-Location $probe
          Write-Host "CERT_COMMIT=$(git rev-parse HEAD)"
          "CERT_ROOT=$probe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap isolated server and copied secrets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = $env:CERT_ROOT
          $sourceVars = 'C:\alumdoor\server\.dev.vars'
          if (!(Test-Path $sourceVars)) { throw 'Local .dev.vars is unavailable for isolated certification' }
          Copy-Item -Force $sourceVars (Join-Path $probe 'server\.dev.vars')
          Write-Host 'DEV_VAR_KEYS:'
          Get-Content $sourceVars | Where-Object { $_ -match '^[A-Za-z_][A-Za-z0-9_]*=' } | ForEach-Object { Write-Host (($_ -split '=',2)[0]) }
          Set-Location (Join-Path $probe 'server')
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'server dependency install failed' }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }
          pnpm run brief:check
          if ($LASTEXITCODE -ne 0) { throw 'brief check failed' }

      - name: Clone local D1 state and certify real Alumdoor catalogue
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceState = 'C:\alumdoor\server\apps\tenant-worker\.wrangler\state'
          if (!(Test-Path $sourceState)) { throw 'Local Wrangler state is unavailable' }
          $persist = Join-Path $env:RUNNER_TEMP 'alumdoor-live-cert-state'
          if (Test-Path $persist) { cmd /c "rmdir /s /q `"$persist`"" | Out-Null }
          New-Item -ItemType Directory -Force -Path $persist | Out-Null
          Copy-Item -Path (Join-Path $sourceState '*') -Destination $persist -Recurse -Force
          "CERT_PERSIST=$persist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Set-Location (Join-Path $env:CERT_ROOT 'server')
          $db = Get-ChildItem $persist -Recurse -File -Filter *.sqlite | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $db) { throw 'No D1 sqlite file found in cloned persistence state' }
          Write-Host "CERT_D1_BYTES=$($db.Length)"
          $env:LAB_DB = $db.FullName
          node scripts/test-alumdoor-pricing-real-data.mjs
          if ($LASTEXITCODE -ne 0) { throw 'real Alumdoor catalogue pricing certification failed' }
          Write-Host 'ALUMDOOR_REAL_CATALOGUE_CERT_PASS'

          @'
          import { DatabaseSync } from "node:sqlite";
          const db = new DatabaseSync(process.env.LAB_DB);
          const rows = db.prepare("SELECT name, sql FROM sqlite_master WHERE type='table' ORDER BY name").all();
          for (const row of rows) {
            const text = `${row.name} ${row.sql ?? ''}`;
            if (/auth|user|password|credential|session|identity/i.test(text)) {
              console.log(`AUTH_SCHEMA=${row.name}:${String(row.sql ?? '').replace(/\s+/g,' ')}`);
            }
          }
          db.close();
          '@ | node --input-type=module

      - name: Report auth readiness without secrets
        shell: powershell
        run: |
          $hasPassword = @(Get-Content (Join-Path $env:CERT_ROOT 'server\.dev.vars') | Where-Object { $_ -match '^FORGE_ADMIN_PASSWORD=' }).Count -gt 0
          Write-Host "FORGE_ADMIN_PASSWORD_PRESENT=$([int]$hasPassword)"
          if (-not $hasPassword) { throw 'Isolated live auth needs a temporary credential seeded into cloned D1' }
