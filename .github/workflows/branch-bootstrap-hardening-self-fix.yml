name: Branch Bootstrap Hardening Self Fix

on:
  push:
    branches: [agent/bootstrap-verify-capabilities]
    paths:
      - '.github/workflows/branch-bootstrap-hardening-self-fix.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-verify-capabilities
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair accidental preflight regression
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/local-runner/run-local-import-core.mjs')
          text = path.read_text(encoding='utf-8')
          old = "[path.join(server, 'scripts', 'import-alumdoor-item-master-local.mjs'), prepared.payload, '--validate-only']"
          new = "[path.join(server, 'scripts', 'import-alumdoor-item-master-local.mjs'), payload, '--validate-only']"
          if old not in text:
              raise SystemExit('Expected accidental regression not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate edited sources
        run: |
          node --check scripts/local-runner/run-local-import-core.mjs
          node --check scripts/local-runner/service-verification.mjs
          node --check server/scripts/alumdoor-runtime-maintenance.mjs
          node --test scripts/local-runner/service-verification.test.mjs scripts/local-runner/contract.test.mjs

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add scripts/local-runner/run-local-import-core.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(local-runner): restore item validate-only payload'
          git push origin HEAD:agent/bootstrap-verify-capabilities
