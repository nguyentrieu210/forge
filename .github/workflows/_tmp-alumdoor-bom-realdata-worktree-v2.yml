name: Temporary Alumdoor BOM Realdata Worktree V2

on:
  push:
    branches:
      - agent/alumdoor-bom-realdata-continuation
    paths:
      - .github/workflows/_tmp-alumdoor-bom-realdata-worktree-v2.yml

permissions:
  contents: read

concurrency:
  group: alumdoor-bom-realdata-worktree-v2
  cancel-in-progress: false

jobs:
  item-gate:
    runs-on: [self-hosted]
    timeout-minutes: 45
    steps:
      - name: Prepare isolated feature worktree and reconcile local main
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $feature = "C:\alumdoor-worktrees\bom-realdata-$env:GITHUB_RUN_ID"
          $branch = (git -C $target rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'main') { throw "Local runtime checkout is on '$branch', expected main." }
          $dirty = @(git -C $target status --porcelain=v1 --untracked-files=all | Where-Object { $_ -notmatch '^\?\? local-imports/' })
          if ($dirty.Count -gt 0) { $dirty | ForEach-Object { Write-Host "DIRTY $_" }; throw 'Local runtime checkout has unexpected changes.' }
          $generated = @(git -C $target status --porcelain=v1 --untracked-files=all | Where-Object { $_ -match '^\?\? local-imports/' })
          Write-Host "GENERATED_LOCAL_IMPORT_FILES=$($generated.Count)"
          git -C $target fetch origin main 'agent/alumdoor-bom-realdata-continuation' --prune
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          git -C $target merge --ff-only origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Local main cannot fast-forward to origin/main.' }
          $main = (git -C $target rev-parse HEAD).Trim()
          $remote = (git -C $target rev-parse origin/main).Trim()
          if ($main -ne $remote) { throw "Local main mismatch local=$main remote=$remote" }
          if (Test-Path -LiteralPath $feature) { throw "Unexpected existing temp worktree: $feature" }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $feature) | Out-Null
          git -C $target worktree add --detach $feature $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'git worktree add failed' }
          Write-Host "LOCAL_MAIN=$main"
          Write-Host "FEATURE_SHA=$env:GITHUB_SHA"
          Write-Host "FEATURE_WORKTREE=$feature"

      - name: Test reconciliation and rebuild canonical Item payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $feature = "C:\alumdoor-worktrees\bom-realdata-$env:GITHUB_RUN_ID"
          $imports = Join-Path $target 'local-imports'
          New-Item -ItemType Directory -Force -Path $imports | Out-Null
          Set-Location (Join-Path $feature 'server')
          & node scripts\test-alumdoor-item-stock-uom-reconcile.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reconciliation unit test failed.' }
          $source = Join-Path $imports 'alumdoor-item-source-records.json'
          $sourceReport = "$source.report.json"
          $payload = Join-Path $imports 'alumdoor-item-master-payload.json'
          $audit = Join-Path $imports 'alumdoor-item-master-payload.audit.json'
          & node scripts\extract-alumdoor-real-source-records.mjs $source $sourceReport
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source extraction failed.' }
          & node scripts\build-alumdoor-item-master-payload.mjs $source $payload $audit
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Item payload build failed.' }
          $sr = Get-Content -Raw -LiteralPath $sourceReport | ConvertFrom-Json
          $ar = Get-Content -Raw -LiteralPath $audit | ConvertFrom-Json
          Write-Host "SOURCE_RECORDS=$($sr.source_record_count) SELLABLE=$($sr.sellable_count) STOCK=$($sr.stock_count) BOM_REFS=$($sr.bom_reference_count) UNRESOLVED_GROUPS=$($sr.unresolved_group_count)"
          Write-Host "ITEM_PAYLOAD=$($ar.item_payload_count) ITEM_MASTER_BLOCKERS=$($ar.item_master_blocker_count) ITEM_PAYLOAD_BLOCKERS=$($ar.item_payload_blocker_count) OTHER_BLOCKERS=$($ar.other_blocker_count) BOM_BLOCKERS=$($ar.bom_blocker_count)"
          if ([int]$ar.item_master_blocker_count -ne 0 -or [int]$ar.item_payload_blocker_count -ne 0 -or [int]$ar.other_blocker_count -ne 0) { throw 'Canonical Item payload is not zero-blocker.' }

      - name: Dry-run and apply guarded finished-door stock UOM reconciliation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $feature = "C:\alumdoor-worktrees\bom-realdata-$env:GITHUB_RUN_ID"
          $payload = Join-Path $target 'local-imports\alumdoor-item-master-payload.json'
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $runDir = Join-Path $target "local-backups\item-master-imports\bom-continuation-$stamp"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          $env:FORGE_ORIGIN = 'http://127.0.0.1:8799'
          $env:FORGE_ADMIN_USER = 'dev@example.com'
          $env:FORGE_ADMIN_PASSWORD = 'local-dev-password-1'
          try {
            Set-Location (Join-Path $target 'server')
            $uomPreimage = Join-Path $runDir 'uom-preimage.json'
            & node scripts\backup-alumdoor-uom-local.mjs $uomPreimage
            if ($LASTEXITCODE -ne 0) { throw 'UOM preimage failed.' }
            $uom = Get-Content -Raw -LiteralPath $uomPreimage | ConvertFrom-Json
            Write-Host "UOM_CANONICAL=$($uom.canonical_count) UOM_EXISTING=$($uom.existing_count)"
            if ([int]$uom.canonical_count -ne 19 -or [int]$uom.existing_count -ne 19) { throw 'Canonical 19-UOM gate failed.' }
            Set-Location (Join-Path $feature 'server')
            Write-Host '=== STOCK UOM RECONCILE DRY RUN ==='
            & node scripts\reconcile-alumdoor-item-stock-uom-local.mjs $payload --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'Stock-UOM reconciliation dry-run failed.' }
            Write-Host '=== STOCK UOM RECONCILE APPLY ==='
            $preimage = Join-Path $runDir 'finished-door-stock-uom-preimage.json'
            & node scripts\reconcile-alumdoor-item-stock-uom-local.mjs $payload $preimage
            if ($LASTEXITCODE -ne 0) { throw 'Stock-UOM reconciliation apply failed.' }
            Write-Host "RECONCILE_PREIMAGE=$preimage"
          } finally { Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue }

      - name: Run canonical Item importer twice and prove idempotency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $payload = Join-Path $target 'local-imports\alumdoor-item-master-payload.json'
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $runDir = Join-Path $target "local-backups\item-master-imports\bom-idempotency-$stamp"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          Set-Location (Join-Path $target 'server')
          $env:FORGE_ORIGIN = 'http://127.0.0.1:8799'
          $env:FORGE_ADMIN_USER = 'dev@example.com'
          $env:FORGE_ADMIN_PASSWORD = 'local-dev-password-1'
          try {
            & node scripts\import-alumdoor-item-master-local.mjs $payload --validate-only
            if ($LASTEXITCODE -ne 0) { throw 'Item validate-only failed.' }
            Write-Host '=== ITEM IMPORT FIRST ==='
            & node scripts\import-alumdoor-item-master-local.mjs $payload (Join-Path $runDir 'item-first-preimage.json')
            if ($LASTEXITCODE -ne 0) { throw 'Item first import failed.' }
            Write-Host '=== ITEM IMPORT RERUN ==='
            & node scripts\import-alumdoor-item-master-local.mjs $payload (Join-Path $runDir 'item-rerun-preimage.json')
            if ($LASTEXITCODE -ne 0) { throw 'Item rerun failed.' }
          } finally { Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue }
          Write-Host "ITEM_IMPORT_RUN_DIR=$runDir"

      - name: Cap-safe persistence readback and BOM contract audit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\alumdoor'
          $payload = Join-Path $target 'local-imports\alumdoor-item-master-payload.json'
          $brief = Join-Path $target 'server\briefs\alumdoor-v2.json'
          $script = Join-Path $target 'server\.tmp-cap-safe-bom-audit.mjs'
          $env:FORGE_ORIGIN = 'http://127.0.0.1:8799'
          $env:FORGE_ADMIN_USER = 'dev@example.com'
          $env:FORGE_ADMIN_PASSWORD = 'local-dev-password-1'
          @'
          import { readFileSync } from 'node:fs';
          const [payloadPath,briefPath]=process.argv.slice(2);const origin=process.env.FORGE_ORIGIN;const expected=JSON.parse(readFileSync(payloadPath,'utf8')).items;const brief=JSON.parse(readFileSync(briefPath,'utf8'));const cookies=new Map();let csrf='';
          function remember(r){const s=r.headers.get('set-cookie');if(!s)return;for(const part of s.split(/,(?=[^;,]+=)/)){const p=part.split(';',1)[0],i=p.indexOf('=');if(i>0)cookies.set(p.slice(0,i).trim(),p.slice(i+1).trim());}}
          async function req(path,opt={}){const h=new Headers(opt.headers||{});if(cookies.size)h.set('cookie',[...cookies].map(([k,v])=>`${k}=${v}`).join('; '));if(csrf&&opt.method&&opt.method!=='GET')h.set('x-frappe-csrf-token',csrf);if(opt.body!==undefined)h.set('content-type','application/json');const r=await fetch(origin+path,{...opt,headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)});remember(r);csrf=r.headers.get('x-frappe-csrf-token')||csrf;const t=await r.text();let b;try{b=t?JSON.parse(t):null}catch{b=t}return{r,b,t};}
          async function ok(path,opt={}){const x=await req(path,opt);if(!x.r.ok)throw new Error(`${opt.method||'GET'} ${path} ${x.r.status}: ${x.t.slice(0,500)}`);return x.b;}
          await ok('/api/method/login',{method:'POST',body:{usr:process.env.FORGE_ADMIN_USER,pwd:process.env.FORGE_ADMIN_PASSWORD}});const boot=await ok('/api/method/metaforge.api.get_boot');csrf=(boot?.message??boot)?.csrf_token||csrf;
          async function readAll(dt,fields){let start=0;const out=[];for(let n=0;n<5000;n++){const q=new URLSearchParams({fields:JSON.stringify(fields),limit_start:String(start),limit_page_length:'100',order_by:'name asc'});const x=await req(`/api/resource/${encodeURIComponent(dt)}?${q}`);if(!x.r.ok){console.log(`DOCTYPE_ERROR ${dt} status=${x.r.status} body=${String(x.t).slice(0,300)}`);return null;}const rows=Array.isArray(x.b?.data)?x.b.data:[];console.log(`PAGE ${dt} start=${start} rows=${rows.length}`);if(rows.length===0)break;out.push(...rows);start+=rows.length;}return out;}
          const items=await readAll('Item',['name','item_code']);if(!items)throw new Error('Item read failed');const actual=new Set(items.map(x=>String(x.item_code||x.name||'').trim()).filter(Boolean));const canonical=new Set(expected.map(x=>String(x.item_code||'').trim()).filter(Boolean));const missing=[...canonical].filter(x=>!actual.has(x));const extra=[...actual].filter(x=>!canonical.has(x));
          console.log(`ITEM_CANONICAL=${canonical.size}`);console.log(`ITEM_PERSISTED_TOTAL=${actual.size}`);console.log(`ITEM_CANONICAL_PRESENT=${canonical.size-missing.length}`);console.log(`ITEM_CANONICAL_MISSING=${missing.length}`);console.log(`ITEM_EXTRA_PERSISTED=${extra.length}`);
          const boms=await readAll('Bill of Materials',['name','item','docstatus']);if(boms)console.log(`PERSISTED_BILL_OF_MATERIALS=${boms.length}`);const lots=await readAll('Aluminium Lot',['name','item_code','status']);if(lots)console.log(`PERSISTED_ALUMINIUM_LOT=${lots.length}`);
          for(const name of ['Bill of Materials','BOM Item','BOM Actual Component','BOM Template']){const row=(brief.doctypes||[]).find(x=>x?.name===name);console.log(`DOCTYPE_CONTRACT ${name}=${row?JSON.stringify(row):'MISSING'}`);}if(missing.length)throw new Error(`Canonical Item missing=${missing.length}`);
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          try { Set-Location (Join-Path $target 'server'); & node $script $payload $brief; if ($LASTEXITCODE -ne 0) { throw 'Persistence readback failed.' } }
          finally { Remove-Item $script -ErrorAction SilentlyContinue; Remove-Item Env:FORGE_ADMIN_PASSWORD -ErrorAction SilentlyContinue }
          Write-Host 'ALUMDOOR_ITEM_GATE_PASS'

      - name: Cleanup isolated feature worktree
        if: always()
        shell: powershell
        run: |
          $target = 'C:\alumdoor'
          $feature = "C:\alumdoor-worktrees\bom-realdata-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $feature) { git -C $target worktree remove --force $feature; git -C $target worktree prune }
