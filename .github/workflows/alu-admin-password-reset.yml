name: ALU Reset Admin Password

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alu-admin-password-reset.yml"
      - "server/scripts/reset-remote-admin-password.mjs"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type alu to reset the Alumdoor admin password from the production secret
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-alu-admin-password-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Reset Alumdoor admin credential and revoke old sessions
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'alu')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$FORGE_ADMIN_USER" || { echo "Missing FORGE_ADMIN_USER/ALU_META_ADMIN_USER"; exit 1; }
          test -n "$FORGE_ADMIN_PASSWORD" || { echo "Missing FORGE_ADMIN_PASSWORD/ALU_META_ADMIN_PASSWORD"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build server password hasher
        run: pnpm --filter cloudforge run build

      - name: Reset password from production secret
        run: >-
          node server/scripts/reset-remote-admin-password.mjs
          --tenant alu
          --origin https://alu.kairo.vn
          --execute
          --confirm alu

      - name: Publish reset status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="ALU admin password reset and login verification passed"
          else
            state=failure
            description="ALU admin password reset failed; inspect workflow logs"
          fi
          payload=$(jq -nc --arg state "$state" --arg context "alu-admin-password-reset" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
