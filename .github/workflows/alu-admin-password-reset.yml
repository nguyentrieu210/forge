name: ALU Reset Admin Password

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alu-admin-password-reset.yml"
      - "server/scripts/reset-remote-admin-password.mjs"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type alu to reset the Alumdoor admin password from the production secret
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-alu-admin-password-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Reset Alumdoor admin credential and revoke old sessions
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'alu')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require production secrets
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$FORGE_ADMIN_USER" || { echo "Missing FORGE_ADMIN_USER/ALU_META_ADMIN_USER"; exit 1; }
          test -n "$FORGE_ADMIN_PASSWORD" || { echo "Missing FORGE_ADMIN_PASSWORD/ALU_META_ADMIN_PASSWORD"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies for Wrangler
        id: install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Reset and cryptographically verify password in D1
        id: reset-password
        run: >-
          node server/scripts/reset-remote-admin-password.mjs
          --tenant alu
          --execute
          --confirm alu

      - name: Publish stage and overall reset status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RESET_OUTCOME: ${{ steps.reset-password.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          post_status() {
            local context="$1"
            local outcome="$2"
            local description="$3"
            local state
            case "$outcome" in
              success) state=success ;;
              failure) state=failure ;;
              *) state=error ;;
            esac
            payload=$(jq -nc \
              --arg state "$state" \
              --arg context "$context" \
              --arg description "$description" \
              --arg target_url "$target_url" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }

          post_status "alu-admin-reset-secrets" "$SECRETS_OUTCOME" "production credential inputs available"
          post_status "alu-admin-reset-install" "$INSTALL_OUTCOME" "Wrangler dependencies installed"
          post_status "alu-admin-reset-d1-verify" "$RESET_OUTCOME" "D1 credential hash verified without consuming login allowance"

          if [ "$JOB_STATUS" = "success" ]; then
            post_status "alu-admin-password-reset" success "ALU admin credential reset, D1 verification, and session revocation passed"
          else
            post_status "alu-admin-password-reset" failure "ALU admin password reset failed; stage statuses identify the blocker"
          fi
