name: Temporary Fix Geometry Enum Runtime VI

on:
  push:
    branches:
      - 'fix/geometry-enum-vietnamese-runtime-20260817'
    paths:
      - '.github/workflows/_tmp-fix-geometry-enum-runtime-vi.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch runtime Vietnamese enum translations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(path, before, after, label) {
            let text = fs.readFileSync(path, 'utf8');
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected 1 match, got ${count}`);
            text = text.replace(before, after);
            fs.writeFileSync(path, text, 'utf8');
          }

          const source = 'server/packages/frappe-api/src/vietnamese-enum-translations.ts';
          replaceOnce(
            source,
            '  // Attendance codes shown in Select controls. Values remain SHIFT1/SHIFT2/SHIFT3 in storage.\n',
            '  // Geometry profile authoring. Canonical storage values stay English; only UI labels are Vietnamese.\n  input: "Nhập liệu",\n  calculated: "Tự tính",\n  info: "Thông tin",\n  width: "Chiều rộng",\n  height: "Chiều cao",\n  length: "Chiều dài",\n\n  // Attendance codes shown in Select controls. Values remain SHIFT1/SHIFT2/SHIFT3 in storage.\n',
            'enum translation anchor',
          );

          const test = 'server/tests/vietnamese-enum-translations.test.mjs';
          replaceOnce(
            test,
            '    SHIFT1: "Ca 1",\n    SHIFT2: "Ca 2",\n    SHIFT3: "Ca 3",\n',
            '    INPUT: "Nhập liệu",\n    CALCULATED: "Tự tính",\n    INFO: "Thông tin",\n    WIDTH: "Chiều rộng",\n    HEIGHT: "Chiều cao",\n    LENGTH: "Chiều dài",\n    SHIFT1: "Ca 1",\n    SHIFT2: "Ca 2",\n    SHIFT3: "Ca 3",\n',
            'enum test anchor',
          );
          NODE

      - name: Build server and test enum runtime translations
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          node --test tests/vietnamese-enum-translations.test.mjs
          node --test tests/alumdoor-measurement-geometry-master.test.mjs

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-fix-geometry-enum-runtime-vi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/packages/frappe-api/src/vietnamese-enum-translations.ts server/tests/vietnamese-enum-translations.test.mjs .github/workflows/_tmp-fix-geometry-enum-runtime-vi.yml
          git commit -m "fix(i18n): localize geometry profile enum values"
          git push origin HEAD:fix/geometry-enum-vietnamese-runtime-20260817
