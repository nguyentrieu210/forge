name: Alumdoor Cloudflare Preview

on:
  push:
    branches:
      - cloudflare/alumdoor-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4d5a24d4e56f28f27fe58b64ef149a5
      TENANT_WORKER: cloudforge-alumdoor-preview-tenant
      APP_WORKER: cloudforge-alumdoor-preview-app
      GATEWAY_WORKER: cloudforge-alumdoor-preview
      PREVIEW_ADMIN: preview@alumdoor.test
      VITE_FORGE_RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend
        run: pnpm --filter cloudforge run build

      - name: Resolve Workers subdomain and preview URLs
        id: urls
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // .result' <<<"$response")"
          test -n "$subdomain" && test "$subdomain" != "null"
          tenant_url="https://${TENANT_WORKER}.${subdomain}.workers.dev"
          gateway_url="https://${GATEWAY_WORKER}.${subdomain}.workers.dev"
          echo "tenant_url=$tenant_url" >> "$GITHUB_OUTPUT"
          echo "gateway_url=$gateway_url" >> "$GITHUB_OUTPUT"
          echo "Workers subdomain resolved; preview URL will be $gateway_url"

      - name: Bind preview callback origin
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.urls.outputs.gateway_url }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'server/apps/tenant-worker/wrangler.alumdoor-preview.jsonc';
          const text = fs.readFileSync(file, 'utf8').replace('__PREVIEW_GATEWAY_ORIGIN__', process.env.GATEWAY_URL);
          fs.writeFileSync(file, text);
          NODE

      - name: Bootstrap isolated app Worker
        run: pnpm --dir server exec wrangler deploy --config apps-src/alumdoor-worker/wrangler.preview-bootstrap.jsonc

      - name: Deploy isolated tenant Worker and auto-provision resources
        run: pnpm --dir server exec wrangler deploy --config apps/tenant-worker/wrangler.alumdoor-preview.jsonc

      - name: Bind app Worker back to preview tenant
        run: pnpm --dir server exec wrangler deploy --config apps-src/alumdoor-worker/wrangler.preview.jsonc

      - name: Configure preview-only secrets
        shell: bash
        run: |
          set -euo pipefail
          internal_auth="$(openssl rand -hex 32)"
          internal_service="$(openssl rand -hex 32)"
          control_token="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          session_secret="$(openssl rand -hex 32)"
          attendance_secret="$(openssl rand -hex 32)"
          bootstrap_token="$(openssl rand -hex 32)"

          put_secret() {
            local worker="$1" name="$2" value="$3"
            printf '%s' "$value" | pnpm --dir server exec wrangler secret put "$name" --name "$worker" >/dev/null
          }

          put_secret "$TENANT_WORKER" INTERNAL_AUTH_SECRET "$internal_auth"
          put_secret "$TENANT_WORKER" INTERNAL_SERVICE_TOKEN "$internal_service"
          put_secret "$TENANT_WORKER" CONTROL_TOKEN "$control_token"
          put_secret "$TENANT_WORKER" JWT_SECRET "$jwt_secret"
          put_secret "$TENANT_WORKER" SESSION_SECRET "$session_secret"
          put_secret "$TENANT_WORKER" ALUMDOOR_ATTENDANCE_QR_SECRET "$attendance_secret"
          put_secret "$TENANT_WORKER" PREVIEW_BOOTSTRAP_TOKEN "$bootstrap_token"
          put_secret "$APP_WORKER" INTERNAL_AUTH_SECRET "$internal_auth"
          put_secret "$APP_WORKER" ALUMDOOR_ATTENDANCE_QR_SECRET "$attendance_secret"

          echo "::add-mask::$bootstrap_token"
          echo "PREVIEW_BOOTSTRAP_TOKEN=$bootstrap_token" >> "$GITHUB_ENV"

      - name: Apply remote preview D1 migrations
        working-directory: server
        run: node scripts/d1-migrate-remote.mjs --config apps/tenant-worker/wrangler.alumdoor-preview.jsonc

      - name: Seed private preview administrator
        working-directory: server
        run: node scripts/seed-alumdoor-preview-admin.mjs --config apps/tenant-worker/wrangler.alumdoor-preview.jsonc

      - name: Compile canonical Alumdoor app stack
        working-directory: server
        run: |
          set -euo pipefail
          node scripts/forge-app.mjs apps-src/hrm --dry-run --out "$RUNNER_TEMP/hrm.json"
          node scripts/forge-app.mjs apps-src/alumdoor-attendance --dry-run --out "$RUNNER_TEMP/alumdoor-attendance.json"
          node scripts/forge-app.mjs apps-src/vn-accounting --dry-run --out "$RUNNER_TEMP/vn-accounting.json"
          node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run --out "$RUNNER_TEMP/alumdoor.json"

      - name: Install app stack through guarded preview bootstrap endpoint
        shell: bash
        env:
          TENANT_URL: ${{ steps.urls.outputs.tenant_url }}
        run: |
          set -euo pipefail
          install_app() {
            local file="$1" standard="$2"
            jq -n --slurpfile app "$file" --argjson standard "$standard" \
              '{app:$app[0],provision_standard:$standard}' > "$RUNNER_TEMP/install-payload.json"
            curl -fsS \
              -H "Authorization: Bearer $PREVIEW_BOOTSTRAP_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/install-payload.json" \
              "$TENANT_URL/internal/preview/install-app"
            echo
          }
          install_app "$RUNNER_TEMP/hrm.json" true
          install_app "$RUNNER_TEMP/alumdoor-attendance.json" false
          install_app "$RUNNER_TEMP/vn-accounting.json" false
          install_app "$RUNNER_TEMP/alumdoor.json" false

      - name: Build and stage MetaForge clients
        run: |
          set -euo pipefail
          pnpm --filter runtime... run build
          pnpm --filter kho run build
          node server/scripts/stage-client-bundle.mjs

      - name: Lock tenant back to service-only runtime
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'server/apps/tenant-worker/wrangler.alumdoor-preview.jsonc';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.main = 'src/index-cf6.ts';
          config.workers_dev = false;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          NODE
          pnpm --dir server exec wrangler deploy --config apps/tenant-worker/wrangler.alumdoor-preview.jsonc

      - name: Deploy authenticated public preview gateway
        run: pnpm --dir server exec wrangler deploy --config apps/preview-gateway-worker/wrangler.jsonc

      - name: Verify preview health
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.urls.outputs.gateway_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(curl -fsS "$GATEWAY_URL/__preview/health" 2>/dev/null || true)"
            if jq -e '.ok == true' >/dev/null 2>&1 <<<"$body"; then
              echo "$body"
              exit 0
            fi
            sleep 3
          done
          echo "Preview health did not become ready" >&2
          exit 1

      - name: Publish preview location
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.urls.outputs.gateway_url }}
        run: |
          echo "ALUMDOOR_CLOUDFLARE_PREVIEW_READY $GATEWAY_URL"
          {
            echo "## Alumdoor Cloudflare Preview"
            echo
            echo "Preview: $GATEWAY_URL"
            echo
            echo "App login: $PREVIEW_ADMIN"
            echo
            echo "The preview is isolated from production and protected by HTTP Basic Auth."
          } >> "$GITHUB_STEP_SUMMARY"
