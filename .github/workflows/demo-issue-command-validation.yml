name: Demo Issue Command Validation

on:
  pull_request:
    paths:
      - ".github/workflows/demo-provision-issue-command.yml"
      - ".github/workflows/demo-provision.yml"
      - ".github/workflows/demo-issue-command-validation.yml"
      - "server/scripts/create-demo-tenant.mjs"
      - "server/scripts/parse-demo-command.mjs"
      - "server/scripts/lib/demo-command.mjs"
      - "server/scripts/lib/demo-provider-credentials.mjs"
      - "server/tests/demo-command.test.mjs"
      - "server/tests/demo-provider-credentials.test.mjs"
      - "skills/forge-demo-factory/SKILL.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-provision-issue-command.yml"
      - ".github/workflows/demo-provision.yml"
      - ".github/workflows/demo-issue-command-validation.yml"
      - "server/scripts/create-demo-tenant.mjs"
      - "server/scripts/parse-demo-command.mjs"
      - "server/scripts/lib/demo-command.mjs"
      - "server/scripts/lib/demo-provider-credentials.mjs"
      - "server/tests/demo-command.test.mjs"
      - "server/tests/demo-provider-credentials.test.mjs"
      - "skills/forge-demo-factory/SKILL.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax-check command and provider tooling
        run: |
          node --check server/scripts/lib/demo-command.mjs
          node --check server/scripts/lib/demo-provider-credentials.mjs
          node --check server/scripts/parse-demo-command.mjs
          node --check server/scripts/create-demo-tenant.mjs
      - name: Run command and provider discovery tests
        run: node --test server/tests/demo-command.test.mjs server/tests/demo-provider-credentials.test.mjs server/tests/demo-provisioning.test.mjs
      - name: Lock production command workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/demo-provision-issue-command.yml
          grep -Fq 'issue_comment:' "$workflow"
          grep -Fq "github.event.comment.user.login == github.repository_owner" "$workflow"
          grep -Fq "github.event.comment.author_association == 'OWNER'" "$workflow"
          grep -Fq 'environment: production' "$workflow"
          grep -Fq "startsWith(github.event.comment.body, '/forge-demo-provision')" "$workflow"
      - name: Exercise CLI authorization and GitHub outputs
        shell: bash
        env:
          FORGE_DEMO_COMMAND_BODY: |
            /forge-demo-provision
            {"customer_name":"Thúy","slug":"thuy","brief":"marketplace-demo","admin_user":"admin","plan":"pro","provision_standard":false,"target_sha":"c014a79547dc3b379fa80b0545f0395b95effcdc","confirm":"demo"}
          FORGE_DEMO_COMMAND_ISSUE: "686"
          FORGE_DEMO_COMMAND_AUTHOR: "nguyentrieu210"
          FORGE_DEMO_COMMAND_ASSOCIATION: "OWNER"
          FORGE_REPOSITORY_OWNER: "nguyentrieu210"
        run: |
          out=$(mktemp)
          GITHUB_OUTPUT="$out" node server/scripts/parse-demo-command.mjs
          grep -Fx 'customer_name=Thúy' "$out"
          grep -Fx 'slug=thuy' "$out"
          grep -Fx 'brief=marketplace-demo' "$out"
          grep -Fx 'target_sha=c014a79547dc3b379fa80b0545f0395b95effcdc' "$out"
          grep -Fx 'confirm=demo' "$out"
