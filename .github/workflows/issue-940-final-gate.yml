name: Issue 940 Final Gate

on:
  push:
    branches:
      - agent/alumdoor-sales-order-v2-complete

permissions:
  contents: write

jobs:
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[sales-v2-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Patch Complete Sales V2 for canonical per-line ray input
        run: |
          python <<'PY'
          from pathlib import Path
          root=Path('.')
          table=root/'client/packages/views/src/app/vertical/alumdoor/sales-order-v2/AlumdoorSalesOrderLineTableComplete.tsx'
          s=table.read_text(encoding='utf-8')
          s=s.replace('  leaf_variant: "Kiểu lá / motor",\n  has_butterfly_bracket:', '  leaf_variant: "Kiểu lá / motor",\n  ray_type: "Loại ray",\n  has_butterfly_bracket:', 1)
          s=s.replace('fieldname === "has_butterfly_bracket" ? "Check" : fieldname === "leaf_variant" ? "Select" : fieldname === "motor_model" ? "Link" : "Float"', 'fieldname === "has_butterfly_bracket" ? "Check" : (fieldname === "leaf_variant" || fieldname === "ray_type") ? "Select" : fieldname === "motor_model" ? "Link" : "Float"', 1)
          table.write_text(s,encoding='utf-8')

          wb=root/'client/packages/views/src/app/vertical/alumdoor/sales-order-v2/AlumdoorSalesOrderWorkbenchComplete.tsx'
          s=wb.read_text(encoding='utf-8')
          s=s.replace('    leaf_variant: line.leaf_variant,\n    has_butterfly_bracket:', '    leaf_variant: line.leaf_variant,\n    ray_type: line.ray_type,\n    has_butterfly_bracket:', 1)
          s=s.replace('        color: undefined,\n        rate: undefined,', '        color: undefined,\n        ray_type: undefined,\n        rate: undefined,', 1)
          wb.write_text(s,encoding='utf-8')

          test=root/'client/packages/views/tests/alumdoor-sales-order-v2-complete.test.mjs'
          s=test.read_text(encoding='utf-8')
          if 'complete grid consumes canonical ray_type without geometry constants' not in s:
              s += '''\n\ntest("complete grid consumes canonical ray_type without geometry constants", () => {\n  assert.match(grid, /ray_type: "Loại ray"/);\n  assert.match(grid, /fieldname === "ray_type"/);\n  assert.match(workbench, /ray_type: line\\.ray_type/);\n  assert.match(workbench, /ray_type: undefined/);\n  assert.doesNotMatch(grid + workbench, /0\\.05|0\\.08/);\n});\n'''
          test.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/packages/views/src/app/vertical/alumdoor/sales-order-v2/AlumdoorSalesOrderLineTableComplete.tsx \
                  client/packages/views/src/app/vertical/alumdoor/sales-order-v2/AlumdoorSalesOrderWorkbenchComplete.tsx \
                  client/packages/views/tests/alumdoor-sales-order-v2-complete.test.mjs
          git commit -m "fix(alumdoor): consume per-line ray in Sales V2 complete"

      - name: Compose validated stack without committing dependencies
        run: |
          git fetch origin main agent/alumdoor-v2-reproducible agent/alumdoor-tam-lien-ray-geometry
          echo "MAIN=$(git rev-parse origin/main)"
          echo "REPRO=$(git rev-parse origin/agent/alumdoor-v2-reproducible)"
          echo "RAY=$(git rev-parse origin/agent/alumdoor-tam-lien-ray-geometry)"
          git merge --no-commit --no-ff origin/agent/alumdoor-tam-lien-ray-geometry

      - name: Focused Sales V2 source regression
        run: node --test client/packages/views/tests/alumdoor-sales-order-v2-complete.test.mjs
      - name: Official generator first and second pass
        run: |
          node server/scripts/build-alumdoor-v2-brief.mjs
          cp server/briefs/alumdoor-v2.json /tmp/v2-first.json
          node server/scripts/build-alumdoor-v2-brief.mjs
          cmp -s /tmp/v2-first.json server/briefs/alumdoor-v2.json
          git diff --exit-code -- server/briefs/alumdoor-v2.json
      - name: Server build
        run: pnpm run server:build
      - name: Production ray regression
        run: node --test server/tests/sales-production-flow.test.mjs
      - name: Brief check
        run: pnpm --dir server run brief:check
      - name: Client typecheck
        run: pnpm --dir client run typecheck
      - name: Client production build
        run: pnpm --dir client run build
      - name: Final diff hygiene
        run: git diff --check

      - name: Restore branch-only product tree and remove temporary workflow
        run: |
          git merge --abort
          rm .github/workflows/issue-940-final-gate.yml
          git add .github/workflows/issue-940-final-gate.yml
          git commit -m "ci(alumdoor): remove Sales V2 final gate [sales-v2-final]"
          git push origin HEAD:agent/alumdoor-sales-order-v2-complete
