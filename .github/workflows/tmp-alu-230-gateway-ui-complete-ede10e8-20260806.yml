name: TMP ALU 2.3.0 Gateway UI Completion ede10e8 2026-08-06

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-alu-230-gateway-ui-complete-ede10e8-20260806.yml"
      - "ops/releases/alu-230-gateway-ui-complete-ede10e8-20260806.txt"

permissions:
  contents: read

concurrency:
  group: release-alu-tenant-production
  cancel-in-progress: false

jobs:
  complete:
    name: Verify live 2.3.0 metadata, deploy exact Gateway UI, smoke production
    if: github.head_ref == 'release/alu-230-gateway-ui-complete-ede10e8-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TENANT: alu
      TARGET_SHA: ede10e8cbedf4ad238834b0e9d9afe0c640080a9
      AUTH_FILE: ops/releases/alu-230-gateway-ui-complete-ede10e8-20260806.txt
      FORGE_ORIGIN: https://alu.kairo.vn
      EXPECTED_APP_VERSION: 2.3.0
      SOURCE_RELEASE_RUN: '31070516536'
      VITE_FORGE_RELEASE_SHA: ede10e8cbedf4ad238834b0e9d9afe0c640080a9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORGE_ADMIN_USER: ${{ secrets.FORGE_ADMIN_USER || secrets.ALU_META_ADMIN_USER || 'admin' }}
      FORGE_ADMIN_PASSWORD: ${{ secrets.FORGE_ADMIN_PASSWORD || secrets.ALU_META_ADMIN_PASSWORD }}
      EVIDENCE_DIR: /tmp/alu-230-ui-completion-evidence

    steps:
      - name: Checkout temporary completion authorization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify explicit completion authorization and immutable main target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test -f "$AUTH_FILE"
          grep -Fxq 'ACTION=COMPLETE_ALU_230_GATEWAY_UI_AFTER_METADATA_FALSE_FAIL' "$AUTH_FILE"
          grep -Fxq 'TENANT=alu' "$AUTH_FILE"
          grep -Fxq 'TARGET_SHA=ede10e8cbedf4ad238834b0e9d9afe0c640080a9' "$AUTH_FILE"
          grep -Fxq 'SOURCE_PR=732' "$AUTH_FILE"
          grep -Fxq 'SOURCE_RELEASE_PR=733' "$AUTH_FILE"
          grep -Fxq 'SOURCE_RELEASE_RUN=31070516536' "$AUTH_FILE"
          grep -Fxq 'EXPECTED_PACKAGE=2.3.0' "$AUTH_FILE"
          grep -Fxq 'SCOPE=GATEWAY_UI_AND_PRODUCTION_SMOKE_ONLY' "$AUTH_FILE"
          grep -Fxq 'APPROVAL=EXPLICIT_USER_APPROVAL_2026-08-06' "$AUTH_FILE"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${FORGE_ADMIN_USER:-}"
          test -n "${FORGE_ADMIN_PASSWORD:-}"
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$TARGET_SHA" || {
            echo "Refusing UI completion: authorized target $TARGET_SHA is not current main $current_main."
            exit 1
          }
          mapfile -t changed < <(git diff --name-only "$TARGET_SHA"...HEAD | sort -u)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/tmp-alu-230-gateway-ui-complete-ede10e8-20260806.yml'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'ops/releases/alu-230-gateway-ui-complete-ede10e8-20260806.txt'
          printf 'target_sha=%s\nsource_release_run=%s\nauthorization=explicit\nstarted_at=%s\n' \
            "$TARGET_SHA" "$SOURCE_RELEASE_RUN" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$EVIDENCE_DIR/state.txt"

      - name: Checkout exact authorized merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile frozen-install worktree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <({ git diff --name-only; git diff --cached --name-only; git ls-files --others --exclude-standard; } | sort -u)
          for file in "${dirty[@]}"; do
            case "$file" in
              pnpm-lock.yaml) git restore --source=HEAD --staged --worktree -- pnpm-lock.yaml ;;
              *) echo "Refusing completion: dependency install changed unexpected source path: $file"; exit 1 ;;
            esac
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build exact UI candidate and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter metaforge run build 2>&1 | tee "$EVIDENCE_DIR/metaforge-build.log"
          pnpm --filter metaforge run typecheck 2>&1 | tee "$EVIDENCE_DIR/metaforge-typecheck.log"
          node --test \
            server/tests/alumdoor-sales-navigation-contract.test.mjs \
            server/tests/alumdoor-procurement-navigation-contract.test.mjs \
            2>&1 | tee "$EVIDENCE_DIR/navigation-contracts.log"
          node server/scripts/stage-client-bundle.mjs 2>&1 | tee "$EVIDENCE_DIR/stage-client.log"
          grep -Fq "release=$TARGET_SHA" "$EVIDENCE_DIR/stage-client.log"
          node server/scripts/stage-client-bundle.mjs --check 2>&1 | tee "$EVIDENCE_DIR/stage-check.log"
          printf 'ui_build=pass\ntypecheck=pass\nnavigation_contracts=pass\nclient_stage=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify live metadata is already Alumdoor 2.3.0 before Gateway mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee "$EVIDENCE_DIR/predeploy-live-metadata.log"
          const origin = process.env.FORGE_ORIGIN.replace(/\/$/, '');
          const user = process.env.FORGE_ADMIN_USER;
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map(); let csrf = '';
          function store(response) { for (const value of response.headers.getSetCookie?.() ?? []) { const pair=value.split(';')[0]; const i=pair.indexOf('='); if(i>0) jar.set(pair.slice(0,i).trim(), pair.slice(i+1).trim()); } }
          async function call(method, body={}) { const response=await fetch(`${origin}/api/method/${method}`,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache',...(jar.size?{cookie:[...jar].map(([k,v])=>`${k}=${v}`).join('; ')}:{}),...(csrf?{'x-frappe-csrf-token':csrf}:{})},body:JSON.stringify(body)}); store(response); csrf=response.headers.get('x-frappe-csrf-token')??csrf; const text=await response.text(); let parsed; try { parsed=JSON.parse(text); } catch { throw new Error(`${method} invalid JSON HTTP ${response.status}: ${text.slice(0,200)}`); } if(!response.ok) throw new Error(`${method} HTTP ${response.status}: ${parsed.message??text.slice(0,200)}`); return parsed.message??parsed; }
          await call('login',{usr:user,pwd:password});
          const manifest=await call('metaforge.api.get_app_manifest',{app:'alumdoor'});
          const nav=Array.isArray(manifest.nav)?manifest.nav:[];
          const sales=nav.filter((entry)=>entry?.group==='Bán hàng');
          const purchase=nav.filter((entry)=>entry?.group==='Mua hàng');
          const salesKeys=['alumdoor-operations:workbench','Sales Order','Delivery Note','action:giao-hang-dispatch','action:bao-cao-ban-hang','action:lich-su-ban-hang'];
          const purchaseKeys=['action:tao-don-mua','action:nhap-nhom-hang-loat','action:bao-cao-giao-hang-ncc','action:lich-su-mua-hang'];
          if(JSON.stringify(sales.map((e)=>e.key))!==JSON.stringify(salesKeys)) throw new Error(`live Sales metadata is not 2.3.0: ${JSON.stringify(sales)}`);
          if(JSON.stringify(purchase.map((e)=>e.key))!==JSON.stringify(purchaseKeys)) throw new Error(`live Purchase metadata is not 2.3.0: ${JSON.stringify(purchase)}`);
          if(nav.length!==79) throw new Error(`expected 79 live nav entries from 2.3.0, got ${nav.length}`);
          console.log(`LIVE_METADATA_230_PASS nav=${nav.length} sales=${sales.length} purchase=${purchase.length}`);
          NODE
          printf 'live_metadata_230=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Recheck exact main immediately before Gateway mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$TARGET_SHA" || {
            echo "Refusing Gateway mutation: main moved from authorized $TARGET_SHA to $current_main."
            exit 1
          }
          printf 'pre_gateway_main_guard=pass\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Deploy exact Gateway and UI bundle
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config apps/gateway-worker/wrangler.jsonc 2>&1 | tee "$EVIDENCE_DIR/gateway-deploy.log"
          printf 'gateway_ui=deployed\n' >> "$EVIDENCE_DIR/state.txt"

      - name: Verify exact production release and operational navigation
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/sre-health-snapshot.mjs \
            --base "$FORGE_ORIGIN" \
            --allow-remote \
            --confirm-host alu.kairo.vn \
            --expected-release-sha "$TARGET_SHA" \
            --attempts 12 \
            --delay-ms 5000 \
            --output "$EVIDENCE_DIR/health.json" \
            2>&1 | tee "$EVIDENCE_DIR/health.log"

          guest_code="$(curl --silent --show-error --max-time 15 -o /tmp/guest.json -w '%{http_code}' \
            -H 'content-type: application/json' -H 'Cache-Control: no-cache' \
            -X POST "$FORGE_ORIGIN/api/method/frappe.desk.desktop.get_bootinfo?sha=$TARGET_SHA&run=$GITHUB_RUN_ID" --data '{}')"
          test "$guest_code" = "403"

          node --input-type=module <<'NODE' | tee "$EVIDENCE_DIR/production-nav.log"
          const origin = process.env.FORGE_ORIGIN.replace(/\/$/, '');
          const user = process.env.FORGE_ADMIN_USER;
          const password = process.env.FORGE_ADMIN_PASSWORD;
          const jar = new Map(); let csrf = '';
          function store(response) { for (const value of response.headers.getSetCookie?.() ?? []) { const pair=value.split(';')[0]; const i=pair.indexOf('='); if(i>0) jar.set(pair.slice(0,i).trim(), pair.slice(i+1).trim()); } }
          async function call(method, body={}) { const response=await fetch(`${origin}/api/method/${method}`,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache',...(jar.size?{cookie:[...jar].map(([k,v])=>`${k}=${v}`).join('; ')}:{}),...(csrf?{'x-frappe-csrf-token':csrf}:{})},body:JSON.stringify(body)}); store(response); csrf=response.headers.get('x-frappe-csrf-token')??csrf; const text=await response.text(); const parsed=JSON.parse(text); if(!response.ok) throw new Error(`${method} HTTP ${response.status}: ${parsed.message??text.slice(0,200)}`); return parsed.message??parsed; }
          await call('login',{usr:user,pwd:password});
          const manifest=await call('metaforge.api.get_app_manifest',{app:'alumdoor'});
          const nav=Array.isArray(manifest.nav)?manifest.nav:[];
          const sales=nav.filter((entry)=>entry?.group==='Bán hàng');
          const purchase=nav.filter((entry)=>entry?.group==='Mua hàng');
          const salesKeys=['alumdoor-operations:workbench','Sales Order','Delivery Note','action:giao-hang-dispatch','action:bao-cao-ban-hang','action:lich-su-ban-hang'];
          const salesLabels=['Bán hàng','Đơn hàng','Phiếu xuất kho','Giao hàng','Báo cáo','Lịch sử bán hàng'];
          const purchaseKeys=['action:tao-don-mua','action:nhap-nhom-hang-loat','action:bao-cao-giao-hang-ncc','action:lich-su-mua-hang'];
          const purchaseLabels=['Mua hàng','Nhập hàng','Báo cáo','Lịch sử mua hàng'];
          if(JSON.stringify(sales.map((e)=>e.key))!==JSON.stringify(salesKeys)) throw new Error(`sales keys mismatch ${JSON.stringify(sales)}`);
          if(JSON.stringify(sales.map((e)=>e.label))!==JSON.stringify(salesLabels)) throw new Error(`sales labels mismatch ${JSON.stringify(sales)}`);
          if(JSON.stringify(purchase.map((e)=>e.key))!==JSON.stringify(purchaseKeys)) throw new Error(`purchase keys mismatch ${JSON.stringify(purchase)}`);
          if(JSON.stringify(purchase.map((e)=>e.label))!==JSON.stringify(purchaseLabels)) throw new Error(`purchase labels mismatch ${JSON.stringify(purchase)}`);
          for(const hidden of ['Purchase Order','Purchase Receipt','action:nhap-nhom-fifo','action:doi-soat-giao-hang-ncc','action:giao-hang-theo-ngay','action:tinh-cong-thuc-cua']) if(nav.some((entry)=>entry?.key===hidden)) throw new Error(`hidden entry visible: ${hidden}`);
          console.log(`ALUMDOOR_230_PRODUCTION_PASS nav=${nav.length} sales=${sales.length} purchase=${purchase.length}`);
          NODE
          printf 'production_health=pass\nguest_boundary=pass\noperational_navigation=pass\ncompleted_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$EVIDENCE_DIR/state.txt"

      - name: Publish completion summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Alumdoor 2.3.0 Gateway/UI completion'
            echo
            echo '```text'
            cat "$EVIDENCE_DIR/state.txt" 2>/dev/null || echo 'state.txt missing'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-230-ui-completion-${{ github.run_id }}
          path: /tmp/alu-230-ui-completion-evidence/
          if-no-files-found: warn
          retention-days: 30
