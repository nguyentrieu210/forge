name: UI V3-08 Final Integrated Gate

on:
  push:
    branches:
      - ui/v3-08-release-final-20260804
    paths:
      - "client/**"
      - "docs/agents/ui-v3/**"
      - ".github/workflows/ui-v3-08-final-validation-temp.yml"
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - "docs/agents/ui-v3/**"
      - ".github/workflows/ui-v3-08-final-validation-temp.yml"

permissions:
  contents: read

concurrency:
  group: ui-v3-08-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated-ui:
    if: ${{ github.event_name == 'push' || github.head_ref == 'ui/v3-08-release-final-20260804' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact validation candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Fetch current main for no-regression checks
        run: git fetch origin main --depth=1

      - name: Record candidate
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "HEAD=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "CURRENT_MAIN=$(git rev-parse origin/main)"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm 9.15
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Generate exact lock delta for V3 packages
        run: |
          pnpm install --no-frozen-lockfile --lockfile-only
          echo '--- GENERATED PNPM LOCK DIFF ---'
          git diff -- pnpm-lock.yaml
          echo '--- END GENERATED PNPM LOCK DIFF ---'

      - name: Install generated locked workspace
        run: pnpm install --frozen-lockfile

      - name: Shell typecheck build and mobile invariant
        run: |
          pnpm --filter @metaforge/shell run typecheck
          pnpm --filter @metaforge/shell run build
          node client/scripts/check-app-shell-mobile.mjs

      - name: Builder typecheck and build
        run: |
          pnpm --filter @metaforge/builder run typecheck
          pnpm --filter @metaforge/builder run build

      - name: Builder inherited contract evidence
        id: builder_contract
        continue-on-error: true
        run: pnpm --filter @metaforge/builder run test

      - name: Charts visual and views gates
        run: |
          pnpm --filter @metaforge/charts run test
          pnpm --filter @metaforge/visual run typecheck
          pnpm --filter @metaforge/views run typecheck
          node --test client/packages/views/tests/data-surface-v3.test.mjs

      - name: Full client typecheck
        run: pnpm run client:typecheck

      - name: Structural V3-safe client invariants
        run: |
          cd client
          node scripts/check-hook-order.mjs
          node scripts/check-app-shell-mobile.mjs
          node scripts/check-pwa-installability.mjs
          node scripts/check-child-grid-mobile.mjs
          node scripts/check-pull-to-refresh.mjs
          cd ..
          node --check server/scripts/stage-client-bundle.mjs

      - name: Historical matrix domain-leak baseline evidence
        id: matrix_baseline
        continue-on-error: true
        run: |
          cd client
          node scripts/check-matrix-domain-leaks.mjs

      - name: Historical native-ui baseline evidence
        id: native_baseline
        continue-on-error: true
        run: |
          cd client
          node scripts/check-native-ui.mjs

      - name: No new native-ui or domain-leak violations versus current main
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const files = execFileSync('git', ['diff', '--name-only', 'origin/main', 'HEAD', '--', 'client'], { encoding: 'utf8' })
            .split(/\r?\n/).filter((file) => file.endsWith('.tsx'));
          const allowStyle = /gridTemplateColumns|width:\s*`?\$\{|left:\s*`?\$\{|height:|paddingLeft|minHeight|--mf|transform:/;
          const forbiddenDomainLiterals = /["'`](Item Price|Price List)["'`]/;
          const violations = [];
          for (const file of files) {
            const lines = readFileSync(file, 'utf8').split('\n');
            lines.forEach((line, index) => {
              if (/^(?:\*|\/\/)/.test(line.trim())) return;
              const at = `${file}:${index + 1}`;
              if (/style=\{\{/.test(line) && !allowStyle.test(line)) violations.push(`${at} [inline style] ${line.trim().slice(0, 100)}`);
              if (/<(button|input|select|table|textarea|option|datalist)\b/.test(line)) violations.push(`${at} [native element] ${line.trim().slice(0, 100)}`);
              if (/(icon|nav).*[🔍📝📋🗂️🌳📅📊📈📑🖨️🛠️🔀🧾📐]/.test(line)) violations.push(`${at} [emoji icon] ${line.trim().slice(0, 100)}`);
              if (file.includes('client/packages/views/') && forbiddenDomainLiterals.test(line)) violations.push(`${at} [domain literal] ${line.trim().slice(0, 100)}`);
            });
          }
          console.log(`Changed TSX files scanned: ${files.length}`);
          if (violations.length) {
            console.error(`New V3-08 structural violations: ${violations.length}\n${violations.join('\n')}`);
            process.exit(1);
          }
          console.log('No new native-ui/domain-leak violations versus current main.');
          NODE

      - name: Build runtime and demo dependency graphs
        run: |
          pnpm --filter runtime... run build
          pnpm --filter @metaforge/demo... run build

      - name: Install Chromium
        run: pnpm --filter @metaforge/demo exec playwright install --with-deps chromium

      - name: Run V3 cross-device demo matrix
        run: pnpm --filter @metaforge/demo run e2e:v3:qa

      - name: Run Forge and Alumdoor runtime mobile matrix
        run: pnpm --filter e2e-forge exec playwright test --config playwright.v3-mobile-qa.config.ts

      - name: Evidence summary
        if: always()
        run: |
          echo "builder_contract=${{ steps.builder_contract.outcome }} (inherited from main; V3-08 does not change Builder contract files)"
          echo "matrix_domain_baseline=${{ steps.matrix_baseline.outcome }} (historical main debt; changed-file no-regression gate is authoritative for V3-08)"
          echo "native_ui_baseline=${{ steps.native_baseline.outcome }} (historical repository debt; changed-file no-regression gate is authoritative for V3-08)"

      - name: Upload V3-08 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v3-08-final-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            client/apps/demo/playwright-report/v3-mobile-qa/**
            client/apps/demo/test-results/**
            client/e2e-forge/playwright-report/v3-mobile-qa/**
            client/e2e-forge/test-results/v3-mobile-qa/**
