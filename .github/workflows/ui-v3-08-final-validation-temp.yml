name: UI V3-08 Final Integrated Gate

on:
  push:
    branches:
      - ui/v3-08-release-final-20260804
    paths:
      - "client/**"
      - "docs/agents/ui-v3/**"
      - ".github/workflows/ui-v3-08-final-validation-temp.yml"
  pull_request:
    branches:
      - main
      - ui/v3-08-validation-base
    paths:
      - "client/**"
      - "docs/agents/ui-v3/**"
      - ".github/workflows/ui-v3-08-final-validation-temp.yml"

permissions:
  contents: read

concurrency:
  group: ui-v3-08-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated-ui:
    if: ${{ github.event_name == 'push' || github.head_ref == 'ui/v3-08-release-final-20260804' || github.head_ref == 'ui/v3-08-validation-candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact validation candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Record candidate
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "HEAD=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "BASE=${{ github.event.pull_request.base.sha || 'push' }}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm 9.15
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Generate exact lock delta for V3 packages
        run: |
          pnpm install --no-frozen-lockfile --lockfile-only
          echo '--- GENERATED PNPM LOCK DIFF ---'
          git diff -- pnpm-lock.yaml
          echo '--- END GENERATED PNPM LOCK DIFF ---'

      - name: Install generated locked workspace
        run: pnpm install --frozen-lockfile

      - name: Shell typecheck and build
        run: |
          pnpm --filter @metaforge/shell run typecheck
          pnpm --filter @metaforge/shell run build
          node client/scripts/check-app-shell-mobile.mjs

      - name: Builder typecheck and build
        run: |
          pnpm --filter @metaforge/builder run typecheck
          pnpm --filter @metaforge/builder run build

      - name: Builder contract test evidence
        id: builder_tests
        continue-on-error: true
        run: pnpm --filter @metaforge/builder run test

      - name: Charts visual and views gates
        id: visual_gates
        continue-on-error: true
        run: |
          pnpm --filter @metaforge/charts run test
          pnpm --filter @metaforge/visual run typecheck
          pnpm --filter @metaforge/views run typecheck
          node --test client/packages/views/tests/data-surface-v3.test.mjs

      - name: Frontend structural lint and full typecheck
        id: client_static
        continue-on-error: true
        run: |
          pnpm --dir client run lint
          pnpm run client:typecheck

      - name: Build runtime and demo dependency graphs
        id: app_builds
        continue-on-error: true
        run: |
          pnpm --filter runtime... run build
          pnpm --filter @metaforge/demo... run build

      - name: Install Chromium
        id: chromium
        if: always() && steps.app_builds.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @metaforge/demo exec playwright install --with-deps chromium

      - name: Run V3 cross-device demo matrix
        id: demo_qa
        if: always() && steps.app_builds.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @metaforge/demo run e2e:v3:qa

      - name: Run Forge and Alumdoor runtime mobile matrix
        id: runtime_qa
        if: always() && steps.app_builds.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter e2e-forge exec playwright test --config playwright.v3-mobile-qa.config.ts

      - name: V3-08 integrated gate summary
        if: always()
        run: |
          echo "builder_tests=${{ steps.builder_tests.outcome }}"
          echo "visual_gates=${{ steps.visual_gates.outcome }}"
          echo "client_static=${{ steps.client_static.outcome }}"
          echo "app_builds=${{ steps.app_builds.outcome }}"
          echo "chromium=${{ steps.chromium.outcome }}"
          echo "demo_qa=${{ steps.demo_qa.outcome }}"
          echo "runtime_qa=${{ steps.runtime_qa.outcome }}"
          test "${{ steps.builder_tests.outcome }}" = "success"
          test "${{ steps.visual_gates.outcome }}" = "success"
          test "${{ steps.client_static.outcome }}" = "success"
          test "${{ steps.app_builds.outcome }}" = "success"
          test "${{ steps.chromium.outcome }}" = "success"
          test "${{ steps.demo_qa.outcome }}" = "success"
          test "${{ steps.runtime_qa.outcome }}" = "success"

      - name: Upload V3-08 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v3-08-final-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            client/apps/demo/playwright-report/v3-mobile-qa/**
            client/apps/demo/test-results/**
            client/e2e-forge/playwright-report/v3-mobile-qa/**
            client/e2e-forge/test-results/v3-mobile-qa/**
