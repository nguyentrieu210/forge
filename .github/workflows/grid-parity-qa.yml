name: Grid Parity QA

on:
  pull_request:
    branches: [converge/grid-parity-qa-20260811]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grid-parity-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify AlumDoor child presentation contract
        working-directory: server
        run: node --test tests/alumdoor-child-presentation.test.mjs
      - name: Build shared MetaForge views
        run: pnpm --filter @metaforge/views run build
      - name: Verify grid runtime and convergence contracts
        run: >-
          node --test
          client/packages/views/tests/metadata-child-grid-runtime.test.mjs
          client/packages/views/tests/grid-parity-convergence.test.mjs
      - name: Run deterministic MetaForge selfchecks
        run: pnpm --filter @metaforge/demo run selfcheck
      - name: Build MetaForge demo
        run: pnpm --filter @metaforge/demo run build
      - name: Source diff hygiene
        run: git diff --check -- . ':(exclude)client/apps/*/dist/**' ':(exclude)client/apps/*/dist-mobile/**'

  browser:
    name: Desktop, tablet and mobile browser evidence
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        working-directory: client/apps/demo
        run: pnpm exec playwright install --with-deps chromium
      - name: Run exact smart-grid browser scenarios
        working-directory: client/apps/demo
        run: pnpm exec playwright test e2e/grid-parity.spec.ts --config playwright.e2e.config.mjs --tsconfig=e2e/tsconfig.json
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-parity-browser-${{ github.run_id }}
          path: |
            client/apps/demo/test-results/**
            client/apps/demo/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
