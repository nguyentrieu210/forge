name: Sentrux stock report kit apply

on:
  push:
    branches: [agent/sentrux-convergence-20260816]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Detect applied source
        id: state
        shell: bash
        run: |
          if [[ -f client/packages/views/src/stock-report-kit.ts ]]; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
            echo 'stock-report-kit already applied; no-op'
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Sentrux
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux

      - name: Capture baseline
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/before.txt
          BEFORE=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          echo "BEFORE=$BEFORE" >> "$GITHUB_ENV"
          echo "Baseline Quality=$BEFORE"

      - name: Apply stock report kit
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          kit = Path('client/packages/views/src/stock-report-kit.ts')
          lines = [
              '/** Narrow dependency surface for stock/accounting reports. */',
              'export { useMetaForge, useLocaleFormat } from "./container/meta-context.js";',
              'export { useList } from "./container/hooks.js";',
              'export { resolveDateRange } from "./list/date-range.js";',
              'export { PeriodPicker, type PeriodPickerProps } from "./report/PeriodPicker.js";',
              'export { exportFormXlsx, ymdToDmy, type FormXlsxOptions, type HeaderMerge } from "./report/form-export.js";',
          ]
          kit.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          pkg_path = Path('client/packages/views/package.json')
          pkg = pkg_path.read_text(encoding='utf-8')
          anchor = '    "./form": {\n      "types": "./dist/form/FormView.d.ts",\n      "import": "./dist/form/FormView.js"\n    }\n'
          replacement = '    "./form": {\n      "types": "./dist/form/FormView.d.ts",\n      "import": "./dist/form/FormView.js"\n    },\n    "./stock-report-kit": {\n      "types": "./dist/stock-report-kit.d.ts",\n      "import": "./dist/stock-report-kit.js"\n    }\n'
          if anchor not in pkg:
              raise SystemExit('views package export anchor missing')
          pkg_path.write_text(pkg.replace(anchor, replacement, 1), encoding='utf-8')

          for name in ('TongHopDoiTuongScreen.tsx','SoChiTietScreen.tsx','XuatNhapTonScreen.tsx'):
              path = Path('client/packages/stock-vn/src') / name
              raw = path.read_bytes()
              old = b'from "@metaforge/views";'
              if old not in raw:
                  raise SystemExit(f'root views import missing in {path}')
              path.write_bytes(raw.replace(old, b'from "@metaforge/views/stock-report-kit";', 1))
              print('migrate', path)
          PY
          # Sentrux enumerates git ls-files; stage the new file so the scan sees it.
          git add client/packages/views/src/stock-report-kit.ts
          git diff --stat

      - name: Install package-only workspace
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd client
          printf 'packages:\n  - "packages/*"\n' > pnpm-workspace.yaml
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --no-frozen-lockfile

      - name: Build views and stock-vn
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd client
          pnpm --filter @metaforge/views build
          pnpm --filter @metaforge/stock-vn build

      - name: Restore validation-only workspace files
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- client/pnpm-workspace.yaml client/pnpm-lock.yaml

      - name: Sentrux regression and quality gate
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate . | tee /tmp/after.txt
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          echo "Candidate Quality=$AFTER (baseline=$BEFORE)"
          if (( AFTER <= BEFORE )); then
            echo "Expected strict quality improvement, got $BEFORE -> $AFTER" >&2
            exit 1
          fi

      - name: Commit validated source
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentrux-agent'
          git config user.email 'sentrux-agent@users.noreply.github.com'
          git add \
            client/packages/views/src/stock-report-kit.ts \
            client/packages/views/package.json \
            client/packages/stock-vn/src/TongHopDoiTuongScreen.tsx \
            client/packages/stock-vn/src/SoChiTietScreen.tsx \
            client/packages/stock-vn/src/XuatNhapTonScreen.tsx
          git diff --cached --stat
          git commit -m 'refactor(views): isolate stock report dependencies'
          git push origin HEAD:agent/sentrux-convergence-20260816
