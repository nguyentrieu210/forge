name: Sentrux lean views root apply

on:
  push:
    branches:
      - agent/sentrux-convergence-20260816

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip sentrux-lean-views-root]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816

      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
          sentrux --version

      - name: Capture baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-before.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-before.txt | tail -1 | grep -Eo '[0-9]+')
          test -n "$QUALITY"
          echo "quality=$QUALITY" >> "$GITHUB_OUTPUT"

      - name: Remove heavyweight screens from views root
        run: node scripts/sentrux-lean-views-root.mjs

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build views package
        run: pnpm --filter @metaforge/views run build

      - name: Typecheck application packages
        run: pnpm --filter './client/apps/**' run typecheck

      - name: Typecheck runtime closure
        run: pnpm --filter runtime run typecheck

      - name: Build runtime production bundle
        run: pnpm --filter runtime run build

      - name: Sentrux regression gate
        run: sentrux gate .

      - name: Require quality and depth improvement
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . | tee /tmp/sentrux-after.txt
          QUALITY=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/sentrux-after.txt | tail -1 | grep -Eo '[0-9]+')
          BEFORE='${{ steps.before.outputs.quality }}'
          test -n "$QUALITY"
          if [ "$QUALITY" -le "$BEFORE" ]; then
            echo "Quality did not increase: $BEFORE -> $QUALITY"
            exit 1
          fi
          python3 <<'PY'
          import json, select, subprocess, time
          p = subprocess.Popen(["sentrux", "--mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)
          def send(x):
              p.stdin.write(json.dumps(x, separators=(",", ":")) + "\n"); p.stdin.flush()
          def recv(i, timeout=45):
              deadline=time.time()+timeout
              while time.time()<deadline:
                  ready,_,_=select.select([p.stdout],[],[],max(0,deadline-time.time()))
                  if not ready: break
                  line=p.stdout.readline()
                  if not line: break
                  try: m=json.loads(line)
                  except Exception: continue
                  if m.get("id")==i: return m
              raise RuntimeError(f"timeout waiting for {i}")
          def text_result(m):
              content=m.get("result",{}).get("content",[])
              return json.loads(next(x["text"] for x in content if x.get("type")=="text"))
          def args_for(t):
              props=t.get("inputSchema",{}).get("properties",{}); required=t.get("inputSchema",{}).get("required",[]); args={}
              for k in ("path","root","project_path","directory"):
                  if k in props: args[k]="."; break
              for k in required:
                  if k in args: continue
                  typ=props.get(k,{}).get("type")
                  args[k] = "." if typ=="string" else False if typ=="boolean" else [] if typ=="array" else {}
              return args
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"forge-lean-views-root","version":"1"}}})
          recv(1)
          send({"jsonrpc":"2.0","method":"notifications/initialized","params":{}})
          send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}})
          tools=recv(2).get("result",{}).get("tools",[]); by={t.get("name"):t for t in tools}
          send({"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"scan","arguments":args_for(by["scan"])}}); recv(3)
          send({"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"health","arguments":args_for(by["health"])}})
          health=text_result(recv(4)); depth=health["root_causes"]["depth"]["raw"]
          print(f"POST_DEPTH={depth}")
          if depth >= 17: raise SystemExit(f"Depth did not decrease below 17: {depth}")
          p.kill()
          PY
          echo "Quality: $BEFORE -> $QUALITY"

      - name: Commit validated root split
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sentrux
          git rm scripts/sentrux-lean-views-root.mjs
          git rm .github/workflows/sentrux-lean-views-root-apply.yml
          git config user.name "sentrux-refactor-bot"
          git config user.email "sentrux-refactor-bot@users.noreply.github.com"
          git add -A client
          git commit -m "refactor(views): keep heavyweight screens off root barrel [skip sentrux-lean-views-root]"
          git push origin HEAD:agent/sentrux-convergence-20260816
