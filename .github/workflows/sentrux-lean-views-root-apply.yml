name: Sentrux lean views root metric probe

on:
  push:
    branches:
      - agent/sentrux-convergence-20260816

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sentrux-convergence-20260816
      - name: Install Sentrux
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x /tmp/sentrux
          sudo mv /tmp/sentrux /usr/local/bin/sentrux
      - name: Measure candidate
        shell: bash
        run: |
          set -euo pipefail
          sentrux gate --save . > /tmp/before.txt
          BEFORE=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/before.txt | tail -1 | grep -Eo '[0-9]+')
          node scripts/sentrux-lean-views-root.mjs
          sentrux gate --save . > /tmp/after.txt
          AFTER=$(grep -Eo 'Quality:[[:space:]]*[0-9]+' /tmp/after.txt | tail -1 | grep -Eo '[0-9]+')
          export BEFORE AFTER
          python3 <<'PY'
          import json, os, select, subprocess, time
          p = subprocess.Popen(["sentrux", "--mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)
          def send(x): p.stdin.write(json.dumps(x,separators=(",",":"))+"\n"); p.stdin.flush()
          def recv(i, timeout=45):
              end=time.time()+timeout
              while time.time()<end:
                  ready,_,_=select.select([p.stdout],[],[],max(0,end-time.time()))
                  if not ready: break
                  line=p.stdout.readline()
                  if not line: break
                  try: m=json.loads(line)
                  except Exception: continue
                  if m.get("id")==i: return m
              raise RuntimeError(i)
          def args_for(t):
              props=t.get("inputSchema",{}).get("properties",{}); req=t.get("inputSchema",{}).get("required",[]); a={}
              for k in ("path","root","project_path","directory"):
                  if k in props: a[k]="."; break
              for k in req:
                  if k in a: continue
                  typ=props.get(k,{}).get("type"); a[k]="." if typ=="string" else False if typ=="boolean" else [] if typ=="array" else {}
              return a
          def text(m): return json.loads(next(x["text"] for x in m.get("result",{}).get("content",[]) if x.get("type")=="text"))
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"lean-root-probe","version":"1"}}}); recv(1)
          send({"jsonrpc":"2.0","method":"notifications/initialized","params":{}})
          send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}); by={t.get("name"):t for t in recv(2)["result"]["tools"]}
          send({"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"scan","arguments":args_for(by["scan"])}}); recv(3)
          send({"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"health","arguments":args_for(by["health"])}}); h=text(recv(4))
          print("RESULT BEFORE=%s AFTER=%s DEPTH=%s CROSS=%s" % (os.environ["BEFORE"], os.environ["AFTER"], h["root_causes"]["depth"]["raw"], h.get("cross_module_edges")))
          p.kill()
          PY
