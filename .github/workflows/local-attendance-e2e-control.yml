name: Local attendance payroll E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/local-attendance-e2e-control.yml'

jobs:
  launch:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: Launch persistent feature backend 18899 and runtime 5173
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = 'C:\forge-attendance-payroll'
          $shared = 'C:\alumdoor'
          $target = 'feature/attendance-payroll'
          $devDir = 'C:\forge-attendance-payroll-dev'
          New-Item -ItemType Directory -Force -Path $devDir | Out-Null

          git -C $worktree fetch origin $target --prune
          if ($LASTEXITCODE -ne 0) { throw 'Feature fetch failed' }
          git -C $worktree merge --ff-only "origin/$target"
          if ($LASTEXITCODE -ne 0) { throw 'Feature fast-forward failed' }

          foreach ($port in @(8799,18899,5173)) {
            Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue | ForEach-Object {
              Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 1

          Copy-Item (Join-Path $shared 'server\apps\tenant-worker\.dev.vars') (Join-Path $worktree 'server\apps\tenant-worker\.dev.vars') -Force
          $persist = Join-Path $shared 'server\apps\tenant-worker\.wrangler\state'
          $backendOut = Join-Path $devDir 'backend-18899.out.log'
          $backendErr = Join-Path $devDir 'backend-18899.err.log'
          $frontOut = Join-Path $devDir 'frontend-5173.out.log'
          $frontErr = Join-Path $devDir 'frontend-5173.err.log'
          Remove-Item $backendOut,$backendErr,$frontOut,$frontErr -Force -ErrorAction SilentlyContinue

          # GitHub Actions runner uses this marker to find and terminate orphan processes.
          # Clear it using the runner-maintainer documented PowerShell form before spawning.
          $env:RUNNER_TRACKING_ID = ""

          $backendCommand = "cd /d $worktree\server && npx wrangler dev --config apps/tenant-worker/wrangler.jsonc --port 18899 --local --persist-to `"$persist`""
          Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/s','/c',$backendCommand) -WorkingDirectory (Join-Path $worktree 'server') -RedirectStandardOutput $backendOut -RedirectStandardError $backendErr -WindowStyle Hidden | Out-Null

          $ready = $false
          for ($i=0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18899/health' -TimeoutSec 3).StatusCode -eq 200) { $ready = $true; break } } catch {}
          }
          if (-not $ready) {
            Get-Content $backendOut -Tail 120 -ErrorAction SilentlyContinue
            Get-Content $backendErr -Tail 120 -ErrorAction SilentlyContinue
            throw 'Feature backend 18899 did not start'
          }

          $frontCommand = "cd /d $worktree && set VITE_FORGE_BACKEND=http://127.0.0.1:18899&& pnpm --dir client --filter runtime dev -- --host 0.0.0.0 --port 5173 --strictPort"
          Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/s','/c',$frontCommand) -WorkingDirectory $worktree -RedirectStandardOutput $frontOut -RedirectStandardError $frontErr -WindowStyle Hidden | Out-Null

          $ready = $false
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5173/?app=alumdoor-attendance' -TimeoutSec 3).StatusCode -eq 200) { $ready = $true; break } } catch {}
          }
          if (-not $ready) {
            Get-Content $frontOut -Tail 120 -ErrorAction SilentlyContinue
            Get-Content $frontErr -Tail 120 -ErrorAction SilentlyContinue
            throw 'Feature runtime 5173 did not start'
          }

          foreach ($route in @('today','month','exceptions','payroll-run','payroll-my-slips')) {
            $encoded = [Uri]::EscapeDataString("alumdoor-attendance:$route")
            $url = "http://127.0.0.1:5173/x/${encoded}?app=alumdoor-attendance"
            if ((Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 5).StatusCode -ne 200) { throw "Route failed: $route" }
            Write-Host "ROUTE_OK=$route"
          }
          Write-Host 'ATTENDANCE_PAYROLL_LOCAL_LAUNCHED'

  persistence-check:
    needs: launch
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Confirm processes survived launch-job cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 3
          $backend = Get-NetTCPConnection -LocalPort 18899 -State Listen -ErrorAction Stop | Select-Object -First 1
          $frontend = Get-NetTCPConnection -LocalPort 5173 -State Listen -ErrorAction Stop | Select-Object -First 1
          if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18899/health' -TimeoutSec 5).StatusCode -ne 200) { throw '18899 health failed' }
          if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5173/?app=alumdoor-attendance' -TimeoutSec 5).StatusCode -ne 200) { throw '5173 probe failed' }
          Write-Host "FEATURE_BACKEND_PID=$($backend.OwningProcess)"
          Write-Host "FEATURE_FRONTEND_PID=$($frontend.OwningProcess)"
          Write-Host 'ATTENDANCE_URL=http://localhost:5173/?app=alumdoor-attendance'
          Write-Host 'PAYROLL_URL=http://localhost:5173/x/alumdoor-attendance%3Apayroll-run?app=alumdoor-attendance'
          Write-Host 'ATTENDANCE_PAYROLL_LOCAL_E2E_READY'
