name: Local Runner Import Contract

on:
  pull_request:
    paths:
      - 'run-local.bat'
      - 'sync-local.bat'
      - 'scripts/local-runner/**'
      - 'server/scripts/alumdoor-runtime-service-host.mjs'
      - 'server/scripts/alumdoor-legacy-runtime-migration.mjs'
      - 'server/scripts/test-alumdoor-legacy-runtime-migration.mjs'
      - 'server/scripts/ensure-alumdoor-local-vars.mjs'
      - 'server/scripts/lib/alumdoor-managed-process-tree.mjs'
      - 'server/scripts/test-alumdoor-managed-process-tree.mjs'
      - 'server/scripts/grant-alumdoor-runner-service-control.ps1'
      - 'server/scripts/install-alumdoor-runtime-services.ps1'
      - 'server/scripts/test-alumdoor-service-control-contract.mjs'
      - 'server/scripts/*alumdoor*local*.mjs'
      - 'server/scripts/*alumdoor-real-purchase*.mjs'
      - 'server/scripts/lib/alumdoor-real-purchase-*.mjs'
      - 'server/scripts/*alumdoor-pricing*.mjs'
      - '.github/workflows/*alumdoor*local*.yml'
      - '.github/workflows/alumdoor-service-control-remediation-prestage.yml'
      - '.github/workflows/alumdoor-real-purchase-import-policy.yml'
      - '.github/workflows/local-runner-import-contract.yml'
      - 'skills/forge-local-runner-import/**'
      - 'AI_HANDOFF.md'
  push:
    branches: [main]
    paths:
      - 'run-local.bat'
      - 'sync-local.bat'
      - 'scripts/local-runner/**'
      - 'server/scripts/alumdoor-runtime-service-host.mjs'
      - 'server/scripts/alumdoor-legacy-runtime-migration.mjs'
      - 'server/scripts/test-alumdoor-legacy-runtime-migration.mjs'
      - 'server/scripts/ensure-alumdoor-local-vars.mjs'
      - 'server/scripts/lib/alumdoor-managed-process-tree.mjs'
      - 'server/scripts/test-alumdoor-managed-process-tree.mjs'
      - 'server/scripts/grant-alumdoor-runner-service-control.ps1'
      - 'server/scripts/install-alumdoor-runtime-services.ps1'
      - 'server/scripts/test-alumdoor-service-control-contract.mjs'
      - 'server/scripts/*alumdoor*local*.mjs'
      - 'server/scripts/*alumdoor-real-purchase*.mjs'
      - 'server/scripts/lib/alumdoor-real-purchase-*.mjs'
      - 'server/scripts/*alumdoor-pricing*.mjs'
      - '.github/workflows/*alumdoor*local*.yml'
      - '.github/workflows/alumdoor-service-control-remediation-prestage.yml'
      - '.github/workflows/alumdoor-real-purchase-import-policy.yml'
      - '.github/workflows/local-runner-import-contract.yml'
      - 'skills/forge-local-runner-import/**'
      - 'AI_HANDOFF.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit test local runner contract
        run: |
          node --test \
            scripts/local-runner/contract.test.mjs \
            scripts/local-runner/bootstrap-helper-context.test.mjs \
            scripts/local-runner/local-mutation-child-context.test.mjs
          node server/scripts/test-alumdoor-managed-process-tree.mjs
          node server/scripts/test-alumdoor-service-control-contract.mjs
          node server/scripts/test-alumdoor-legacy-runtime-migration.mjs

      - name: Syntax check execution sources
        run: |
          node --check scripts/local-runner/run-local-import.mjs
          node --check scripts/local-runner/run-local-import-core.mjs
          node --check scripts/local-runner/pricing-adapter.mjs
          node --check scripts/local-runner/real-purchase-adapter.mjs
          node --check scripts/local-runner/assert-bootstrap-helper-context.mjs
          node --check scripts/local-runner/assert-local-mutation-child-context.mjs
          node --check scripts/local-runner/assert-ports-quiet.mjs
          node --check scripts/local-runner/audit-local-mutation-entrypoints.mjs
          node --check server/scripts/alumdoor-runtime-service-host.mjs
          node --check server/scripts/alumdoor-legacy-runtime-migration.mjs
          node --check server/scripts/ensure-alumdoor-local-vars.mjs
          node --check server/scripts/lib/alumdoor-managed-process-tree.mjs
          node --check server/scripts/import-alumdoor-reason-master-local.mjs
          node --check server/scripts/import-alumdoor-item-master-local.mjs
          node --check server/scripts/seed-alumdoor-uom-local.mjs
          node --check server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs
          node --check server/scripts/import-alumdoor-pricing-local.mjs
          node --check server/scripts/verify-alumdoor-real-purchase-audit.mjs
          node --check server/scripts/test-alumdoor-service-control-contract.mjs

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^

      - name: Global local-mutation inventory
        run: node scripts/local-runner/audit-local-mutation-entrypoints.mjs

      - name: Enforce one mutation entry point
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/bootstrap-alumdoor-local.yml
            .github/workflows/alumdoor-master-layer0-local-seed.yml
            .github/workflows/alumdoor-reason-master-local-import.yml
            .github/workflows/import-alumdoor-item-master-local.yml
            .github/workflows/reconcile-alumdoor-local-source-uom.yml
            .github/workflows/alumdoor-real-purchase-import-policy.yml
            .github/workflows/alumdoor-pricing-local-import.yml
          )
          for file in "${files[@]}"; do
            grep -q 'group: alumdoor-local-d1-mutation' "$file"
            grep -q 'cancel-in-progress: false' "$file"
            grep -q 'scripts\\local-runner\\run-local-import.mjs' "$file"
            if grep -Eq 'npx[[:space:]]+wrangler|wrangler[[:space:]]+d1[[:space:]]+(execute|migrations)|stop-local-dev\.mjs' "$file"; then
              echo "Bypass mutation/process-control path is forbidden in $file"
              exit 1
            fi
          done
          if grep -RInE --include='*.yml' --include='*.yaml' 'sync-local\.bat[[:space:]]+--bootstrap' .github/workflows; then
            echo 'Bootstrap mutation must go through run-local-import.mjs bootstrap'
            exit 1
          fi

      - name: Enforce source-only legacy bridge and serialized acceptance
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=.github/workflows/bootstrap-alumdoor-local.yml
          reason=.github/workflows/alumdoor-reason-master-local-import.yml
          pricing=.github/workflows/alumdoor-pricing-local-import.yml
          helper=server/scripts/alumdoor-legacy-runtime-migration.mjs
          ensure=server/scripts/ensure-alumdoor-local-vars.mjs
          host=server/scripts/alumdoor-runtime-service-host.mjs

          grep -q 'LEGACY_SOURCE_SYNC=PASS' "$bootstrap"
          grep -q 'LEGACY_SOURCE_LOCK=ACQUIRED' "$bootstrap"
          grep -q 'merge --ff-only origin/main' "$bootstrap"
          grep -q 'd1_mutation=0' "$bootstrap"
          grep -q 'legacy-runtime-migration.request.json' "$bootstrap"
          grep -q 'LEGACY_RUNTIME_MIGRATION=PASS' "$bootstrap"
          grep -q 'forge-alumdoor-legacy-runtime-migration/v1' "$bootstrap"
          if grep -qE 'Stop-Service|taskkill|sc\.exe|backup-local-state\.mjs|wrangler[[:space:]]+d1' "$bootstrap"; then
            echo 'Bootstrap bridge may only converge source and request the fixed LocalSystem migration helper'
            exit 1
          fi

          grep -q 'isManagedBackendAuthority' "$helper"
          grep -q 'ForgeAlumdoorBackend' "$helper"
          grep -q 'ForgeAlumdoorWorker' "$helper"
          grep -q 'nssm' "$helper"
          grep -q 'legacy_target_not_canonical_repo' "$helper"
          grep -q 'LEGACY_BACKEND_DISABLE=PASS' "$helper"
          grep -q 'LEGACY_DESK_STOP=PASS' "$helper"
          grep -q 'reconcileLegacyRuntimeMigration' "$ensure"
          if grep -qiE 'wrangler[[:space:]]+d1|--remote' "$helper"; then
            echo 'Legacy runtime helper must never mutate D1 or remote state'
            exit 1
          fi

          grep -q 'workflow_run:' "$reason"
          grep -q 'Bootstrap Alumdoor Local C Drive' "$reason"
          grep -q 'github.event.workflow_run.head_sha' "$reason"
          if grep -qE '^[[:space:]]{2}push:' "$reason"; then
            echo 'Reason Master acceptance must not race bootstrap on the same push'
            exit 1
          fi

          grep -q 'workflow_run:' "$pricing"
          grep -q 'Bootstrap Alumdoor Local C Drive' "$pricing"
          grep -q 'github.event.workflow_run.head_sha' "$pricing"
          grep -q 'run-local-import.mjs pricing' "$pricing"
          if grep -qE '^[[:space:]]{2}push:' "$pricing"; then
            echo 'Pricing acceptance must not race bootstrap on the same push'
            exit 1
          fi

          grep -q 'managedProcessTree' "$host"
          grep -q 'COREPACK_ENABLE_DOWNLOAD_PROMPT' "$host"
          if grep -q 'taskkill' "$host"; then
            echo 'Managed service host must not use taskkill; terminate only descendants of its owned root PID'
            exit 1
          fi

      - name: Enforce internal helper and child mutation boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assert-bootstrap-helper-context.mjs' run-local.bat
          grep -q 'assert-bootstrap-helper-context.mjs' sync-local.bat
          grep -q 'server\\node_modules\\.bin\\wrangler.cmd' run-local.bat
          if grep -Eq 'npx[[:space:]]+wrangler|stop-local-dev\.mjs' run-local.bat sync-local.bat; then
            echo 'Internal bootstrap helpers may not resolve Wrangler ad-hoc or kill listeners by port'
            exit 1
          fi
          grep -q 'assertLocalMutationChildContext' server/scripts/import-alumdoor-reason-master-local.mjs
          grep -q 'assertLocalMutationChildContext' server/scripts/import-alumdoor-item-master-local.mjs
          grep -q 'assertLocalMutationChildContext' server/scripts/seed-alumdoor-uom-local.mjs
          grep -q 'assertLocalMutationChildContext' server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs
          grep -q 'assertLocalMutationChildContext' server/scripts/import-alumdoor-pricing-local.mjs

      - name: Enforce minimal Windows service-control grant
        shell: bash
        run: |
          set -euo pipefail
          grant=server/scripts/grant-alumdoor-runner-service-control.ps1
          installer=server/scripts/install-alumdoor-runtime-services.ps1
          prestage=.github/workflows/alumdoor-service-control-remediation-prestage.yml

          grep -q "\$controlMask = '0x000200BD'" "$grant"
          test "$(grep -c "\$controlMask = '0x000200BD'" "$grant")" -eq 1
          grep -q 'ALUMDOOR_RUNNER_SERVICE_CONTROL_PASS' "$grant"
          grep -q 'Win32_ComputerSystem' "$grant"
          grep -q 'actions.runner.nguyentrieu210-forge' "$grant"
          grep -q 'grant-alumdoor-runner-service-control.ps1' "$installer"
          grep -q 'service-control-grant.json' "$installer"
          grep -q 'SERVICE_CONTROL_REMEDIATION_PRESTAGED=PASS' "$prestage"
          grep -q 'No elevation was attempted by this workflow' "$prestage"
          if grep -Eq "\$controlMask[[:space:]]*=[[:space:]]*'0x000F01FF'|\$controlMask[[:space:]]*=[[:space:]]*'0x000F[0-9A-Fa-f]+'" "$grant"; then
            echo 'Service-control grant mask is broader than the approved local-runner mask'
            exit 1
          fi

      - name: Enforce local-only Wrangler contract
        shell: bash
        run: |
          set -euo pipefail
          core=scripts/local-runner/run-local-import-core.mjs
          pricing=scripts/local-runner/pricing-adapter.mjs
          grep -q "Remote mutation guard: --remote is forbidden" "$core"
          grep -q "Wrangler D1 command must include --local" "$core"
          grep -q "GLOBAL_D1_LOCK=ACQUIRED" "$core"
          grep -q "BACKUP_STATUS=PASS" "$core"
          grep -q "RUNTIME_RESTORE=PASS" "$core"
          grep -q "EXECUTION_STATUS=SUCCESS" "$core"
          grep -q "real-purchase" "$core"
          grep -q "GLOBAL_D1_LOCK=ACQUIRED" "$pricing"
          grep -q "BACKUP_STATUS=PASS" "$pricing"
          grep -q "ALUMDOOR_LOCAL_PRICING_IMPORT_PASS" "$pricing"
          grep -q "EXECUTION_STATUS=SUCCESS" "$pricing"
          grep -q "assertLocalWranglerArgs" "$pricing"
          grep -q "ALUMDOOR_REAL_PURCHASE_IMPORT_PASS" scripts/local-runner/real-purchase-adapter.mjs
          if grep -RInE --exclude='run-local-import.mjs' --exclude='run-local-import-core.mjs' --exclude='*.test.mjs' -- '--remote' scripts/local-runner; then
            echo 'Unexpected --remote token in local runner sources'
            exit 1
          fi

      - name: Reject Real Purchase child-script D1 bypass
        shell: bash
        run: |
          set -euo pipefail
          files=(
            server/scripts/audit-alumdoor-real-purchase-local.mjs
            server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs
            server/scripts/import-alumdoor-real-purchase-local.mjs
            server/scripts/verify-alumdoor-real-purchase-audit.mjs
          )
          if grep -nE 'npx[[:space:]]+wrangler|wrangler[[:space:]]+d1[[:space:]]+(execute|migrations)|execFileSync\([^\n]*wrangler' "${files[@]}"; then
            echo 'Real Purchase child scripts may not invoke Wrangler directly'
            exit 1
          fi

      - name: Enforce skill discovery
        shell: bash
        run: |
          set -euo pipefail
          test -f skills/forge-local-runner-import/SKILL.md
          grep -q 'skills/forge-local-runner-import/SKILL.md' AI_HANDOFF.md
          grep -q 'node scripts\\local-runner\\run-local-import.mjs' skills/forge-local-runner-import/SKILL.md
          grep -q 'real-purchase' skills/forge-local-runner-import/SKILL.md
          grep -q 'pricing' skills/forge-local-runner-import/SKILL.md
