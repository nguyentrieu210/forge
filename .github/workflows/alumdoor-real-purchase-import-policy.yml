name: Alumdoor Real Purchase Import Policy

on:
  push:
    branches: [agent/alumdoor-real-purchase-import]
    paths:
      - 'apps/alumdoor/docs/nguon/ms-lien/chi-tiết-nhập-hàng-ngày.md'
      - 'server/scripts/lib/alumdoor-real-purchase-*.mjs'
      - 'server/scripts/preflight-alumdoor-real-purchase-import.mjs'
      - 'server/scripts/audit-alumdoor-real-purchase-local.mjs'
      - 'server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs'
      - 'server/scripts/import-alumdoor-real-purchase-local.mjs'
      - 'server/scripts/test-alumdoor-real-purchase-import.mjs'
      - '.github/workflows/alumdoor-real-purchase-import-policy.yml'
  pull_request:
    paths:
      - 'apps/alumdoor/docs/nguon/ms-lien/chi-tiết-nhập-hàng-ngày.md'
      - 'server/scripts/lib/alumdoor-real-purchase-*.mjs'
      - 'server/scripts/preflight-alumdoor-real-purchase-import.mjs'
      - 'server/scripts/audit-alumdoor-real-purchase-local.mjs'
      - 'server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs'
      - 'server/scripts/import-alumdoor-real-purchase-local.mjs'
      - 'server/scripts/test-alumdoor-real-purchase-import.mjs'
      - '.github/workflows/alumdoor-real-purchase-import-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-real-purchase-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  purchase-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check server/scripts/lib/alumdoor-real-purchase-source.mjs
          node --check server/scripts/lib/alumdoor-real-purchase-preflight.mjs
          node --check server/scripts/preflight-alumdoor-real-purchase-import.mjs
          node --check server/scripts/audit-alumdoor-real-purchase-local.mjs
          node --check server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs
          node --check server/scripts/import-alumdoor-real-purchase-local.mjs
          node --check server/scripts/test-alumdoor-real-purchase-import.mjs
      - name: Lock source and historical draft contract
        run: node server/scripts/test-alumdoor-real-purchase-import.mjs
      - name: Lock fail-closed operational mode
        run: node server/scripts/preflight-alumdoor-real-purchase-import.mjs /tmp/alumdoor-real-purchase-preflight.json --expect-blocked

  purchase-local-import:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: purchase-preflight
    runs-on: [self-hosted]
    timeout-minutes: 45
    env:
      FORGE_ORIGIN: http://127.0.0.1:8799
      FORGE_ADMIN_USER: dev@example.com
      FORGE_ADMIN_PASSWORD: local-dev-password-1
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Recover local stack if needed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit([200,401,403].includes(r.status)?0:1)).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) {
            & cmd.exe /d /c "C:\alumdoor\sync-local.bat --bootstrap --skip-source-verify"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to recover local stack.' }
          }
          Write-Host 'ALUMDOOR_REAL_PURCHASE_LOCAL_RECOVERY_PASS'

      - name: Guard local runtime
        id: guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $local = 'C:\alumdoor'
          if (-not (Test-Path (Join-Path $local '.git'))) { throw 'C:\alumdoor is not a Git checkout.' }
          $origin = (git -C $local remote get-url origin).Trim()
          if ($LASTEXITCODE -ne 0 -or $origin -notmatch 'github\.com[:/]nguyentrieu210/forge(?:\.git)?$') { throw "Unexpected local repository origin: $origin" }
          $dirty = @(git -C $local status --porcelain=v1)
          if ($dirty.Count -gt 0) { $dirty | ForEach-Object { Write-Host "DIRTY $_" }; throw 'C:\alumdoor is dirty.' }
          $runDir = "C:\alumdoor\local-backups\purchase-imports\$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          "run_dir=$runDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ALUMDOOR_REAL_PURCHASE_LOCAL_GUARD_PASS run_dir=$runDir"

      - name: Reconcile canonical Item Gate A prerequisite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'C:\alumdoor\local-imports\alumdoor-item-source-records.json'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Gate A source records missing: $source" }
          Set-Location "$env:GITHUB_WORKSPACE\server"
          $payload = Join-Path '${{ steps.guard.outputs.run_dir }}' 'item-master-payload.json'
          $audit = Join-Path '${{ steps.guard.outputs.run_dir }}' 'item-master-audit.json'
          $preimage = Join-Path '${{ steps.guard.outputs.run_dir }}' 'item-preimage.json'
          & node scripts\build-alumdoor-item-master-payload.mjs $source $payload $audit
          if ($LASTEXITCODE -ne 0) { throw 'Gate A canonical Item payload blocked.' }
          $r = Get-Content -Raw $audit | ConvertFrom-Json
          if ([int]$r.item_master_blocker_count -ne 0 -or [int]$r.other_blocker_count -ne 0 -or [int]$r.item_payload_blocker_count -ne 0) { throw 'Gate A Item audit is not zero-blocker.' }
          & node scripts\import-alumdoor-item-master-local.mjs $payload $preimage
          if ($LASTEXITCODE -ne 0) { throw 'Gate A local Item reconciliation failed.' }
          Write-Host "ALUMDOOR_REAL_PURCHASE_GATE_A_PASS items=$($r.item_payload_count)"

      - name: Audit live authority before Supplier reconciliation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path '${{ steps.guard.outputs.run_dir }}' 'audit-before-suppliers.json'
          & node server/scripts/audit-alumdoor-real-purchase-local.mjs $report
          if ($LASTEXITCODE -ne 0) { throw 'Local purchase authority audit failed.' }

      - name: Reconcile exact Suppliers through canonical API
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path '${{ steps.guard.outputs.run_dir }}' 'audit-before-suppliers.json'
          & node server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs $report
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Supplier reconciliation failed.' }
          & node server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs $report
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Supplier reconciliation idempotency failed.' }

      - name: Build zero-blocker historical draft plan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path '${{ steps.guard.outputs.run_dir }}' 'audit-ready.json'
          & node server/scripts/audit-alumdoor-real-purchase-local.mjs $report
          if ($LASTEXITCODE -ne 0) { throw 'Post-Supplier authority audit failed.' }
          $sqlFile = Join-Path '${{ steps.guard.outputs.run_dir }}' 'purchase-receipts.sql'
          $expected = Join-Path '${{ steps.guard.outputs.run_dir }}' 'expected.json'
          & node server/scripts/import-alumdoor-real-purchase-local.mjs receipts-sql $report $sqlFile $expected
          if ($LASTEXITCODE -ne 0) { throw 'Historical Purchase Receipt plan is blocked.' }
          $e = Get-Content -Raw $expected | ConvertFrom-Json
          if ([int]$e.receipt_count -ne 6 -or [int]$e.line_count -ne 11) { throw "Expected 6 receipts/11 lines, got $($e.receipt_count)/$($e.line_count)" }
          Write-Host "ALUMDOOR_REAL_PURCHASE_PLAN_PASS receipts=$($e.receipt_count) lines=$($e.line_count) excluded=3"

      - name: Import drafts twice and prove idempotency
        id: import
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $server = 'C:\alumdoor\server'
          $runDir = '${{ steps.guard.outputs.run_dir }}'
          $sqlFile = Join-Path $runDir 'purchase-receipts.sql'
          $expectedFile = Join-Path $runDir 'expected.json'
          $expected = Get-Content -Raw $expectedFile | ConvertFrom-Json
          $expectedCount = [int]$expected.receipt_count
          $expectedLines = [int]$expected.line_count
          $verifyOut = Join-Path $runDir 'purchase-receipts-postverify.json'
          $stockBefore = Join-Path $runDir 'stock-before.json'
          $stockAfter = Join-Path $runDir 'stock-after.json'
          function D1Json([string]$query) {
            $raw = (& npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc --json --command $query | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "D1 query failed: $query" }
            return $raw.Trim()
          }
          function ReceiptCount() {
            $raw = D1Json "SELECT COUNT(*) AS records FROM documents WHERE tenant_id='demo' AND doctype='Purchase Receipt' AND json_extract(payload_json,'$._alumdoor_real_purchase.format')='alumdoor-real-purchase-history/v1';"
            $obj = $raw | ConvertFrom-Json
            return [int]$obj[0].results[0].records
          }
          & node "$server\scripts\stop-local-dev.mjs" --ports=8799,5173
          if ($LASTEXITCODE -ne 0) { throw 'Failed to stop local services before draft migration.' }
          & node "$server\scripts\backup-local-state.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to back up Wrangler state.' }
          Set-Location $server
          $stockQuery = "SELECT name,sql FROM sqlite_master WHERE type='table' AND (lower(name) LIKE '%stock%' OR lower(name) LIKE '%ledger%') ORDER BY name;"
          D1Json $stockQuery | Set-Content -Encoding utf8 $stockBefore
          $before = ReceiptCount
          & npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc "--file=$sqlFile"
          if ($LASTEXITCODE -ne 0) { throw 'First-pass draft migration failed.' }
          $afterFirst = ReceiptCount
          if ($afterFirst -ne $expectedCount) { throw "First pass expected $expectedCount drafts, got $afterFirst" }
          $createdFirst = $afterFirst - $before
          & npx wrangler d1 execute cloudforge-demo --local --config apps/tenant-worker/wrangler.jsonc "--file=$sqlFile"
          if ($LASTEXITCODE -ne 0) { throw 'Second-pass draft migration failed.' }
          $afterSecond = ReceiptCount
          $createdSecond = $afterSecond - $afterFirst
          if ($afterSecond -ne $expectedCount -or $createdSecond -ne 0) { throw "Idempotency failed: first=$afterFirst second=$afterSecond delta=$createdSecond" }
          $verifyQuery = "SELECT name,docstatus,json_extract(payload_json,'$._alumdoor_real_purchase.import_fingerprint') AS fingerprint,json_array_length(payload_json,'$.items') AS line_count FROM documents WHERE tenant_id='demo' AND doctype='Purchase Receipt' AND json_extract(payload_json,'$._alumdoor_real_purchase.format')='alumdoor-real-purchase-history/v1' ORDER BY name;"
          D1Json $verifyQuery | Set-Content -Encoding utf8 $verifyOut
          D1Json $stockQuery | Set-Content -Encoding utf8 $stockAfter
          if ((Get-Content -Raw $stockBefore).Trim() -ne (Get-Content -Raw $stockAfter).Trim()) { throw 'Stock/Ledger schema snapshot changed.' }
          & node "$env:GITHUB_WORKSPACE\server\scripts\import-alumdoor-real-purchase-local.mjs" verify $expectedFile $verifyOut
          if ($LASTEXITCODE -ne 0) { throw 'D1 post-verify failed.' }
          "created_first=$createdFirst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "created_second=$createdSecond" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "expected_count=$expectedCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ALUMDOOR_REAL_PURCHASE_D1_IMPORT_PASS created_first=$createdFirst created_second=$createdSecond receipts=$expectedCount lines=$expectedLines submit=forbidden"
          & cmd.exe /d /c "C:\alumdoor\sync-local.bat --bootstrap --skip-source-verify"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to restart local stack after draft migration.' }

      - name: Verify canonical API visibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $final = Join-Path '${{ steps.guard.outputs.run_dir }}' 'audit-final.json'
          & node server/scripts/audit-alumdoor-real-purchase-local.mjs $final
          if ($LASTEXITCODE -ne 0) { throw 'Final API audit failed.' }
          $r = Get-Content -Raw $final | ConvertFrom-Json
          $hist = @($r.purchase_receipts | Where-Object { $_.name -like 'PR-HIST-*' })
          $expectedCount = [int]'${{ steps.import.outputs.expected_count }}'
          if ($hist.Count -ne $expectedCount) { throw "API expected $expectedCount drafts, got $($hist.Count)" }
          if (@($hist | Where-Object { [int]$_.docstatus -ne 0 }).Count -ne 0) { throw 'Historical Purchase Receipt must remain draft.' }
          Write-Host "ALUMDOOR_REAL_PURCHASE_API_POSTVERIFY_PASS receipts=$($hist.Count) docstatus=0 created_second=${{ steps.import.outputs.created_second }}"

      - name: Recover local services after any failure
        if: always()
        shell: powershell
        run: |
          & node -e "fetch('http://127.0.0.1:8799/api/method/metaforge.api.get_boot',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit([200,401,403].includes(r.status)?0:1)).catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) {
            & cmd.exe /d /c "C:\alumdoor\sync-local.bat --bootstrap --skip-source-verify"
            if ($LASTEXITCODE -ne 0) { throw 'Failed final local runtime recovery.' }
          }
          Write-Host 'ALUMDOOR_REAL_PURCHASE_LOCAL_RECOVERY_FINAL_PASS'

      - name: Upload purchase import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alumdoor-real-purchase-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guard.outputs.run_dir }}
          if-no-files-found: warn
          retention-days: 14
