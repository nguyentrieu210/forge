name: Alumdoor Real Purchase Import Policy

on:
  pull_request:
    paths:
      - 'apps/alumdoor/docs/nguon/ms-lien/chi-tiết-nhập-hàng-ngày.md'
      - 'server/scripts/lib/alumdoor-real-purchase-*.mjs'
      - 'server/scripts/preflight-alumdoor-real-purchase-import.mjs'
      - 'server/scripts/audit-alumdoor-real-purchase-local.mjs'
      - 'server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs'
      - 'server/scripts/import-alumdoor-real-purchase-local.mjs'
      - 'server/scripts/verify-alumdoor-real-purchase-audit.mjs'
      - 'server/scripts/test-alumdoor-real-purchase-import.mjs'
      - 'scripts/local-runner/**'
      - '.github/workflows/alumdoor-real-purchase-import-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-local-d1-mutation
  cancel-in-progress: false

jobs:
  purchase-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check server/scripts/lib/alumdoor-real-purchase-source.mjs
          node --check server/scripts/lib/alumdoor-real-purchase-preflight.mjs
          node --check server/scripts/preflight-alumdoor-real-purchase-import.mjs
          node --check server/scripts/audit-alumdoor-real-purchase-local.mjs
          node --check server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs
          node --check server/scripts/import-alumdoor-real-purchase-local.mjs
          node --check server/scripts/verify-alumdoor-real-purchase-audit.mjs
          node --check scripts/local-runner/real-purchase-adapter.mjs
          node --check server/scripts/test-alumdoor-real-purchase-import.mjs
      - name: Lock source and historical draft contract
        run: node server/scripts/test-alumdoor-real-purchase-import.mjs
      - name: Lock fail-closed operational mode
        run: node server/scripts/preflight-alumdoor-real-purchase-import.mjs /tmp/alumdoor-real-purchase-preflight.json --expect-blocked
      - name: Reject child-script Wrangler bypass
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'npx[[:space:]]+wrangler|wrangler[[:space:]]+d1[[:space:]]+(execute|migrations)|execFileSync\([^\n]*wrangler' \
            server/scripts/audit-alumdoor-real-purchase-local.mjs \
            server/scripts/ensure-alumdoor-real-purchase-suppliers-local.mjs \
            server/scripts/import-alumdoor-real-purchase-local.mjs \
            server/scripts/verify-alumdoor-real-purchase-audit.mjs; then
            echo 'Real Purchase child scripts must not bypass the canonical runner Wrangler guard'
            exit 1
          fi

  purchase-local-import:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: purchase-preflight
    runs-on: [self-hosted]
    timeout-minutes: 45
    env:
      FORGE_LOCAL_EXPECTED_SHA: ${{ github.sha }}
      FORGE_ORIGIN: http://127.0.0.1:8799
      FORGE_ADMIN_USER: dev@example.com
      FORGE_ADMIN_PASSWORD: local-dev-password-1
    steps:
      - name: Run canonical Real Purchase local import contract
        shell: powershell
        working-directory: C:\alumdoor
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts\local-runner\run-local-import.mjs real-purchase
          if ($LASTEXITCODE -ne 0) { throw "Real Purchase canonical execution contract failed with exit code $LASTEXITCODE" }

      - name: Print execution evidence on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host '=== latest Real Purchase execution-layer evidence ==='
          $root = 'C:\alumdoor\local-backups\execution-layer\real-purchase'
          if (Test-Path $root) {
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 2 |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-ChildItem $_.FullName -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
              }
          }

      - name: Upload purchase import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alumdoor-real-purchase-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\alumdoor\local-backups\execution-layer\real-purchase
          if-no-files-found: warn
          retention-days: 14
