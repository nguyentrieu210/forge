name: Closure 02 Manufacturing Validation Temp

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - "docs/agents/transaction-closure/02-MANUFACTURING.md"
      - ".github/workflows/closure-02-manufacturing-validation-temp.yml"
      - ".github/workflows/closure-02-manufacturing-wire-temp.yml"

permissions:
  contents: write

concurrency:
  group: closure-02-manufacturing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manufacturing-critical:
    if: github.head_ref == 'rc/transaction-closure-02-manufacturing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: rc/transaction-closure-02-manufacturing
          fetch-depth: 0

      - name: Converge branch-owned MRP compile seams once
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              source = path.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f"{label} no longer matches audited source")
              path.write_text(source.replace(old, new, 1))

          tenant = Path("server/apps/tenant-worker/src/index.ts")
          replace_once(
              tenant,
              '''          listMaterialRequests: () => documents.listDocumentsByDoctype<JsonObject>(tenantId, "Material Request"),
          createCanonicalMaterialRequest: (document) => createDocumentThroughCore(request, env, "Material Request", document),''',
              '''          listMaterialRequests: () => documents.listDocumentsByDoctype<JsonObject>(tenantId, "Material Request"),
          getStockBalanceMicros: (itemCode, warehouse) => documents.getStockBalanceMicros(tenantId, itemCode, warehouse),
          createCanonicalMaterialRequest: (document) => createDocumentThroughCore(request, env, "Material Request", document),''',
              "tenant-worker MRP context",
          )

          bulk = Path("server/apps/tenant-worker/src/manufacturing-bom-bulk-api.ts")
          replace_once(
              bulk,
              '''  previewBulkBomDraft,
  type BulkBomDraftInput,
} from "../../../packages/clouderp-erpnext/src/index.js";''',
              '''  previewBulkBomDraft,
  type BomQuantityBasis,
  type BulkBomDraftInput,
} from "../../../packages/clouderp-erpnext/src/index.js";''',
              "bulk BOM import block",
          )
          replace_once(
              bulk,
              '''      ...(row.qty_basis !== undefined ? { qty_basis: scalar(row.qty_basis) as BulkBomDraftInput["rows"][number]["qty_basis"] } : {}),''',
              '''      ...(row.qty_basis !== undefined ? { qty_basis: scalar(row.qty_basis) as BomQuantityBasis } : {}),''',
              "bulk BOM qty_basis block",
          )

          mrp = Path("server/packages/clouderp-erpnext/src/manufacturing-mrp.ts")
          replace_once(
              mrp,
              '''    explodeBom({
      rootRowId: rowId,
      rootItemCode: itemCode,
      parentQtyMicros: qtyMicros,
      parentWarehouse: warehouse,
      scheduleDate,
      dimensions,
      selected,
      byItem,
      path: [itemCode],
      requirements,
      warnings,
      depth: 0,
    });''',
              '''    explodeBom({
      rootRowId: rowId,
      rootItemCode: itemCode,
      parentQtyMicros: qtyMicros,
      ...(warehouse ? { parentWarehouse: warehouse } : {}),
      ...(scheduleDate ? { scheduleDate } : {}),
      ...(dimensions ? { dimensions } : {}),
      selected,
      byItem,
      path: [itemCode],
      requirements,
      warnings,
      depth: 0,
    });''',
              "MRP root explode block",
          )
          replace_once(
              mrp,
              '''      explodeBom({
        ...input,
        parentQtyMicros: requiredMicros,
        parentWarehouse: warehouse,
        // A subassembly may have its own dimensional semantics. Inheriting the finished
        // product dimensions would be guesswork, so only fixed rows are allowed below root
        // until an explicit dimension mapping contract exists.
        dimensions: undefined,
        selected: childBoms[0]!,
        path: [...input.path, row.item_code],
        depth: input.depth + 1,
      });''',
              '''      const { parentWarehouse: _parentWarehouse, dimensions: _dimensions, ...childInput } = input;
      explodeBom({
        ...childInput,
        parentQtyMicros: requiredMicros,
        ...(warehouse ? { parentWarehouse: warehouse } : {}),
        // A subassembly may have its own dimensional semantics. Inheriting the finished
        // product dimensions would be guesswork, so only fixed rows are allowed below root
        // until an explicit dimension mapping contract exists.
        selected: childBoms[0]!,
        path: [...input.path, row.item_code],
        depth: input.depth + 1,
      });''',
              "MRP child explode block",
          )
          PY

          if [ -f .github/workflows/closure-02-manufacturing-wire-temp.yml ]; then
            git rm .github/workflows/closure-02-manufacturing-wire-temp.yml
          fi
          git add server/apps/tenant-worker/src/index.ts \
                  server/apps/tenant-worker/src/manufacturing-bom-bulk-api.ts \
                  server/packages/clouderp-erpnext/src/manufacturing-mrp.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(manufacturing): close MRP runtime wiring gaps"
            git push origin HEAD:rc/transaction-closure-02-manufacturing
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit server dist and observe full-build baseline
        continue-on-error: true
        run: pnpm --dir server exec tsc -p tsconfig.json

      - name: Closure-02 source typecheck
        run: >-
          pnpm --dir server exec tsc --noEmit
          --target ES2022
          --module NodeNext
          --moduleResolution NodeNext
          --lib ES2022,DOM,DOM.Iterable,WebWorker
          --strict
          --noUncheckedIndexedAccess
          --exactOptionalPropertyTypes
          --useUnknownInCatchVariables
          --skipLibCheck
          types/cloudflare-runtime.d.ts
          packages/clouderp-erpnext/src/manufacturing-costing-read.ts
          packages/clouderp-erpnext/src/manufacturing-mrp.ts
          packages/clouderp-erpnext/src/manufacturing-mrp-netting.ts

      - name: Worker typecheck baseline
        continue-on-error: true
        run: pnpm --dir server run typecheck:workers

      - name: Manufacturing closure regressions
        run: >-
          node --test
          server/tests/manufacturing-transaction-closure.test.mjs
          server/tests/manufacturing-costing-read.test.mjs
          server/tests/manufacturing-costing-api.test.mjs
          server/tests/alumdoor-manufacturing-lifecycle.test.mjs
          server/tests/manufacturing-issue-line-key.test.mjs
          server/tests/manufacturing-output-uom.test.mjs
          server/tests/manufacturing-genealogy.test.mjs
          server/tests/manufacturing-genealogy-api.test.mjs
          server/tests/manufacturing-mrp.test.mjs
          server/tests/manufacturing-mrp-api.test.mjs
          server/tests/manufacturing-mrp-netting.test.mjs
          server/tests/manufacturing-mrp-netting-api.test.mjs

      - name: Manufacturing metadata package gate
        run: pnpm --dir server run app:check
