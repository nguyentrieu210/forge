name: Closure 02 Manufacturing Validation Temp

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - "docs/agents/transaction-closure/02-MANUFACTURING.md"
      - ".github/workflows/closure-02-manufacturing-validation-temp.yml"

permissions:
  contents: read

concurrency:
  group: closure-02-manufacturing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manufacturing-critical:
    if: github.head_ref == 'rc/transaction-closure-02-manufacturing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit server dist and classify exact-main type debt
        run: |
          set +e
          pnpm --dir server exec tsc -p tsconfig.json 2>&1 | tee /tmp/closure02-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          echo "full_server_tsc_status=${status}"
          if grep -E 'packages/clouderp-erpnext/src/manufacturing-costing-read\.ts|packages/clouderp-erpnext/src/index\.ts|apps/tenant-worker/src/manufacturing-mrp-api\.ts' /tmp/closure02-tsc.log; then
            echo "Closure-02 changed Manufacturing source has TypeScript errors"
            exit 1
          fi
          test -f server/dist/packages/clouderp-erpnext/src/manufacturing-costing-read.js
          test -f server/dist/packages/clouderp-erpnext/src/manufacturing-mrp-netting.js
          test -f server/dist/apps/tenant-worker/src/manufacturing-mrp-api.js

      - name: Manufacturing closure regressions
        run: >-
          node --test
          server/tests/manufacturing-transaction-closure.test.mjs
          server/tests/manufacturing-costing-read.test.mjs
          server/tests/manufacturing-costing-api.test.mjs
          server/tests/alumdoor-manufacturing-lifecycle.test.mjs
          server/tests/manufacturing-issue-line-key.test.mjs
          server/tests/manufacturing-output-uom.test.mjs
          server/tests/manufacturing-genealogy.test.mjs
          server/tests/manufacturing-genealogy-api.test.mjs
          server/tests/manufacturing-mrp.test.mjs
          server/tests/manufacturing-mrp-api.test.mjs
          server/tests/manufacturing-mrp-netting.test.mjs
          server/tests/manufacturing-mrp-netting-api.test.mjs

      - name: Manufacturing-QMS package gate
        run: node server/scripts/pack-app.mjs server/apps-src/manufacturing-qms --check
