name: UI REC 05 Convergence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-rec-05-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconciliation:
    if: startsWith(github.head_ref, 'agent/ui-rec-05-qa-gates-') || github.head_ref == 'program/backend-ui-reconciliation-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CloudForge contracts
        working-directory: server
        run: pnpm run build

      - name: Verify bootstrap candidate contract and diff hygiene
        working-directory: server
        env:
          UI_REC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          UI_REC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-ui-reconciliation-candidate.mjs --mode=bootstrap --check-diff

      - name: Baseline canonical metadata gates
        working-directory: server
        run: |
          node scripts/verify-first-party-meta.mjs
          node scripts/verify-alumdoor-meta-completeness.mjs
          node --test \
            tests/app-source-meta-contract.test.mjs \
            tests/g03-generic-runtime-contract.test.mjs

      - name: Assert converged worker and Grid inputs
        if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
        working-directory: server
        env:
          UI_REC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          UI_REC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-ui-reconciliation-candidate.mjs --mode=converged --check-diff

      - name: Backend metadata truth and preview projection gates
        if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
        working-directory: server
        run: |
          node scripts/verify-backend-ui-contracts.mjs
          node --test \
            tests/backend-ui-contract-validator.test.mjs \
            tests/backend-ui-reconciliation.test.mjs

      - name: Navigation and form projection gates
        if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
        working-directory: server
        run: |
          node --test \
            tests/alumdoor-ui-rec-02-navigation.test.mjs \
            tests/alumdoor-attendance-form-projection.test.mjs
          node scripts/build-alumdoor-ui-rec-02-sidebar.mjs /tmp/ui-rec-05-sidebar.json

      - name: Shared Grid parity evidence
        if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
        run: node --test client/packages/views/tests/grid-parity-convergence.test.mjs

      - name: MetaForge runtime typecheck and bundle
        if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
        working-directory: client
        run: |
          pnpm --filter runtime typecheck
          pnpm --dir apps/runtime exec vite build

      - name: Install Chromium for representative browser lanes
        if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
        working-directory: client/e2e-forge
        run: pnpm exec playwright install --with-deps chromium

      - name: Procurement browser lane — desktop and mobile
        if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
        working-directory: client/e2e-forge
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --config playwright.purchase.config.ts 2>&1 | tee /tmp/ui-rec-05-purchase-browser.log

      - name: Attendance browser lane — desktop and mobile
        if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
        working-directory: client/e2e-forge
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --config playwright.attendance.config.ts 2>&1 | tee /tmp/ui-rec-05-attendance-browser.log

      - name: Upload browser diagnostics
        if: failure() && github.head_ref == 'program/backend-ui-reconciliation-20260811'
        uses: actions/upload-artifact@v4
        with:
          name: ui-rec-05-browser-diagnostics
          path: |
            /tmp/ui-rec-05-purchase-browser.log
            /tmp/ui-rec-05-attendance-browser.log
            client/e2e-forge/test-results
            client/e2e-forge/playwright-report
          if-no-files-found: ignore

      - name: Emit exact-candidate marker
        shell: bash
        run: |
          echo "UI_REC_05_SHA=${{ github.event.pull_request.head.sha }}"
          if [ "${{ github.head_ref }}" = "program/backend-ui-reconciliation-20260811" ]; then
            echo "UI REC 05 CONVERGENCE STATIC/PROCUREMENT/ATTENDANCE: PASS"
          else
            echo "UI REC 05 BOOTSTRAP: PASS"
          fi
