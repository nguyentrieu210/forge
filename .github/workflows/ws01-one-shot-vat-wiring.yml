name: WS01 one-shot VAT wiring

on:
  push:
    branches:
      - agent/ent-01-finance-vn
    paths:
      - .github/workflows/ws01-one-shot-vat-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ent-01-finance-vn
          fetch-depth: 0
      - name: Wire VAT metadata and dispatch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tax_path = Path('server/apps-src/vn-accounting/doctypes/vn-tax-ruleset.json')
          tax = json.loads(tax_path.read_text())
          if not any(f.get('fieldname') == 'tax_accounts_json' for f in tax['fields']):
              field = {
                  'fieldname': 'tax_accounts_json',
                  'label': 'VAT Account Mapping',
                  'fieldtype': 'Code',
                  'description': 'For VAT rulesets: {"input_vat":["..."],"output_vat":["..."]}',
                  'default': '{}',
              }
              idx = next((i for i, f in enumerate(tax['fields']) if f.get('fieldname') == 'workflow_state'), len(tax['fields']))
              tax['fields'].insert(idx, field)
          tax['revision'] = max(int(tax.get('revision', 0)), 4)
          tax_path.write_text(json.dumps(tax, ensure_ascii=False, indent=2) + '\n')

          app_path = Path('server/apps-src/vn-accounting/app.json')
          app = json.loads(app_path.read_text())
          app['version'] = '1.6.0'
          if not any(a.get('name') == 'vat-dataset' for a in app.get('actions', [])):
              app.setdefault('actions', []).append({
                  'name': 'vat-dataset',
                  'label': 'Dữ liệu VAT',
                  'icon': 'table-properties',
                  'group': 'Thuế & tuân thủ',
                  'description': 'Đối chiếu VAT đầu vào/đầu ra từ hóa đơn đã ghi nhận. Chỉ đọc; không tạo sổ thuế hay nộp tờ khai.',
                  'fields': [
                      {'fieldname': 'ruleset', 'label': 'Ruleset VAT', 'fieldtype': 'Link', 'options': 'VN Tax Ruleset', 'required': True},
                      {'fieldname': 'from_date', 'label': 'Từ ngày', 'fieldtype': 'Date', 'required': True},
                      {'fieldname': 'to_date', 'label': 'Đến ngày', 'fieldtype': 'Date', 'required': True},
                      {'fieldname': 'limit_per_type', 'label': 'Giới hạn mỗi loại hóa đơn', 'fieldtype': 'Int', 'default': 100},
                  ],
                  'commit': {'method': 'vn-accounting.vat.dataset', 'label': 'Lập dữ liệu'},
                  'permission_doctype': 'VN Tax Ruleset',
                  'permission_action': 'read',
              })
          if not any(n.get('key') == 'vat-dataset' for n in app.get('nav', [])):
              nav = {
                  'key': 'vat-dataset', 'label': 'Dữ liệu VAT', 'kind': 'route', 'route': '/x/action:vat-dataset',
                  'icon': 'table-properties', 'group': 'Thuế & tuân thủ',
                  'required_roles': ['Tax Specialist', 'Chief Accountant', 'Accounts Manager', 'Internal Auditor', 'System Manager'],
              }
              idx = next((i + 1 for i, n in enumerate(app['nav']) if n.get('key') == 'tax-evaluate'), len(app['nav']))
              app['nav'].insert(idx, nav)
          app_path.write_text(json.dumps(app, ensure_ascii=False, indent=2) + '\n')

          index_path = Path('server/apps-src/vn-accounting-worker/src/index.ts')
          text = index_path.read_text()
          import_anchor = '} from "./bank-match.js";'
          import_line = 'import { handleVatMethod } from "./vat-service.js";'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('bank-match import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)
          route_anchor = 'if (method === "vn-accounting.bank.match_candidates") return bankMatchMethod(request, env, body.args ?? {});'
          route_line = 'const vatResponse = await handleVatMethod(method, request, env, body.args ?? {});\n      if (vatResponse) return vatResponse;'
          if route_line not in text:
              if route_anchor not in text:
                  raise SystemExit('bank-match route anchor not found')
              text = text.replace(route_anchor, route_anchor + '\n      ' + route_line, 1)
          index_path.write_text(text)
          PY
          git rm .github/workflows/ws01-one-shot-vat-wiring.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/apps-src/vn-accounting/app.json server/apps-src/vn-accounting/doctypes/vn-tax-ruleset.json server/apps-src/vn-accounting-worker/src/index.ts
          git commit -m "feat(ws01): wire VAT dataset operations"
          git pull --rebase origin agent/ent-01-finance-vn
          git push origin HEAD:agent/ent-01-finance-vn
