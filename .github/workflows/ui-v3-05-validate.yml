name: UI V3-05 Validate

on:
  push:
    branches:
      - ui/v3-05-charts-command-center

permissions:
  contents: write

concurrency:
  group: ui-v3-05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(ui-v3): refresh generated lockfiles') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            client/pnpm-lock.yaml

      - name: Resolve root workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Resolve client workspace lockfile
        run: pnpm --dir client install --no-frozen-lockfile

      - name: Test Forge charts model
        run: pnpm --filter @metaforge/charts run test

      - name: Typecheck command visual primitives
        run: pnpm --filter @metaforge/visual run typecheck

      - name: Typecheck shared views
        run: pnpm --filter @metaforge/views run typecheck

      - name: Run frontend structural lint
        run: pnpm --dir client run lint

      - name: Build runtime dependency graph
        run: pnpm --filter runtime... run build

      - name: Record green evidence and generated locks
        shell: bash
        run: |
          set -euo pipefail
          cat > client/docs/ui-v3-05-validation.md <<EOF
          # UI V3-05 validation evidence

          Validation source SHA: \`${GITHUB_SHA}\`
          Runner: GitHub Actions / Node 22 / pnpm 9.15.0

          Passed on the exact checked-out branch head before this evidence commit:

          - root workspace dependency resolution;
          - client workspace dependency resolution;
          - \`@metaforge/charts\` typecheck/build + chart-model tests;
          - \`@metaforge/visual\` typecheck;
          - \`@metaforge/views\` typecheck;
          - frontend structural lint;
          - \`runtime...\` dependency-graph build including Vite production bundle.

          This lane mutates no backend/schema/business data and performs no production deploy.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml client/pnpm-lock.yaml client/docs/ui-v3-05-validation.md
          if git diff --cached --quiet; then
            echo "No generated lock/evidence changes."
            exit 0
          fi
          git commit -m "chore(ui-v3): refresh generated lockfiles and validation evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
