name: Temporary Alumdoor BOM Actual Guidance
on:
  push:
    branches: ['agent/alumdoor-bom-actual-guidance']
    paths: ['.github/workflows/_tmp-alumdoor-bom-actual-guidance.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - name: Wire read-only BOM actual requirement preview
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const materializerPath = 'server/apps-src/alumdoor-worker/src/bom-template-materializer.ts';
          let materializer = fs.readFileSync(materializerPath, 'utf8');
          materializer = materializer.replace(
            'import { mergeBomActualComponents, type BomActualComponentInput } from "./bom-actual-components.js";',
            'import {\n  inspectBomActualComponents,\n  mergeBomActualComponents,\n  type BomActualComponentInput,\n  type BomActualRequirement,\n} from "./bom-actual-components.js";'
          );
          if (!materializer.includes('export interface BomPreviewResult')) {
            const anchor = `export interface BomMaterializationResult {\n  bom_no: string;\n  bom_template: string;\n  bom_template_code: string;\n  bom_fingerprint: string;\n  materialized: boolean;\n  components: ResolvedBomTemplate["components"];\n}\n`;
            if (!materializer.includes(anchor)) throw new Error('materializer result interface anchor missing');
            const extra = `${anchor}\nexport interface BomPreviewResult extends BomMaterializationResult {\n  actual_requirements: BomActualRequirement[];\n  missing_actual_component_keys: string[];\n  actual_complete: boolean;\n}\n`;
            materializer = materializer.replace(anchor, extra);
          }
          if (!materializer.includes('export async function previewProductionLineBom(')) {
            const anchor = 'export async function resolveProductionLineBom(\n';
            const index = materializer.indexOf(anchor);
            if (index < 0) throw new Error('resolveProductionLineBom anchor missing');
            const fn = `export async function previewProductionLineBom(\n  call: BomMaterializerCall,\n  input: { line: BomProductionLineInput; company: string },\n): Promise<BomPreviewResult> {\n  const templates = await loadTemplates(call);\n  if (!templates.length) {\n    throw new Error(\`${'${input.line.item_code}'}: chưa có BOM tĩnh và chưa cấu hình BOM Template.\`);\n  }\n  const { context, values } = bomContextFromProductionLine(input.line);\n  const resolved = resolveBomTemplate({ templates, context, values });\n  if (resolved.item_code !== input.line.item_code) {\n    throw new Error(\`${'${resolved.template_code}'}: thành phẩm ${'${resolved.item_code}'} không khớp dòng bán ${'${input.line.item_code}'}.\`);\n  }\n  const source = templates.find((template) => template.template_code === resolved.template_code);\n  if (!source) throw new Error(\`${'${resolved.template_code}'}: không xác định được BOM Template nguồn.\`);\n  const inspection = inspectBomActualComponents({\n    template_code: resolved.template_code,\n    actual_components: input.line.bom_actual_components,\n    required_actual_component_keys: source.required_actual_component_keys,\n    allowed_item_codes_by_key: source.actual_component_allowed_items,\n  });\n  if (!inspection.complete) {\n    return {\n      bom_no: "",\n      bom_template: source.source_name,\n      bom_template_code: resolved.template_code,\n      bom_fingerprint: "",\n      materialized: false,\n      components: resolved.components,\n      actual_requirements: inspection.requirements,\n      missing_actual_component_keys: inspection.missing_component_keys,\n      actual_complete: false,\n    };\n  }\n  const resolvedWithActuals = mergeBomActualComponents({\n    resolved,\n    actual_components: inspection.actual_components,\n    required_actual_component_keys: source.required_actual_component_keys,\n    allowed_item_codes_by_key: source.actual_component_allowed_items,\n  });\n  const fingerprint = bomFingerprint({\n    company: input.company,\n    source_warehouse: input.line.source_warehouse,\n    output_qty: input.line.output_qty,\n    resolved: resolvedWithActuals,\n  });\n  const prior = await existingGeneratedBom(call, fingerprint);\n  return {\n    bom_no: prior,\n    bom_template: source.source_name,\n    bom_template_code: resolved.template_code,\n    bom_fingerprint: fingerprint,\n    materialized: false,\n    components: resolvedWithActuals.components,\n    actual_requirements: inspection.requirements,\n    missing_actual_component_keys: [],\n    actual_complete: true,\n  };\n}\n\n`;
            materializer = materializer.slice(0, index) + fn + materializer.slice(index);
          }
          fs.writeFileSync(materializerPath, materializer, 'utf8');

          const salesPath = 'server/apps-src/alumdoor-worker/src/sales-production-core.ts';
          let sales = fs.readFileSync(salesPath, 'utf8');
          sales = sales.replace(
            'import { resolveProductionLineBom } from "./bom-template-materializer.js";',
            'import { previewProductionLineBom, resolveProductionLineBom } from "./bom-template-materializer.js";'
          );
          sales = sales.replace(
            'import { normalizeBomActualComponents, type BomActualComponentInput } from "./bom-actual-components.js";',
            'import {\n  normalizeBomActualComponents,\n  type BomActualComponentInput,\n  type BomActualRequirement,\n} from "./bom-actual-components.js";'
          );
          if (!sales.includes('bom_actual_requirements?: BomActualRequirement[];')) {
            sales = sales.replace(
              '  bom_actual_components?: BomActualComponentInput[];\n  output_qty: number;',
              '  bom_actual_components?: BomActualComponentInput[];\n'
                + '  bom_actual_requirements?: BomActualRequirement[];\n'
                + '  missing_actual_component_keys?: string[];\n'
                + '  bom_actual_complete?: 0 | 1;\n'
                + '  output_qty: number;'
            );
          }
          const oldResolve = '    const resolved = await resolveProductionLineBom(call, { line, company, materialize });\n'
            + '    if (materialize && !resolved.bom_no) throw new Error(`${line.item_code}: resolver không trả về BOM đã ghi sổ.`);\n'
            + '    output.push({\n'
            + '      ...line,\n'
            + '      bom_no: resolved.bom_no,\n'
            + '      bom_template: resolved.bom_template,\n'
            + '      bom_template_code: resolved.bom_template_code,\n'
            + '      bom_fingerprint: resolved.bom_fingerprint,\n'
            + '      bom_materialization_required: resolved.bom_no ? 0 : 1,\n'
            + '    });';
          const newResolve = '    const resolved = materialize\n'
            + '      ? await resolveProductionLineBom(call, { line, company, materialize: true })\n'
            + '      : await previewProductionLineBom(call, { line, company });\n'
            + '    if (materialize && !resolved.bom_no) throw new Error(`${line.item_code}: resolver không trả về BOM đã ghi sổ.`);\n'
            + '    const preview = "actual_requirements" in resolved ? resolved : null;\n'
            + '    output.push({\n'
            + '      ...line,\n'
            + '      bom_no: resolved.bom_no,\n'
            + '      bom_template: resolved.bom_template,\n'
            + '      bom_template_code: resolved.bom_template_code,\n'
            + '      bom_fingerprint: resolved.bom_fingerprint,\n'
            + '      bom_materialization_required: resolved.bom_no ? 0 : 1,\n'
            + '      ...(preview ? {\n'
            + '        bom_actual_requirements: preview.actual_requirements,\n'
            + '        missing_actual_component_keys: preview.missing_actual_component_keys,\n'
            + '        bom_actual_complete: preview.actual_complete ? 1 : 0,\n'
            + '      } : {}),\n'
            + '    });';
          if (!sales.includes(newResolve)) {
            if (!sales.includes(oldResolve)) throw new Error('resolveMissingLineBoms body anchor missing');
            sales = sales.replace(oldResolve, newResolve);
          }
          const oldWarnings = '    const warnings = [...new Set(items.map((line) => line.schedule_warning).filter((value): value is string => Boolean(value)))];';
          const newWarnings = '    const warnings = [...new Set([\n'
            + '      ...items.map((line) => line.schedule_warning).filter((value): value is string => Boolean(value)),\n'
            + '      ...items.filter((line) => line.bom_actual_complete === 0).map((line) =>\n'
            + '        `${line.item_code} · bộ ${line.set_no}: thiếu vật tư BOM thực tế ${line.missing_actual_component_keys?.join(", ") || "chưa xác định"}.`),\n'
            + '    ])];';
          if (!sales.includes(newWarnings)) {
            if (!sales.includes(oldWarnings)) throw new Error('preview warnings anchor missing');
            sales = sales.replace(oldWarnings, newWarnings);
          }
          fs.writeFileSync(salesPath, sales, 'utf8');
          NODE
      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Build server
        working-directory: server
        run: pnpm run build
      - name: Run actual guidance and BOM regression tests
        working-directory: server
        run: |
          node --test tests/alumdoor-bom-actual-guidance.test.mjs
          node --test tests/alumdoor-bom-template-core.test.mjs
          node --test tests/alumdoor-bom-template-materializer.test.mjs
          node --test tests/alumdoor-bom-actual-components.test.mjs
          node --test tests/alumdoor-bom-actual-materializer.test.mjs
          node --test tests/alumdoor-bom-source-catalog.test.mjs
          node --test tests/alumdoor-cutting-policy-geometry.test.mjs
      - name: Validate Alumdoor brief remains deployable
        working-directory: server
        run: node scripts/forge-app.mjs briefs/alumdoor-v2.json --dry-run
      - name: Commit validated preview guidance and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-alumdoor-bom-actual-guidance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/apps-src/alumdoor-worker/src/bom-actual-components.ts \
            server/apps-src/alumdoor-worker/src/bom-template-materializer.ts \
            server/apps-src/alumdoor-worker/src/sales-production-core.ts \
            server/tests/alumdoor-bom-actual-guidance.test.mjs \
            .github/workflows/_tmp-alumdoor-bom-actual-guidance.yml
          git commit -m 'feat(alumdoor): expose actual BOM requirements in preview'
          git push origin HEAD:agent/alumdoor-bom-actual-guidance
