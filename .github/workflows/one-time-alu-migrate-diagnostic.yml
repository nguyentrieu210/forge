name: One-time ALU Migration Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-alu-migrate-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: production-alu-migrate-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      TENANT: alu
      TARGET_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter cloudforge run build
      - name: Backup before diagnostic migration
        id: backup
        run: node server/scripts/backup-tenant.mjs --tenant "$TENANT" --execute --output-dir "$RUNNER_TEMP/alu-before-migrate-diagnostic"
      - name: Inspect migration plan
        id: plan
        shell: bash
        run: |
          set -o pipefail
          node server/scripts/migrate-tenant.mjs --tenant "$TENANT" 2>&1 | tee "$RUNNER_TEMP/migrate-plan.log"
      - name: Execute migration with captured log
        id: migrate
        shell: bash
        run: |
          set -o pipefail
          node server/scripts/migrate-tenant.mjs --tenant "$TENANT" --execute --confirm "$TENANT" 2>&1 | tee "$RUNNER_TEMP/migrate-execute.log"
      - name: Record migration diagnostic
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ env.TARGET_SHA }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          PLAN_LOG: ${{ runner.temp }}/migrate-plan.log
          MIGRATE_LOG: ${{ runner.temp }}/migrate-execute.log
        with:
          script: |
            const fs = require('fs');
            const tail = (p) => { try { return fs.readFileSync(p, 'utf8').split(/\r?\n/).slice(-120).join('\n'); } catch { return null; } };
            const payload = {
              sha: process.env.DEPLOYED_SHA,
              tenant: 'alu',
              backup: process.env.BACKUP_OUTCOME,
              plan: process.env.PLAN_OUTCOME,
              migrate: process.env.MIGRATE_OUTCOME,
              planLogTail: tail(process.env.PLAN_LOG),
              migrateLogTail: tail(process.env.MIGRATE_LOG),
              recordedAt: new Date().toISOString(),
            };
            const path = 'deploy-evidence/alu-migrate-diagnostic.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `ops: record ALU migrate diagnostic ${process.env.DEPLOYED_SHA.slice(0,12)}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {}),
            });
