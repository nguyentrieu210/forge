name: Issue 942 Schema Probe
on:
  push:
    branches: [agent/alumdoor-v2-reproducible]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate customFields schema
        run: |
          grep -R '"customFields"' -n . --exclude-dir=node_modules --exclude='alumdoor*.json' | head -80 || true
          grep -R '"after"' -n server --include='*.json' --include='*.mjs' | grep -E 'schema|brief|custom' | head -80 || true
