name: ALU Cutting Policy Sync One-Shot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: production-alu-cutting-policy-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Backup and sync Alumdoor Cutting Policy fixtures
    if: github.event.issue.number == 757 && github.event.comment.body == '/sync-cutting-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      BACKUP_DIR: ${{ runner.temp }}/alu-cutting-policy-backup
      REPORT_PATH: ${{ runner.temp }}/alu-cutting-policy-sync.json

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate formula engine and sync script
        shell: bash
        run: |
          set -euo pipefail
          node --check server/scripts/sync-alumdoor-cutting-policies.mjs
          node --test server/tests/door-formulas.test.mjs

      - name: Backup production tenant before master-data write
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/backup-tenant.mjs --tenant alu --execute --output-dir "$BACKUP_DIR"

      - name: Sync canonical Cutting Policy fixtures
        shell: bash
        run: |
          set -euo pipefail
          node server/scripts/sync-alumdoor-cutting-policies.mjs \
            --tenant alu \
            --execute \
            --output "$REPORT_PATH"
          test "$(jq -r '.pass' "$REPORT_PATH")" = "true"
          test "$(jq '[.verification[] | select(.logical_disabled == false and .pass == true)] | length' "$REPORT_PATH")" -eq 5
          test "$(jq '[.verification[] | select(.logical_disabled == true and .pass == true)] | length' "$REPORT_PATH")" -eq 2

      - name: Persist production evidence in repository
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          backup_manifest="$(find "$BACKUP_DIR" -maxdepth 1 -name '*.sql.json' -print -quit)"
          test -n "$backup_manifest"
          backup_sha="$(jq -r '.sha256' "$backup_manifest")"
          evidence="$RUNNER_TEMP/alumdoor-cutting-policy-durable-evidence.json"
          jq \
            --arg source_sha "$SOURCE_SHA" \
            --arg backup_sha256 "$backup_sha" \
            --arg workflow "ALU Cutting Policy Sync One-Shot" \
            '. + {source_sha:$source_sha, backup_sha256:$backup_sha256, workflow:$workflow, production_write_authorized:true}' \
            "$REPORT_PATH" > "$evidence"
          short_sha="${SOURCE_SHA:0:12}"
          target="deploy-evidence/alumdoor-cutting-policy-sync-${short_sha}.json"
          encoded="$(base64 -w0 "$evidence")"
          gh api --method PUT "repos/${REPOSITORY}/contents/${target}" \
            -f message="evidence(alumdoor): record Cutting Policy production sync" \
            -f content="$encoded" \
            -f branch=main

      - name: Upload backup and sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alu-cutting-policy-sync-${{ steps.source.outputs.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.BACKUP_DIR }}
            ${{ env.REPORT_PATH }}

      - name: Record result on PR 757
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          backup_manifest="$(find "$BACKUP_DIR" -maxdepth 1 -name '*.sql.json' -print -quit 2>/dev/null || true)"
          backup_sha="n/a"
          if [ -n "$backup_manifest" ] && [ -f "$backup_manifest" ]; then
            backup_sha="$(jq -r '.sha256 // "n/a"' "$backup_manifest")"
          fi
          active="n/a"
          legacy="n/a"
          if [ -f "$REPORT_PATH" ]; then
            active="$(jq '[.verification[] | select(.logical_disabled == false and .pass == true)] | length' "$REPORT_PATH")/5"
            legacy="$(jq '[.verification[] | select(.logical_disabled == true and .pass == true)] | length' "$REPORT_PATH")/2"
          fi
          body=$(cat <<EOF
          Alumdoor Cutting Policy production sync: **${JOB_STATUS}**

          - Source SHA: \`${SOURCE_SHA}\`
          - Backup SHA-256: \`${backup_sha}\`
          - Active standard policies verified: **${active}**
          - Legacy disabled policies verified: **${legacy}**
          - Scope: only \`master_records(tenant_id='alu', record_type='Cutting Policy')\` for canonical fixtures from \`server/briefs/alumdoor-v2.json\`.
          EOF
          )
          gh api "repos/${REPOSITORY}/issues/757/comments" -f body="$body"
