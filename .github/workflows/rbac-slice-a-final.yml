name: Finalize RBAC Slice A

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/rbac-permission-completion-20260731

permissions:
  contents: write

concurrency:
  group: rbac-slice-a-final-contract
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    if: github.event.pull_request.head.ref == 'feat/rbac-permission-slice-a-contract-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rbac-permission-slice-a-contract-20260731
          fetch-depth: 0

      - name: Gate one-shot execution
        id: gate
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore(rbac): run final slice A gate" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply reviewed patch and harness corrections
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/rbac-slice-a-apply.yml').read_text(encoding='utf-8')
          start = "      - name: Apply reviewed Slice A patch\n        shell: bash\n        run: |\n"
          end = "\n      - name: Install dependencies\n"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('one-shot patch markers are missing or ambiguous')
          block = source.split(start, 1)[1].split(end, 1)[0]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-rbac-slice-a.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-rbac-slice-a.sh
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              value = path.read_text(encoding='utf-8')
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              path.write_text(value.replace(old, new, 1), encoding='utf-8')

          router = Path('server/packages/frappe-api/src/router.ts')
          replace_once(
              router,
              '    requestedUser: args.text("user"),',
              '    ...(args.text("user") ? { requestedUser: args.text("user")! } : {}),',
          )

          test_path = Path('server/tests/rbac-contract.test.mjs')
          replace_once(
              test_path,
              'async function callMethod(method, params, context) {',
              'async function callMethod(method, params, context, httpMethod = "GET") {',
          )
          replace_once(
              test_path,
              '  const response = await routeFrappeApi(new Request(url), url, context);',
              '  const response = await routeFrappeApi(new Request(url, { method: httpMethod }), url, context);',
          )
          replace_once(
              test_path,
              '''  const added = await callMethod("metaforge.api.add_user_permission", {
    user: USER.user_id,
    allow: "Warehouse",
    for_value: "KHO-1",
  }, fixture.context);''',
              '''  const added = await callMethod("metaforge.api.add_user_permission", {
    user: USER.user_id,
    allow: "Warehouse",
    for_value: "KHO-1",
  }, fixture.context, "POST");''',
          )
          replace_once(
              test_path,
              '  const removed = await callMethod("metaforge.api.remove_user_permission", { id }, fixture.context);',
              '  const removed = await callMethod("metaforge.api.remove_user_permission", { id }, fixture.context, "POST");',
          )

          index_path = Path('server/packages/frappe-api/src/index.ts')
          index_value = index_path.read_text(encoding='utf-8')
          for obsolete in (
              'export { routeFrappeApi } from "./router-rbac-public.js";\n',
              'export { parseUserPermissionIdentity } from "./router-rbac-public.js";\n',
          ):
              index_value = index_value.replace(obsolete, '')
          index_path.write_text(index_value, encoding='utf-8')

          for obsolete in (
              Path('server/packages/frappe-api/src/router-rbac.ts'),
              Path('server/packages/frappe-api/src/router-rbac-public.ts'),
              Path('server/tests/rbac-router.test.mjs'),
              Path('server/tests/rbac-remove-id.test.mjs'),
          ):
              if obsolete.exists():
                  obsolete.unlink()
          PY

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Server tests
        if: steps.gate.outputs.run == 'true'
        run: pnpm run server:test

      - name: Typecheck
        if: steps.gate.outputs.run == 'true'
        run: pnpm run typecheck

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: pnpm run build

      - name: Commit verified implementation
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "Forge RBAC CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A server/packages/frappe-api/src/access-control.ts \
                     server/packages/frappe-api/src/router.ts \
                     server/packages/frappe-api/src/index.ts \
                     server/packages/frappe-api/src/router-rbac.ts \
                     server/packages/frappe-api/src/router-rbac-public.ts \
                     server/tests/rbac-contract.test.mjs \
                     server/tests/rbac-router.test.mjs \
                     server/tests/rbac-remove-id.test.mjs \
                     client/packages/adapter-frappe/src/adapter.ts \
                     client/packages/adapter-frappe/src/frappe-adapter.ts \
                     client/packages/views/src/access/PermissionCenter.tsx
          git commit -m "feat(rbac): complete permission inspection contract"
          git push origin HEAD:feat/rbac-permission-slice-a-contract-20260731
