name: Temp Probe ALU Mobile Sales

on:
  push:
    branches:
      - ops/probe-alu-mobile-sales-20260803
    paths:
      - ".github/workflows/tmp-probe-alu-mobile-sales.yml"

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 3cd2b472068838d0b2b65aa098bbd0bc1a9a8830
        run: |
          set -euo pipefail
          state=failure
          description="production release does not contain expected SHA"
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://alu.kairo.vn/release.json?probe=${GITHUB_RUN_ID}-${i}" || true)
            if printf '%s' "$body" | grep -Fq "$EXPECTED_SHA"; then
              state=success
              description="ALU production serves expected mobile sales SHA"
              break
            fi
            sleep 10
          done
          payload=$(jq -nc --arg state "$state" --arg context "alu-mobile-sales-production" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" -d "$payload" >/dev/null
          [ "$state" = success ]
