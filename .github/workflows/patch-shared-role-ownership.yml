name: Patch shared role ownership

on:
  push:
    branches:
      - fix/shared-role-ownership-20260803
    paths:
      - .github/workflows/patch-shared-role-ownership.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-role-ownership-20260803
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Remove roles from exclusive app ownership
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/packages/app-registry/src/installer.ts')
          s = p.read_text()
          old = '    for (const role of manifest.roles) owned.push(["Role", "", role.role]);\n'
          new = '''    // Roles are shared grants, not exclusive app-owned objects. Multiple apps may\n    // declare the same role so it exists for their DocPerm/nav rules, and uninstall\n    // deliberately leaves roles in place because other apps/users may still rely on them.\n    // Treating them as exclusive ownership contradicts that lifecycle and makes valid\n    // cross-app roles (Accounts User, Payroll Manager, Thủ kho...) impossible to install.\n'''
          if old not in s:
              raise SystemExit('role ownership line not found')
          p.write_text(s.replace(old, new, 1))
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter cloudforge run build
      - run: node server/scripts/forge-app.mjs server/apps-src/hrm --dry-run
      - run: node server/scripts/forge-app.mjs server/apps-src/vn-accounting --dry-run
      - run: node server/scripts/forge-app.mjs server/briefs/alumdoor-v2.json --dry-run
      - name: Verify ownership rule
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'for (const role of manifest.roles) owned.push' server/packages/app-registry/src/installer.ts
          grep -q 'Roles are shared grants, not exclusive app-owned objects' server/packages/app-registry/src/installer.ts
      - name: Commit validated platform fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/packages/app-registry/src/installer.ts
          git commit -m 'fix(app-registry): treat roles as shared grants'
          git push origin HEAD:fix/shared-role-ownership-20260803
