name: Apply reviewed sales MVP patch

on:
  push:
    branches:
      - feat/sales-complete-20260731
    paths:
      - tools/forge-sales-patch/**
      - .github/workflows/apply-sales-mvp.yml

permissions:
  contents: write

concurrency:
  group: apply-sales-mvp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ !startsWith(github.event.head_commit.message, 'feat(sales): apply multi-UOM') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sales-complete-20260731
          fetch-depth: 0

      - name: Reconstruct reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/forge-sales-patch/patch.b64.* | base64 --decode --ignore-garbage > /tmp/apply-sales-mvp.mjs
          node --check /tmp/apply-sales-mvp.mjs

      - name: Apply reviewed patch
        run: node /tmp/apply-sales-mvp.mjs

      - name: Commit feature implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Forge Sales Patch'
          git config user.email 'forge-sales-patch@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(sales): apply multi-UOM price and availability'
          git push origin HEAD:feat/sales-complete-20260731
