name: Temp UI Alumdoor Mobile Sales Debt

on:
  push:
    branches:
      - ui/alumdoor-mobile-sales-debt-20260803
    paths:
      - ".github/workflows/tmp-ui-alumdoor-mobile-sales-debt.yml"
      - ".github/tmp/patch-mobile-sales.py"

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/alumdoor-mobile-sales-debt-20260803
          fetch-depth: 0

      - name: Mark started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -nc --arg state pending --arg context "ui-mobile-sales" --arg description "validation started" '{state:$state,context:$context,description:$description}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply UI patch
        run: python .github/tmp/patch-mobile-sales.py

      - name: Build runtime and mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm --filter runtime... run build
          a=$?
          if [ $a -eq 0 ]; then pnpm --dir client/apps/kho exec tsc -p ../warehouse-mobile/tsconfig.json; a=$?; fi
          if [ $a -eq 0 ]; then pnpm --dir client/apps/kho exec vite build --config vite.mobile.config.ts; a=$?; fi
          if [ $a -ne 0 ]; then
            payload=$(jq -nc --arg state failure --arg context "ui-mobile-sales" --arg description "runtime/mobile build failed" '{state:$state,context:$context,description:$description}')
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null || true
            exit $a
          fi

      - name: Commit clean UI diff
        run: |
          rm .github/workflows/tmp-ui-alumdoor-mobile-sales-debt.yml .github/tmp/patch-mobile-sales.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client/apps/warehouse-mobile/src/main.tsx client/apps/warehouse-mobile/src/SalesMobileScreens.tsx client/packages/shell/src/app-mode/MobileShell.tsx .github/workflows/tmp-ui-alumdoor-mobile-sales-debt.yml .github/tmp/patch-mobile-sales.py
          git commit -m "feat(ui): refocus Alumdoor mobile on sales receivables"
          git push origin HEAD:ui/alumdoor-mobile-sales-debt-20260803

      - name: Mark clean head successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          payload=$(jq -nc --arg state success --arg context "ui-alumdoor-mobile-sales-debt" --arg description "runtime + mobile build passed; client-only" '{state:$state,context:$context,description:$description}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${sha}" -d "$payload" >/dev/null
