name: Alumdoor Sales Order V2 Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - "client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx"
      - "client/packages/views/src/app/vertical/alumdoor/sales-order-v2/**"
      - "client/packages/views/tests/alumdoor-sales-order-v2-complete.test.mjs"
      - "client/packages/views/tests/sales-order-preview-coordinator.test.mjs"
      - ".github/workflows/alumdoor-sales-order-v2-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumdoor-sales-order-v2-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared client dependencies
        run: |
          pnpm --filter @metaforge/core run build
          pnpm --filter @metaforge/adapter-frappe run build
          pnpm --filter @metaforge/visual run build
          pnpm --filter @metaforge/charts run build
          pnpm --filter @metaforge/ui run build
          pnpm --filter @metaforge/controls run build
          pnpm --filter @metaforge/shell run build

      - name: Typecheck and emit shared views
        run: pnpm --filter @metaforge/views run typecheck

      - name: Sales Order V2 source contract
        run: node --test client/packages/views/tests/alumdoor-sales-order-v2-complete.test.mjs

      - name: Sales Order preview concurrency behavior
        run: node --test client/packages/views/tests/sales-order-preview-coordinator.test.mjs

      - name: Production runtime build
        run: pnpm --filter runtime run build
