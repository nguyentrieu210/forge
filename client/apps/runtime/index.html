<!doctype html>
<html lang="vi" data-forge-release="%VITE_FORGE_RELEASE_SHA%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Forge — nền tảng vận hành doanh nghiệp từ văn phòng đến hiện trường." />
    <meta name="forge-release" content="%VITE_FORGE_RELEASE_SHA%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link id="app-icon" rel="icon" href="/forge-mark.svg" type="image/svg+xml" />
    <link id="app-touch-icon" rel="apple-touch-icon" href="/forge-mark.svg" />
    <title>Forge</title>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        // App id đã NHỚ của lần đăng nhập trước. Script này chạy trước mọi module nên không có
        // manifest; dò theo tên miền thì chỉ đúng ở đúng một domain, và favicon là thứ người dùng
        // nhìn để tìm đúng tab giữa hàng chục tab khác.
        let remembered = null;
        try { remembered = localStorage.getItem("metaforge-app"); } catch { /* chế độ riêng tư */ }
        const alumdoor = remembered === "alumdoor"
          || ["alu.kairo.vn", "alumdoor.kairo.vn"].includes(location.hostname.toLowerCase())
          || params.get("alumdoor") === "1";
        if (!alumdoor) return;
        const logo = "/alumdoor/app-icon-192.png";
        // Có HAI thẻ theme-color (light/dark) kể từ khi bảng màu chuyển sang graphite — đặt cả hai
        // để thanh trình duyệt giữ đúng màu thương hiệu Alumdoor ở cả hai theme, như trước đây khi
        // chỉ có một thẻ không kèm media query.
        document.querySelectorAll('meta[name="theme-color"]').forEach((tag) => tag.setAttribute("content", "#f45b24"));
        document.getElementById("app-icon")?.setAttribute("href", logo);
        document.getElementById("app-touch-icon")?.setAttribute("href", logo);
        // Tên tab cũng là thương hiệu: người dùng tìm tab bằng CHỮ khi biểu tượng quá nhỏ.
        document.title = "Alumdoor";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Styles are a shared entry dependency, not a side effect of whichever runtime branch
      // wins below. Otherwise Vite may code-split the CSS behind the nested bootstrap import,
      // leaving the dialog fixture and public Website renderer unstyled in the production build.
      import "/src/styles.css";
      import "/src/master-data-index.css";
      const fixture = new URLSearchParams(window.location.search).has("dialog-wheel-fixture");
      if (fixture) import("/src/dialog-wheel-fixture-main.tsx");
      else import("/src/bootstrap.ts");
    </script>
    <!-- Glide Data Grid mounts every editable-cell overlay here. Keep this as the
         last body-level container so Link/Select/Number editors work in all grids. -->
    <div id="portal"></div>
  </body>
</html>
