<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff5a2a" />
    <meta name="application-name" content="Forge Kho" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Forge Kho" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/forge-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/forge-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var mode = localStorage.getItem("metaforge-theme") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          el.setAttribute("data-theme", dark ? "dark" : "light");
          var brand = localStorage.getItem("metaforge-brand");
          if (brand === "zinc") el.removeAttribute("data-brand");
          else el.setAttribute("data-brand", brand === "warm" ? "warm" : "blue");
        } catch (e) {
          /* localStorage có thể bị chặn trong chế độ riêng tư. */
        }
      })();
    </script>
    <title>Forge Kho</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
