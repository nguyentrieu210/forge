# Forge Sentrux architecture guardrails.
# Keep this file baseline-safe: only tighten a rule after current main passes it.
# SENTRUX_MAP.md is the human/agent ownership map; this file is machine-enforced policy.

[constraints]
# Exact-main baseline after PR #939: Quality 5188 (signal 0.5188).
# Keep a narrow baseline-safe floor; raise it only after exact-main evidence improves.
min_quality = 0.518

# Client -> server currently has four known legacy edges (one runtime catalog import and
# three parity-test imports). That debt is surfaced by strict CI diagnostics but is not
# a blocking boundary until the runtime/shared-contract seam is cleaned deliberately.

[[boundaries]]
from = "server/packages/**/*"
to = "client/**/*"
reason = "Server platform/domain packages must not depend on React/client runtime implementation"

[[boundaries]]
from = "server/packages/**/*"
to = "apps/alumdoor/**/*"
reason = "Shared server authority must not depend on the Alumdoor vertical implementation"
