# Minimal DISPOSABLE oracle stack for Gate 2E S4/S5 (see provision_oracle_bench.sh).
# Synthetic credentials only; never point this at a production database.
services:
  db:
    image: mariadb:10.6
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake"]
    environment:
      MARIADB_ROOT_PASSWORD: "123"
    volumes:
      - oracle-db:/var/lib/mysql
  redis:
    image: redis:7-alpine
  backend:
    image: "${IMAGE}"
    depends_on: [db, redis]
    command: ["bench", "serve", "--port", "8000"]
    environment:
      DB_HOST: db
      REDIS_CACHE: "redis://redis:6379"
      REDIS_QUEUE: "redis://redis:6379"
    volumes:
      - oracle-sites:/home/frappe/frappe-bench/sites
    ports:
      - "8000:8000"
volumes:
  oracle-db:
  oracle-sites:
