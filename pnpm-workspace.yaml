packages:
  # --- Backend: Cloudflare-native kernel (nguồn: CloudForge v1.0.0) ---
  - "server"
  - "server/apps/*"
  - "server/packages/*"
  # --- Frontend: meta-driven Desk + builder (nguồn: MetaForge v1.0.0-rc.1) ---
  - "client"
  - "client/packages/*"
  - "client/apps/*"
  # Warehouse mobile là bundle riêng do package client/apps/kho build; không tạo importer pnpm thứ hai.
  - "!client/apps/warehouse-mobile"
  - "client/e2e-factory"
  - "client/e2e-forge"
